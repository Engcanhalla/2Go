<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고2 Lv.14</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}
  /* 첫글자 프리필 인풋 — 미리 채워진 첫 글자를 시각적으로 강조 */
  .prefill-input{caret-color:#fef3c7;font-family:'Courier New',ui-monospace,monospace;letter-spacing:.05em;font-weight:700;}
  .prefill-hint{color:#c4b5fd;font-size:.82rem;font-weight:500;margin-left:6px;letter-spacing:0;}
  /* ---------- 낱말박스 (자동완성 방어) ---------- */
  .word-answer{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;margin:6px 0;}
  .word-answer.inline{display:inline-flex;gap:8px;vertical-align:middle;margin:0 4px;}
  .word-group{
    display:inline-flex;align-items:center;gap:0;
    background:rgba(11,18,32,.7);border:1.5px solid #334155;border-radius:8px;
    padding:0;transition:all .15s;overflow:hidden;flex-shrink:0;
  }
  .word-group:focus-within{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(168,139,250,.22);}
  .word-group.correct{border-color:var(--grade);background:rgba(16,185,129,.10);}
  .word-group.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);}
  /* 폰트: body 상속 sans-serif (이전 .input-box input과 동일한 스타일) */
  .first-letter{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;padding:0 8px;height:44px;line-height:44px;
    background:linear-gradient(180deg,#3b2966 0%,#2a1e4d 100%);
    color:#fef3c7;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    border-right:1px solid #8b5cf6;user-select:none;
  }
  .rest-input{
    border:0;background:transparent;color:var(--text);outline:none;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    padding:0 10px;height:44px;line-height:44px;width:120px;min-width:90px;
    text-transform:lowercase;
  }
  .rest-input::placeholder{color:#475569;font-weight:400;}
  .word-group.correct .rest-input{color:#a7f3d0;}
  .word-group.wrong .rest-input{color:#fca5a5;}
  .cloze-sentence .word-answer{display:inline-flex;flex-wrap:wrap;gap:6px 8px;margin:0 4px;vertical-align:middle;}
  .cloze-sentence .word-group{border-radius:6px;}
  .cloze-sentence .first-letter{height:38px;line-height:38px;font-size:1.05rem;min-width:22px;padding:0 7px;}
  .cloze-sentence .rest-input{height:38px;line-height:38px;font-size:1.05rem;width:100px;min-width:70px;padding:0 9px;}
  /* .input-box input 스타일이 .rest-input을 override 하는 문제 해결 */
  .input-box .word-answer input.rest-input{
    background:transparent;border:0;padding:0 10px;
    min-height:44px;height:44px;line-height:44px;text-align:left;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    width:120px;min-width:90px;box-shadow:none;
  }
  .input-box .word-answer input.rest-input:focus{border:0;box-shadow:none;}
  /* single-letter 그룹 */
  .word-group.single-letter{background:rgba(11,18,32,.5);}
  .word-group.single-letter input.rest-input{width:80px;min-width:60px;}
  .hint-line{margin-top:12px;padding:10px 14px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35);border-radius:10px;color:#c4b5fd;font-size:.95rem;line-height:1.55;text-align:center;letter-spacing:.03em;}
  .hint-line b{color:#fef3c7;font-weight:800;font-family:'Courier New',ui-monospace,monospace;font-size:1.05rem;letter-spacing:.15em;margin:0 2px;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}
  .buddy-item .why{font-size:.86rem;color:var(--back-muted);opacity:1;display:block;width:100%;margin-top:3px;font-style:italic;}
  .ex-line{font-size:1.03rem;line-height:1.55;}
  .ex-line .en{color:#f8fafc;font-style:italic;font-weight:500;}
  .ex-line .ko{color:var(--back-muted-strong);font-size:.94rem;display:block;margin-top:4px;font-weight:500;}
  /* 콜로케이션·예문 재생 버튼 */
  .speak-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;flex:0 0 26px;
    padding:0;margin-right:8px;
    border:1px solid rgba(59,130,246,.35);
    background:rgba(59,130,246,.10);
    color:var(--info);
    font-size:.78rem;line-height:1;
    border-radius:8px;cursor:pointer;
    transition:var(--transition);
  }
  .speak-btn:hover{
    background:rgba(59,130,246,.22);
    border-color:rgba(59,130,246,.55);
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(59,130,246,.20);
  }
  .speak-btn:active{transform:translateY(0);}
  .col-item .en, .ex-line .en{flex:1 1 auto;min-width:0;}
  .ex-line{display:flex;flex-wrap:wrap;align-items:baseline;}

  /* Grade buttons */
  .grade-row{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
    margin-top:14px;
  }
  .grade-btn{
    padding:15px 6px;border-radius:var(--radius-md);
    font-weight:700;font-size:.92rem;
    min-height:56px;
    border:1.5px solid transparent;
    transition:all var(--transition);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .grade-btn .ic{font-size:20px;line-height:1;}
  .grade-btn.prev{background:rgba(59,130,246,.14);color:#93c5fd;border-color:rgba(59,130,246,.35);}
  .grade-btn.home{background:rgba(245,158,11,.12);color:var(--accent-light);border-color:rgba(245,158,11,.30);}
  .grade-btn.next{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.40);}
  .grade-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
  .grade-btn.prev:hover{box-shadow:0 6px 16px rgba(59,130,246,.25);}
  .grade-btn.home:hover{box-shadow:0 6px 16px rgba(245,158,11,.20);}
  .grade-btn.next:hover{box-shadow:0 6px 16px rgba(16,185,129,.30);}
  .grade-btn:active{transform:translateY(0) scale(.97);}
  .grade-btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6);}
  .grade-btn:disabled:hover{transform:none;box-shadow:none;filter:grayscale(.6);}

  .flip-hint{
    text-align:center;color:var(--text-on-dark-muted);
    font-size:.72rem;margin-top:10px;opacity:.6;letter-spacing:.02em;
  }

  /* ---------- QUIZ ---------- */
  .quiz-stage{padding:12px 2px;flex:1;display:flex;flex-direction:column;}
  .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .quiz-num{
    background:var(--bg-card);padding:7px 14px;border-radius:100px;
    font-size:.82rem;font-weight:600;
    border:1px solid rgba(148,163,184,.15);
    color:var(--text-on-dark-muted);
  }
  .quiz-num b{color:var(--grade);font-weight:700;}
  .quiz-mode{
    background:rgba(245,158,11,.12);color:var(--accent-light);
    padding:6px 12px;border-radius:100px;
    font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.22);
  }
  .quiz-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:24px 20px;
    box-shadow:var(--shadow-lg);
    min-height:320px;display:flex;flex-direction:column;
  }
  .quiz-prompt{
    text-align:center;margin-bottom:20px;
  }
  .quiz-prompt .label{
    font-size:.68rem;color:var(--text-on-dark-muted);
    text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:10px;
  }
  .quiz-prompt .qword{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.2rem;font-weight:800;color:var(--text-on-dark);
    line-height:1.15;word-break:break-word;letter-spacing:-1px;
    text-shadow:0 0 24px rgba(16,185,129,.20);
  }
  .quiz-prompt .qkr{font-size:1.5rem;font-weight:700;color:var(--accent-light);line-height:1.3;}
  .quiz-prompt .qph{color:var(--text-on-dark-muted);font-size:.88rem;margin-top:6px;font-style:italic;}
  .quiz-prompt .lis-btn{
    margin:10px auto 0;display:flex;
    background:linear-gradient(135deg, var(--info) 0%, #2563eb 100%);
    color:#ffffff;font-weight:700;font-size:.95rem;
    padding:14px 24px;border-radius:var(--radius-md);align-items:center;gap:8px;
    box-shadow:0 6px 20px rgba(59,130,246,.35), inset 0 1px 0 rgba(255,255,255,.15);
    min-height:48px;transition:all var(--transition);
  }
  .quiz-prompt .lis-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(59,130,246,.42);}
  .quiz-prompt .lis-btn:active{transform:translateY(0) scale(.97);}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.12);
    border-radius:var(--radius-md);padding:14px 16px;
    text-align:left;font-size:.98rem;font-weight:600;color:var(--text-on-dark);
    transition:all var(--transition);
    display:flex;align-items:center;gap:12px;
    min-height:52px;line-height:1.3;
  }
  .choice:hover{background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.22);transform:translateY(-1px);}
  .choice .idx{
    flex-shrink:0;width:26px;height:26px;border-radius:var(--radius-sm);
    background:rgba(148,163,184,.14);color:var(--text-on-dark-muted);
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:700;
    transition:all var(--transition);
  }
  .choice:active{transform:scale(.98);}
  .choice.correct{background:rgba(16,185,129,.16);border-color:var(--grade);color:#a7f3d0;box-shadow:0 4px 16px rgba(16,185,129,.20);}
  .choice.correct .idx{background:var(--grade);color:#0f172a;}
  .choice.wrong{background:rgba(239,68,68,.14);border-color:var(--danger);color:#fca5a5;}
  .choice.wrong .idx{background:var(--danger);color:#fff;}
  .choice.dimmed{opacity:.4;}
  body.cb-mode .choice.correct::after{content:"✓";margin-left:auto;font-size:22px;font-weight:900;}
  body.cb-mode .choice.wrong::after{content:"✕";margin-left:auto;font-size:22px;font-weight:900;}

  .input-box{
    display:flex;flex-direction:column;gap:12px;margin-top:6px;
  }
  .input-box input{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.15);
    border-radius:var(--radius-md);padding:16px;
    color:var(--text-on-dark);font-size:1.15rem;font-weight:600;
    text-align:center;letter-spacing:.5px;
    min-height:52px;outline:none;
    transition:all var(--transition);
  }
  .input-box input:focus{border-color:var(--grade);box-shadow:0 0 0 4px rgba(16,185,129,.15);}
  .input-box input.correct{border-color:var(--grade);background:rgba(16,185,129,.10);color:#a7f3d0;}
  .input-box input.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);color:#fca5a5;}
  .submit-btn{
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1rem;
    padding:15px;border-radius:var(--radius-md);min-height:52px;
    box-shadow:0 6px 20px rgba(16,185,129,.30), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);
  }
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,185,129,.40);}
  .submit-btn:active{transform:translateY(0) scale(.98);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .feedback{
    text-align:center;margin-top:16px;
    min-height:24px;font-weight:700;font-size:.92rem;
    letter-spacing:.02em;
  }
  .feedback.ok{color:#6ee7b7;}
  .feedback.bad{color:#fca5a5;}

  /* ---------- RESULT ---------- */
  .result{text-align:center;padding:20px 4px;}
  .result h2{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2rem;margin:10px 0 6px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg, var(--accent) 0%, var(--grade) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .result .score-big{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:4rem;font-weight:900;line-height:1;
    margin:20px 0 6px;color:var(--grade);letter-spacing:-2px;
    text-shadow:0 0 40px var(--grade-glow-strong);
  }
  .result .score-pct{color:var(--text-on-dark-muted);font-size:1.1rem;font-weight:600;}
  .result .score-time{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:10px;padding:8px 16px;border-radius:var(--radius-lg);
    background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.20);
    color:#f8fafc;font-size:1.05rem;font-weight:600;letter-spacing:.02em;
  }
  .result .score-time b{color:var(--accent-light);font-weight:800;font-variant-numeric:tabular-nums;}
  /* 심화 90%+ 배곧 쵝오 배너 */
  .grand-banner{
    position:relative;margin:14px auto 4px;padding:16px 22px;max-width:520px;
    border-radius:var(--radius-lg);
    background:linear-gradient(135deg,#7c3aed 0%,#db2777 45%,#f59e0b 100%);
    box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;
    text-align:center;overflow:hidden;
    animation:grandPop .8s cubic-bezier(.2,.7,.1,1.4) both, grandGlow 2s ease-in-out infinite alternate;
  }
  .grand-banner::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 50%),
               radial-gradient(circle at 70% 80%, rgba(255,255,255,.25), transparent 50%);
    pointer-events:none;
  }
  .grand-banner .grand-line{
    font-size:1.65rem;font-weight:900;color:#fff;letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.35);position:relative;
  }
  .grand-banner .grand-line b{
    background:linear-gradient(135deg,#fde68a 0%,#fbbf24 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;padding:0 4px;
  }
  .grand-banner .grand-sub{
    margin-top:6px;color:rgba(255,255,255,.95);
    font-size:.98rem;font-weight:700;letter-spacing:.02em;position:relative;
  }
  @keyframes grandPop{
    0%{transform:scale(.7) rotate(-3deg);opacity:0;}
    60%{transform:scale(1.06) rotate(1deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes grandGlow{
    from{box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;}
    to  {box-shadow:0 20px 60px rgba(245,158,11,.65),0 0 0 1px rgba(255,255,255,.35) inset;}
  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:hgFadeIn .35s ease-out both, hgFadeOut .8s ease-in 5.2s forwards;
  }
  .hg-celebration::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),
      radial-gradient(circle at 80% 25%, rgba(236,72,153,.28), transparent 22%),
      radial-gradient(circle at 30% 75%, rgba(59,130,246,.28), transparent 24%),
      radial-gradient(circle at 75% 80%, rgba(16,185,129,.28), transparent 22%);
    animation:hgSwirl 6s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .hg-halo{
    position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg,#fbbf24,#ef4444,#a855f7,#3b82f6,#10b981,#fbbf24);
    mix-blend-mode:screen;opacity:.28;
    animation:hgRotate 12s linear infinite;
  }
  .hg-msg{
    position:relative;font-family:inherit;
    font-size:clamp(28px, 6vw, 68px);font-weight:900;line-height:1.25;text-align:center;
    padding:32px 40px;max-width:92vw;letter-spacing:-.01em;
    background:linear-gradient(90deg,#fbbf24,#ef4444,#ec4899,#a855f7,#3b82f6,#10b981,#fbbf24);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(251,191,36,.75)) drop-shadow(0 0 40px rgba(236,72,153,.45));
    animation:hgRainbow 3.5s linear infinite, hgPop 1.6s cubic-bezier(.2,.7,.1,1.4) both, hgFloat 4s ease-in-out infinite alternate 1.6s;
  }
  .hg-sparkle{
    position:absolute;pointer-events:none;font-size:clamp(24px,3vw,36px);
    animation:hgSparkle 1.8s ease-in-out infinite;
  }
  @keyframes hgFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes hgFadeOut{to{opacity:0;visibility:hidden;}}
  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  @keyframes hgPop{
    0%{transform:scale(.15) rotate(-25deg);opacity:0;}
    35%{transform:scale(1.28) rotate(6deg);opacity:1;}
    55%{transform:scale(.94) rotate(-3deg);}
    75%{transform:scale(1.08) rotate(1.5deg);}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes hgFloat{
    from{transform:translateY(-6px) scale(1);}
    to{transform:translateY(6px) scale(1.02);}
  }
  @keyframes hgSwirl{
    0%{transform:scale(1) rotate(0);}
    100%{transform:scale(1.15) rotate(8deg);}
  }
  @keyframes hgRotate{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes hgSparkle{
    0%,100%{opacity:0;transform:scale(.4) rotate(0deg);}
    50%{opacity:1;transform:scale(1.2) rotate(180deg);}
  }
  .result-stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:22px 0;
  }
  .result-stat{
    background:var(--bg-card);padding:16px 12px;border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.10);
    box-shadow:var(--shadow-md);
    transition:transform var(--transition);
  }
  .result-stat:hover{transform:translateY(-2px);}
  .result-stat .l{font-size:.68rem;color:var(--text-on-dark-muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;}
  .result-stat .v{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.4rem;font-weight:800;color:var(--text-on-dark);margin-top:6px;}
  .result-stat .v.grade-c{color:var(--grade);}
  .result-stat .v.acc-c{color:var(--accent-light);}
  .badges-earned{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 20px;
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-card);padding:8px 14px;border-radius:100px;
    font-size:.82rem;font-weight:700;
    border:1px solid var(--accent);color:var(--accent-light);
    box-shadow:0 0 16px rgba(245,158,11,.22), 0 4px 12px rgba(0,0,0,.3);
    animation:badge-pop .5s cubic-bezier(.2,.7,.1,1.4) backwards;
  }
  .badge .ic{font-size:1.1rem;}
  @keyframes badge-pop{from{transform:scale(.4) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ---------- ANIMATIONS ---------- */
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  @keyframes bounce-correct{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .shake{animation:shake .22s ease;}
  .bounce-correct{animation:bounce-correct .32s ease;}

  /* ---------- CANVAS (particles) ---------- */
  #fxCanvas{
    position:fixed;inset:0;pointer-events:none;z-index:50;
  }

  /* ---------- TOAST ---------- */
  .toast-wrap{
    position:fixed;top:88px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;z-index:40;
  }
  .toast{
    background:rgba(15,23,42,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--accent-light);
    padding:10px 18px;border-radius:100px;font-weight:700;font-size:.86rem;
    letter-spacing:.02em;
    border:1px solid rgba(245,158,11,.35);
    box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 20px rgba(245,158,11,.15);
    animation:toast-in .3s cubic-bezier(.4,0,.2,1), toast-out .45s cubic-bezier(.4,0,.2,1) 1.4s forwards;
  }
  .toast.streak{color:var(--accent-light);}
  .toast.big{font-size:1.05rem;padding:14px 24px;border-color:rgba(16,185,129,.4);color:#a7f3d0;box-shadow:0 12px 32px rgba(0,0,0,.5), 0 0 24px rgba(16,185,129,.2);}

    {"id":"w01895","w":"drift","pos":["v","n"],"ph":"/drɪft/","cefr":"B2","kr":["표류하다","흘러가다"],"ex":[{"en":"The boat drifted out to sea.","ko":"배가 바다로 표류했다."}],"mnemonic":{"soundHint":"'드리프트' → 자동차 드리프트, 미끄러지듯 표류","story":"빈 보트가 파도 위에서 '드리프트'하며 바다로 떠내려가는 장면.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"float","ko":"떠다니다","reason":"동의어 — 떠서 흐름"},{"w":"wander","ko":"떠돌다","reason":"동의어 — 정처없이"},{"w":"anchor","ko":"정박하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"drift out to sea","ko":"바다로 표류하다"},{"en":"drift apart","ko":"서로 멀어지다"}]},"nuance":{"koSimple":"물이나 바람에 실려 떠다니듯 움직인다는 뜻이다.","whenToUse":"목적 없이 이동하거나 마음이 흘러갈 때 쓴다."},"krDetail":[{"ko":"표류하다","explain":"물 위를 떠서 흐르다"},{"ko":"흘러가다","explain":"천천히 이동해 가다"}],"usageExamples":[{"en":"The clouds drifted slowly across the evening sky.","ko":"구름이 저녁 하늘을 가로질러 천천히 흘러갔다."},{"en":"Over the years, the two friends gradually drifted apart.","ko":"세월이 흐르며 두 친구는 점점 멀어졌다."}],"grammarNote":"'drift apart'는 '사이가 멀어지다', 'drift off'는 '잠들다'라는 뜻의 자주 쓰이는 구동사다.","grammarQuiz":[{"sentence":"The boat _____ (drift) at sea for three days before being rescued.","ko":"그 배는 구조되기 전 3일간 바다에서 표류해 왔었다.","answer":"had drifted","hint":"과거완료"}]},
    {"id":"w01898","w":"drip","pos":["v","n"],"ph":"/drɪp/","cefr":"B2","kr":["물방울이 떨어지다","방울"],"ex":[{"en":"Water dripped from the leaking pipe.","ko":"새는 파이프에서 물이 떨어졌다."}],"mnemonic":{"soundHint":"'드립' → 커피 드립, 방울방울 떨어지다","story":"천장에서 물이 '드립드립' 방울져 대야에 떨어지는 소리.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"trickle","ko":"똑똑 흐르다","reason":"동의어 — 조금씩"},{"w":"drop","ko":"방울","reason":"동의어 — 물방울"},{"w":"gush","ko":"쏟아지다","reason":"반의어 — 세차게"}],"collocBest":[{"en":"drip from the faucet","ko":"수도꼭지에서 물방울이 떨어지다"},{"en":"a steady drip","ko":"꾸준한 물방울"}]},"nuance":{"koSimple":"액체가 방울지어 똑똑 떨어진다는 뜻이다.","whenToUse":"수도꼭지·비·땀이 방울로 떨어질 때 쓴다."},"krDetail":[{"ko":"물방울이 떨어지다","explain":"액체가 방울로 떨어지다"},{"ko":"방울","explain":"떨어지는 작은 액체"}],"usageExamples":[{"en":"Rain began to drip through a crack in the ceiling.","ko":"빗물이 천장 틈새로 방울방울 떨어지기 시작했다."},{"en":"She wiped away a drip of paint from the wall.","ko":"그녀는 벽에 흐른 페인트 한 방울을 닦아냈다."}],"grammarNote":"'drip'은 자동사로 '(물이) 떨어지다'뿐 아니라 'drip with(~로 흠뻑 젖다)' 형태로도 쓰인다. 유사어 'drop'과 구별해 두자.","grammarQuiz":[{"sentence":"Water _____ (keep) dripping from the ceiling for hours.","ko":"물이 몇 시간 동안 천장에서 계속 떨어졌다.","answer":"kept","hint":"동명사 (keep + -ing)"}]},

    {"id":"w01907","w":"dual","pos":["adj"],"ph":"/ˈdjuːəl/","cefr":"B2","kr":["이중의","두 가지의"],"ex":[{"en":"She has dual citizenship.","ko":"그녀는 이중 국적을 보유하고 있다."}],"mnemonic":{"soundHint":"'듀얼' → 듀얼 모니터, 듀얼 심 = 이중의","story":"게임 '듀얼' 모드처럼 두 가지 국적을 지닌 이중 시민.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"double","ko":"두 배의","reason":"동의어 — 이중"},{"w":"twofold","ko":"이중의","reason":"동의어 — 두 겹"},{"w":"single","ko":"단일의","reason":"반의어 — 정반대"}],"collocBest":[{"en":"dual citizenship","ko":"이중 국적"},{"en":"a dual role","ko":"두 가지 역할"}]},"nuance":{"koSimple":"두 가지 성질이나 기능을 함께 지님을 뜻한다.","whenToUse":"이중 국적·이중 목적 등 두 요소가 겹칠 때 쓴다."},"krDetail":[{"ko":"이중의","explain":"두 개로 이루어진"},{"ko":"두 가지의","explain":"두 종류를 가진"}],"usageExamples":[{"en":"This device serves a dual purpose as a phone and a camera.","ko":"이 기기는 전화기와 카메라라는 이중의 용도로 쓰인다."},{"en":"The new highway has a dual carriageway in each direction.","ko":"그 새 고속도로는 각 방향에 이중 차도를 갖추고 있다."}],"grammarNote":"'dual'은 '이중의'라는 형용사로, 발음이 같은 'duel(결투)'과 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"The system has dual functions _____ (allow) users to save time.","ko":"그 시스템은 사용자가 시간을 절약하도록 해주는 이중 기능이 있다.","answer":"allowing","hint":"분사구문 (현재분사)"}]},
    {"id":"w01909","w":"dubious","pos":["adj"],"ph":"/ˈdjuːbiəs/","cefr":"B2","kr":["의심스러운","미심쩍은"],"ex":[{"en":"I was dubious about his intentions.","ko":"나는 그의 의도가 의심스러웠다."}],"mnemonic":{"soundHint":"'듀비어스' → doubt(의심)의 형용사 느낌 = 의심스러운","story":"낯선 사람의 '듀비어스'한 웃음에 지갑을 꽉 쥐는 장면.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"doubtful","ko":"의심스러운","reason":"동의어 — 미심쩍음"},{"w":"questionable","ko":"미심쩍은","reason":"동의어 — 의문의"},{"w":"certain","ko":"확실한","reason":"반의어 — 정반대"}],"collocBest":[{"en":"a dubious claim","ko":"의심스러운 주장"},{"en":"dubious about his motives","ko":"그의 동기에 대해 미심쩍은"}]},"nuance":{"koSimple":"믿기 어려워 의심스럽고 미심쩍다는 뜻이다.","whenToUse":"의도·주장·성과의 신뢰성을 의심할 때 쓴다."},"krDetail":[{"ko":"의심스러운","explain":"믿기 어려운"},{"ko":"미심쩍은","explain":"확신이 안 서는"}],"usageExamples":[{"en":"The report was based on some highly dubious statistics.","ko":"그 보고서는 매우 의심스러운 통계에 근거하고 있었다."},{"en":"She remained dubious about the safety of the plan.","ko":"그녀는 그 계획의 안전성에 대해 여전히 미심쩍어했다."}],"grammarNote":"사람이 주어일 때는 'be dubious about(~을 미심쩍어하다)' 형태로 쓴다. 사물을 수식하면 '의심스러운, 수상한'의 뜻이 된다.","grammarQuiz":[{"sentence":"The document, _____ authenticity was dubious, was rejected.","ko":"진위가 의심스러운 그 문서는 거절되었다.","answer":"whose","hint":"관계대명사 (소유격)"}]},
    {"id":"w01915","w":"duplicate","pos":["v","n","adj"],"ph":"/ˈdjuːplɪkeɪt/","cefr":"B2","kr":["복사하다","복사본"],"ex":[{"en":"Please duplicate this document.","ko":"이 문서를 복사해 주세요."}],"mnemonic":{"soundHint":"'듀플리케이트' → duo(둘) + plicate(접다) = 둘로 복제","story":"복사기가 서류를 착착 '듀플리케이트'하는 사무실 장면.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"copy","ko":"복사하다","reason":"동의어 — 사본"},{"w":"replicate","ko":"복제하다","reason":"동의어 — 격식체"},{"w":"original","ko":"원본","reason":"반의어 — 정반대"}],"collocBest":[{"en":"a duplicate copy","ko":"복사본"},{"en":"duplicate the document","ko":"문서를 복사하다"}]},"nuance":{"koSimple":"똑같은 것을 그대로 복제하거나 그 사본을 뜻한다.","whenToUse":"문서·열쇠·데이터의 사본을 만들거나 가리킬 때 쓴다."},"krDetail":[{"ko":"복사하다","explain":"똑같이 하나 더 만들다"},{"ko":"복사본","explain":"똑같이 만든 사본"}],"usageExamples":[{"en":"Please duplicate these files and save them on the server.","ko":"이 파일들을 복사해서 서버에 저장해 주세요."},{"en":"Keep the original and give me the duplicate.","ko":"원본은 보관하고 복사본을 저에게 주세요."}],"grammarNote":"'duplicate'는 동사일 때 [-keit], 명사·형용사일 때 [-kət]으로 발음이 달라진다. 명사로 'a duplicate of ~' 형태를 쓴다.","grammarQuiz":[{"sentence":"The documents _____ (duplicate) before being sent to the office.","ko":"그 문서들은 사무실로 보내지기 전에 복사되었다.","answer":"were duplicated","hint":"수동태 (과거)"}]},
    {"id":"w01916","w":"durable","pos":["adj"],"ph":"/ˈdjʊərəbl/","cefr":"B2","kr":["내구성 있는","오래가는"],"ex":[{"en":"This material is very durable.","ko":"이 소재는 매우 내구성이 있다."}],"mnemonic":{"soundHint":"'듀러블' → duration(지속) + able = 오래가는","story":"10년 넘게 쓸 수 있는 '듀러블'한 등산 배낭.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"sturdy","ko":"튼튼한","reason":"동의어 — 견고함"},{"w":"long-lasting","ko":"오래가는","reason":"동의어 — 지속성"},{"w":"fragile","ko":"부서지기 쉬운","reason":"반의어 — 정반대"}],"collocBest":[{"en":"durable material","ko":"내구성 있는 소재"},{"en":"a durable product","ko":"오래가는 제품"}]},"nuance":{"koSimple":"쉽게 망가지지 않고 오래가는 견고함을 뜻한다.","whenToUse":"재료·제품의 내구성을 강조할 때 쓴다."},"krDetail":[{"ko":"내구성 있는","explain":"잘 망가지지 않는"},{"ko":"오래가는","explain":"오랫동안 쓸 수 있는"}],"usageExamples":[{"en":"These boots are durable enough for years of daily use.","ko":"이 부츠는 수년간 매일 신어도 될 만큼 내구성이 있다."},{"en":"The company is known for making durable kitchen tools.","ko":"그 회사는 오래가는 주방 도구를 만드는 것으로 유명하다."}],"grammarNote":"'durable'은 '내구성 있는'이라는 형용사이며 'durable goods(내구재)'라는 경제 용어로도 자주 쓰인다. 명사형은 'durability'다.","grammarQuiz":[{"sentence":"The company _____ (produce) durable products for over 50 years.","ko":"그 회사는 50년 넘게 내구성 있는 제품을 생산해 왔다.","answer":"has produced","hint":"현재완료"}]},
    {"id":"w01917","w":"duration","pos":["n"],"ph":"/djʊˈreɪʃən/","cefr":"B2","kr":["기간","지속 시간"],"ex":[{"en":"The duration of the flight is three hours.","ko":"비행 시간은 3시간이다."}],"mnemonic":{"soundHint":"'듀레이션' → durable(오래가는)에서 → 지속 시간","story":"비행 '듀레이션 3시간' 안내 방송이 나오는 기내.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"period","ko":"기간","reason":"동의어 — 시간 범위"},{"w":"span","ko":"지속 기간","reason":"동의어 — 걸치는 시간"},{"w":"length","ko":"길이","reason":"관련어 — 시간 길이"}],"collocBest":[{"en":"for the duration of the trip","ko":"여행 기간 동안"},{"en":"a short duration","ko":"짧은 지속 시간"}]},"nuance":{"koSimple":"어떤 일이 지속되는 시간의 길이를 뜻한다.","whenToUse":"수업·비행·계약의 지속 기간을 말할 때 쓴다."},"krDetail":[{"ko":"기간","explain":"일이 이어지는 동안"},{"ko":"지속 시간","explain":"계속되는 시간의 길이"}],"usageExamples":[{"en":"Please remain seated for the duration of the flight.","ko":"비행이 지속되는 동안 자리에 앉아 계세요."},{"en":"The duration of the treatment depends on the patient.","ko":"치료의 지속 시간은 환자에 따라 다르다."}],"grammarNote":"'for the duration of ~'는 '~하는 동안 내내'라는 뜻의 관용 표현이다. 동사 'endure'와 어원이 같다.","grammarQuiz":[{"sentence":"It is the duration of the treatment _____ matters most.","ko":"가장 중요한 것은 바로 치료의 지속 시간이다.","answer":"that","hint":"It ~ that 강조구문"}]},
    {"id":"w01921","w":"dwarf","pos":["n","v","adj"],"ph":"/dwɔːrf/","cefr":"B2","kr":["난쟁이","왜소하게 만들다"],"ex":[{"en":"The tower dwarfs the surrounding buildings.","ko":"그 탑은 주변 건물들을 왜소하게 만든다."}],"mnemonic":{"soundHint":"'드워프' → 반지의 제왕 드워프족 = 난쟁이","story":"판타지 영화 속 '드워프'가 거대한 탑 옆에 서서 왜소해 보이는 장면.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"midget","ko":"난쟁이","reason":"동의어 — 아주 작음"},{"w":"overshadow","ko":"압도하다","reason":"동의어 — 왜소하게 함"},{"w":"giant","ko":"거인","reason":"반의어 — 정반대"}],"collocBest":[{"en":"dwarf the buildings","ko":"건물들을 왜소하게 만들다"},{"en":"a dwarf star","ko":"왜소한 별"}]},"nuance":{"koSimple":"몸집이 매우 작은 존재, 또는 왜소하게 만든다는 뜻이다.","whenToUse":"난쟁이를 지칭하거나 크기·규모를 압도할 때 쓴다."},"krDetail":[{"ko":"난쟁이","explain":"키가 아주 작은 사람"},{"ko":"왜소하게 만들다","explain":"작아 보이게 만들다"}],"usageExamples":[{"en":"The new skyscraper dwarfs every building around it.","ko":"그 새 마천루는 주변의 모든 건물을 왜소해 보이게 한다."},{"en":"In the fairy tale, a kind dwarf helped the lost child.","ko":"그 동화에서 친절한 난쟁이가 길 잃은 아이를 도왔다."}],"grammarNote":"동사 'dwarf A'는 'A를 작아 보이게 하다', 즉 규모 차이를 강조할 때 자주 쓴다. 복수형은 'dwarfs' 또는 'dwarves' 둘 다 가능하다.","grammarQuiz":[{"sentence":"The new tower makes the old buildings _____ (look) small.","ko":"새 탑은 오래된 건물들을 작아 보이게 만든다.","answer":"look","hint":"5형식 (make + 목적어 + 동사원형)"}]},
    {"id":"w01922","w":"dwell","pos":["v"],"ph":"/dwel/","cefr":"B2","kr":["살다","~에 집착하다"],"ex":[{"en":"She dwells on the past too much.","ko":"그녀는 과거에 너무 집착한다."}],"mnemonic":{"soundHint":"'드웰' → '들었지(dwell) 그 집에서' = 살다","story":"과거 이별에만 '드웰'하며 앞으로 나아가지 못하는 사람.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"reside","ko":"거주하다","reason":"동의어 — 격식체"},{"w":"inhabit","ko":"살다","reason":"동의어 — 서식"},{"w":"linger","ko":"머무르다","reason":"관련어 — 집착함"}],"collocBest":[{"en":"dwell on the past","ko":"과거에 집착하다"},{"en":"dwell in the countryside","ko":"시골에 살다"}]},"nuance":{"koSimple":"어딘가에 거주하거나 어떤 생각에 오래 머문다는 뜻이다.","whenToUse":"장소에 살거나 과거·문제에 집착할 때 쓴다."},"krDetail":[{"ko":"살다","explain":"어떤 곳에 거주하다"},{"ko":"~에 집착하다","explain":"한 가지만 계속 생각하다"}],"usageExamples":[{"en":"Many rare species dwell deep within the rainforest.","ko":"많은 희귀종이 열대우림 깊숙한 곳에 산다."},{"en":"Try not to dwell on your past mistakes too much.","ko":"지난 실수에 너무 집착하지 않으려고 해봐."}],"grammarNote":"'dwell on/upon ~'은 '~을 곱씹다, ~에 집착하다'라는 뜻이다. '살다'의 의미로는 문어체이며 일상에서는 'live'가 더 흔하다.","grammarQuiz":[{"sentence":"She kept _____ (dwell) on her past mistakes.","ko":"그녀는 계속해서 과거의 실수에 집착했다.","answer":"dwelling","hint":"동명사 (keep + -ing)"}]},
    {"id":"w01925","w":"dynamic","pos":["adj","n"],"ph":"/daɪˈnæmɪk/","cefr":"B2","kr":["역동적인","역학"],"ex":[{"en":"She has a very dynamic personality.","ko":"그녀는 매우 역동적인 성격을 지니고 있다."}],"mnemonic":{"soundHint":"'다이나믹' → 다이너마이트처럼 폭발적 = 역동적인","story":"다이너마이트처럼 폭발적으로 무대를 휘어잡는 '다이나믹' 댄서.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"energetic","ko":"활기찬","reason":"동의어 — 에너지 넘침"},{"w":"lively","ko":"활발한","reason":"동의어 — 생기 있음"},{"w":"static","ko":"정적인","reason":"반의어 — 정반대"}],"collocBest":[{"en":"a dynamic personality","ko":"역동적인 성격"},{"en":"group dynamics","ko":"집단 역학"}]},"nuance":{"koSimple":"활기차고 힘차게 움직이는 역동적인 상태를 뜻한다.","whenToUse":"에너지 넘치는 사람·변화·과정을 묘사할 때 쓴다."},"krDetail":[{"ko":"역동적인","explain":"힘차고 활발한"},{"ko":"역학","explain":"힘의 작용을 다루는 학문"}],"usageExamples":[{"en":"The startup has a dynamic and fast-changing work culture.","ko":"그 스타트업은 역동적이고 빠르게 변하는 업무 문화를 지녔다."},{"en":"We need to understand the dynamics of the local market.","ko":"우리는 지역 시장의 역학을 이해할 필요가 있다."}],"grammarNote":"형용사 'dynamic'은 '역동적인'의 뜻이며, 명사로 '역학·역학 관계'를 뜻할 때는 주로 복수형 'dynamics'로 쓴다.","grammarQuiz":[{"sentence":"The team, _____ leader is very dynamic, always achieves great results.","ko":"리더가 매우 역동적인 그 팀은 항상 훌륭한 결과를 이룬다.","answer":"whose","hint":"관계대명사 (소유격)"}]},
    {"id":"w01927","w":"dynasty","pos":["n"],"ph":"/ˈdɪnəsti/","cefr":"B2","kr":["왕조","왕가"],"ex":[{"en":"The Ming dynasty lasted 276 years.","ko":"명나라 왕조는 276년간 지속되었다."}],"mnemonic":{"soundHint":"'다이너스티' → 다이너마이트 왕조 → 오래 이어진 왕조","story":"명나라 '다이너스티'가 276년간 이어진 대하드라마.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"lineage","ko":"혈통","reason":"동의어 — 가문 계보"},{"w":"kingdom","ko":"왕국","reason":"관련어 — 왕가 영역"},{"w":"reign","ko":"통치기","reason":"관련어 — 재위 기간"}],"collocBest":[{"en":"the Ming dynasty","ko":"명나라 왕조"},{"en":"found a dynasty","ko":"왕조를 세우다"}]},"nuance":{"koSimple":"같은 가문이 오랜 세월 이어간 왕조를 뜻한다.","whenToUse":"역사 속 왕조나 오래 지속된 지배 가문을 말할 때 쓴다."},"krDetail":[{"ko":"왕조","explain":"같은 가문의 왕들 시대"},{"ko":"왕가","explain":"대를 잇는 왕의 가문"}],"usageExamples":[{"en":"The Joseon dynasty ruled Korea for over five centuries.","ko":"조선 왕조는 5세기가 넘게 한국을 다스렸다."},{"en":"The family built a business dynasty spanning generations.","ko":"그 가문은 여러 세대에 걸친 사업 왕가를 세웠다."}],"grammarNote":"'dynasty'는 발음이 [ˈdaɪnəsti]이며, 형용사형은 'dynastic'이다. 비유적으로 '(스포츠·기업의) 강력한 세력'을 뜻하기도 한다.","grammarQuiz":[{"sentence":"The dynasty _____ (found) in the 13th century lasted 300 years.","ko":"13세기에 세워진 그 왕조는 300년간 지속되었다.","answer":"founded","hint":"과거분사 (수동)"}]},
    {"id":"w01928","w":"e-commerce","pos":["n"],"ph":"/ˈiːkɒmɜːrs/","cefr":"B2","kr":["전자상거래","온라인 상거래"],"ex":[{"en":"E-commerce grew rapidly last year.","ko":"작년에 전자상거래가 빠르게 성장했다."}],"mnemonic":{"soundHint":"'이커머스' → electronic + commerce = 전자상거래","story":"쿠팡·아마존 같은 '이커머스' 플랫폼에서 클릭 한 번에 결제.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"online shopping","ko":"온라인 쇼핑","reason":"관련어 — 인터넷 구매"},{"w":"retail","ko":"소매","reason":"관련어 — 판매업"},{"w":"marketplace","ko":"장터","reason":"관련어 — 거래 공간"}],"collocBest":[{"en":"an e-commerce platform","ko":"전자상거래 플랫폼"},{"en":"e-commerce sales","ko":"온라인 상거래 판매"}]},"nuance":{"koSimple":"인터넷을 통한 상품·서비스 거래를 뜻한다.","whenToUse":"온라인 쇼핑몰·인터넷 상거래 시장을 이야기할 때 쓴다."},"krDetail":[{"ko":"전자상거래","explain":"인터넷으로 하는 거래"},{"ko":"온라인 상거래","explain":"온라인 물건 사고팔기"}],"usageExamples":[{"en":"Their e-commerce platform now serves millions of customers.","ko":"그들의 전자상거래 플랫폼은 이제 수백만 고객을 상대한다."},{"en":"The pandemic accelerated the shift toward e-commerce.","ko":"팬데믹은 온라인 상거래로의 전환을 가속화했다."}],"grammarNote":"'e-commerce'는 'electronic commerce'의 축약형으로 불가산 명사처럼 쓰인다. 'e-mail, e-book'처럼 'e-'는 '전자의'를 뜻한다.","grammarQuiz":[{"sentence":"E-commerce _____ (grow) rapidly since the pandemic began.","ko":"전자상거래는 팬데믹이 시작된 이래 급속히 성장해 왔다.","answer":"has grown","hint":"현재완료"}]},
    {"id":"w01930","w":"eager","pos":["adj"],"ph":"/ˈiːɡər/","cefr":"B2","kr":["열망하는","간절한"],"ex":[{"en":"She was eager to learn.","ko":"그녀는 배우기를 열망했다."}],"mnemonic":{"soundHint":"'이거!' → '이거 주세요!' 손 들며 열망하는 아이","story":"새 장난감을 '이거!' 하며 초롱초롱 눈으로 조르는 아이.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"keen","ko":"열망하는","reason":"동의어 — 몹시 원함"},{"w":"enthusiastic","ko":"열정적인","reason":"동의어 — 의욕적"},{"w":"reluctant","ko":"꺼리는","reason":"반의어 — 정반대"}],"collocBest":[{"en":"eager to learn","ko":"배우고 싶어 하는"},{"en":"an eager student","ko":"열망하는 학생"}]},"nuance":{"koSimple":"무언가를 몹시 하고 싶어 하는 열망을 뜻한다.","whenToUse":"학습·시작·만남을 간절히 원할 때 쓴다."},"krDetail":[{"ko":"열망하는","explain":"몹시 하고 싶어 하는"},{"ko":"간절한","explain":"매우 바라는"}],"usageExamples":[{"en":"The children were eager to open their presents.","ko":"아이들은 선물을 열어보고 싶어 안달이었다."},{"en":"He is always eager for a chance to prove himself.","ko":"그는 늘 자신을 증명할 기회를 간절히 바란다."}],"grammarNote":"'be eager to+동사원형(~하기를 열망하다)'과 'be eager for+명사(~을 갈망하다)' 두 형태를 구분해 익혀야 한다.","grammarQuiz":[{"sentence":"She was eager _____ (learn) new languages.","ko":"그녀는 새로운 언어를 배우기를 열망했다.","answer":"to learn","hint":"to부정사 (부사적 용법)"}]},

    {"id":"w01985","w":"elastic","pos":["adj","n"],"ph":"/ɪˈlæstɪk/","cefr":"B2","kr":["탄성 있는","신축성 있는","고무줄"],"ex":[{"en":"The material is elastic and can stretch easily.","ko":"그 재료는 탄성이 있어서 쉽게 늘어난다."}],"mnemonic":{"soundHint":"'일래스틱' → 늘어나는 고무줄 = 탄성 있는","story":"'일래스틱' 밴드 허리춤이 쭉쭉 늘어나는 편안한 바지.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"stretchy","ko":"늘어나는","reason":"동의어 — 신축성"},{"w":"flexible","ko":"유연한","reason":"동의어 — 잘 휨"},{"w":"rigid","ko":"뻣뻣한","reason":"반의어 — 정반대"}],"collocBest":[{"en":"elastic material","ko":"신축성 있는 소재"},{"en":"an elastic band","ko":"고무줄"}]},"nuance":{"koSimple":"늘어났다가 원래대로 돌아오는 성질을 뜻한다.","whenToUse":"고무줄 등 신축성 있는 재료를 묘사할 때 쓴다."},"krDetail":[{"ko":"탄성 있는","explain":"늘었다 되돌아오는"},{"ko":"신축성 있는","explain":"잘 늘어나는"},{"ko":"고무줄","explain":"잘 늘어나는 줄"}],"usageExamples":[{"en":"The waistband is elastic, so it fits many sizes.","ko":"그 허리 밴드는 신축성이 있어서 여러 치수에 맞는다."},{"en":"She tied her hair back with a thin elastic.","ko":"그녀는 얇은 고무줄로 머리를 뒤로 묶었다."}],"grammarNote":"'elastic'은 형용사(탄성 있는)와 명사(고무줄, 고무 밴드)로 쓰인다. 명사형 'elasticity(탄력성)'도 함께 익혀 두자.","grammarQuiz":[{"sentence":"The elastic material allows the fabric _____ (stretch) easily.","ko":"탄성 있는 소재는 그 원단이 쉽게 늘어나도록 해준다.","answer":"to stretch","hint":"5형식 (allow + O + to부정사)"}]},
    {"id":"w01998","w":"elegant","pos":["adj"],"ph":"/ˈɛlɪɡənt/","cefr":"B2","kr":["우아한","품위 있는"],"ex":[{"en":"She wore an elegant dress.","ko":"그녀는 우아한 드레스를 입었다."}],"mnemonic":{"soundHint":"'엘레강트' → 우아한 프랑스풍 = 우아한","story":"'엘레강트'한 롱드레스로 파티장에 등장한 여배우.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"graceful","ko":"우아한","reason":"동의어 — 품위 있음"},{"w":"refined","ko":"세련된","reason":"동의어 — 고상함"},{"w":"clumsy","ko":"어색한","reason":"반의어 — 정반대"}],"collocBest":[{"en":"an elegant dress","ko":"우아한 드레스"},{"en":"an elegant solution","ko":"품위 있는 해결책"}]},"nuance":{"koSimple":"단정하면서 세련된 우아함을 뜻한다.","whenToUse":"옷차림·해법·디자인의 품격을 칭찬할 때 쓴다."},"krDetail":[{"ko":"우아한","explain":"고급스럽고 아름다운"},{"ko":"품위 있는","explain":"격조가 느껴지는"}],"usageExamples":[{"en":"The hotel lobby was decorated in an elegant style.","ko":"그 호텔 로비는 우아한 양식으로 꾸며져 있었다."},{"en":"He offered an elegant solution to a difficult problem.","ko":"그는 어려운 문제에 대해 품위 있는 해법을 내놓았다."}],"grammarNote":"'elegant'은 사람·옷·디자인뿐 아니라 'elegant solution(간결하고 훌륭한 해법)'처럼 논리·해결책을 칭찬할 때도 쓰인다. 명사형은 'elegance'.","grammarQuiz":[{"sentence":"The dress _____ she wore last night was very elegant.","ko":"그녀가 지난밤에 입었던 그 드레스는 매우 우아했다.","answer":"that","hint":"관계대명사 (목적격)"}]},
    {"id":"w02002","w":"elevate","pos":["v"],"ph":"/ˈelɪveɪt/","cefr":"B2","kr":["높이다","올리다","승진시키다"],"ex":[{"en":"Exercise can elevate your mood significantly.","ko":"운동은 기분을 크게 향상시킬 수 있다."}],"mnemonic":{"soundHint":"'엘리베이트' → elevator(엘리베이터)에서 → 올리다","story":"운동으로 기분을 '엘리베이트' 위로 끌어올리는 아침.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"raise","ko":"올리다","reason":"동의어 — 높임"},{"w":"lift","ko":"들어올리다","reason":"동의어 — 위로"},{"w":"lower","ko":"낮추다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"elevate your mood","ko":"기분을 향상시키다"},{"en":"elevate the status","ko":"지위를 올리다"}]},"nuance":{"koSimple":"위치·지위·수준을 더 높은 곳으로 끌어올린다는 뜻이다.","whenToUse":"기분·품격·직위를 향상시킬 때 쓴다."},"krDetail":[{"ko":"높이다","explain":"위치나 수준을 올리다"},{"ko":"올리다","explain":"위로 들어 올리다"},{"ko":"승진시키다","explain":"더 높은 자리로 올리다"}],"usageExamples":[{"en":"Keep the injured leg elevated to reduce swelling.","ko":"부기를 줄이려면 다친 다리를 높인 채로 두세요."},{"en":"The award elevated her to national fame overnight.","ko":"그 상은 그녀를 하룻밤 사이에 전국적인 명성으로 끌어올렸다."}],"grammarNote":"'elevate'는 '(물리적으로) 올리다'와 '(지위·수준을) 높이다' 둘 다에 쓰인다. 명사형은 'elevation'이다.","grammarQuiz":[{"sentence":"Regular exercise can help _____ (elevate) your mood.","ko":"규칙적인 운동은 기분을 향상시키는 데 도움을 줄 수 있다.","answer":"to elevate","hint":"to부정사 (목적어)"},{"sentence":"His salary _____ (elevate) after his promotion last month.","ko":"그의 급여는 지난달 승진 후 인상되었다.","answer":"was elevated","hint":"수동태 (과거)"}]},
    {"id":"w02003","w":"elevation","pos":["n"],"ph":"/ˌɛlɪˈveɪʃən/","cefr":"B2","kr":["고도","높이"],"ex":[{"en":"The village sits at high elevation.","ko":"마을은 높은 고도에 위치해 있다."}],"mnemonic":{"soundHint":"'엘리베이션' → elevate + tion = 높이, 고도","story":"해발 3000m '엘리베이션'의 고산 마을 풍경.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"altitude","ko":"고도","reason":"동의어 — 해발 높이"},{"w":"height","ko":"높이","reason":"동의어 — 위로 거리"},{"w":"depth","ko":"깊이","reason":"반의어 — 정반대"}],"collocBest":[{"en":"high elevation","ko":"높은 고도"},{"en":"at an elevation of 2,000 meters","ko":"고도 2,000미터에"}]},"nuance":{"koSimple":"해수면 기준으로 잰 지형의 높이를 뜻한다.","whenToUse":"산·마을의 고도나 위치의 높낮이를 말할 때 쓴다."},"krDetail":[{"ko":"고도","explain":"바다 위 높이"},{"ko":"높이","explain":"위로 솟은 정도"}],"usageExamples":[{"en":"At this elevation, the air becomes noticeably thinner.","ko":"이 고도에서는 공기가 눈에 띄게 희박해진다."},{"en":"The town lies at an elevation of 2,000 meters.","ko":"그 마을은 해발 2,000미터 높이에 위치해 있다."}],"grammarNote":"'elevation'은 지리에서 '해발 고도'를 뜻하며 'at an elevation of ~' 형태로 쓴다. 동사형은 'elevate'다.","grammarQuiz":[{"sentence":"The village _____ (locate) at a high elevation attracts many tourists.","ko":"높은 고도에 위치한 그 마을은 많은 관광객을 끌어들인다.","answer":"located","hint":"과거분사 (수동)"}]},
    {"id":"w02005","w":"eligible","pos":["adj"],"ph":"/ˈelɪdʒəbl/","cefr":"B2","kr":["자격이 있는","해당되는"],"ex":[{"en":"Only citizens over 18 are eligible to vote.","ko":"18세 이상의 시민만 투표 자격이 있다."}],"mnemonic":{"soundHint":"'엘리저블' → elect(선출)에서 파생 → 자격이 있는","story":"만 18세가 되어 투표할 '엘리저블' 자격이 생긴 학생.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"qualified","ko":"자격 있는","reason":"동의어 — 조건 충족"},{"w":"entitled","ko":"권리가 있는","reason":"유의어 — 자격 보유"},{"w":"ineligible","ko":"자격 없는","reason":"반의어 — 정반대"}],"collocBest":[{"en":"eligible to vote","ko":"투표할 자격이 있는"},{"en":"eligible for a refund","ko":"환불받을 자격이 있는"}]},"nuance":{"koSimple":"조건을 만족해 참여할 자격이 있음을 뜻한다.","whenToUse":"투표·지원·수상 자격이 있는지 판단할 때 쓴다."},"krDetail":[{"ko":"자격이 있는","explain":"조건을 갖춘"},{"ko":"해당되는","explain":"요건에 들어맞는"}],"usageExamples":[{"en":"You are eligible for a refund if you apply within a week.","ko":"일주일 안에 신청하면 환불받을 자격이 있다."},{"en":"Only full-time employees are eligible to join the plan.","ko":"정규직 직원만이 그 제도에 가입할 자격이 있다."}],"grammarNote":"'be eligible for+명사'와 'be eligible to+동사원형' 두 형태를 함께 익혀야 한다. 반의어는 'ineligible(자격 없는)'이다.","grammarQuiz":[{"sentence":"Only those who are 18 or older are eligible _____ (vote).","ko":"18세 이상인 사람들만 투표할 자격이 있다.","answer":"to vote","hint":"to부정사 (부사적 용법)"}]},
    {"id":"w02006","w":"eliminate","pos":["v"],"ph":"/ɪˈlɪmɪneɪt/","cefr":"B2","kr":["제거하다","없애다"],"ex":[{"en":"We need to eliminate waste.","ko":"우리는 낭비를 없애야 한다."}],"mnemonic":{"soundHint":"'일리미네이트' → 리미트(한계) 밖으로 던져 → 제거하다","story":"토너먼트에서 상대팀을 '일리미네이트'하고 다음 라운드 진출.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"remove","ko":"제거하다","reason":"동의어 — 기본형"},{"w":"eradicate","ko":"근절하다","reason":"동의어 — 격식체"},{"w":"retain","ko":"유지하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"eliminate waste","ko":"낭비를 없애다"},{"en":"eliminate the risk","ko":"위험을 제거하다"}]},"nuance":{"koSimple":"필요 없거나 방해되는 것을 완전히 없앤다는 뜻이다.","whenToUse":"낭비·오류·경쟁자를 제거할 때 쓴다."},"krDetail":[{"ko":"제거하다","explain":"완전히 없애다"},{"ko":"없애다","explain":"사라지게 하다"}],"usageExamples":[{"en":"The new policy aims to eliminate unnecessary paperwork.","ko":"그 새 정책은 불필요한 서류 작업을 없애는 것을 목표로 한다."},{"en":"Our team was eliminated in the first round of the contest.","ko":"우리 팀은 대회 1라운드에서 탈락했다."}],"grammarNote":"'eliminate A from B(B에서 A를 제거하다)' 형태로 자주 쓴다. 스포츠·대회에서는 '탈락시키다'라는 뜻으로도 쓰이며 명사형은 'elimination'이다.","grammarQuiz":[{"sentence":"All errors _____ (eliminate) before the final report was submitted.","ko":"최종 보고서가 제출되기 전 모든 오류가 제거되었다.","answer":"had been eliminated","hint":"과거완료 수동태"}]},
    {"id":"w02009","w":"eloquent","pos":["adj"],"ph":"/ˈɛləkwənt/","cefr":"B2","kr":["유창한","설득력 있는"],"ex":[{"en":"He gave an eloquent speech.","ko":"그는 유창한 연설을 했다."}],"mnemonic":{"soundHint":"'엘로퀀트' → e(밖으로)+loqu(말하다) = 말이 유창한","story":"청중을 사로잡는 '엘로퀀트'한 졸업생 대표 연설.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"articulate","ko":"또렷이 말하는","reason":"동의어 — 표현 능숙"},{"w":"fluent","ko":"유창한","reason":"유의어 — 말 잘함"},{"w":"inarticulate","ko":"말 서투른","reason":"반의어 — 정반대"}],"collocBest":[{"en":"an eloquent speech","ko":"유창한 연설"},{"en":"an eloquent speaker","ko":"설득력 있는 연설가"}]},"nuance":{"koSimple":"말이 유창하고 설득력 있게 표현된다는 뜻이다.","whenToUse":"연설·글이 감동적이고 조리 있을 때 쓴다."},"krDetail":[{"ko":"유창한","explain":"말을 잘하고 매끄러운"},{"ko":"설득력 있는","explain":"마음을 움직이는"}],"usageExamples":[{"en":"Her eloquent speech moved the entire audience to tears.","ko":"그녀의 유창한 연설은 청중 전체를 눈물짓게 했다."},{"en":"He made an eloquent case for reforming the system.","ko":"그는 그 제도를 개혁하자는 설득력 있는 주장을 폈다."}],"grammarNote":"'eloquent'은 말·글·표현이 '유창하고 설득력 있는'을 뜻한다. 부사형은 'eloquently', 명사형은 'eloquence'다.","grammarQuiz":[{"sentence":"The speaker, _____ words moved the audience, received a standing ovation.","ko":"말이 청중을 감동시킨 그 연설자는 기립박수를 받았다.","answer":"whose","hint":"관계대명사 (소유격)"}]},
    {"id":"w02011","w":"elsewhere","pos":["adv"],"ph":"/ˈɛlswɛər/","cefr":"B2","kr":["다른 곳에","딴 곳에서"],"ex":[{"en":"The answer lies elsewhere.","ko":"답은 다른 곳에 있다."}],"mnemonic":{"soundHint":"'엘스웨어' → else(다른) + where(어디) = 다른 곳에","story":"이곳에 없다면 답은 '엘스웨어' 어딘가에 있다는 힌트.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"somewhere","ko":"어딘가에","reason":"유의어 — 장소 부사"},{"w":"away","ko":"떨어져","reason":"관련어 — 다른 곳"},{"w":"here","ko":"여기에","reason":"반의어 — 정반대"}],"collocBest":[{"en":"look elsewhere","ko":"다른 곳을 살펴보다"},{"en":"go elsewhere","ko":"딴 곳으로 가다"}]},"nuance":{"koSimple":"이곳이 아닌 다른 어딘가를 뜻한다.","whenToUse":"답·기회·물건이 다른 장소에 있음을 말할 때 쓴다."},"krDetail":[{"ko":"다른 곳에","explain":"여기가 아닌 곳에"},{"ko":"딴 곳에서","explain":"이곳이 아닌 데서"}],"usageExamples":[{"en":"If prices are too high here, we can shop elsewhere.","ko":"여기 가격이 너무 비싸면 다른 곳에서 살 수 있다."},{"en":"The manager was busy, so I sought help elsewhere.","ko":"관리자가 바빠서 나는 다른 곳에서 도움을 구했다."}],"grammarNote":"'elsewhere'는 'somewhere else(다른 어딘가)'와 같은 뜻의 부사로, 전치사 없이 단독으로 쓰인다.","grammarQuiz":[{"sentence":"If she hadn't found it here, she _____ (look) elsewhere.","ko":"그녀가 여기서 그것을 찾지 못했다면, 다른 곳을 찾아봤을 것이다.","answer":"would have looked","hint":"가정법 과거완료"}]},
    {"id":"w02017","w":"embark","pos":["v"],"ph":"/ɪmˈbɑːk/","cefr":"B2","kr":["승선하다","착수하다","시작하다"],"ex":[{"en":"They decided to embark on a new business venture together.","ko":"그들은 함께 새로운 사업에 착수하기로 결정했다."}],"mnemonic":{"soundHint":"'임바크' → em(안으로) + bark(작은 배) = 배에 오르다","story":"새 사업이라는 배에 '임바크' 승선해 도전을 시작.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"commence","ko":"시작하다","reason":"동의어 — 격식체"},{"w":"begin","ko":"시작하다","reason":"동의어 — 기본형"},{"w":"conclude","ko":"끝내다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"embark on a journey","ko":"여행에 나서다"},{"en":"embark on a project","ko":"프로젝트에 착수하다"}]},"nuance":{"koSimple":"배·비행기에 오르거나 새 일을 시작한다는 뜻이다.","whenToUse":"항해에 나서거나 사업·모험에 착수할 때 쓴다."},"krDetail":[{"ko":"승선하다","explain":"배나 비행기에 타다"},{"ko":"착수하다","explain":"일을 시작하다"},{"ko":"시작하다","explain":"새 일에 나서다"}],"usageExamples":[{"en":"Passengers began to embark as soon as the gate opened.","ko":"탑승구가 열리자마자 승객들이 승선하기 시작했다."},{"en":"She is about to embark on an exciting new career.","ko":"그녀는 흥미진진한 새 직업에 막 착수하려 한다."}],"grammarNote":"'embark on/upon ~'은 '(새로운 일에) 착수하다, 나서다'라는 뜻의 매우 자주 쓰이는 표현이다. 반의어는 'disembark(하선하다)'이다.","grammarQuiz":[{"sentence":"They decided _____ (embark) on a new adventure together.","ko":"그들은 함께 새로운 모험에 나서기로 결정했다.","answer":"to embark","hint":"to부정사 (목적어)"}]},
    {"id":"w02019","w":"embassy","pos":["n"],"ph":"/ˈɛmbəsi/","cefr":"B2","kr":["대사관"],"ex":[{"en":"She works at the embassy.","ko":"그녀는 대사관에서 일한다."}],"mnemonic":{"soundHint":"'엠버시' → 대사(ambassador)가 있는 곳 = 대사관","story":"여권 분실로 '엠버시' 대사관에 도움을 청하는 여행자.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"consulate","ko":"영사관","reason":"관련어 — 외교기관"},{"w":"ambassador","ko":"대사","reason":"관련어 — 대사관장"},{"w":"diplomat","ko":"외교관","reason":"관련어 — 근무자"}],"collocBest":[{"en":"the American embassy","ko":"미국 대사관"},{"en":"work at the embassy","ko":"대사관에서 일하다"}]},"nuance":{"koSimple":"외국에 설치된 자국의 외교 공관을 뜻한다.","whenToUse":"비자·외교 업무·자국민 보호를 말할 때 쓴다."},"krDetail":[{"ko":"대사관","explain":"한 나라가 다른 나라에 둔 외교 기관"}],"usageExamples":[{"en":"He applied for a visa at the U.S. embassy in Seoul.","ko":"그는 서울에 있는 미국 대사관에서 비자를 신청했다."},{"en":"The embassy issued a warning to its citizens traveling abroad.","ko":"그 대사관은 해외로 여행하는 자국민에게 경고를 발령했다."}],"grammarNote":"'embassy'는 셀 수 있는 명사로, 특정 나라의 대사관을 말할 때 'the ~ embassy' 형태를 자주 쓴다. 대사(사람)는 'ambassador'로 구별해야 한다.","grammarQuiz":[{"sentence":"The embassy _____ (locate) in the city center is easy to find.","ko":"도심에 위치한 그 대사관은 찾기 쉽다.","answer":"located","hint":"과거분사 (수동)"}]},
    {"id":"w02022","w":"emblem","pos":["n"],"ph":"/ˈembləm/","cefr":"B2","kr":["상징","엠블럼","휘장"],"ex":[{"en":"The dove is a widely recognized emblem of peace.","ko":"비둘기는 평화의 상징으로 널리 알려져 있다."}],"mnemonic":{"soundHint":"'엠블럼' → 자동차 엠블럼, 상징 마크","story":"비둘기 '엠블럼'이 새겨진 유엔 평화 깃발.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"symbol","ko":"상징","reason":"동의어 — 기본형"},{"w":"insignia","ko":"휘장","reason":"동의어 — 격식체"},{"w":"badge","ko":"배지","reason":"유의어 — 표식"}],"collocBest":[{"en":"an emblem of peace","ko":"평화의 상징"},{"en":"the national emblem","ko":"국가 상징"}]},"nuance":{"koSimple":"어떤 대상을 상징적으로 나타내는 표식이다.","whenToUse":"국가·단체·이념의 상징 문양을 말할 때 쓴다."},"krDetail":[{"ko":"상징","explain":"어떤 뜻을 대신 나타내는 표시"},{"ko":"엠블럼","explain":"단체를 나타내는 도안"},{"ko":"휘장","explain":"옷·모자에 다는 표식"}],"usageExamples":[{"en":"The olive branch has long served as an emblem of peace.","ko":"올리브 가지는 오랫동안 평화의 상징으로 쓰여 왔다."},{"en":"Each team wears an emblem on the left side of its uniform.","ko":"각 팀은 유니폼 왼쪽에 엠블럼을 달고 있다."}],"grammarNote":"'emblem of + 명사' 형태로 '~의 상징'을 나타낸다. 추상적 상징을 뜻하는 'symbol'과 비슷하지만, 'emblem'은 시각적 도안·표식의 뉘앙스가 더 강하다.","grammarQuiz":[{"sentence":"The dove _____ (consider) an emblem of peace for centuries.","ko":"비둘기는 수 세기 동안 평화의 상징으로 여겨져 왔다.","answer":"has been considered","hint":"현재완료 수동태"}]},
    {"id":"w02024","w":"embrace","pos":["v","n"],"ph":"/ɪmˈbreɪs/","cefr":"B2","kr":["포용하다","껴안다"],"ex":[{"en":"She embraced the new challenge.","ko":"그녀는 새로운 도전을 포용했다."}],"mnemonic":{"soundHint":"'임브레이스' → em(안으로) + brace(팔) = 팔로 감싸다","story":"오랜만에 만난 친구를 '임브레이스' 꽉 껴안는 장면.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"hug","ko":"껴안다","reason":"동의어 — 신체 포옹"},{"w":"accept","ko":"받아들이다","reason":"유의어 — 수용 의미"},{"w":"reject","ko":"거부하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"embrace change","ko":"변화를 포용하다"},{"en":"a warm embrace","ko":"따뜻한 포옹"}]},"nuance":{"koSimple":"두 팔로 껴안거나 마음으로 받아들인다는 뜻이다.","whenToUse":"애정을 표하거나 새 도전·가치를 수용할 때 쓴다."},"krDetail":[{"ko":"포용하다","explain":"기꺼이 받아들이다"},{"ko":"껴안다","explain":"두 팔로 감싸 안다"}],"usageExamples":[{"en":"Successful companies embrace change rather than resist it.","ko":"성공하는 회사들은 변화에 저항하기보다 그것을 기꺼이 받아들인다."},{"en":"The two old friends embraced warmly at the airport.","ko":"두 옛 친구는 공항에서 따뜻하게 껴안았다."}],"grammarNote":"동사 'embrace'는 뒤에 목적어를 바로 취하는 타동사로, 추상적 대상(변화·생각)을 '받아들이다'라는 뜻으로 자주 쓰인다. 'embrace change/an idea'가 대표적 연어이다.","grammarQuiz":[{"sentence":"She was willing _____ (embrace) new challenges without hesitation.","ko":"그녀는 주저 없이 새로운 도전을 포용할 의향이 있었다.","answer":"to embrace","hint":"to부정사 (부사적 용법)"}]},
    {"id":"w02026","w":"emerge","pos":["v"],"ph":"/ɪˈmɜːrdʒ/","cefr":"B2","kr":["나타나다","드러나다"],"ex":[{"en":"A new idea emerged.","ko":"새로운 아이디어가 떠올랐다."}],"mnemonic":{"soundHint":"'이머지' → emergency(응급, 갑자기 튀어나옴) → 나타나다","story":"안개 속에서 실루엣이 서서히 '이머지'하며 드러나는 장면.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"appear","ko":"나타나다","reason":"동의어 — 기본형"},{"w":"arise","ko":"생겨나다","reason":"유의어 — 발생"},{"w":"disappear","ko":"사라지다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"emerge from the shadows","ko":"어둠 속에서 나타나다"},{"en":"a pattern emerges","ko":"패턴이 드러나다"}]},"nuance":{"koSimple":"보이지 않던 것이 밖으로 드러나 나타난다는 뜻이다.","whenToUse":"새 아이디어·문제·인물이 등장할 때 쓴다."},"krDetail":[{"ko":"나타나다","explain":"숨어 있다 밖으로 드러나다"},{"ko":"드러나다","explain":"감춰진 것이 알려지다"}],"usageExamples":[{"en":"The sun emerged from behind the dark clouds.","ko":"태양이 짙은 구름 뒤에서 나타났다."},{"en":"New evidence emerged during the investigation.","ko":"조사 도중 새로운 증거가 드러났다."}],"grammarNote":"'emerge'는 목적어를 갖지 않는 자동사로, 'emerge from ~'(~에서 나오다) 형태로 쓴다. 사실·문제가 '밝혀지다'라는 뜻으로도 흔히 사용된다.","grammarQuiz":[{"sentence":"New ideas _____ (emerge) from the discussion since it began.","ko":"토론이 시작된 이래로 새로운 아이디어들이 나타나 왔다.","answer":"have emerged","hint":"현재완료"}]},
    {"id":"w02029","w":"emigrate","pos":["v"],"ph":"/ˈemɪɡreɪt/","cefr":"B2","kr":["이민 가다","이주하다"],"ex":[{"en":"Her family emigrated to Canada in search of a better life.","ko":"그녀의 가족은 더 나은 삶을 찾아 캐나다로 이민을 갔다."}],"mnemonic":{"soundHint":"'에미그레이트' → e(밖으로) + migrate(이주) = 나가서 이주 = 이민","story":"가족이 캐나다로 '에미그레이트' 하며 짐을 싸는 공항 장면.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"migrate","ko":"이주하다","reason":"유의어 — 이동"},{"w":"immigrate","ko":"이민 오다","reason":"혼동 주의 — 방향 반대"},{"w":"relocate","ko":"이전하다","reason":"유의어 — 거주 옮김"}],"collocBest":[{"en":"emigrate to Canada","ko":"캐나다로 이민 가다"},{"en":"emigrate from Korea","ko":"한국에서 이주하다"}]},"nuance":{"koSimple":"살던 나라를 떠나 다른 나라로 이주한다는 뜻이다.","whenToUse":"본국에서 해외로 이민 가는 상황을 말할 때 쓴다."},"krDetail":[{"ko":"이민 가다","explain":"자기 나라를 떠나 다른 나라로 가다"},{"ko":"이주하다","explain":"살던 곳을 떠나 옮겨 살다"}],"usageExamples":[{"en":"Thousands of people emigrated from Europe in the 1900s.","ko":"1900년대에 수천 명의 사람들이 유럽을 떠나 이민을 갔다."},{"en":"They decided to emigrate to Australia for better job opportunities.","ko":"그들은 더 나은 일자리 기회를 위해 호주로 이주하기로 결정했다."}],"grammarNote":"'emigrate from + 떠나는 나라', 'emigrate to + 가는 나라' 형태로 쓴다. 나가는 관점의 'emigrate'와 들어오는 관점의 'immigrate'를 방향에 따라 구별해야 한다.","grammarQuiz":[{"sentence":"Her family decided _____ (emigrate) to Canada for a better life.","ko":"그녀의 가족은 더 나은 삶을 위해 캐나다로 이민을 가기로 결정했다.","answer":"to emigrate","hint":"to부정사 (목적어)"}]},
    {"id":"w01227","w":"concisely","pos":["adv"],"ph":"/kənˈsaɪsli/","cefr":"B2","kr":["간결하게","간략하게","요약하여"],"ex":[{"en":"The speaker explained the complex concept concisely in just two minutes.","ko":"연사는 복잡한 개념을 불과 2분 만에 간결하게 설명했다."}],"mnemonic":{"soundHint":"컨사이슬리 → concise + ly","story":"concise(간결)의 부사형 concisely '간결하게'.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"succinctly","ko":"간결하게","reason":"동의어 — 격식체"},{"w":"briefly","ko":"간단히","reason":"동의어 — 유사"},{"w":"verbosely","ko":"장황하게","reason":"반의어 — 정반대"}],"collocBest":[{"en":"explain concisely","ko":"간결하게 설명하다"},{"en":"write concisely","ko":"간명하게 쓰다"}]},"nuance":{"koSimple":"길게 늘어놓지 않고 요점만 담아 말하는 거예요.","whenToUse":"짧게 핵심만 전달할 때 자주 써요."},"krDetail":[{"ko":"간결하게","explain":"짧고 명확하게"},{"ko":"간략하게","explain":"간단히"},{"ko":"요약하여","explain":"줄여서"}],"usageExamples":[{"en":"Please state your opinion concisely.","ko":"당신의 의견을 간결하게 말해 주세요."},{"en":"The report concisely summarizes the main findings.","ko":"그 보고서는 주요 결과를 간결하게 요약한다."}],"grammarNote":"형용사 concise의 부사형으로, write·explain·state 같은 동사를 수식해 '간결하게'를 나타낸다.","grammarQuiz":[{"sentence":"The speaker explained the complex concept concisely, _____ (help) everyone understand.","ko":"연사는 복잡한 개념을 간결하게 설명하여 모두가 이해하도록 도왔다.","answer":"helping","hint":"분사구문 (능동, 결과)"}]},
    {"id":"w01268","w":"conquest","pos":["n"],"ph":"/ˈkɑŋkwɛst/","cefr":"B2","kr":["정복","극복"],"ex":[{"en":"The conquest of new territories changed history.","ko":"새 영토의 정복이 역사를 바꾸었다."}],"mnemonic":{"soundHint":"컹퀘스트 → conquer + st","story":"conquer(정복)의 명사형 conquest '정복, 극복'.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"triumph","ko":"승리","reason":"동의어 — 유사"},{"w":"victory","ko":"승리","reason":"유의어 — 관련"},{"w":"defeat","ko":"패배","reason":"반의어 — 정반대"}],"collocBest":[{"en":"military conquest","ko":"군사적 정복"},{"en":"Norman conquest","ko":"노르만 정복"}]},"nuance":{"koSimple":"싸워서 얻은 정복이나 성취를 뜻하는 말이에요.","whenToUse":"역사적 정복·업적을 언급할 때 써요."},"krDetail":[{"ko":"정복","explain":"무력으로 차지함"},{"ko":"극복","explain":"이겨냄"}],"usageExamples":[{"en":"The Norman conquest of England began in 1066.","ko":"노르만족의 잉글랜드 정복은 1066년에 시작되었다."},{"en":"The conquest of disease remains a major goal of science.","ko":"질병의 극복은 여전히 과학의 주요 목표이다."}],"grammarNote":"동사 conquer의 명사형으로, 'the conquest of+대상(~의 정복/극복)' 형태로 쓴다.","grammarQuiz":[{"sentence":"The conquest of new territories, _____ (change) history, took centuries.","ko":"역사를 바꾼 새 영토의 정복은 수 세기가 걸렸다.","answer":"changing","hint":"분사구문 (능동)"}]},
    {"id":"w01349","w":"controversy","pos":["n"],"ph":"/ˈkɒntrəvɜːsi/","cefr":"B2","kr":["논란","논쟁"],"ex":[{"en":"The policy caused great controversy.","ko":"그 정책은 큰 논란을 일으켰다."}],"mnemonic":{"soundHint":"컨트로버시","story":"'컨트롤(control)이 안 돼서 시끄러운' → 논란","hintConfidence":2},"pairs":{"buddyWords":[{"w":"dispute","ko":"분쟁","reason":"동의어 — 다툼"},{"w":"debate","ko":"논쟁","reason":"동의어 — 토론"},{"w":"agreement","ko":"합의","reason":"반의어 — 의견 일치"}],"collocBest":[{"en":"cause controversy","ko":"논란을 일으키다"},{"en":"stir up controversy","ko":"논쟁을 불러일으키다"}]},"nuance":{"koSimple":"여러 의견이 격돌하여 공개적 논쟁이 벌어짐을 뜻함","whenToUse":"사회적 이슈·정책·발언이 큰 논쟁을 부를 때 사용함"},"krDetail":[{"ko":"논란","explain":"의견 다툼"},{"ko":"논쟁","explain":"맞서 벌이는 말싸움"}],"usageExamples":[{"en":"The new tax sparked widespread controversy.","ko":"그 새로운 세금은 광범위한 논란을 불러일으켰다."},{"en":"Her comments stirred up controversy among fans.","ko":"그녀의 발언은 팬들 사이에서 논쟁을 일으켰다."}],"grammarNote":"controversy는 'controversy over/about ~'(~을 둘러싼 논란) 형태로 전치사 over·about과 자주 결합한다.","grammarQuiz":[{"sentence":"The new policy _____ caused great controversy has been withdrawn.","ko":"큰 논란을 일으켰던 새 정책이 철회되었다.","answer":"which","hint":"주격 관계대명사"}]},

    {"id":"w01580","w":"deadly","pos":["adj","adv"],"ph":"/ˈdedli/","cefr":"B2","kr":["치명적인","극도로"],"ex":[{"en":"It was a deadly disease.","ko":"그것은 치명적인 질병이었다."}],"mnemonic":{"soundHint":"데들리","story":"dead(죽음)이 뒤따르는 치명적인","hintConfidence":3},"pairs":{"buddyWords":[{"w":"fatal","ko":"치명적인","reason":"동의어 — 치명적"},{"w":"lethal","ko":"치명적인","reason":"동의어 — 치명적"},{"w":"harmless","ko":"무해한","reason":"반의어 — 정반대"}],"collocBest":[{"en":"a deadly disease","ko":"치명적인 질병"},{"en":"deadly weapon","ko":"치명적인 무기"}]},"nuance":{"koSimple":"생명을 위협할 만큼 매우 위험하고 치명적인 성질이다.","whenToUse":"치사율 높은 질병이나 극도의 정도를 강조할 때 쓴다."},"krDetail":[{"ko":"치명적인","explain":"목숨을 앗아 갈 만큼 위험한"},{"ko":"극도로","explain":"지극히, 몹시"}],"usageExamples":[{"en":"The snake's venom is deadly and can kill within hours.","ko":"그 뱀의 독은 치명적이어서 몇 시간 안에 목숨을 앗아 갈 수 있다."},{"en":"He sat in deadly silence, waiting for the results to appear.","ko":"그는 결과가 나오기를 기다리며 극도로 조용히 앉아 있었다."}],"grammarNote":"deadly는 형용사로 '치명적인(=fatal)', 부사로 '극도로'를 뜻한다. -ly로 끝나지만 대개 형용사로 쓰이는 점에 유의하며, 'deadly serious(더없이 진지한)'처럼 강조 부사로도 쓰인다.","grammarQuiz":[{"sentence":"So deadly _____ the virus that entire towns had to be quarantined.","ko":"그 바이러스는 매우 치명적이어서 전체 마을이 격리되어야 했다.","answer":"was","hint":"So + 형용사 도치 - be + 주어"}]},

    {"id":"w01840","w":"diverse","pos":["adj"],"ph":"/daɪˈvɜːrs/","cefr":"B2","kr":["다양한","다채로운"],"ex":[{"en":"Our team is very diverse.","ko":"우리 팀은 매우 다양하다."}],"mnemonic":{"soundHint":"'다이버스' → '다이(다양)+ 버스(사람 태우는 버스)' = 다양한 사람이 탄 버스","story":"온갖 국적의 사람들이 탄 '다이버스'한 관광 버스를 상상.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"varied","ko":"다양한","reason":"동의어 — 여러 종류"},{"w":"assorted","ko":"여러 가지의","reason":"동의어 — 갖가지"},{"w":"uniform","ko":"획일적인","reason":"반의어 — 정반대"}],"collocBest":[{"en":"a diverse range","ko":"다양한 범위"},{"en":"culturally diverse","ko":"문화적으로 다양한"}]},"nuance":{"koSimple":"종류나 성질이 여러 가지로 다양하다는 뜻이다.","whenToUse":"구성원·문화·의견의 다채로움을 강조할 때 쓴다."},"krDetail":[{"ko":"다양한","explain":"종류가 여러 가지인"},{"ko":"다채로운","explain":"여러 빛깔로 풍부한"}],"usageExamples":[{"en":"The city is home to people from diverse cultural backgrounds.","ko":"그 도시는 다양한 문화적 배경을 가진 사람들의 터전이다."},{"en":"The magazine covers a diverse range of topics each month.","ko":"그 잡지는 매달 다양한 범위의 주제를 다룬다."}],"grammarNote":"'diverse'는 '다양한'이라는 뜻의 형용사로 명사형 'diversity(다양성)', 동사 'diversify(다양화하다)'와 함께 익힌다. 'a diverse range of ~(다양한 범위의)' 표현이 흔하다.","grammarQuiz":[{"sentence":"The company _____ (have) diverse employees from many countries for years.","ko":"그 회사는 수년간 많은 나라 출신의 다양한 직원들을 두어 왔다.","answer":"has had","hint":"현재완료"}]},
