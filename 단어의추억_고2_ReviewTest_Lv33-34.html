<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고2 Review Test Lv33-34</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}
  /* 첫글자 프리필 인풋 — 미리 채워진 첫 글자를 시각적으로 강조 */
  .prefill-input{caret-color:#fef3c7;font-family:'Courier New',ui-monospace,monospace;letter-spacing:.05em;font-weight:700;}
  .prefill-hint{color:#c4b5fd;font-size:.82rem;font-weight:500;margin-left:6px;letter-spacing:0;}
  /* ---------- 낱말박스 (자동완성 방어) ---------- */
  .word-answer{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;margin:6px 0;}
  .word-answer.inline{display:inline-flex;gap:8px;vertical-align:middle;margin:0 4px;}
  .word-group{
    display:inline-flex;align-items:center;gap:0;
    background:rgba(11,18,32,.7);border:1.5px solid #334155;border-radius:8px;
    padding:0;transition:all .15s;overflow:hidden;flex-shrink:0;
  }
  .word-group:focus-within{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(168,139,250,.22);}
  .word-group.correct{border-color:var(--grade);background:rgba(16,185,129,.10);}
  .word-group.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);}
  /* 폰트: body 상속 sans-serif (이전 .input-box input과 동일한 스타일) */
  .first-letter{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;padding:0 8px;height:44px;line-height:44px;
    background:linear-gradient(180deg,#3b2966 0%,#2a1e4d 100%);
    color:#fef3c7;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    border-right:1px solid #8b5cf6;user-select:none;
  }
  .rest-input{
    border:0;background:transparent;color:var(--text);outline:none;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    padding:0 10px;height:44px;line-height:44px;width:120px;min-width:90px;
    text-transform:lowercase;
  }
  .rest-input::placeholder{color:#475569;font-weight:400;}
  .word-group.correct .rest-input{color:#a7f3d0;}
  .word-group.wrong .rest-input{color:#fca5a5;}
  .cloze-sentence .word-answer{display:inline-flex;flex-wrap:wrap;gap:6px 8px;margin:0 4px;vertical-align:middle;}
  .cloze-sentence .word-group{border-radius:6px;}
  .cloze-sentence .first-letter{height:38px;line-height:38px;font-size:1.05rem;min-width:22px;padding:0 7px;}
  .cloze-sentence .rest-input{height:38px;line-height:38px;font-size:1.05rem;width:100px;min-width:70px;padding:0 9px;}
  /* .input-box input 스타일이 .rest-input을 override 하는 문제 해결 */
  .input-box .word-answer input.rest-input{
    background:transparent;border:0;padding:0 10px;
    min-height:44px;height:44px;line-height:44px;text-align:left;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    width:120px;min-width:90px;box-shadow:none;
  }
  .input-box .word-answer input.rest-input:focus{border:0;box-shadow:none;}
  /* single-letter 그룹 */
  .word-group.single-letter{background:rgba(11,18,32,.5);}
  .word-group.single-letter input.rest-input{width:80px;min-width:60px;}
  .hint-line{margin-top:12px;padding:10px 14px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35);border-radius:10px;color:#c4b5fd;font-size:.95rem;line-height:1.55;text-align:center;letter-spacing:.03em;}
  .hint-line b{color:#fef3c7;font-weight:800;font-family:'Courier New',ui-monospace,monospace;font-size:1.05rem;letter-spacing:.15em;margin:0 2px;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}
  .buddy-item .why{font-size:.86rem;color:var(--back-muted);opacity:1;display:block;width:100%;margin-top:3px;font-style:italic;}
  .ex-line{font-size:1.03rem;line-height:1.55;}
  .ex-line .en{color:#f8fafc;font-style:italic;font-weight:500;}
  .ex-line .ko{color:var(--back-muted-strong);font-size:.94rem;display:block;margin-top:4px;font-weight:500;}
  /* 콜로케이션·예문 재생 버튼 */
  .speak-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;flex:0 0 26px;
    padding:0;margin-right:8px;
    border:1px solid rgba(59,130,246,.35);
    background:rgba(59,130,246,.10);
    color:var(--info);
    font-size:.78rem;line-height:1;
    border-radius:8px;cursor:pointer;
    transition:var(--transition);
  }
  .speak-btn:hover{
    background:rgba(59,130,246,.22);
    border-color:rgba(59,130,246,.55);
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(59,130,246,.20);
  }
  .speak-btn:active{transform:translateY(0);}
  .col-item .en, .ex-line .en{flex:1 1 auto;min-width:0;}
  .ex-line{display:flex;flex-wrap:wrap;align-items:baseline;}

  /* Grade buttons */
  .grade-row{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
    margin-top:14px;
  }
  .grade-btn{
    padding:15px 6px;border-radius:var(--radius-md);
    font-weight:700;font-size:.92rem;
    min-height:56px;
    border:1.5px solid transparent;
    transition:all var(--transition);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .grade-btn .ic{font-size:20px;line-height:1;}
  .grade-btn.prev{background:rgba(59,130,246,.14);color:#93c5fd;border-color:rgba(59,130,246,.35);}
  .grade-btn.home{background:rgba(245,158,11,.12);color:var(--accent-light);border-color:rgba(245,158,11,.30);}
  .grade-btn.next{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.40);}
  .grade-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
  .grade-btn.prev:hover{box-shadow:0 6px 16px rgba(59,130,246,.25);}
  .grade-btn.home:hover{box-shadow:0 6px 16px rgba(245,158,11,.20);}
  .grade-btn.next:hover{box-shadow:0 6px 16px rgba(16,185,129,.30);}
  .grade-btn:active{transform:translateY(0) scale(.97);}
  .grade-btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6);}
  .grade-btn:disabled:hover{transform:none;box-shadow:none;filter:grayscale(.6);}

  .flip-hint{
    text-align:center;color:var(--text-on-dark-muted);
    font-size:.72rem;margin-top:10px;opacity:.6;letter-spacing:.02em;
  }

  /* ---------- QUIZ ---------- */
  .quiz-stage{padding:12px 2px;flex:1;display:flex;flex-direction:column;}
  .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .quiz-num{
    background:var(--bg-card);padding:7px 14px;border-radius:100px;
    font-size:.82rem;font-weight:600;
    border:1px solid rgba(148,163,184,.15);
    color:var(--text-on-dark-muted);
  }
  .quiz-num b{color:var(--grade);font-weight:700;}
  .quiz-mode{
    background:rgba(245,158,11,.12);color:var(--accent-light);
    padding:6px 12px;border-radius:100px;
    font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.22);
  }
  .quiz-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:24px 20px;
    box-shadow:var(--shadow-lg);
    min-height:320px;display:flex;flex-direction:column;
  }
  .quiz-prompt{
    text-align:center;margin-bottom:20px;
  }
  .quiz-prompt .label{
    font-size:.68rem;color:var(--text-on-dark-muted);
    text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:10px;
  }
  .quiz-prompt .qword{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.2rem;font-weight:800;color:var(--text-on-dark);
    line-height:1.15;word-break:break-word;letter-spacing:-1px;
    text-shadow:0 0 24px rgba(16,185,129,.20);
  }
  .quiz-prompt .qkr{font-size:1.5rem;font-weight:700;color:var(--accent-light);line-height:1.3;}
  .quiz-prompt .qph{color:var(--text-on-dark-muted);font-size:.88rem;margin-top:6px;font-style:italic;}
  .quiz-prompt .lis-btn{
    margin:10px auto 0;display:flex;
    background:linear-gradient(135deg, var(--info) 0%, #2563eb 100%);
    color:#ffffff;font-weight:700;font-size:.95rem;
    padding:14px 24px;border-radius:var(--radius-md);align-items:center;gap:8px;
    box-shadow:0 6px 20px rgba(59,130,246,.35), inset 0 1px 0 rgba(255,255,255,.15);
    min-height:48px;transition:all var(--transition);
  }
  .quiz-prompt .lis-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(59,130,246,.42);}
  .quiz-prompt .lis-btn:active{transform:translateY(0) scale(.97);}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.12);
    border-radius:var(--radius-md);padding:14px 16px;
    text-align:left;font-size:.98rem;font-weight:600;color:var(--text-on-dark);
    transition:all var(--transition);
    display:flex;align-items:center;gap:12px;
    min-height:52px;line-height:1.3;
  }
  .choice:hover{background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.22);transform:translateY(-1px);}
  .choice .idx{
    flex-shrink:0;width:26px;height:26px;border-radius:var(--radius-sm);
    background:rgba(148,163,184,.14);color:var(--text-on-dark-muted);
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:700;
    transition:all var(--transition);
  }
  .choice:active{transform:scale(.98);}
  .choice.correct{background:rgba(16,185,129,.16);border-color:var(--grade);color:#a7f3d0;box-shadow:0 4px 16px rgba(16,185,129,.20);}
  .choice.correct .idx{background:var(--grade);color:#0f172a;}
  .choice.wrong{background:rgba(239,68,68,.14);border-color:var(--danger);color:#fca5a5;}
  .choice.wrong .idx{background:var(--danger);color:#fff;}
  .choice.dimmed{opacity:.4;}
  body.cb-mode .choice.correct::after{content:"✓";margin-left:auto;font-size:22px;font-weight:900;}
  body.cb-mode .choice.wrong::after{content:"✕";margin-left:auto;font-size:22px;font-weight:900;}

  .input-box{
    display:flex;flex-direction:column;gap:12px;margin-top:6px;
  }
  .input-box input{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.15);
    border-radius:var(--radius-md);padding:16px;
    color:var(--text-on-dark);font-size:1.15rem;font-weight:600;
    text-align:center;letter-spacing:.5px;
    min-height:52px;outline:none;
    transition:all var(--transition);
  }
  .input-box input:focus{border-color:var(--grade);box-shadow:0 0 0 4px rgba(16,185,129,.15);}
  .input-box input.correct{border-color:var(--grade);background:rgba(16,185,129,.10);color:#a7f3d0;}
  .input-box input.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);color:#fca5a5;}
  .submit-btn{
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1rem;
    padding:15px;border-radius:var(--radius-md);min-height:52px;
    box-shadow:0 6px 20px rgba(16,185,129,.30), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);
  }
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,185,129,.40);}
  .submit-btn:active{transform:translateY(0) scale(.98);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .feedback{
    text-align:center;margin-top:16px;
    min-height:24px;font-weight:700;font-size:.92rem;
    letter-spacing:.02em;
  }
  .feedback.ok{color:#6ee7b7;}
  .feedback.bad{color:#fca5a5;}

  /* ---------- RESULT ---------- */
  .result{text-align:center;padding:20px 4px;}
  .result h2{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2rem;margin:10px 0 6px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg, var(--accent) 0%, var(--grade) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .result .score-big{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:4rem;font-weight:900;line-height:1;
    margin:20px 0 6px;color:var(--grade);letter-spacing:-2px;
    text-shadow:0 0 40px var(--grade-glow-strong);
  }
  .result .score-pct{color:var(--text-on-dark-muted);font-size:1.1rem;font-weight:600;}
  .result .score-time{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:10px;padding:8px 16px;border-radius:var(--radius-lg);
    background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.20);
    color:#f8fafc;font-size:1.05rem;font-weight:600;letter-spacing:.02em;
  }
  .result .score-time b{color:var(--accent-light);font-weight:800;font-variant-numeric:tabular-nums;}
  /* 심화 90%+ 배곧 쵝오 배너 */
  .grand-banner{
    position:relative;margin:14px auto 4px;padding:16px 22px;max-width:520px;
    border-radius:var(--radius-lg);
    background:linear-gradient(135deg,#7c3aed 0%,#db2777 45%,#f59e0b 100%);
    box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;
    text-align:center;overflow:hidden;
    animation:grandPop .8s cubic-bezier(.2,.7,.1,1.4) both, grandGlow 2s ease-in-out infinite alternate;
  }
  .grand-banner::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 50%),
               radial-gradient(circle at 70% 80%, rgba(255,255,255,.25), transparent 50%);
    pointer-events:none;
  }
  .grand-banner .grand-line{
    font-size:1.65rem;font-weight:900;color:#fff;letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.35);position:relative;
  }
  .grand-banner .grand-line b{
    background:linear-gradient(135deg,#fde68a 0%,#fbbf24 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;padding:0 4px;
  }
  .grand-banner .grand-sub{
    margin-top:6px;color:rgba(255,255,255,.95);
    font-size:.98rem;font-weight:700;letter-spacing:.02em;position:relative;
  }
  @keyframes grandPop{
    0%{transform:scale(.7) rotate(-3deg);opacity:0;}
    60%{transform:scale(1.06) rotate(1deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes grandGlow{
    from{box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;}
    to  {box-shadow:0 20px 60px rgba(245,158,11,.65),0 0 0 1px rgba(255,255,255,.35) inset;}
  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:hgFadeIn .35s ease-out both, hgFadeOut .8s ease-in 5.2s forwards;
  }
  .hg-celebration::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),
      radial-gradient(circle at 80% 25%, rgba(236,72,153,.28), transparent 22%),
      radial-gradient(circle at 30% 75%, rgba(59,130,246,.28), transparent 24%),
      radial-gradient(circle at 75% 80%, rgba(16,185,129,.28), transparent 22%);
    animation:hgSwirl 6s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .hg-halo{
    position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg,#fbbf24,#ef4444,#a855f7,#3b82f6,#10b981,#fbbf24);
    mix-blend-mode:screen;opacity:.28;
    animation:hgRotate 12s linear infinite;
  }
  .hg-msg{
    position:relative;font-family:inherit;
    font-size:clamp(28px, 6vw, 68px);font-weight:900;line-height:1.25;text-align:center;
    padding:32px 40px;max-width:92vw;letter-spacing:-.01em;
    background:linear-gradient(90deg,#fbbf24,#ef4444,#ec4899,#a855f7,#3b82f6,#10b981,#fbbf24);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(251,191,36,.75)) drop-shadow(0 0 40px rgba(236,72,153,.45));
    animation:hgRainbow 3.5s linear infinite, hgPop 1.6s cubic-bezier(.2,.7,.1,1.4) both, hgFloat 4s ease-in-out infinite alternate 1.6s;
  }
  .hg-sparkle{
    position:absolute;pointer-events:none;font-size:clamp(24px,3vw,36px);
    animation:hgSparkle 1.8s ease-in-out infinite;
  }
  @keyframes hgFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes hgFadeOut{to{opacity:0;visibility:hidden;}}
  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  @keyframes hgPop{
    0%{transform:scale(.15) rotate(-25deg);opacity:0;}
    35%{transform:scale(1.28) rotate(6deg);opacity:1;}
    55%{transform:scale(.94) rotate(-3deg);}
    75%{transform:scale(1.08) rotate(1.5deg);}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes hgFloat{
    from{transform:translateY(-6px) scale(1);}
    to{transform:translateY(6px) scale(1.02);}
  }
  @keyframes hgSwirl{
    0%{transform:scale(1) rotate(0);}
    100%{transform:scale(1.15) rotate(8deg);}
  }
  @keyframes hgRotate{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes hgSparkle{
    0%,100%{opacity:0;transform:scale(.4) rotate(0deg);}
    50%{opacity:1;transform:scale(1.2) rotate(180deg);}
  }
  .result-stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:22px 0;
  }
  .result-stat{
    background:var(--bg-card);padding:16px 12px;border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.10);
    box-shadow:var(--shadow-md);
    transition:transform var(--transition);
  }
  .result-stat:hover{transform:translateY(-2px);}
  .result-stat .l{font-size:.68rem;color:var(--text-on-dark-muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;}
  .result-stat .v{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.4rem;font-weight:800;color:var(--text-on-dark);margin-top:6px;}
  .result-stat .v.grade-c{color:var(--grade);}
  .result-stat .v.acc-c{color:var(--accent-light);}
  .badges-earned{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 20px;
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-card);padding:8px 14px;border-radius:100px;
    font-size:.82rem;font-weight:700;
    border:1px solid var(--accent);color:var(--accent-light);
    box-shadow:0 0 16px rgba(245,158,11,.22), 0 4px 12px rgba(0,0,0,.3);
    animation:badge-pop .5s cubic-bezier(.2,.7,.1,1.4) backwards;
  }
  .badge .ic{font-size:1.1rem;}
  @keyframes badge-pop{from{transform:scale(.4) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ---------- ANIMATIONS ---------- */
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  @keyframes bounce-correct{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .shake{animation:shake .22s ease;}
  .bounce-correct{animation:bounce-correct .32s ease;}

  /* ---------- CANVAS (particles) ---------- */
  #fxCanvas{
    position:fixed;inset:0;pointer-events:none;z-index:50;
  }

  /* ---------- TOAST ---------- */
  .toast-wrap{
    position:fixed;top:88px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;z-index:40;
  }
  .toast{
    background:rgba(15,23,42,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--accent-light);
    padding:10px 18px;border-radius:100px;font-weight:700;font-size:.86rem;
    letter-spacing:.02em;
    border:1px solid rgba(245,158,11,.35);
    box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 20px rgba(245,158,11,.15);
    animation:toast-in .3s cubic-bezier(.4,0,.2,1), toast-out .45s cubic-bezier(.4,0,.2,1) 1.4s forwards;
  }
  .toast.streak{color:var(--accent-light);}
  .toast.big{font-size:1.05rem;padding:14px 24px;border-color:rgba(16,185,129,.4);color:#a7f3d0;box-shadow:0 12px 32px rgba(0,0,0,.5), 0 0 24px rgba(16,185,129,.2);}

  @keyframes toast-out{to{transform:translateY(-14px) scale(.9);opacity:0;}}

    {"id":"v08626","w":"down the road","pos":["phrase"],"ph":"/roʊd/","cefr":"B2","kr":["앞으로, 장차 언젠가는"],"ex":[{"en":"Investing in education today will pay off significantly down the road.","ko":"오늘 교육에 투자하는 것은 앞으로 상당한 성과를 낼 것이다."}],"mnemonic":{"soundHint":"다운 더 로드 → '이 road(길)을 따라 저 아래'","story":"지금 이 길을 따라 저 앞으로 = 장차 언젠가.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"eventually","ko":"결국","reason":"동의어 — 나중에 가서"},{"w":"someday","ko":"언젠가","reason":"동의어 — 훗날에"},{"w":"now","ko":"지금","reason":"반의어 — 현재"}],"collocBest":[{"en":"somewhere down the road","ko":"앞으로 언젠가"},{"en":"years down the road","ko":"몇 년 뒤에"}]},"nuance":{"koSimple":"지금 당장이 아닌 시간이 흐른 나중 시점을 가리키는 표현이에요","whenToUse":"미래의 결과나 장기적 효과를 예측할 때 써요"},"krDetail":[{"ko":"앞으로, 장차 언젠가는","explain":"시간이 흐른 먼 훗날"}],"usageExamples":[{"en":"This decision may cause serious problems down the road.","ko":"이 결정은 앞으로 심각한 문제를 일으킬 수 있다."},{"en":"We can discuss the details further down the road, once the plans are firm.","ko":"계획이 확정되면 나중에 세부 사항을 더 논의할 수 있다."}],"grammarNote":"'미래의 어느 시점에, 나중에'를 뜻하는 관용 부사구다. 'a few years down the road'처럼 기간을 앞에 붙여 구체화할 수 있으며, 물리적 '길 아래쪽'의 뜻과는 문맥으로 구별한다.","grammarQuiz":[{"sentence":"Only down the road _____ we truly realize the value of investing in education today.","ko":"앞으로 언젠가야 비로소 우리는 오늘 교육에 투자하는 진정한 가치를 깨닫는다.","answer":"will","hint":"Only + 부사구 도치 (조동사 + 주어)"}]},
    {"id":"v08743","w":"lie in","pos":["phrase"],"ph":"/laɪ/","cefr":"B2","kr":["~에 있다, ~에 놓여 있다"],"ex":[{"en":"The true value of education lies in developing the ability to think critically.","ko":"교육의 진정한 가치는 비판적으로 사고하는 능력을 발달시키는 데 있다."}],"mnemonic":{"soundHint":"라이 인 → 'lie(놓여) + in(안에)'","story":"가치가 그 안(in)에 lie(놓여) 있다 = ~에 있다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"consist in","ko":"~에 있다","reason":"동의어 — 본질이 거기 있음"},{"w":"reside in","ko":"깃들다","reason":"동의어 — 그 안에 있음"},{"w":"rest on","ko":"~에 달리다","reason":"관련어 — 그것에 좌우됨"}],"collocBest":[{"en":"the answer lies in","ko":"해답은 ~에 있다"},{"en":"the problem lies in","ko":"문제는 ~에 있다"}]},"nuance":{"koSimple":"핵심이나 원인이 어디에 자리하고 있는지를 짚어 주는 뜻이에요","whenToUse":"본질·비결·문제의 원인을 짚어 말할 때 자주 써요"},"krDetail":[{"ko":"~에 있다, ~에 놓여 있다","explain":"그 안에 담겨 있다"}],"usageExamples":[{"en":"Great opportunities often lie in the problems that most people choose to ignore.","ko":"위대한 기회는 흔히 대부분의 사람들이 무시하기로 하는 문제들 속에 있다."},{"en":"The roots of the current conflict lie in decades of deep political mistrust.","ko":"현재 갈등의 뿌리는 수십 년에 걸친 깊은 정치적 불신에 있다."}],"grammarNote":"lie in은 '(원인·본질 등이) ~에 있다'를 뜻하며, 주어는 보통 problem·secret·answer 같은 추상명사이다. 동사 lie의 3단 변화 lie-lay-lain에 주의한다.","grammarQuiz":[{"sentence":"It is in critical thinking _____ the true value of a modern education lies.","ko":"현대 교육의 진정한 가치가 있는 곳은 바로 비판적 사고이다.","answer":"that","hint":"It is ~ that 강조구문 (전치사구 강조)"}]},
    {"id":"v08866","w":"symbiotic","pos":["phrase"],"ph":"/ˌsɪmbaɪˈɑːtɪk/","cefr":"B2","kr":["공생의, 공생하는"],"ex":[{"en":"Certain fish species maintain a symbiotic relationship with anemones that shelter and protect them.","ko":"특정 어종은 자신들을 보호하고 은신처를 제공하는 말미잘과 공생 관계를 유지한다."}],"mnemonic":{"soundHint":"'심바이오틱' → 'sym(함께)+bio(생명)' 함께 사는 생명","story":"말미잘과 물고기가 서로 지켜주며 함께 사는 공생 관계","hintConfidence":3},"pairs":{"buddyWords":[{"w":"mutualistic","ko":"상리공생의","reason":"동의어 — 서로 이득인"},{"w":"interdependent","ko":"상호의존적인","reason":"유의어 — 서로 기대는"},{"w":"parasitic","ko":"기생의","reason":"반의어 — 한쪽만 이득"}],"collocBest":[{"en":"a symbiotic relationship","ko":"공생 관계"},{"en":"symbiotic bacteria","ko":"공생 박테리아"}]},"nuance":{"koSimple":"서로 다른 존재가 함께 살아가며 이익을 주고받는 관계를 나타냅니다.","whenToUse":"생물학적 공생이나 기업·인간 관계의 상호 의존을 설명할 때 씁니다."},"krDetail":[{"ko":"공생의, 공생하는","explain":"서로 도우며 함께 사는"}],"usageExamples":[{"en":"The two companies formed a symbiotic partnership that benefited them both.","ko":"두 회사는 서로에게 이익이 되는 공생 관계를 맺었다."},{"en":"Bees and flowering plants share a remarkably symbiotic relationship.","ko":"벌과 꽃 피는 식물은 대단히 공생적인 관계를 이루고 있다."}],"grammarNote":"symbiotic은 형용사로 명사 앞에서 'symbiotic relationship/partnership'처럼 자주 쓰인다. 명사형은 symbiosis(공생), 부사형은 symbiotically이다.","grammarQuiz":[{"sentence":"Certain fish maintain a symbiotic relationship with anemones, _____ (shelter) them from predators. (분사구문)","ko":"특정 어종은 자신들을 포식자로부터 보호해 주는 말미잘과 공생 관계를 유지한다.","answer":"sheltering","hint":"분사구문(능동): -ing"}]},
    {"id":"v08749","w":"make for","pos":["phrase"],"ph":"/meɪk/","cefr":"B2","kr":["~에 도움이 되다","~ 쪽으로 가다[향하다]"],"ex":[{"en":"Clear communication between team members makes for a much more productive work environment.","ko":"팀원 간의 명확한 의사소통은 훨씬 더 생산적인 업무 환경에 도움이 된다."}],"mnemonic":{"soundHint":"메이크 포 → 'make(만들다) + for(~을 향해)'","story":"for(그 결과)를 make(만들어) 냄 = 도움이 되다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"contribute to","ko":"기여하다","reason":"동의어 — 보탬이 됨"},{"w":"head for","ko":"~로 향하다","reason":"동의어 — 그쪽으로 감"},{"w":"hinder","ko":"방해하다","reason":"반의어 — 막아섬"}],"collocBest":[{"en":"make for a good story","ko":"좋은 이야깃거리가 되다"},{"en":"make for the exit","ko":"출구 쪽으로 향하다"}]},"nuance":{"koSimple":"어떤 요소가 특정한 결과나 상황을 만들어 낸다는 뜻이에요","whenToUse":"좋은 조건·환경이 결과에 기여함을 설명할 때 자주 써요"},"krDetail":[{"ko":"~에 도움이 되다","explain":"~에 보탬이 되다"},{"ko":"~ 쪽으로 가다[향하다]","explain":"그쪽으로 나아가다"}],"usageExamples":[{"en":"Good weather and fresh food make for a perfect weekend picnic.","ko":"좋은 날씨와 신선한 음식은 완벽한 주말 소풍에 도움이 된다."},{"en":"The narrow, winding country roads make for a slow but very scenic drive.","ko":"좁고 구불구불한 시골길은 느리지만 아주 경치 좋은 드라이브에 도움이 된다."}],"grammarNote":"make for는 'A로 향하다(이동)'와 'A를 낳다·A에 기여하다(결과)' 두 뜻으로 갈리며, 뒤에 오는 목적어의 성격으로 구별한다.","grammarQuiz":[{"sentence":"Clear communication between team members, _____ makes for a productive environment, is essential.","ko":"생산적인 업무 환경에 도움이 되는 팀원 간의 명확한 의사소통은 필수적이다.","answer":"which","hint":"계속적 용법의 관계대명사"}]},
    {"id":"v08692","w":"hit upon","pos":["phrase"],"ph":"/hɪt/","cefr":"B2","kr":["~을 (우연히) 생각해 내다"],"ex":[{"en":"The scientist hit upon a brilliant solution while walking alone in the park.","ko":"그 과학자는 공원을 혼자 걸으며 훌륭한 해결책을 우연히 생각해 냈다."}],"mnemonic":{"soundHint":"히트 어폰 → '머리를 hit(때리듯) 문득 떠오름'","story":"산책 중 머리를 hit(치는) 아이디어를 우연히 만나다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"stumble upon","ko":"우연히 찾다","reason":"동의어 — 뜻밖에 얻음"},{"w":"devise","ko":"궁리해 내다","reason":"동의어 — 짜냄"},{"w":"overlook","ko":"놓치다","reason":"반의어 — 못 알아챔"}],"collocBest":[{"en":"hit upon a good idea","ko":"좋은 생각을 떠올리다"},{"en":"hit upon a solution","ko":"해결책을 우연히 생각해 내다"}]},"nuance":{"koSimple":"궁리하다가 뜻밖의 순간에 좋은 아이디어가 떠오른다는 뜻이에요","whenToUse":"창의적 발상이나 해결책이 우연히 떠올랐을 때 써요"},"krDetail":[{"ko":"~을 (우연히) 생각해 내다","explain":"문득 떠올리다"}],"usageExamples":[{"en":"She hit upon the idea for her novel during a long train journey.","ko":"그녀는 긴 기차 여행 중에 소설의 아이디어를 우연히 떠올렸다."},{"en":"After hours of debate, the committee finally hit upon a workable compromise.","ko":"몇 시간의 논쟁 끝에 위원회는 마침내 실행 가능한 타협안을 생각해 냈다."}],"grammarNote":"hit upon은 뒤에 명사(아이디어·해결책)를 바로 취하는 구동사로, hit on으로도 쓴다. 과거형은 형태가 변하지 않는 hit(불규칙)이다.","grammarQuiz":[{"sentence":"_____ upon a brilliant solution, the scientist rushed back to write it down.","ko":"훌륭한 해결책을 우연히 생각해 내고서, 그 과학자는 그것을 적기 위해 서둘러 돌아갔다.","answer":"Hitting","hint":"분사구문(능동/현재분사) 문두"}]},
    {"id":"v08686","w":"go all out for","pos":["phrase"],"ph":"/ɡoʊ/","cefr":"B2","kr":["(~에) 전력을 다하다, 총력을 기울이다"],"ex":[{"en":"The startup went all out for market share, spending heavily on aggressive advertising.","ko":"그 신생 기업은 시장 점유율을 위해 전력을 다하며 공격적인 광고에 큰 돈을 썼다."}],"mnemonic":{"soundHint":"고 올 아웃 포 → 'all(모든 것을) out(꺼내다)'","story":"가진 것 all(모두) out(꺼내) 쏟다 = 전력을 다하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"strive","ko":"애쓰다","reason":"동의어 — 힘껏 노력"},{"w":"commit","ko":"전념하다","reason":"동의어 — 온전히 쏟음"},{"w":"slack off","ko":"게을리하다","reason":"반의어 — 힘 뺌"}],"collocBest":[{"en":"go all out for victory","ko":"승리를 위해 전력을 다하다"},{"en":"go all out for the project","ko":"그 프로젝트에 총력을 기울이다"}]},"nuance":{"koSimple":"어떤 목표에 자기 자원과 힘을 전부 쏟아붓는다는 뜻이에요","whenToUse":"경쟁·프로젝트에서 총력을 기울일 때 강조하여 써요"},"krDetail":[{"ko":"(~에) 전력을 다하다, 총력을 기울이다","explain":"온 힘을 쏟아붓다"}],"usageExamples":[{"en":"The team went all out for victory in the final match.","ko":"그 팀은 결승전에서 승리를 위해 전력을 다했다."},{"en":"They went all out for the wedding, sparing no expense at all.","ko":"그들은 결혼식에 총력을 기울여 비용을 조금도 아끼지 않았다."}],"grammarNote":"'go all out'만으로도 '전력을 다하다'라는 뜻이며, 목적·대상을 밝힐 때 뒤에 'for + 명사'를 붙인다. '~하려고 전력을 다하다'는 'go all out to do'로 표현한다.","grammarQuiz":[{"sentence":"The startup was determined _____ go all out for market share and rapid growth.","ko":"그 신생 기업은 시장 점유율과 급속한 성장을 위해 전력을 다하기로 결심했다.","answer":"to","hint":"be determined + to부정사"}]},
    {"id":"v08884","w":"transcend","pos":["verb"],"ph":"/trænˈsɛnd/","cefr":"B2","kr":["넘다, 초월하다","능가하다"],"ex":[{"en":"Great works of art transcend cultural boundaries and speak to universal human experiences.","ko":"위대한 예술 작품은 문화적 경계를 초월하여 보편적인 인간 경험에 대해 말한다."}],"mnemonic":{"soundHint":"'트랜센드' → 'trans(넘어)+scend(오르다)' 넘어서 오르다","story":"예술 작품이 문화의 벽을 훌쩍 뛰어넘어 모두에게 말을 걸다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"surpass","ko":"능가하다","reason":"동의어 — 앞질러 넘다"},{"w":"exceed","ko":"넘어서다","reason":"유의어 — 한계를 넘음"},{"w":"fall short","ko":"못 미치다","reason":"반의어 — 기준에 못 닿음"}],"collocBest":[{"en":"transcend cultural boundaries","ko":"문화적 경계를 초월하다"},{"en":"transcend differences","ko":"차이를 뛰어넘다"}]},"nuance":{"koSimple":"일반적 한계나 경계를 뛰어넘어 그 이상의 차원에 도달하는 것을 뜻합니다.","whenToUse":"예술·철학·종교 등 보편성이나 초월적 가치를 논할 때 격식 있게 씁니다."},"krDetail":[{"ko":"넘다, 초월하다","explain":"한계를 뛰어넘다"},{"ko":"능가하다","explain":"남보다 앞서다"}],"usageExamples":[{"en":"Music can transcend language and connect people from very different cultures.","ko":"음악은 언어를 초월하여 매우 다른 문화의 사람들을 이어 줄 수 있다."},{"en":"Her quiet kindness seemed to transcend ordinary human generosity.","ko":"그녀의 조용한 친절은 평범한 인간의 관대함을 넘어서는 듯했다."}],"grammarNote":"transcend는 타동사로 목적어를 직접 취하므로 뒤에 전치사가 필요 없다(예: transcend boundaries). 명사형은 transcendence, 형용사형은 transcendent이다.","grammarQuiz":[{"sentence":"Great works of art _____ (transcend) cultural boundaries throughout history. (현재완료)","ko":"위대한 예술 작품들은 역사를 통해 문화적 경계를 초월해 왔다.","answer":"have transcended","hint":"throughout history → 현재완료 계속"}]},
    {"id":"v08644","w":"entice","pos":["verb"],"ph":"/ɪnˈtaɪs/","cefr":"B2","kr":["유도하다"],"ex":[{"en":"Retailers use bright colors and cheerful music to entice customers into their stores.","ko":"소매업자들은 손님을 매장으로 유도하기 위해 밝은 색상과 경쾌한 음악을 사용한다."}],"mnemonic":{"soundHint":"인타이스 → '안으로(en) 타이스(꼬여 끌어들임)'","story":"달콤한 음악으로 안으로 꼬여 끌어들이다 = 유도.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"lure","ko":"꾀다","reason":"동의어 — 미끼로 끎"},{"w":"tempt","ko":"유혹하다","reason":"동의어 — 마음 흔듦"},{"w":"repel","ko":"쫓아내다","reason":"반의어 — 밀어냄"}],"collocBest":[{"en":"entice customers to buy","ko":"고객이 사도록 유도하다"},{"en":"entice with low prices","ko":"저렴한 가격으로 유혹하다"}]},"nuance":{"koSimple":"매력적 요소로 마음을 끌어 어떤 행동을 하게 만드는 뜻이에요","whenToUse":"마케팅·광고에서 고객을 끌어들이는 상황에 써요"},"krDetail":[{"ko":"유도하다","explain":"꾀어서 이끌다"}],"usageExamples":[{"en":"Low prices are used to entice shoppers into buying more than they need.","ko":"낮은 가격은 쇼핑객이 필요 이상으로 사도록 유도하는 데 쓰인다."},{"en":"The company enticed him to join with the promise of a huge bonus.","ko":"그 회사는 거액의 보너스를 약속하며 그가 합류하도록 꾀었다."}],"grammarNote":"'entice + 사람 + to do'(~하도록 꾀다) 또는 'entice + 사람 + into -ing'(~하도록 유인하다) 구조로 자주 쓴다. 매력적인 것으로 유혹한다는 뉘앙스가 있다.","grammarQuiz":[{"sentence":"Cheerful background music entices customers _____ enter the store and browse more freely.","ko":"경쾌한 배경 음악은 손님들이 매장에 들어와 더 자유롭게 둘러보도록 유도한다.","answer":"to","hint":"entice + 목적어 + to부정사 (5형식)"}]},
    {"id":"v08755","w":"make the most of","pos":["phrase"],"ph":"/moʊst/","cefr":"B2","kr":["~을 최대한 활용하다"],"ex":[{"en":"Students should make the most of the resources available in the school's central library.","ko":"학생들은 학교 중앙 도서관에서 이용 가능한 자원을 최대한 활용해야 한다."}],"mnemonic":{"soundHint":"메이크 더 모스트 오브 → 'most(최대)로 make(만듦)'","story":"자원의 most(최대치)를 make(뽑아냄) = 최대한 활용.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"utilize","ko":"활용하다","reason":"동의어 — 잘 쓰다"},{"w":"capitalize on","ko":"~을 이용하다","reason":"동의어 — 기회로 삼다"},{"w":"waste","ko":"낭비하다","reason":"반의어 — 헛되이 쓰다"}],"collocBest":[{"en":"make the most of your time","ko":"시간을 최대한 활용하다"},{"en":"make the most of the chance","ko":"기회를 최대한 활용하다"}]},"nuance":{"koSimple":"주어진 자원이나 기회를 낭비 없이 최대한 살린다는 뜻이에요","whenToUse":"시간·자원·기회를 알뜰히 활용하라 조언할 때 자주 써요"},"krDetail":[{"ko":"~을 최대한 활용하다","explain":"있는 걸 최대로 잘 쓰다"}],"usageExamples":[{"en":"We should make the most of this sunny weather and go hiking today.","ko":"우리는 이 화창한 날씨를 최대한 활용해서 오늘 등산을 가야 한다."},{"en":"Smart travelers make the most of every single hour of their short trip.","ko":"현명한 여행자들은 짧은 여행의 모든 순간을 최대한 활용한다."}],"grammarNote":"make the most of 뒤에는 명사(구)가 와서 '(한정된 것을) 최대한 활용하다'를 뜻한다. make the best of(어려운 상황을 그런대로 견디다)와 의미 차이에 주의한다.","grammarQuiz":[{"sentence":"The teacher _____ students make the most of the library's rich collection of resources.","ko":"그 선생님은 학생들이 도서관의 풍부한 자원을 최대한 활용하게 했다.","answer":"had","hint":"사역동사 have + 목적어 + 동사원형 (5형식)"}]},
    {"id":"v08752","w":"make out","pos":["phrase"],"ph":"/meɪk/","cefr":"B2","kr":["~을 이해하다[알다]","문서 등을) 작성하다"],"ex":[{"en":"I could barely make out what the speaker was saying because of the loud crowd.","ko":"시끄러운 군중 때문에 나는 연사가 말하고 있는 것을 거의 알아들을 수 없었다."}],"mnemonic":{"soundHint":"메이크 아웃 → 'make(만들어) out(밖으로) 끄집어냄'","story":"의미를 make(만들어) out(끄집어냄) = 이해·식별.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"discern","ko":"식별하다","reason":"동의어 — 겨우 알아봄"},{"w":"decipher","ko":"알아내다","reason":"동의어 — 풀어 읽음"},{"w":"overlook","ko":"못 보다","reason":"반의어 — 지나침"}],"collocBest":[{"en":"make out the words","ko":"그 단어들을 알아보다"},{"en":"hard to make out","ko":"알아보기 어려운"}]},"nuance":{"koSimple":"흐릿하거나 복잡한 정보를 겨우 알아채고 파악한다는 뜻이에요","whenToUse":"잘 안 들리는 말이나 희미한 글씨를 겨우 알아볼 때 써요"},"krDetail":[{"ko":"~을 이해하다[알다]","explain":"겨우 알아보다"},{"ko":"문서 등을) 작성하다","explain":"서류를 써서 채우다"}],"usageExamples":[{"en":"It was too dark to make out the faces of the people standing outside.","ko":"너무 어두워서 밖에 서 있는 사람들의 얼굴을 알아볼 수 없었다."},{"en":"Please make out the check to the charity, not to me personally.","ko":"수표는 제 개인이 아니라 그 자선단체 앞으로 작성해 주세요."}],"grammarNote":"make out은 '(간신히) 알아보다·이해하다'와 '(서류·수표를) 작성하다' 두 뜻으로 쓰인다. 목적어가 대명사이면 make it out처럼 사이에 넣는다.","grammarQuiz":[{"sentence":"I could barely make out _____ the speaker was saying because of the loud crowd.","ko":"시끄러운 군중 때문에 나는 연사가 말하고 있는 것을 거의 알아들을 수 없었다.","answer":"what","hint":"관계대명사 what (~하는 것, 목적어절)"}]},
    {"id":"v08647","w":"estimation","pos":["noun"],"ph":"/ˌɛstɪˈmeɪʃən/","cefr":"B2","kr":["판단, 평가","의견","추정, 견적(액)"],"ex":[{"en":"In my estimation, the government's response has been far too slow and disorganized.","ko":"내 판단으로는 정부의 대응이 너무 느리고 체계적이지 못했다."}],"mnemonic":{"soundHint":"에스티메이션 → 'estimate(추정)'의 명사","story":"내 estimate(추정)로 = 내 판단·견적으로.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"assessment","ko":"평가","reason":"동의어 — 값을 매김"},{"w":"appraisal","ko":"감정","reason":"동의어 — 가치 판단"},{"w":"measurement","ko":"측정","reason":"반의어 — 정확히 잼"}],"collocBest":[{"en":"in my estimation","ko":"내 판단으로는"},{"en":"a rough estimation","ko":"대략적인 추정"}]},"nuance":{"koSimple":"상황·가치·양을 살펴 내리는 개인적 판단이나 견해를 뜻해요","whenToUse":"평가 의견을 말하거나 대략적 수치를 추정할 때 써요"},"krDetail":[{"ko":"판단, 평가","explain":"가치를 헤아려 매김"},{"ko":"의견","explain":"어떤 일에 대한 생각"},{"ko":"추정, 견적(액)","explain":"어림잡아 셈한 값"}],"usageExamples":[{"en":"In my estimation, the plan is far too risky to approve.","ko":"내 판단으로는 그 계획은 승인하기에 너무 위험하다."},{"en":"The rough estimation of costs turned out to be surprisingly accurate.","ko":"대략적인 비용 추정이 놀랍도록 정확한 것으로 드러났다."}],"grammarNote":"'in my/one's estimation'(내 판단으로는)이라는 관용구로 자주 쓰이며, 이때는 '의견·판단'의 뜻이다. 수치의 '추정치'를 뜻할 때는 'estimate'와 바꿔 쓸 수 있다.","grammarQuiz":[{"sentence":"In my estimation, the policy, _____ was passed hastily, needs urgent revision.","ko":"내 판단으로는, 성급히 통과된 그 정책은 긴급한 수정이 필요하다.","answer":"which","hint":"계속적 용법의 관계대명사"}]},
    {"id":"v08680","w":"give away","pos":["phrase"],"ph":"/ɡɪv/","cefr":"B2","kr":["기부하다, 나눠 주다","양보하다, 양도하다","폭로하다, 누설하다"],"ex":[{"en":"The wealthy philanthropist decided to give away most of his fortune to charity.","ko":"그 부유한 자선가는 재산의 대부분을 자선단체에 기부하기로 결정했다."}],"mnemonic":{"soundHint":"기브 어웨이 → 'give(주다) + away(멀리)'","story":"재산을 away(멀리) give(줘 버리다) = 기부·폭로.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"donate","ko":"기부하다","reason":"동의어 — 공짜로 줌"},{"w":"reveal","ko":"폭로하다","reason":"동의어 — 비밀을 밝힘"},{"w":"keep","ko":"간직하다","reason":"반의어 — 안 내줌"}],"collocBest":[{"en":"give away free samples","ko":"무료 샘플을 나눠 주다"},{"en":"give away the secret","ko":"비밀을 누설하다"}]},"nuance":{"koSimple":"자기 것을 남에게 대가 없이 넘겨주거나 나눠 준다는 뜻이에요","whenToUse":"자선 기부, 선물 증정, 비밀 폭로 등 상황에 두루 써요"},"krDetail":[{"ko":"기부하다, 나눠 주다","explain":"공짜로 남에게 주다"},{"ko":"양보하다, 양도하다","explain":"권리를 남에게 넘기다"},{"ko":"폭로하다, 누설하다","explain":"비밀을 밝혀 버리다"}],"usageExamples":[{"en":"The store is giving away free samples to attract new customers.","ko":"그 가게는 신규 고객을 끌기 위해 무료 샘플을 나눠 주고 있다."},{"en":"His trembling voice gave away how nervous he really was.","ko":"떨리는 목소리가 그가 실제로 얼마나 긴장했는지를 드러냈다."}],"grammarNote":"타동사구로 대명사 목적어는 'give it away'처럼 사이에 넣는다. 문맥에 따라 '거저 주다', '(비밀을) 누설하다', '(정답을) 무심코 알려주다' 등 뜻이 달라진다.","grammarQuiz":[{"sentence":"Most of his enormous fortune _____ given away to charity by the philanthropist.","ko":"그의 막대한 재산 대부분은 그 자선가에 의해 자선단체에 기부되었다.","answer":"was","hint":"수동태(be + p.p.) 과거형"}]},
    {"id":"v08704","w":"in a vacuum","pos":["phrase"],"ph":"/ˈvækjuːm/","cefr":"B2","kr":["외부와 단절된 상태에서"],"ex":[{"en":"No political decision is ever made in a vacuum, entirely isolated from public opinion.","ko":"어떤 정치적 결정도 여론과 완전히 분리된, 외부와 단절된 상태에서 내려지지는 않는다."}],"mnemonic":{"soundHint":"인 어 배큠 → 'vacuum(진공)' 안에","story":"vacuum(진공) 안 = 외부와 완전 단절.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"in isolation","ko":"고립되어","reason":"동의어 — 홀로 떨어져"},{"w":"independently","ko":"독립적으로","reason":"동의어 — 따로따로"},{"w":"in context","ko":"맥락 속에서","reason":"반의어 — 상황과 함께"}],"collocBest":[{"en":"operate in a vacuum","ko":"외부와 단절된 채로 운영하다"},{"en":"decisions made in a vacuum","ko":"고립된 상태에서 내린 결정"}]},"nuance":{"koSimple":"주변 상황이나 맥락과 완전히 분리된 고립 상태를 뜻해요","whenToUse":"결정·판단이 홀로 이뤄질 수 없음을 강조할 때 써요"},"krDetail":[{"ko":"외부와 단절된 상태에서","explain":"바깥과 동떨어진 채"}],"usageExamples":[{"en":"Language does not develop in a vacuum but through constant social interaction.","ko":"언어는 진공 상태에서 발달하는 것이 아니라 끊임없는 사회적 상호작용을 통해 발달한다."},{"en":"You cannot judge a work of art in a vacuum, ignoring its historical context.","ko":"역사적 맥락을 무시한 채 예술 작품을 고립된 상태에서 판단할 수는 없다."}],"grammarNote":"in a vacuum은 동사 뒤에서 부사구로 쓰여 '외부와 단절된 채, 진공 상태처럼'을 뜻하며, exist·operate·develop 등의 동사와 자주 결합한다.","grammarQuiz":[{"sentence":"No political decision _____ ever made in a vacuum, entirely isolated from public opinion.","ko":"어떤 정치적 결정도 여론과 완전히 분리된, 외부와 단절된 상태에서 내려지지는 않는다.","answer":"is","hint":"수동태(be + p.p.) 현재형"}]},
    {"id":"v08620","w":"do away with","pos":["phrase"],"ph":"/duː/","cefr":"B2","kr":["~을 폐지하다[버리다]","~을 처분하다"],"ex":[{"en":"Many activists urge the government to do away with outdated laws restricting personal freedom.","ko":"많은 운동가들은 정부에 개인의 자유를 제한하는 낡은 법을 폐지할 것을 촉구한다."}],"mnemonic":{"soundHint":"두 어웨이 위드 → 'away(멀리 치워버림)'","story":"낡은 법을 away(멀리) 치워버려 = 폐지하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"abolish","ko":"폐지하다","reason":"동의어 — 제도를 없앰"},{"w":"eliminate","ko":"제거하다","reason":"동의어 — 치워 버림"},{"w":"establish","ko":"세우다","reason":"반의어 — 새로 만듦"}],"collocBest":[{"en":"do away with the rule","ko":"규칙을 폐지하다"},{"en":"do away with paperwork","ko":"서류 작업을 없애다"}]},"nuance":{"koSimple":"오래된 제도나 관습을 완전히 없애 버린다는 뜻이에요","whenToUse":"낡은 법·규칙 폐지나 나쁜 습관을 버릴 때 자주 써요"},"krDetail":[{"ko":"~을 폐지하다[버리다]","explain":"제도를 없애 버리다"},{"ko":"~을 처분하다","explain":"물건을 내다 버리다"}],"usageExamples":[{"en":"The new manager decided to do away with unnecessary paperwork.","ko":"새 관리자는 불필요한 서류 작업을 없애기로 했다."},{"en":"Some reformers want to do away with the outdated grading system entirely.","ko":"일부 개혁가들은 낡은 성적 평가 제도를 완전히 폐지하기를 원한다."}],"grammarNote":"'없애다·폐지하다'를 뜻하는 세 단어짜리 동사구로, 'with' 뒤에 없앨 대상이 온다. 뜻이 비슷한 'abolish' 한 단어로 바꿔 쓸 수 있다.","grammarQuiz":[{"sentence":"Outdated laws restricting personal freedom _____ done away with after years of protest.","ko":"개인의 자유를 제한하는 낡은 법들은 수년간의 항의 끝에 폐지되었다.","answer":"were","hint":"수동태(be + p.p.) 과거형"}]},
    {"id":"v08878","w":"the other way around","pos":["phrase"],"ph":"/əˈraʊnd/","cefr":"B2","kr":["반대로, 거꾸로"],"ex":[{"en":"Contrary to popular belief, it was the other way around; success followed her hard work.","ko":"일반적인 통념과는 반대로, 실제로는 정반대였다. 성공이 그녀의 노력을 뒤따랐다."}],"mnemonic":{"soundHint":"'디 아더 웨이 어라운드' → 다른(other) 방향(way)으로 돌려서","story":"노력이 성공을 낳는 게 아니라 성공이 노력을 뒤따랐다는 반대 상황","hintConfidence":2},"pairs":{"buddyWords":[{"w":"vice versa","ko":"반대로","reason":"동의어 — 거꾸로 마찬가지"},{"w":"reverse","ko":"역으로","reason":"유의어 — 뒤바뀐"},{"w":"same way","ko":"같은 방향","reason":"반의어 — 그대로"}],"collocBest":[{"en":"it's the other way around","ko":"그것은 정반대다"},{"en":"do it the other way around","ko":"거꾸로 하다"}]},"nuance":{"koSimple":"예상과 정반대의 상황이거나 순서가 뒤바뀐 경우를 강조하는 표현입니다.","whenToUse":"상대의 착각을 바로잡거나 통념과 반대되는 사실을 지적할 때 씁니다."},"krDetail":[{"ko":"반대로, 거꾸로","explain":"방향이 정반대로"}],"usageExamples":[{"en":"I thought he was helping her, but it was actually the other way around.","ko":"나는 그가 그녀를 돕는 줄 알았는데, 사실은 그 반대였다."},{"en":"You can add the milk to the coffee, or do it the other way around.","ko":"커피에 우유를 넣어도 되고, 아니면 반대로 해도 된다."}],"grammarNote":"the other way around는 '반대로, 거꾸로'를 뜻하는 부사구로, 앞 문장의 순서·관계가 정반대임을 나타낼 때 쓴다. 영국식으로는 the other way round도 같은 뜻이다.","grammarQuiz":[{"sentence":"It was success _____ followed her hard work, not the other way around. (강조구문)","ko":"그녀의 노력을 뒤따른 것은 바로 성공이었지, 그 반대가 아니었다.","answer":"that","hint":"It is/was ~ that 강조구문"}]},
    {"id":"v08653","w":"exterminate","pos":["verb"],"ph":"/ɪkˈstɜːrmɪneɪt/","cefr":"B2","kr":["근절하다"],"ex":[{"en":"Global efforts to exterminate malaria have made remarkable progress in the past decade.","ko":"말라리아를 근절하려는 세계적 노력은 지난 10년간 눈부신 진전을 이루었다."}],"mnemonic":{"soundHint":"엑스터미네이트 → 'ex(완전히) + terminate(끝내다)'","story":"ex(완전히) terminate(끝장) = 근절하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"eradicate","ko":"근절하다","reason":"동의어 — 뿌리 뽑음"},{"w":"eliminate","ko":"제거하다","reason":"동의어 — 없애 버림"},{"w":"preserve","ko":"보존하다","reason":"반의어 — 지켜 남김"}],"collocBest":[{"en":"exterminate the pests","ko":"해충을 박멸하다"},{"en":"exterminate an entire species","ko":"한 종 전체를 근절하다"}]},"nuance":{"koSimple":"해로운 존재를 뿌리째 없애 완전히 사라지게 만드는 뜻이에요","whenToUse":"해충 박멸이나 질병 퇴치처럼 강한 조치를 말할 때 써요"},"krDetail":[{"ko":"근절하다","explain":"뿌리째 없애다"}],"usageExamples":[{"en":"The city hired professionals to exterminate the rats in the sewers.","ko":"시는 하수구의 쥐를 박멸하기 위해 전문가들을 고용했다."},{"en":"Entire species can be exterminated by the loss of their habitat.","ko":"서식지 상실로 인해 종 전체가 몰살될 수 있다."}],"grammarNote":"'(해충·동물·집단을) 몰살하다, 근절하다'라는 강한 뜻의 타동사로, 대상을 완전히 없앤다는 의미다. 명사형은 'extermination'이다.","grammarQuiz":[{"sentence":"Malaria _____ being exterminated in many regions through coordinated global efforts.","ko":"말라리아는 조율된 세계적 노력을 통해 많은 지역에서 근절되고 있다.","answer":"is","hint":"진행형 수동태 (is being p.p.)"}]},
    {"id":"v08635","w":"dwell on","pos":["phrase"],"ph":"/dwɛl/","cefr":"B2","kr":["~을 곰곰이 생각하다","~을 자세히 설명하다"],"ex":[{"en":"Successful athletes do not dwell on past failures during the actual competition.","ko":"성공적인 운동선수들은 실제 경기 중에 과거의 실패를 곰곰이 생각하지 않는다."}],"mnemonic":{"soundHint":"드웰 온 → 'dwell(살다) + on(위에)'","story":"그 문제 위(on)에서 계속 dwell(머무름) = 곱씹다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"ponder","ko":"숙고하다","reason":"동의어 — 곰곰 생각"},{"w":"obsess","ko":"집착하다","reason":"동의어 — 계속 매달림"},{"w":"dismiss","ko":"떨쳐내다","reason":"반의어 — 흘려보냄"}],"collocBest":[{"en":"dwell on the past","ko":"과거를 곱씹다"},{"en":"dwell on my mistakes","ko":"내 실수를 곱씹다"}]},"nuance":{"koSimple":"어떤 생각이나 감정에서 벗어나지 못하고 계속 붙잡는다는 뜻이에요","whenToUse":"과거의 실수나 걱정에 매여 있는 상황을 표현해요"},"krDetail":[{"ko":"~을 곰곰이 생각하다","explain":"계속 마음에 담아두다"},{"ko":"~을 자세히 설명하다","explain":"길게 늘어놓아 말하다"}],"usageExamples":[{"en":"Try not to dwell on your mistakes; learn from them and move forward.","ko":"실수를 곱씹지 말고, 거기서 배우고 앞으로 나아가라."},{"en":"The speech dwelt on the achievements of the past decade.","ko":"그 연설은 지난 10년의 성과를 자세히 다루었다."}],"grammarNote":"전치사 'on' 뒤에 대상이 오며, 흔히 부정적인 일을 '오래 곱씹다'라는 뉘앙스로 쓴다. 과거형은 'dwelt' 또는 'dwelled' 둘 다 가능하다.","grammarQuiz":[{"sentence":"Coaches often tell athletes not _____ dwell on past failures during a competition.","ko":"코치들은 종종 운동선수들에게 경기 중에 과거의 실패에 얽매이지 말라고 말한다.","answer":"to","hint":"tell + 목적어 + to부정사 (5형식, 부정형은 not to)"}]},
    {"id":"v08821","w":"renovation","pos":["noun"],"ph":"/ˌrɛnəˈveɪʃən/","cefr":"B2","kr":["개조"],"ex":[{"en":"The city council approved the renovation of the historic library to preserve its architecture.","ko":"시의회는 건축 양식을 보존하기 위해 그 역사적인 도서관의 개조를 승인했다."}],"mnemonic":{"soundHint":"'레노베이션' → 're(다시)+nova(새로운)' 다시 새것으로","story":"낡은 도서관을 다시 새것처럼 개조하는 공사","hintConfidence":3},"pairs":{"buddyWords":[{"w":"remodeling","ko":"리모델링","reason":"동의어 — 고쳐 짓기"},{"w":"restoration","ko":"복원","reason":"유의어 — 되살려 고침"},{"w":"demolition","ko":"철거","reason":"반의어 — 헐어 없앰"}],"collocBest":[{"en":"home renovation","ko":"집 개조"},{"en":"closed for renovation","ko":"개조 공사로 문을 닫은"}]},"nuance":{"koSimple":"낡거나 손상된 건물·공간을 고쳐 새롭게 개선하는 작업을 뜻합니다.","whenToUse":"건물 리모델링, 시설 보수, 문화재 복원 등 대규모 개조 상황에서 씁니다."},"krDetail":[{"ko":"개조","explain":"고쳐서 새롭게 함"}],"usageExamples":[{"en":"The hotel was closed for three months during the major renovation.","ko":"그 호텔은 대대적인 개조 공사 동안 세 달간 문을 닫았다."},{"en":"Extensive renovations transformed the old warehouse into a modern art gallery.","ko":"대규모 개조 공사가 그 낡은 창고를 현대적인 미술관으로 탈바꿈시켰다."}],"grammarNote":"renovation은 '개조·수리'를 뜻하는 명사로 가산·불가산 모두 쓰인다. under renovation(개조 중인)이라는 표현과 동사형 renovate를 함께 익힌다.","grammarQuiz":[{"sentence":"The council approved the renovation _____ (design) to preserve the architecture. (분사)","ko":"시의회는 건축 양식을 보존하도록 설계된 개조를 승인했다.","answer":"designed","hint":"명사를 뒤에서 수식하는 과거분사(수동)"}]},
    {"id":"v08737","w":"layoff","pos":["phrase"],"ph":"/ˈleɪɔːf/","cefr":"B2","kr":["해고[휴직] (기간)"],"ex":[{"en":"The factory announced sudden mass layoffs following a sharp decline in overseas orders.","ko":"그 공장은 해외 주문의 급격한 감소에 따라 갑작스러운 대규모 해고를 발표했다."}],"mnemonic":{"soundHint":"레이오프 → 'lay(내려놓다) + off(떠나)'","story":"일자리에서 lay(내려놓게) off(떠나게) = 해고.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"dismissal","ko":"해고","reason":"동의어 — 일 그만두게 함"},{"w":"downsizing","ko":"감원","reason":"관련어 — 인원 줄임"},{"w":"hiring","ko":"고용","reason":"반의어 — 새로 뽑음"}],"collocBest":[{"en":"mass layoffs","ko":"대량 해고"},{"en":"announce layoffs","ko":"해고를 발표하다"}]},"nuance":{"koSimple":"회사 사정으로 노동자를 일시 또는 영구적으로 내보내는 일이에요","whenToUse":"경제 위기·구조조정 관련 뉴스나 노동 문제에 자주 써요"},"krDetail":[{"ko":"해고[휴직] (기간)","explain":"일자리를 잃음"}],"usageExamples":[{"en":"The sudden layoff left hundreds of workers searching for new jobs.","ko":"갑작스러운 해고로 수백 명의 노동자가 새 일자리를 찾아 나서게 되었다."},{"en":"The company avoided layoffs by cutting its executives' salaries instead.","ko":"그 회사는 대신 임원들의 급여를 삭감함으로써 해고를 피했다."}],"grammarNote":"layoff는 '(경영상의) 해고·정리해고'를 뜻하는 가산명사로 한 단어로 붙여 쓴다. 동사로 쓸 때는 lay off처럼 두 단어로 띄어 쓴다는 점에 주의한다.","grammarQuiz":[{"sentence":"Sudden mass layoffs _____ announced by the factory following a sharp decline in orders.","ko":"갑작스러운 대규모 해고가 주문의 급격한 감소에 따라 그 공장에 의해 발표되었다.","answer":"were","hint":"수동태(be + p.p.) 과거형"}]},
    {"id":"v08782","w":"overflow","pos":["verb"],"ph":"/ˌoʊvərˈfloʊ/","cefr":"B2","kr":["넘치다","범람하다","(감정이) 가득 차다, 충만하다","넘침","범람","과잉, 과도"],"ex":[{"en":"Heavy rains caused the local river to overflow its banks and flood nearby neighborhoods.","ko":"폭우가 지역 강의 둑을 넘게 하여 인근 동네를 침수시켰다."}],"mnemonic":{"soundHint":"오버플로우 → 'over(넘어) + flow(흐름)'","story":"강물이 둑을 over(넘어) flow(흐름) = 넘치다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"flood","ko":"범람하다","reason":"동의어 — 물이 넘치다"},{"w":"brim","ko":"가득 차다","reason":"유의어 — 넘칠 듯 차다"},{"w":"drain","ko":"빠지다","reason":"반의어 — 물이 빠짐"}],"collocBest":[{"en":"the river overflowed its banks","ko":"강이 둑을 넘쳐흘렀다"},{"en":"overflow with joy","ko":"기쁨으로 가득 차다"}]},"nuance":{"koSimple":"용기나 그릇에 담긴 것이 한계를 넘어 밖으로 흘러나오는 뜻이에요","whenToUse":"강 범람·감정 폭발·데이터 초과 상황에 두루 써요"},"krDetail":[{"ko":"넘치다","explain":"가득 차 밖으로 흘러나오다"},{"ko":"범람하다","explain":"물이 넘쳐 퍼지다"},{"ko":"(감정이) 가득 차다, 충만하다","explain":"마음이 벅차게 가득하다"},{"ko":"넘침","explain":"밖으로 흘러넘침"},{"ko":"범람","explain":"물이 넘쳐흐름"},{"ko":"과잉, 과도","explain":"필요보다 너무 많음"}],"usageExamples":[{"en":"The sink began to overflow because the drain was completely blocked.","ko":"배수구가 완전히 막혀 있어서 싱크대가 넘치기 시작했다."},{"en":"Her heart seemed to overflow with joy at the surprise family reunion.","ko":"깜짝 가족 상봉에 그녀의 마음은 기쁨으로 가득 차 넘치는 듯했다."}],"grammarNote":"overflow는 '(액체가) 넘치다'와 'overflow with ~(~로 가득 차다)'로 쓰인다. 명사로는 an overflow of ~(~의 과잉)처럼도 쓰이는 다의어다.","grammarQuiz":[{"sentence":"_____ its banks after the heavy rains, the river flooded the neighboring farmland.","ko":"폭우 후 둑을 넘으며, 그 강은 인근 농지를 침수시켰다.","answer":"Overflowing","hint":"분사구문(능동/현재분사) 문두"}]},
    {"id":"v08662","w":"fetus","pos":["phrase"],"ph":"/ˈfiːtəs/","cefr":"B2","kr":["(임신 9주후의) 태아"],"ex":[{"en":"Doctors can monitor the developing fetus with high-resolution ultrasound imaging throughout pregnancy.","ko":"의사들은 임신 기간 내내 고해상도 초음파 영상으로 자라나는 태아를 관찰할 수 있다."}],"mnemonic":{"soundHint":"피터스 → '피(生) + 태(胎)스' 자궁 속 아기","story":"자궁 속 '피'와 '태'가 자라는 존재 = 태아.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"embryo","ko":"배아","reason":"관련어 — 더 이른 단계"},{"w":"womb","ko":"자궁","reason":"관련어 — 자라는 곳"},{"w":"newborn","ko":"신생아","reason":"반의어 — 태어난 뒤"}],"collocBest":[{"en":"a developing fetus","ko":"발달 중인 태아"},{"en":"the health of the fetus","ko":"태아의 건강"}]},"nuance":{"koSimple":"임신 초기 이후 자궁 속에서 자라는 아기를 가리키는 말이에요","whenToUse":"산부인과·발달학 등 의학적 문맥에서 정확히 써요"},"krDetail":[{"ko":"(임신 9주후의) 태아","explain":"배 속에서 자라는 아기"}],"usageExamples":[{"en":"The health of the fetus depends heavily on the mother's nutrition.","ko":"태아의 건강은 어머니의 영양 상태에 크게 좌우된다."},{"en":"By this stage, the fetus can already respond to outside sounds.","ko":"이 단계에 이르면 태아는 이미 바깥 소리에 반응할 수 있다."}],"grammarNote":"임신 후기의 '태아'를 뜻하는 가산 명사로, 복수형은 'fetuses'다. 영국식 철자는 'foetus'이며, 형용사형은 'fetal'(태아의)이다.","grammarQuiz":[{"sentence":"The developing fetus _____ monitored by doctors using high-resolution ultrasound imaging.","ko":"자라나는 태아는 의사들에 의해 고해상도 초음파 영상으로 관찰된다.","answer":"is","hint":"수동태(be + p.p.) 현재형"}]},
    {"id":"v08791","w":"pin down","pos":["phrase"],"ph":"/pɪn/","cefr":"B2","kr":["고정시키다"],"ex":[{"en":"Investigators struggled to pin down the exact cause of the mysterious factory explosion.","ko":"수사관들은 그 미스터리한 공장 폭발의 정확한 원인을 규명하기 위해 애썼다."}],"mnemonic":{"soundHint":"핀 다운 → 'pin(핀)으로 down(꽂아 고정)'","story":"핀으로 down(꽂아) 원인을 확정 = 규명·고정.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"fix","ko":"고정하다","reason":"동의어 — 못 움직이게 하다"},{"w":"pinpoint","ko":"정확히 짚다","reason":"유의어 — 콕 집어내다"},{"w":"release","ko":"풀어주다","reason":"반의어 — 놓아주다"}],"collocBest":[{"en":"hard to pin down","ko":"규정하기 어렵다"},{"en":"pin down the exact date","ko":"정확한 날짜를 확정하다"}]},"nuance":{"koSimple":"모호한 것을 명확히 규정하거나 대상을 꼼짝 못 하게 하는 뜻이에요","whenToUse":"원인 규명, 위치 특정, 상대 제압 상황에 두루 써요"},"krDetail":[{"ko":"고정시키다","explain":"움직이지 못하게 붙박다"}],"usageExamples":[{"en":"Experts found it hard to pin down the exact origin of the ancient painting.","ko":"전문가들은 그 고대 그림의 정확한 기원을 규명하기 어려워했다."},{"en":"The strong wind made it difficult to pin down the edges of the tent.","ko":"강한 바람 때문에 텐트의 가장자리를 고정시키기가 어려웠다."}],"grammarNote":"pin down은 '(정확히) 규명하다·특정하다'와 '눌러 고정하다' 두 뜻으로 쓰인다. 목적어가 대명사이면 pin it down처럼 사이에 넣는다.","grammarQuiz":[{"sentence":"Investigators struggled _____ pin down the exact cause of the mysterious factory explosion.","ko":"수사관들은 그 미스터리한 공장 폭발의 정확한 원인을 규명하기 위해 애썼다.","answer":"to","hint":"struggle + to부정사"}]},
    {"id":"v08701","w":"impend","pos":["phrase"],"ph":"/ɪmˈpɛnd/","cefr":"B2","kr":["(위험 등이) 임박[절박]하다"],"ex":[{"en":"As economic collapse impended, investors rushed to withdraw their money from local banks.","ko":"경제 붕괴가 임박하자 투자자들은 지역 은행에서 돈을 인출하기 위해 몰려들었다."}],"mnemonic":{"soundHint":"임펜드 → 'im(위에) + pend(매달림)'","story":"머리 위(im) pend(매달림) = 임박한 상태.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"loom","ko":"다가오다","reason":"동의어 — 어렴풋 닥침"},{"w":"approach","ko":"접근하다","reason":"동의어 — 가까이 옴"},{"w":"recede","ko":"물러가다","reason":"반의어 — 멀어짐"}],"collocBest":[{"en":"an impending danger","ko":"임박한 위험"},{"en":"an impending crisis","ko":"임박한 위기"}]},"nuance":{"koSimple":"위험이나 큰 사건이 곧 닥칠 듯 코앞에 다가와 있다는 뜻이에요","whenToUse":"재난·전쟁·경제 위기가 다가올 때 긴장감 있게 써요"},"krDetail":[{"ko":"(위험 등이) 임박[절박]하다","explain":"곧 닥칠 듯하다"}],"usageExamples":[{"en":"A sense of danger seemed to impend over the quiet, abandoned village.","ko":"위험의 기운이 조용하고 버려진 마을 위로 임박한 듯했다."},{"en":"As the deadline began to impend, the whole team worked late into the night.","ko":"마감이 임박해 오자 팀 전체가 밤늦게까지 일했다."}],"grammarNote":"impend는 '(위험·사건이) 임박하다'라는 자동사이지만, 실제로는 형용사형 impending(impending crisis 임박한 위기)이 훨씬 자주 쓰인다.","grammarQuiz":[{"sentence":"Economic collapse _____ been impending for months, causing investors to withdraw their money.","ko":"경제 붕괴가 여러 달 동안 임박해 오고 있어, 투자자들이 돈을 인출하게 만들었다.","answer":"has","hint":"현재완료 진행형 (has been -ing)"}]},
    {"id":"v08713","w":"in succession","pos":["phrase"],"ph":"/səkˈsɛʃən/","cefr":"B2","kr":["연속적으로"],"ex":[{"en":"The visiting team won five games in succession, breaking the stadium's long-standing record.","ko":"원정 팀은 다섯 경기를 연속으로 이기며 그 경기장의 오래된 기록을 깨뜨렸다."}],"mnemonic":{"soundHint":"인 서세션 → 'succession(계승·연속)' 안에서","story":"우승이 succession(연속)되어 이어짐 = 연속적으로.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"consecutively","ko":"연이어","reason":"동의어 — 잇달아"},{"w":"in a row","ko":"줄줄이","reason":"동의어 — 나란히 이어"},{"w":"intermittently","ko":"띄엄띄엄","reason":"반의어 — 끊겼다 이어짐"}],"collocBest":[{"en":"three days in succession","ko":"사흘 연속으로"},{"en":"win in succession","ko":"연달아 이기다"}]},"nuance":{"koSimple":"여러 사건이 잇달아 끊이지 않고 이어져 일어난다는 뜻이에요","whenToUse":"스포츠 연승, 재난 연발, 기록 갱신 상황에 자주 써요"},"krDetail":[{"ko":"연속적으로","explain":"쉬지 않고 잇달아"}],"usageExamples":[{"en":"The company launched three successful products in succession within a single year.","ko":"그 회사는 한 해 안에 성공적인 제품 세 개를 연달아 출시했다."},{"en":"The champion defended her title three times in succession over just four years.","ko":"그 챔피언은 단 4년 만에 세 차례 연속으로 자신의 타이틀을 방어했다."}],"grammarNote":"in succession은 '연달아'라는 뜻의 부사구로, in rapid/quick succession(빠르게 연달아)처럼 형용사와 함께 강조되어 쓰인다.","grammarQuiz":[{"sentence":"The visiting team _____ won five games in succession, breaking the stadium's long-standing record.","ko":"원정 팀은 다섯 경기를 연속으로 이겨 그 경기장의 오래된 기록을 깨뜨렸다.","answer":"has","hint":"현재완료 (has p.p.)"}]},
    {"id":"v08674","w":"fungus","pos":["noun"],"ph":"/ˈfʌŋɡəs/","cefr":"B2","kr":["균류, 곰팡이류","버섯"],"ex":[{"en":"Certain species of fungus form vital partnerships with the roots of forest trees.","ko":"특정 종의 균류는 숲 나무의 뿌리와 필수적인 협력 관계를 형성한다."}],"mnemonic":{"soundHint":"펑거스 → '펑!' 하고 자라나는 곰팡이·버섯","story":"습한 곳에 '펑' 나타나는 균 = fungus.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"mold","ko":"곰팡이","reason":"관련어 — 균의 한 종류"},{"w":"mushroom","ko":"버섯","reason":"관련어 — 갓 달린 균"},{"w":"bacteria","ko":"세균","reason":"관련어 — 다른 미생물"}],"collocBest":[{"en":"a harmful fungus","ko":"해로운 곰팡이"},{"en":"fungus grows on bread","ko":"빵에 곰팡이가 자라다"}]},"nuance":{"koSimple":"곰팡이·버섯처럼 포자로 번식하는 별도의 생물 무리를 뜻해요","whenToUse":"생물학·의학·식품학에서 곰팡이류를 이야기할 때 써요"},"krDetail":[{"ko":"균류, 곰팡이류","explain":"곰팡이 같은 균 종류"},{"ko":"버섯","explain":"갓이 달린 균 덩이"}],"usageExamples":[{"en":"A strange fungus was slowly spreading across the damp basement wall.","ko":"이상한 곰팡이가 축축한 지하실 벽에 서서히 번지고 있었다."},{"en":"Yeast is a type of fungus used to make bread rise.","ko":"효모는 빵을 부풀리는 데 쓰이는 균류의 일종이다."}],"grammarNote":"라틴어에서 온 명사로 복수형이 불규칙하여 'fungi'가 되며, 형용사형은 'fungal'(균류의)이다.","grammarQuiz":[{"sentence":"A certain fungus _____ forms partnerships with tree roots helps forest ecosystems thrive.","ko":"나무 뿌리와 협력 관계를 형성하는 특정 균류는 숲 생태계가 번성하는 데 도움을 준다.","answer":"that","hint":"사물 선행사 + 주격 관계대명사"}]},
    {"id":"v08770","w":"necessitate","pos":["verb"],"ph":"/nɪˈsɛsɪteɪt/","cefr":"B2","kr":["필요로 하다"],"ex":[{"en":"The rapid spread of the disease necessitates immediate coordinated action by governments worldwide.","ko":"그 질병의 급속한 확산은 전 세계 정부의 즉각적이고 조율된 조치를 필요로 한다."}],"mnemonic":{"soundHint":"니세시테이트 → 'necessary(필요한)'의 동사","story":"긴급 조치를 necessary(필요)하게 만듦 = 필요로 하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"require","ko":"요구하다","reason":"동의어 — 꼭 필요로 하다"},{"w":"entail","ko":"수반하다","reason":"유의어 — 딸려 오게 하다"},{"w":"obviate","ko":"불필요하게 하다","reason":"반의어 — 필요 없앰"}],"collocBest":[{"en":"necessitate immediate action","ko":"즉각적인 조치를 필요로 하다"},{"en":"necessitate major changes","ko":"대대적인 변화를 필요로 하다"}]},"nuance":{"koSimple":"상황이 특정한 조치나 대응을 반드시 요구하게 만드는 뜻이에요","whenToUse":"위기·변화가 조치를 불가피하게 요구할 때 자주 써요"},"krDetail":[{"ko":"필요로 하다","explain":"꼭 있어야 하게 만들다"}],"usageExamples":[{"en":"The heavy snowfall necessitated the immediate closure of all local schools.","ko":"폭설로 인해 모든 지역 학교의 즉각적인 휴교가 필요하게 되었다."},{"en":"Building a bridge here would necessitate years of careful planning.","ko":"이곳에 다리를 놓는 것은 수년간의 신중한 계획을 필요로 할 것이다."}],"grammarNote":"necessitate는 타동사로 뒤에 명사나 동명사를 목적어로 취해 '~을 필요하게 만들다'를 뜻한다. 주로 사물·상황이 주어로 오는 격식체 동사다.","grammarQuiz":[{"sentence":"The rapid spread of the disease necessitates _____ governments take immediate coordinated action.","ko":"그 질병의 급속한 확산은 정부들이 즉각적이고 조율된 조치를 취할 것을 필요로 한다.","answer":"that","hint":"necessitate + that절 (주어 + 동사원형)"}]},
    {"id":"v08887","w":"undue","pos":["adj"],"ph":"/ʌnˈduː/","cefr":"B2","kr":["지나친, 과도한"],"ex":[{"en":"The court ruled that the police had used undue force during the peaceful public protest.","ko":"법원은 경찰이 평화로운 공공 시위 동안 과도한 무력을 사용했다고 판결했다."}],"mnemonic":{"soundHint":"'언듀' → 'un(아닌)+due(마땅한)' 마땅하지 않게 지나친","story":"평화 시위에 경찰이 마땅한 선을 넘어 과도한 무력을 쓴 판결","hintConfidence":2},"pairs":{"buddyWords":[{"w":"excessive","ko":"과도한","reason":"동의어 — 정도가 지나침"},{"w":"unwarranted","ko":"부당한","reason":"유의어 — 정당하지 않은"},{"w":"reasonable","ko":"적당한","reason":"반의어 — 알맞은"}],"collocBest":[{"en":"undue pressure","ko":"지나친 압박"},{"en":"without undue delay","ko":"부당한 지체 없이"}]},"nuance":{"koSimple":"정당하거나 적절한 정도를 넘어 지나치게 과한 상태를 부정적으로 나타냅니다.","whenToUse":"과도한 압박·무력·부담처럼 부적절하게 지나친 상황을 지적할 때 씁니다."},"krDetail":[{"ko":"지나친, 과도한","explain":"정도가 너무 심한"}],"usageExamples":[{"en":"There is no need to place undue pressure on the students before the exam.","ko":"시험 전에 학생들에게 지나친 압박을 가할 필요는 없다."},{"en":"He managed to complete the difficult task without undue difficulty.","ko":"그는 과도한 어려움 없이 그 어려운 과제를 해낼 수 있었다."}],"grammarNote":"undue는 '지나친, 과도한'을 뜻하는 형용사로 명사 앞에서 한정적으로 주로 쓰인다(undue pressure/influence). 부사형 unduly는 '지나치게'라는 뜻이다.","grammarQuiz":[{"sentence":"The court ruled that undue force _____ (use) during the protest. (수동태 과거)","ko":"법원은 시위 중 과도한 무력이 사용되었다고 판결했다.","answer":"had been used","hint":"주절 과거 → 종속절 대과거 수동"}]},
    {"id":"v08659","w":"fall short of","pos":["phrase"],"ph":"/ʃɔːrt/","cefr":"B2","kr":["~에 미치지 못하다"],"ex":[{"en":"This year's harvest will fall short of the government's optimistic official projection.","ko":"올해 수확량은 정부의 낙관적인 공식 예상치에 미치지 못할 것이다."}],"mnemonic":{"soundHint":"폴 숏 오브 → 'short(짧게) fall(떨어짐)'","story":"목표에 short(짧게) fall(떨어져) = 미치지 못하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"fail to meet","ko":"못 미치다","reason":"동의어 — 닿지 못함"},{"w":"lack","ko":"모자라다","reason":"동의어 — 부족함"},{"w":"exceed","ko":"넘어서다","reason":"반의어 — 웃돎"}],"collocBest":[{"en":"fall short of expectations","ko":"기대에 미치지 못하다"},{"en":"fall short of the goal","ko":"목표에 미치지 못하다"}]},"nuance":{"koSimple":"목표나 기대치에 이르지 못하고 부족한 상태에 그친다는 뜻이에요","whenToUse":"실적·성과가 예상보다 낮을 때 아쉬움을 담아 써요"},"krDetail":[{"ko":"~에 미치지 못하다","explain":"목표에 닿지 못하다"}],"usageExamples":[{"en":"The results fell short of what investors had expected.","ko":"결과는 투자자들이 기대했던 것에 미치지 못했다."},{"en":"Her performance never falls short of excellence.","ko":"그녀의 연기는 결코 탁월함에 못 미치는 법이 없다."}],"grammarNote":"전치사 'of' 뒤에 기준·기대치가 오며, '(기대·기준에) 못 미치다'를 뜻한다. 반대 개념은 'meet/exceed expectations'(기대를 충족하다/뛰어넘다)이다.","grammarQuiz":[{"sentence":"This year's harvest _____ fallen short of the government's official optimistic projection.","ko":"올해 수확량은 정부의 낙관적인 공식 예상치에 미치지 못했다.","answer":"has","hint":"현재완료 (has p.p.)"}]},
