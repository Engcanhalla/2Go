    {"id":"v08707","w":"in favor of","pos":["phrase"],"ph":"/ˈfeɪvər/","cefr":"B2","kr":["~에 유리하게, ~의 이익을 위하여","~에 찬성[지지]하여"],"ex":[{"en":"Most citizens voted in favor of stricter environmental regulations at the last local election.","ko":"대부분의 시민들은 지난 지방 선거에서 더 엄격한 환경 규제에 찬성 투표를 했다."}],"mnemonic":{"soundHint":"인 페이버 오브 → 'favor(호의)' 안에","story":"favor(호의) 편에 서서 = 찬성·지지하여.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"supporting","ko":"지지하는","reason":"동의어 — 편들어 줌"},{"w":"for","ko":"찬성하는","reason":"동의어 — 좋다고 함"},{"w":"against","ko":"반대하여","reason":"반의어 — 맞서는"}],"collocBest":[{"en":"vote in favor of","ko":"~에 찬성 투표하다"},{"en":"argue in favor of the plan","ko":"그 계획에 찬성하여 주장하다"}]},"nuance":{"koSimple":"어떤 의견·계획·인물을 지지하거나 유리하게 여긴다는 뜻이에요","whenToUse":"투표·논쟁·회의에서 지지 입장을 밝힐 때 자주 써요"},"krDetail":[{"ko":"~에 유리하게, ~의 이익을 위하여","explain":"그쪽에 득이 되게"},{"ko":"~에 찬성[지지]하여","explain":"그 편을 들어"}],"usageExamples":[{"en":"The board decided in favor of expanding the company into overseas markets.","ko":"이사회는 회사를 해외 시장으로 확장하는 데 찬성하기로 결정했다."},{"en":"She gave up her stable job in favor of pursuing her lifelong dream.","ko":"그녀는 평생의 꿈을 좇기 위해 안정적인 직장을 포기했다."}],"grammarNote":"in favor of 뒤에는 명사나 동명사가 온다. 'A를 버리고 B를 택하다'라는 뜻의 give up A in favor of B 구문도 자주 출제된다.","grammarQuiz":[{"sentence":"The environmental bill _____ voted in favor of by most members of parliament last week.","ko":"그 환경 법안은 지난주 대부분의 국회의원들에 의해 찬성 투표되었다.","answer":"was","hint":"수동태(be + p.p.) 과거형"}]},
    {"id":"v08776","w":"out of the blue","pos":["phrase"],"ph":"/bluː/","cefr":"B2","kr":["갑자기"],"ex":[{"en":"The old high school friend contacted me out of the blue after fifteen quiet years.","ko":"그 오래된 고등학교 친구는 15년의 조용한 시간 후에 갑자기 나에게 연락해 왔다."}],"mnemonic":{"soundHint":"아웃 오브 더 블루 → '맑은 blue(파란) 하늘에서'","story":"맑은 파란 하늘에서 벼락이 떨어지듯 = 갑자기.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"suddenly","ko":"갑자기","reason":"동의어 — 별안간"},{"w":"unexpectedly","ko":"뜻밖에","reason":"동의어 — 예상 밖으로"},{"w":"gradually","ko":"서서히","reason":"반의어 — 점점"}],"collocBest":[{"en":"she called out of the blue","ko":"그녀가 갑자기 전화했다"},{"en":"it happened out of the blue","ko":"그 일이 난데없이 일어났다"}]},"nuance":{"koSimple":"예상하지 못했던 순간에 뜻밖에 일이 벌어진다는 뜻이에요","whenToUse":"오랜만의 연락이나 갑작스러운 소식을 표현할 때 써요"},"krDetail":[{"ko":"갑자기","explain":"예고 없이 별안간"}],"usageExamples":[{"en":"Out of the blue, she announced that she was moving to another country.","ko":"느닷없이 그녀는 다른 나라로 이사한다고 발표했다."},{"en":"The job offer came completely out of the blue and surprised the whole family.","ko":"그 일자리 제안은 완전히 갑작스럽게 와서 온 가족을 놀라게 했다."}],"grammarNote":"out of the blue는 '난데없이·갑자기'를 뜻하는 관용구로, 예상치 못한 일이 벌어질 때 쓴다. 문장 앞뒤 어디에나 부사구로 놓을 수 있다.","grammarQuiz":[{"sentence":"The old high school friend _____ contacted me out of the blue now lives abroad.","ko":"갑자기 내게 연락한 그 오래된 고등학교 친구는 지금 해외에 산다.","answer":"who","hint":"사람 선행사 + 주격 관계대명사"}]},
    {"id":"v08857","w":"stationery","pos":["noun"],"ph":"/ˈsteɪʃənɛri/","cefr":"B2","kr":["문구류","문방구"],"ex":[{"en":"The office manager ordered new stationery, including pens, notebooks, and paper clips.","ko":"사무실 관리자는 펜, 공책, 종이 클립을 포함한 새 문구류를 주문했다."}],"mnemonic":{"soundHint":"'스테이셔너리' → 'station(고정된)+ery' 문구점에 고정되어 있는 것들","story":"사무실에 펜, 공책, 클립 등 문구류가 새로 도착한 장면","hintConfidence":2},"pairs":{"buddyWords":[{"w":"supplies","ko":"용품","reason":"유의어 — 사무·학용품"},{"w":"pen","ko":"펜","reason":"대표 예 — 필기구"},{"w":"notebook","ko":"공책","reason":"대표 예 — 필기 노트"}],"collocBest":[{"en":"a stationery store","ko":"문구점"},{"en":"buy some stationery","ko":"문구류를 사다"}]},"nuance":{"koSimple":"펜·공책·종이 클립 등 사무나 필기에 쓰는 문구류 전반을 가리킵니다.","whenToUse":"사무실 비품 주문이나 학용품 구매 등 일상 실무 상황에서 씁니다."},"krDetail":[{"ko":"문구류","explain":"글 쓸 때 쓰는 물건"},{"ko":"문방구","explain":"필기도구 같은 학용품"}],"usageExamples":[{"en":"She bought some elegant stationery to write her thank-you letters.","ko":"그녀는 감사 편지를 쓰려고 고급스러운 문구류를 좀 샀다."},{"en":"The company logo is printed on all of its official stationery.","ko":"회사 로고가 모든 공식 문구류에 인쇄되어 있다."}],"grammarNote":"stationery는 '문구류'를 뜻하는 불가산명사로 a나 복수형을 쓰지 않는다. 발음이 같은 stationary('정지한', 형용사)와 철자(-ery/-ary)를 혼동하지 말아야 한다.","grammarQuiz":[{"sentence":"If the manager _____ ordered stationery earlier, we would not have run out. (가정법 과거완료)","ko":"만약 관리자가 문구류를 더 일찍 주문했더라면, 우리는 다 떨어지지 않았을 텐데.","answer":"had","hint":"If S had p.p. ~, S would have p.p."}]},
    {"id":"v08818","w":"rejoice","pos":["verb"],"ph":"/rɪˈdʒɔɪs/","cefr":"B2","kr":["크게 기뻐하다","축하하다"],"ex":[{"en":"The whole community rejoiced when the missing children were finally found safe and well.","ko":"실종된 아이들이 마침내 안전하고 무사히 발견되자 지역 사회 전체가 크게 기뻐했다."}],"mnemonic":{"soundHint":"'리조이스' → 're(다시)+joy(기쁨)+ice(얼음)' 얼었던 기쁨이 다시 살아나","story":"잃었던 아이가 돌아와 온 마을이 다시 기쁨에 빠지다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"delight","ko":"기뻐하다","reason":"동의어 — 매우 즐거워함"},{"w":"celebrate","ko":"축하하다","reason":"유의어 — 기쁨을 나눔"},{"w":"mourn","ko":"슬퍼하다","reason":"반의어 — 애도하다"}],"collocBest":[{"en":"rejoice at the news","ko":"그 소식에 크게 기뻐하다"},{"en":"rejoice in their success","ko":"그들의 성공을 기뻐하다"}]},"nuance":{"koSimple":"매우 좋은 일이 생겨 마음속 깊이 크게 기뻐하는 감정을 나타냅니다.","whenToUse":"축하나 감격의 순간을 문어체·격식체로 강하게 표현할 때 적절합니다."},"krDetail":[{"ko":"크게 기뻐하다","explain":"매우 즐거워하다"},{"ko":"축하하다","explain":"기쁜 일을 함께 즐기다"}],"usageExamples":[{"en":"The fans rejoiced wildly when their team won the national championship.","ko":"팬들은 자기 팀이 전국 선수권에서 우승하자 열광적으로 기뻐했다."},{"en":"The villagers rejoiced at the news of the long-awaited rainfall.","ko":"마을 사람들은 오래 기다리던 비 소식에 크게 기뻐했다."}],"grammarNote":"rejoice는 자동사로 'rejoice at/in/over ~(~에 크게 기뻐하다)' 형태로 쓰이는 다소 문어적인 동사다. 명사형은 rejoicing이다.","grammarQuiz":[{"sentence":"_____ the missing children found safe, the whole community rejoiced. (분사구문, With)","ko":"실종된 아이들이 무사히 발견되자, 지역 사회 전체가 크게 기뻐했다.","answer":"With","hint":"with + 목적어 + p.p. 부대상황"}]},
    {"id":"v08863","w":"suspension","pos":["noun"],"ph":"/səˈspɛnʃən/","cefr":"B2","kr":["매달리기","일시 정지","정학","연기, 보류"],"ex":[{"en":"The construction project remained in suspension pending the results of the environmental review.","ko":"그 건설 프로젝트는 환경 심사 결과가 나올 때까지 일시 정지 상태였다."}],"mnemonic":{"soundHint":"'서스펜션' → 'sus(아래)+pend(매달다)' 아래로 매달아 정지","story":"환경 심사가 끝날 때까지 공사가 공중에 매달려 멈춘 상태","hintConfidence":3},"pairs":{"buddyWords":[{"w":"pause","ko":"일시 정지","reason":"동의어 — 잠깐 멈춤"},{"w":"halt","ko":"중단","reason":"유의어 — 멈춰 세움"},{"w":"resumption","ko":"재개","reason":"반의어 — 다시 시작"}],"collocBest":[{"en":"a two-day suspension","ko":"2일간의 정학"},{"en":"the suspension of the rules","ko":"규칙의 일시 정지"}]},"nuance":{"koSimple":"활동이나 진행이 잠시 멈추거나 결정이 보류된 상태를 나타냅니다.","whenToUse":"공사 중단, 학생 정학, 계약 보류 등 공식적인 정지 상황에서 씁니다."},"krDetail":[{"ko":"매달리기","explain":"공중에 매달려 있음"},{"ko":"일시 정지","explain":"잠깐 멈춤"},{"ko":"정학","explain":"학교에 못 오게 함"},{"ko":"연기, 보류","explain":"뒤로 미뤄 둠"}],"usageExamples":[{"en":"The player received a three-match suspension for his violent conduct.","ko":"그 선수는 폭력적인 행동으로 세 경기 출전 정지를 받았다."},{"en":"The committee announced the temporary suspension of all outdoor events.","ko":"위원회는 모든 야외 행사의 일시 중단을 발표했다."}],"grammarNote":"suspension은 동사 suspend의 명사형으로 '(일시)정지, 정학, 출전 정지, 보류' 등 문맥에 따라 뜻이 달라진다. suspension bridge(현수교)처럼 복합어로도 쓰인다.","grammarQuiz":[{"sentence":"The project _____ (place) in suspension until the review ends. (수동태 현재완료)","ko":"그 프로젝트는 심사가 끝날 때까지 보류 상태에 놓여 왔다.","answer":"has been placed","hint":"have/has + been + p.p."}]},
    {"id":"v08656","w":"extrovert","pos":["adj"],"ph":"/ˈɛkstrəvɜːrt/","cefr":"B2","kr":["외향적인 사람","외향성의, 외향적인"],"ex":[{"en":"Extroverts generally gain energy from being surrounded by lively social gatherings and interactions.","ko":"외향적인 사람들은 일반적으로 활기찬 사교 모임과 상호작용에 둘러싸이는 것에서 에너지를 얻는다."}],"mnemonic":{"soundHint":"엑스트로버트 → 'ex(밖) + vert(향하는)'","story":"에너지가 ex(밖) 향(vert)하는 사람 = 외향인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"outgoing","ko":"사교적인","reason":"동의어 — 잘 어울림"},{"w":"sociable","ko":"붙임성 있는","reason":"동의어 — 어울리기 좋아함"},{"w":"introvert","ko":"내향인","reason":"반의어 — 안으로 향함"}],"collocBest":[{"en":"a natural extrovert","ko":"타고난 외향적인 사람"},{"en":"an outgoing extrovert","ko":"사교적인 외향인"}]},"nuance":{"koSimple":"사람들과 어울릴 때 에너지를 얻는 활동적 성향의 사람이에요","whenToUse":"성격 유형이나 MBTI 등 심리 성향을 설명할 때 써요"},"krDetail":[{"ko":"외향적인 사람","explain":"밖으로 잘 나서는 사람"},{"ko":"외향성의, 외향적인","explain":"활발하고 사교적인"}],"usageExamples":[{"en":"As a natural extrovert, he thrives in busy, crowded workplaces.","ko":"천성적으로 외향적인 사람이라, 그는 바쁘고 붐비는 직장에서 잘 지낸다."},{"en":"Extroverts and introverts often need very different kinds of rest.","ko":"외향적인 사람과 내향적인 사람은 흔히 매우 다른 종류의 휴식이 필요하다."}],"grammarNote":"'외향적인 사람'을 뜻하는 가산 명사이며, 반의어는 'introvert'(내향적인 사람)이다. 형용사형은 'extroverted'(외향적인)로 쓴다.","grammarQuiz":[{"sentence":"Extroverts, _____ gain energy from social gatherings, tend to thrive in team environments.","ko":"사교 모임에서 에너지를 얻는 외향적인 사람들은 팀 환경에서 잘하는 경향이 있다.","answer":"who","hint":"계속적 용법의 관계대명사 (사람 선행사)"}]},
    {"id":"v08740","w":"let go of","pos":["phrase"],"ph":"/lɛt/","cefr":"B2","kr":["(쥐고 있던 것을) 놓다","(생각·태도 등을) 버리다, 포기하다"],"ex":[{"en":"Therapists often help patients let go of past hurts to move on with life.","ko":"치료사들은 종종 환자들이 삶을 살아갈 수 있도록 과거의 상처를 놓아버리게 돕는다."}],"mnemonic":{"soundHint":"렛 고 오브 → 'let(놔두어) go(가게 함)'","story":"쥔 것을 let(놔둬서) go(가게) = 놓다·포기하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"release","ko":"놓아주다","reason":"동의어 — 손을 풂"},{"w":"abandon","ko":"버리다","reason":"동의어 — 미련 없앰"},{"w":"cling to","ko":"매달리다","reason":"반의어 — 꼭 붙잡음"}],"collocBest":[{"en":"let go of the rope","ko":"밧줄을 놓다"},{"en":"let go of the past","ko":"과거를 놓아 버리다"}]},"nuance":{"koSimple":"손이나 마음에서 붙잡고 있던 것을 놓아버린다는 뜻이에요","whenToUse":"미련·분노 같은 감정 정리나 물건을 놓을 때 두루 써요"},"krDetail":[{"ko":"(쥐고 있던 것을) 놓다","explain":"잡았던 것을 놓다"},{"ko":"(생각·태도 등을) 버리다, 포기하다","explain":"미련을 떨쳐 내다"}],"usageExamples":[{"en":"The child refused to let go of the balloon even for a single second.","ko":"그 아이는 단 1초도 풍선을 놓으려 하지 않았다."},{"en":"Sometimes you have to let go of old grudges to feel truly free.","ko":"때로는 진정으로 자유로워지기 위해 오래된 원한을 놓아 버려야 한다."}],"grammarNote":"let go of 뒤에는 명사(구)가 오며, 물리적으로 '쥔 것을 놓다'와 추상적으로 '집착·감정을 버리다' 두 가지 뜻으로 쓰인다.","grammarQuiz":[{"sentence":"Therapists help patients _____ let go of past hurts and move on with their lives.","ko":"치료사들은 환자들이 과거의 상처를 놓아버리고 삶을 살아가도록 돕는다.","answer":"to","hint":"help + 목적어 + (to)부정사"}]},
    {"id":"v08698","w":"hypothesize","pos":["noun"],"ph":"/haɪˈpɑːθəsaɪz/","cefr":"B2","kr":["가설을 세우다"],"ex":[{"en":"Researchers hypothesize that ancient humans migrated across the continents through several distinct routes.","ko":"연구자들은 고대 인류가 여러 다른 경로를 통해 대륙을 가로질러 이주했다고 가설을 세운다."}],"mnemonic":{"soundHint":"하이포써사이즈 → 'hypothesis(가설)'의 동사","story":"hypothesis(가설) → hypothesize(가설을 세우다).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"theorize","ko":"이론화하다","reason":"동의어 — 이론을 세움"},{"w":"speculate","ko":"추측하다","reason":"동의어 — 짐작해 봄"},{"w":"prove","ko":"증명하다","reason":"반의어 — 사실로 밝힘"}],"collocBest":[{"en":"hypothesize that it works","ko":"그것이 작동한다고 가설을 세우다"},{"en":"scientists hypothesize","ko":"과학자들이 가설을 세우다"}]},"nuance":{"koSimple":"아직 검증되지 않은 설명을 미리 세워 두는 학문적 행위예요","whenToUse":"과학 연구에서 실험 전 가설을 제안할 때 자주 써요"},"krDetail":[{"ko":"가설을 세우다","explain":"임시로 답을 정해 보다"}],"usageExamples":[{"en":"Scientists hypothesize that the planet once had liquid water on its surface.","ko":"과학자들은 그 행성에 한때 액체 상태의 물이 있었다고 가설을 세운다."},{"en":"We can hypothesize a close link between sleep quality and academic performance.","ko":"우리는 수면의 질과 학업 성취 사이에 밀접한 관련이 있다고 가설을 세울 수 있다."}],"grammarNote":"hypothesize는 동사로, 뒤에 that절이나 명사를 취해 '~라고 가설을 세우다'로 쓴다. 명사형은 hypothesis(가설, 복수 hypotheses)이다.","grammarQuiz":[{"sentence":"Researchers hypothesize _____ ancient humans migrated across continents through several distinct routes.","ko":"연구자들은 고대 인류가 여러 다른 경로를 통해 대륙을 가로질러 이주했다고 가설을 세운다.","answer":"that","hint":"hypothesize + that절 (목적어절)"}]},
    {"id":"v08827","w":"respondent","pos":["adj"],"ph":"/rɪˈspɑːndənt/","cefr":"B2","kr":["응답자","응하는, 반응하는"],"ex":[{"en":"Nearly all survey respondents agreed that public transportation urgently requires significant improvement.","ko":"설문 응답자 대다수가 대중교통이 시급히 상당한 개선을 필요로 한다는 데 동의했다."}],"mnemonic":{"soundHint":"'리스판던트' → 're(다시)+spond(대답)+ent(사람)'","story":"설문지를 받고 다시 대답을 돌려보내는 응답자","hintConfidence":3},"pairs":{"buddyWords":[{"w":"participant","ko":"참여자","reason":"유의어 — 조사 참가자"},{"w":"replier","ko":"답변자","reason":"동의어 — 답하는 사람"},{"w":"questioner","ko":"질문자","reason":"반의어 — 묻는 사람"}],"collocBest":[{"en":"survey respondents","ko":"설문 응답자"},{"en":"most respondents agreed","ko":"대부분의 응답자가 동의했다"}]},"nuance":{"koSimple":"설문이나 조사에서 질문에 답하는 사람 또는 반응하는 대상을 뜻합니다.","whenToUse":"여론조사·설문·법률 절차 등 공식 조사 맥락에서 자주 등장하는 표현입니다."},"krDetail":[{"ko":"응답자","explain":"설문에 답한 사람"},{"ko":"응하는, 반응하는","explain":"반응을 보이는"}],"usageExamples":[{"en":"Most respondents to the online poll preferred flexible working hours over higher salaries.","ko":"온라인 여론조사 응답자 대부분은 더 높은 급여보다 유연한 근무 시간을 선호했다."},{"en":"The respondent in the divorce case failed to appear in court on time.","ko":"그 이혼 소송의 피신청인은 법정에 제시간에 출석하지 못했다."}],"grammarNote":"respondent는 주로 명사로 '(설문·조사) 응답자'를 뜻하며 survey/questionnaire respondents처럼 복수로 자주 쓰인다. 법률 문맥에서는 소송의 '피신청인(피고)'을 가리킨다.","grammarQuiz":[{"sentence":"Nearly all respondents agreed that public transportation _____ (need) improvement. (5형식/that절)","ko":"거의 모든 응답자가 대중교통이 개선을 필요로 한다는 데 동의했다.","answer":"needs","hint":"that절 주어 단수, 3인칭 단수 현재"}]},
    {"id":"v08695","w":"howl","pos":["noun"],"ph":"/haʊl/","cefr":"B2","kr":["길게 짖다","울부짖다"],"ex":[{"en":"The wolves began to howl mournfully as the pale full moon rose above the mountains.","ko":"창백한 보름달이 산 위로 떠오르자 늑대들은 애처롭게 울부짖기 시작했다."}],"mnemonic":{"soundHint":"하울 → '하우울~' 늑대의 울음소리","story":"달을 보고 '하울~' 우는 늑대의 울부짖음.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"wail","ko":"울부짖다","reason":"동의어 — 길게 욺"},{"w":"bark","ko":"짖다","reason":"관련어 — 짧게 짖음"},{"w":"whisper","ko":"속삭이다","reason":"반의어 — 조용히 말함"}],"collocBest":[{"en":"wolves howl at night","ko":"늑대가 밤에 울부짖다"},{"en":"howl in pain","ko":"고통에 울부짖다"}]},"nuance":{"koSimple":"늑대나 개가 목을 길게 빼고 우는 듯한 소리를 낸다는 뜻이에요","whenToUse":"동물의 울음, 바람 소리, 인간의 통곡 묘사에 두루 써요"},"krDetail":[{"ko":"길게 짖다","explain":"짐승이 길게 소리내다"},{"ko":"울부짖다","explain":"크게 소리내 울다"}],"usageExamples":[{"en":"We could hear the wind howl through the narrow mountain pass all night.","ko":"우리는 밤새 좁은 산길을 지나며 바람이 울부짖는 소리를 들을 수 있었다."},{"en":"The dog let out a long howl whenever the ambulance sped past.","ko":"그 개는 구급차가 지나갈 때마다 길게 울부짖는 소리를 냈다."}],"grammarNote":"howl은 동사(길게 울다)와 명사(울부짖는 소리) 둘 다로 쓰인다. 명사로는 a howl of pain(고통의 비명)처럼 감정을 나타내는 of 구문과 자주 결합한다.","grammarQuiz":[{"sentence":"_____ mournfully at the full moon, the wolves broke the silence of the mountains.","ko":"보름달을 향해 애처롭게 울부짖으며, 늑대들은 산의 정적을 깨뜨렸다.","answer":"Howling","hint":"분사구문(능동/현재분사) 문두"}]},
    {"id":"v08623","w":"domesticate","pos":["phrase"],"ph":"/dəˈmestɪkeɪt/","cefr":"B2","kr":["길들이다, 가축화하다","재배하다"],"ex":[{"en":"Early humans learned to domesticate wild animals for both food and companionship purposes.","ko":"초기 인류는 식량과 반려의 목적 모두를 위해 야생 동물을 길들이는 법을 배웠다."}],"mnemonic":{"soundHint":"도메스티케이트 → 'domestic(가정의)'로 만들다","story":"야생을 domestic(가정)으로 들여 = 길들이다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"tame","ko":"길들이다","reason":"동의어 — 순하게 함"},{"w":"cultivate","ko":"재배하다","reason":"동의어 — 심어 기름"},{"w":"untamed","ko":"길들지 않은","reason":"반의어 — 야생 그대로"}],"collocBest":[{"en":"domesticate wild animals","ko":"야생 동물을 길들이다"},{"en":"domesticated plants","ko":"재배 식물"}]},"nuance":{"koSimple":"야생 동식물을 사람과 어울려 살도록 순화시킨다는 뜻이에요","whenToUse":"가축화·재배 역사나 반려동물 문맥에서 자주 써요"},"krDetail":[{"ko":"길들이다, 가축화하다","explain":"동물을 사람 곁에 두다"},{"ko":"재배하다","explain":"식물을 심어 기르다"}],"usageExamples":[{"en":"Humans first domesticated dogs tens of thousands of years ago.","ko":"인간은 수만 년 전에 처음으로 개를 길들였다."},{"en":"Certain wild grasses were domesticated to become today's staple grains.","ko":"특정 야생 풀들이 재배화되어 오늘날의 주식 곡물이 되었다."}],"grammarNote":"'(동물을) 가축화하다, (식물을) 재배화하다'라는 뜻의 타동사로, 수동태 'be domesticated'로 자주 쓴다. 형용사 'domestic'은 '가정의, 국내의'로 뜻이 다르니 구별한다.","grammarQuiz":[{"sentence":"Wild animals _____ domesticated by early humans for both food and companionship.","ko":"야생 동물들은 식량과 반려의 목적 모두를 위해 초기 인류에 의해 길들여졌다.","answer":"were","hint":"수동태(be + p.p.) 과거형"}]},
    {"id":"v08650","w":"exhale","pos":["phrase"],"ph":"/ɛksˈheɪl/","cefr":"B2","kr":["(숨을) 내쉬다, 내뿜다","발산하다"],"ex":[{"en":"The yoga instructor told everyone to exhale slowly through the nose during meditation.","ko":"요가 강사는 명상 중에 모두에게 코를 통해 천천히 숨을 내쉬라고 말했다."}],"mnemonic":{"soundHint":"엑스헤일 → 'ex(밖으로) + hale(숨)'","story":"숨을 ex(밖으로) 내보내다 = 내쉬다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"breathe out","ko":"내쉬다","reason":"동의어 — 숨 내보냄"},{"w":"emit","ko":"내뿜다","reason":"동의어 — 밖으로 뿜음"},{"w":"inhale","ko":"들이쉬다","reason":"반의어 — 숨을 들임"}],"collocBest":[{"en":"exhale slowly","ko":"천천히 숨을 내쉬다"},{"en":"inhale and exhale","ko":"숨을 들이쉬고 내쉬다"}]},"nuance":{"koSimple":"폐 안의 공기를 몸 밖으로 내보내는 호흡 동작을 뜻해요","whenToUse":"요가·명상·의료 상황에서 호흡을 설명할 때 자주 써요"},"krDetail":[{"ko":"(숨을) 내쉬다, 내뿜다","explain":"숨을 밖으로 내보내다"},{"ko":"발산하다","explain":"냄새·기운을 뿜어내다"}],"usageExamples":[{"en":"Take a deep breath, hold it, and then slowly exhale.","ko":"숨을 깊이 들이쉬고, 참았다가, 천천히 내쉬어라."},{"en":"The factory chimneys exhale thick clouds of gray smoke all day.","ko":"공장 굴뚝들은 하루 종일 짙은 회색 연기를 내뿜는다."}],"grammarNote":"'숨을 내쉬다'를 뜻하는 동사로, 반의어는 'inhale'(들이쉬다)이다. 자동사·타동사로 모두 쓰여 'exhale' 또는 'exhale air'처럼 목적어를 취할 수 있다.","grammarQuiz":[{"sentence":"_____ slowly through the nose, meditators calm both their bodies and minds.","ko":"코를 통해 천천히 숨을 내쉬며, 명상가들은 몸과 마음 모두를 진정시킨다.","answer":"Exhaling","hint":"분사구문(능동/현재분사) 문두"}]},
    {"id":"v08614","w":"dispose of","pos":["phrase"],"ph":"/dɪˈspoʊz/","cefr":"B2","kr":["~을 없애다[처리하다]","(문제 등을) 처리[해결]하다"],"ex":[{"en":"The company was fined heavily for improperly disposing of toxic chemical waste.","ko":"그 회사는 유독성 화학 폐기물을 부적절하게 처리한 것으로 무거운 벌금을 물었다."}],"mnemonic":{"soundHint":"디스포즈 오브 → 'dis(멀리) + pose(두다)'","story":"쓰레기를 멀리(dis) 두다(pose) = 처리하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"discard","ko":"버리다","reason":"동의어 — 내다 버림"},{"w":"eliminate","ko":"없애다","reason":"동의어 — 처리하다"},{"w":"retain","ko":"간직하다","reason":"반의어 — 그대로 둠"}],"collocBest":[{"en":"dispose of waste","ko":"폐기물을 처리하다"},{"en":"dispose of the problem","ko":"문제를 해결하다"}]},"nuance":{"koSimple":"필요 없는 것을 없애거나 문제를 매듭지어 해결한다는 뜻이에요","whenToUse":"쓰레기 처리나 골칫거리 해결 문맥에서 두루 써요"},"krDetail":[{"ko":"~을 없애다[처리하다]","explain":"필요 없어 내버리다"},{"ko":"(문제 등을) 처리[해결]하다","explain":"일을 마무리 짓다"}],"usageExamples":[{"en":"Please dispose of your rubbish in the bins provided outside.","ko":"쓰레기는 밖에 마련된 통에 버려 주세요."},{"en":"The committee disposed of the remaining issues in under an hour.","ko":"위원회는 남은 안건들을 한 시간도 안 되어 처리했다."}],"grammarNote":"반드시 전치사 'of'와 함께 쓰는 자동사구로, 'dispose of + 목적어' 형태다. 전치사 없는 'dispose'만으로는 이 뜻을 나타내지 못하므로 주의한다.","grammarQuiz":[{"sentence":"The company was fined heavily for improperly _____ of toxic chemical waste.","ko":"그 회사는 유독성 화학 폐기물을 부적절하게 처리한 것으로 무거운 벌금을 물었다.","answer":"disposing","hint":"전치사(for) + 동명사(-ing)"}]},
    {"id":"v08836","w":"rush out of","pos":["phrase"],"ph":"/rʌʃ/","cefr":"B2","kr":["~로부터 (급히) 달려 나오다, ~로부터 빠져나오다"],"ex":[{"en":"Panicked customers rushed out of the crowded department store when the fire alarm rang.","ko":"화재 경보가 울리자 당황한 고객들이 붐비는 백화점에서 급히 달려 나왔다."}],"mnemonic":{"soundHint":"'러쉬 아웃 오브' → 러시아워에 급히 나오다","story":"화재 경보가 울리자 백화점 안에서 손님들이 우르르 달려 나오는 모습","hintConfidence":2},"pairs":{"buddyWords":[{"w":"dash out","ko":"뛰쳐나오다","reason":"동의어 — 급히 나옴"},{"w":"flee","ko":"달아나다","reason":"유의어 — 급히 벗어남"},{"w":"saunter","ko":"느긋이 걷다","reason":"반의어 — 천천히 감"}],"collocBest":[{"en":"rush out of the building","ko":"건물에서 급히 뛰쳐나오다"},{"en":"rush out of the room","ko":"방에서 급히 달려 나오다"}]},"nuance":{"koSimple":"어떤 장소에서 다급하게 뛰쳐나오거나 서둘러 빠져나오는 행동을 뜻합니다.","whenToUse":"화재·긴급 상황·급한 용무로 건물이나 공간을 급히 벗어날 때 씁니다."},"krDetail":[{"ko":"~로부터 (급히) 달려 나오다, ~로부터 빠져나오다","explain":"급하게 뛰쳐나오다"}],"usageExamples":[{"en":"Everyone rushed out of the building as soon as the earthquake stopped.","ko":"지진이 멈추자마자 모두가 건물에서 급히 뛰쳐나왔다."},{"en":"The children rushed out of the classroom the moment the bell rang.","ko":"종이 울리는 순간 아이들이 교실에서 급히 뛰쳐나왔다."}],"grammarNote":"'rush out of + 장소' 형태로 '~에서 급히 뛰쳐나오다'를 뜻한다. 반대 방향은 rush into(~로 급히 들어가다)이며 rush의 과거형은 rushed이다.","grammarQuiz":[{"sentence":"Hardly _____ the alarm rung when customers rushed out of the store. (도치)","ko":"경보가 울리자마자 고객들이 가게에서 급히 달려 나왔다.","answer":"had","hint":"Hardly had S p.p. ~ when S 과거"}]},
    {"id":"v08848","w":"so as to do","pos":["phrase"],"ph":"/soʊ/","cefr":"B2","kr":["~하도록, ~하기 위해서"],"ex":[{"en":"Students often review notes together so as to prepare more effectively for their exams.","ko":"학생들은 시험을 더 효과적으로 준비하기 위해 종종 함께 필기를 검토한다."}],"mnemonic":{"soundHint":"'소 애즈 투' → '이렇게(so) 하기 위해(to)'","story":"학생들이 시험을 잘 보기 위해서 함께 필기를 검토하는 이유 표현","hintConfidence":1},"pairs":{"buddyWords":[{"w":"in order to","ko":"~하기 위해","reason":"동의어 — 목적 표현"},{"w":"for","ko":"~을 위해","reason":"유의어 — 목적을 나타냄"},{"w":"purpose","ko":"목적","reason":"연관어 — 하려는 이유"}],"collocBest":[{"en":"left early so as to arrive on time","ko":"제시간에 도착하기 위해 일찍 떠났다"},{"en":"spoke slowly so as to be clear","ko":"분명하게 하려고 천천히 말했다"}]},"nuance":{"koSimple":"어떤 행동을 하는 목적이나 이유를 문어적으로 부드럽게 나타내는 표현입니다.","whenToUse":"in order to보다 조금 격식 있는 글에서 목적을 명확히 밝힐 때 씁니다."},"krDetail":[{"ko":"~하도록, ~하기 위해서","explain":"그렇게 되게 하려고"}],"usageExamples":[{"en":"He spoke slowly and clearly so as to be understood by everyone in the room.","ko":"그는 방 안의 모두가 알아들을 수 있도록 천천히 또렷하게 말했다."},{"en":"She left home an hour early so as to avoid the morning traffic.","ko":"그녀는 아침 교통 체증을 피하기 위해 한 시간 일찍 집을 나섰다."}],"grammarNote":"'so as to + 동사원형'은 목적('~하기 위해서')을 나타내며 in order to와 바꿔 쓸 수 있다. 부정은 so as not to do 형태로 쓴다.","grammarQuiz":[{"sentence":"Students review notes together _____ prepare more effectively. (so as to 활용)","ko":"학생들은 더 효과적으로 준비하기 위해 함께 필기를 검토한다.","answer":"so as to","hint":"목적: so as to + 동사원형"}]},
    {"id":"v08689","w":"herbicide","pos":["noun"],"ph":"/ˈhɜːrbɪsaɪd/","cefr":"B2","kr":["제초제"],"ex":[{"en":"Overuse of herbicides can seriously contaminate groundwater and threaten local ecosystems for decades.","ko":"제초제의 남용은 지하수를 심각하게 오염시키고 지역 생태계를 수십 년간 위협할 수 있다."}],"mnemonic":{"soundHint":"허비사이드 → 'herb(풀) + cide(죽임)'","story":"herb(풀)를 cide(죽이는) 것 = 제초제.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"pesticide","ko":"살충제","reason":"관련어 — 벌레 잡는 약"},{"w":"weed","ko":"잡초","reason":"관련어 — 없앨 대상"},{"w":"fertilizer","ko":"비료","reason":"반의어 — 자라게 돕는 것"}],"collocBest":[{"en":"spray herbicide on weeds","ko":"잡초에 제초제를 뿌리다"},{"en":"a chemical herbicide","ko":"화학 제초제"}]},"nuance":{"koSimple":"잡초 같은 원치 않는 식물을 죽이는 데 쓰는 농약을 뜻해요","whenToUse":"농업·환경 오염·생태계 위협을 이야기할 때 자주 써요"},"krDetail":[{"ko":"제초제","explain":"잡초를 죽이는 약"}],"usageExamples":[{"en":"Farmers sprayed herbicide to kill the weeds choking their crops.","ko":"농부들은 작물을 뒤덮는 잡초를 없애기 위해 제초제를 뿌렸다."},{"en":"Organic farms avoid chemical herbicides altogether.","ko":"유기농 농장은 화학 제초제를 아예 사용하지 않는다."}],"grammarNote":"'풀(herb-)을 죽이는(-cide) 것'이라는 어원의 명사로, 가산·불가산으로 모두 쓴다. 같은 '-cide'(죽이다) 계열로 'pesticide'(살충제), 'insecticide'(살충제)가 있다.","grammarQuiz":[{"sentence":"Local groundwater _____ been contaminated by the overuse of herbicides for decades.","ko":"지역 지하수는 수십 년간 제초제의 남용으로 오염되어 왔다.","answer":"has","hint":"현재완료 수동태 (has been p.p.)"}]},
    {"id":"v08875","w":"televise","pos":["phrase"],"ph":"/ˈtɛlɪvaɪz/","cefr":"B2","kr":["TV로 방송하다, 방영하다"],"ex":[{"en":"The network decided to televise the championship game live to a global audience.","ko":"그 방송사는 챔피언십 경기를 전 세계 시청자들에게 생중계로 방영하기로 결정했다."}],"mnemonic":{"soundHint":"'텔레바이즈' → 'tele(멀리)+vise(보다)' TV로 멀리 보내다","story":"챔피언십 경기를 TV로 전 세계에 생중계하는 방송사","hintConfidence":3},"pairs":{"buddyWords":[{"w":"broadcast","ko":"방송하다","reason":"동의어 — 내보내다"},{"w":"air","ko":"방영하다","reason":"동의어 — 전파로 보냄"},{"w":"stream","ko":"스트리밍하다","reason":"유의어 — 실시간 송출"}],"collocBest":[{"en":"televise the match live","ko":"경기를 생중계로 방영하다"},{"en":"a televised debate","ko":"TV로 방영된 토론"}]},"nuance":{"koSimple":"행사나 프로그램을 텔레비전을 통해 시청자에게 방송하는 것을 뜻합니다.","whenToUse":"스포츠·시상식·연설 등 대규모 이벤트의 TV 중계 상황에서 씁니다."},"krDetail":[{"ko":"TV로 방송하다, 방영하다","explain":"텔레비전으로 내보내다"}],"usageExamples":[{"en":"The opening ceremony will be televised in more than a hundred countries.","ko":"개막식은 백 개가 넘는 나라에서 TV로 방영될 것이다."},{"en":"They decided not to televise the trial for privacy reasons.","ko":"그들은 사생활 보호를 이유로 그 재판을 방영하지 않기로 결정했다."}],"grammarNote":"televise는 타동사로 '(경기·행사 등을) TV로 방송하다'를 뜻하며, 흔히 수동태(be televised)로 쓰인다. 명사 television과 형태를 구별해야 한다.","grammarQuiz":[{"sentence":"The championship game _____ (televise) live to a global audience tomorrow. (수동태 미래)","ko":"챔피언십 경기는 내일 전 세계 시청자들에게 생중계로 방영될 것이다.","answer":"will be televised","hint":"will + be + p.p."}]},
    {"id":"v08785","w":"patriotic","pos":["phrase"],"ph":"/ˌpeɪtriˈɑːtɪk/","cefr":"B2","kr":["애국적인, 애국의"],"ex":[{"en":"Patriotic songs echoed through the streets during the annual national independence celebration.","ko":"연례 국가 독립 기념 행사 동안 애국적인 노래들이 거리에 울려 퍼졌다."}],"mnemonic":{"soundHint":"패트리오틱 → 'patriot(애국자)'의 형용사","story":"patriot(애국자)의 마음이 담긴 노래 = 애국적인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"nationalistic","ko":"민족주의적인","reason":"유의어 — 나라 중심의"},{"w":"loyal","ko":"충성스러운","reason":"유의어 — 나라에 헌신하는"},{"w":"traitorous","ko":"매국의","reason":"반의어 — 나라를 배신하는"}],"collocBest":[{"en":"patriotic songs","ko":"애국적인 노래"},{"en":"a patriotic duty","ko":"애국적 의무"}]},"nuance":{"koSimple":"자기 나라를 사랑하고 자랑스럽게 여기는 마음을 담은 뜻이에요","whenToUse":"독립기념일·국가 행사·전쟁 문맥에서 자주 써요"},"krDetail":[{"ko":"애국적인, 애국의","explain":"나라를 사랑하는"}],"usageExamples":[{"en":"Waving the national flag, the crowd sang patriotic songs with great pride.","ko":"국기를 흔들며 군중은 큰 자부심으로 애국적인 노래를 불렀다."},{"en":"He felt a patriotic duty to serve his country during difficult times.","ko":"그는 어려운 시기에 조국을 위해 봉사해야 한다는 애국적 의무감을 느꼈다."}],"grammarNote":"patriotic은 '애국적인'을 뜻하는 형용사로 patriotic song/duty/feeling처럼 명사를 수식한다. 명사형은 patriotism, 부사형은 patriotically이다.","grammarQuiz":[{"sentence":"The songs _____ echoed through the streets during the celebration were deeply patriotic.","ko":"기념 행사 동안 거리에 울려 퍼진 그 노래들은 매우 애국적이었다.","answer":"that","hint":"사물 선행사 + 주격 관계대명사"}]},
    {"id":"v08767","w":"mutate","pos":["noun"],"ph":"/mjuːˈteɪt/","cefr":"B2","kr":["돌연변이하다[시키다]","변형되다[시키다]"],"ex":[{"en":"Viruses tend to mutate rapidly, making it difficult to develop lasting vaccines against them.","ko":"바이러스는 빠르게 돌연변이하는 경향이 있어, 지속적인 백신을 개발하기 어렵게 만든다."}],"mnemonic":{"soundHint":"뮤테이트 → 'mutant(돌연변이)'의 동사","story":"바이러스가 mutant(돌연변이) 되어 mutate(변이).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"transform","ko":"변형되다","reason":"동의어 — 모양이 바뀌다"},{"w":"evolve","ko":"진화하다","reason":"유의어 — 서서히 변하다"},{"w":"remain","ko":"그대로 있다","reason":"반의어 — 안 바뀌다"}],"collocBest":[{"en":"the virus mutates","ko":"바이러스가 변이하다"},{"en":"genes can mutate","ko":"유전자가 돌연변이할 수 있다"}]},"nuance":{"koSimple":"유전자나 형태가 갑자기 이전과 다른 모습으로 바뀐다는 뜻이에요","whenToUse":"바이러스 변이나 생물학적 진화 논의에서 자주 써요"},"krDetail":[{"ko":"돌연변이하다[시키다]","explain":"유전자가 갑자기 바뀌다"},{"ko":"변형되다[시키다]","explain":"모양이나 성질이 바뀌다"}],"usageExamples":[{"en":"These bacteria can mutate quickly, developing resistance to common antibiotics.","ko":"이 세균은 빠르게 돌연변이하여 흔한 항생제에 대한 내성을 키울 수 있다."},{"en":"Over many generations, the language mutated into several distinct dialects.","ko":"여러 세대를 거치며 그 언어는 서로 다른 여러 방언으로 변형되었다."}],"grammarNote":"mutate는 자동사·타동사 모두로 쓰이는 동사로 '변이·변형되다'를 뜻한다. 명사형은 mutation, 형용사·명사형은 mutant이다.","grammarQuiz":[{"sentence":"Viruses _____ mutate rapidly are difficult to fight with conventional vaccines.","ko":"빠르게 돌연변이하는 바이러스는 재래식 백신으로 대응하기 어렵다.","answer":"that","hint":"사물 선행사 + 주격 관계대명사"}]},
    {"id":"v08860","w":"stick up for","pos":["phrase"],"ph":"/stɪk/","cefr":"B2","kr":["~을 변호하다, 옹호하다"],"ex":[{"en":"True friends always stick up for you even when everyone else turns quickly against you.","ko":"진정한 친구들은 다른 모두가 당신에게 빠르게 등을 돌릴 때조차 언제나 당신을 옹호한다."}],"mnemonic":{"soundHint":"'스틱 업 포' → 막대기(stick)를 위로(up) 들고 지켜주다","story":"모두가 등 돌릴 때 친구를 위해 막대기 들고 옹호하는 장면","hintConfidence":2},"pairs":{"buddyWords":[{"w":"defend","ko":"옹호하다","reason":"동의어 — 편들어 지킴"},{"w":"support","ko":"편들다","reason":"유의어 — 힘을 실어줌"},{"w":"attack","ko":"공격하다","reason":"반의어 — 몰아세우다"}],"collocBest":[{"en":"stick up for a friend","ko":"친구를 편들어 주다"},{"en":"stick up for yourself","ko":"스스로를 옹호하다"}]},"nuance":{"koSimple":"어려움에 처한 사람이나 신념을 적극적으로 편들어 지켜 주는 것을 뜻합니다.","whenToUse":"친구·약자·자신의 원칙을 비난이나 공격으로부터 옹호할 때 씁니다."},"krDetail":[{"ko":"~을 변호하다, 옹호하다","explain":"편을 들어 감싸 주다"}],"usageExamples":[{"en":"You should learn to stick up for yourself in difficult situations.","ko":"너는 어려운 상황에서 스스로를 변호할 줄 알아야 한다."},{"en":"She was the only one who stuck up for the new employee at the meeting.","ko":"회의에서 신입 직원을 편들어 준 사람은 그녀뿐이었다."}],"grammarNote":"'stick up for + 사람/신념' 형태로 '~을 편들다/옹호하다'를 뜻하는 구동사이며, stick의 과거형은 stuck이다. 유사 표현으로 stand up for가 있다.","grammarQuiz":[{"sentence":"True friends stick up for you even when everyone else _____ (turn) against you. (시제)","ko":"진정한 친구들은 다른 모두가 등을 돌릴 때조차 당신을 옹호한다.","answer":"turns","hint":"시간·조건 부사절, 3인칭 단수 현재"}]},
    {"id":"v08731","w":"keep track of","pos":["phrase"],"ph":"/træk/","cefr":"B2","kr":["~을 기록하다","~의 자국을 뒤밟다"],"ex":[{"en":"It is difficult to keep track of all the tasks assigned during a busy week.","ko":"바쁜 한 주 동안 배정된 모든 업무를 기록해 두는 것은 어렵다."}],"mnemonic":{"soundHint":"킵 트랙 오브 → 'track(자취·경로)'을 keep(유지)","story":"지출의 track(자취)을 keep(유지) = 기록해두다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"monitor","ko":"추적하다","reason":"동의어 — 계속 살핌"},{"w":"record","ko":"기록하다","reason":"동의어 — 적어 둠"},{"w":"lose track of","ko":"놓치다","reason":"반의어 — 흐름을 잃음"}],"collocBest":[{"en":"keep track of expenses","ko":"지출을 기록하다"},{"en":"keep track of time","ko":"시간을 파악하다"}]},"nuance":{"koSimple":"어떤 대상의 상태나 변화를 놓치지 않고 지켜본다는 뜻이에요","whenToUse":"일정·지출·성과 관리처럼 꾸준한 추적이 필요할 때 써요"},"krDetail":[{"ko":"~을 기록하다","explain":"빠짐없이 챙겨 적다"},{"ko":"~의 자국을 뒤밟다","explain":"지나간 자취를 좇다"}],"usageExamples":[{"en":"This app helps you keep track of your daily spending very easily.","ko":"이 앱은 당신이 매일의 지출을 아주 쉽게 기록하도록 도와준다."},{"en":"It was hard to keep track of time while playing the exciting game.","ko":"그 신나는 게임을 하는 동안에는 시간을 파악하기가 어려웠다."}],"grammarNote":"keep track of 뒤에는 명사(구)가 와서 '~을 계속 파악하다'를 뜻한다. 반대 표현은 lose track of(~을 놓치다)이다.","grammarQuiz":[{"sentence":"It is difficult _____ keep track of all the tasks assigned during such a busy week.","ko":"그렇게 바쁜 한 주 동안 배정된 모든 업무를 기록해 두는 것은 어렵다.","answer":"to","hint":"It is 형용사 + to부정사 (가주어-진주어)"}]},
    {"id":"v08869","w":"take ~ into account","pos":["phrase"],"ph":"/əˈkaʊnt/","cefr":"B2","kr":["~을 고려하다, ~을 참작하다[계산에 넣다]"],"ex":[{"en":"Policymakers should take historical context into account when designing new education reforms.","ko":"정책 입안자들은 새로운 교육 개혁을 설계할 때 역사적 맥락을 고려해야 한다."}],"mnemonic":{"soundHint":"'테이크 인투 어카운트' → 계좌(account) 안에 집어넣어 계산","story":"교육 개혁 설계 시 역사 맥락을 계산 계좌 안에 넣어 고려","hintConfidence":2},"pairs":{"buddyWords":[{"w":"consider","ko":"고려하다","reason":"동의어 — 헤아려 보다"},{"w":"weigh","ko":"따져보다","reason":"유의어 — 견주어 보다"},{"w":"ignore","ko":"무시하다","reason":"반의어 — 안 따지다"}],"collocBest":[{"en":"take costs into account","ko":"비용을 고려하다"},{"en":"take everything into account","ko":"모든 것을 참작하다"}]},"nuance":{"koSimple":"판단이나 결정을 내릴 때 특정 요소를 빠뜨리지 않고 고려하는 것을 뜻합니다.","whenToUse":"정책·평가·계획을 세울 때 다양한 변수를 반드시 반영해야 할 때 씁니다."},"krDetail":[{"ko":"~을 고려하다, ~을 참작하다[계산에 넣다]","explain":"빠뜨리지 않고 헤아리다"}],"usageExamples":[{"en":"When grading, teachers should take effort into account, not just final results.","ko":"채점할 때 교사는 최종 결과뿐 아니라 노력도 고려해야 한다."},{"en":"The plan failed because it did not take rising costs into account.","ko":"그 계획은 상승하는 비용을 고려에 넣지 않아서 실패했다."}],"grammarNote":"'take + 목적어 + into account' 형태로 목적어를 중간에 넣거나, 목적어가 길면 take into account 뒤에 둘 수도 있다. take account of, take into consideration과 같은 뜻이다.","grammarQuiz":[{"sentence":"Historical context should _____ into account when designing reforms. (수동태, take 활용)","ko":"개혁을 설계할 때 역사적 맥락이 고려되어야 한다.","answer":"be taken","hint":"조동사 + be + p.p."}]},
    {"id":"v08764","w":"momentary","pos":["phrase"],"ph":"/ˈmoʊmənˌtɛri/","cefr":"B2","kr":["순간적인, 잠깐의"],"ex":[{"en":"A momentary lapse in concentration cost the driver his lead in the championship final.","ko":"순간적인 집중력 저하는 그 운전자에게 챔피언십 결승전에서의 선두를 잃게 만들었다."}],"mnemonic":{"soundHint":"모먼터리 → 'moment(순간)'의 형용사","story":"moment(순간) 동안만 지속 = 순간적인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"brief","ko":"짧은","reason":"동의어 — 잠깐인"},{"w":"fleeting","ko":"순식간의","reason":"동의어 — 금방 사라지는"},{"w":"permanent","ko":"영구적인","reason":"반의어 — 오래가는"}],"collocBest":[{"en":"a momentary pause","ko":"잠깐의 멈춤"},{"en":"a momentary lapse","ko":"순간적인 실수"}]},"nuance":{"koSimple":"아주 짧은 순간에 잠깐만 일어났다 사라지는 성질을 뜻해요","whenToUse":"찰나의 감정·집중력 저하·현상을 표현할 때 자주 써요"},"krDetail":[{"ko":"순간적인, 잠깐의","explain":"아주 짧은 한순간의"}],"usageExamples":[{"en":"There was a momentary silence before the audience burst into loud applause.","ko":"청중이 요란한 박수를 터뜨리기 전에 잠깐의 침묵이 흘렀다."},{"en":"His momentary hesitation allowed his opponent to score the winning goal.","ko":"그의 순간적인 망설임이 상대에게 결승골을 넣을 기회를 주었다."}],"grammarNote":"momentary는 '순간적인·잠깐의'를 뜻하는 형용사로, momentary lapse/silence/pause처럼 짧은 순간을 나타내는 명사를 수식한다. momentous(중대한)와 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"A momentary lapse in concentration _____ the driver his lead in the championship final.","ko":"순간적인 집중력 저하는 그 운전자에게 챔피언십 결승전에서의 선두를 잃게 했다.","answer":"cost","hint":"cost + 간접목적어 + 직접목적어 (4형식, 과거형)"}]},
    {"id":"v08788","w":"perpetuate","pos":["verb"],"ph":"/pərˈpɛtʃueɪt/","cefr":"B2","kr":["영구화하다"],"ex":[{"en":"Biased textbooks can perpetuate harmful stereotypes across multiple generations of young students.","ko":"편향된 교과서는 여러 세대의 어린 학생들에게 유해한 고정관념을 영구화할 수 있다."}],"mnemonic":{"soundHint":"퍼페추에이트 → 'perpetual(영원한)'의 동사","story":"편견을 perpetual(영원)하게 만듦 = 영구화하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"sustain","ko":"지속시키다","reason":"동의어 — 계속되게 하다"},{"w":"maintain","ko":"유지하다","reason":"유의어 — 그대로 이어가다"},{"w":"abolish","ko":"없애다","reason":"반의어 — 끊어 버리다"}],"collocBest":[{"en":"perpetuate a stereotype","ko":"고정관념을 영속시키다"},{"en":"perpetuate inequality","ko":"불평등을 영구화하다"}]},"nuance":{"koSimple":"나쁜 상태나 관행이 사라지지 않고 계속 이어지게 한다는 뜻이에요","whenToUse":"고정관념·차별·불평등을 지속시키는 원인을 지적할 때 써요"},"krDetail":[{"ko":"영구화하다","explain":"계속 이어지게 하다"}],"usageExamples":[{"en":"Repeating false rumors only perpetuates fear among ordinary citizens.","ko":"거짓 소문을 되풀이하는 것은 평범한 시민들 사이의 두려움을 영속시킬 뿐이다."},{"en":"Such unfair laws perpetuate inequality between the rich and the poor.","ko":"그런 불공정한 법은 부자와 빈자 사이의 불평등을 영구화한다."}],"grammarNote":"perpetuate는 타동사로 stereotype·myth·inequality 같은 부정적 대상을 목적어로 취해 '~을 영속시키다'라는 뜻으로 자주 쓰인다. 명사형은 perpetuation이다.","grammarQuiz":[{"sentence":"Biased textbooks _____ perpetuate harmful stereotypes must be replaced without delay.","ko":"유해한 고정관념을 영구화하는 편향된 교과서는 지체 없이 교체되어야 한다.","answer":"that","hint":"사물 선행사 + 주격 관계대명사"}]},
    {"id":"v08728","w":"irresistible","pos":["phrase"],"ph":"/ˌɪrɪˈzɪstəbəl/","cefr":"B2","kr":["저항할[억누를] 수 없는","너무 유혹적인"],"ex":[{"en":"The chef prepared a truly irresistible dessert that even dieters had trouble refusing.","ko":"그 셰프는 다이어트를 하는 사람들조차 거절하기 힘들 만큼 정말 저항할 수 없는 디저트를 준비했다."}],"mnemonic":{"soundHint":"이레지스터블 → 'ir(못) + resist(저항) + ible'","story":"ir(못) resist(저항)할 = 저항할 수 없는·너무 유혹적인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"tempting","ko":"유혹적인","reason":"동의어 — 확 끌리는"},{"w":"compelling","ko":"거부 못할","reason":"동의어 — 안 넘어갈 수 없는"},{"w":"resistible","ko":"뿌리칠 만한","reason":"반의어 — 참을 수 있는"}],"collocBest":[{"en":"an irresistible temptation","ko":"뿌리칠 수 없는 유혹"},{"en":"an irresistible urge","ko":"억누를 수 없는 충동"}]},"nuance":{"koSimple":"매력이 너무 커서 거절하거나 참기 어려운 상태를 뜻해요","whenToUse":"유혹적인 음식·제안·매력을 강조해 표현할 때 써요"},"krDetail":[{"ko":"저항할[억누를] 수 없는","explain":"도저히 참을 수 없는"},{"ko":"너무 유혹적인","explain":"안 넘어갈 수 없는"}],"usageExamples":[{"en":"The bakery gave off an irresistible smell of fresh bread every morning.","ko":"그 빵집은 매일 아침 갓 구운 빵의 거부할 수 없는 냄새를 풍겼다."},{"en":"She felt an irresistible urge to laugh during the very serious meeting.","ko":"그녀는 아주 진지한 회의 중에 참을 수 없는 웃음의 충동을 느꼈다."}],"grammarNote":"irresistible은 '거부할 수 없는'을 뜻하는 형용사로, an irresistible urge/temptation(참을 수 없는 충동/유혹)처럼 명사를 수식한다. 부사형은 irresistibly이다.","grammarQuiz":[{"sentence":"The dessert was _____ irresistible that even strict dieters had trouble refusing it.","ko":"그 디저트는 너무나 저항할 수 없어서 엄격한 다이어트를 하는 사람들조차 거절하기 힘들었다.","answer":"so","hint":"so + 형용사 + that (너무 ~해서 ...하다)"}]},
    {"id":"v08800","w":"presumable","pos":["adj"],"ph":"/prɪˈzuːməbəl/","cefr":"B2","kr":["추정할 수 있는","있음직한"],"ex":[{"en":"It is presumable that consumer prices will keep rising throughout the next fiscal year.","ko":"다음 회계연도 내내 소비자 물가가 계속 오를 것이라고 추정할 수 있다."}],"mnemonic":{"soundHint":"프리주머블 → 'presume(추정) + able'","story":"presume(추정)할 수 있는(able) = 추정할 수 있는.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"probable","ko":"있음직한","reason":"동의어 — 그럴 만한"},{"w":"likely","ko":"그럴듯한","reason":"유의어 — 가능성 있는"},{"w":"doubtful","ko":"의심스러운","reason":"반의어 — 믿기 어려운"}],"collocBest":[{"en":"the presumable cause","ko":"추정되는 원인"},{"en":"a presumable outcome","ko":"있음직한 결과"}]},"nuance":{"koSimple":"확실치는 않지만 합리적으로 예상되고 있음직한 상태를 뜻해요","whenToUse":"가능성 있는 미래나 근거 있는 추측을 표현할 때 써요"},"krDetail":[{"ko":"추정할 수 있는","explain":"미루어 짐작되는"},{"ko":"있음직한","explain":"그럴 법한"}],"usageExamples":[{"en":"The presumable cause of the fire was a faulty electrical wire in the wall.","ko":"그 화재의 추정 원인은 벽 안의 결함 있는 전선이었다."},{"en":"It is presumable that the meeting will be delayed because of the storm.","ko":"그 회의는 폭풍 때문에 연기될 것이라고 추정할 수 있다."}],"grammarNote":"presumable은 '추정 가능한'을 뜻하는 형용사이지만, 실제로는 부사형 presumably(아마도)가 훨씬 자주 쓰인다. 동사형은 presume이다.","grammarQuiz":[{"sentence":"It _____ that prices will keep rising next year. (presumable을 활용)","ko":"가격이 내년에도 계속 오를 것이라고 추정할 수 있다.","answer":"is presumable","hint":"가주어 It + be동사 + 형용사"}]},
    {"id":"v08761","w":"maximization","pos":["noun"],"ph":"/ˌmæksɪmɪˈzeɪʃən/","cefr":"B2","kr":["극대화"],"ex":[{"en":"The company's strategy focused on profit maximization rather than long-term sustainability goals.","ko":"그 회사의 전략은 장기적인 지속가능성 목표보다 이윤 극대화에 초점을 맞추었다."}],"mnemonic":{"soundHint":"맥시마이제이션 → 'maximum(최대)'로 만드는 것","story":"이윤을 maximum(최대)로 밀어올림 = 극대화.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"optimization","ko":"최적화","reason":"유의어 — 가장 좋게 함"},{"w":"maximum","ko":"최대","reason":"파생어 — 가장 큰 값"},{"w":"minimization","ko":"최소화","reason":"반의어 — 가장 작게 함"}],"collocBest":[{"en":"profit maximization","ko":"이익 극대화"},{"en":"the maximization of value","ko":"가치의 극대화"}]},"nuance":{"koSimple":"어떤 값이나 효과를 가능한 한 가장 크게 끌어올리는 것이에요","whenToUse":"이익·효율·성과의 극대화 전략을 논할 때 자주 써요"},"krDetail":[{"ko":"극대화","explain":"가장 크게 만들기"}],"usageExamples":[{"en":"The board criticized the plan for its narrow focus on profit maximization.","ko":"이사회는 이익 극대화에만 좁게 초점을 맞춘 그 계획을 비판했다."},{"en":"Energy maximization is a key goal in designing efficient solar panels.","ko":"에너지 극대화는 효율적인 태양광 패널을 설계할 때의 핵심 목표다."}],"grammarNote":"maximization은 '극대화'를 뜻하는 명사로, profit/value maximization처럼 다른 명사와 결합한다. 동사형은 maximize, 반대말은 minimization이다.","grammarQuiz":[{"sentence":"The strategy _____ focused on profit maximization ultimately neglected long-term sustainability.","ko":"이윤 극대화에 초점을 맞춘 그 전략은 결국 장기적 지속가능성을 소홀히 했다.","answer":"that","hint":"사물 선행사 + 주격 관계대명사"}]},
    {"id":"v08773","w":"omission","pos":["noun"],"ph":"/oʊˈmɪʃən/","cefr":"B2","kr":["생략"],"ex":[{"en":"The omission of a single comma completely changed the meaning of the legal contract.","ko":"쉼표 하나의 생략이 그 법적 계약의 의미를 완전히 바꾸어 놓았다."}],"mnemonic":{"soundHint":"오미션 → 'omit(생략)'의 명사","story":"쉼표 하나를 omit(생략)한 결과 = 생략.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"exclusion","ko":"제외","reason":"유의어 — 빼놓음"},{"w":"oversight","ko":"누락","reason":"유의어 — 빠뜨린 실수"},{"w":"inclusion","ko":"포함","reason":"반의어 — 넣음"}],"collocBest":[{"en":"a glaring omission","ko":"명백한 누락"},{"en":"errors of omission","ko":"빠뜨려서 생긴 오류"}]},"nuance":{"koSimple":"마땅히 포함해야 할 것을 빠뜨리거나 넣지 않은 상태를 뜻해요","whenToUse":"문서·계약·기록에서 빠진 항목을 지적할 때 자주 써요"},"krDetail":[{"ko":"생략","explain":"빼고 넘어감"}],"usageExamples":[{"en":"The report contained several serious omissions that changed its final conclusion.","ko":"그 보고서에는 최종 결론을 바꿔 버린 몇 가지 심각한 누락이 있었다."},{"en":"Whether by omission or by intent, key facts were left out of the article.","ko":"누락에 의한 것이든 의도에 의한 것이든, 핵심 사실들이 그 기사에서 빠져 있었다."}],"grammarNote":"omission은 '생략·누락'을 뜻하는 명사로, 동사형은 omit(생략하다)이다. errors of omission(누락에 의한 오류)처럼 of와 결합해 쓰인다.","grammarQuiz":[{"sentence":"The meaning of the legal contract _____ completely changed by the omission of a single comma.","ko":"법적 계약의 의미는 쉼표 하나의 생략으로 완전히 바뀌었다.","answer":"was","hint":"수동태(be + p.p.) 과거형"}]},
    {"id":"v08806","w":"prospective","pos":["adj"],"ph":"/prəˈspɛktɪv/","cefr":"B2","kr":["장래의, 미래의","가망이 있는, 유망한"],"ex":[{"en":"The university sent detailed brochures to all prospective students planning to apply next semester.","ko":"그 대학은 다음 학기에 지원할 계획인 모든 장래의 학생들에게 자세한 안내 책자를 보냈다."}],"mnemonic":{"soundHint":"프로스펙티브 → 'prospect(전망)'의 형용사","story":"밝은 prospect(전망)가 있는 학생 = 장래의·유망한.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"potential","ko":"잠재적인","reason":"동의어 — 될 만한"},{"w":"future","ko":"미래의","reason":"유의어 — 앞으로의"},{"w":"current","ko":"현재의","reason":"반의어 — 지금의"}],"collocBest":[{"en":"prospective students","ko":"예비 학생들"},{"en":"a prospective buyer","ko":"잠재 구매자"}]},"nuance":{"koSimple":"앞으로 그렇게 될 가능성이나 전망이 있는 상태를 뜻해요","whenToUse":"잠재 고객·지원자·투자자를 소개할 때 자주 써요"},"krDetail":[{"ko":"장래의, 미래의","explain":"앞으로 다가올"},{"ko":"가망이 있는, 유망한","explain":"될 가능성이 큰"}],"usageExamples":[{"en":"The agent showed the house to several prospective buyers over the weekend.","ko":"그 중개인은 주말 동안 여러 명의 잠재적 매수자에게 그 집을 보여 주었다."},{"en":"The company interviewed a prospective partner for its new overseas project.","ko":"그 회사는 새 해외 프로젝트를 위해 유망한 협력사를 면담했다."}],"grammarNote":"prospective는 '장차 ~가 될, 유망한'을 뜻하는 형용사로 prospective buyer/student/employee처럼 명사 앞에서 쓴다. perspective(관점)와 철자를 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"The brochures _____ (send) to prospective students have already arrived. (분사 활용)","ko":"장래의 학생들에게 보내진 안내 책자는 이미 도착했다.","answer":"sent","hint":"과거분사가 명사를 뒤에서 수식(수동)"}]},
    {"id":"v08716","w":"in the presence of","pos":["phrase"],"ph":"/ˈprɛzəns/","cefr":"B2","kr":["~이 있을 때, ~가 있는 데서"],"ex":[{"en":"Children usually behave differently in the presence of unfamiliar adults or strict authority figures.","ko":"아이들은 대개 낯선 어른들이나 엄한 권위자들이 있을 때 다르게 행동한다."}],"mnemonic":{"soundHint":"인 더 프레즌스 오브 → 'presence(존재)' 안에","story":"권위자의 presence(존재) 안에서 = ~가 있는 자리에서.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"before","ko":"~앞에서","reason":"동의어 — 눈앞에"},{"w":"alongside","ko":"곁에서","reason":"동의어 — 함께 있을 때"},{"w":"in the absence of","ko":"~이 없을 때","reason":"반의어 — 자리에 없음"}],"collocBest":[{"en":"in the presence of guests","ko":"손님이 있는 데서"},{"en":"nervous in the presence of","ko":"~가 있을 때 긴장한"}]},"nuance":{"koSimple":"특정 사람이나 존재가 함께 있는 상황을 강조해 가리키는 뜻이에요","whenToUse":"격식 있는 자리나 권위자 앞에서의 태도를 말할 때 써요"},"krDetail":[{"ko":"~이 있을 때, ~가 있는 데서","explain":"그 사람 앞에서"}],"usageExamples":[{"en":"The document must be signed in the presence of a qualified lawyer.","ko":"그 서류는 자격을 갖춘 변호사가 있는 자리에서 서명되어야 한다."},{"en":"He always felt nervous in the presence of his strict grandfather.","ko":"그는 엄격한 할아버지 앞에서는 언제나 긴장했다."}],"grammarNote":"in the presence of 뒤에는 사람이나 사물 명사가 온다. 반대 표현은 in the absence of(~이 없을 때)로 함께 익혀 두면 좋다.","grammarQuiz":[{"sentence":"Rarely _____ children behave the same way in the presence of strict authority figures.","ko":"아이들은 엄한 권위자들이 있을 때 좀처럼 같은 방식으로 행동하지 않는다.","answer":"do","hint":"부정 부사(Rarely) 문두 도치 (조동사 + 주어)"}]},
    {"id":"v08854","w":"stand out","pos":["phrase"],"ph":"/stænd/","cefr":"B2","kr":["두각을 나타내다, 돋보이다"],"ex":[{"en":"Her original approach to problem solving really made her stand out among peers.","ko":"문제 해결에 대한 그녀의 독창적인 접근법은 정말로 그녀를 또래들 사이에서 돋보이게 했다."}],"mnemonic":{"soundHint":"'스탠드 아웃' → 무리 밖으로(out) 서(stand) 있다","story":"또래들 사이에서 그녀만 앞으로 나와 서 있는 듯 돋보이다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"excel","ko":"뛰어나다","reason":"유의어 — 남보다 우수함"},{"w":"shine","ko":"빛나다","reason":"유의어 — 돋보이다"},{"w":"blend in","ko":"묻히다","reason":"반의어 — 눈에 안 띔"}],"collocBest":[{"en":"stand out from the crowd","ko":"무리 중에서 돋보이다"},{"en":"stand out from the competition","ko":"경쟁에서 두각을 나타내다"}]},"nuance":{"koSimple":"여러 사람이나 사물 사이에서 눈에 띄게 두드러져 돋보이는 것을 뜻합니다.","whenToUse":"재능·외모·성과 등이 뛰어나 남들과 차별화된 인상을 줄 때 자주 씁니다."},"krDetail":[{"ko":"두각을 나타내다, 돋보이다","explain":"남보다 도드라져 보이다"}],"usageExamples":[{"en":"The bright red cover makes this book stand out on the crowded shelf.","ko":"선명한 빨간 표지 덕분에 이 책은 빽빽한 책장에서 눈에 띈다."},{"en":"A few candidates clearly stood out during the interviews yesterday.","ko":"어제 면접에서 몇몇 지원자가 분명히 두드러졌다."}],"grammarNote":"stand out은 자동사구로 '두드러지다/눈에 띄다'를 뜻한다. 'stand out from/among ~'(~ 중에서 돋보이다), 'stand out as ~'(~로서 두드러지다) 형태로 확장된다.","grammarQuiz":[{"sentence":"Her original approach made her _____ (stand) out among peers. (5형식, 사역동사 make)","ko":"그녀의 독창적 접근법은 그녀를 또래들 사이에서 돋보이게 만들었다.","answer":"stand","hint":"make + 목적어 + 원형부정사"}]},
    {"id":"v08632","w":"draw upon","pos":["phrase"],"ph":"/drɔː/","cefr":"B2","kr":["~에 의지하다"],"ex":[{"en":"Successful novelists often draw upon their own life experiences to create authentic characters.","ko":"성공한 소설가들은 종종 진정성 있는 인물을 창조하기 위해 자신의 인생 경험에 의지한다."}],"mnemonic":{"soundHint":"드로 어폰 → 'upon(위쪽)에서 draw(끌어당김)'","story":"자기 경험 위(upon)에서 draw(끌어와) 의지한다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"rely on","ko":"의지하다","reason":"동의어 — 기대어 씀"},{"w":"tap into","ko":"끌어쓰다","reason":"동의어 — 꺼내 활용"},{"w":"disregard","ko":"무시하다","reason":"반의어 — 쓰지 않음"}],"collocBest":[{"en":"draw upon experience","ko":"경험에 의지하다"},{"en":"draw upon resources","ko":"자원을 활용하다"}]},"nuance":{"koSimple":"자기 경험이나 자원을 참고해 무언가에 끌어와 쓴다는 뜻이에요","whenToUse":"창작·연구에서 지식과 경험을 활용할 때 자주 써요"},"krDetail":[{"ko":"~에 의지하다","explain":"경험·지식을 끌어다 쓰다"}],"usageExamples":[{"en":"In tough times, she drew upon years of professional experience.","ko":"힘든 시기에 그녀는 수년간의 직업 경험에 의지했다."},{"en":"The lecture draws upon research from many different fields.","ko":"그 강의는 여러 다른 분야의 연구를 활용한다."}],"grammarNote":"'draw on'과 같은 뜻으로, '(축적된 지식·경험·자원을) 활용하다, 끌어다 쓰다'를 나타낸다. 'upon' 뒤에는 활용하는 대상이 온다.","grammarQuiz":[{"sentence":"Success in fiction writing often comes from _____ upon one's own life experiences.","ko":"소설 쓰기에서의 성공은 종종 자신의 인생 경험에 의지하는 데서 온다.","answer":"drawing","hint":"전치사(from) + 동명사(-ing)"}]},
    {"id":"v08893","w":"wetland","pos":["noun"],"ph":"/ˈwɛtlænd/","cefr":"B2","kr":["습지, 습지대"],"ex":[{"en":"Coastal wetlands play a crucial role in protecting inland areas from severe storm damage.","ko":"해안 습지는 내륙 지역을 심각한 폭풍 피해로부터 보호하는 중요한 역할을 한다."}],"mnemonic":{"soundHint":"'웻랜드' → 'wet(젖은)+land(땅)' 젖은 땅","story":"폭풍으로부터 내륙을 지켜주는 축축한 해안 습지대","hintConfidence":3},"pairs":{"buddyWords":[{"w":"marsh","ko":"늪","reason":"유의어 — 풀 많은 습지"},{"w":"swamp","ko":"습지","reason":"유의어 — 나무 있는 습지"},{"w":"desert","ko":"사막","reason":"반의어 — 메마른 땅"}],"collocBest":[{"en":"protect the wetlands","ko":"습지를 보호하다"},{"en":"coastal wetlands","ko":"해안 습지"}]},"nuance":{"koSimple":"물기가 많고 다양한 생물이 사는 습기 많은 자연 지역을 뜻합니다.","whenToUse":"생태 보전, 환경 보호, 기후·홍수 조절 논의에서 자연 지형으로 씁니다."},"krDetail":[{"ko":"습지, 습지대","explain":"물기 많은 축축한 땅"}],"usageExamples":[{"en":"This protected wetland is home to many rare species of migratory birds.","ko":"이 보호 습지는 많은 희귀 철새 종의 서식지이다."},{"en":"Draining the wetlands has destroyed important natural habitats for wildlife.","ko":"습지의 물을 빼내는 것은 야생 동물에게 중요한 자연 서식지를 파괴해 왔다."}],"grammarNote":"wetland는 '습지'를 뜻하며, 넓은 지역이나 여러 습지를 가리킬 때 흔히 복수형 wetlands로 쓴다. 한 단어로 붙여 쓰며 wet land로 띄어 쓰지 않는다.","grammarQuiz":[{"sentence":"Coastal wetlands play a crucial role in _____ (protect) inland areas from storms. (동명사)","ko":"해안 습지는 내륙 지역을 폭풍으로부터 보호하는 데 중요한 역할을 한다.","answer":"protecting","hint":"전치사 in + 동명사"}]},
    {"id":"v08851","w":"specify","pos":["verb"],"ph":"/ˈspɛsɪfaɪ/","cefr":"B2","kr":["명시하다"],"ex":[{"en":"The contract must specify the exact deadlines and precise responsibilities of each involved party.","ko":"그 계약은 각 관련 당사자의 정확한 마감일과 명확한 책임을 명시해야 한다."}],"mnemonic":{"soundHint":"'스페시파이' → 'special(특별)+fy(만들다)' 특별히 콕 집어","story":"계약서에 마감일과 책임을 하나하나 콕 집어 명시하는 장면","hintConfidence":3},"pairs":{"buddyWords":[{"w":"detail","ko":"상세히 말하다","reason":"유의어 — 낱낱이 밝힘"},{"w":"define","ko":"규정하다","reason":"유의어 — 분명히 정함"},{"w":"generalize","ko":"뭉뚱그리다","reason":"반의어 — 두루뭉술하게 함"}],"collocBest":[{"en":"specify the requirements","ko":"요건을 명시하다"},{"en":"unless otherwise specified","ko":"달리 명시되지 않는 한"}]},"nuance":{"koSimple":"무엇을 애매하지 않게 구체적으로 정확히 지정하거나 밝히는 것을 뜻합니다.","whenToUse":"계약서·지시문·설명서에서 조건·수량·기한 등을 분명히 밝힐 때 씁니다."},"krDetail":[{"ko":"명시하다","explain":"분명하게 딱 밝히다"}],"usageExamples":[{"en":"Please specify your dietary requirements when you book the conference dinner.","ko":"학회 만찬을 예약할 때 본인의 식단 요구 사항을 명시해 주세요."},{"en":"The instructions did not specify how long the sample should be heated.","ko":"설명서에는 시료를 얼마나 오래 가열해야 하는지가 명시되어 있지 않았다."}],"grammarNote":"specify는 타동사로 목적어를 직접 취하며, specify that절이나 specify + wh-절(how/what/when...) 형태도 가능하다. 명사형은 specification이다.","grammarQuiz":[{"sentence":"The contract must specify the deadlines and the responsibilities _____ each party has. (관계대명사)","ko":"그 계약은 각 당사자가 가진 마감일과 책임을 명시해야 한다.","answer":"that","hint":"목적격 관계대명사 (which도 가능)"}]}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

  // dots
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  const total = DATA.chapter.totalCount;
  for(let i=0;i<total;i++){
    const d = document.createElement("div");
    d.className = "dot";
    if(state.phase === "study"){
      if(i < state.cardIdx) d.classList.add("done");
      else if(i === state.cardIdx) d.classList.add("current");
    } else if(state.phase === "quiz" || state.phase === "result"){
      d.classList.add("done");
    }
    dots.appendChild(d);
  }
  // pbar
  let pct = 0;
  if(state.phase === "study") pct = (state.cardIdx / total) * 60;
  else if(state.phase === "quiz") pct = 60 + (state.quizIdx / 15) * 35;
  else if(state.phase === "result") pct = 100;
  document.getElementById("pbarFill").style.width = pct + "%";

  // sfx
  document.getElementById("sfxBtn").textContent = state.sfxOn ? "🔊" : "🔇";
  document.getElementById("sfxBtn").classList.toggle("on", state.sfxOn);
  document.getElementById("cbBtn").classList.toggle("on", state.cbMode);
}

function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function startTimer(){
  if(state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(()=>{
    if(state.phase === "result"){ clearInterval(state.tickHandle); return; }
    const el = Date.now() - state.startTime + (state.sessionElapsedBase || 0);
    document.getElementById("timerVal").textContent = fmtTime(el);
  }, 1000);
}

function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function flipCard(){
  const card = document.getElementById("flipcard");
  if(!card) return;
  state.flipped = !state.flipped;
  card.classList.toggle("flipped", state.flipped);
  SFX.cardFlip();
  if(state.flipped){
    const w = state.cards[state.cardIdx];
    speak(w.w);
  }
}

function navCard(dir){
  if(dir === "home"){
    SFX.cardFlip();
    renderHome();
    return;
  }
  if(dir === "prev"){
    if(state.cardIdx > 0){
      state.cardIdx--;
      SFX.cardFlip();
      renderCard();
    }
    return;
  }
  // next
  if(state.cardIdx >= state.cards.length - 1){
    // 마지막 카드에서 Next → 미니퀴즈 진입
    state.cardIdx = state.cards.length;
    startQuiz();
    return;
  }
  state.cardIdx++;
  SFX.cardFlip();
  renderCard();
}

const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  if(DATA.reviewTest && Array.isArray(DATA.basicPool)) return shuffle([...DATA.basicPool]);
  const pool = [];
  const words = [...DATA.newWords];
  const shuffled = shuffle(words).slice(0, 15);
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];
  shuffle(modeOrder);
  shuffled.forEach((w,i)=>{ pool.push({ word:w, mode: modeOrder[i] }); });
  return pool;
}

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  if(DATA.reviewTest && Array.isArray(DATA.advPool)) return shuffle([...DATA.advPool]);
  return [];
}

  state.quizWrongIds = new Set();
  state.quizWrongItems = [];

function renderQuiz(){
  if(state.quizIdx >= state.quizPool.length){
    finishSession();
    return;
  }
  state.quizAnswered = false;
  state.quizCurrent = state.quizPool[state.quizIdx];
  renderHeader();

  const { word, mode } = state.quizCurrent;
  const main = document.getElementById("main");

  let modeLabel = ({
    "meaning-mcq":"영→한 의미",
    "word-mcq":"한→영 단어",
    "spelling":"철자 입력",
    "listening":"듣고 받아쓰기",
    "colloc-write":"🎯 콜로케이션 영작",
    "cloze":"🎯 예문 빈칸 채우기",
    "grammar-fill":"📌 문법 서술형 빈칸",
    "rt-ex-mcq":"📝 예문 빈칸 선택"
  })[mode] || mode;

  let promptHTML = "";
  let answerHTML = "";

  if(mode === "meaning-mcq"){
    const correct = word.kr[0];
    const distractors = pickDistractors(word, "kr", 3);
    const opts = shuffle([correct, ...distractors]);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">다음 단어의 뜻은?</div>
        <div class="qword">${escape(word.w)}</div>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}
      </div>`;
  } else if(mode === "word-mcq"){
    const correct = word.w;
    const distractors = pickDistractors(word, "w", 3);
    const opts = shuffle([correct, ...distractors]);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">다음 뜻의 단어는?</div>
        <div class="qkr">${escape(word.kr.join(" · "))}</div>
      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}
      </div>`;
  } else if(mode === "rt-ex-mcq"){
    const s = state.quizCurrent.sentence;
    const bIdx = state.quizCurrent.blankTokenIdx;
    const toks = (function(str){
      const t = []; const re = /([A-Za-z']+)|([^A-Za-z']+)/g; let m;
      while((m = re.exec(str)) !== null){
        if(m[1]) t.push({ word:true, text:m[1] });
        else t.push({ word:false, text:m[2] });
      }
      return t;
    })(s.en);
    const displayEn = toks.map((t,i) => i === bIdx ? '_____' : t.text).join('');
    const correct = word.w;
    const distractors = pickDistractors(word, "w", 3);
    const opts = shuffle([correct, ...distractors]);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">📝 빈칸에 들어갈 단어는?</div>
        <div class="qkr" style="font-size:.9rem;opacity:.85;">${escape(s.ko)}</div>
        <div class="qword" style="font-size:1.05rem;line-height:1.55;letter-spacing:.01em;margin-top:8px;">${escape(displayEn)}</div>
      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}

  } else if(mode === "colloc-write"){
    const c = state.quizCurrent.colloc;
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">뜻에 맞는 <b>콜로케이션</b>을 영어로 쓰세요 <span class="prefill-hint">(각 단어 첫 글자 잠금)</span></div>
        <div class="qkr">${escape(c.ko)}</div>

    answerHTML = `
      <div class="input-box">
        <div class="word-answer" id="wordAnswer" data-answer="${escape(c.en)}"></div>
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "cloze"){
    const { tokens, blankIdxs, sentence } = state.quizCurrent;
    const sentHTML = tokens.map((t, i) => {
      const bIdx = blankIdxs.indexOf(i);
      if(bIdx >= 0){
        return `<span class="word-answer inline cloze-wa" data-blank-idx="${bIdx}" data-answer="${escape(t.text)}"></span>`;

      return escape(t.text);
    }).join("");
    promptHTML = `
      <div class="quiz-prompt cloze-prompt">
        <div class="label">해석에 맞게 <b>${blankIdxs.length}개 빈칸</b>을 채우세요 <span class="prefill-hint">(각 단어 첫 글자 잠금)</span></div>
        <div class="qkr">${escape(sentence.ko)}</div>

    const sentHTML = escape(quiz.sentence).replace(/_{3,}/g, () => {
      const ans = ansList[blankSeq] ?? ansList[0];
      const idx = blankSeq++;

    if(first) setTimeout(()=>first.focus(), 100);
  } else {

    if(mode === "listening"){
      setTimeout(()=>speak(word.w), 250);
      document.getElementById("lisBtn").addEventListener("click", ()=>speak(word.w));
    }
  }
}

function pickDistractors(word, field, n){
  const pool = DATA.newWords.filter(w=>w.id !== word.id);
  shuffle(pool);
  const seen = new Set();
  const out = [];
  for(const w of pool){
    let v;
    if(field === "kr") v = w.kr[0];
    else if(field === "w") v = w.w;
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function handleChoice(btn){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { word, mode } = state.quizCurrent;
  const picked = btn.dataset.v;
  const correct = (mode === "meaning-mcq") ? word.kr[0] : word.w;
  const isCorrect = picked === correct;

  document.querySelectorAll(".choice").forEach(c=>{
    if(c.dataset.v === correct) c.classList.add("correct");
    else if(c === btn && !isCorrect) c.classList.add("wrong");
    else c.classList.add("dimmed");
  });

  finishQuestion(isCorrect);
}

function handleSubmit(){
  if(state.quizAnswered) return;
  const { word, mode } = state.quizCurrent;

  // ── 심화: 예문 빈칸 · 문법 빈칸 ────────────────────────
  if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    if(containers.some(anyWordEmpty)) return;
    state.quizAnswered = true;
    let allOk = true;
    containers.forEach(function(c){
      const guess = normalizeAnswer(collectWordAnswer(c));
      const ans = normalizeAnswer(c.dataset.answer);
      const okAll = guess === ans;
      const perGroup = Array.from(c.querySelectorAll('.word-group')).map(function(g, i){
        const w = (c.dataset.answer || '').split(/\s+/)[i] || '';
        const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
        return normalizeAnswer(combined) === normalizeAnswer(w);
      });
      markWordAnswer(c, perGroup);
      if(!okAll) allOk = false;
    });
    document.getElementById("submitBtn").disabled = true;
    if(!allOk){
      const answers = containers.map(function(c){ return `<b style="color:var(--grade)">${escape(c.dataset.answer)}</b>`; }).join(" , ");
      document.getElementById("feedback").innerHTML = `정답: ${answers}`;
    }
    finishQuestion(allOk);
    return;
  }

  // ── 기본/심화 단일 컨테이너: spelling / listening / colloc-write
  const container = document.getElementById("wordAnswer");
  if(!container) return;
  if(anyWordEmpty(container)) return;
  state.quizAnswered = true;
  const correctAns = container.dataset.answer;
  const guess = normalizeAnswer(collectWordAnswer(container));
  const isCorrect = guess === normalizeAnswer(correctAns);
  const perGroup = Array.from(container.querySelectorAll('.word-group')).map(function(g, i){
    const w = (correctAns || '').split(/\s+/)[i] || '';
    const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
    return normalizeAnswer(combined) === normalizeAnswer(w);
  });
  markWordAnswer(container, perGroup);
  document.getElementById("submitBtn").disabled = true;
  if(!isCorrect){
    document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(correctAns)}</b>`;
  }
  finishQuestion(isCorrect);
}

function finishQuestion(isCorrect){
  const { word } = state.quizCurrent;
  const fb = document.getElementById("feedback");
  if(isCorrect){
    state.quizCorrect++;
    state.streak++;
    state.xp += DATA.xpTable.correct;
    promoteBox(word.id);
    SFX.correct();
    fb.classList.add("ok");
    fb.textContent = "정답! +" + DATA.xpTable.correct + " XP " + (state.cbMode ? "✓" : "");
    document.querySelector(".quiz-card").classList.add("bounce-correct");
    handleStreak();
  } else {
    state.streak = 0;
    demoteBox(word.id);
    state.quizWrongIds.add(word.id);
    state.quizWrongItems.push(state.quizCurrent);
    SFX.wrong();
    fb.classList.add("bad");
    if(!fb.textContent) fb.textContent = "오답! " + (state.cbMode ? "✕ " : "") + " 정답: " + word.w;
    document.querySelector(".quiz-card").classList.add("shake");
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.perChapterMaxStreak = Math.max(state.perChapterMaxStreak, state.streak);
  renderHeader();

  setTimeout(()=>{
    state.quizIdx++;
    renderQuiz();
  }, isCorrect ? 900 : 1500);
}

/* 빈칸 힌트: 정답 문자열의 각 단어 첫 글자를 "a… b…" 형태로 반환
   예: "appeared" → "a…"  ·  "in the absence of" → "i… t… a… o…"  ·  "feel bad" → "f… b…"  */
function firstCharsHint(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'') + '…').join(' ');
}
/* 빈칸 프리필: 정답 각 단어의 첫 글자를 공백으로 이어붙여 반환 (인풋 value 로 채워둠)
   예: "appeared" → "a"  ·  "in the absence of" → "i t a o"  ·  "feel bad" → "f b"  */
function firstCharsPrefill(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'')).join(' ');
}
/* 인풋에 프리필된 첫 글자 잠금 + 커서 이동 훅 부착 */
function attachPrefillGuard(inp){
  const prefill = inp.dataset.prefill || '';
  if(!prefill) return;
  const moveCursorEnd = () => { try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){} };
  inp.addEventListener('focus', () => setTimeout(moveCursorEnd, 0));
  inp.addEventListener('click', () => {
    if(inp.selectionStart < prefill.length) moveCursorEnd();
  });
  inp.addEventListener('keydown', e => {
    // 프리필 영역 보호: 첫 글자들을 지우거나 그 앞으로 이동하는 키 방지
    const s = inp.selectionStart, e2 = inp.selectionEnd;
    if(e.key === 'Backspace' && s <= prefill.length && s === e2){ e.preventDefault(); moveCursorEnd(); return; }
    if(e.key === 'Delete'    && s <  prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
    if((e.key === 'ArrowLeft' || e.key === 'Home') && s <= prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
  });
  inp.addEventListener('input', () => {
    // 사용자 값이 프리필로 시작하지 않으면 프리필을 앞에 다시 붙임 (드래그·잘라내기 등 방지)
    if(!inp.value.startsWith(prefill)){
      inp.value = prefill + inp.value.replace(new RegExp('^' + prefill.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').slice(0,0)),'');
      moveCursorEnd();
    }
  });
}
/* 프리필 인풋에서 사용자가 실제로 추가 입력한 부분이 있는지 (첫 글자만 남은 상태는 미제출) */
function hasUserInput(inp){
  const prefill = inp.dataset.prefill || '';
  return (inp.value||'').trim().length > prefill.trim().length;
}
/* ============================================================
   낱말박스 (자동완성 방어) — 각 단어당 [잠금 첫글자] + [빈 인풋]
   ============================================================ */
function renderWordAnswer(container, answer){
  container.innerHTML = '';
  const words = String(answer || '').trim().split(/\s+/).filter(Boolean);
  words.forEach((word, wi) => {
    const group = document.createElement('span');
    const isSingle = word.length <= 1;
    group.className = 'word-group' + (isSingle ? ' single-letter' : '');
    group.dataset.first = isSingle ? '' : (word[0] || '');
    group.dataset.full = word;
    if(!isSingle){
      const first = document.createElement('span');
      first.className = 'first-letter';
      first.textContent = word[0] || '';
      group.appendChild(first);
    }
    const inp = document.createElement('input');
    inp.className = 'rest-input';
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.autocorrect = 'off';
    inp.setAttribute('autocapitalize','off');
    inp.spellcheck = false;
    inp.inputMode = 'text';
    inp.name = 'wa-' + Math.random().toString(36).slice(2,8);
    inp.dataset.wi = wi;
    inp.setAttribute('aria-label', (wi+1) + '번째 단어의 나머지 스펠링');
    group.appendChild(inp);
    container.appendChild(group);
  });
  wireWordInputs(container);
}
function wireWordInputs(container){
  const inputs = Array.from(container.querySelectorAll('.rest-input'));
  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = (inp.value || '').toLowerCase().replace(/[^a-z'\-]/g,'');
    });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
        else { e.preventDefault(); handleSubmit(); }
      } else if(e.key === 'Tab' && !e.shiftKey){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
      } else if(e.key === 'Backspace' && !inp.value && i > 0){
        e.preventDefault();
        const prev = inputs[i-1];
        prev.focus();
        try{ prev.setSelectionRange(prev.value.length, prev.value.length); }catch(_e){}
      }
    });
  });
}
function collectWordAnswer(container){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  return groups.map(function(g){
    var inp = g.querySelector('.rest-input');
    return (g.dataset.first || '') + (inp ? inp.value : '');
  }).join(' ');
}
function anyWordEmpty(container){
  return Array.from(container.querySelectorAll('.rest-input')).some(function(i){ return !i.value.trim(); });
}
function markWordAnswer(container, perGroupOk){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  groups.forEach(function(g, i){
    g.classList.add(perGroupOk[i] ? 'correct' : 'wrong');
    var inp = g.querySelector('.rest-input');
    if(inp) inp.disabled = true;
  });
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function escape(s){
  if(s == null) return "";
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ============================================================
   GLOBAL EVENTS
   ============================================================ */
document.getElementById("sfxBtn").addEventListener("click", ()=>{
  state.sfxOn = !state.sfxOn;
  lsSet(SFX_KEY, state.sfxOn);
  renderHeader();
  if(state.sfxOn){ getAC(); SFX.streak(); }
});
document.getElementById("cbBtn").addEventListener("click", ()=>{
  state.cbMode = !state.cbMode;
  lsSet(CB_KEY, state.cbMode);
  document.body.classList.toggle("cb-mode", state.cbMode);
  renderHeader();
});

// keyboard
document.addEventListener("keydown", e=>{
  if(state.phase === "study"){
    if(e.code === "Space"){ e.preventDefault(); flipCard(); }
    else if(e.key === "1") navCard("prev");
    else if(e.key === "2") navCard("home");
    else if(e.key === "3") navCard("next");
    else if(e.key === "ArrowLeft") navCard("prev");
    else if(e.key === "ArrowRight") navCard("next");
  } else if(state.phase === "quiz" && !state.quizAnswered){
    const mode = state.quizCurrent && state.quizCurrent.mode;
    if(mode === "meaning-mcq" || mode === "word-mcq"){
      const n = parseInt(e.key, 10);
      if(n >= 1 && n <= 4){
        const btns = document.querySelectorAll(".choice");
        if(btns[n-1]) handleChoice(btns[n-1]);
      }
    }
  }
});

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  fx.init();
  if(state.cbMode) document.body.classList.add("cb-mode");
  renderHome();
}
boot();
</script>
