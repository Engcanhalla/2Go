    {"id":"n07662","w":"relativity","pos":["noun"],"ph":"/ˌrɛləˈtɪvɪti/","cefr":"B2","kr":["상대성","상대성 이론"],"ex":[{"en":"Einstein's theory of relativity changed how we understand space and time.","ko":"아인슈타인의 상대성 이론은 우리가 공간과 시간을 이해하는 방식을 바꾸었다."}],"mnemonic":{"soundHint":"렐러티비티","story":"아인슈타인의 상대성 이론","hintConfidence":3},"pairs":{"buddyWords":[{"w":"relative","ko":"상대적인","reason":"관련어 — 견주어 정해지는"},{"w":"physics","ko":"물리학","reason":"관련어 — 이론이 속한 분야"},{"w":"absoluteness","ko":"절대성","reason":"반의어 — 변치 않음"}],"collocBest":[{"en":"theory of relativity","ko":"상대성 이론"},{"en":"general relativity","ko":"일반 상대성 이론"}]},"nuance":{"koSimple":"기준에 따라 시간·공간이 달라진다는 상대성 개념을 뜻하는 말이야.","whenToUse":"아인슈타인의 이론이나 상대적 비교를 말할 때 자주 등장하는 말이야."},"krDetail":[{"ko":"상대성","explain":"보는 기준에 따라 다름"},{"ko":"상대성 이론","explain":"아인슈타인의 물리 이론"}],"usageExamples":[{"en":"The concept of relativity applies to more than just physics.","ko":"상대성이라는 개념은 물리학에만 적용되는 것이 아니다."},{"en":"He explained relativity using a simple everyday example.","ko":"그는 간단한 일상적 예를 들어 상대성을 설명했다."}],"grammarNote":"보통 셀 수 없는 명사로 관사 없이 쓰며, \"the theory of relativity(상대성 이론)\"라는 표현으로 굳어져 자주 등장한다. 형용사 relative(상대적인)와 어원이 같다.","grammarQuiz":[{"sentence":"Einstein's theory of _____ changed our understanding of the universe.","ko":"아인슈타인의 상대성 이론은 우주에 대한 우리의 이해를 바꿨다.","answer":"relativity","hint":"전치사 of + 명사"}]},
    {"id":"n07433","w":"destructive","pos":["adjective"],"ph":"/dɪˈstrʌktɪv/","cefr":"B2","kr":["파괴적인","해로운"],"ex":[{"en":"The storm was one of the most destructive the region had ever seen.","ko":"그 폭풍은 그 지역이 겪은 것 중 가장 파괴적인 것 중 하나였다."}],"mnemonic":{"soundHint":"디스트럭티브","story":"'destroy(파괴)+ive' 파괴적인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"damaging","ko":"손상시키는","reason":"동의어 — 망가뜨리는"},{"w":"harmful","ko":"해로운","reason":"동의어 — 나쁜"},{"w":"constructive","ko":"건설적인","reason":"반의어 — 도움이 되는"}],"collocBest":[{"en":"destructive power","ko":"파괴력"},{"en":"destructive behavior","ko":"파괴적인 행동"}]},"nuance":{"koSimple":"물건이나 관계, 환경을 심하게 망가뜨리는 파괴적인 성질의","whenToUse":"폭력, 자연재해, 나쁜 습관의 부작용을 강조할 때 자주 사용"},"krDetail":[{"ko":"파괴적인","explain":"부수고 망치는"},{"ko":"해로운","explain":"나쁜 영향을 주는"}],"usageExamples":[{"en":"Jealousy can be a highly destructive emotion in relationships.","ko":"질투는 관계에서 매우 파괴적인 감정이 될 수 있다."},{"en":"The invasive species proved destructive to the local ecosystem.","ko":"그 침입종은 지역 생태계에 해로운 것으로 드러났다."}],"grammarNote":"destructive는 동사 destroy의 형용사형으로, 'destructive to ~' 형태로 '~에 해로운'을 나타내며 반대말은 constructive(건설적인)이다.","grammarQuiz":[{"sentence":"The hurricane had a _____ impact on the coastal towns.","ko":"허리케인은 해안 도시들에 파괴적인 영향을 미쳤다.","answer":"destructive","hint":"관사 + 형용사 + 명사 구조"}]},
    {"id":"n07736","w":"distinctive","pos":["adjective"],"ph":"/dɪˈstɪŋktɪv/","cefr":"B2","kr":["독특한","구별되는","특유의"],"ex":[{"en":"The singer has a distinctive voice that listeners recognize instantly.","ko":"그 가수는 청취자들이 즉시 알아차리는 독특한 목소리를 가지고 있다."}],"mnemonic":{"soundHint":"디스팅티브","story":"distinct(뚜렷한) + ive = 독특한, 특징적인","hintConfidence":3},"pairs":{"buddyWords":[{"w":"unique","ko":"독특한","reason":"동의어 — 하나뿐인"},{"w":"characteristic","ko":"특유의","reason":"유의어 — 그것다운"},{"w":"ordinary","ko":"평범한","reason":"반의어 — 흔한"}],"collocBest":[{"en":"distinctive style","ko":"독특한 스타일"},{"en":"distinctive feature","ko":"뚜렷한 특징"}]},"nuance":{"koSimple":"다른 것과 확실히 구별되는 독특한 특징을 뜻해요.","whenToUse":"브랜드·목소리·디자인의 개성을 강조할 때 써요."},"krDetail":[{"ko":"독특한","explain":"남다르고 특별한"},{"ko":"구별되는","explain":"딱 티가 나는"},{"ko":"특유의","explain":"그것만의"}],"usageExamples":[{"en":"The building's distinctive shape makes it easy to spot.","ko":"그 건물의 독특한 모양은 알아보기 쉽게 만든다."},{"en":"Each wine region produces grapes with a distinctive flavor.","ko":"각 포도주 산지는 특유의 풍미를 지닌 포도를 생산한다."}],"grammarNote":"'남과 뚜렷이 구별되는, 독특한'을 뜻하며 주로 명사 앞에서 쓴다. '분명한·별개의'를 뜻하는 distinct와 철자가 비슷하지만 의미가 다르므로 구분한다.","grammarQuiz":[{"sentence":"The restaurant is known for its _____ blend of Asian and European flavors.","ko":"그 레스토랑은 아시아와 유럽 풍미의 독특한 조합으로 유명하다.","answer":"distinctive","hint":"소유격 + _____ + 명사 — 형용사"}]},
    {"id":"n07401","w":"willingness","pos":["noun"],"ph":"/ˈwɪlɪŋnəs/","cefr":"B2","kr":["기꺼이 하려는 마음","의지"],"ex":[{"en":"His willingness to help others made him popular among his classmates.","ko":"다른 사람들을 기꺼이 도우려는 그의 마음은 그를 반 친구들 사이에서 인기 있게 만들었다."}],"mnemonic":{"soundHint":"윌링니스","story":"'willing(기꺼이)+ness' 자발성.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"eagerness","ko":"열의","reason":"동의어 — 하고픈 마음"},{"w":"readiness","ko":"준비된 마음","reason":"동의어 — 할 태세"},{"w":"reluctance","ko":"꺼림","reason":"반의어 — 하기 싫음"}],"collocBest":[{"en":"willingness to learn","ko":"배우려는 의지"},{"en":"willingness to help","ko":"기꺼이 도우려는 마음"}]},"nuance":{"koSimple":"어떤 일을 마다하지 않고 스스로 기꺼이 하려는 마음이나 의향","whenToUse":"협조, 도전, 변화에 대한 적극적 태도를 강조할 때 사용"},"krDetail":[{"ko":"기꺼이 하려는 마음","explain":"즐겁게 하려는 마음"},{"ko":"의지","explain":"하려는 굳은 마음"}],"usageExamples":[{"en":"Her willingness to take risks helped the startup succeed.","ko":"위험을 감수하려는 그녀의 의지가 그 스타트업의 성공을 도왔다."},{"en":"The manager praised the team's willingness to learn new skills.","ko":"그 관리자는 새로운 기술을 배우려는 팀의 의지를 칭찬했다."}],"grammarNote":"willingness는 보통 'willingness to + 동사원형' 형태로 '기꺼이 ~하려는 마음'을 나타내며, 반대말은 unwillingness/reluctance이다.","grammarQuiz":[{"sentence":"Her _____ to help others made her popular among her classmates.","ko":"다른 사람들을 기꺼이 도우려는 그녀의 의지가 그녀를 급우들 사이에서 인기 있게 만들었다.","answer":"willingness","hint":"소유격(Her) + 명사 + to부정사"}]},
    {"id":"n07448","w":"applause","pos":["noun"],"ph":"/əˈplɔːz/","cefr":"B2","kr":["박수","갈채"],"ex":[{"en":"The audience broke into loud applause as the pianist finished her performance.","ko":"피아니스트가 연주를 마치자 관객들이 우렁찬 박수를 보냈다."}],"mnemonic":{"soundHint":"어플로즈","story":"'어플라이(apply)+오즈' 짝짝짝 박수.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"clapping","ko":"박수","reason":"동의어 — 손뼉 침"},{"w":"ovation","ko":"기립 박수","reason":"관련어 — 큰 박수"},{"w":"booing","ko":"야유","reason":"반의어 — 비난 소리"}],"collocBest":[{"en":"a round of applause","ko":"한바탕의 박수"},{"en":"burst into applause","ko":"박수가 터져 나오다"}]},"nuance":{"koSimple":"공연이나 발표를 잘한 것에 감탄해 손뼉을 쳐서 보내는 갈채","whenToUse":"무대나 발표 뒤 관객의 호응을 묘사하는 문장에서 자주 사용"},"krDetail":[{"ko":"박수","explain":"손뼉을 침"},{"ko":"갈채","explain":"크게 칭찬하며 손뼉"}],"usageExamples":[{"en":"The speech was met with warm applause from the crowd.","ko":"그 연설은 청중의 따뜻한 박수를 받았다."},{"en":"She received a round of applause for her brave decision.","ko":"그녀는 용감한 결정으로 한바탕 박수를 받았다."}],"grammarNote":"applause는 셀 수 없는 명사여서 a/복수형을 쓰지 않고, '한 차례의 박수'는 a round of applause, '박수치다'는 동사 applaud로 표현한다.","grammarQuiz":[{"sentence":"The audience burst into loud _____ after the performance.","ko":"공연이 끝난 후 관객들이 큰 박수를 터뜨렸다.","answer":"applause","hint":"불가산 명사 (a/an 불필요)"}]},
    {"id":"n07280","w":"specialized","pos":["adjective"],"ph":"/ˈspɛʃəlaɪzd/","cefr":"B2","kr":["전문화된","특수한"],"ex":[{"en":"Treating the disease requires highly specialized medical knowledge.","ko":"그 질병을 치료하려면 고도로 전문화된 의학 지식이 필요하다."}],"mnemonic":{"soundHint":"스페셜라이즈드","story":"special(특별)+ize+ed → 전문화된","hintConfidence":3},"pairs":{"buddyWords":[{"w":"expert","ko":"전문의","reason":"동의어 — 능숙함"},{"w":"focused","ko":"집중된","reason":"관련어 — 한 분야"},{"w":"general","ko":"일반적인","reason":"반의어 — 두루두루"}],"collocBest":[{"en":"specialized knowledge","ko":"전문 지식"},{"en":"highly specialized","ko":"고도로 전문화된"}]},"nuance":{"koSimple":"특정 분야에 맞게 특화되어 전문화된","whenToUse":"전문 장비·전문 기술을 말할 때 씀"},"krDetail":[{"ko":"전문화된","explain":"한 분야에 특화된"},{"ko":"특수한","explain":"보통과 다른 특별한"}],"usageExamples":[{"en":"Repairing this machine calls for specialized tools and proper training.","ko":"이 기계를 수리하려면 전문화된 도구와 제대로 된 훈련이 필요하다."},{"en":"She works in a highly specialized field of medicine.","ko":"그녀는 고도로 전문화된 의학 분야에서 일한다."}],"grammarNote":"specialized는 동사 specialize의 과거분사가 형용사로 굳어진 형태로 '전문화된'을 뜻한다. 동사는 'specialize in ~(~을 전문으로 하다)'처럼 전치사 in과 쓴다. 영국식은 specialised이다.","grammarQuiz":[{"sentence":"This hospital has _____ equipment for treating rare diseases.","ko":"이 병원은 희귀 질환을 치료하기 위한 전문화된 장비를 갖추고 있다.","answer":"specialized","hint":"형용사 + 명사(equipment) 수식"}]},
    {"id":"n07348","w":"collaboration","pos":["noun"],"ph":"/kəˌlæbəˈreɪʃən/","cefr":"B2","kr":["협업","협력"],"ex":[{"en":"The project was completed through close collaboration between two universities.","ko":"그 프로젝트는 두 대학 간의 긴밀한 협업을 통해 완료되었다."}],"mnemonic":{"soundHint":"컬래버레이션","story":"'컬래버' 함께 일함, 협업.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"cooperation","ko":"협력","reason":"동의어 — 함께 함"},{"w":"teamwork","ko":"팀워크","reason":"동의어 — 힘 합침"},{"w":"competition","ko":"경쟁","reason":"반의어 — 겨룸"}],"collocBest":[{"en":"close collaboration","ko":"긴밀한 협업"},{"en":"in collaboration with","ko":"~와 협력하여"}]},"nuance":{"koSimple":"여러 사람이나 조직이 함께 힘을 모아 일해 내는 협력 작업","whenToUse":"공동 프로젝트나 팀 간 함께하는 작업 관계를 말할 때 사용"},"krDetail":[{"ko":"협업","explain":"함께 힘 모아 일함"},{"ko":"협력","explain":"서로 도와 일함"}],"usageExamples":[{"en":"The album was a collaboration between two well-known artists.","ko":"그 앨범은 잘 알려진 두 예술가 사이의 협업이었다."},{"en":"Close collaboration among departments made the launch a success.","ko":"부서들 간의 긴밀한 협력이 그 출시를 성공으로 이끌었다."}],"grammarNote":"collaboration은 'collaboration between/with/among ~' 형태로 전치사와 결합하며, 'in collaboration with ~(~와 협력하여)'라는 관용 표현으로 자주 쓰인다. 동사형은 collaborate이다.","grammarQuiz":[{"sentence":"The project was completed through close _____ between the two departments.","ko":"그 프로젝트는 두 부서 간의 긴밀한 협력을 통해 완성되었다.","answer":"collaboration","hint":"형용사(close) 뒤 명사"}]},
    {"id":"n07332","w":"profitability","pos":["noun"],"ph":"/ˌprɑːfɪtəˈbɪlɪti/","cefr":"B2","kr":["수익성"],"ex":[{"en":"Cutting production costs significantly improved the firm's profitability.","ko":"생산 비용을 절감한 것이 그 회사의 수익성을 크게 향상시켰다."}],"mnemonic":{"soundHint":"프라피터빌리티","story":"'profit(이익)+ability(능력)' 수익성.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"profit","ko":"이익","reason":"어근 — 이익 남음"},{"w":"revenue","ko":"수입","reason":"관련어 — 벌어들임"},{"w":"loss","ko":"손실","reason":"반의어 — 밑짐"}],"collocBest":[{"en":"improve profitability","ko":"수익성을 향상시키다"},{"en":"long-term profitability","ko":"장기적 수익성"}]},"nuance":{"koSimple":"사업이나 투자가 얼마나 이익을 낼 수 있는지를 나타내는 정도","whenToUse":"회사 성과 평가나 투자 판단에서 이익 규모를 논할 때 사용"},"krDetail":[{"ko":"수익성","explain":"이익을 낼 수 있는 정도"}],"usageExamples":[{"en":"The new strategy improved the company's profitability within a few months.","ko":"그 새 전략은 몇 달 만에 회사의 수익성을 개선했다."},{"en":"Investors carefully examined the store's long-term profitability.","ko":"투자자들은 그 매장의 장기적인 수익성을 면밀히 검토했다."}],"grammarNote":"profitability는 형용사 profitable에서 파생된 추상명사로 셀 수 없다. profit(이익), profitable(수익성 있는)과 구별해 '수익을 낼 수 있는 정도'를 뜻한다.","grammarQuiz":[{"sentence":"The company improved its _____ by cutting production costs.","ko":"그 회사는 생산 비용을 줄여 수익성을 개선했다.","answer":"profitability","hint":"소유격(its) 뒤 명사"}]},
    {"id":"n07694","w":"certification","pos":["noun"],"ph":"/ˌsɜːrtɪfɪˈkeɪʃən/","cefr":"B2","kr":["인증","자격증"],"ex":[{"en":"The course provides an official certification upon completion.","ko":"그 과정은 수료 시 공식 자격증을 제공한다."}],"mnemonic":{"soundHint":"서티피케이션","story":"certify(증명) + ation = 자격증, 인증","hintConfidence":3},"pairs":{"buddyWords":[{"w":"accreditation","ko":"공인","reason":"동의어 — 공식 인정"},{"w":"qualification","ko":"자격","reason":"유의어 — 능력 증명"},{"w":"certificate","ko":"증명서","reason":"관련어 — 인증 문서"}],"collocBest":[{"en":"professional certification","ko":"전문 자격증"},{"en":"obtain certification","ko":"인증을 취득하다"}]},"nuance":{"koSimple":"자격이나 품질을 공식적으로 증명해 주는 인증을 뜻해요.","whenToUse":"자격증·안전 검사·품질 보증을 이야기할 때 써요."},"krDetail":[{"ko":"인증","explain":"옳다고 증명해 줌"},{"ko":"자격증","explain":"능력을 증명하는 문서"}],"usageExamples":[{"en":"She earned a professional certification in accounting last year.","ko":"그녀는 작년에 회계 분야의 전문 자격증을 취득했다."},{"en":"The product cannot be sold without safety certification.","ko":"그 제품은 안전 인증 없이는 판매될 수 없다."}],"grammarNote":"동사 certify(인증하다)에서 나온 명사로, '인증 과정'을 뜻하면 불가산, '취득한 자격'을 뜻하면 가산으로 쓴다. 발급된 문서 자체를 뜻하는 certificate(증명서)와 혼동하기 쉬우니 구분한다.","grammarQuiz":[{"sentence":"She earned a professional _____ in project management.","ko":"그녀는 프로젝트 관리 분야의 전문 자격증을 취득했다.","answer":"certification","hint":"형용사 + 명사 목적어"}]},
    {"id":"n07095","w":"neurons","pos":["noun"],"ph":"/ˈnʊrɑːnz/","cefr":"B2","kr":["신경 세포","뉴런"],"ex":[{"en":"Human brains contain billions of neurons that transmit signals faster than any current computer.","ko":"인간의 뇌에는 어떤 현대 컴퓨터보다 빠르게 신호를 전달하는 수십억 개의 뉴런이 있다."}],"mnemonic":{"soundHint":"뉴런스","story":"'뉴런(neuron)'들이 뇌 안에서 신호를 주고받는다(neurons).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"nerve","ko":"신경","reason":"관련어 — 신경 조직"},{"w":"cell","ko":"세포","reason":"상위어 — 세포의 한 종류"},{"w":"synapse","ko":"시냅스","reason":"관련어 — 뉴런 연결부"}],"collocBest":[{"en":"brain neurons","ko":"뇌 뉴런"},{"en":"connected neurons","ko":"연결된 뉴런"}]},"nuance":{"koSimple":"neuron의 복수형, 뇌·신경계의 여러 신경세포를 지칭하는 말","whenToUse":"뇌·신경 과학에서 신호를 주고받는 세포 집단을 설명할 때 사용"},"krDetail":[{"ko":"신경 세포","explain":"신호를 전달하는 세포"},{"ko":"뉴런","explain":"뇌의 신경 세포"}],"usageExamples":[{"en":"When we learn something new, neurons form fresh connections in the brain.","ko":"우리가 새로운 것을 배울 때, 뉴런들이 뇌 속에서 새로운 연결을 형성한다."},{"en":"Scientists studied how neurons communicate through tiny electrical signals.","ko":"과학자들은 뉴런들이 미세한 전기 신호를 통해 어떻게 소통하는지 연구했다."}],"grammarNote":"neurons는 neuron의 복수형으로, 복수 주어이므로 동사도 복수 일치(form, fire 등)한다. 형용사형 neural은 'neural network(신경망)'처럼 쓰인다.","grammarQuiz":[{"sentence":"The human brain contains approximately 86 billion _____.","ko":"인간의 뇌는 약 860억 개의 신경 세포를 포함하고 있다.","answer":"neurons","hint":"숫자 뒤 복수 명사"}]},
    {"id":"n07724","w":"specialization","pos":["noun"],"ph":"/ˌspɛʃələˈzeɪʃən/","cefr":"B2","kr":["전문화","전공"],"ex":[{"en":"Modern economies depend heavily on the specialization of labor across industries.","ko":"현대 경제는 산업 전반에 걸친 노동의 전문화에 크게 의존한다."}],"mnemonic":{"soundHint":"스페셜라이제이션","story":"special(특수) + ization = 전문화","hintConfidence":3},"pairs":{"buddyWords":[{"w":"expertise","ko":"전문성","reason":"관련어 — 전문 능력"},{"w":"specialty","ko":"전문 분야","reason":"유의어 — 특기 분야"},{"w":"generalization","ko":"일반화","reason":"반의어 — 두루 넓힘"}],"collocBest":[{"en":"area of specialization","ko":"전문 분야"},{"en":"increasing specialization","ko":"심화되는 전문화"}]},"nuance":{"koSimple":"특정 분야에 집중해 능력을 키우는 전문화를 뜻해요.","whenToUse":"직업·산업·학문의 세분화를 설명할 때 자주 써요."},"krDetail":[{"ko":"전문화","explain":"한 분야에 집중함"},{"ko":"전공","explain":"깊이 파는 분야"}],"usageExamples":[{"en":"Her specialization is medieval European history.","ko":"그녀의 전공은 중세 유럽사이다."},{"en":"Increasing specialization has made workers more efficient.","ko":"전문화가 심화되면서 노동자들은 더 효율적이 되었다."}],"grammarNote":"어떤 분야에 특화됐는지는 전치사 in으로 \"specialization in ~\"처럼 연결한다. 동사는 specialize (in), 영국식 철자는 specialisation이다.","grammarQuiz":[{"sentence":"Her area of _____ is child psychology.","ko":"그녀의 전공 분야는 아동 심리학이다.","answer":"specialization","hint":"전치사(of) 뒤 — 명사"}]},
    {"id":"n07329","w":"unpredictable","pos":["adjective"],"ph":"/ˌʌnprɪˈdɪktəbəl/","cefr":"B2","kr":["예측 불가능한","예측할 수 없는"],"ex":[{"en":"The weather in the mountains can be dangerously unpredictable.","ko":"산속의 날씨는 위험할 정도로 예측 불가능할 수 있다."}],"mnemonic":{"soundHint":"언프리딕터블","story":"'un(부정)+predict(예측)+able' 예측 불가.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"uncertain","ko":"불확실한","reason":"동의어 — 알 수 없음"},{"w":"erratic","ko":"불규칙한","reason":"동의어 — 들쭉날쭉"},{"w":"predictable","ko":"예측 가능한","reason":"반의어 — 정반대"}],"collocBest":[{"en":"unpredictable behavior","ko":"예측할 수 없는 행동"},{"en":"highly unpredictable","ko":"매우 예측 불가능한"}]},"nuance":{"koSimple":"어떻게 흘러갈지 미리 알 수 없어 종잡을 수 없는 상태나 성질","whenToUse":"날씨, 사람의 행동 등이 종잡을 수 없을 때 자주 사용"},"krDetail":[{"ko":"예측 불가능한","explain":"미리 알 수 없는"},{"ko":"예측할 수 없는","explain":"짐작이 안 되는"}],"usageExamples":[{"en":"His moods are so unpredictable that no one knows what to expect.","ko":"그의 기분은 너무 예측 불가능해서 아무도 무엇을 기대해야 할지 모른다."},{"en":"The stock market can be extremely unpredictable during a crisis.","ko":"주식 시장은 위기 상황에서 극도로 예측 불가능해질 수 있다."}],"grammarNote":"unpredictable은 접두사 un-이 predictable에 붙은 형태로 '예측할 수 없는'을 뜻한다. 부사형은 unpredictably이다.","grammarQuiz":[{"sentence":"The weather in this region is highly _____, so always carry an umbrella.","ko":"이 지역의 날씨는 매우 예측 불가능하니, 항상 우산을 가지고 다녀라.","answer":"unpredictable","hint":"be동사 + 부사(highly) + 형용사"}]},
    {"id":"n07698","w":"viral","pos":["adjective"],"ph":"/ˈvaɪrəl/","cefr":"B2","kr":["바이러스성의","입소문을 타는"],"ex":[{"en":"The funny video went viral within a single day.","ko":"그 재미있는 영상은 단 하루 만에 입소문을 탔다."}],"mnemonic":{"soundHint":"바이럴","story":"virus(바이러스)처럼 급속 확산되는","hintConfidence":3},"pairs":{"buddyWords":[{"w":"infectious","ko":"전염성의","reason":"유의어 — 옮아 퍼지는"},{"w":"trending","ko":"유행하는","reason":"유의어 — 널리 퍼지는"},{"w":"unpopular","ko":"인기 없는","reason":"반의어 — 안 퍼지는"}],"collocBest":[{"en":"go viral","ko":"입소문을 타다"},{"en":"a viral infection","ko":"바이러스성 감염"}]},"nuance":{"koSimple":"바이러스에 의한 것이거나 급속히 퍼지는 상태를 뜻해요.","whenToUse":"질병 원인이나 인터넷 확산 현상 이야기에 자주 써요."},"krDetail":[{"ko":"바이러스성의","explain":"바이러스로 생긴"},{"ko":"입소문을 타는","explain":"빠르게 퍼지는"}],"usageExamples":[{"en":"Marketers dream of creating content that goes viral.","ko":"마케터들은 입소문을 타는 콘텐츠를 만드는 것을 꿈꾼다."},{"en":"The infection is viral, so antibiotics will not help.","ko":"그 감염은 바이러스성이라서 항생제는 도움이 되지 않는다."}],"grammarNote":"\"go viral(입소문을 타다, 온라인에서 급속히 퍼지다)\"이라는 표현으로 자주 쓰이며, 의학에서는 '바이러스성의'(반대는 bacterial 세균성의)라는 뜻이다. 명사는 virus이다.","grammarQuiz":[{"sentence":"The short video went _____ and got millions of views.","ko":"그 짧은 영상은 입소문을 타며 수백만 조회수를 기록했다.","answer":"viral","hint":"go + 형용사 (go viral)"}]},
    {"id":"n07493","w":"morality","pos":["noun"],"ph":"/məˈrælɪti/","cefr":"B2","kr":["도덕성","도덕"],"ex":[{"en":"The novel raises deep questions about morality and personal responsibility.","ko":"그 소설은 도덕성과 개인의 책임에 관한 깊은 질문을 던진다."}],"mnemonic":{"soundHint":"모럴리티","story":"'moral(도덕)+ity' 도덕성.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"ethics","ko":"윤리","reason":"동의어 — 바른 도리"},{"w":"virtue","ko":"미덕","reason":"관련어 — 착한 성품"},{"w":"immorality","ko":"부도덕","reason":"반의어 — 옳지 못함"}],"collocBest":[{"en":"a sense of morality","ko":"도덕관념"},{"en":"question the morality of","ko":"~의 도덕성에 의문을 제기하다"}]},"nuance":{"koSimple":"옳고 그름의 기준이나 그에 따라 살아가는 사람의 도덕적 태도","whenToUse":"윤리, 종교, 사회 규범을 논하는 무거운 문맥에서 자주 사용"},"krDetail":[{"ko":"도덕성","explain":"옳게 행동하는 성품"},{"ko":"도덕","explain":"지켜야 할 바른 도리"}],"usageExamples":[{"en":"Philosophers have long debated the origins of human morality.","ko":"철학자들은 인간 도덕성의 기원을 오랫동안 논의해 왔다."},{"en":"He questioned the morality of using animals in experiments.","ko":"그는 실험에 동물을 사용하는 것의 도덕성에 의문을 제기했다."}],"grammarNote":"morality는 셀 수 없는 명사로 '도덕성'을 뜻하며, 형용사 moral, 반대 개념 immorality와 함께 익히고 '사기·의욕'을 뜻하는 morale과 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"The philosopher spent his life studying questions of _____.","ko":"그 철학자는 도덕성에 관한 질문을 연구하며 평생을 보냈다.","answer":"morality","hint":"전치사 of + 명사"}]},

    {"id":"n07460","w":"resistant","pos":["adjective"],"ph":"/rɪˈzɪstənt/","cefr":"B2","kr":["저항하는","내성이 있는"],"ex":[{"en":"Some bacteria have become resistant to common antibiotics.","ko":"일부 세균은 흔한 항생제에 내성이 생겼다."}],"mnemonic":{"soundHint":"리지스턴트","story":"'resist(저항)+ant' 저항하는.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"immune","ko":"면역이 있는","reason":"동의어 — 잘 견디는"},{"w":"opposing","ko":"맞서는","reason":"동의어 — 대드는"},{"w":"vulnerable","ko":"취약한","reason":"반의어 — 약한"}],"collocBest":[{"en":"resistant to change","ko":"변화에 저항하는"},{"en":"water-resistant material","ko":"방수 소재"}]},"nuance":{"koSimple":"외부의 힘, 변화, 약물에 잘 굴복하지 않고 버티는 성질의","whenToUse":"면역, 내구성, 개혁 반대 등 다양한 맥락에서 자주 사용"},"krDetail":[{"ko":"저항하는","explain":"맞서 버티는"},{"ko":"내성이 있는","explain":"잘 견디는"}],"usageExamples":[{"en":"This new material is highly resistant to heat and water.","ko":"이 새로운 소재는 열과 물에 매우 강하다."},{"en":"Many older employees were resistant to the sudden changes.","ko":"많은 나이 든 직원들은 갑작스러운 변화에 저항했다."}],"grammarNote":"resistant는 'resistant to ~' 형태로 '~에 저항력이 있는/내성이 있는'을 나타내며, 명사 resistance, 동사 resist와 함께 묶어 익히면 좋다.","grammarQuiz":[{"sentence":"Some bacteria have become _____ to common antibiotics.","ko":"일부 박테리아는 일반 항생제에 내성이 생겼다.","answer":"resistant","hint":"resistant to ~ (~에 저항하는)"}]},
    {"id":"n07181","w":"mindset","pos":["noun"],"ph":"/ˈmaɪndˌsɛt/","cefr":"B2","kr":["사고방식","마음가짐"],"ex":[{"en":"Adopting a growth mindset helped her overcome repeated failures.","ko":"성장 사고방식을 받아들인 것이 그녀가 반복된 실패를 극복하는 데 도움이 되었다."}],"mnemonic":{"soundHint":"마인드셋","story":"mind(마음)+set(고정) → 사고방식","hintConfidence":3},"pairs":{"buddyWords":[{"w":"attitude","ko":"태도","reason":"동의어 — 마음 자세"},{"w":"mentality","ko":"심리, 사고방식","reason":"동의어 — 생각 방식"},{"w":"outlook","ko":"관점, 전망","reason":"관련어 — 바라보는 눈"}],"collocBest":[{"en":"growth mindset","ko":"성장 사고방식"},{"en":"positive mindset","ko":"긍정적인 마음가짐"}]},"nuance":{"koSimple":"세상을 바라보는 몸에 밴 사고방식","whenToUse":"태도·관점의 습관적 틀을 말할 때 씀"},"krDetail":[{"ko":"사고방식","explain":"생각하는 방식"},{"ko":"마음가짐","explain":"마음의 자세"}],"usageExamples":[{"en":"Changing your mindset can completely change how you handle failure.","ko":"사고방식을 바꾸면 실패를 다루는 방식을 완전히 바꿀 수 있다."},{"en":"A positive mindset helps teams stay motivated under pressure.","ko":"긍정적인 마음가짐은 팀이 압박 속에서도 동기를 유지하도록 돕는다."}],"grammarNote":"mindset은 셀 수 있는 명사로 보통 형용사와 결합해 'a positive/fixed/growth mindset'처럼 쓴다. 'change/adopt/have a mindset' 같은 동사와 자주 어울린다.","grammarQuiz":[{"sentence":"Having a growth _____ helps students overcome academic challenges.","ko":"성장 마인드셋을 갖는 것은 학생들이 학업의 어려움을 극복하도록 돕는다.","answer":"mindset","hint":"growth + 명사 복합어"}]},
    {"id":"n07767","w":"deplore","pos":["verb"],"ph":"/dɪˈplɔːr/","cefr":"B2","kr":["개탄하다","비난하다"],"ex":[{"en":"Human rights groups deplore the use of violence against peaceful protesters.","ko":"인권 단체들은 평화로운 시위대에 대한 폭력 사용을 개탄한다."}],"mnemonic":{"soundHint":"디플로어","story":"de(강조) + plore(울다) = 개탄하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"lament","ko":"한탄하다","reason":"유의어 — 몹시 슬퍼함"},{"w":"condemn","ko":"비난하다","reason":"유의어 — 잘못 꾸짖음"},{"w":"praise","ko":"칭찬하다","reason":"반의어 — 좋게 말함"}],"collocBest":[{"en":"deeply deplore","ko":"깊이 개탄하다"},{"en":"deplore the lack","ko":"결여를 개탄하다"}]},"nuance":{"koSimple":"몹시 유감스럽게 여겨 강하게 비난하거나 개탄함을 뜻해요.","whenToUse":"부당한 사건·행위를 공식적으로 규탄할 때 써요."},"krDetail":[{"ko":"개탄하다","explain":"몹시 한탄하다"},{"ko":"비난하다","explain":"잘못을 나무라다"}],"usageExamples":[{"en":"Many citizens deplore the government's decision to cut education funding.","ko":"많은 시민들이 교육 예산을 삭감하려는 정부의 결정을 개탄한다."},{"en":"We deplore all forms of discrimination in the workplace.","ko":"우리는 직장 내 모든 형태의 차별을 개탄한다."}],"grammarNote":"격식체 타동사로 뒤에 개탄의 대상(명사·동명사)을 목적어로 취하며, deplore doing 형태도 가능하다.","grammarQuiz":[{"sentence":"Many citizens _____ the government's failure to address poverty.","ko":"많은 시민들은 빈곤 문제를 해결하지 못한 정부를 개탄한다.","answer":"deplore","hint":"주어(복수) + _____ — 동사 현재형"}]},
    {"id":"n07720","w":"grail","pos":["noun"],"ph":"/ɡreɪl/","cefr":"B2","kr":["성배","궁극적 목표"],"ex":[{"en":"For many researchers, a cure for the disease has become the holy grail of medicine.","ko":"많은 연구자들에게 그 질병의 치료법은 의학의 궁극적 목표가 되었다."}],"mnemonic":{"soundHint":"그레일","story":"Holy Grail = 성배, 궁극의 목표","hintConfidence":3},"pairs":{"buddyWords":[{"w":"chalice","ko":"성찬 잔","reason":"유의어 — 성스러운 잔"},{"w":"goal","ko":"목표","reason":"유의어 — 이루려는 것"},{"w":"quest","ko":"탐구","reason":"관련어 — 찾아나섬"}],"collocBest":[{"en":"the holy grail","ko":"성배, 궁극적 목표"},{"en":"quest for the grail","ko":"성배를 향한 탐구"}]},"nuance":{"koSimple":"전설 속 성배나 오랜 시간 갈망해 온 목표를 뜻해요.","whenToUse":"이상적 목표를 비유적으로 강조할 때 자주 등장해요."},"krDetail":[{"ko":"성배","explain":"예수의 성스러운 잔"},{"ko":"궁극적 목표","explain":"끝내 이루려는 것"}],"usageExamples":[{"en":"A safe, cheap battery is the holy grail of the car industry.","ko":"안전하고 저렴한 배터리는 자동차 산업의 궁극적 목표이다."},{"en":"The lost painting became the grail that collectors chased for decades.","ko":"그 사라진 그림은 수집가들이 수십 년간 쫓은 성배 같은 목표가 되었다."}],"grammarNote":"대개 \"the holy grail of ~(~ 분야의 궁극적 목표)\"라는 관용 표현으로 쓰여, 오랫동안 갈망해 온 이상적 목표를 비유한다. 원래는 예수의 '성배'를 가리키는 말이다.","grammarQuiz":[{"sentence":"Finding a cure for cancer has been the holy _____ of medical research.","ko":"암 치료법을 찾는 것은 의학 연구의 궁극적 목표였다.","answer":"grail","hint":"holy _____ — 관용 표현(성배)"}]},
    {"id":"n07230","w":"optimal","pos":["adjective"],"ph":"/ˈɑːptɪməl/","cefr":"B2","kr":["최적의","가장 좋은"],"ex":[{"en":"Researchers determined the optimal temperature for storing the vaccine.","ko":"연구자들은 그 백신을 보관하기 위한 최적의 온도를 결정했다."}],"mnemonic":{"soundHint":"옵티멀","story":"opt(선택)+imal → 최적의","hintConfidence":3},"pairs":{"buddyWords":[{"w":"ideal","ko":"이상적인","reason":"동의어 — 더없이 좋음"},{"w":"best","ko":"최고의","reason":"동의어 — 제일 좋음"},{"w":"worst","ko":"최악의","reason":"반의어 — 제일 나쁨"}],"collocBest":[{"en":"optimal conditions","ko":"최적의 조건"},{"en":"optimal performance","ko":"최적의 성능"}]},"nuance":{"koSimple":"주어진 조건에서 가장 알맞고 최적인","whenToUse":"최적 상태·최선 조건을 말할 때 씀"},"krDetail":[{"ko":"최적의","explain":"가장 알맞은"},{"ko":"가장 좋은","explain":"제일 나은"}],"usageExamples":[{"en":"Plants grow best under optimal light and water conditions.","ko":"식물은 최적의 빛과 물 조건에서 가장 잘 자란다."},{"en":"The engineers searched for the optimal design for the new bridge.","ko":"기술자들은 새 다리에 가장 적합한 최적의 설계를 찾았다."}],"grammarNote":"optimal은 '최적의'를 뜻하는 형용사로 주로 명사 앞에서 쓰인다. 유의어 optimum도 형용사·명사로 쓰이며, 부사형은 optimally이다.","grammarQuiz":[{"sentence":"Getting enough sleep is essential for _____ brain performance.","ko":"충분한 수면은 최적의 뇌 성능을 위해 필수적이다.","answer":"optimal","hint":"전치사(for) 뒤 형용사 + 명사"}]},
    {"id":"n07136","w":"hippocampus","pos":["noun"],"ph":"/ˌhɪpəˈkæmpəs/","cefr":"B2","kr":["해마"],"ex":[{"en":"The hippocampus plays a critical role in forming new memories and helping spatial navigation.","ko":"해마는 새로운 기억을 형성하고 공간 탐색을 돕는 데 결정적인 역할을 한다."}],"mnemonic":{"soundHint":"히포캠퍼스","story":"'히포(hippo, 해마) + 캠퍼스' - 기억 담당 뇌 부위(hippocampus).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"brain","ko":"뇌","reason":"상위어 — 뇌의 일부"},{"w":"memory","ko":"기억","reason":"관련어 — 기억 담당"},{"w":"amygdala","ko":"편도체","reason":"관련어 — 인접 뇌 부위"}],"collocBest":[{"en":"the hippocampus","ko":"해마"},{"en":"damaged hippocampus","ko":"손상된 해마"}]},"nuance":{"koSimple":"해마, 뇌 속 기억·학습을 담당하는 좌우 대칭 구조물","whenToUse":"기억·학습·공간 지각 관련 뇌 부위를 설명할 때 자주 사용"},"krDetail":[{"ko":"해마","explain":"기억을 만드는 뇌 부위"}],"usageExamples":[{"en":"Damage to the hippocampus can make it hard to form new memories.","ko":"해마가 손상되면 새로운 기억을 형성하기 어려워질 수 있다."},{"en":"The hippocampus becomes very active while we are learning directions.","ko":"해마는 우리가 길을 익히는 동안 매우 활발해진다."}],"grammarNote":"hippocampus는 뇌의 특정 부위를 가리키는 단수 명사로 보통 정관사 the와 함께 쓴다. 복수형은 라틴어에서 유래해 hippocampi로 변화한다.","grammarQuiz":[{"sentence":"The _____ plays a crucial role in forming new memories.","ko":"해마는 새로운 기억을 형성하는 데 중요한 역할을 한다.","answer":"hippocampus","hint":"주어 자리 명사 (뇌 구조)"}]},

    {"id":"n07681","w":"objectivity","pos":["noun"],"ph":"/ˌɑːbdʒɛkˈtɪvɪti/","cefr":"B2","kr":["객관성"],"ex":[{"en":"Journalists are expected to maintain objectivity in their reporting.","ko":"기자들은 보도에서 객관성을 유지할 것으로 기대된다."}],"mnemonic":{"soundHint":"어브젝티비티","story":"object(대상)를 있는 그대로 = 객관성","hintConfidence":3},"pairs":{"buddyWords":[{"w":"neutrality","ko":"중립성","reason":"동의어 — 어느 편도 안 듦"},{"w":"fairness","ko":"공정함","reason":"동의어 — 치우침 없음"},{"w":"subjectivity","ko":"주관성","reason":"반의어 — 제 생각대로 봄"}],"collocBest":[{"en":"maintain objectivity","ko":"객관성을 유지하다"},{"en":"scientific objectivity","ko":"과학적 객관성"}]},"nuance":{"koSimple":"개인 감정을 배제한 공정하고 객관적인 태도를 말해요.","whenToUse":"보도·평가·연구가 공정한지 논할 때 자주 써요."},"krDetail":[{"ko":"객관성","explain":"치우치지 않고 봄"}],"usageExamples":[{"en":"Scientists strive for objectivity when interpreting data.","ko":"과학자들은 데이터를 해석할 때 객관성을 유지하려 애쓴다."},{"en":"It is hard to maintain objectivity about people we love.","ko":"우리가 사랑하는 사람들에 대해 객관성을 유지하기란 어렵다."}],"grammarNote":"셀 수 없는 추상명사로 관사 없이 쓰며, \"maintain/keep objectivity(객관성을 유지하다)\"로 자주 결합한다. 반대말은 subjectivity(주관성), 형용사는 objective(객관적인)이다.","grammarQuiz":[{"sentence":"Journalists should maintain _____ when reporting the news.","ko":"기자들은 뉴스를 보도할 때 객관성을 유지해야 한다.","answer":"objectivity","hint":"maintain + 명사 목적어"}]},

    {"id":"n07750","w":"multitasking","pos":["noun"],"ph":"/ˌmʌltiˈtæskɪŋ/","cefr":"B2","kr":["멀티태스킹","다중 작업"],"ex":[{"en":"Studies suggest that constant multitasking can actually reduce productivity.","ko":"연구들은 끊임없는 멀티태스킹이 실제로 생산성을 떨어뜨릴 수 있음을 시사한다."}],"mnemonic":{"soundHint":"멀티태스킹","story":"multi(여러) + tasking(일) = 멀티태스킹","hintConfidence":3},"pairs":{"buddyWords":[{"w":"juggling","ko":"동시 처리","reason":"유의어 — 여럿 저글링"},{"w":"multiprocessing","ko":"다중 처리","reason":"유의어 — 병렬 작업"},{"w":"focusing","ko":"집중","reason":"반의어 — 하나에 몰입"}],"collocBest":[{"en":"media multitasking","ko":"미디어 다중 작업"},{"en":"capable of multitasking","ko":"다중 작업이 가능한"}]},"nuance":{"koSimple":"여러 일을 한꺼번에 처리하는 멀티태스킹 능력을 뜻해요.","whenToUse":"업무 효율·집중력·뇌 과학을 논할 때 자주 등장해요."},"krDetail":[{"ko":"멀티태스킹","explain":"여러 일 한꺼번에"},{"ko":"다중 작업","explain":"동시에 여러 일"}],"usageExamples":[{"en":"Multitasking often means doing several things poorly at once.","ko":"멀티태스킹은 흔히 여러 가지를 한꺼번에 어설프게 하는 것을 뜻한다."},{"en":"The job requires constant multitasking under pressure.","ko":"그 일은 압박 속에서 끊임없는 다중 작업을 요구한다."}],"grammarNote":"multi-(다중)와 tasking이 결합한 셀 수 없는 명사로 관사 없이 쓴다. 동사로 쓸 때는 multitask(여러 일을 동시에 하다)로 형태가 달라진다.","grammarQuiz":[{"sentence":"Research shows that _____ actually reduces overall productivity.","ko":"연구에 따르면 멀티태스킹은 실제로 전반적인 생산성을 감소시킨다.","answer":"multitasking","hint":"that절 주어 자리 — 명사"}]},
    {"id":"n07286","w":"agricultural","pos":["adjective"],"ph":"/ˌæɡrɪˈkʌltʃərəl/","cefr":"B2","kr":["농업의"],"ex":[{"en":"Modern agricultural techniques have greatly increased crop yields.","ko":"현대의 농업 기술은 작물 수확량을 크게 증가시켰다."}],"mnemonic":{"soundHint":"애그리컬쳐럴","story":"agri(밭)+culture(경작)+al → 농업의","hintConfidence":3},"pairs":{"buddyWords":[{"w":"farming","ko":"농사의","reason":"동의어 — 농사 관련"},{"w":"rural","ko":"시골의","reason":"관련어 — 농촌"},{"w":"industrial","ko":"공업의","reason":"반의어 — 공장 관련"}],"collocBest":[{"en":"agricultural land","ko":"농경지"},{"en":"agricultural production","ko":"농업 생산"}]},"nuance":{"koSimple":"농사·농업과 관련된 성격을 가진","whenToUse":"농업 산업·농경 활동 말할 때 씀"},"krDetail":[{"ko":"농업의","explain":"농사 짓는 일의"}],"usageExamples":[{"en":"Agricultural exports make up a large part of the country's economy.","ko":"농업 수출은 그 나라 경제의 큰 부분을 차지한다."},{"en":"The region is well known for its rich agricultural land.","ko":"그 지역은 비옥한 농경지로 잘 알려져 있다."}],"grammarNote":"agricultural은 명사 agriculture의 형용사형으로 명사 앞에서 'agricultural land/product/industry'처럼 쓴다.","grammarQuiz":[{"sentence":"The government invested heavily in _____ technology to increase food production.","ko":"정부는 식량 생산을 늘리기 위해 농업 기술에 많은 투자를 했다.","answer":"agricultural","hint":"형용사 + 명사(technology) 수식"}]},
    {"id":"n07746","w":"antioxidant","pos":["noun","adjective"],"ph":"/ˌæntiˈɑːksɪdənt/","cefr":"B2","kr":["항산화제","산화 방지제"],"ex":[{"en":"Blueberries are rich in antioxidant compounds that protect the body's cells.","ko":"블루베리는 신체의 세포를 보호하는 항산화 화합물이 풍부하다."}],"mnemonic":{"soundHint":"안티옥시던트","story":"anti(반대) + oxidant(산화제) = 항산화제","hintConfidence":3},"pairs":{"buddyWords":[{"w":"preservative","ko":"방부제","reason":"유의어 — 상함 막는 것"},{"w":"vitamin","ko":"비타민","reason":"관련어 — 대표 항산화"},{"w":"oxidant","ko":"산화제","reason":"반의어 — 산화시키는 것"}],"collocBest":[{"en":"antioxidant properties","ko":"항산화 성질"},{"en":"rich in antioxidants","ko":"항산화 물질이 풍부한"}]},"nuance":{"koSimple":"세포 손상을 일으키는 활성 산소를 막아 주는 항산화제예요.","whenToUse":"건강 식품·노화 방지 이야기에서 자주 등장해요."},"krDetail":[{"ko":"항산화제","explain":"산화를 막는 물질"},{"ko":"산화 방지제","explain":"녹슴을 막는 것"}],"usageExamples":[{"en":"Green tea contains powerful antioxidant compounds.","ko":"녹차에는 강력한 항산화 성분이 들어 있다."},{"en":"Vitamin C acts as a natural antioxidant in the body.","ko":"비타민 C는 체내에서 천연 항산화제로 작용한다."}],"grammarNote":"명사로는 '항산화 물질', 형용사로는 '산화를 막는'의 뜻으로 쓰며, \"antioxidant properties/compounds(항산화 성분)\"처럼 명사를 수식하기도 한다. anti-(막는)와 oxidant(산화제)가 결합했다.","grammarQuiz":[{"sentence":"Green tea is rich in _____ compounds that protect cells from damage.","ko":"녹차는 세포를 손상으로부터 보호하는 항산화 화합물이 풍부하다.","answer":"antioxidant","hint":"_____ + 명사(compounds) — 형용사 수식"}]},

    {"id":"n07179","w":"alternative","pos":["noun","adjective"],"ph":"/ɔːlˈtɜːrnətɪv/","cefr":"B2","kr":["대안","대체의"],"ex":[{"en":"Scientists are searching for a cleaner alternative to fossil fuels.","ko":"과학자들은 화석 연료를 대체할 더 깨끗한 대안을 찾고 있다."}],"mnemonic":{"soundHint":"올터너티브","story":"alter(바꾸다)+native → 다른 선택","hintConfidence":3},"pairs":{"buddyWords":[{"w":"option","ko":"선택지","reason":"동의어 — 고를 것"},{"w":"substitute","ko":"대체물","reason":"동의어 — 바꿔 씀"},{"w":"original","ko":"원래의 것","reason":"반의어 — 본래"}],"collocBest":[{"en":"viable alternative","ko":"실행 가능한 대안"},{"en":"alternative energy","ko":"대체 에너지"}]},"nuance":{"koSimple":"기존 것을 대신할 수 있는 다른 선택지","whenToUse":"대체안·다른 방법을 제시할 때 씀"},"krDetail":[{"ko":"대안","explain":"대신할 다른 방법"},{"ko":"대체의","explain":"대신 쓸 수 있는"}],"usageExamples":[{"en":"If the train is full, taking a bus is a good alternative.","ko":"기차가 만석이면 버스를 타는 것이 좋은 대안이다."},{"en":"Many drivers are switching to alternative sources of energy.","ko":"많은 운전자들이 대체 에너지원으로 바꾸고 있다."}],"grammarNote":"alternative는 명사(대안)와 형용사(대체의)로 모두 쓰인다. 명사일 때는 'an alternative to ~(~에 대한 대안)'처럼 전치사 to와 결합한다.","grammarQuiz":[{"sentence":"We need to find an _____ to fossil fuels before it is too late.","ko":"너무 늦기 전에 화석 연료의 대안을 찾아야 한다.","answer":"alternative","hint":"an + 명사 + to ~ 구조"}]},
    {"id":"n07802","w":"countless","pos":["adjective"],"ph":"/ˈkaʊntləs/","cefr":"B2","kr":["무수한","셀 수 없이 많은"],"ex":[{"en":"She spent countless hours preparing for the national competition.","ko":"그녀는 전국 대회를 준비하는 데 무수한 시간을 보냈다."}],"mnemonic":{"soundHint":"카운트리스","story":"count(세다) + less(없는) = 셀 수 없는","hintConfidence":3},"pairs":{"buddyWords":[{"w":"innumerable","ko":"무수한","reason":"동의어 — 셀 수 없는"},{"w":"myriad","ko":"수많은","reason":"유의어 — 아주 많은"},{"w":"few","ko":"적은","reason":"반의어 — 얼마 없는"}],"collocBest":[{"en":"countless times","ko":"수없이 많이"},{"en":"countless hours","ko":"무수한 시간"}]},"nuance":{"koSimple":"셀 수 없을 만큼 아주 많은 수량이나 횟수를 뜻해요.","whenToUse":"방대함이나 반복 횟수를 과장해서 강조할 때 써요."},"krDetail":[{"ko":"무수한","explain":"셀 수 없이 많은"},{"ko":"셀 수 없이 많은","explain":"헤아릴 수 없는"}],"usageExamples":[{"en":"Countless stars filled the night sky above the quiet village.","ko":"무수한 별들이 조용한 마을 위 밤하늘을 가득 채웠다."},{"en":"She has helped countless students improve their writing skills.","ko":"그녀는 셀 수 없이 많은 학생들이 글쓰기 실력을 향상시키도록 도왔다."}],"grammarNote":"복수 가산명사를 수식하는 한정 형용사로 비교급·최상급이 없고, 'a countless'처럼 부정관사와 함께 쓰지 않는다.","grammarQuiz":[{"sentence":"She has received _____ awards for her contributions to science.","ko":"그녀는 과학에 대한 공헌으로 무수한 상을 받았다.","answer":"countless","hint":"_____ + 명사(awards) — 형용사"}]},
    {"id":"n07235","w":"wavelengths","pos":["noun"],"ph":"/ˈweɪvˌlɛŋθs/","cefr":"B2","kr":["파장"],"ex":[{"en":"Different colors of light correspond to different wavelengths.","ko":"서로 다른 색의 빛은 서로 다른 파장에 해당한다."}],"mnemonic":{"soundHint":"웨이브렝쓰","story":"wave(파도)+length(길이) → 파장","hintConfidence":3},"pairs":{"buddyWords":[{"w":"frequency","ko":"주파수","reason":"관련어 — 진동 횟수"},{"w":"spectrum","ko":"스펙트럼","reason":"관련어 — 파장 범위"},{"w":"amplitude","ko":"진폭","reason":"관련어 — 파의 높이"}],"collocBest":[{"en":"light wavelengths","ko":"빛의 파장"},{"en":"different wavelengths","ko":"다양한 파장"}]},"nuance":{"koSimple":"파동의 마루 사이 거리인 파장들","whenToUse":"빛·소리·전자기파 특성을 말할 때 씀"},"krDetail":[{"ko":"파장","explain":"물결 한 마디 길이"}],"usageExamples":[{"en":"Radio signals travel at longer wavelengths than visible light.","ko":"라디오 신호는 가시광선보다 더 긴 파장으로 이동한다."},{"en":"Some animals can see wavelengths that humans simply cannot detect.","ko":"어떤 동물들은 인간이 도저히 감지할 수 없는 파장을 볼 수 있다."}],"grammarNote":"wavelengths는 wavelength의 복수형으로 복수 동사와 일치한다. 'on the same wavelength(생각이 잘 통하는)'라는 관용 표현으로도 쓰인다.","grammarQuiz":[{"sentence":"Different colors of light correspond to different _____.","ko":"빛의 서로 다른 색깔은 서로 다른 파장에 해당한다.","answer":"wavelengths","hint":"different + 복수 명사"}]},
    {"id":"n07249","w":"cues","pos":["noun"],"ph":"/kjuːz/","cefr":"B2","kr":["신호","단서"],"ex":[{"en":"Good speakers pick up on the social cues of their audience.","ko":"훌륭한 연사는 청중의 사회적 신호를 알아챈다."}],"mnemonic":{"soundHint":"큐즈","story":"cue(신호)+s → 신호들","hintConfidence":3},"pairs":{"buddyWords":[{"w":"hint","ko":"힌트, 암시","reason":"동의어 — 실마리"},{"w":"signal","ko":"신호","reason":"동의어 — 알림"},{"w":"prompt","ko":"자극, 신호","reason":"동의어 — 부추김"}],"collocBest":[{"en":"social cues","ko":"사회적 신호"},{"en":"visual cues","ko":"시각적 단서"}]},"nuance":{"koSimple":"행동이나 반응을 유도하는 신호·단서","whenToUse":"암시·신호를 감지한다 말할 때 씀"},"krDetail":[{"ko":"신호","explain":"알려주는 표시"},{"ko":"단서","explain":"실마리가 되는 것"}],"usageExamples":[{"en":"Actors wait for their cues before stepping onto the stage.","ko":"배우들은 무대에 오르기 전에 자신의 신호를 기다린다."},{"en":"Dogs respond to visual cues as well as spoken commands.","ko":"개들은 말로 하는 명령뿐 아니라 시각적 신호에도 반응한다."}],"grammarNote":"cues는 cue의 복수형이다. 'visual/social/nonverbal cues'처럼 형용사와 결합하며, 'take one's cue from ~(~에게서 힌트를 얻다)' 같은 표현으로도 쓰인다.","grammarQuiz":[{"sentence":"Babies rely on visual _____ from their parents to understand emotions.","ko":"아기들은 감정을 이해하기 위해 부모의 시각적 신호에 의존한다.","answer":"cues","hint":"형용사(visual) 뒤 복수 명사"}]},
    {"id":"n07793","w":"gratification","pos":["noun"],"ph":"/ˌɡrætɪfɪˈkeɪʃən/","cefr":"B2","kr":["만족","충족","기쁨"],"ex":[{"en":"Learning to delay gratification is an important part of growing up.","ko":"만족을 미루는 법을 배우는 것은 성장의 중요한 부분이다."}],"mnemonic":{"soundHint":"그래티피케이션","story":"grateful(감사한) 같은 어원 = 만족, 희열","hintConfidence":3},"pairs":{"buddyWords":[{"w":"satisfaction","ko":"만족","reason":"동의어 — 흡족함"},{"w":"fulfillment","ko":"충족","reason":"유의어 — 채워짐"},{"w":"frustration","ko":"좌절","reason":"반의어 — 채워지지 않음"}],"collocBest":[{"en":"instant gratification","ko":"즉각적인 만족"},{"en":"delay gratification","ko":"만족을 미루다"}]},"nuance":{"koSimple":"욕구가 채워졌을 때 느끼는 뿌듯한 만족감을 뜻해요.","whenToUse":"즉각·지연 만족 같은 심리 개념을 논할 때 등장해요."},"krDetail":[{"ko":"만족","explain":"흡족한 마음"},{"ko":"충족","explain":"채워져 넉넉함"},{"ko":"기쁨","explain":"즐거운 마음"}],"usageExamples":[{"en":"He seeks instant gratification rather than long-term rewards.","ko":"그는 장기적 보상보다 즉각적인 만족을 추구한다."},{"en":"The gratification of finishing the marathon made all the training worthwhile.","ko":"마라톤을 완주한 만족감이 모든 훈련을 가치 있게 만들었다."}],"grammarNote":"불가산·가산 모두 가능하지만 주로 'instant/delayed gratification', 'delay gratification'처럼 관용 표현으로 쓰인다.","grammarQuiz":[{"sentence":"Children must learn to delay _____ in order to achieve long-term goals.","ko":"아이들은 장기적 목표를 달성하기 위해 만족을 미루는 법을 배워야 한다.","answer":"gratification","hint":"delay + _____ — 동사의 목적어 명사"}]},
    {"id":"n07185","w":"phenomena","pos":["noun"],"ph":"/fɪˈnɑːmɪnə/","cefr":"B2","kr":["현상들"],"ex":[{"en":"Scientists still cannot fully explain certain natural phenomena.","ko":"과학자들은 여전히 특정 자연 현상들을 완전히 설명하지 못한다."}],"mnemonic":{"soundHint":"피노메나","story":"phenomenon(현상)의 복수","hintConfidence":3},"pairs":{"buddyWords":[{"w":"phenomenon","ko":"현상","reason":"단수형 — 하나일 때"},{"w":"occurrence","ko":"일어난 일","reason":"동의어 — 생긴 일"},{"w":"event","ko":"사건","reason":"관련어 — 벌어진 일"}],"collocBest":[{"en":"natural phenomena","ko":"자연 현상들"},{"en":"observe phenomena","ko":"현상들을 관찰하다"}]},"nuance":{"koSimple":"관찰되는 여러 현상, phenomenon의 복수형","whenToUse":"자연·사회의 여러 현상을 논할 때 씀"},"krDetail":[{"ko":"현상들","explain":"눈에 보이는 여러 일"}],"usageExamples":[{"en":"Rainbows and lightning are natural phenomena we still find fascinating.","ko":"무지개와 번개는 우리가 여전히 매혹적으로 느끼는 자연 현상들이다."},{"en":"Social media has created new phenomena that researchers are still studying.","ko":"소셜 미디어는 연구자들이 여전히 연구하고 있는 새로운 현상들을 만들어 냈다."}],"grammarNote":"phenomena는 phenomenon의 복수형(불규칙)으로 복수 동사와 일치한다. 단수형 phenomenon과 혼동하여 'a phenomena'로 쓰지 않도록 주의한다.","grammarQuiz":[{"sentence":"Natural _____ such as earthquakes and volcanoes have fascinated scientists for centuries.","ko":"지진과 화산 같은 자연 현상들은 수세기 동안 과학자들을 매료시켰다.","answer":"phenomena","hint":"phenomenon의 복수형 (복수 주어)"}]},
    {"id":"n07459","w":"versa","pos":["adverb"],"ph":"/ˈvɜːrsə/","cefr":"B2","kr":["반대도 마찬가지인"],"ex":[{"en":"Teachers can learn from students, and vice versa.","ko":"교사는 학생에게서 배울 수 있고, 반대의 경우도 마찬가지이다."}],"mnemonic":{"soundHint":"버사","story":"'vice versa' 반대로도 마찬가지.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"vice","ko":"거꾸로도","reason":"관련어 — vice versa 짝"},{"w":"reverse","ko":"반대","reason":"관련어 — 거꾸로"},{"w":"opposite","ko":"정반대","reason":"관련어 — 맞은편"}],"collocBest":[{"en":"vice versa","ko":"반대의 경우도 마찬가지"},{"en":"and vice versa","ko":"그리고 그 반대도"}]},"nuance":{"koSimple":"vice versa(그 반대도 마찬가지)에서 쓰이는 라틴어 조각 표현","whenToUse":"양쪽 관계가 서로 뒤바뀌어도 성립함을 말할 때 자주 사용"},"krDetail":[{"ko":"반대도 마찬가지인","explain":"거꾸로 해도 똑같은"}],"usageExamples":[{"en":"You can convert dollars to euros and vice versa at this bank.","ko":"이 은행에서는 달러를 유로로, 또 그 반대로도 바꿀 수 있다."},{"en":"The son often helps his father, and vice versa.","ko":"그 아들은 아버지를 자주 돕고, 반대의 경우도 마찬가지다."}],"grammarNote":"versa는 단독으로 쓰이지 않고 라틴어 표현 'vice versa(반대의 경우도 마찬가지)' 형태로만 쓰이며, 앞 문장의 관계가 뒤바뀐 상황을 가리킨다.","grammarQuiz":[{"sentence":"Dogs can learn from humans and vice _____.","ko":"개는 인간에게서 배울 수 있고, 그 반대도 마찬가지이다.","answer":"versa","hint":"vice versa (관용 표현)"}]},
    {"id":"n07848","w":"selectively","pos":["adverb"],"ph":"/sɪˈlɛktɪvli/","cefr":"B2","kr":["선택적으로"],"ex":[{"en":"The brain selectively focuses on the sounds that matter most to us.","ko":"뇌는 우리에게 가장 중요한 소리에 선택적으로 집중한다."}],"mnemonic":{"soundHint":"셀렉티블리! 골라 골라","story":"select(고르다)+ly, 선택적으로","hintConfidence":3},"pairs":{"buddyWords":[{"w":"discriminately","ko":"가려서","reason":"유의어 — 골라내며"},{"w":"choosily","ko":"까다롭게","reason":"유의어 — 골라 뽑아"},{"w":"indiscriminately","ko":"무차별로","reason":"반의어 — 가리지 않고"}],"collocBest":[{"en":"selectively breed","ko":"선택적으로 번식시키다"},{"en":"selectively ignore","ko":"선택적으로 무시하다"}]},"nuance":{"koSimple":"전부가 아니라 골라서 취한다는 뜻으로 쓰여","whenToUse":"정보, 기억, 소비 등을 가려서 선택할 때 자연스러워"},"krDetail":[{"ko":"선택적으로","explain":"골라서"}],"usageExamples":[{"en":"The company hires selectively, choosing only the most qualified candidates.","ko":"그 회사는 선택적으로 채용하여 가장 자격 있는 후보만 뽑는다."},{"en":"Readers tend to remember information selectively, focusing on what interests them.","ko":"독자들은 관심 있는 것에 집중하며 정보를 선택적으로 기억하는 경향이 있다."}],"grammarNote":"동사를 수식하는 부사로 대개 동사 뒤에 위치하며, 형용사 selective에 -ly가 붙은 형태다.","grammarQuiz":[{"sentence":"The filter _____ blocks harmful UV rays while allowing visible light through.","ko":"그 필터는 가시광선은 통과시키면서 유해 자외선을 선택적으로 차단한다.","answer":"selectively","hint":"동사(blocks) 수식 — 부사"}]},
    {"id":"n07211","w":"commitment","pos":["noun"],"ph":"/kəˈmɪtmənt/","cefr":"B2","kr":["헌신","약속","전념"],"ex":[{"en":"Her commitment to the project impressed everyone on the team.","ko":"그 프로젝트에 대한 그녀의 헌신은 팀의 모든 사람에게 깊은 인상을 주었다."}],"mnemonic":{"soundHint":"커미트먼트","story":"commit(약속)+ment → 헌신","hintConfidence":3},"pairs":{"buddyWords":[{"w":"dedication","ko":"헌신","reason":"동의어 — 온 힘 바침"},{"w":"promise","ko":"약속","reason":"동의어 — 다짐"},{"w":"indifference","ko":"무관심","reason":"반의어 — 관심 없음"}],"collocBest":[{"en":"strong commitment","ko":"강한 헌신"},{"en":"make a commitment","ko":"약속하다"}]},"nuance":{"koSimple":"책임을 지고 끝까지 지키려는 약속·헌신","whenToUse":"의무·헌신·전념 상태를 말할 때 씀"},"krDetail":[{"ko":"헌신","explain":"몸과 마음을 다 바침"},{"ko":"약속","explain":"꼭 하겠다는 다짐"},{"ko":"전념","explain":"오직 그것에만 몰두"}],"usageExamples":[{"en":"Marriage is a serious commitment that requires effort from both people.","ko":"결혼은 두 사람 모두의 노력을 요구하는 진지한 헌신이다."},{"en":"The team showed great commitment by practicing every single weekend.","ko":"그 팀은 주말마다 연습하며 대단한 헌신을 보여 주었다."}],"grammarNote":"commitment는 'commitment to ~(~에 대한 헌신·약속)' 형태로 전치사 to와 결합하며, to 뒤에는 명사나 동명사가 온다. 동사형은 commit이다.","grammarQuiz":[{"sentence":"Success in any field requires dedication and long-term _____.","ko":"어떤 분야에서든 성공하려면 헌신과 장기적인 전념이 필요하다.","answer":"commitment","hint":"and로 연결된 병렬 명사"}]},
    {"id":"n07359","w":"accordingly","pos":["adverb"],"ph":"/əˈkɔːrdɪŋli/","cefr":"B2","kr":["그에 따라","따라서"],"ex":[{"en":"The market changed quickly, so the company adjusted its plans accordingly.","ko":"시장이 빠르게 변해서 그 회사는 그에 따라 계획을 조정했다."}],"mnemonic":{"soundHint":"어코딩리","story":"'어코드(accord)+ingly' 그에 따라서.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"therefore","ko":"그러므로","reason":"동의어 — 그래서"},{"w":"consequently","ko":"결과적으로","reason":"동의어 — 그 결과"},{"w":"regardless","ko":"상관없이","reason":"반의어 — 무관하게"}],"collocBest":[{"en":"act accordingly","ko":"그에 따라 행동하다"},{"en":"adjust accordingly","ko":"그에 맞게 조정하다"}]},"nuance":{"koSimple":"앞선 내용이나 상황에 맞추어 그에 어울리게 하는 방식으로","whenToUse":"원인이나 조건에 따라 대응해 행동함을 설명할 때 자주 사용"},"krDetail":[{"ko":"그에 따라","explain":"그것에 맞추어"},{"ko":"따라서","explain":"그런 까닭으로"}],"usageExamples":[{"en":"The rules have changed, and you should behave accordingly.","ko":"규칙이 바뀌었으니 너는 그에 따라 행동해야 한다."},{"en":"We received new information and revised our plan accordingly.","ko":"우리는 새로운 정보를 받고 그에 따라 계획을 수정했다."}],"grammarNote":"accordingly는 '그에 맞게' 또는 '따라서(=therefore)'라는 뜻의 접속부사로, 주로 문장 끝이나 앞에 온다. 'according to ~(~에 따르면)'와 형태가 비슷하니 혼동하지 않도록 한다.","grammarQuiz":[{"sentence":"The situation has changed, and we must adjust our plans _____.","ko":"상황이 바뀌었으므로, 우리는 그에 따라 계획을 조정해야 한다.","answer":"accordingly","hint":"문장 끝 부사 (결과·대응)"}]},
    {"id":"n07864","w":"rhythmic","pos":["adjective"],"ph":"/ˈrɪðmɪk/","cefr":"B2","kr":["리듬감 있는","율동적인"],"ex":[{"en":"The rhythmic sound of the waves gradually put the children to sleep.","ko":"파도의 리듬감 있는 소리가 아이들을 서서히 잠들게 했다."}],"mnemonic":{"soundHint":"리드믹! 두구두구 박자","story":"rhythm(리듬)+ic, 리드미컬한","hintConfidence":3},"pairs":{"buddyWords":[{"w":"melodic","ko":"선율적인","reason":"관련어 — 가락 있는"},{"w":"pulsing","ko":"고동치는","reason":"유의어 — 규칙적 박동"},{"w":"erratic","ko":"불규칙한","reason":"반의어 — 들쭉날쭉한"}],"collocBest":[{"en":"rhythmic pattern","ko":"율동적인 패턴"},{"en":"rhythmic movement","ko":"리듬감 있는 움직임"}]},"nuance":{"koSimple":"일정한 리듬이 규칙적으로 반복되는 느낌이야","whenToUse":"음악, 심장 박동, 걸음걸이를 묘사할 때 자연스러워"},"krDetail":[{"ko":"리듬감 있는","explain":"박자가 살아 있는"},{"ko":"율동적인","explain":"규칙적으로 움직이는"}],"usageExamples":[{"en":"The dancers moved to the rhythmic beat of the drums.","ko":"무용수들은 드럼의 리듬감 있는 박자에 맞춰 움직였다."},{"en":"He tapped his foot in a steady, rhythmic motion.","ko":"그는 일정하고 율동적인 동작으로 발을 까딱거렸다."}],"grammarNote":"명사 rhythm에서 파생된 형용사로 명사를 앞에서 수식하며, 부사형은 rhythmically다.","grammarQuiz":[{"sentence":"The dancers moved in perfect _____ harmony with the music.","ko":"무용수들은 음악과 완벽한 리듬감 있는 조화를 이루며 움직였다.","answer":"rhythmic","hint":"형용사 + _____ + 명사 — 형용사"}]},
    {"id":"n07501","w":"mechanical","pos":["adjective"],"ph":"/məˈkænɪkl/","cefr":"B2","kr":["기계적인","기계의"],"ex":[{"en":"The flight was delayed because of a mechanical problem with the engine.","ko":"엔진의 기계적 결함 때문에 비행기가 지연되었다."}],"mnemonic":{"soundHint":"머캐니컬","story":"'mechanic(기계공)+al' 기계적인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"automatic","ko":"자동의","reason":"동의어 — 저절로 되는"},{"w":"robotic","ko":"로봇 같은","reason":"동의어 — 기계처럼"},{"w":"manual","ko":"수동의","reason":"반의어 — 손으로 하는"}],"collocBest":[{"en":"mechanical failure","ko":"기계 고장"},{"en":"mechanical engineering","ko":"기계 공학"}]},"nuance":{"koSimple":"기계 장치와 관련되거나 사람 감정 없이 습관처럼 움직이는","whenToUse":"공학 분야나 무미건조한 반응, 태도를 묘사할 때 자주 사용"},"krDetail":[{"ko":"기계적인","explain":"기계처럼 무의식적인"},{"ko":"기계의","explain":"기계와 관련된"}],"usageExamples":[{"en":"He gave a mechanical nod without really listening.","ko":"그는 제대로 듣지도 않고 기계적으로 고개를 끄덕였다."},{"en":"The museum displays several old mechanical clocks.","ko":"그 박물관은 오래된 기계식 시계 몇 개를 전시한다."}],"grammarNote":"mechanical은 '기계의'라는 뜻 외에 '(태도가) 기계적인, 무의식적인'이라는 비유적 의미로도 쓰이며, 부사형은 mechanically이다.","grammarQuiz":[{"sentence":"The factory replaced human workers with _____ arms.","ko":"그 공장은 인간 노동자를 기계 팔로 교체했다.","answer":"mechanical","hint":"형용사 + 명사 수식"}]},
    {"id":"n07394","w":"recreational","pos":["adjective"],"ph":"/ˌrɛkriˈeɪʃənəl/","cefr":"B2","kr":["오락의","여가의"],"ex":[{"en":"The city built a new park for recreational activities and sports.","ko":"그 도시는 여가 활동과 스포츠를 위한 새 공원을 지었다."}],"mnemonic":{"soundHint":"레크리에이셔널","story":"'레크리에이션(recreation)+al' 오락의.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"leisure","ko":"여가의","reason":"동의어 — 쉬는 시간의"},{"w":"entertaining","ko":"즐거움을 주는","reason":"관련어 — 재미있는"},{"w":"occupational","ko":"직업의","reason":"반의어 — 일과 관련된"}],"collocBest":[{"en":"recreational activities","ko":"여가 활동"},{"en":"recreational facilities","ko":"오락 시설"}]},"nuance":{"koSimple":"일이 아니라 즐거움과 휴식, 여가를 위한 활동에 관련된 것","whenToUse":"취미, 스포츠, 여행 등 쉬면서 즐기는 활동을 말할 때 사용"},"krDetail":[{"ko":"오락의","explain":"놀고 즐기는"},{"ko":"여가의","explain":"쉬는 시간의"}],"usageExamples":[{"en":"Many people take up hiking as a recreational activity on weekends.","ko":"많은 사람들이 주말에 여가 활동으로 등산을 시작한다."},{"en":"The lake is popular for recreational fishing and boating.","ko":"그 호수는 여가용 낚시와 뱃놀이로 인기가 있다."}],"grammarNote":"recreational은 명사 recreation(여가·오락)의 형용사형으로, recreational activities/facilities처럼 명사를 수식하는 한정적 용법으로 주로 쓰인다.","grammarQuiz":[{"sentence":"The city built new _____ facilities, including a swimming pool and a tennis court.","ko":"그 도시는 수영장과 테니스장을 포함한 새로운 여가 시설을 건설했다.","answer":"recreational","hint":"형용사 + 명사(facilities) 수식"}]},
    {"id":"n07747","w":"favorably","pos":["adverb"],"ph":"/ˈfeɪvərəbli/","cefr":"B2","kr":["호의적으로","유리하게"],"ex":[{"en":"Critics responded favorably to the young director's first film.","ko":"비평가들은 그 젊은 감독의 첫 영화에 호의적으로 반응했다."}],"mnemonic":{"soundHint":"페이버러블리","story":"favor(호의) + ably = 호의적으로","hintConfidence":3},"pairs":{"buddyWords":[{"w":"positively","ko":"긍정적으로","reason":"유의어 — 좋게"},{"w":"approvingly","ko":"찬성하며","reason":"유의어 — 마음에 들어"},{"w":"unfavorably","ko":"불리하게","reason":"반의어 — 나쁘게"}],"collocBest":[{"en":"compare favorably","ko":"유리하게 비교되다"},{"en":"react favorably","ko":"호의적으로 반응하다"}]},"nuance":{"koSimple":"긍정적이고 호의적인 태도로 대하는 방식을 뜻해요.","whenToUse":"평가·비교·반응을 좋게 표현할 때 자주 등장해요."},"krDetail":[{"ko":"호의적으로","explain":"좋게 여기며"},{"ko":"유리하게","explain":"득이 되게"}],"usageExamples":[{"en":"The committee looked favorably on her proposal.","ko":"위원회는 그녀의 제안을 호의적으로 보았다."},{"en":"The new model compares favorably with far more expensive brands.","ko":"그 새 모델은 훨씬 비싼 브랜드들과 비교해도 손색이 없다."}],"grammarNote":"'호의적으로, 유리하게'를 뜻하는 부사로, \"look/respond favorably on ~(~을 호의적으로 보다)\"과 \"compare favorably with ~(~에 비해 손색없다)\"라는 표현으로 자주 쓴다. 영국식 철자는 favourably.","grammarQuiz":[{"sentence":"The critics responded _____ to the director's new film.","ko":"비평가들은 그 감독의 새 영화에 호의적으로 반응했다.","answer":"favorably","hint":"동사(responded) 수식 — 부사"}]},
    {"id":"n07693","w":"reflexive","pos":["adjective"],"ph":"/rɪˈflɛksɪv/","cefr":"B2","kr":["반사적인","재귀적인"],"ex":[{"en":"Pulling your hand away from heat is a reflexive action.","ko":"뜨거움에서 손을 떼는 것은 반사적인 행동이다."}],"mnemonic":{"soundHint":"리플렉시브","story":"reflex(반사) + ive = 반사적인, 자동반응의","hintConfidence":3},"pairs":{"buddyWords":[{"w":"instinctive","ko":"본능적인","reason":"동의어 — 저절로 나오는"},{"w":"automatic","ko":"자동적인","reason":"유의어 — 반사처럼 바로"},{"w":"deliberate","ko":"의도적인","reason":"반의어 — 일부러 하는"}],"collocBest":[{"en":"a reflexive response","ko":"반사적 반응"},{"en":"reflexive pronoun","ko":"재귀 대명사"}]},"nuance":{"koSimple":"자동으로 튀어나오는 반사적이거나 재귀적인 반응을 뜻해요.","whenToUse":"본능적 반응이나 문법의 재귀 용법을 다룰 때 써요."},"krDetail":[{"ko":"반사적인","explain":"생각 없이 바로 나오는"},{"ko":"재귀적인","explain":"자기 자신으로 되돌아오는"}],"usageExamples":[{"en":"In English, 'myself' and 'herself' are reflexive pronouns.","ko":"영어에서 'myself'와 'herself'는 재귀대명사이다."},{"en":"His reflexive reaction was to cover his face.","ko":"그의 반사적인 반응은 얼굴을 가리는 것이었다."}],"grammarNote":"문법에서 \"reflexive pronoun(재귀대명사: myself, herself 등)\"이라는 용어로 자주 등장하며, 일상에서는 '반사적인, 무의식적인'의 뜻으로 쓴다. reflective(사려 깊은)와 구분해야 한다.","grammarQuiz":[{"sentence":"Pulling your hand away from a hot surface is a _____ action.","ko":"뜨거운 표면에서 손을 빼는 것은 반사적인 행동이다.","answer":"reflexive","hint":"관사 + 형용사 + 명사 보어"}]},
    {"id":"n07388","w":"attain","pos":["verb"],"ph":"/əˈteɪn/","cefr":"B2","kr":["달성하다","이루다"],"ex":[{"en":"Through years of hard work, she managed to attain her goals.","ko":"수년간의 노력을 통해 그녀는 자신의 목표를 달성해냈다."}],"mnemonic":{"soundHint":"어테인","story":"'어(강조)+테인(잡다)' 이뤄내다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"achieve","ko":"성취하다","reason":"동의어 — 이뤄냄"},{"w":"reach","ko":"도달하다","reason":"동의어 — 닿음"},{"w":"fail","ko":"실패하다","reason":"반의어 — 못 이룸"}],"collocBest":[{"en":"attain a goal","ko":"목표를 달성하다"},{"en":"attain success","ko":"성공을 이루다"}]},"nuance":{"koSimple":"오랜 노력이나 시간을 들여 목표한 수준·지위를 이루어 냄","whenToUse":"격식 있는 글에서 어렵게 얻은 성취를 표현할 때 자주 사용"},"krDetail":[{"ko":"달성하다","explain":"목표를 이뤄냄"},{"ko":"이루다","explain":"바라던 것을 해냄"}],"usageExamples":[{"en":"It took decades for the country to attain full independence.","ko":"그 나라가 완전한 독립을 이루는 데 수십 년이 걸렸다."},{"en":"Few athletes ever attain such a high level of skill.","ko":"그 정도로 높은 기량에 도달하는 운동선수는 거의 없다."}],"grammarNote":"attain은 achieve/reach와 비슷하지만 노력 끝에 목표·지위·수준에 '도달하다'라는 격식체 동사로, 뒤에 전치사 없이 목적어(a goal, a level)를 바로 취한다.","grammarQuiz":[{"sentence":"She worked hard to _____ her goal of becoming a doctor.","ko":"그녀는 의사가 되겠다는 목표를 달성하기 위해 열심히 노력했다.","answer":"attain","hint":"to부정사 내 동사원형"}]},
    {"id":"n07553","w":"respondents","pos":["noun"],"ph":"/rɪˈspɑːndənts/","cefr":"B2","kr":["응답자","설문 참여자"],"ex":[{"en":"Most respondents said they preferred working from home.","ko":"대부분의 응답자들은 재택근무를 선호한다고 답했다."}],"mnemonic":{"soundHint":"리스판던츠","story":"설문에 응답한 사람들이 줄지어 있다","hintConfidence":1},"pairs":{"buddyWords":[{"w":"participants","ko":"참가자","reason":"동의어 — 참여한 사람"},{"w":"interviewees","ko":"인터뷰 대상자","reason":"관련어 — 답하는 사람"},{"w":"questioner","ko":"질문하는 사람","reason":"대비어 — 묻는 쪽"}],"collocBest":[{"en":"survey respondents","ko":"설문 응답자"},{"en":"a majority of respondents","ko":"응답자의 대다수"}]},"nuance":{"koSimple":"설문이나 조사에서 답변을 준 사람들, 즉 응답자들을 가리켜.","whenToUse":"통계·연구 보고서에서 응답 비율을 설명할 때 자주 등장하는 말이야."},"krDetail":[{"ko":"응답자","explain":"물음에 답하는 사람"},{"ko":"설문 참여자","explain":"설문에 응한 사람"}],"usageExamples":[{"en":"Nearly half of the respondents supported the new policy.","ko":"응답자의 거의 절반이 새 정책을 지지했다."},{"en":"The survey's respondents ranged in age from 18 to 65.","ko":"그 설문의 응답자들은 나이가 18세에서 65세까지 다양했다."}],"grammarNote":"respondents는 respondent의 복수형으로 설문·조사의 '응답자들'을 가리키며, 동사 respond, 명사 response와 어원이 같다.","grammarQuiz":[{"sentence":"Over 70% of the survey _____ agreed with the proposal.","ko":"설문 응답자의 70% 이상이 그 제안에 동의했다.","answer":"respondents","hint":"명사 + 명사 복합어 (survey respondents)"}]},
    {"id":"n07156","w":"acceptance","pos":["noun"],"ph":"/əkˈsɛptəns/","cefr":"B2","kr":["수용","승인","받아들임"],"ex":[{"en":"Her acceptance of the award marked the peak of her long career.","ko":"그 상의 수상 수락은 그녀의 오랜 경력의 정점을 나타냈다."}],"mnemonic":{"soundHint":"억셉턴스","story":"accept(받아들이다)+ance → 수용","hintConfidence":3},"pairs":{"buddyWords":[{"w":"approval","ko":"승인","reason":"동의어 — 인정"},{"w":"rejection","ko":"거절","reason":"반의어 — 정반대"},{"w":"admission","ko":"입장 허가","reason":"관련어 — 받아들임"}],"collocBest":[{"en":"gain acceptance","ko":"인정을 받다"},{"en":"social acceptance","ko":"사회적 수용"}]},"nuance":{"koSimple":"받아들임, 인정하고 승낙하는 마음가짐","whenToUse":"제안·현실·타인을 받아들일 때 씀"},"krDetail":[{"ko":"수용","explain":"받아서 들임"},{"ko":"승인","explain":"옳다고 인정함"},{"ko":"받아들임","explain":"거부 없이 받음"}],"usageExamples":[{"en":"The new policy gained wide acceptance among younger voters.","ko":"그 새 정책은 젊은 유권자들 사이에서 폭넓은 수용을 얻었다."},{"en":"She waited nervously for the university's letter of acceptance.","ko":"그녀는 대학의 합격 통지서를 초조하게 기다렸다."}],"grammarNote":"acceptance는 동사 accept의 명사형으로 셀 수 없이 쓰이는 경우가 많다. 'acceptance of ~(~의 수용)', 'gain/win acceptance'처럼 전치사 of 및 특정 동사와 결합한다.","grammarQuiz":[{"sentence":"Social _____ is important for teenagers' emotional well-being.","ko":"사회적 수용은 십 대들의 정서적 안녕에 중요하다.","answer":"acceptance","hint":"형용사(Social) 뒤 명사"}]},
    {"id":"n07432","w":"conversely","pos":["adverb"],"ph":"/ˈkɑːnvɜːrsli/","cefr":"B2","kr":["반대로","역으로"],"ex":[{"en":"Some students prefer quiet libraries; conversely, others study better with music.","ko":"어떤 학생들은 조용한 도서관을 선호하지만, 반대로 다른 학생들은 음악을 들으며 더 잘 공부한다."}],"mnemonic":{"soundHint":"컨버슬리","story":"'converse(반대)+ly' 반대로.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"oppositely","ko":"반대로","reason":"동의어 — 거꾸로"},{"w":"inversely","ko":"거꾸로","reason":"동의어 — 뒤바꿔"},{"w":"similarly","ko":"마찬가지로","reason":"반의어 — 똑같이"}],"collocBest":[{"en":"conversely, however","ko":"반대로, 그러나"},{"en":"or, conversely","ko":"또는, 역으로"}]},"nuance":{"koSimple":"앞서 말한 내용과 반대되는 경우를 이어서 소개하는 접속 부사","whenToUse":"논술문에서 대조되는 두 관점을 나란히 제시할 때 자주 사용"},"krDetail":[{"ko":"반대로","explain":"거꾸로 뒤집어"},{"ko":"역으로","explain":"방향을 뒤바꿔"}],"usageExamples":[{"en":"Prices rose sharply; conversely, demand began to fall.","ko":"가격이 급등했고, 반대로 수요는 떨어지기 시작했다."},{"en":"Some plants thrive in shade; conversely, others need full sun.","ko":"어떤 식물은 그늘에서 잘 자라지만, 역으로 다른 식물은 충분한 햇빛이 필요하다."}],"grammarNote":"conversely는 앞 내용과 상반되는 내용을 이어 주는 접속부사로, 보통 문장 맨 앞에 놓이고 뒤에 콤마를 찍는다.","grammarQuiz":[{"sentence":"Some people love city life; _____, others prefer the countryside.","ko":"어떤 사람들은 도시 생활을 좋아하고, 반대로 다른 사람들은 시골을 선호한다.","answer":"conversely","hint":"세미콜론 뒤 접속부사"}]},
    {"id":"n07546","w":"composition","pos":["noun"],"ph":"/ˌkɑːmpəˈzɪʃən/","cefr":"B2","kr":["구성","작곡","작문"],"ex":[{"en":"The teacher asked us to analyze the composition of the painting.","ko":"선생님은 우리에게 그 그림의 구성을 분석해 보라고 했다."}],"mnemonic":{"soundHint":"컴포지션","story":"작곡가가 곡의 구성을 짠다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"structure","ko":"구조","reason":"동의어 — 짜임새"},{"w":"arrangement","ko":"배치","reason":"관련어 — 벌여 놓음"},{"w":"essay","ko":"글","reason":"관련어 — 지은 글"}],"collocBest":[{"en":"chemical composition","ko":"화학적 구성"},{"en":"the composition of the team","ko":"팀의 구성"}]},"nuance":{"koSimple":"여러 요소가 모여 하나의 전체를 이루는 구성이나 작품을 뜻해.","whenToUse":"음악 작곡, 미술 구도, 성분 분석을 말할 때 두루 자주 써."},"krDetail":[{"ko":"구성","explain":"여러 요소의 짜임"},{"ko":"작곡","explain":"음악을 지음"},{"ko":"작문","explain":"글을 지음"}],"usageExamples":[{"en":"The chemical composition of the water was carefully analyzed.","ko":"그 물의 화학적 구성이 신중히 분석되었다."},{"en":"Beethoven's most famous composition is his Ninth Symphony.","ko":"베토벤의 가장 유명한 작품은 그의 9번 교향곡이다."}],"grammarNote":"composition은 '구성·성분', '작곡·작품', '작문' 등 문맥에 따라 뜻이 달라지는 다의어이며, 동사 compose에서 파생되었다.","grammarQuiz":[{"sentence":"The chemical _____ of the soil affects plant growth.","ko":"토양의 화학적 구성은 식물 성장에 영향을 미친다.","answer":"composition","hint":"형용사 + 명사 주어"}]},
    {"id":"n07719","w":"quotient","pos":["noun"],"ph":"/ˈkwoʊʃənt/","cefr":"B2","kr":["몫","지수","정도"],"ex":[{"en":"Psychologists no longer treat the intelligence quotient as the only measure of ability.","ko":"심리학자들은 더 이상 지능 지수를 능력의 유일한 척도로 여기지 않는다."}],"mnemonic":{"soundHint":"쿼션트","story":"IQ의 Q = 지능 지수, 몫","hintConfidence":3},"pairs":{"buddyWords":[{"w":"ratio","ko":"비율","reason":"유의어 — 나눈 비"},{"w":"dividend","ko":"나뉘는 수","reason":"관련어 — 나눗셈 요소"},{"w":"remainder","ko":"나머지","reason":"대조어 — 남은 수"}],"collocBest":[{"en":"intelligence quotient","ko":"지능 지수"},{"en":"emotional quotient","ko":"감성 지수"}]},"nuance":{"koSimple":"나눗셈의 몫이나 특정 능력을 재는 지수를 뜻해요.","whenToUse":"수학의 몫이나 IQ·EQ 같은 지수 이야기에 써요."},"krDetail":[{"ko":"몫","explain":"나누어 얻은 수"},{"ko":"지수","explain":"정도를 나타낸 수"},{"ko":"정도","explain":"어느 만큼"}],"usageExamples":[{"en":"When you divide twenty by four, the quotient is five.","ko":"20을 4로 나누면 몫은 5이다."},{"en":"Employers increasingly value a high emotional quotient.","ko":"고용주들은 점점 더 높은 감성지수를 중요하게 여긴다."}],"grammarNote":"수학에서 나눗셈의 '몫'을 뜻하는 가산명사이며, \"intelligence quotient(지능지수, IQ)\"처럼 '~지수'라는 뜻으로도 자주 쓴다.","grammarQuiz":[{"sentence":"A person's emotional _____ is just as important as their IQ.","ko":"사람의 감성 지수는 IQ만큼이나 중요하다.","answer":"quotient","hint":"형용사(emotional) 뒤 — 명사"}]},
    {"id":"n07180","w":"fairness","pos":["noun"],"ph":"/ˈfɛrnəs/","cefr":"B2","kr":["공정성","공평함"],"ex":[{"en":"The judge was widely respected for her sense of fairness.","ko":"그 판사는 공정성에 대한 감각으로 널리 존경받았다."}],"mnemonic":{"soundHint":"페어니스","story":"fair(공정한)+ness → 공정함","hintConfidence":3},"pairs":{"buddyWords":[{"w":"justice","ko":"정의","reason":"동의어 — 올바름"},{"w":"equity","ko":"형평, 공평","reason":"동의어 — 치우침 없음"},{"w":"bias","ko":"편향","reason":"반의어 — 치우침"}],"collocBest":[{"en":"sense of fairness","ko":"공정성에 대한 감각"},{"en":"in fairness","ko":"공정하게 말하면"}]},"nuance":{"koSimple":"치우침 없이 공정하고 정당한 태도","whenToUse":"규칙·판정의 공평함을 강조할 때 씀"},"krDetail":[{"ko":"공정성","explain":"치우침 없이 올바름"},{"ko":"공평함","explain":"한쪽에 치우치지 않음"}],"usageExamples":[{"en":"Teachers must treat every student with fairness.","ko":"교사는 모든 학생을 공정하게 대해야 한다."},{"en":"In fairness, he did warn us about the risks beforehand.","ko":"공평하게 말하자면, 그는 미리 위험에 대해 우리에게 경고하긴 했다."}],"grammarNote":"fairness는 형용사 fair에 -ness가 붙은 추상명사로 셀 수 없다. 'a sense of fairness', 'in fairness (to ~)(~에게 공정하게 말하자면)' 같은 관용 표현으로 자주 쓰인다.","grammarQuiz":[{"sentence":"Children develop a strong sense of _____ from an early age.","ko":"아이들은 어린 나이부터 강한 공정성 감각을 발달시킨다.","answer":"fairness","hint":"a sense of + 명사 구조"}]},

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const fx = {

    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },

          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  if(DATA.reviewTest && Array.isArray(DATA.basicPool)) return shuffle([...DATA.basicPool]);
  const pool = [];
  const words = [...DATA.newWords];
  const shuffled = shuffle(words).slice(0, 15);
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];
  shuffle(modeOrder);
  shuffled.forEach((w,i)=>{ pool.push({ word:w, mode: modeOrder[i] }); });
  return pool;
}

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  if(DATA.reviewTest && Array.isArray(DATA.advPool)) return shuffle([...DATA.advPool]);
  return [];
}
function startAdvanced(){
  state.phase = "quiz";
  state.quizType = "advanced";
  state.quizPool = buildAdvancedPool();
  state.quizIdx = 0;
  state.quizCorrect = 0;
  state.quizWrongIds = new Set();
  state.quizWrongItems = [];
  state.startTime = Date.now();
  state.sessionElapsedBase = 0;
  state.xp = 0;
  state.streak = 0;
  state.maxStreak = 0;
  state.perChapterMaxStreak = 0;

}

/* 기본 — 틀린 문제만 재도전 (시간 누적) */
function startBasicRetryWrong(){

  state.phase = "quiz";
  state.quizType = "basic";

  state.quizIdx = 0;
  state.quizCorrect = 0;
  state.quizWrongIds = new Set();
  state.quizWrongItems = [];

  state.startTime = Date.now();
  state.xp = 0;
  state.streak = 0;
  state.maxStreak = 0;
  state.perChapterMaxStreak = 0;

}

/* 심화 — 틀린 문제만 재도전 (시간은 리셋 없이 누적) */
function startAdvancedRetryWrong(){
  const wrongPool = shuffle([...state.quizWrongItems]);
  if(!wrongPool.length){ renderHome(); return; }
  state.phase = "quiz";
  state.quizType = "advanced";
  state.quizPool = wrongPool;
  state.quizIdx = 0;
  state.quizCorrect = 0;
  state.quizWrongIds = new Set();
  state.quizWrongItems = [];
  // 이전 세션 경과시간 누적 → 새 startTime 설정
  state.sessionElapsedBase = (state.sessionElapsedBase || 0) + (Date.now() - state.startTime);
  state.startTime = Date.now();
  state.xp = 0;
  state.streak = 0;
  state.maxStreak = 0;
  state.perChapterMaxStreak = 0;
