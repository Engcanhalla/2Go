    {"id":"n07893","w":"genetically","pos":["adverb"],"ph":"/dʒəˈnɛtɪkli/","cefr":"B2","kr":["유전적으로"],"ex":[{"en":"Some crops are genetically modified to resist common diseases.","ko":"일부 작물은 흔한 병에 저항하도록 유전적으로 변형된다."}],"mnemonic":{"soundHint":"제네티컬리! 유전자 코드","story":"gene(유전자)+tic+ally, 유전적으로","hintConfidence":3},"pairs":{"buddyWords":[{"w":"hereditarily","ko":"유전으로","reason":"동의어 — 대물림"},{"w":"genetic","ko":"유전의","reason":"형용사형"},{"w":"environmentally","ko":"환경적으로","reason":"대조 — 환경 요인"}],"collocBest":[{"en":"genetically modified","ko":"유전적으로 변형된"},{"en":"genetically identical","ko":"유전적으로 동일한"}]},"nuance":{"koSimple":"유전자 차원에서 결정되거나 관련된다는 뜻이야","whenToUse":"유전 형질, 유전자 조작 식품을 설명할 때 자주 써"},"krDetail":[{"ko":"유전적으로","explain":"타고난 유전자로 인해"}],"usageExamples":[{"en":"The disorder is passed down genetically from parent to child.","ko":"그 질환은 부모에게서 자녀에게로 유전적으로 전달된다."},{"en":"Identical twins are genetically almost the same.","ko":"일란성 쌍둥이는 유전적으로 거의 동일하다."}],"grammarNote":"형용사 genetic의 부사형으로, 'genetically modified(유전자 변형된)'처럼 과거분사를 수식하는 관용 표현에 특히 자주 쓰인다.","grammarQuiz":[{"sentence":"Some diseases are _____ inherited from parents to children.","ko":"일부 질병은 부모로부터 자녀에게 유전적으로 전달된다.","answer":"genetically","hint":"_____ + 과거분사(inherited) — 부사"}]},
    {"id":"n08117","w":"interpersonal","pos":["adjective"],"ph":"/ˌɪntərˈpɜːrsənl/","cefr":"B2","kr":["대인 관계의","사람 사이의"],"ex":[{"en":"Strong interpersonal skills are essential for working in a team.","ko":"뛰어난 대인 관계 기술은 팀에서 일하는 데 필수적이다."}],"mnemonic":{"soundHint":"인터퍼스널","story":"'인터퍼스널' - 사람과 사람 사이의 관계.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"relational","ko":"관계의","reason":"동의어 — 관계에 관한"},{"w":"social","ko":"사회적인","reason":"관련어 — 사람 어울림"},{"w":"intrapersonal","ko":"자기 내면의","reason":"반의어 — 자기 안에서"}],"collocBest":[{"en":"interpersonal skills","ko":"대인 관계 기술"},{"en":"interpersonal relationships","ko":"대인 관계"}]},"nuance":{"koSimple":"사람과 사람 사이의 상호작용과 관련된, 대인 관계의","whenToUse":"의사소통 능력이나 인간관계 기술을 논할 때 사용"},"krDetail":[{"ko":"대인 관계의","explain":"사람을 대하는 관계의"},{"ko":"사람 사이의","explain":"사람과 사람 간의"}],"usageExamples":[{"en":"Good interpersonal relationships make the workplace more pleasant.","ko":"좋은 대인 관계는 직장을 더 유쾌하게 만든다."},{"en":"The course focuses on improving interpersonal communication.","ko":"그 강좌는 대인 간 의사소통을 향상시키는 데 초점을 둔다."}],"grammarNote":"접두사 inter-(사이의)와 personal이 결합한 형용사로 명사 앞에서 수식하며, 'interpersonal skills/relationships' 같은 연어를 이룬다.","grammarQuiz":[{"sentence":"Good _____ skills are essential for success in the workplace.","ko":"좋은 대인 관계 기술은 직장에서의 성공에 필수적이다.","answer":"interpersonal","hint":"형용사 + 명사 수식 구조"}]},
    {"id":"n08171","w":"distortion","pos":["noun"],"ph":"/dɪˈstɔːrʃən/","cefr":"B2","kr":["왜곡","변형"],"ex":[{"en":"The old mirror created a strange distortion of my reflection.","ko":"그 낡은 거울은 내 모습을 이상하게 왜곡시켰다."}],"mnemonic":{"soundHint":"디스토션","story":"'디스토션' - 사실이 뒤틀린 왜곡.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"misrepresentation","ko":"왜곡","reason":"동의어 — 사실 비틈"},{"w":"deformation","ko":"변형","reason":"동의어 — 모양 뒤틀림"},{"w":"accuracy","ko":"정확함","reason":"반의어 — 정반대"}],"collocBest":[{"en":"distortion of facts","ko":"사실의 왜곡"},{"en":"cause distortion","ko":"왜곡을 일으키다"}]},"nuance":{"koSimple":"원래 모습이 뒤틀리거나 변형된 것, 왜곡","whenToUse":"사실 왜곡이나 소리·이미지 변형을 논할 때 사용"},"krDetail":[{"ko":"왜곡","explain":"사실을 비틀어 바꿈"},{"ko":"변형","explain":"모양이 뒤틀려 바뀜"}],"usageExamples":[{"en":"The report contained a serious distortion of the original facts.","ko":"그 보고서에는 원래 사실에 대한 심각한 왜곡이 담겨 있었다."},{"en":"Cheap speakers often produce noticeable distortion at high volumes.","ko":"값싼 스피커는 높은 음량에서 눈에 띄는 왜곡을 일으키는 경우가 많다."}],"grammarNote":"distortion은 가산·불가산 둘 다 가능하며 'a distortion of ~' 형태로 '~의 왜곡'을 나타낸다. 동사는 distort, 형용사는 distorted이다.","grammarQuiz":[{"sentence":"The media's _____ of facts can mislead the public.","ko":"미디어의 사실 왜곡은 대중을 오도할 수 있다.","answer":"distortion","hint":"소유격 + 명사 + of (명사구)"}]},
    {"id":"n08222","w":"empathic","pos":["adjective"],"ph":"/emˈpæθɪk/","cefr":"B2","kr":["공감하는","감정이입의"],"ex":[{"en":"An empathic teacher can sense when a student is struggling.","ko":"공감하는 교사는 학생이 어려움을 겪고 있을 때를 감지할 수 있다."}],"mnemonic":{"soundHint":"엠패딕 → empathy(공감) + ic","story":"empathy에 -ic 붙여 '공감하는' empathic.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"empathetic","ko":"공감하는","reason":"유의어 — 같은 뜻"},{"w":"sympathetic","ko":"동정하는","reason":"유의어 — 마음을 나눔"},{"w":"callous","ko":"냉담한","reason":"반의어 — 마음이 무딤"}],"collocBest":[{"en":"an empathic response","ko":"공감하는 반응"},{"en":"empathic understanding","ko":"감정이입적 이해"}]},"nuance":{"koSimple":"타인 감정을 깊이 공감하는 능력을 지님","whenToUse":"공감 능력·정서적 이해를 강조할 때"},"krDetail":[{"ko":"공감하는","explain":"남 마음을 같이 느끼는"},{"ko":"감정이입의","explain":"남 감정 속에 들어가는"}],"usageExamples":[{"en":"An empathic listener makes others feel truly understood.","ko":"공감하는 청자는 다른 사람들이 진정으로 이해받는다고 느끼게 해 준다."},{"en":"Her empathic response helped calm the upset customer.","ko":"그녀의 공감하는 반응은 화가 난 고객을 진정시키는 데 도움이 되었다."}],"grammarNote":"empathic(=empathetic)은 '타인의 감정에 공감하는'이라는 뜻의 형용사이다. 명사는 empathy, 동사는 empathize이며, 동정을 뜻하는 sympathetic과 뉘앙스가 다르다.","grammarQuiz":[{"sentence":"An _____ listener tries to understand the speaker's feelings.","ko":"공감하는 청자는 화자의 감정을 이해하려고 노력한다.","answer":"empathic","hint":"형용사 + 명사 수식 (관사 뒤)"}]},
    {"id":"n08219","w":"uncharted","pos":["adjective"],"ph":"/ʌnˈtʃɑːrtɪd/","cefr":"B2","kr":["미지의","미개척의"],"ex":[{"en":"The explorers sailed into uncharted waters far from any coast.","ko":"탐험가들은 해안에서 멀리 떨어진 미지의 바다로 항해해 나아갔다."}],"mnemonic":{"soundHint":"언차티드 → un(부정)+chart(지도)+ed","story":"지도(chart)에 아직 없는(un), 아무도 안 가본 '미지의' uncharted.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"unexplored","ko":"탐험 안 된","reason":"유의어 — 가본 적 없는"},{"w":"unknown","ko":"알려지지 않은","reason":"유의어 — 모르는"},{"w":"familiar","ko":"익숙한","reason":"반의어 — 잘 아는"}],"collocBest":[{"en":"uncharted territory","ko":"미지의 영역"},{"en":"uncharted waters","ko":"미개척의 바다"}]},"nuance":{"koSimple":"지도에 없거나 미지의 영역을 뜻함","whenToUse":"새롭고 탐색되지 않은 분야를 강조할 때"},"krDetail":[{"ko":"미지의","explain":"아직 알지 못하는"},{"ko":"미개척의","explain":"아직 손대지 않은"}],"usageExamples":[{"en":"Launching the new business felt like entering uncharted territory.","ko":"새 사업을 시작하는 것은 미지의 영역에 발을 들이는 것 같은 느낌이었다."},{"en":"The submarine explored the uncharted depths of the ocean.","ko":"그 잠수함은 미개척의 심해를 탐사했다."}],"grammarNote":"uncharted는 'uncharted territory/waters'처럼 명사를 수식하며 비유적으로 '경험해 보지 못한 새로운 영역'을 뜻한다. un-(부정)+chart(지도에 표시하다)의 구조이다.","grammarQuiz":[{"sentence":"The explorers ventured into _____ territory deep in the jungle.","ko":"탐험가들은 정글 깊숙한 곳의 미지의 영역으로 모험을 떠났다.","answer":"uncharted","hint":"형용사 + 명사 수식 구조"}]},
    {"id":"n08133","w":"spherical","pos":["adjective"],"ph":"/ˈsferɪkəl/","cefr":"B2","kr":["구형의","공 모양의"],"ex":[{"en":"The ancient Greeks proved that the Earth is roughly spherical.","ko":"고대 그리스인들은 지구가 대략 구형이라는 것을 증명했다."}],"mnemonic":{"soundHint":"스피어리컬","story":"'스피어리컬' - 완벽하게 구형인 물체.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"round","ko":"둥근","reason":"동의어 — 동그람"},{"w":"globular","ko":"공 모양의","reason":"동의어 — 구슬 같음"},{"w":"flat","ko":"평평한","reason":"반의어 — 정반대"}],"collocBest":[{"en":"a spherical shape","ko":"구형의 형태"},{"en":"spherical object","ko":"공 모양의 물체"}]},"nuance":{"koSimple":"공처럼 둥근 모양을 가진, 구형의","whenToUse":"지구·행성이나 기하학적 도형을 묘사할 때 사용"},"krDetail":[{"ko":"구형의","explain":"둥근 공 같은 모양의"},{"ko":"공 모양의","explain":"동그란 공처럼 생긴"}],"usageExamples":[{"en":"The planet is not perfectly spherical but slightly flattened at the poles.","ko":"그 행성은 완벽한 구형이 아니라 극지방이 약간 평평하다."},{"en":"The artist created a large spherical sculpture out of glass.","ko":"그 예술가는 유리로 커다란 구형 조각을 만들었다."}],"grammarNote":"명사 sphere의 형용사형으로 '공 모양의'를 뜻하며, 명사 앞 수식과 보어 자리 모두에서 쓰인다.","grammarQuiz":[{"sentence":"The Earth is not perfectly _____ but slightly flattened at the poles.","ko":"지구는 완벽하게 구형이 아니라 극지방에서 약간 납작하다.","answer":"spherical","hint":"be + 형용사 (보어 자리)"}]},
    {"id":"v08596","w":"deference","pos":["noun"],"ph":"/ˈdefərəns/","cefr":"B2","kr":["존중"],"ex":[{"en":"In many Asian cultures, deference to elders remains a deeply respected social value.","ko":"많은 아시아 문화에서 연장자에 대한 존중은 깊이 존중되는 사회적 가치로 남아 있다."}],"mnemonic":{"soundHint":"데퍼런스 → 'defer(양보)'의 명사","story":"어른께 defer(양보)하며 예를 표함 = 존중.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"respect","ko":"존중","reason":"동의어 — 공경"},{"w":"regard","ko":"경의","reason":"유의어 — 높임"},{"w":"contempt","ko":"경멸","reason":"반의어 — 얕봄"}],"collocBest":[{"en":"out of deference to","ko":"~에 대한 존중에서"},{"en":"show deference","ko":"경의를 표하다"}]},"nuance":{"koSimple":"상대의 지위나 견해를 인정하며 정중히 따르는 태도를 뜻해요","whenToUse":"연장자·상급자·전문가에 대한 예의를 말할 때 써요"},"krDetail":[{"ko":"존중","explain":"높여 대접하는 마음"}],"usageExamples":[{"en":"Out of deference to her wishes, they postponed the celebration.","ko":"그녀의 뜻을 존중하여 그들은 축하 행사를 연기했다."},{"en":"The young lawyer spoke with deference to the senior judge.","ko":"젊은 변호사는 선임 판사에게 경의를 표하며 말했다."}],"grammarNote":"'in deference to'(~을 존중하여)와 'out of deference to'(~에 대한 존중에서)의 형태로 자주 쓰이는 불가산 명사다. 동사형은 'defer to'(~을 따르다, 존중하다)이다.","grammarQuiz":[{"sentence":"Deference to elders, _____ remains a core value in many Asian cultures, shapes daily behavior.","ko":"많은 아시아 문화에서 핵심 가치로 남아 있는 연장자에 대한 존중은 일상 행동을 형성한다.","answer":"which","hint":"계속적 용법의 관계대명사"}]},
    {"id":"u08368","w":"lavatory","pos":["noun"],"ph":"/ˈlævətɔːri/","cefr":"B2","kr":["세면장, 화장실"],"ex":[{"en":"The airplane's lavatory was temporarily closed during the brief but sudden turbulence.","ko":"잠깐이지만 갑작스러운 난기류가 발생하는 동안 비행기 화장실이 일시적으로 폐쇄되었다."}],"mnemonic":{"soundHint":"라바토리 → lava(씻다, 라틴어) + tory","story":"lava(씻다)에서 온 곳, 씻는 곳 '세면장, 화장실' lavatory.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"restroom","ko":"화장실","reason":"유의어 — 볼일 보는 곳"},{"w":"toilet","ko":"변기, 화장실","reason":"유의어 — 용변 보는 곳"},{"w":"bathroom","ko":"욕실","reason":"유의어 — 씻는 방"}],"collocBest":[{"en":"use the lavatory","ko":"화장실을 사용하다"},{"en":"a public lavatory","ko":"공중 화장실"}]},"nuance":{"koSimple":"공공장소나 기내의 세면장·화장실","whenToUse":"비행기·기차 등 격식 표현에 사용"},"krDetail":[{"ko":"세면장, 화장실","explain":"씻고 볼일 보는 곳"}],"usageExamples":[{"en":"Passengers were asked to return to their seats and use the lavatory only after landing.","ko":"승객들은 자리로 돌아가 착륙 후에만 화장실을 이용하라는 안내를 받았다."},{"en":"There is a small lavatory located at the rear of the train carriage.","ko":"기차 객차 뒤편에 작은 화장실이 하나 있다."}],"grammarNote":"비행기·기차 등의 '화장실'을 가리키는 다소 격식적인 가산명사로 a lavatory처럼 관사와 함께 쓴다. 일상 회화에서는 restroom(미국식)이나 toilet(영국식)을 더 흔히 쓴다.","grammarQuiz":[{"sentence":"The passenger asked the flight attendant _____ was standing near the lavatory for water.","ko":"그 승객은 화장실 근처에 서 있던 승무원에게 물을 요청했다.","answer":"who","hint":"관계대명사 who (주격)"}]},
    {"id":"u08458","w":"spear","pos":["noun"],"ph":"/spɪr/","cefr":"B2","kr":["창"],"ex":[{"en":"Ancient hunters carved sharp spears from wood and stone to catch large migrating animals.","ko":"고대 사냥꾼들은 이동하는 큰 동물을 잡기 위해 나무와 돌로 날카로운 창을 만들었다."}],"mnemonic":{"soundHint":"스피어 → 스피어(창) 던지기","story":"고대 사냥꾼이 던지는 '창' spear. 창 던지기 육상 종목.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"lance","ko":"창","reason":"동의어 — 긴 창"},{"w":"javelin","ko":"투창","reason":"유의어 — 던지는 창"},{"w":"shield","ko":"방패","reason":"반의어 — 막는 무기"}],"collocBest":[{"en":"throw a spear","ko":"창을 던지다"},{"en":"a fishing spear","ko":"작살"}]},"nuance":{"koSimple":"찌르는 데 쓰는 긴 자루의 창 무기","whenToUse":"고대 사냥·전투 도구를 언급할 때"},"krDetail":[{"ko":"창","explain":"끝이 뾰족한 긴 무기"}],"usageExamples":[{"en":"The warrior raised his spear and aimed carefully at the target.","ko":"그 전사는 창을 들어 올려 표적을 조심스럽게 겨냥했다."},{"en":"Museum visitors admired a stone spear used thousands of years ago.","ko":"박물관 방문객들은 수천 년 전에 사용된 돌 창에 감탄했다."}],"grammarNote":"던지거나 찌르는 무기 '창'을 뜻하는 가산명사이며, 동사로 쓰면 '창으로 찌르다/꿰다'를 뜻한다. 비슷한 무기 lance(기병용 창), javelin(투창)과 구별해 두면 좋다.","grammarQuiz":[{"sentence":"Ancient spears were _____ from carefully sharpened wood and small pieces of hard stone.","ko":"고대 창은 조심스럽게 갈아낸 나무와 단단한 돌의 작은 조각들로 만들어졌다.","answer":"made","hint":"수동태 (were made)"}]},
    {"id":"n08194","w":"autopilot","pos":["noun"],"ph":"/ˈɔːtoʊpaɪlət/","cefr":"B2","kr":["자동 조종 장치","자동 운행"],"ex":[{"en":"The pilot switched the plane to autopilot during the long flight.","ko":"조종사는 긴 비행 동안 비행기를 자동 조종 장치로 전환했다."}],"mnemonic":{"soundHint":"오토파일럿 → 오토(auto)+파일럿(pilot)","story":"오토(자동) 파일럿(조종사), 즉 '자동조종장치'.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"automatic","ko":"자동의","reason":"유의어 — 저절로 작동"},{"w":"manual","ko":"수동의","reason":"반의어 — 사람이 조작"},{"w":"self-driving","ko":"자율주행","reason":"관련어 — 스스로 운전"}],"collocBest":[{"en":"switch to autopilot","ko":"자동 조종으로 전환하다"},{"en":"on autopilot","ko":"자동 조종 상태로"}]},"nuance":{"koSimple":"자동 조종 장치 또는 무의식적 행동","whenToUse":"비행기 자동조종이나 습관적 행동 서술"},"krDetail":[{"ko":"자동 조종 장치","explain":"스스로 조종하는 기계"},{"ko":"자동 운행","explain":"사람 없이 스스로 감"}],"usageExamples":[{"en":"The captain engaged the autopilot once the plane reached cruising altitude.","ko":"기장은 비행기가 순항 고도에 도달하자 자동 조종 장치를 작동시켰다."},{"en":"After years of the same routine, he did his morning chores on autopilot.","ko":"여러 해 동안 같은 일과를 반복한 끝에 그는 아침 집안일을 아무 생각 없이 자동으로 했다."}],"grammarNote":"autopilot은 가산·불가산 모두 가능하며 'on autopilot'은 '자동 조종 상태로' 또는 비유적으로 '아무 생각 없이 습관적으로'라는 뜻으로 쓰인다.","grammarQuiz":[{"sentence":"Many people go through their daily routines on _____.","ko":"많은 사람들이 일상을 자동 조종 상태로 보낸다.","answer":"autopilot","hint":"on autopilot (자동으로, 관용 표현)"}]},
    {"id":"n08121","w":"profitable","pos":["adjective"],"ph":"/ˈprɑːfɪtəbl/","cefr":"B2","kr":["수익성 있는","이익이 되는"],"ex":[{"en":"The small bakery quickly became a profitable business in the town.","ko":"그 작은 빵집은 마을에서 금세 수익성 있는 사업이 되었다."}],"mnemonic":{"soundHint":"프라피터블","story":"'프라피터블' - 이익이 남는 장사.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"lucrative","ko":"돈벌이가 되는","reason":"동의어 — 이익 큼"},{"w":"gainful","ko":"이득이 되는","reason":"동의어 — 득을 봄"},{"w":"unprofitable","ko":"수익이 안 되는","reason":"반의어 — 정반대"}],"collocBest":[{"en":"a profitable business","ko":"수익성 있는 사업"},{"en":"highly profitable","ko":"매우 수익성 있는"}]},"nuance":{"koSimple":"이익을 남길 수 있는 사업이나 활동, 수익성 있는","whenToUse":"사업 성과나 투자 가치를 평가할 때 사용"},"krDetail":[{"ko":"수익성 있는","explain":"돈을 잘 벌 수 있는"},{"ko":"이익이 되는","explain":"득이 되는"}],"usageExamples":[{"en":"Online sales have made the store far more profitable than before.","ko":"온라인 판매가 그 가게를 이전보다 훨씬 더 수익성 있게 만들었다."},{"en":"Investing in education is profitable for society in the long run.","ko":"교육에 투자하는 것은 장기적으로 사회에 이익이 된다."}],"grammarNote":"명사 profit의 형용사형으로 '금전적 이익이 되는' 의미와 '유익한'이라는 비유적 의미를 모두 가지며, 부사형은 profitably다.","grammarQuiz":[{"sentence":"The new business turned out to be highly _____.","ko":"새 사업은 매우 수익성이 높은 것으로 드러났다.","answer":"profitable","hint":"turn out to be + 형용사 (보어)"}]},
    {"id":"u08318","w":"discrete","pos":["adj"],"ph":"/dɪˈskriːt/","cefr":"B2","kr":["분리된, 별개의"],"ex":[{"en":"Digital signals consist of discrete units, while analog signals form continuous smooth waves.","ko":"디지털 신호는 별개의 단위로 이루어져 있지만, 아날로그 신호는 연속적인 매끄러운 파형을 형성한다."}],"mnemonic":{"soundHint":"디스크리트 → 디스크(disk)+리트(따로)","story":"디스크(disk) 하나하나 따로따로 분리된, '별개의' discrete.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"separate","ko":"분리된","reason":"유의어 — 따로 떨어진"},{"w":"distinct","ko":"뚜렷이 다른","reason":"유의어 — 확실히 다름"},{"w":"connected","ko":"연결된","reason":"반의어 — 이어져 있음"}],"collocBest":[{"en":"discrete units","ko":"별개의 단위들"},{"en":"discrete categories","ko":"분리된 범주들"}]},"nuance":{"koSimple":"서로 분리된 개별 단위임을 뜻함","whenToUse":"수학·과학에서 개별 항목을 구분할 때"},"krDetail":[{"ko":"분리된, 별개의","explain":"따로따로 나뉜"}],"usageExamples":[{"en":"The whole project is divided into several discrete stages.","ko":"그 프로젝트 전체는 여러 개의 별개 단계로 나뉜다."},{"en":"Each cell performs a discrete function within the body.","ko":"각각의 세포는 신체 내에서 별개의 기능을 수행한다."}],"grammarNote":"discrete는 '별개의·불연속적인'을 뜻하는 형용사로, '신중한'을 뜻하는 동음이의어 discreet과 철자·의미를 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"Digital devices use discrete signals _____ can be represented as ones and zeros only.","ko":"디지털 기기는 오직 0과 1로 표현될 수 있는 별개의 신호를 사용한다.","answer":"that","hint":"관계대명사 that (주격)"}]},
    {"id":"v08506","w":"an army of","pos":["phrase"],"ph":"/ˈɑːrmi/","cefr":"B2","kr":["많은 (수의)","~(의) 무리[집단]"],"ex":[{"en":"An army of volunteers gathered at dawn to clean up the flooded neighborhood.","ko":"많은 자원봉사자들이 새벽에 물에 잠긴 동네를 청소하기 위해 모였다."}],"mnemonic":{"soundHint":"언 아미 오브 → army(군대) 만큼 많은","story":"army(군대) 규모의 인원, '많은 수의, ~의 무리' an army of.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"a horde of","ko":"다수의","reason":"동의어 — 떼"},{"w":"a crowd of","ko":"군중의","reason":"유의어 — 무리"},{"w":"a handful of","ko":"소수의","reason":"반의어 — 적은 수"}],"collocBest":[{"en":"an army of volunteers","ko":"수많은 자원봉사자"},{"en":"an army of ants","ko":"개미 떼"}]},"nuance":{"koSimple":"군대처럼 많은 수의 무리를 강조함","whenToUse":"자원봉사자·팬 등 대규모 인원 묘사"},"krDetail":[{"ko":"많은 (수의)","explain":"수가 아주 많은"},{"ko":"~(의) 무리[집단]","explain":"떼를 지은 무리"}],"usageExamples":[{"en":"An army of reporters waited outside the courtroom for the verdict.","ko":"수많은 기자들이 판결을 기다리며 법정 밖에서 대기했다."},{"en":"It took an army of volunteers to organize the huge charity event.","ko":"그 거대한 자선 행사를 준비하는 데는 수많은 자원봉사자가 필요했다."}],"grammarNote":"'아주 많은 수의 사람·사물'을 과장해 표현하는 관용구로, 뒤에는 보통 복수명사가 온다. 뒤 명사가 복수이므로 동사도 흔히 복수로 일치시켜 쓴다.","grammarQuiz":[{"sentence":"There was an army of volunteers _____ helped clean up the flooded neighborhood.","ko":"물에 잠긴 동네 청소를 도운 많은 자원봉사자들이 있었다.","answer":"who","hint":"사람 선행사 + 주격 관계대명사"}]},
    {"id":"n08099","w":"mentality","pos":["noun"],"ph":"/menˈtæləti/","cefr":"B2","kr":["사고방식","심리"],"ex":[{"en":"A winning mentality helped the team recover after every defeat.","ko":"승리하려는 사고방식이 그 팀이 매 패배 후에 회복하도록 도왔다."}],"mnemonic":{"soundHint":"멘탈리티","story":"'멘탈리티' - 사고방식이 승부를 가른다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"mindset","ko":"사고방식","reason":"동의어 — 생각의 틀"},{"w":"attitude","ko":"태도","reason":"관련어 — 마음가짐"},{"w":"behavior","ko":"행동","reason":"대조 — 겉으로 드러남"}],"collocBest":[{"en":"a positive mentality","ko":"긍정적인 사고방식"},{"en":"change your mentality","ko":"사고방식을 바꾸다"}]},"nuance":{"koSimple":"사람의 습관적 사고 태도나 마음가짐, 사고방식","whenToUse":"집단의 사고 성향이나 개인 태도를 논할 때 사용"},"krDetail":[{"ko":"사고방식","explain":"생각하고 판단하는 방식"},{"ko":"심리","explain":"마음속 상태"}],"usageExamples":[{"en":"A 'me first' mentality can damage teamwork in the office.","ko":"'나부터'라는 사고방식은 사무실의 팀워크를 해칠 수 있다."},{"en":"They criticized the win-at-all-costs mentality of modern sports.","ko":"그들은 무슨 수를 써서라도 이기려는 현대 스포츠의 사고방식을 비판했다."}],"grammarNote":"가산명사로 보통 앞에 형용사를 붙여 'a ... mentality(~한 사고방식)' 형태로 특정한 태도나 심리 성향을 나타낸다.","grammarQuiz":[{"sentence":"A positive _____ can help you overcome difficult challenges.","ko":"긍정적인 사고방식은 어려운 도전을 극복하는 데 도움이 될 수 있다.","answer":"mentality","hint":"형용사 + 명사 (주어 자리)"}]},
    {"id":"v08566","w":"characterize","pos":["phrase"],"ph":"/ˈkærəktəraɪz/","cefr":"B2","kr":["특징이 되다, 특징짓다"],"ex":[{"en":"Rapid technological innovation characterizes the modern global economy more than ever before.","ko":"급속한 기술 혁신은 그 어느 때보다도 현대 세계 경제를 특징짓는다."}],"mnemonic":{"soundHint":"캐릭터라이즈 → 'character(특성)'의 동사","story":"어떤 시대에 character(특성)을 부여 = 특징짓다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"typify","ko":"특징을 나타내다","reason":"동의어 — 대표하다"},{"w":"define","ko":"정의하다","reason":"유의어 — 규정하다"},{"w":"distinguish","ko":"구별짓다","reason":"유의어 — 특징지음"}],"collocBest":[{"en":"be characterized by","ko":"~을 특징으로 하다"},{"en":"characterize the era","ko":"그 시대를 특징짓다"}]},"nuance":{"koSimple":"어떤 대상의 두드러진 성질을 잘 드러내 규정한다는 뜻이에요","whenToUse":"시대·인물·현상의 대표적 특징을 설명할 때 자주 써요"},"krDetail":[{"ko":"특징이 되다, 특징짓다","explain":"남다른 점을 드러내다"}],"usageExamples":[{"en":"Bold brushstrokes and vivid colors characterize the artist's later works.","ko":"대담한 붓놀림과 선명한 색채가 그 화가의 후기 작품을 특징짓는다."},{"en":"Critics often characterize his novels as bleak yet strangely hopeful.","ko":"비평가들은 종종 그의 소설을 암울하지만 이상하게 희망적이라고 규정한다."}],"grammarNote":"'A characterize B'는 'A가 B의 특징이 되다'라는 뜻이고, 'characterize A as B'는 'A를 B로 규정하다'라는 뜻이다. 후자는 수동태 'A be characterized as B'로 자주 쓰인다.","grammarQuiz":[{"sentence":"It is rapid technological innovation _____ characterizes the modern global economy.","ko":"현대 세계 경제를 특징짓는 것은 바로 급속한 기술 혁신이다.","answer":"that","hint":"It is ~ that 강조구문 (주어 강조)"}]},
    {"id":"v08530","w":"at the expense of","pos":["phrase"],"ph":"/ɪkˈspens/","cefr":"B2","kr":["~을 희생하여, ~의 비용을 대가로"],"ex":[{"en":"Rapid economic growth was achieved at the expense of environmental sustainability.","ko":"급속한 경제 성장은 환경 지속가능성을 희생시키는 대가로 달성되었다."}],"mnemonic":{"soundHint":"앳 디 익스펜스 오브 → 'expense(비용)'을 대가로","story":"누군가의 expense(지출·희생)를 대가로 얻어낸다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"at the cost of","ko":"~을 대가로","reason":"동의어 — 희생하여"},{"w":"sacrificing","ko":"희생하며","reason":"유의어 — 잃으며"},{"w":"benefiting","ko":"이롭게 하며","reason":"반의어 — 이득"}],"collocBest":[{"en":"at the expense of health","ko":"건강을 희생하여"},{"en":"at the expense of others","ko":"다른 사람들을 희생하여"}]},"nuance":{"koSimple":"다른 것을 대가로 치러가며 무언가를 얻거나 이룬다는 뜻이에요","whenToUse":"경제 성장이 환경을 해치듯 대가 관계를 지적할 때 써요"},"krDetail":[{"ko":"~을 희생하여, ~의 비용을 대가로","explain":"무언가를 잃는 대신"}],"usageExamples":[{"en":"He built his career at the expense of his health and family.","ko":"그는 자신의 건강과 가족을 희생하여 경력을 쌓았다."},{"en":"The factory increased profits at the expense of worker safety.","ko":"그 공장은 근로자 안전을 희생하여 이익을 늘렸다."}],"grammarNote":"'~을 희생하여/대가로'를 뜻하며 뒤에 명사(구)나 동명사가 온다. at one's expense는 '~의 비용으로' 또는 '~를 놀림감 삼아'라는 뜻으로도 쓰이니 문맥에 유의한다.","grammarQuiz":[{"sentence":"Rapid economic growth _____ achieved at the expense of environmental sustainability.","ko":"급속한 경제 성장은 환경 지속가능성을 희생시키며 달성되었다.","answer":"was","hint":"수동태(be + p.p.) 과거형"}]},
    {"id":"n08160","w":"ethical","pos":["adjective"],"ph":"/ˈeθɪkəl/","cefr":"B2","kr":["윤리적인","도덕적인"],"ex":[{"en":"Doctors must follow strict ethical rules when treating patients.","ko":"의사들은 환자를 치료할 때 엄격한 윤리적 규칙을 따라야 한다."}],"mnemonic":{"soundHint":"에티컬","story":"'에티컬' - 도덕적이고 윤리적인 선택.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"moral","ko":"도덕적인","reason":"동의어 — 옳고 바름"},{"w":"principled","ko":"원칙 있는","reason":"동의어 — 소신 지킴"},{"w":"unethical","ko":"비윤리적인","reason":"반의어 — 정반대"}],"collocBest":[{"en":"ethical standards","ko":"윤리 기준"},{"en":"an ethical issue","ko":"윤리적 문제"}]},"nuance":{"koSimple":"도덕 원칙에 부합하는, 윤리적인","whenToUse":"도덕적 판단이나 직업 윤리를 논할 때 사용"},"krDetail":[{"ko":"윤리적인","explain":"사람 도리에 맞는"},{"ko":"도덕적인","explain":"양심에 비추어 옳은"}],"usageExamples":[{"en":"The company faced serious ethical questions about how it collected user data.","ko":"그 회사는 사용자 데이터를 수집하는 방식을 두고 심각한 윤리적 문제에 직면했다."},{"en":"Journalists have an ethical duty to report the truth accurately.","ko":"기자들은 진실을 정확하게 보도해야 할 윤리적 의무가 있다."}],"grammarNote":"ethical은 명사를 앞에서 수식하며(ethical issue/standard/dilemma) 반의어는 unethical이다. 부사형은 ethically, 명사형은 ethics(윤리학)이다.","grammarQuiz":[{"sentence":"Scientists must consider the _____ implications of their research.","ko":"과학자들은 자신의 연구가 갖는 윤리적 함의를 고려해야 한다.","answer":"ethical","hint":"the + 형용사 + 명사 (목적어 수식)"}]},
    {"id":"v08518","w":"arithmetic","pos":["noun"],"ph":"/əˈrɪθmətɪk/","cefr":"B2","kr":["산수"],"ex":[{"en":"Basic arithmetic remains an essential skill even in the age of digital calculators.","ko":"기본적인 산수는 디지털 계산기의 시대에도 여전히 필수적인 기술이다."}],"mnemonic":{"soundHint":"어리쓰메틱 → '어릴 때 쓰던 매틱한 계산'","story":"어릴 때 쓰던 자동(매틱)적인 계산 = 산수.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"math","ko":"수학","reason":"동의어 — 셈"},{"w":"calculation","ko":"계산","reason":"유의어 — 셈하기"},{"w":"number","ko":"숫자","reason":"관련어 — 수"}],"collocBest":[{"en":"mental arithmetic","ko":"암산"},{"en":"simple arithmetic","ko":"간단한 산수"}]},"nuance":{"koSimple":"덧셈·뺄셈·곱셈처럼 수를 다루는 기본 계산 활동을 뜻해요","whenToUse":"초등 교육이나 기초 계산 능력을 이야기할 때 자주 써요"},"krDetail":[{"ko":"산수","explain":"더하고 빼는 셈"}],"usageExamples":[{"en":"Children learn basic arithmetic such as addition and subtraction in school.","ko":"아이들은 학교에서 덧셈과 뺄셈 같은 기초 산수를 배운다."},{"en":"He made a simple arithmetic error and got the wrong total.","ko":"그는 단순한 계산 실수를 저질러 잘못된 합계를 얻었다."}],"grammarNote":"'산수·셈'을 뜻할 때는 불가산명사라 관사 a를 붙이지 않는다. 명사(강세 arith-)와 형용사 arithmetic(강세 -met-, 산술의)은 강세 위치가 달라 발음이 구별된다.","grammarQuiz":[{"sentence":"It is basic arithmetic _____ children must master before advancing to algebra.","ko":"어린이들이 대수학으로 나아가기 전에 반드시 익혀야 하는 것은 바로 기본 산수이다.","answer":"that","hint":"It is ~ that 강조구문 (강조 대상: basic arithmetic)"}]},
    {"id":"n08154","w":"untouched","pos":["adjective"],"ph":"/ʌnˈtʌtʃt/","cefr":"B2","kr":["손대지 않은","영향을 받지 않은"],"ex":[{"en":"The remote valley remained untouched by modern development.","ko":"그 외딴 계곡은 현대적 개발에 손대지 않은 채로 남아 있었다."}],"mnemonic":{"soundHint":"언터치트","story":"'언터치트' - 손 하나 대지 않은 상태.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"pristine","ko":"때묻지 않은","reason":"동의어 — 깨끗함"},{"w":"intact","ko":"온전한","reason":"동의어 — 그대로임"},{"w":"altered","ko":"변경된","reason":"반의어 — 손댐"}],"collocBest":[{"en":"remain untouched","ko":"손대지 않은 채로 남다"},{"en":"largely untouched","ko":"거의 영향을 받지 않은"}]},"nuance":{"koSimple":"손대지 않아 원래 상태 그대로 보존된","whenToUse":"자연·유물이 훼손되지 않은 상태를 말할 때 사용"},"krDetail":[{"ko":"손대지 않은","explain":"건드리지 않은"},{"ko":"영향을 받지 않은","explain":"그대로 남아 있는"}],"usageExamples":[{"en":"Her meal sat completely untouched on the table because she had lost her appetite.","ko":"그녀는 입맛을 잃어서 식사에 전혀 손대지 않은 채로 식탁 위에 그대로 두었다."},{"en":"The ancient tomb had remained untouched for over two thousand years.","ko":"그 고대 무덤은 이천 년이 넘도록 손대지 않은 상태로 남아 있었다."}],"grammarNote":"untouched는 형용사로 주로 remain/leave/stay 같은 동사 뒤에 보어로 쓰인다. 'untouched by ~' 형태로 '~의 영향을 받지 않은'이라는 의미를 나타낸다.","grammarQuiz":[{"sentence":"The ancient forest remained _____ by human activity for centuries.","ko":"그 고대 숲은 수세기 동안 인간 활동에 의해 손대지 않은 채 남아 있었다.","answer":"untouched","hint":"remain + 형용사 (상태 유지)"}]},
    {"id":"u08373","w":"meek","pos":["adj"],"ph":"/miːk/","cefr":"B2","kr":["얌전한, 온순한"],"ex":[{"en":"Despite her meek appearance, she boldly defended her position throughout the fierce debate.","ko":"그녀는 온순해 보이는 겉모습에도 불구하고 격렬한 토론 내내 자신의 입장을 대담하게 옹호했다."}],"mnemonic":{"soundHint":"미크 → 미(美, 예쁜)+크(작은)","story":"미소가 작고 예쁜, 얌전하고 '온순한' meek.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"gentle","ko":"온화한","reason":"유의어 — 부드러움"},{"w":"docile","ko":"고분고분한","reason":"유의어 — 말 잘 들음"},{"w":"aggressive","ko":"공격적인","reason":"반의어 — 거칠고 사나움"}],"collocBest":[{"en":"meek and mild","ko":"온순하고 부드러운"},{"en":"a meek voice","ko":"얌전한 목소리"}]},"nuance":{"koSimple":"고분고분하고 조용하며 온순한 성격","whenToUse":"저항 없이 순응하는 태도를 묘사할 때"},"krDetail":[{"ko":"얌전한, 온순한","explain":"조용하고 순한"}],"usageExamples":[{"en":"The new intern was so meek that she rarely spoke during team meetings.","ko":"새 인턴은 너무 얌전해서 팀 회의 중에 좀처럼 말을 하지 않았다."},{"en":"He gave a meek reply, avoiding any direct confrontation with his boss.","ko":"그는 상사와의 직접적인 충돌을 피하며 온순한 대답을 했다."}],"grammarNote":"사람이나 태도가 '순종적이고 온순한'이라는 뜻의 형용사로, 때로 '지나치게 소극적인'이라는 약한 부정적 뉘앙스를 담는다. 명사를 앞에서 수식(a meek voice)하거나 be동사 뒤 보어로 쓴다.","grammarQuiz":[{"sentence":"The teacher found the quiet new student _____ be surprisingly meek during class discussions.","ko":"선생님은 그 조용한 새 학생이 수업 토론 중에 놀랍도록 온순하다고 여겼다.","answer":"to","hint":"5형식 find + O + to be"}]},
    {"id":"u08393","w":"pierce","pos":["verb"],"ph":"/pɪrs/","cefr":"B2","kr":["꿰뚫다"],"ex":[{"en":"A sudden ray of sunlight pierced the thick clouds after the long, heavy storm.","ko":"길고 강한 폭풍 후에 갑자기 한 줄기 햇빛이 두꺼운 구름을 뚫고 들어왔다."}],"mnemonic":{"soundHint":"피어스 → 귀 피어싱(piercing)","story":"귀 피어싱하듯 뾰족한 것으로 '꿰뚫다' pierce.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"penetrate","ko":"관통하다","reason":"유의어 — 뚫고 들어감"},{"w":"puncture","ko":"구멍 내다","reason":"유의어 — 찔러 구멍냄"},{"w":"seal","ko":"봉하다","reason":"반의어 — 막아버림"}],"collocBest":[{"en":"pierce your ears","ko":"귀를 뚫다"},{"en":"pierce the skin","ko":"피부를 뚫다"}]},"nuance":{"koSimple":"뾰족한 것이 뚫고 관통하는 동작","whenToUse":"소리·빛·물체가 관통할 때 서술"},"krDetail":[{"ko":"꿰뚫다","explain":"뾰족한 것으로 뚫다"}],"usageExamples":[{"en":"The nurse will pierce your ear gently with a sterile needle.","ko":"간호사가 소독된 바늘로 당신의 귀를 조심스럽게 뚫을 것이다."},{"en":"A loud scream seemed to pierce the silence of the empty hall.","ko":"커다란 비명이 텅 빈 홀의 정적을 꿰뚫는 듯했다."}],"grammarNote":"'뾰족한 것이 ~을 꿰뚫다'라는 타동사이며, 소리·빛이 무언가를 '뚫고 지나가다'라는 비유적 의미로도 쓴다. 형용사 piercing(꿰뚫는, 날카로운)과 함께 익혀 두면 좋다.","grammarQuiz":[{"sentence":"The heavy armor _____ pierced by a sharp arrow during the intense medieval battle.","ko":"그 무거운 갑옷은 격렬한 중세 전투 중 날카로운 화살에 뚫렸다.","answer":"was","hint":"수동태 (was pierced)"}]},
    {"id":"n08220","w":"landfill","pos":["noun"],"ph":"/ˈlændfɪl/","cefr":"B2","kr":["매립지","쓰레기 매립"],"ex":[{"en":"Most of the city's plastic waste ends up in a landfill.","ko":"그 도시의 플라스틱 쓰레기 대부분은 결국 매립지로 간다."}],"mnemonic":{"soundHint":"랜드필 → land(땅)+fill(채우다)","story":"땅(land)을 쓰레기로 채우는(fill) 곳, '매립지' landfill.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"dump","ko":"쓰레기장","reason":"유의어 — 버리는 곳"},{"w":"garbage","ko":"쓰레기","reason":"관련어 — 버린 물건"},{"w":"waste","ko":"폐기물","reason":"관련어 — 못 쓰는 것"}],"collocBest":[{"en":"end up in a landfill","ko":"매립지로 가게 되다"},{"en":"landfill site","ko":"쓰레기 매립지"}]},"nuance":{"koSimple":"쓰레기를 묻어 처리하는 매립지","whenToUse":"환경·폐기물 처리 문제를 논할 때"},"krDetail":[{"ko":"매립지","explain":"쓰레기 묻는 땅"},{"ko":"쓰레기 매립","explain":"쓰레기를 땅에 묻음"}],"usageExamples":[{"en":"Recycling reduces the amount of waste sent to landfill each year.","ko":"재활용은 매년 매립지로 보내지는 폐기물의 양을 줄여 준다."},{"en":"The old landfill was eventually turned into a public park.","ko":"그 오래된 매립지는 결국 공공 공원으로 바뀌었다."}],"grammarNote":"landfill은 장소를 뜻할 때 가산명사(a landfill), 매립 방식 전체를 뜻할 때 불가산(sent to landfill)으로 쓴다. land(땅)+fill(채우다)의 합성어이다.","grammarQuiz":[{"sentence":"Tons of plastic waste end up in _____ sites every year.","ko":"매년 수톤의 플라스틱 쓰레기가 매립지에 버려진다.","answer":"landfill","hint":"명사 + 명사 (복합명사 구조)"}]},
    {"id":"n08173","w":"fertilizers","pos":["noun"],"ph":"/ˈfɜːrtɪlaɪzərz/","cefr":"B2","kr":["비료"],"ex":[{"en":"Farmers use chemical fertilizers to increase their crop yields.","ko":"농부들은 작물 수확량을 늘리기 위해 화학 비료를 사용한다."}],"mnemonic":{"soundHint":"퍼틸라이저즈","story":"'퍼틸라이저즈' - 밭을 살찌우는 비료들.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"manure","ko":"거름","reason":"관련어 — 천연 비료"},{"w":"compost","ko":"퇴비","reason":"관련어 — 썩혀 만든 거름"},{"w":"pesticides","ko":"농약","reason":"대조 — 다른 농자재"}],"collocBest":[{"en":"chemical fertilizers","ko":"화학 비료"},{"en":"apply fertilizers","ko":"비료를 주다"}]},"nuance":{"koSimple":"작물 성장을 돕는 영양 물질들, 비료들","whenToUse":"농업·정원 관리나 환경 오염을 논할 때 사용"},"krDetail":[{"ko":"비료","explain":"흙을 기름지게 하는 양분"}],"usageExamples":[{"en":"Organic fertilizers improve soil health without harming the environment.","ko":"유기농 비료는 환경을 해치지 않으면서 토양의 건강을 개선한다."},{"en":"The overuse of chemical fertilizers can pollute nearby rivers.","ko":"화학 비료의 과도한 사용은 인근 강을 오염시킬 수 있다."}],"grammarNote":"fertilizer는 종류를 가리킬 때 fertilizers처럼 복수로 쓰고, 물질 전체를 뜻할 때는 불가산으로 쓴다. 동사 fertilize, 명사 fertility(비옥함)와 관련된다.","grammarQuiz":[{"sentence":"Excessive use of chemical _____ can harm the soil over time.","ko":"화학 비료의 과도한 사용은 시간이 지남에 따라 토양을 해칠 수 있다.","answer":"fertilizers","hint":"형용사 + 복수명사 (목적어 수식)"}]},
    {"id":"n08152","w":"communism","pos":["noun"],"ph":"/ˈkɑːmjənɪzəm/","cefr":"B2","kr":["공산주의"],"ex":[{"en":"The book explains how communism spread across Eastern Europe.","ko":"그 책은 공산주의가 동유럽 전역으로 어떻게 퍼졌는지 설명한다."}],"mnemonic":{"soundHint":"커뮤니즘","story":"'커뮤니즘' - 20세기의 거대한 이념.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"socialism","ko":"사회주의","reason":"관련어 — 비슷한 사상"},{"w":"Marxism","ko":"마르크스주의","reason":"관련어 — 뿌리 사상"},{"w":"capitalism","ko":"자본주의","reason":"반의어 — 정반대"}],"collocBest":[{"en":"the fall of communism","ko":"공산주의의 몰락"},{"en":"spread of communism","ko":"공산주의의 확산"}]},"nuance":{"koSimple":"재산 공유를 주장하는 정치·경제 사상, 공산주의","whenToUse":"이념 비교나 20세기 역사를 서술할 때 사용"},"krDetail":[{"ko":"공산주의","explain":"재산을 함께 나누는 사상"}],"usageExamples":[{"en":"The revolution promised to establish communism across the nation.","ko":"그 혁명은 나라 전역에 공산주의를 수립하겠다고 약속했다."},{"en":"Many countries abandoned communism at the end of the twentieth century.","ko":"많은 나라들이 20세기 말에 공산주의를 버렸다."}],"grammarNote":"불가산 추상명사로 관사 없이 쓰며, 특정 정치 체제를 강조할 때 대문자 Communism으로 표기하기도 한다.","grammarQuiz":[{"sentence":"After World War II, _____ spread to many Eastern European countries.","ko":"제2차 세계 대전 후 공산주의가 많은 동유럽 국가로 퍼졌다.","answer":"communism","hint":"불가산 추상명사 (주어 자리)"}]},
    {"id":"v08563","w":"cast one's eye on","pos":["phrase"],"ph":"/kæst/","cefr":"B2","kr":["~에 눈길을 주다, ~을 바라보다"],"ex":[{"en":"She cast her eye on the sparkling diamond necklace displayed in the boutique window.","ko":"그녀는 부티크 창문에 진열된 반짝이는 다이아몬드 목걸이에 눈길을 주었다."}],"mnemonic":{"soundHint":"캐스트 아이 온 → '눈(eye)을 던지다(cast)'","story":"눈길(eye)을 그쪽으로 cast(던지다) = 눈길을 주다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"glance at","ko":"흘낏 보다","reason":"동의어 — 잠깐 봄"},{"w":"look at","ko":"바라보다","reason":"유의어 — 보다"},{"w":"ignore","ko":"무시하다","reason":"반의어 — 안 봄"}],"collocBest":[{"en":"cast an eye on the crowd","ko":"군중에 눈길을 주다"},{"en":"cast his eye over the report","ko":"보고서를 훑어보다"}]},"nuance":{"koSimple":"시선을 어떤 대상 쪽으로 던져 잠시 바라본다는 뜻이에요","whenToUse":"흥미로운 물건에 눈길이 쏠릴 때 문학적으로 자주 써요"},"krDetail":[{"ko":"~에 눈길을 주다, ~을 바라보다","explain":"잠깐 눈을 두어 보다"}],"usageExamples":[{"en":"The detective cast his eye on every corner of the dimly lit room.","ko":"형사는 어둑한 방의 모든 구석에 눈길을 주었다."},{"en":"Before signing, she cast her eye on the fine print at the bottom of the page.","ko":"서명하기 전에 그녀는 페이지 하단의 깨알 같은 글씨에 눈길을 주었다."}],"grammarNote":"'one's' 자리에 소유격(his, her, my 등)을 주어에 맞춰 넣어야 하며, 'eye'는 보통 단수로 쓴다. 눈길을 주는 대상 앞에는 전치사 'on'이 온다.","grammarQuiz":[{"sentence":"_____ her eye on the sparkling diamond necklace, she smiled with delight.","ko":"반짝이는 다이아몬드 목걸이에 눈길을 주며, 그녀는 기쁨에 미소 지었다.","answer":"Casting","hint":"분사구문(능동/현재분사) 문두"}]},
    {"id":"u08413","w":"radius","pos":["noun"],"ph":"/ˈreɪdiəs/","cefr":"B2","kr":["반지름"],"ex":[{"en":"Rescue teams searched every home within a two-kilometer radius of the disaster area.","ko":"구조대는 재해 지역 반경 2킬로미터 이내의 모든 집을 수색했다."}],"mnemonic":{"soundHint":"레이디어스 → ray(광선) + 어스","story":"중심에서 뻗어나가는 광선(ray) 같은 선, '반지름' radius.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"diameter","ko":"지름","reason":"관련어 — 반지름 두 배"},{"w":"range","ko":"범위","reason":"유의어 — 미치는 거리"},{"w":"circle","ko":"원","reason":"관련어 — 반지름의 도형"}],"collocBest":[{"en":"a radius of five kilometers","ko":"반경 5킬로미터"},{"en":"within a radius of","ko":"~ 반경 이내에"}]},"nuance":{"koSimple":"원의 반지름이나 특정 거리 범위","whenToUse":"수학적 반지름·수색 범위 표현 시"},"krDetail":[{"ko":"반지름","explain":"중심에서 가장자리까지"}],"usageExamples":[{"en":"Only residents living within a five-mile radius may use the parking lot.","ko":"반경 5마일 이내에 사는 주민만이 그 주차장을 이용할 수 있다."},{"en":"To find the area, you first need to measure the radius of the circle.","ko":"넓이를 구하려면 먼저 그 원의 반지름을 재야 한다."}],"grammarNote":"'반지름' 또는 '반경(범위)'을 뜻하는 가산명사로, within a ... radius(반경 ~ 이내에)라는 연어가 흔하다. 복수형은 radii 또는 radiuses이며 학술적으로는 radii를 선호한다.","grammarQuiz":[{"sentence":"The area _____ falls within a five-kilometer radius will be evacuated first tonight.","ko":"반경 5킬로미터 이내의 지역은 오늘 밤 먼저 대피될 것이다.","answer":"that","hint":"관계대명사 that (주격)"}]},
    {"id":"u08463","w":"spur","pos":["noun","verb"],"ph":"/spɜːr/","cefr":"B2","kr":["자극","박차를 가하다"],"ex":[{"en":"Rising fuel prices spurred consumers to consider electric vehicles as a practical long-term investment.","ko":"치솟는 연료 가격은 소비자들이 전기차를 실용적인 장기 투자로 고려하도록 자극했다."}],"mnemonic":{"soundHint":"스퍼 → 승마 박차","story":"말 옆구리를 찌르는 '박차'에서 '자극하다' spur.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"stimulate","ko":"자극하다","reason":"동의어 — 부추기다"},{"w":"incite","ko":"선동하다","reason":"유의어 — 자극하다"},{"w":"hinder","ko":"방해하다","reason":"반의어 — 가로막다"}],"collocBest":[{"en":"spur economic growth","ko":"경제 성장을 촉진하다"},{"en":"on the spur of the moment","ko":"충동적으로, 즉흥적으로"}]},"nuance":{"koSimple":"어떤 행동을 부추기고 자극하는 것","whenToUse":"결심·성장·행동을 촉진할 때 서술"},"krDetail":[{"ko":"자극","explain":"행동하게 만드는 것"},{"ko":"박차를 가하다","explain":"더 빨리 하도록 몰아붙이다"}],"usageExamples":[{"en":"The new tax break is expected to spur investment in green energy.","ko":"새로운 세금 감면은 친환경 에너지에 대한 투자를 촉진할 것으로 예상된다."},{"en":"Her early success gave her the spur she needed to keep training.","ko":"초기의 성공은 그녀가 훈련을 계속하는 데 필요한 자극을 주었다."}],"grammarNote":"동사로 spur somebody to do 또는 spur something on 형태로 '~을 촉진·자극하다'를 뜻한다. on the spur of the moment(충동적으로)라는 관용구도 함께 익혀 두면 좋다.","grammarQuiz":[{"sentence":"The sudden economic downturn spurred the government _____ act quickly on tax reforms.","ko":"갑작스러운 경제 침체는 정부가 세제 개혁에 신속하게 대응하도록 자극했다.","answer":"to","hint":"5형식 spur + O + to부정사"}]},
    {"id":"v08587","w":"considerate","pos":["phrase"],"ph":"/kənˈsɪdərət/","cefr":"B2","kr":["배려하는, 사려 깊은","이해심이 있는"],"ex":[{"en":"A considerate friend always remembers the small details you casually mentioned before.","ko":"사려 깊은 친구는 당신이 이전에 무심코 언급한 작은 세부사항을 항상 기억한다."}],"mnemonic":{"soundHint":"컨시더리트 → 'consider(고려)'의 형용사","story":"남을 consider(고려)해 주는 = 사려 깊은.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"thoughtful","ko":"사려 깊은","reason":"동의어 — 배려하는"},{"w":"caring","ko":"배려하는","reason":"유의어 — 살뜰한"},{"w":"selfish","ko":"이기적인","reason":"반의어 — 자기만"}],"collocBest":[{"en":"a considerate person","ko":"배려심 있는 사람"},{"en":"considerate of others","ko":"남을 배려하는"}]},"nuance":{"koSimple":"남의 감정과 상황을 먼저 살펴 배려하는 태도를 뜻해요","whenToUse":"친절한 성품이나 배려 있는 행동을 칭찬할 때 자주 써요"},"krDetail":[{"ko":"배려하는, 사려 깊은","explain":"남을 잘 챙기고 헤아리는"},{"ko":"이해심이 있는","explain":"남의 처지를 잘 헤아리는"}],"usageExamples":[{"en":"It was very considerate of you to bring an umbrella for me.","ko":"나를 위해 우산을 가져다주다니 정말 사려 깊었다."},{"en":"A considerate host makes every guest feel genuinely welcome.","ko":"배려심 있는 주인은 모든 손님이 진심으로 환영받는다고 느끼게 한다."}],"grammarNote":"'남을 배려하는'이라는 뜻으로 사람의 성품을 묘사한다. 'It is considerate of + 사람 + to부정사' 구문으로 자주 쓰이며, '상당한'을 뜻하는 'considerable'과 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"If she _____ more considerate, she would remember the small details you mentioned.","ko":"그녀가 더 사려 깊다면, 당신이 언급한 작은 세부사항을 기억할 텐데.","answer":"were","hint":"가정법 과거 (If + were, would + 동사원형)"}]},
    {"id":"n08200","w":"sympathetic","pos":["adjective"],"ph":"/ˌsɪmpəˈθetɪk/","cefr":"B2","kr":["동정적인","공감하는"],"ex":[{"en":"The nurse gave the frightened patient a sympathetic smile.","ko":"간호사는 겁먹은 환자에게 동정적인 미소를 지어 보였다."}],"mnemonic":{"soundHint":"심퍼세틱 → 심(마음)+퍼(퍼주는)","story":"심(마음)을 퍼주는, 남의 마음을 함께 아파하는 '동정적인'.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"compassionate","ko":"인정 많은","reason":"유의어 — 남을 불쌍히 여김"},{"w":"empathetic","ko":"공감하는","reason":"유의어 — 감정을 함께함"},{"w":"indifferent","ko":"무관심한","reason":"반의어 — 관심 없음"}],"collocBest":[{"en":"a sympathetic listener","ko":"공감해 주는 청자"},{"en":"sympathetic to the cause","ko":"그 대의에 공감하는"}]},"nuance":{"koSimple":"타인의 감정에 공감하고 동정하는 태도","whenToUse":"상대의 어려움에 이해심을 보일 때"},"krDetail":[{"ko":"동정적인","explain":"남의 아픔을 함께 느끼는"},{"ko":"공감하는","explain":"남 마음을 함께 느끼는"}],"usageExamples":[{"en":"The manager was sympathetic to the workers' complaints about long hours.","ko":"그 관리자는 장시간 근무에 대한 직원들의 불만에 동정적이었다."},{"en":"She gave me a sympathetic look when I explained my problem.","ko":"내가 문제를 설명하자 그녀는 공감하는 표정을 지어 보였다."}],"grammarNote":"sympathetic은 'be sympathetic to/toward(s) ~' 형태로 '~에 동정적인·호의적인'이라는 뜻을 나타낸다. 명사는 sympathy, 동사는 sympathize이다.","grammarQuiz":[{"sentence":"The counselor was very _____ to the student's personal problems.","ko":"상담사는 학생의 개인적인 문제에 매우 동정적이었다.","answer":"sympathetic","hint":"be sympathetic to ~ (~에 동정적인)"}]},
    {"id":"v08503","w":"all in all","pos":["phrase"],"ph":"/ɔːl/","cefr":"B2","kr":["대체로"],"ex":[{"en":"All in all, the reform improved public health despite its considerable political cost.","ko":"대체로 그 개혁은 상당한 정치적 비용에도 불구하고 공중 보건을 개선했다."}],"mnemonic":{"soundHint":"올 인 올 → 전부를 전부에","story":"전부(all)를 전부(all)로 놓고 보면, '대체로' all in all.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"overall","ko":"전반적으로","reason":"동의어 — 전체적으로"},{"w":"on the whole","ko":"대체로","reason":"유의어 — 종합하면"},{"w":"in general","ko":"일반적으로","reason":"유의어 — 보통"}],"collocBest":[{"en":"All in all, a good year","ko":"대체로 좋은 한 해"},{"en":"All in all, it went well","ko":"대체로 잘 진행됐다"}]},"nuance":{"koSimple":"전체적으로 볼 때 대체로 그러함","whenToUse":"장단점을 종합해 결론 낼 때 사용"},"krDetail":[{"ko":"대체로","explain":"이것저것 따져 보면"}],"usageExamples":[{"en":"All in all, it was a productive meeting despite the slow start.","ko":"대체로, 시작은 더뎠지만 그것은 생산적인 회의였다."},{"en":"The trip had a few problems, but all in all we enjoyed it.","ko":"그 여행에는 몇 가지 문제가 있었지만, 대체로 우리는 즐거웠다."}],"grammarNote":"여러 사항을 종합해 결론을 내릴 때 쓰는 부사구로, 보통 문장 맨 앞에 놓고 콤마를 찍는다. overall, on the whole과 바꿔 쓸 수 있다.","grammarQuiz":[{"sentence":"_____, the reform is regarded as a success by most public health experts.","ko":"대체로, 그 개혁은 대부분의 공중 보건 전문가들에 의해 성공으로 여겨진다.","answer":"All in all","hint":"문두 부사구 + 수동태(be regarded as)"}]},
    {"id":"v08521","w":"assent","pos":["phrase"],"ph":"/əˈsent/","cefr":"B2","kr":["동의하다, 찬성하다","찬성","승인"],"ex":[{"en":"The board members finally gave their assent to the controversial merger proposal.","ko":"이사회 구성원들은 마침내 그 논란이 많은 합병 제안에 동의했다."}],"mnemonic":{"soundHint":"어센트 → 'a-sent(보낸)' 동의의 신호","story":"'yes'라고 sent(보낸) 답 = assent(동의).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"agree","ko":"동의하다","reason":"동의어 — 찬성"},{"w":"approval","ko":"승인","reason":"유의어 — 허락"},{"w":"dissent","ko":"반대","reason":"반의어 — 이의"}],"collocBest":[{"en":"give one's assent","ko":"동의하다, 승인하다"},{"en":"nod in assent","ko":"동의하며 고개를 끄덕이다"}]},"nuance":{"koSimple":"제안이나 결정을 공식적으로 받아들여 찬성한다는 뜻이에요","whenToUse":"이사회·정부 승인처럼 격식 있는 자리에서 찬성할 때 써요"},"krDetail":[{"ko":"동의하다, 찬성하다","explain":"좋다고 뜻을 같이하다"},{"ko":"찬성","explain":"좋다고 하는 것"},{"ko":"승인","explain":"허락해 주는 것"}],"usageExamples":[{"en":"The minister refused to assent to the new building plan.","ko":"그 장관은 새 건축 계획에 동의하기를 거부했다."},{"en":"Parliament finally gave its assent to the long-debated law.","ko":"의회는 오랫동안 논의된 그 법안에 마침내 승인을 내렸다."}],"grammarNote":"동사일 때는 assent to something(~에 동의하다) 형태로 쓰고, 명사일 때는 give one's assent(승인하다)로 쓴다. 격식체 표현이며 발음이 비슷한 ascent(상승)와 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"The board members _____ given their assent to the controversial merger proposal.","ko":"이사회 구성원들은 논란이 많은 합병 제안에 동의를 표해 왔다.","answer":"have","hint":"현재완료(have p.p.) 조동사"}]},
    {"id":"n07887","w":"advantageous","pos":["adjective"],"ph":"/ˌædvənˈteɪdʒəs/","cefr":"B2","kr":["유리한","이로운"],"ex":[{"en":"Signing the agreement early proved highly advantageous to both companies.","ko":"그 협정에 일찍 서명한 것은 두 회사 모두에게 매우 유리한 것으로 드러났다."}],"mnemonic":{"soundHint":"어드밴테이저스! 유리한 위치","story":"advantage(이점)+ous, 유리한","hintConfidence":3},"pairs":{"buddyWords":[{"w":"beneficial","ko":"이로운","reason":"동의어 — 도움이 됨"},{"w":"favorable","ko":"유리한","reason":"동의어 — 형편이 좋음"},{"w":"disadvantageous","ko":"불리한","reason":"반의어 — 정반대"}],"collocBest":[{"en":"advantageous position","ko":"유리한 위치"},{"en":"mutually advantageous","ko":"상호 이로운"}]},"nuance":{"koSimple":"이익이 되고 유리하게 작용한다는 뜻이야","whenToUse":"협상, 조건, 전략을 긍정적으로 평가할 때 써"},"krDetail":[{"ko":"유리한","explain":"이득이 되어 좋은"},{"ko":"이로운","explain":"도움이 되고 좋은"}],"usageExamples":[{"en":"The new trade policy is advantageous to small businesses.","ko":"새 무역 정책은 소규모 사업체에 유리하다."},{"en":"Learning a second language can be advantageous for your career.","ko":"제2외국어를 배우는 것은 당신의 경력에 이로울 수 있다."}],"grammarNote":"명사 advantage의 형용사형으로 'advantageous to/for ~' 형태로 '~에게 유리한'을 뜻하며, 발음 강세는 -tage-에 있다.","grammarQuiz":[{"sentence":"Living near the office is _____ because it saves commuting time.","ko":"사무실 근처에 사는 것은 통근 시간을 절약하므로 유리하다.","answer":"advantageous","hint":"be동사 + _____ — 보어 형용사"}]},
    {"id":"n08116","w":"guidance","pos":["noun"],"ph":"/ˈɡaɪdəns/","cefr":"B2","kr":["안내","지도"],"ex":[{"en":"Students often seek guidance from teachers when choosing a career.","ko":"학생들은 진로를 선택할 때 흔히 교사들에게 지도를 구한다."}],"mnemonic":{"soundHint":"가이던스","story":"'가이던스' - 길잡이가 되어 준다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"direction","ko":"지시","reason":"동의어 — 방향 알려줌"},{"w":"counsel","ko":"조언","reason":"동의어 — 이끌어 줌"},{"w":"misdirection","ko":"잘못된 인도","reason":"반의어 — 엉뚱한 길"}],"collocBest":[{"en":"seek guidance","ko":"지도를 구하다"},{"en":"provide guidance","ko":"안내를 제공하다"}]},"nuance":{"koSimple":"방향을 제시해 주는 조언·지원, 지도·안내","whenToUse":"상담·진로 지도나 도움 안내를 설명할 때 사용"},"krDetail":[{"ko":"안내","explain":"길이나 방법을 알려줌"},{"ko":"지도","explain":"이끌어 가르침"}],"usageExamples":[{"en":"Under the guidance of her mentor, she developed her writing skills.","ko":"멘토의 지도 아래 그녀는 글쓰기 실력을 키웠다."},{"en":"The manual offers clear guidance on how to use the machine.","ko":"그 설명서는 기계 사용법에 대한 명확한 안내를 제공한다."}],"grammarNote":"불가산명사이므로 a guidance나 guidances로 쓰지 않으며, 'under the guidance of ~(~의 지도 아래)' 형태로 자주 쓴다.","grammarQuiz":[{"sentence":"Students need proper _____ when choosing their future careers.","ko":"학생들은 미래 직업을 선택할 때 적절한 지도가 필요하다.","answer":"guidance","hint":"형용사 + 불가산명사 (목적어)"}]},
    {"id":"n08209","w":"cautious","pos":["adjective"],"ph":"/ˈkɔːʃəs/","cefr":"B2","kr":["조심스러운","신중한"],"ex":[{"en":"Investors became more cautious after the sudden market crash.","ko":"투자자들은 갑작스러운 시장 붕괴 이후 더욱 신중해졌다."}],"mnemonic":{"soundHint":"코셔스 → 코(코앞)+셔스(셔! 조용히)","story":"코앞에서 '셔!' 하며 조심시키는, '조심스러운' cautious.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"careful","ko":"조심하는","reason":"유의어 — 주의를 기울임"},{"w":"prudent","ko":"신중한","reason":"유의어 — 앞을 살핌"},{"w":"reckless","ko":"무모한","reason":"반의어 — 함부로 함"}],"collocBest":[{"en":"a cautious approach","ko":"신중한 접근"},{"en":"remain cautious","ko":"신중한 태도를 유지하다"}]},"nuance":{"koSimple":"위험을 피하려 조심스러운 태도를 뜻함","whenToUse":"신중한 결정·행동을 강조할 때"},"krDetail":[{"ko":"조심스러운","explain":"실수 없게 살피는"},{"ko":"신중한","explain":"깊이 생각하고 하는"}],"usageExamples":[{"en":"Be cautious when you cross the busy street late at night.","ko":"밤늦게 번잡한 길을 건널 때는 조심해야 한다."},{"en":"The scientists remained cautious about announcing the results too early.","ko":"과학자들은 결과를 너무 이르게 발표하는 것에 대해 신중한 태도를 유지했다."}],"grammarNote":"cautious는 'be cautious about/of ~' 형태로 '~에 대해 신중한'을 뜻한다. 명사는 caution, 부사는 cautiously이며 반의어는 careless/reckless이다.","grammarQuiz":[{"sentence":"You should be _____ when crossing a busy street.","ko":"바쁜 도로를 건널 때 조심해야 한다.","answer":"cautious","hint":"be + 형용사 (보어 자리)"}]},
    {"id":"n08201","w":"societal","pos":["adjective"],"ph":"/səˈsaɪətl/","cefr":"B2","kr":["사회의","사회적인"],"ex":[{"en":"Climate change is a major societal challenge of our time.","ko":"기후 변화는 우리 시대의 주요한 사회적 과제이다."}],"mnemonic":{"soundHint":"소사이어털 → society(사회) + al(형용사)","story":"society에 -al 붙이면 '사회의, 사회적인' societal.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"social","ko":"사회의","reason":"유의어 — 사회에 관한"},{"w":"communal","ko":"공동의","reason":"유의어 — 공동체의"},{"w":"individual","ko":"개인의","reason":"반의어 — 한 사람의"}],"collocBest":[{"en":"societal change","ko":"사회적 변화"},{"en":"societal norms","ko":"사회적 규범"}]},"nuance":{"koSimple":"사회 전반과 관련된 사회적 성격을 뜻함","whenToUse":"사회 구조·규범·문제를 논할 때"},"krDetail":[{"ko":"사회의","explain":"사람들이 모인 집단의"},{"ko":"사회적인","explain":"여러 사람과 관련된"}],"usageExamples":[{"en":"Rapid technological change brings both societal benefits and risks.","ko":"급격한 기술 변화는 사회적 이익과 위험을 모두 가져온다."},{"en":"Poverty and inequality are deep societal problems that require long-term solutions.","ko":"빈곤과 불평등은 장기적인 해결책이 필요한 깊은 사회적 문제이다."}],"grammarNote":"societal은 명사 society에서 파생된 형용사로 '사회 전체와 관련된'이라는 뜻이며 주로 명사를 수식한다. 개인 간 관계를 뜻하는 social과 구별해서 쓴다.","grammarQuiz":[{"sentence":"Climate change has become a major _____ concern in recent years.","ko":"기후 변화는 최근 몇 년간 주요 사회적 관심사가 되었다.","answer":"societal","hint":"형용사 + 명사 수식 구조"}]},
    {"id":"n08167","w":"speciation","pos":["noun"],"ph":"/ˌspiːʃiˈeɪʃən/","cefr":"B2","kr":["종 분화","종의 형성"],"ex":[{"en":"Isolation on islands can lead to rapid speciation over time.","ko":"섬에서의 고립은 시간이 지남에 따라 빠른 종 분화로 이어질 수 있다."}],"mnemonic":{"soundHint":"스피시에이션","story":"'스피시에이션' - 새로운 종이 갈라져 나온다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"divergence","ko":"분화","reason":"동의어 — 갈라짐"},{"w":"evolution","ko":"진화","reason":"관련어 — 생물 변화"},{"w":"extinction","ko":"멸종","reason":"대조 — 종이 사라짐"}],"collocBest":[{"en":"the process of speciation","ko":"종 분화 과정"},{"en":"rapid speciation","ko":"빠른 종의 형성"}]},"nuance":{"koSimple":"새로운 생물 종이 생겨나는 진화 과정, 종 분화","whenToUse":"진화 생물학이나 종 다양성을 설명할 때 사용"},"krDetail":[{"ko":"종 분화","explain":"새 생물 종이 갈라져 나옴"},{"ko":"종의 형성","explain":"새로운 종이 생겨남"}],"usageExamples":[{"en":"Geographic barriers often drive speciation by separating populations of the same species.","ko":"지리적 장벽은 같은 종의 개체군을 분리시킴으로써 종 분화를 촉진하는 경우가 많다."},{"en":"Biologists study how quickly speciation occurs in different environments.","ko":"생물학자들은 서로 다른 환경에서 종 분화가 얼마나 빠르게 일어나는지를 연구한다."}],"grammarNote":"speciation은 생물학 용어로 쓰이는 불가산명사이며 관사 없이 쓰는 경우가 많다. 동사 speciate, 명사 species(종)와 어원을 공유한다.","grammarQuiz":[{"sentence":"Geographic isolation is one of the key factors that drive _____.","ko":"지리적 격리는 종 분화를 이끄는 핵심 요인 중 하나이다.","answer":"speciation","hint":"동사 + 명사 (목적어 자리)"}]},
    {"id":"n07997","w":"intervals","pos":["noun"],"ph":"/ˈɪntərvəlz/","cefr":"B2","kr":["간격","사이","휴식 시간"],"ex":[{"en":"The nurse checked the patient's temperature at regular intervals.","ko":"간호사는 일정한 간격으로 환자의 체온을 확인했다."}],"mnemonic":{"soundHint":"인터벌스! 짬짬이 쉬는 시간","story":"inter(사이)+val, 간격들","hintConfidence":3},"pairs":{"buddyWords":[{"w":"gaps","ko":"틈","reason":"동의어 — 벌어진 사이"},{"w":"pauses","ko":"멈춤","reason":"관련어 — 잠깐 쉼"},{"w":"continuity","ko":"연속성","reason":"대조 — 끊김 없음"}],"collocBest":[{"en":"at regular intervals","ko":"일정한 간격으로"},{"en":"short intervals","ko":"짧은 간격"}]},"nuance":{"koSimple":"일정한 간격이나 사이 시간을 가리키는 말이야","whenToUse":"운동 세트, 시간 배분, 측정 주기를 말할 때 써"},"krDetail":[{"ko":"간격","explain":"떨어진 거리나 시간"},{"ko":"사이","explain":"둘 중간의 틈"},{"ko":"휴식 시간","explain":"잠깐 쉬는 때"}],"usageExamples":[{"en":"The buses run at ten-minute intervals during rush hour.","ko":"출퇴근 시간에는 버스가 10분 간격으로 운행한다."},{"en":"Street lamps were placed at regular intervals along the road.","ko":"가로등이 길을 따라 일정한 간격으로 설치되어 있었다."}],"grammarNote":"주로 'at ... intervals(일정 간격으로)' 형태의 전치사구로 쓰이며, 시간과 공간의 간격을 모두 나타낸다.","grammarQuiz":[{"sentence":"The bus arrives at regular _____ of fifteen minutes.","ko":"버스는 15분의 규칙적인 간격으로 도착한다.","answer":"intervals","hint":"형용사(regular) + _____ + of — 복수 명사"}]},
    {"id":"u08313","w":"detest","pos":["verb"],"ph":"/dɪˈtest/","cefr":"B2","kr":["혐오하다"],"ex":[{"en":"Many voters detest the negative campaign ads that dominate every recent election cycle.","ko":"많은 유권자는 최근 모든 선거 주기를 지배하는 부정적 선거 광고를 혐오한다."}],"mnemonic":{"soundHint":"디테스트 → de(강하게)+test(시험)","story":"test(시험)에 강한 반감이 들 만큼 '몹시 혐오하다' detest.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"loathe","ko":"몹시 싫어하다","reason":"유의어 — 아주 싫음"},{"w":"abhor","ko":"질색하다","reason":"유의어 — 진저리 냄"},{"w":"adore","ko":"아주 좋아하다","reason":"반의어 — 매우 좋아함"}],"collocBest":[{"en":"detest violence","ko":"폭력을 혐오하다"},{"en":"detest being lied to","ko":"거짓말당하는 것을 몹시 싫어하다"}]},"nuance":{"koSimple":"강한 반감으로 몹시 싫어하는 감정","whenToUse":"혐오·강한 거부감을 표현할 때"},"krDetail":[{"ko":"혐오하다","explain":"몹시 싫어하다"}],"usageExamples":[{"en":"I detest waiting in long lines at the bank every month.","ko":"나는 매달 은행에서 긴 줄을 서서 기다리는 것을 몹시 싫어한다."},{"en":"Many people detest the smell of stale cigarette smoke.","ko":"많은 사람들이 퀴퀴한 담배 연기 냄새를 혐오한다."}],"grammarNote":"detest는 '몹시 싫어하다'를 뜻하는 타동사로 hate보다 강한 표현이다. 뒤에 동명사(detest -ing)를 목적어로 취하며 to부정사는 잘 쓰지 않는다.","grammarQuiz":[{"sentence":"She found the sarcastic humor _____ be quite offensive and immediately detested every joke.","ko":"그녀는 그 비꼬는 유머가 상당히 모욕적이라고 여기며 곧 모든 농담을 혐오했다.","answer":"to","hint":"5형식 find + O + to be"}]},
    {"id":"u08403","w":"preoccupation","pos":["noun"],"ph":"/priˌɑːkjəˈpeɪʃən/","cefr":"B2","kr":["몰두, 집착"],"ex":[{"en":"Her preoccupation with social media approval began to affect her academic performance and friendships.","ko":"소셜 미디어의 인정에 대한 그녀의 몰두는 학업 성취와 교우 관계에 영향을 미치기 시작했다."}],"mnemonic":{"soundHint":"프리아큐페이션 → pre(먼저)+occupation(점령)","story":"마음을 먼저(pre) 점령(occupation)당한 상태, '몰두, 집착' preoccupation.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"obsession","ko":"강박","reason":"유의어 — 벗어나지 못함"},{"w":"fixation","ko":"고착","reason":"유의어 — 한 곳에 매임"},{"w":"indifference","ko":"무관심","reason":"반의어 — 관심 없음"}],"collocBest":[{"en":"a preoccupation with money","ko":"돈에 대한 집착"},{"en":"the main preoccupation","ko":"주된 관심사"}]},"nuance":{"koSimple":"한 가지에 지나치게 몰두하는 상태","whenToUse":"강박적 관심·집착을 지적할 때"},"krDetail":[{"ko":"몰두, 집착","explain":"한 가지에만 빠짐"}],"usageExamples":[{"en":"His constant preoccupation with money left little room for family life.","ko":"돈에 대한 그의 끊임없는 집착은 가정생활에 거의 여지를 남기지 않았다."},{"en":"There was a growing preoccupation with safety after the recent accident.","ko":"최근 사고 이후 안전에 대한 몰두가 점점 커졌다."}],"grammarNote":"preoccupation with something 형태로 '~에 대한 몰두·집착'을 나타낸다. 동사 preoccupy, 형용사 preoccupied(~에 몰두한)와 함께 묶어 익히면 좋다.","grammarQuiz":[{"sentence":"It was her constant preoccupation with grades _____ eventually caused her serious burnout.","ko":"결국 그녀의 심각한 번아웃을 야기한 것은 성적에 대한 끊임없는 몰두였다.","answer":"that","hint":"It ~ that 강조구문"}]},
    {"id":"v08593","w":"cut off","pos":["phrase"],"ph":"/kʌt/","cefr":"B2","kr":["~을 잘라 내다","~을 차단하다, ~을 가로막다"],"ex":[{"en":"Rebels cut off the main highway to prevent government forces from reaching the capital.","ko":"반군은 정부군이 수도에 도달하는 것을 막기 위해 주요 고속도로를 차단했다."}],"mnemonic":{"soundHint":"컷 오프 → 'cut(자르다) + off(떨어져)'","story":"cut(잘라) off(떨어뜨려) 흐름을 차단하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"sever","ko":"자르다","reason":"동의어 — 끊다"},{"w":"block","ko":"막다","reason":"유의어 — 차단하다"},{"w":"connect","ko":"연결하다","reason":"반의어 — 잇다"}],"collocBest":[{"en":"cut off the supply","ko":"공급을 차단하다"},{"en":"get cut off","ko":"(통화가) 끊기다, 고립되다"}]},"nuance":{"koSimple":"이어져 있던 것을 잘라 흐름이나 연결을 완전히 끊는다는 뜻이에요","whenToUse":"전기·통신·도로·관계 등이 단절될 때 두루 써요"},"krDetail":[{"ko":"~을 잘라 내다","explain":"베어서 떼어 내다"},{"ko":"~을 차단하다, ~을 가로막다","explain":"흐름을 끊어 막다"}],"usageExamples":[{"en":"The storm cut off electricity to the entire coastal region.","ko":"폭풍이 해안 지역 전체의 전기를 끊어 놓았다."},{"en":"He was cut off in the middle of his sentence by loud applause.","ko":"그는 문장 중간에 우렁찬 박수 소리에 말이 끊겼다."}],"grammarNote":"타동사구로 목적어가 대명사이면 반드시 'cut it off'처럼 사이에 넣는다. '(공급·통신을) 차단하다', '(말을) 끊다', '고립시키다' 등 문맥에 따라 뜻이 다양하다.","grammarQuiz":[{"sentence":"The main highway _____ cut off by rebels to prevent government forces from advancing.","ko":"주요 고속도로는 정부군이 진격하는 것을 막기 위해 반군에 의해 차단되었다.","answer":"was","hint":"수동태(be + p.p.) 과거형"}]},

    {"id":"u08278","w":"collide","pos":["verb"],"ph":"/kəˈlaɪd/","cefr":"B2","kr":["충돌하다"],"ex":[{"en":"Two subatomic particles collide at nearly the speed of light inside the accelerator.","ko":"두 아원자 입자가 가속기 안에서 거의 빛의 속도로 충돌한다."}],"mnemonic":{"soundHint":"컬라이드 → 컬(coll, 함께)+라이드(ride, 타다)","story":"함께(coll) 달리다(라이드) 부딪히다, '충돌하다' collide.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"crash","ko":"충돌하다","reason":"유의어 — 세게 부딪힘"},{"w":"clash","ko":"맞부딪치다","reason":"유의어 — 서로 부딪힘"},{"w":"avoid","ko":"피하다","reason":"반의어 — 부딪히지 않음"}],"collocBest":[{"en":"collide with a truck","ko":"트럭과 충돌하다"},{"en":"two cars collided","ko":"차 두 대가 충돌했다"}]},"nuance":{"koSimple":"물체나 의견이 세게 부딪히는 상황","whenToUse":"차량 충돌이나 견해 충돌을 말할 때"},"krDetail":[{"ko":"충돌하다","explain":"서로 세게 부딪히다"}],"usageExamples":[{"en":"Be careful not to collide with other skaters on the crowded ice rink.","ko":"붐비는 빙상장에서 다른 스케이터들과 충돌하지 않도록 조심해라."},{"en":"Their opinions often collide during heated team meetings.","ko":"그들의 의견은 열띤 팀 회의 중에 자주 충돌한다."}],"grammarNote":"collide는 자동사로 'collide with ~'(~와 충돌하다) 형태로 쓰며, 두 대상이 부딪칠 때는 주어를 복수로 하여 collide만으로도 쓴다. 명사는 collision이다.","grammarQuiz":[{"sentence":"If the two cars had collided at that busy intersection, the damage _____ have been enormous.","ko":"두 차가 그 붐비는 교차로에서 충돌했다면, 피해는 엄청났을 것이다.","answer":"would","hint":"가정법 과거완료 (would have + p.p.)"}]},

    {"id":"u08288","w":"Confucian","pos":["adj"],"ph":"/kənˈfjuːʃən/","cefr":"B2","kr":["유교의"],"ex":[{"en":"Confucian values continue to influence family relationships and education throughout East Asia today.","ko":"유교의 가치는 오늘날 동아시아 전역의 가족 관계와 교육에 계속 영향을 미친다."}],"mnemonic":{"soundHint":"컨퓨션 → Confucius(공자) + an","story":"공자(Confucius)의 가르침, '유교의' Confucian.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"Confucius","ko":"공자","reason":"관련어 — 유교 창시자"},{"w":"Eastern","ko":"동양의","reason":"관련어 — 동양 사상"},{"w":"philosophy","ko":"철학","reason":"관련어 — 사상 갈래"}],"collocBest":[{"en":"Confucian values","ko":"유교적 가치관"},{"en":"Confucian tradition","ko":"유교 전통"}]},"nuance":{"koSimple":"공자의 사상과 유교 전통에 관한 것","whenToUse":"동아시아 사상·문화 논의에 사용"},"krDetail":[{"ko":"유교의","explain":"공자 가르침에 관한"}],"usageExamples":[{"en":"Confucian teachings emphasize respect for one's parents and elders.","ko":"유교의 가르침은 부모와 웃어른에 대한 공경을 강조한다."},{"en":"The scholar wrote a famous book on Confucian philosophy.","ko":"그 학자는 유교 철학에 관한 유명한 책을 썼다."}],"grammarNote":"Confucian은 고유형용사로 항상 대문자로 시작하며 명사를 수식한다(Confucian values/tradition). 창시자 Confucius(공자), 사상 Confucianism(유교)과 관련된다.","grammarQuiz":[{"sentence":"Confucian teachings have long _____ respected across many East Asian societies.","ko":"유교 가르침은 여러 동아시아 사회에서 오랫동안 존경받아 왔다.","answer":"been","hint":"현재완료 수동태 (have been + p.p.)"}]},
    {"id":"u08358","w":"immigrate","pos":["verb"],"ph":"/ˈɪmɪɡreɪt/","cefr":"B2","kr":["이주하다"],"ex":[{"en":"Her grandparents immigrated to America seeking better educational opportunities for their large family.","ko":"그녀의 조부모는 대가족을 위한 더 나은 교육 기회를 찾아 미국으로 이주했다."}],"mnemonic":{"soundHint":"이미그레이트 → im(안으로)+migrate(이주)","story":"안으로(im) migrate(이주)해오다, 즉 '이주해 오다' immigrate.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"migrate","ko":"이동하다","reason":"유의어 — 옮겨감"},{"w":"relocate","ko":"이전하다","reason":"유의어 — 자리를 옮김"},{"w":"emigrate","ko":"이민 나가다","reason":"반의어 — 밖으로 떠남"}],"collocBest":[{"en":"immigrate to the US","ko":"미국으로 이주하다"},{"en":"immigrate from Korea","ko":"한국에서 이주해 오다"}]},"nuance":{"koSimple":"영주 목적으로 다른 나라에 들어감","whenToUse":"타국 정착·이민 오는 상황 서술"},"krDetail":[{"ko":"이주하다","explain":"딴 나라로 옮겨 살다"}],"usageExamples":[{"en":"Thousands of workers immigrate to the city every year in search of jobs.","ko":"매년 수천 명의 노동자가 일자리를 찾아 그 도시로 이주해 온다."},{"en":"Many people immigrate to Canada hoping for a better life.","ko":"많은 사람들이 더 나은 삶을 바라며 캐나다로 이주한다."}],"grammarNote":"immigrate는 '(다른 나라로) 이주해 들어오다'를 뜻하며 'immigrate to + 장소'로 쓴다. '나가다'를 뜻하는 emigrate(emigrate from)와 방향이 반대이므로 구별한다.","grammarQuiz":[{"sentence":"Many hopeful families _____ immigrated to this country in search of a better daily life.","ko":"많은 희망에 찬 가족들이 더 나은 일상을 찾아 이 나라로 이주해 왔다.","answer":"have","hint":"현재완료 (have + p.p.)"}]},
    {"id":"u08448","w":"shuffle","pos":["verb"],"ph":"/ˈʃʌfəl/","cefr":"B2","kr":["질질 끌며 걷다, 뒤섞다"],"ex":[{"en":"The exhausted patient shuffled slowly down the long hospital corridor toward the exit.","ko":"지친 환자는 출구를 향해 긴 병원 복도를 천천히 발을 끌며 걸어갔다."}],"mnemonic":{"soundHint":"셔플 → 카드 셔플, 셔플 댄스","story":"카드를 셔플하듯 발을 뒤섞으며 '질질 끌며 걷다, 뒤섞다' shuffle.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"mix","ko":"섞다","reason":"동의어 — 뒤섞다"},{"w":"drag","ko":"끌다","reason":"유의어 — 발을 끌다"},{"w":"sort","ko":"분류하다","reason":"반의어 — 정렬하다"}],"collocBest":[{"en":"shuffle the cards","ko":"카드를 섞다"},{"en":"shuffle your feet","ko":"발을 질질 끌며 걷다"}]},"nuance":{"koSimple":"발을 질질 끌거나 순서를 뒤섞음","whenToUse":"지친 걸음, 카드·목록 뒤섞기 표현"},"krDetail":[{"ko":"질질 끌며 걷다, 뒤섞다","explain":"발 끌며 걷거나 마구 섞다"}],"usageExamples":[{"en":"The old man shuffled across the room in his worn slippers.","ko":"그 노인은 닳은 슬리퍼를 신고 발을 질질 끌며 방을 가로질렀다."},{"en":"Please shuffle the cards well before you deal them out.","ko":"카드를 나눠 주기 전에 잘 섞어 주세요."}],"grammarNote":"'발을 질질 끌며 걷다'와 '카드 등을 뒤섞다'라는 두 가지 뜻을 가진 동사로, 음악의 '무작위 재생(셔플)' 의미로도 쓴다. 철자가 비슷한 shovel(삽)과 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"_____ slowly through the crowded corridor, he searched for the emergency exit sign.","ko":"혼잡한 복도를 천천히 발을 끌며 걸으면서, 그는 비상 출구 표지를 찾았다.","answer":"Shuffling","hint":"분사구문 (능동)"}]},
    {"id":"v08590","w":"contrive","pos":["verb"],"ph":"/kənˈtraɪv/","cefr":"B2","kr":["고안하다"],"ex":[{"en":"Engineers contrived a clever system to filter drinking water using only local materials.","ko":"엔지니어들은 현지 재료만을 사용하여 식수를 여과하는 영리한 시스템을 고안했다."}],"mnemonic":{"soundHint":"컨트라이브 → 'con(함께) + trive(try)'","story":"다 함께 try(궁리)해서 새 방법을 고안하다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"devise","ko":"궁리하다","reason":"동의어 — 짜내다"},{"w":"invent","ko":"발명하다","reason":"유의어 — 만들어냄"},{"w":"imitate","ko":"모방하다","reason":"반의어 — 따라함"}],"collocBest":[{"en":"contrive a plan","ko":"계획을 고안하다"},{"en":"contrive a way to escape","ko":"탈출할 방법을 궁리하다"}]},"nuance":{"koSimple":"궁리를 거듭해 새로운 방법이나 장치를 만들어낸다는 뜻이에요","whenToUse":"창의적 해법이나 기발한 발명을 설명할 때 자주 써요"},"krDetail":[{"ko":"고안하다","explain":"머리 써서 새로 생각해내다"}],"usageExamples":[{"en":"The prisoners contrived an ingenious plan to escape unnoticed.","ko":"죄수들은 들키지 않고 탈출할 기발한 계획을 고안했다."},{"en":"Somehow she contrived to finish the project despite the tight deadline.","ko":"빠듯한 마감에도 그녀는 어떻게든 그 프로젝트를 끝내는 데 성공했다."}],"grammarNote":"'(장치·계획을) 고안하다'라는 뜻 외에, 'contrive to do' 형태로 '(어려움에도) 용케 ~해내다'라는 뜻으로도 쓴다. 형용사 'contrived'는 '부자연스러운, 억지스러운'을 뜻한다.","grammarQuiz":[{"sentence":"Engineers contrived _____ filter drinking water using only locally available materials.","ko":"엔지니어들은 현지에서 구할 수 있는 재료만으로 식수를 여과할 방법을 고안했다.","answer":"to","hint":"contrive + to부정사"}]},
    {"id":"u08363","w":"insure","pos":["verb"],"ph":"/ɪnˈʃʊr/","cefr":"B2","kr":["보험을 계약하다"],"ex":[{"en":"Many drivers insure their vehicles against theft, accidents, and unpredictable natural disasters annually.","ko":"많은 운전자가 매년 도난, 사고, 예측 불가능한 자연재해에 대비해 차량 보험을 가입한다."}],"mnemonic":{"soundHint":"인슈어 → in(안)+sure(확실히)","story":"안(in)을 확실히(sure) 지키기 위해 '보험을 계약하다' insure.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"ensure","ko":"보장하다","reason":"관련어 — 확실히 함"},{"w":"guarantee","ko":"보증하다","reason":"유의어 — 책임지고 약속"},{"w":"protect","ko":"보호하다","reason":"유의어 — 지켜줌"}],"collocBest":[{"en":"insure your car","ko":"자동차 보험에 들다"},{"en":"insure against loss","ko":"손실에 대비해 보험에 들다"}]},"nuance":{"koSimple":"보험에 가입해 위험에 대비함","whenToUse":"차량·건강·재산 보험 계약 상황"},"krDetail":[{"ko":"보험을 계약하다","explain":"보험에 들다"}],"usageExamples":[{"en":"You must insure the shipment before it leaves the warehouse.","ko":"그 화물이 창고를 떠나기 전에 반드시 보험에 들어야 한다."},{"en":"The company decided to insure all of its employees against workplace injuries.","ko":"그 회사는 전 직원을 산업 재해에 대비해 보험에 가입하기로 결정했다."}],"grammarNote":"insure A against B 형태로 'A를 B에 대비해 보험 들다'라는 뜻으로 쓴다. 철자·발음이 비슷한 ensure(반드시 ~하게 하다), assure(안심시키다)와 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"All company vehicles must be fully _____ against theft and accidental damage each year.","ko":"모든 회사 차량은 매년 도난 및 우발적 손상에 대해 완전히 보험에 가입되어야 한다.","answer":"insured","hint":"조동사 수동태 (must be + p.p.)"}]},
    {"id":"n08074","w":"revolutionary","pos":["adjective","noun"],"ph":"/ˌrevəˈluːʃəneri/","cefr":"B2","kr":["혁명적인","획기적인"],"ex":[{"en":"The smartphone was a revolutionary invention that changed daily life.","ko":"스마트폰은 일상생활을 바꾼 혁명적인 발명품이었다."}],"mnemonic":{"soundHint":"레볼루셔너리! 세상을 확 뒤집어","story":"revolution(혁명)+ary, 혁명적인","hintConfidence":3},"pairs":{"buddyWords":[{"w":"radical","ko":"급진적인","reason":"동의어 — 근본을 바꿈"},{"w":"groundbreaking","ko":"획기적인","reason":"동의어 — 새 길을 엶"},{"w":"conventional","ko":"전통적인","reason":"반의어 — 기존 방식"}],"collocBest":[{"en":"a revolutionary idea","ko":"혁명적인 생각"},{"en":"a revolutionary change","ko":"획기적인 변화"}]},"nuance":{"koSimple":"판을 뒤엎을 만큼 혁신적이고 새롭다는 뜻이야","whenToUse":"기술, 이념, 예술의 획기적 변화를 강조할 때 써"},"krDetail":[{"ko":"혁명적인","explain":"판을 완전히 뒤바꾸는"},{"ko":"획기적인","explain":"이전에 없던 새로운"}],"usageExamples":[{"en":"The scientist developed a revolutionary method for treating cancer.","ko":"그 과학자는 암을 치료하는 혁명적인 방법을 개발했다."},{"en":"The young revolutionary dreamed of building a fairer society.","ko":"그 젊은 혁명가는 더 공정한 사회를 건설하기를 꿈꿨다."}],"grammarNote":"형용사로 '혁명적인·획기적인'을, 명사로 '혁명가'를 뜻하는 양용어로, 명사 revolution에서 파생됐다.","grammarQuiz":[{"sentence":"This _____ technology will change the way we communicate.","ko":"이 혁명적인 기술은 우리가 소통하는 방식을 바꿀 것이다.","answer":"revolutionary","hint":"형용사 + 명사 수식"}]},
    {"id":"n08218","w":"clinical","pos":["adjective"],"ph":"/ˈklɪnɪkəl/","cefr":"B2","kr":["임상의","냉정한"],"ex":[{"en":"The new drug showed promising results in clinical trials.","ko":"그 신약은 임상 시험에서 유망한 결과를 보였다."}],"mnemonic":{"soundHint":"클리니컬 → 클리닉(clinic) + al","story":"clinic(진료소)에 -al 붙여 '임상의, 진료의' clinical.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"medical","ko":"의료의","reason":"유의어 — 치료에 관한"},{"w":"detached","ko":"초연한","reason":"유의어 — 감정을 뺀"},{"w":"emotional","ko":"감정적인","reason":"반의어 — 감정이 앞선"}],"collocBest":[{"en":"clinical trials","ko":"임상 시험"},{"en":"clinical experience","ko":"임상 경험"}]},"nuance":{"koSimple":"임상적이거나 감정 없이 냉정한 성격","whenToUse":"의료 임상 상황이나 무감정한 태도 서술"},"krDetail":[{"ko":"임상의","explain":"환자를 직접 다루는"},{"ko":"냉정한","explain":"감정 없이 차분한"}],"usageExamples":[{"en":"The medicine must pass several clinical trials before it can be approved.","ko":"그 약은 승인되기 전에 여러 차례의 임상 시험을 통과해야 한다."},{"en":"He described the accident in a cold, clinical tone that unsettled everyone.","ko":"그는 그 사고를 차갑고 냉정한 어조로 묘사해 모두를 불안하게 했다."}],"grammarNote":"clinical은 '임상의'(clinical trial/study)라는 의학적 의미와 '감정 없이 냉정한'이라는 비유적 의미를 모두 갖는다. 명사는 clinic, 부사는 clinically이다.","grammarQuiz":[{"sentence":"The drug must pass _____ trials before it can be sold to the public.","ko":"그 약은 대중에게 판매되기 전에 임상 시험을 통과해야 한다.","answer":"clinical","hint":"형용사 + 명사 수식 구조"}]},
    {"id":"v08542","w":"be accustomed to -ing","pos":["phrase"],"ph":"/əˈkʌstəmd/","cefr":"B2","kr":["~을 하는 것에 익숙하다, ~을 하는 것이 습관이 되다"],"ex":[{"en":"City dwellers are accustomed to hearing constant traffic noise throughout the entire night.","ko":"도시 거주자들은 밤새 끊임없는 교통 소음을 듣는 것에 익숙하다."}],"mnemonic":{"soundHint":"비 어커스텀드 → 'custom(관습)'이 된 상태","story":"custom(관습)이 몸에 배어 익숙해진 상태.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"be used to","ko":"익숙하다","reason":"동의어 — 습관됨"},{"w":"get used to","ko":"익숙해지다","reason":"유의어 — 적응하다"},{"w":"unfamiliar","ko":"낯선","reason":"반의어 — 서툰"}],"collocBest":[{"en":"accustomed to working late","ko":"늦게까지 일하는 데 익숙한"},{"en":"accustomed to living alone","ko":"혼자 사는 데 익숙한"}]},"nuance":{"koSimple":"어떤 행동을 오래 겪어 이제는 자연스럽게 느낀다는 뜻이에요","whenToUse":"습관이 된 일상 활동이나 반복 경험을 설명할 때 써요"},"krDetail":[{"ko":"~을 하는 것에 익숙하다, ~을 하는 것이 습관이 되다","explain":"늘 해서 몸에 밴"}],"usageExamples":[{"en":"Night-shift workers are accustomed to sleeping during the day.","ko":"야간 근무자들은 낮에 자는 것에 익숙하다."},{"en":"She soon became accustomed to living far from her hometown.","ko":"그녀는 곧 고향에서 멀리 떨어져 사는 것에 익숙해졌다."}],"grammarNote":"여기서 to는 부정사가 아닌 전치사라 뒤에 반드시 동명사(-ing)나 명사가 온다. be used to -ing와 같은 의미이며, be accustomed to do처럼 동사원형을 쓰지 않도록 주의한다.","grammarQuiz":[{"sentence":"City dwellers are accustomed to _____ constant traffic noise throughout the night.","ko":"도시 거주자들은 밤새 끊임없는 교통 소음을 듣는 것에 익숙하다.","answer":"hearing","hint":"be accustomed to + 동명사(-ing)"}]},
    {"id":"u08238","w":"archaeology","pos":["noun"],"ph":"/ˌɑːrkiˈɑːlədʒi/","cefr":"B2","kr":["고고학"],"ex":[{"en":"Archaeology helps us understand how ancient civilizations shaped modern culture and technology.","ko":"고고학은 고대 문명이 어떻게 현대 문화와 기술을 형성했는지 이해하도록 돕는다."}],"mnemonic":{"soundHint":"아키올로지 → 아치(archi, 옛)+올로지(학문)","story":"아주 옛(archi) 것을 연구하는 학문(logy), '고고학' archaeology.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"excavation","ko":"발굴","reason":"관련어 — 땅 파 유물 찾기"},{"w":"history","ko":"역사","reason":"유의어 — 과거 연구"},{"w":"artifact","ko":"유물","reason":"관련어 — 옛 물건"}],"collocBest":[{"en":"study archaeology","ko":"고고학을 공부하다"},{"en":"underwater archaeology","ko":"수중 고고학"}]},"nuance":{"koSimple":"유물·유적으로 과거를 연구하는 학문","whenToUse":"고대 문명·발굴 연구를 다룰 때"},"krDetail":[{"ko":"고고학","explain":"옛 유물로 과거 연구"}],"usageExamples":[{"en":"She studied archaeology because she loved uncovering ancient artifacts.","ko":"그녀는 고대 유물을 발굴하는 것을 좋아해서 고고학을 전공했다."},{"en":"Modern archaeology relies heavily on advanced scanning technology.","ko":"현대 고고학은 첨단 스캐닝 기술에 크게 의존한다."}],"grammarNote":"archaeology는 학문 이름이므로 관사 없이 쓰는 불가산명사이다. 형용사는 archaeological, 학자는 archaeologist이며 미국식 철자는 archeology이다.","grammarQuiz":[{"sentence":"Archaeology is a fascinating field _____ combines history, science, and cultural anthropology.","ko":"고고학은 역사, 과학, 문화 인류학을 결합하는 매혹적인 분야이다.","answer":"which","hint":"관계대명사 which (주격)"}]},
    {"id":"v08500","w":"agonize","pos":["verb"],"ph":"/ˈæɡənaɪz/","cefr":"B2","kr":["몹시 괴로워하다"],"ex":[{"en":"Students often agonize over which university offer they should finally accept.","ko":"학생들은 종종 어떤 대학 합격 통보를 결국 수락할지 몹시 괴로워한다."}],"mnemonic":{"soundHint":"애거나이즈 → agony(고통) + ize","story":"agony(고통) 속에 몸부림치다, '몹시 괴로워하다' agonize.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"suffer","ko":"고통받다","reason":"동의어 — 괴로워하다"},{"w":"struggle","ko":"몸부림치다","reason":"유의어 — 힘들어하다"},{"w":"relax","ko":"편안하다","reason":"반의어 — 마음 편함"}],"collocBest":[{"en":"agonize over a decision","ko":"결정을 두고 몹시 고민하다"},{"en":"agonize over every detail","ko":"모든 세부사항에 애태우다"}]},"nuance":{"koSimple":"괴로운 결정 앞에서 몹시 고민함","whenToUse":"오랜 시간 심각하게 갈등할 때 사용"},"krDetail":[{"ko":"몹시 괴로워하다","explain":"아주 심하게 마음 아파하다"}],"usageExamples":[{"en":"There is no need to agonize over such a small decision.","ko":"그렇게 사소한 결정을 두고 괴로워할 필요는 없다."},{"en":"He agonized for weeks about whether to quit his stable job.","ko":"그는 안정된 직장을 그만둘지 말지를 두고 몇 주 동안 몹시 괴로워했다."}],"grammarNote":"agonize over/about something 형태로 '~을 두고 몹시 고민하다'를 뜻한다. 영국식 철자는 agonise이며, 명사 agony(극심한 고통)와 어원이 같다.","grammarQuiz":[{"sentence":"For many sleepless nights she has _____ over which university offer to accept.","ko":"잠 못 이루는 여러 밤 동안 그녀는 어떤 대학 합격 통보를 받아들일지 몹시 괴로워해 왔다.","answer":"agonized","hint":"현재완료(has p.p.)의 과거분사 자리"}]},
    {"id":"v08491","w":"a dose of","pos":["phrase"],"ph":"/doʊs/","cefr":"B2","kr":["약간의, 일정량의"],"ex":[{"en":"The proposal needs a dose of realism before the committee will even consider it.","ko":"그 제안은 위원회가 검토하기도 전에 약간의 현실성이 필요하다."}],"mnemonic":{"soundHint":"어 도스 오브 → 약 한 회분(dose)","story":"약 한 회분(dose)만큼의 양, '약간의, 일정량의' a dose of.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"a bit of","ko":"약간의","reason":"동의어 — 조금"},{"w":"a measure of","ko":"일정량의","reason":"유의어 — 어느 정도"},{"w":"a lot of","ko":"많은","reason":"반의어 — 다량"}],"collocBest":[{"en":"a dose of medicine","ko":"약 한 회 복용량"},{"en":"a dose of reality","ko":"냉정한 현실 자각"}]},"nuance":{"koSimple":"어떤 성질이 일정량 필요하다는 표현","whenToUse":"현실감·유머 등 약간의 요소가 필요할 때"},"krDetail":[{"ko":"약간의, 일정량의","explain":"정해진 만큼의 양"}],"usageExamples":[{"en":"A healthy dose of skepticism will protect you from online scams.","ko":"적당한 정도의 회의적 태도가 온라인 사기로부터 당신을 지켜 줄 것이다."},{"en":"The comedy delivers its message with a generous dose of humor.","ko":"그 코미디는 넉넉한 유머와 함께 메시지를 전달한다."}],"grammarNote":"원래 약의 '1회 복용량'을 뜻하지만, a dose of + 추상명사 형태로 '어느 정도의 ~'라는 비유적 의미로 자주 쓴다. a healthy/generous/small dose of처럼 형용사를 넣어 양을 조절한다.","grammarQuiz":[{"sentence":"The doctor considered a small dose of medicine _____ be sufficient for the elderly patient.","ko":"의사는 소량의 약이 노인 환자에게 충분하다고 여겼다.","answer":"to","hint":"5형식 consider + O + to be"}]},
    {"id":"u08303","w":"decode","pos":["verb"],"ph":"/diːˈkoʊd/","cefr":"B2","kr":["해독하다"],"ex":[{"en":"Scientists worked for decades to decode the ancient script found on the stone tablet.","ko":"과학자들은 석판에서 발견된 고대 문자를 해독하기 위해 수십 년을 노력했다."}],"mnemonic":{"soundHint":"디코드 → de(반대)+code(암호)","story":"code(암호)를 반대로(de) 풀어내는 것, '해독하다' decode.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"decipher","ko":"판독하다","reason":"유의어 — 뜻을 풀다"},{"w":"interpret","ko":"해석하다","reason":"유의어 — 의미 밝힘"},{"w":"encode","ko":"부호화하다","reason":"반의어 — 암호로 바꿈"}],"collocBest":[{"en":"decode a message","ko":"메시지를 해독하다"},{"en":"decode a secret code","ko":"비밀 암호를 해독하다"}]},"nuance":{"koSimple":"암호나 어려운 정보를 풀어 이해함","whenToUse":"고대 문자·신호·의미를 해석할 때"},"krDetail":[{"ko":"해독하다","explain":"암호 뜻을 풀다"}],"usageExamples":[{"en":"The spy managed to decode the enemy's secret message in time.","ko":"그 첩자는 제때에 적의 비밀 메시지를 해독하는 데 성공했다."},{"en":"Babies gradually learn to decode the sounds of their native language.","ko":"아기들은 모국어의 소리를 점차 해독하는 법을 배운다."}],"grammarNote":"decode는 타동사로 'decode + 목적어'(메시지·신호·암호를 해독하다) 형태로 쓴다. de-(제거)+code(암호)의 구조이며 반의어는 encode이다.","grammarQuiz":[{"sentence":"Skilled cryptographers worked tirelessly _____ decode the enemy's secret wartime messages.","ko":"숙련된 암호 해독가들은 적의 비밀 전시 메시지를 해독하기 위해 지치지 않고 일했다.","answer":"to","hint":"부사적 to부정사 (목적)"}]},
    {"id":"v08584","w":"configuration","pos":["noun"],"ph":"/kənˌfɪɡjəˈreɪʃən/","cefr":"B2","kr":["배열, 배치"],"ex":[{"en":"The configuration of the desks encouraged more group discussion during the lively class.","ko":"책상의 배치는 활기찬 수업 동안 더 많은 그룹 토론을 촉진했다."}],"mnemonic":{"soundHint":"컨피규레이션 → 컴퓨터 'config(설정)'의 정식 이름","story":"컴퓨터 config(설정) 배치 = 배열·배치.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"arrangement","ko":"배열","reason":"동의어 — 늘어놓음"},{"w":"layout","ko":"배치","reason":"유의어 — 짜임새"},{"w":"structure","ko":"구조","reason":"유의어 — 짜임"}],"collocBest":[{"en":"system configuration","ko":"시스템 구성"},{"en":"default configuration","ko":"기본 설정"}]},"nuance":{"koSimple":"여러 요소가 특정한 방식으로 짜여진 구성 형태를 뜻해요","whenToUse":"컴퓨터 설정, 좌석 배치, 부품 조합 등에 폭넓게 써요"},"krDetail":[{"ko":"배열, 배치","explain":"요소들을 늘어놓은 모양"}],"usageExamples":[{"en":"Changing the configuration of the furniture made the room feel larger.","ko":"가구 배치를 바꾸자 방이 더 넓게 느껴졌다."},{"en":"The software allows users to save their preferred configuration.","ko":"그 소프트웨어는 사용자가 선호하는 설정을 저장할 수 있게 해 준다."}],"grammarNote":"물리적 '배열·배치'뿐 아니라 컴퓨터·기기의 '환경 설정'이라는 뜻으로도 자주 쓰인다. 동사형은 'configure'(구성하다, 설정하다)이다.","grammarQuiz":[{"sentence":"The configuration of the desks _____ was chosen encouraged more group discussion.","ko":"선택된 책상의 배치는 더 많은 그룹 토론을 촉진했다.","answer":"that","hint":"사물 선행사 + 주격 관계대명사"}]},

    {"id":"u08398","w":"populate","pos":["verb"],"ph":"/ˈpɑːpjəleɪt/","cefr":"B2","kr":["거주시키다"],"ex":[{"en":"Various species of birds populate the wetlands during their long annual migration south.","ko":"다양한 새 종이 매년 남쪽으로의 긴 이주 기간 동안 습지에 거주한다."}],"mnemonic":{"soundHint":"파퓰레잍 → popular(인기)와 같은 어원 people","story":"people(사람들)이 사는 어원, 사람이 살게 하다 '거주시키다' populate.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"inhabit","ko":"살다","reason":"유의어 — 그곳에 삶"},{"w":"settle","ko":"정착하다","reason":"유의어 — 자리 잡음"},{"w":"abandon","ko":"버리다","reason":"반의어 — 떠나 비움"}],"collocBest":[{"en":"densely populated","ko":"인구가 밀집한"},{"en":"populate the region","ko":"그 지역에 거주하다"}]},"nuance":{"koSimple":"어떤 지역에 거주하며 채워 살아감","whenToUse":"생물·인간이 지역에 분포할 때"},"krDetail":[{"ko":"거주시키다","explain":"사람이 살게 하다"}],"usageExamples":[{"en":"Early settlers began to populate the fertile valley near the river.","ko":"초기 정착민들은 강 근처의 비옥한 계곡에 거주하기 시작했다."},{"en":"Engineers used real data to populate the database with sample records.","ko":"엔지니어들은 실제 데이터를 이용해 데이터베이스를 샘플 기록으로 채웠다."}],"grammarNote":"'~에 거주하다/살게 하다'라는 뜻으로, 흔히 수동태 be populated by/with 형태로 '~로 채워져 있다'로 쓴다. IT 맥락에서는 '데이터를 채워 넣다'라는 의미로도 확장된다.","grammarQuiz":[{"sentence":"The remote northern islands _____ populated by rare species of migratory seabirds each spring.","ko":"그 외딴 북쪽 섬들은 매년 봄 희귀한 이동성 바닷새 종들이 서식한다.","answer":"are","hint":"수동태 (are populated)"}]},
    {"id":"n08205","w":"symbolic","pos":["adjective"],"ph":"/sɪmˈbɑːlɪk/","cefr":"B2","kr":["상징적인","상징하는"],"ex":[{"en":"The white dove is a symbolic image of peace around the world.","ko":"흰 비둘기는 전 세계적으로 평화를 상징하는 이미지이다."}],"mnemonic":{"soundHint":"심볼릭 → 심볼(symbol) + ic","story":"symbol에 -ic을 붙이면 '상징적인' symbolic.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"representative","ko":"대표적인","reason":"유의어 — 대신 나타냄"},{"w":"figurative","ko":"비유적인","reason":"유의어 — 빗대어 표현"},{"w":"literal","ko":"문자 그대로의","reason":"반의어 — 있는 그대로"}],"collocBest":[{"en":"symbolic meaning","ko":"상징적 의미"},{"en":"a symbolic gesture","ko":"상징적인 몸짓"}]},"nuance":{"koSimple":"어떤 것을 상징적으로 나타내는 성격","whenToUse":"의식·행위·물건이 의미를 상징할 때"},"krDetail":[{"ko":"상징적인","explain":"뜻을 대신 나타내는"},{"ko":"상징하는","explain":"다른 뜻을 대신 보여주는"}],"usageExamples":[{"en":"The handshake was a symbolic gesture of peace between the two nations.","ko":"그 악수는 두 나라 사이의 평화를 나타내는 상징적인 몸짓이었다."},{"en":"Her donation was largely symbolic, but it inspired many others to give.","ko":"그녀의 기부는 대체로 상징적인 것이었지만, 많은 사람에게 기부의 영감을 주었다."}],"grammarNote":"symbolic은 'be symbolic of ~' 형태로 '~을 상징하는'이라는 뜻을 나타낸다. 명사는 symbol, 동사는 symbolize, 부사는 symbolically이다.","grammarQuiz":[{"sentence":"The dove is _____ of peace in many cultures around the world.","ko":"비둘기는 세계의 많은 문화에서 평화를 상징한다.","answer":"symbolic","hint":"be symbolic of ~ (~을 상징하는)"}]},

function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const SFX = {
  // jp-pachinko-hit: 1200Hz sine 100ms 빠른 감쇠
  correct(){
    tone({type:"sine", freq:1400, dur:.08, vol:.22, t0:0});
    tone({type:"sine", freq:1800, dur:.06, vol:.16, t0:.04});
  },
  // jp-buzzer: 저음 square 150Hz 250ms
  wrong(){
    tone({type:"square", freq:160, dur:.18, vol:.18, t0:0});
    tone({type:"square", freq:120, dur:.20, vol:.16, t0:.06});
  },
  // jp-slot-jackpot: 도-솔-도-미 차임 4단
  levelUp(){
    const notes = [523.25, 783.99, 1046.50, 1318.51]; // C5 G5 C6 E6
    notes.forEach((f,i)=> tone({type:"sine", freq:f, dur:.22, vol:.22, t0:i*.13}));
    tone({type:"triangle", freq:2093.00, dur:.4, vol:.18, t0:.55}); // 종소리 C7
  },
  // jp-chime-asc: 800→1000→1200 3단
  streak(){
    [880, 1100, 1320].forEach((f,i)=> tone({type:"sine", freq:f, dur:.12, vol:.18, t0:i*.07}));
  },
  // arcade-fireworks: noise 펑 + 떨어지는 sine
  fireworks(){
    noise({dur:.18, vol:.22, t0:0, hp:600});
    for(let i=0;i<6;i++){
      tone({type:"sine", freq:1500-i*180, dur:.10, vol:.10, t0:.05+i*.05});
    }
  },
  // arcade-flip: 화이트 노이즈 30ms
  cardFlip(){
    noise({dur:.04, vol:.10, hp:2000});
  },
  // jp-coin-payout: 2000Hz square 8회 빠르게
  coinDrop(){

      tone({type:"square", freq:1800+Math.random()*600, dur:.04, vol:.10, t0:i*.05});
