<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>G2_L5_further_para2</title>

<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans KR",-apple-system,sans-serif;background:#090d18;color:#e8edf7;min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
.container{max-width:660px;margin:0 auto;min-height:100vh;background:#0e1626;position:relative}
.header{background:linear-gradient(160deg,#0f172a,#1b2438);padding:20px 18px;position:sticky;top:0;z-index:20;border-bottom:1px solid #2a3650}
.header h1{font-size:1.15rem;font-weight:800}
.header p{opacity:.7;font-size:.8rem;margin-top:2px}
.content{padding:16px 16px 70px}
.id-row{display:flex;gap:10px;margin-bottom:16px}
.id-row input{flex:1;min-width:0;padding:12px 14px;border:1.5px solid #2a3650;border-radius:12px;background:#0e1626;color:#e8edf7;font-size:16px;font-family:inherit}
.id-row input:focus{outline:none;border-color:#f59e0b}
.q{background:#141c2e;border:1px solid #2a3650;border-radius:16px;padding:16px;margin-bottom:14px;transition:.2s}
.q.locked{opacity:.5}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qtag{width:28px;height:28px;border-radius:50%;background:#f59e0b;color:#0f172a;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.dir{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px}
.dir.ok{background:rgba(16,185,129,.2);color:#6ee7b7}
.dir.warn{background:rgba(245,158,11,.2);color:#fbbf24}
.qres{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:20px;margin-left:auto}
.qres.ok{background:rgba(16,185,129,.2);color:#6ee7b7}
.qres.no{background:rgba(239,68,68,.2);color:#fca5a5}
.lock-label{font-size:.72rem;color:#7b8aa3;margin-left:auto}
.q-key{font-size:1.05rem;font-weight:800;text-align:center;padding:10px;background:linear-gradient(135deg,rgba(59,130,246,.16),rgba(99,102,241,.16));border-radius:12px;margin-bottom:8px}
.q-text{font-weight:600;font-size:.95rem;margin-bottom:10px;color:#cdd6e6}
.q-text .hl{color:#fbbf24;font-weight:800}
.pg-btn{background:#1b2438;border:1px solid #2a3650;color:#aeb9cc;border-radius:10px;padding:6px 12px;font-size:.8rem;cursor:pointer;margin-bottom:8px;font-family:inherit}
.pg{font-size:.85rem;color:#aeb9cc;background:#0e1626;border-left:3px solid #3b82f6;border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:8px;font-style:italic}
.pg-ko{margin-top:6px;color:#7b8aa3;font-style:normal}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid #2a3650;border-radius:12px;cursor:pointer;background:#0e1626;transition:.15s}
.opt:hover{border-color:#3b4a66}
.opt input{display:none}
.onum{width:26px;height:26px;border-radius:50%;background:#1b2438;color:#aeb9cc;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;flex-shrink:0}
.otext{flex:1;font-size:.95rem}
.opt.sel{border-color:#f59e0b;background:rgba(245,158,11,.1)}
.opt.sel .onum{background:#f59e0b;color:#0f172a}
.q-explain{display:none;margin-top:12px;padding:12px 14px;background:#0e1626;border:1px dashed #2a3650;border-radius:12px;font-size:.85rem}
#wsRoot.answer-mode .q:not(.locked) .q-explain{display:block}
.ex-correct{font-weight:700;color:#6ee7b7;margin-bottom:8px}
.ex-item{padding:7px 0;border-top:1px solid #1b2438}
.ex-item:first-of-type{border-top:none}
.ex-item.is-ans{color:#e8edf7;font-weight:600}
.tag{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:4px}
.tag.ok{background:rgba(16,185,129,.2);color:#6ee7b7}
.tag.no{background:rgba(239,68,68,.18);color:#fca5a5}
.ex-why{font-size:.8rem;color:#aeb9cc;margin-top:3px;font-weight:400}
.ex-ko{font-size:.8rem;color:#7b8aa3;margin-top:2px;font-weight:400}
#wsRoot.answer-mode .opt.correct{border-color:#10b981;background:rgba(16,185,129,.14)}
#wsRoot.answer-mode .opt.correct .onum{background:#10b981;color:#fff}
#wsRoot.answer-mode .opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.12)}
#wsRoot.answer-mode .opt.wrong .onum{background:#ef4444;color:#fff}
.submit-row{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.btn{padding:15px;border:none;border-radius:14px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit}
#bSubmit{background:linear-gradient(135deg,#f59e0b,#f97316);color:#0f172a}
#bSubmit:disabled{opacity:.5}
#bRetryWrong{background:rgba(239,68,68,.15);color:#fca5a5;border:1.5px solid rgba(239,68,68,.5);display:none}
#bRetryWrong.show{display:block}
#bReset{background:#1b2438;color:#aeb9cc}
.score-banner{display:none;margin-bottom:14px;padding:14px 16px;border-radius:14px;border:2px solid #f59e0b;background:#141c2e}
.score-banner.show{display:block;animation:fadeIn .3s}
.score-banner.pass{border-color:#10b981}
.score-banner.fail{border-color:#ef4444}
.sb-main{font-size:1.05rem;font-weight:800}
.sb-sub{font-size:.8rem;color:#aeb9cc;margin-top:4px;line-height:1.5}
.retry-banner{margin-bottom:14px;padding:11px 14px;border:1.5px dashed #f59e0b;border-radius:12px;background:rgba(245,158,11,.08);font-size:.82rem;color:#fbbf24;line-height:1.5;display:none}
.retry-banner.show{display:block}
.grade-box{display:none}

var CONFIG={"title":"G2_L5_further_para2","testName":"G2_L5_further_para2","level":"고2","endpoint":"https://script.google.com/macros/s/AKfycbxHb25T0B2rBRvTMo4kF2hDHy0WlQSYOpLTDi2yUYoU7QPv3VotIjcKdGus6IDQckxs8w/exec","passThreshold":90,"questions":[{"questionNumber":1,"direction":"correct","sourceQuestion":"1번 지문","keyExpression":"most of them were more theatrical than effective","questionText":"다음 중 'most of them were more theatrical than effective'를 올바르게 paraphrasing한 것은?","qmode":"","options":[{"text":"Because they were staged so dramatically, nearly all of the attempts eventually achieved their goals.","isCorrect":false,"explanation":"틀림: 연극성을 성공의 '원인'으로 바꾸는 인과 관계를 새로 만들었고, '효과가 없었다'를 '목표를 달성했다'로 뒤집었다.","translation":"매우 극적으로 연출되었기 때문에 거의 모든 시도가 결국 목표를 달성했다.","enText":""},{"text":"Their dramatic nature, rather than any technical flaw, was what made every attempt fail.","isCorrect":false,"explanation":"틀림: 원문은 '대부분'이라 했지만 '모든 시도(every attempt)'로 범위를 확대했다. 또한 실패의 원인을 극적인 성격으로 단정하는 인과 관계를 임의로 추가했다.","translation":"기술적 결함이 아니라 그 극적인 성격이 모든 시도를 실패하게 만든 원인이었다.","enText":""},{"text":"The majority of such attempts offered impressive spectacle rather than any genuine practical impact.","isCorrect":true,"explanation":"올바름: 'more theatrical than effective'를 'impressive spectacle rather than genuine practical impact'로 풀어, 겉보기 연출은 있었으나 실질적 효과는 없었다는 의미를 정확히 전달한다.","translation":"그러한 시도의 대다수는 실질적인 효과보다는 인상적인 볼거리를 제공했다.","enText":""},{"text":"Only a few of the efforts were showy, while most proved quietly successful.","isCorrect":false,"explanation":"틀림: 원문의 '대부분(most)이 보여주기식'을 '소수만 보여주기식'으로 범위를 축소했고, 나머지가 성공했다는 내용을 추가해 의미를 비틀었다.","translation":"소수의 노력만 과시적이었고, 대부분은 조용히 성공을 거두었다.","enText":""},{"text":"Most of these attempts produced real results, though they lacked dramatic public appeal.","isCorrect":false,"explanation":"틀림: 원문은 '보여주기식일 뿐 효과는 없었다'는 뜻인데, 이 보기는 '실제 결과는 냈지만 극적인 매력이 부족했다'로 효과와 연극성의 관계를 정반대로 뒤집었다.","translation":"이러한 시도 대부분은 극적인 대중적 호소력은 부족했지만 실제 결과를 냈다.","enText":""}],"passage":"While there have been generations of efforts to adjust weather in our favor, most of them were more theatrical than effective.","passageTranslation":"날씨를 우리에게 유리하게 조절하려는 노력은 여러 세대에 걸쳐 있었지만, 그 대부분은 효과적이라기보다는 보여주기식이었다."},{"questionNumber":2,"direction":"wrong","sourceQuestion":"1번 지문","keyExpression":"adjust weather in our favor","questionText":"다음 중 'adjust weather in our favor'를 잘못 paraphrasing한 것은?","qmode":"","options":[{"text":"Weather was to be altered so that it would serve our interests.","isCorrect":false,"explanation":"올바름: 수동태와 목적절(so that)로 구조를 바꿨지만, 날씨를 우리 이익에 맞게 바꾼다는 의미는 동일하다.","translation":"날씨는 우리의 이익에 도움이 되도록 바뀌어야 했다.","enText":""},{"text":"adapting our own lives to cope with weather we cannot change","isCorrect":true,"explanation":"틀림: 원문은 '날씨를 우리에게 맞게 바꾼다'는 뜻이다. 이 보기는 '바꿀 수 없는 날씨에 우리가 맞춘다'로 조정의 주체와 대상을 뒤바꾸어 정반대 의미가 되었다.","translation":"우리가 바꿀 수 없는 날씨에 대처하기 위해 우리 자신의 삶을 적응시키는 것","enText":""},{"text":"making the weather more favorable to human needs and purposes","isCorrect":false,"explanation":"올바름: 'in our favor'를 'more favorable to human needs'로 바꾸어 날씨를 인간에게 유리하게 만든다는 의미를 유지했다.","translation":"날씨를 인간의 필요와 목적에 더 유리하게 만드는 것","enText":""},{"text":"to modify weather conditions in ways that benefit human beings","isCorrect":false,"explanation":"올바름: 'adjust'를 'modify'로, 'in our favor'를 'in ways that benefit human beings'로 바꾸어 원래 의미를 유지했다.","translation":"인간에게 이로운 방식으로 기상 조건을 변경하는 것","enText":""},{"text":"manipulating the weather so that it works to people's advantage","isCorrect":false,"explanation":"올바름: 동명사구로 바꾸고 'in our favor'를 'to people's advantage'로 표현해 같은 의미를 전달한다.","translation":"날씨가 사람들에게 유리하게 작용하도록 조작하는 것","enText":""}],"passage":"While there have been generations of efforts to adjust weather in our favor, most of them were more theatrical than effective.","passageTranslation":"날씨를 우리에게 유리하게 조절하려는 노력은 여러 세대에 걸쳐 있었지만, 그 대부분은 효과적이라기보다는 보여주기식이었다."},{"questionNumber":3,"direction":"correct","sourceQuestion":"1번 지문","keyExpression":"two main approaches aimed at preventing undesired warming","questionText":"다음 중 'two main approaches aimed at preventing undesired warming'을 올바르게 paraphrasing한 것은?","qmode":"","options":[{"text":"Warming, though undesired, has been accelerated by two main approaches.","isCorrect":false,"explanation":"틀림: '온난화를 막는다'를 '온난화를 가속했다'로 바꾸어 방향을 정반대로 뒤집었다.","translation":"온난화는 원치 않는 것이었지만, 두 가지 주요 접근법에 의해 가속화되었다.","enText":""},{"text":"Two principal strategies have been designed to keep unwanted heating of the planet from occurring.","isCorrect":true,"explanation":"올바름: 'aimed at preventing'을 'designed to keep ~ from occurring'으로, 'undesired warming'을 'unwanted heating'으로 바꾸어 의미를 정확히 유지했다.","translation":"원치 않는 지구 가열이 일어나지 않도록 두 가지 주요 전략이 고안되었다.","enText":""},{"text":"Of the many strategies proposed, only two have succeeded in stopping undesired warming.","isCorrect":false,"explanation":"틀림: 원문은 온난화 방지를 '목표로 한다(aimed at)'고 했을 뿐인데, 이미 '성공했다'고 단정해 가능성을 확정으로 바꾸었다.","translation":"제안된 많은 전략 중 단 두 가지만이 원치 않는 온난화를 막는 데 성공했다.","enText":""},{"text":"Preventing warming entirely is the shared goal behind dozens of different methods.","isCorrect":false,"explanation":"틀림: '두 가지 주요 접근법'을 '수십 가지 방법'으로 바꾸었고, 'entirely(완전히)'를 추가해 정도를 과장했다.","translation":"온난화를 완전히 막는 것이 수십 가지 서로 다른 방법의 공통 목표이다.","enText":""},{"text":"Two leading strategies seek to predict when unwanted warming will occur.","isCorrect":false,"explanation":"틀림: 'preventing(막는 것)'을 'predict(예측하는 것)'로 바꾸어 목적 자체가 달라졌다.","translation":"두 가지 주요 전략은 원치 않는 온난화가 언제 일어날지 예측하려 한다.","enText":""}],"passage":"There have been two main approaches aimed at preventing undesired warming.","passageTranslation":"원치 않는 온난화를 막는 것을 목표로 하는 두 가지 주요 접근법이 있어 왔다."},{"questionNumber":4,"direction":"wrong","sourceQuestion":"1번 지문","keyExpression":"reflecting some of the sun's rays back into space before they can warm the earth","questionText":"다음 중 'reflecting some of the sun's rays back into space before they can warm the earth'를 잘못 paraphrasing한 것은?","qmode":"","options":[{"text":"redirecting a portion of sunlight outward, thereby preventing it from warming the earth","isCorrect":false,"explanation":"올바름: 분사구문(thereby preventing)을 사용해, 일부 햇빛을 바깥으로 돌려 지구 가열을 막는다는 원래 의미를 유지했다.","translation":"햇빛의 일부를 바깥으로 돌려 그것이 지구를 데우지 못하게 하는 것","enText":""},{"text":"By turning a portion of the sun's rays back toward space, this method keeps them from ever heating the earth.","isCorrect":false,"explanation":"올바름: 'By ~ing' 구조와 'keep A from ~ing'을 사용했다. 'some of the sun's rays'를 'a portion of the sun's rays'로 바꾸어, 광선 일부가 지구를 데우기 전에 차단된다는 의미를 정확히 전달한다.","translation":"태양 광선의 일부를 우주 쪽으로 되돌림으로써 이 방법은 그것들이 지구를 데우지 못하게 한다.","enText":""},{"text":"sending part of the incoming sunlight back to space before it heats the planet","isCorrect":false,"explanation":"올바름: 'some of the sun's rays'를 'part of the incoming sunlight'로, 'warm'을 'heat'로 바꾸었고 '가열 전에'라는 시점도 유지했다.","translation":"들어오는 햇빛의 일부를 지구를 데우기 전에 우주로 되돌려 보내는 것","enText":""},{"text":"Some solar radiation is bounced away from Earth so that it cannot raise temperatures.","isCorrect":false,"explanation":"올바름: 수동태와 목적절로 구조를 바꾸었지만, 일부 태양 복사를 튕겨내 기온 상승을 막는다는 의미는 같다.","translation":"일부 태양 복사가 지구에서 튕겨 나가 기온을 올리지 못하게 된다.","enText":""},{"text":"Once the sun's rays have warmed the earth, part of that heat is reflected back into space.","isCorrect":true,"explanation":"틀림: 원문은 햇빛이 지구를 '데우기 전에(before)' 반사한다는 뜻이다. 이 보기는 '이미 데운 후에(once ~ have warmed)' 열을 반사한다고 시간 순서를 뒤집어, 온난화를 사전에 막는다는 핵심 원리를 왜곡했다.","translation":"태양 광선이 지구를 데우고 나면, 그 열의 일부가 우주로 반사된다.","enText":""}],"passage":"One centers on slowing down global warming by reflecting some of the sun's rays back into space before they can warm the earth.","passageTranslation":"하나는 태양 광선의 일부가 지구를 데우기 전에 그것을 우주로 다시 반사함으로써 지구 온난화를 늦추는 데 초점을 둔다."},{"questionNumber":5,"direction":"correct","sourceQuestion":"1번 지문","keyExpression":"so that the sun's light is scattered before it reaches the earth's surface","questionText":"다음 중 'so that the sun's light is scattered before it reaches the earth's surface'를 올바르게 paraphrasing한 것은?","qmode":"","options":[{"text":"thereby letting a greater share of sunlight reach the surface without being scattered at all","isCorrect":false,"explanation":"틀림: 분사구 구조로 바꾸면서, '도달 전에 산란시킨다'를 '전혀 산란되지 않고 더 많이 도달하게 한다'로 뒤집어 정반대 의미가 되었다.","translation":"그리하여 더 많은 햇빛이 전혀 산란되지 않고 지표면에 도달하게 하는","enText":""},{"text":"Scattering of sunlight happens only after it has struck the earth's surface.","isCorrect":false,"explanation":"틀림: 명사구 주어 구조로 바꾸면서 '도달 전(before)'을 '부딪친 후(after)'로 바꾸어 시점을 뒤집었다.","translation":"햇빛의 산란은 그것이 지표면에 부딪힌 후에만 일어난다.","enText":""},{"text":"because sunlight scattered at the earth's surface makes the atmosphere more reflective","isCorrect":false,"explanation":"틀림: 원문은 대기를 반사성 있게 만든 '결과로' 빛이 산란된다는 뜻이다. 이 보기는 산란이 대기를 반사성 있게 만드는 '원인'이라고 인과를 뒤집었고, 산란 위치도 지표면으로 바꾸었다.","translation":"지표면에서 산란된 햇빛이 대기를 더 반사성 있게 만들기 때문에","enText":""},{"text":"in order that sunlight is dispersed in the air prior to hitting the ground","isCorrect":true,"explanation":"올바름: 'so that'을 'in order that'으로, 'scattered'를 'dispersed'로, 'before it reaches the surface'를 'prior to hitting the ground'로 바꾸어 의미를 정확히 유지했다.","translation":"햇빛이 지면에 닿기 전에 공기 중에서 흩어지도록","enText":""},{"text":"with the result that all sunlight is blocked from ever entering the atmosphere","isCorrect":false,"explanation":"틀림: '산란'을 '완전 차단'으로 바꾸고 'all'로 범위를 확대했다. 또한 작용 위치를 '지표면 도달 전'에서 '대기 진입 전'으로 바꾸었다.","translation":"그 결과 모든 햇빛이 대기에 들어오는 것조차 차단되도록","enText":""}],"passage":"On the atmospheric level, it works by making the atmosphere more reflective so that the sun's light is scattered before it reaches the earth's surface.","passageTranslation":"대기 차원에서, 그것은 대기를 더 반사성 있게 만들어 햇빛이 지표면에 도달하기 전에 산란되도록 하는 방식으로 작동한다."},{"questionNumber":6,"direction":"wrong","sourceQuestion":"1번 지문","keyExpression":"breaking down CO2 molecules and locking the carbon in stable materials","questionText":"다음 중 'breaking down CO2 molecules and locking the carbon in stable materials'를 잘못 paraphrasing한 것은?","qmode":"","options":[{"text":"splitting carbon dioxide apart and trapping the carbon inside durable substances","isCorrect":false,"explanation":"올바름: 'break down'을 'split apart'로, 'lock'을 'trap'으로, 'stable materials'를 'durable substances'로 바꾸어 의미를 유지했다.","translation":"이산화탄소를 분해하고 그 탄소를 내구성 있는 물질 안에 가두는 것","enText":""},{"text":"breaking down stable materials in order to free the carbon locked inside them","isCorrect":true,"explanation":"틀림: 원문은 CO2를 분해해 탄소를 안정된 물질에 '가두는' 것이다. 이 보기는 분해 대상을 '안정된 물질'로 바꾸고, 탄소를 가두는 것을 '풀어낸다(free)'로 뒤집었다.","translation":"안정된 물질을 분해하여 그 안에 갇힌 탄소를 풀어내는 것","enText":""},{"text":"Once CO2 is broken apart, the carbon is sealed away in long-lasting materials.","isCorrect":false,"explanation":"올바름: 시간 부사절(Once)로 구조를 바꾸었지만, 분해 후 탄소를 오래가는 물질에 봉인한다는 의미는 같다.","translation":"CO2가 분해되면, 그 탄소는 오래 지속되는 물질 속에 봉인된다.","enText":""},{"text":"decomposing CO2 so that its carbon can remain fixed within stable substances","isCorrect":false,"explanation":"올바름: 목적절(so that)을 사용해 분해 후 탄소를 안정된 물질에 고정한다는 의미를 유지했다.","translation":"CO2를 분해하여 그 탄소가 안정된 물질 안에 고정되어 남아 있도록 하는 것","enText":""},{"text":"CO2 molecules are separated, and their carbon is held securely in materials that do not easily change.","isCorrect":false,"explanation":"올바름: 수동태 등위절 구조로 바꾸고 'stable'을 관계절 'that do not easily change'로 풀어 같은 의미를 전달한다.","translation":"CO2 분자가 분리되고, 그 탄소는 쉽게 변하지 않는 물질 속에 단단히 보관된다.","enText":""}],"passage":"The other approach is focused on capturing carbon dioxide from the atmosphere and storing it underground, or breaking down CO2 molecules and locking the carbon in stable materials.","passageTranslation":"다른 접근법은 대기 중 이산화탄소를 포집해 지하에 저장하거나, CO2 분자를 분해해 탄소를 안정된 물질 속에 가두는 데 초점을 둔다."},{"questionNumber":7,"direction":"correct","sourceQuestion":"1번 지문","keyExpression":"sink to the ocean floor while taking some of the carbon with them","questionText":"다음 중 'sink to the ocean floor while taking some of the carbon with them'을 올바르게 paraphrasing한 것은?","qmode":"","options":[{"text":"As they descend to the seabed, the plankton carry part of the carbon down with them.","isCorrect":true,"explanation":"올바름: 'sink to the ocean floor'를 'descend to the seabed'로, 'taking some of the carbon'을 'carry part of the carbon'으로 바꾸어 의미를 정확히 유지했다.","translation":"해저로 가라앉으면서 플랑크톤은 탄소의 일부를 함께 끌고 내려간다.","enText":""},{"text":"Though they reach the ocean floor, the plankton leave all the carbon near the surface.","isCorrect":false,"explanation":"틀림: 양보절(Though)로 구조를 바꾸면서 '탄소를 함께 가져간다'를 '표면 근처에 모두 남긴다'로 뒤집었다.","translation":"해저에 도달하긴 하지만, 플랑크톤은 모든 탄소를 표면 근처에 남겨 둔다.","enText":""},{"text":"The plankton rise from the seabed, releasing all of their carbon into the air.","isCorrect":false,"explanation":"틀림: '가라앉다'를 '떠오르다'로, '탄소를 가지고 내려가다'를 '대기로 전부 방출하다'로 바꾸어 방향과 범위를 모두 뒤집었다.","translation":"플랑크톤은 해저에서 떠오르며 그들의 모든 탄소를 공기 중으로 방출한다.","enText":""},{"text":"Carbon sinking to the ocean floor is what allows plankton to grow.","isCorrect":false,"explanation":"틀림: 원문은 플랑크톤이 자란 뒤 가라앉으며 탄소를 운반한다는 내용이다. 이 보기는 탄소의 침강이 플랑크톤 성장의 '원인'이라고 인과 관계를 뒤집었다.","translation":"해저로 가라앉는 탄소가 바로 플랑크톤이 자랄 수 있게 하는 것이다.","enText":""},{"text":"Every bit of carbon in the atmosphere is carried to the seabed by plankton.","isCorrect":false,"explanation":"틀림: 'some of the carbon(일부 탄소)'을 'every bit of carbon in the atmosphere(대기 중 모든 탄소)'로 범위를 지나치게 확대했다.","translation":"대기 중의 모든 탄소가 플랑크톤에 의해 해저로 운반된다.","enText":""}],"passage":"As these organisms grow, they consume carbon dioxide from the atmosphere, and sink to the ocean floor while taking some of the carbon with them.","passageTranslation":"이 생물들은 자라면서 대기 중 이산화탄소를 소비하고, 탄소의 일부를 함께 가지고 해저로 가라앉는다."},{"questionNumber":8,"direction":"wrong","sourceQuestion":"1번 지문","keyExpression":"a host of issues, ranging from technical to ethical to diplomatic","questionText":"다음 중 'a host of issues, ranging from technical to ethical to diplomatic'을 잘못 paraphrasing한 것은?","qmode":"","options":[{"text":"Problems are plentiful, extending across technological, ethical, and diplomatic areas.","isCorrect":false,"explanation":"올바름: 'a host of'를 'plentiful'이라는 서술어로 바꾸고 'extending across'로 범위를 표현해 같은 의미를 전달한다.","translation":"문제는 많으며, 기술적, 윤리적, 외교적 영역에 걸쳐 있다.","enText":""},{"text":"a wide variety of challenges, from engineering questions to moral and diplomatic disputes","isCorrect":false,"explanation":"올바름: 'a host of issues'를 'a wide variety of challenges'로 바꾸고 'from A to B' 구조로 세 영역을 모두 제시해 의미를 유지했다.","translation":"공학적 문제에서 도덕적, 외교적 분쟁에 이르는 매우 다양한 과제들","enText":""},{"text":"Although many issues exist, they are limited to technical rather than ethical or diplomatic concerns.","isCorrect":true,"explanation":"틀림: 원문은 문제가 기술에서 윤리, 외교까지 '폭넓게 걸쳐 있다'는 뜻이다. 이 보기는 문제의 범위를 '기술적 문제로 한정'하고 윤리·외교 문제를 배제해 범위를 축소했다.","translation":"많은 문제가 존재하지만, 그것들은 윤리적이거나 외교적인 것이 아니라 기술적인 우려에 국한된다.","enText":""},{"text":"Many difficulties exist, covering technical matters as well as ethical and diplomatic ones.","isCorrect":false,"explanation":"올바름: 독립절과 분사구문으로 구조를 바꾸었지만, 기술·윤리·외교에 걸친 많은 문제라는 의미는 같다.","translation":"많은 어려움이 존재하며, 기술적 문제뿐 아니라 윤리적, 외교적 문제도 포함한다.","enText":""},{"text":"numerous problems that span technical, moral, and international concerns","isCorrect":false,"explanation":"올바름: 'a host of'를 'numerous'로, 'ranging from'을 'span'으로 바꾸고 세 영역을 모두 포함해 의미를 유지했다.","translation":"기술적, 도덕적, 국제적 우려에 걸친 수많은 문제들","enText":""}],"passage":"There are, however, a host of issues too, ranging from technical to ethical to diplomatic.","passageTranslation":"그러나 기술적인 것에서 윤리적, 외교적인 것에 이르기까지 수많은 문제들도 있다."},{"questionNumber":9,"direction":"correct","sourceQuestion":"1번 지문","keyExpression":"Against such reality, could the climate engineering efforts make a difference?","questionText":"다음 중 'Against such reality, could the climate engineering efforts make a difference?'를 올바르게 paraphrasing한 것은?","qmode":"","options":[{"text":"So enormous are annual emissions that climate engineering is bound to prove entirely worthless.","isCorrect":false,"explanation":"틀림: 도치 구문(So ~ that)으로 구조를 바꾸었고, 막대한 배출이 걸림돌이라는 점은 원문과 같다. 그러나 원문의 수사의문문은 효과가 있을지 '의문'을 제기할 뿐인데, 이 보기는 '완전히 쓸모없다'고 단정하여 과장했다. 이는 최대 10% 감축이 가능하다는 내용, 그리고 10%·20% 해결책도 필요하다는 뒤의 내용과도 맞지 않는다.","translation":"연간 배출량이 너무나 막대해서 기후 공학은 완전히 쓸모없는 것으로 판명될 수밖에 없다.","enText":""},{"text":"In view of the vast annual emissions, what remains questionable is whether those emissions can be measured accurately.","isCorrect":false,"explanation":"틀림: what절 주어의 의사분열 구문으로 바꾸어 '막대한 배출량 앞에서 의문이 남는다'는 틀은 비슷하다. 그러나 의문의 대상을 '기후 공학이 변화를 가져올 수 있는지'에서 '배출량을 정확히 측정할 수 있는지'로 바꾸었다.","translation":"막대한 연간 배출량을 고려할 때, 여전히 의문스러운 것은 그 배출량을 정확히 측정할 수 있는지이다.","enText":""},{"text":"Small annual emissions make it easy for climate engineering to show clear results.","isCorrect":false,"explanation":"틀림: 원문의 '막대한(enormous)' 배출량을 '적은(small)' 배출량으로 뒤집고, 효과를 쉽게 낸다는 정반대 결론을 내렸다.","translation":"적은 연간 배출량 덕분에 기후 공학이 뚜렷한 결과를 보여주기 쉽다.","enText":""},{"text":"Given the sheer scale of annual emissions, it is doubtful whether climate engineering can have a meaningful effect.","isCorrect":true,"explanation":"올바름: 'Against such reality'를 'Given the sheer scale of annual emissions'로 풀고, 회의적 수사의문문을 'it is doubtful whether ~'로 바꾸어 함축된 의미를 정확히 전달한다.","translation":"연간 배출량의 엄청난 규모를 고려하면, 기후 공학이 의미 있는 효과를 낼 수 있을지 의심스럽다.","enText":""},{"text":"Thanks to massive annual emissions, climate engineering is certain to make a significant difference.","isCorrect":false,"explanation":"틀림: 원문의 의문문은 효과에 대한 회의를 나타내는데, 이 보기는 효과를 '확실하다'고 단정했다. 또한 막대한 배출을 장애물이 아니라 '덕분(thanks to)'으로 바꾸어 관계를 뒤집었다.","translation":"막대한 연간 배출량 덕분에, 기후 공학은 확실히 상당한 변화를 가져올 것이다.","enText":""}],"passage":"Perhaps the biggest issue is simply the scale of emissions, the enormous amount of CO2 emitted into the atmosphere every year. Against such reality, could the climate engineering efforts make a difference?","passageTranslation":"아마도 가장 큰 문제는 단순히 배출 규모, 즉 매년 대기 중으로 배출되는 막대한 양의 CO2일 것이다. 그러한 현실에 맞서 기후 공학 노력이 변화를 가져올 수 있을까?"},{"questionNumber":10,"direction":"wrong","sourceQuestion":"1번 지문","keyExpression":"after taking into account the energy used to capture and isolate CO2","questionText":"다음 중 'after taking into account the energy used to capture and isolate CO2'를 잘못 paraphrasing한 것은?","qmode":"","options":[{"text":"in light of the energy expenditure that capturing and sequestering CO2 entails","isCorrect":false,"explanation":"올바름: 'after taking into account'를 전치사구 'in light of'로, 'energy used'를 'energy expenditure'로, 'isolate'를 'sequester(격리하다)'로 바꾸었다. 관계절로 구조를 바꾸었지만 의미는 유지된다.","translation":"CO2를 포집하고 격리하는 데 수반되는 에너지 소비를 고려하여","enText":""},{"text":"excluding the energy that capturing and isolating CO2 itself requires","isCorrect":true,"explanation":"틀림: 'take into account(고려하다, 포함하다)'를 'excluding(제외하고)'으로 바꾸어 의미를 정반대로 만들었다. 포집에 드는 에너지를 계산에서 빼면 결론 자체가 달라진다.","translation":"CO2를 포집하고 격리하는 것 자체에 필요한 에너지를 제외하고","enText":""},{"text":"when the energy cost of trapping and isolating carbon dioxide is included in the calculation","isCorrect":false,"explanation":"올바름: 시간 부사절과 수동태 구조로 바꾸었지만, 포집·격리 에너지를 계산에 포함한다는 의미는 같다.","translation":"이산화탄소를 가두고 격리하는 에너지 비용이 계산에 포함될 때","enText":""},{"text":"with the energy spent on capturing and separating CO2 taken into consideration","isCorrect":false,"explanation":"올바름: 'with + 명사 + 과거분사' 구조로 바꾸어 포집 에너지를 고려한다는 의미를 유지했다.","translation":"CO2를 포집하고 분리하는 데 쓰인 에너지가 고려된 상태에서","enText":""},{"text":"factoring in the energy consumed in trapping CO2 and locking it away","isCorrect":false,"explanation":"올바름: 'take into account'를 분사구문 'factoring in'으로 바꾸었다. 또 'capture and isolate'를 'trapping ~ and locking it away'로 풀어 포집·격리 에너지를 계산에 넣는다는 의미를 유지했다.","translation":"CO2를 가두고 격리해 두는 데 소비되는 에너지를 계산에 넣으면","enText":""}],"passage":"A recent study found that after taking into account the energy used to capture and isolate CO2, the carbon capture efforts would reduce the total global emissions by at most 10%.","passageTranslation":"최근 한 연구에 따르면 CO2를 포집하고 격리하는 데 사용되는 에너지를 고려하면, 탄소 포집 노력은 전 세계 총배출량을 기껏해야 10% 줄일 것이다."},{"questionNumber":11,"direction":"correct","sourceQuestion":"1번 지문","keyExpression":"would reduce the total global emissions by at most 10%","questionText":"다음 중 'would reduce the total global emissions by at most 10%'를 올바르게 paraphrasing한 것은?","qmode":"","options":[{"text":"Only ten percent of carbon capture efforts would succeed in reducing emissions.","isCorrect":false,"explanation":"틀림: 10%는 '배출량 감소 폭'인데, 이 보기는 '성공하는 노력의 비율'로 수량이 가리키는 대상을 바꾸었다.","translation":"탄소 포집 노력 중 10퍼센트만이 배출량 감소에 성공할 것이다.","enText":""},{"text":"Reducing global emissions by ten percent would make carbon capture unnecessary.","isCorrect":false,"explanation":"틀림: 10% 감소를 탄소 포집의 '결과'가 아니라 탄소 포집을 불필요하게 만드는 '조건'으로 바꾸어 인과 관계를 왜곡했다.","translation":"전 세계 배출량을 10퍼센트 줄이면 탄소 포집이 불필요해질 것이다.","enText":""},{"text":"Total global emissions would fall by at least ten percent.","isCorrect":false,"explanation":"틀림: 'at most(최대)'를 'at least(최소)'로 바꾸어, 상한을 뜻하는 표현을 하한으로 뒤집었다.","translation":"전 세계 총배출량은 최소 10퍼센트 감소할 것이다.","enText":""},{"text":"Global emissions would be cut down to a mere ten percent of their current level.","isCorrect":false,"explanation":"틀림: 수동태로 구조를 바꾸면서 '10%만큼(by) 줄이다'를 '10% 수준으로(to) 줄이다'로 바꾸었다. 그 결과 감축 폭이 최대 10%에서 90%로 부풀려졌다.","translation":"전 세계 배출량은 현재 수준의 10퍼센트에 불과한 정도로 줄어들 것이다.","enText":""},{"text":"The cut in worldwide emissions would be no greater than ten percent.","isCorrect":true,"explanation":"올바름: 동사 'reduce'를 명사 'cut'으로 바꾸고, 'at most 10%'를 'no greater than ten percent'로 표현해 상한의 의미를 정확히 유지했다.","translation":"전 세계 배출량 감소폭은 10퍼센트를 넘지 않을 것이다.","enText":""}],"passage":"A recent study found that after taking into account the energy used to capture and isolate CO2, the carbon capture efforts would reduce the total global emissions by at most 10%.","passageTranslation":"최근 한 연구에 따르면 CO2를 포집하고 격리하는 데 사용되는 에너지를 고려하면, 탄소 포집 노력은 전 세계 총배출량을 기껏해야 10% 줄일 것이다."},{"questionNumber":12,"direction":"wrong","sourceQuestion":"1번 지문","keyExpression":"Even if there is no 100% solution, we need a lot of 10% and 20% solutions.","questionText":"다음 중 'Even if there is no 100% solution, we need a lot of 10% and 20% solutions.'를 잘못 paraphrasing한 것은?","qmode":"","options":[{"text":"Combining numerous partial measures is necessary, since no perfect answer exists.","isCorrect":false,"explanation":"올바름: 동명사 주어와 이유 부사절로 구조를 바꾸었지만, 완벽한 답이 없으니 여러 부분적 조치를 함께 써야 한다는 필자의 논지와 일치한다.","translation":"완벽한 해답이 존재하지 않으므로, 수많은 부분적 조치를 결합하는 것이 필요하다.","enText":""},{"text":"Until a complete solution is found, small partial efforts should be put on hold.","isCorrect":true,"explanation":"틀림: 원문은 완전한 해결책이 없어도 부분적 해결책들이 '필요하다'는 뜻이다. 이 보기는 완전한 해결책이 나올 때까지 부분적 노력을 '보류해야 한다'고 주장을 정반대로 뒤집었다.","translation":"완전한 해결책이 발견될 때까지 작은 부분적 노력은 보류되어야 한다.","enText":""},{"text":"Many modest contributions are worth pursuing, even without one solution that does it all.","isCorrect":false,"explanation":"올바름: 'even without ~' 전치사구로 양보 의미를 살리고, '10%·20% solutions'를 'modest contributions'로 바꾸어 같은 의미를 전달한다.","translation":"모든 것을 해결하는 하나의 해결책이 없더라도, 많은 소박한 기여들은 추구할 가치가 있다.","enText":""},{"text":"The absence of a complete remedy does not mean we should abandon smaller, partial ones.","isCorrect":false,"explanation":"올바름: 조건절을 명사구 주어(The absence of ~)로 바꾸고 부정 구문을 써서, 완전한 해결책이 없어도 부분적 해결책을 포기하지 말자는 의미를 유지했다.","translation":"완전한 처방이 없다는 것이 더 작고 부분적인 처방을 포기해야 한다는 뜻은 아니다.","enText":""},{"text":"Although no single fix can solve everything, many partial solutions are still needed.","isCorrect":false,"explanation":"올바름: 'Even if'를 'Although'로, '100% solution'을 'no single fix can solve everything'으로, '10%·20% solutions'를 'partial solutions'로 바꾸어 양보 관계와 의미를 유지했다.","translation":"어떤 단일 해결책도 모든 것을 해결할 수는 없지만, 많은 부분적 해결책이 여전히 필요하다.","enText":""}],"passage":"Still, some believe that we need to pursue multiple routes to slow climate change. Even if there is no 100% solution, they say, we need a lot of 10% and 20% solutions.","passageTranslation":"그럼에도 일부는 기후 변화를 늦추기 위해 여러 경로를 추구해야 한다고 믿는다. 그들은 100%의 해결책이 없더라도 10%, 20%짜리 해결책이 많이 필요하다고 말한다."},{"questionNumber":13,"direction":"correct","sourceQuestion":"1번 지문","keyExpression":"some scientists began seriously considering ways to influence the climate system itself in an emerging field","questionText":"다음 중 'some scientists began seriously considering ways to influence the climate system itself in an emerging field'를 올바르게 paraphrasing한 것은?","qmode":"","options":[{"text":"Influencing the climate system became a newly established priority for all scientists in this field.","isCorrect":false,"explanation":"틀림: 동명사 주어 구조로 바꾸면서 'some scientists(일부 과학자)'를 'all scientists(모든 과학자)'로 범위를 확대했고, '고려하기 시작했다'는 탐색 단계를 '확립된 우선순위'라는 확정적 상태로 과장했다.","translation":"기후 체계에 영향을 주는 것은 이 분야의 모든 과학자들에게 새로 확립된 최우선 과제가 되었다.","enText":""},{"text":"In a new field, some scientists seriously considered ways to protect the climate system from human influence.","isCorrect":false,"explanation":"틀림: 화제와 어휘는 비슷하지만 '기후 체계에 영향을 주다(influence)'를 '기후 체계를 인간의 영향으로부터 보호하다(protect from human influence)'로 바꿔 행위의 방향이 반대가 되었다.","translation":"새로운 분야에서, 일부 과학자들은 기후 체계를 인간의 영향으로부터 보호할 방법을 진지하게 고려했다.","enText":""},{"text":"Within a newly developing discipline, certain researchers started to earnestly explore methods of altering the climate system directly.","isCorrect":true,"explanation":"올바름: 'in an emerging field'를 'Within a newly developing discipline'으로, 'some scientists'를 'certain researchers'로, 'seriously considering ways to influence ~ itself'를 'earnestly explore methods of altering ~ directly'로 정확히 옮겼다.","translation":"새롭게 발전하는 한 분야 안에서, 일부 연구자들은 기후 체계를 직접 바꾸는 방법을 진지하게 탐구하기 시작했다.","enText":""},{"text":"Having long dominated the field, most scientists seriously studied how to forecast the climate system accurately.","isCorrect":false,"explanation":"틀림: 분사구문으로 구조를 바꾸면서 'emerging(새로 생겨나는)'을 'long dominated(오랫동안 지배해 온)'로 뒤집고, 'some'을 'most'로 확대했으며, 'influence(영향을 주다)'를 'forecast(예측하다)'로 바꿔 행위 자체가 달라졌다.","translation":"오랫동안 그 분야를 지배해 온 대부분의 과학자들은 기후 체계를 정확히 예측하는 방법을 진지하게 연구했다.","enText":""},{"text":"It was the climate system itself that a few scientists dismissed as impossible to change.","isCorrect":false,"explanation":"틀림: 강조구문(It was ~ that)으로 구조를 바꾸고, 'seriously considering ways to influence(영향을 줄 방법을 진지하게 고려하다)'를 'dismissed as impossible to change(바꿀 수 없다고 일축하다)'로 정반대로 비틀었다.","translation":"몇몇 과학자들이 바꿀 수 없다고 일축한 것은 바로 기후 체계 그 자체였다.","enText":""}],"passage":"However, some scientists began seriously considering ways to influence the climate system itself in an emerging field, most widely known today as “climate engineering” or “climate intervention” efforts.","passageTranslation":"그러나 일부 과학자들은 오늘날 '기후 공학' 또는 '기후 개입' 노력으로 가장 널리 알려진 신생 분야에서 기후 체계 그 자체에 영향을 미칠 방법을 진지하게 고려하기 시작했다."},{"questionNumber":14,"direction":"wrong","sourceQuestion":"1번 지문","keyExpression":"making the earth's surface brighter by painting the roof tops white or even adding highly reflective coverings across large areas of desert","questionText":"다음 중 'making the earth's surface brighter by painting the roof tops white or even adding highly reflective coverings across large areas of desert'를 잘못 paraphrasing한 것은?","qmode":"","options":[{"text":"The earth's surface could be brightened by coating roofs in white paint or laying reflective sheets over wide deserts.","isCorrect":false,"explanation":"올바름: 능동을 수동태(could be brightened)로 바꾸었을 뿐, 수단과 목적의 관계가 원문과 동일하다.","translation":"지붕에 흰색 페인트를 칠하거나 넓은 사막 위에 반사 시트를 깔아서 지표면을 밝게 할 수 있다.","enText":""},{"text":"Increasing the brightness of the ground through white rooftops or reflective materials spread over vast deserts","isCorrect":false,"explanation":"올바름: 'making the earth's surface brighter'를 명사구 'Increasing the brightness of the ground'로, 수단(by ~)을 'through ~'로 바꾸어 의미를 그대로 유지했다.","translation":"흰색 지붕이나 광활한 사막에 깔린 반사 물질을 통해 지면의 밝기를 높이는 것","enText":""},{"text":"To lighten the earth's surface, one might whiten rooftops or blanket large deserts with highly reflective material.","isCorrect":false,"explanation":"올바름: 목적을 to부정사 부사구로 앞에 내세운 구조이며, 'whiten rooftops', 'blanket large deserts with highly reflective material'이 원문의 두 방법을 정확히 옮겼다.","translation":"지표면을 밝게 하기 위해, 지붕을 하얗게 하거나 넓은 사막을 반사율이 높은 물질로 덮을 수 있다.","enText":""},{"text":"Painting roofs white, or even covering wide desert regions with reflective layers, would make the ground brighter.","isCorrect":false,"explanation":"올바름: 수단을 주어(동명사구)로, 목적을 서술부로 옮긴 구조 변환이며 지붕 도색과 사막 피복이라는 두 방법과 '지표를 밝게 한다'는 결과가 모두 정확하다.","translation":"지붕을 흰색으로 칠하거나 심지어 넓은 사막 지역을 반사층으로 덮는 것은 지면을 더 밝게 만들 것이다.","enText":""},{"text":"Because the earth's surface has grown brighter, roofs are painted white and deserts covered with reflective sheets.","isCorrect":true,"explanation":"틀림: 원문에서 지붕 도색과 반사 피복은 지표를 밝게 만들기 위한 '수단(원인)'인데, 이 보기는 'Because'절로 지표가 밝아진 것을 '원인'으로 놓고 도색·피복을 그 '결과'로 만들어 인과 관계를 뒤집었다.","translation":"지표면이 더 밝아졌기 때문에, 지붕이 흰색으로 칠해지고 사막이 반사 시트로 덮인다.","enText":""}],"passage":"On the ground level, it may involve making the earth’s surface brighter by painting the roof tops white or even adding highly reflective coverings across large areas of desert.","passageTranslation":"지상 차원에서, 그것은 지붕을 흰색으로 칠하거나 심지어 넓은 사막 지역에 반사율이 높은 덮개를 추가함으로써 지구 표면을 더 밝게 만드는 것을 포함할 수 있다."},{"questionNumber":15,"direction":"correct","sourceQuestion":"1번 지문","keyExpression":"bright, reflective particles would be fired into clouds using airplanes or balloons flying high in the sky","questionText":"다음 중 'bright, reflective particles would be fired into clouds using airplanes or balloons flying high in the sky'를 올바르게 paraphrasing한 것은?","qmode":"","options":[{"text":"Dark, heat-absorbing particles would be released into clouds from planes and balloons at high altitudes.","isCorrect":false,"explanation":"틀림: 구조와 수단은 같아 보이지만 입자의 성질을 'bright, reflective(밝고 반사하는)'에서 'dark, heat-absorbing(어둡고 열을 흡수하는)'으로 반대로 바꿔 목적과 맞지 않게 되었다.","translation":"어둡고 열을 흡수하는 입자가 높은 고도의 비행기와 기구로부터 구름 속으로 방출될 것이다.","enText":""},{"text":"Low-flying airplanes and balloons would spread bright particles on the ground beneath the clouds.","isCorrect":false,"explanation":"틀림: 'flying high in the sky'를 'low-flying'으로 바꾸고, 입자가 가는 곳을 '구름 속(into clouds)'에서 '구름 아래 지면(on the ground)'으로 바꿔 대기 차원의 방법을 지상 차원으로 왜곡했다.","translation":"낮게 나는 비행기와 기구가 구름 아래 지면에 밝은 입자를 뿌릴 것이다.","enText":""},{"text":"Using particles collected from the clouds, airplanes and balloons would reflect sunlight high in the sky.","isCorrect":false,"explanation":"틀림: 분사구문으로 구조를 바꾸면서 입자를 구름 '속으로 쏘는' 것을 구름 '에서 수집하는' 것으로 방향을 뒤집었고, 햇빛을 반사하는 주체도 입자가 아닌 비행기·기구로 바꿨다.","translation":"구름에서 수집한 입자를 사용해, 비행기와 기구가 하늘 높은 곳에서 햇빛을 반사할 것이다.","enText":""},{"text":"Clouds themselves would be removed by airplanes and balloons so that more sunlight could reach the ground.","isCorrect":false,"explanation":"틀림: 목적절(so that)을 붙인 구조로, 구름에 입자를 쏘아 '햇빛을 차단하는' 원래 목적을 '구름을 제거해 햇빛이 더 많이 지면에 닿게 하는' 정반대 목적으로 비틀었다.","translation":"더 많은 햇빛이 지면에 닿을 수 있도록 비행기와 기구로 구름 자체를 제거할 것이다.","enText":""},{"text":"Aircraft or high-altitude balloons would be used to launch shiny, light-reflecting particles into the clouds.","isCorrect":true,"explanation":"올바름: 수단(airplanes or balloons flying high)을 주어로 올린 수동 구조로, 'bright, reflective particles'를 'shiny, light-reflecting particles'로, 'fired into'를 'launch into'로 정확히 옮겼다.","translation":"비행기나 고고도 기구가 빛나고 빛을 반사하는 입자를 구름 속으로 쏘아 올리는 데 사용될 것이다.","enText":""}],"passage":"To achieve this, bright, reflective particles would be fired into clouds using airplanes or balloons flying high in the sky.","passageTranslation":"이를 달성하기 위해, 하늘 높이 나는 비행기나 기구를 이용해 밝고 반사성이 있는 입자를 구름 속으로 쏘아 넣을 것이다."},{"questionNumber":16,"direction":"wrong","sourceQuestion":"1번 지문","keyExpression":"capturing carbon dioxide from the atmosphere and storing it underground","questionText":"다음 중 'capturing carbon dioxide from the atmosphere and storing it underground'를 잘못 paraphrasing한 것은?","qmode":"","options":[{"text":"It is atmospheric CO2 that gets extracted and then locked away beneath the ground.","isCorrect":false,"explanation":"올바름: 'It is ~ that' 강조구문으로 구조를 바꾸었지만, 대기 중 CO2를 빼내 지하에 가둔다는 핵심 의미를 유지했다.","translation":"추출되어 지하에 가두어지는 것은 바로 대기 중의 이산화탄소이다.","enText":""},{"text":"Carbon dioxide is trapped from the air and then stored deep under the ground.","isCorrect":false,"explanation":"올바름: 수동태 문장으로 구조를 바꿨지만 포집 후 지하 저장이라는 순서와 의미가 원문과 같다.","translation":"이산화탄소가 공기 중에서 포집된 뒤 땅속 깊이 저장된다.","enText":""},{"text":"the underground storage of carbon dioxide that has been taken out of the atmosphere","isCorrect":false,"explanation":"올바름: 동명사구를 명사구 + 관계절 구조로 바꾸었고, '대기에서 빼낸 CO2의 지하 저장'이라는 의미가 정확하다.","translation":"대기에서 빼낸 이산화탄소의 지하 저장","enText":""},{"text":"extracting CO2 from the air and sequestering it beneath the earth's surface","isCorrect":false,"explanation":"올바름: 'capturing'을 'extracting', 'atmosphere'를 'air', 'storing it underground'를 'sequestering it beneath the earth's surface'로 바꾼 정확한 동의 표현이다.","translation":"공기 중의 이산화탄소를 추출하여 지표면 아래에 격리하는 것","enText":""},{"text":"releasing carbon dioxide trapped underground so that the atmosphere can absorb and store it","isCorrect":true,"explanation":"틀림: 원문은 탄소를 '대기 → 지하'로 옮기는데, 이 보기는 목적절을 이용해 '지하 → 대기'로 이동 방향을 뒤집었다. 또 capture를 release로 바꿔 정반대 의미가 되었다.","translation":"대기가 흡수하고 저장할 수 있도록 지하에 갇힌 이산화탄소를 방출하는 것","enText":""}],"passage":"The other approach is focused on capturing carbon dioxide from the atmosphere and storing it underground, or breaking down CO2 molecules and locking the carbon in stable materials.","passageTranslation":"다른 접근법은 대기에서 이산화탄소를 포집하여 지하에 저장하거나, CO2 분자를 분해하여 탄소를 안정적인 물질 속에 가두는 데 초점을 맞춘다."},{"questionNumber":17,"direction":"correct","sourceQuestion":"1번 지문","keyExpression":"iron dust is scattered from ships in order to fertilize ocean planktons","questionText":"다음 중 'iron dust is scattered from ships in order to fertilize ocean planktons'를 올바르게 paraphrasing한 것은?","qmode":"","options":[{"text":"Iron dust carried by ocean plankton is collected by ships to fertilize farmland.","isCorrect":false,"explanation":"틀림: 철가루를 '배에서 뿌리는' 것을 '배가 수집하는' 것으로 방향을 뒤집었고, 비옥하게 하는 대상도 플랑크톤에서 농경지로 바꿨다.","translation":"바다 플랑크톤이 운반하는 철가루를 배가 수집해 농경지를 비옥하게 한다.","enText":""},{"text":"Ships occasionally drop iron dust by accident, which happens to feed ocean plankton.","isCorrect":false,"explanation":"틀림: 관계절 구조로, 'in order to(~하기 위해)'라는 의도적 목적을 'by accident(우연히)'와 'happens to'로 바꿔 계획된 행위를 우연한 결과로 왜곡했다.","translation":"배가 가끔 실수로 철가루를 떨어뜨리는데, 그것이 우연히 바다 플랑크톤의 먹이가 된다.","enText":""},{"text":"Fertilized by ocean plankton, the iron dust scattered from ships slowly grows heavier.","isCorrect":false,"explanation":"틀림: 분사구문으로 구조를 바꾸면서 비옥하게 하는 주체와 대상을 맞바꿨다(철가루가 플랑크톤을 비옥하게 함 → 플랑크톤이 철가루를 비옥하게 함).","translation":"바다 플랑크톤에 의해 비옥해진 채, 배에서 뿌려진 철가루는 서서히 더 무거워진다.","enText":""},{"text":"Ships spread iron powder over the sea so that plankton populations can be nourished and grow.","isCorrect":true,"explanation":"올바름: 수동태를 능동태로, 'in order to fertilize'를 'so that ~ can be nourished and grow'로 바꾸어 '플랑크톤에 영양을 공급하려는 의도적 살포'라는 의미를 정확히 살렸다.","translation":"배는 플랑크톤 개체군이 영양을 공급받아 자랄 수 있도록 바다 위에 철 분말을 뿌린다.","enText":""},{"text":"To prevent plankton from overgrowing, ships scatter iron dust that limits their nutrients.","isCorrect":false,"explanation":"틀림: 목적의 to부정사를 문두로 옮긴 구조로, '플랑크톤의 성장을 돕는다(fertilize)'는 목적을 '과잉 성장을 막는다'는 정반대 목적으로 비틀었다.","translation":"플랑크톤이 과도하게 자라는 것을 막기 위해, 배는 그들의 영양분을 제한하는 철가루를 뿌린다.","enText":""}],"passage":"For example, iron dust is scattered from ships in order to fertilize ocean planktons.","passageTranslation":"예를 들어, 바다 플랑크톤을 비옥하게 하기(성장을 촉진하기) 위해 배에서 철가루를 뿌린다."},{"questionNumber":18,"direction":"wrong","sourceQuestion":"1번 지문","keyExpression":"As these organisms grow, they consume carbon dioxide from the atmosphere","questionText":"다음 중 'As these organisms grow, they consume carbon dioxide from the atmosphere'를 잘못 paraphrasing한 것은?","qmode":"","options":[{"text":"The more these organisms grow, the more carbon dioxide they give off into the air.","isCorrect":true,"explanation":"틀림: 'the 비교급, the 비교급' 구조로 바꾸면서 'consume(소비하다)'을 'give off into the air(공기 중으로 내뿜다)'로 반대로 비틀어, 탄소 흡수원이 탄소 배출원이 되어 버렸다.","translation":"이 생물들이 더 많이 자랄수록, 더 많은 이산화탄소를 공기 중으로 내뿜는다.","enText":""},{"text":"Carbon dioxide in the atmosphere is used up by the plankton as they develop.","isCorrect":false,"explanation":"올바름: 능동을 수동태로 바꾸어 CO2를 주어로 삼았지만, 플랑크톤이 자라면서 대기 중 CO2를 소비한다는 의미는 같다.","translation":"대기 중의 이산화탄소는 플랑크톤이 성장함에 따라 그들에 의해 소모된다.","enText":""},{"text":"The growth of these organisms involves absorbing carbon dioxide from the air.","isCorrect":false,"explanation":"올바름: 부사절을 명사구 주어(The growth of ~)로 바꾸었고, 성장 과정에서 CO2를 흡수한다는 의미가 유지된다.","translation":"이 생물들의 성장에는 공기 중 이산화탄소의 흡수가 수반된다.","enText":""},{"text":"In the process of growing, the plankton take in atmospheric carbon dioxide.","isCorrect":false,"explanation":"올바름: 'As ~ grow'를 전치사구 'In the process of growing'으로, 'consume'을 'take in'으로 바꾼 정확한 표현이다.","translation":"성장하는 과정에서 플랑크톤은 대기 중의 이산화탄소를 흡수한다.","enText":""},{"text":"Growing larger and more numerous, these tiny organisms draw carbon dioxide out of the air.","isCorrect":false,"explanation":"올바름: 분사구문으로 성장을 표현하고 'consume'을 'draw ~ out of the air'로 바꾼 것으로, 성장과 CO2 흡수의 동시성이 유지된다.","translation":"더 크고 많아지면서, 이 작은 생물들은 공기 중에서 이산화탄소를 끌어낸다.","enText":""}],"passage":"As these organisms grow, they consume carbon dioxide from the atmosphere, and sink to the ocean floor while taking some of the carbon with them.","passageTranslation":"이 생물들은 성장하면서 대기 중의 이산화탄소를 소비하고, 그 탄소 일부를 함께 가지고 해저로 가라앉는다."},{"questionNumber":19,"direction":"correct","sourceQuestion":"1번 지문","keyExpression":"On the ocean floor, the carbon can stay for hundreds of years.","questionText":"다음 중 'On the ocean floor, the carbon can stay for hundreds of years.'를 올바르게 paraphrasing한 것은?","qmode":"","options":[{"text":"Once settled on the seabed, the carbon may remain stored for several centuries.","isCorrect":true,"explanation":"올바름: 'On the ocean floor'를 'Once settled on the seabed'로, 'can stay'를 'may remain stored'로, 'hundreds of years'를 'several centuries'로 정확히 옮겼다.","translation":"일단 해저에 자리 잡으면, 탄소는 수 세기 동안 저장된 채 남아 있을 수 있다.","enText":""},{"text":"It takes hundreds of years for the carbon to reach the ocean floor.","isCorrect":false,"explanation":"틀림: 'It takes ~ for' 구조로 바꾸면서 '해저에 머무는 기간'을 '해저에 도달하는 데 걸리는 시간'으로 의미를 바꿔 놓았다.","translation":"탄소가 해저에 도달하는 데 수백 년이 걸린다.","enText":""},{"text":"Carbon can stay in the air for centuries before it finally reaches the ocean floor.","isCorrect":false,"explanation":"틀림: 시간 부사절(before)을 덧붙여, 수백 년 머무는 장소를 '해저'에서 '공기 중'으로 바꿨다.","translation":"탄소는 마침내 해저에 도달하기 전까지 수 세기 동안 공기 중에 머물 수 있다.","enText":""},{"text":"Within a few years, carbon stored on the seabed returns to the atmosphere.","isCorrect":false,"explanation":"틀림: 기간을 '수백 년'에서 '몇 년 이내'로 축소하고, '머무른다'를 '대기로 돌아간다'로 반대로 비틀었다.","translation":"몇 년 안에, 해저에 저장된 탄소는 대기로 되돌아간다.","enText":""},{"text":"The carbon on the ocean floor is certain to stay there permanently.","isCorrect":false,"explanation":"틀림: 'can(~할 수 있다)'이라는 가능성을 'is certain to(확실히 ~하다)'로 단정했고, 'hundreds of years'를 'permanently(영구히)'로 범위를 과장했다.","translation":"해저의 탄소는 확실히 그곳에 영구적으로 머문다.","enText":""}],"passage":"On the ocean floor, the carbon can stay for hundreds of years.","passageTranslation":"해저에서 그 탄소는 수백 년 동안 머무를 수 있다."},{"questionNumber":20,"direction":"wrong","sourceQuestion":"1번 지문","keyExpression":"Perhaps the biggest issue is simply the scale of emissions","questionText":"다음 중 'Perhaps the biggest issue is simply the scale of emissions'를 잘못 paraphrasing한 것은?","qmode":"","options":[{"text":"What may pose the most serious challenge is the sheer volume of emissions.","isCorrect":false,"explanation":"올바름: What 명사절 주어 구조로 바꾸었고, 'may'로 원문의 추측(Perhaps)을 유지하며 'sheer volume'으로 규모를 강조했다.","translation":"가장 심각한 난제가 될 수 있는 것은 순전히 엄청난 배출량이다.","enText":""},{"text":"The enormous size of emissions is arguably the main obstacle to overcome.","isCorrect":false,"explanation":"올바름: 주어와 보어의 위치를 바꾼 구조로, 'arguably'가 'Perhaps'의 추측적 뉘앙스를 살리고 '배출의 거대한 규모'가 주된 장애물이라는 의미를 유지한다.","translation":"배출의 엄청난 규모는 아마도 극복해야 할 주된 장애물일 것이다.","enText":""},{"text":"Possibly the greatest problem is just how vast the amount of emissions is.","isCorrect":false,"explanation":"올바름: 'Perhaps'를 'Possibly', 'simply'를 'just', 'the scale of emissions'를 명사절 'how vast the amount of emissions is'로 바꾼 정확한 표현이다.","translation":"아마 가장 큰 문제는 그저 배출량이 얼마나 막대한가일 것이다.","enText":""},{"text":"The biggest issue is clearly the type of emissions, rather than their overall amount.","isCorrect":true,"explanation":"틀림: 'Perhaps(아마도)'라는 조심스러운 추측을 'clearly(분명히)'로 단정했고, 핵심 문제를 '규모(양)'에서 '종류'로 바꾼 뒤 양을 오히려 배제(rather than)해 원문과 정반대가 되었다.","translation":"가장 큰 문제는 분명히 배출의 전체 양이 아니라 배출의 종류이다.","enText":""},{"text":"Among all the difficulties, the sheer quantity of emissions may well be the largest.","isCorrect":false,"explanation":"올바름: 전치사구를 문두에 둔 구조로, 'may well be'가 추측을, 'the sheer quantity of emissions'가 배출 규모를 정확히 나타낸다.","translation":"모든 어려움 중에서, 순전히 엄청난 배출량이 아마 가장 큰 것일 것이다.","enText":""}],"passage":"Perhaps the biggest issue is simply the scale of emissions-the enormous amount of CO2 emitted into the atmosphere every year.","passageTranslation":"아마 가장 큰 문제는 단순히 배출의 규모, 즉 매년 대기 중으로 배출되는 막대한 양의 이산화탄소일 것이다."},{"questionNumber":21,"direction":"correct","sourceQuestion":"1번 지문","keyExpression":"some believe that we need to pursue multiple routes to slow climate change","questionText":"다음 중 'some believe that we need to pursue multiple routes to slow climate change'를 올바르게 paraphrasing한 것은?","qmode":"","options":[{"text":"Certain people argue that slowing climate change requires experimenting with a diverse range of approaches.","isCorrect":true,"explanation":"올바름: 'we need to pursue multiple routes to slow ~'를 'slowing climate change requires experimenting with a diverse range of approaches'로 바꾸었다. 동명사구를 주어로 재구성했고, 'some'을 'Certain people'로, 'multiple routes'를 'a diverse range of approaches'로 정확히 옮겼다.","translation":"일부 사람들은 기후 변화를 늦추려면 다양한 접근법을 시도해야 한다고 주장한다.","enText":""},{"text":"Some believe multiple routes are needed to adapt to climate change rather than slow it.","isCorrect":false,"explanation":"틀림: 여러 경로가 필요하다는 점은 같다. 그러나 목적을 '기후 변화를 늦추는 것'에서 '기후 변화에 적응하는 것'으로 바꾸었고, 'rather than'으로 원래 목적을 배제했다.","translation":"일부는 기후 변화를 늦추기보다는 그것에 적응하기 위해 여러 경로가 필요하다고 믿는다.","enText":""},{"text":"Pursuing many approaches, some argue, would only speed up climate change further.","isCorrect":false,"explanation":"틀림: 삽입절(some argue) 구조로 바꾸면서 'slow(늦추다)'를 'speed up(가속하다)'으로 반대로 비틀었다. 그 결과 여러 경로를 추구하는 것을 부정적으로 왜곡했다.","translation":"일부는 여러 접근법을 추구하는 것이 기후 변화를 더 가속할 뿐이라고 주장한다.","enText":""},{"text":"In the view of some, a single carefully selected strategy would suffice to curb climate change.","isCorrect":false,"explanation":"틀림: 'In the view of some'으로 도입부 구조를 바꾸었고, 'curb'로 '늦추다'의 의미는 유지했다. 그러나 'multiple routes(여러 경로)'를 'a single strategy(단 하나의 전략)'로, 'need to pursue'를 'would suffice(충분하다)'로 바꾸어 주장의 핵심을 뒤집었다.","translation":"일부의 견해로는, 신중히 선택된 단 하나의 전략이면 기후 변화를 억제하기에 충분하다.","enText":""},{"text":"Most experts agree that climate change can be stopped completely through multiple routes.","isCorrect":false,"explanation":"틀림: 'some(일부)'을 'most experts(대부분의 전문가)'로 확대했다. 또 'slow(늦추다)'를 'stopped completely(완전히 멈추다)'로 과장했다.","translation":"대부분의 전문가들은 여러 경로를 통해 기후 변화를 완전히 멈출 수 있다는 데 동의한다.","enText":""}],"passage":"Still, some believe that we need to pursue multiple routes to slow climate change.","passageTranslation":"그럼에도 일부는 기후 변화를 늦추기 위해 여러 경로를 추구할 필요가 있다고 믿는다."},{"questionNumber":22,"direction":"wrong","sourceQuestion":"1번 지문","keyExpression":"in an emerging field, most widely known today as 'climate engineering' or 'climate intervention' efforts","questionText":"다음 중 'in an emerging field, most widely known today as 'climate engineering' or 'climate intervention' efforts'를 잘못 paraphrasing한 것은?","qmode":"","options":[{"text":"Climate engineering or climate intervention is the name by which this new field is best known today.","isCorrect":false,"explanation":"올바름: 명칭을 주어로 내세우고 'the name by which ~'라는 관계절 구조로 바꾸었으며, '새 분야'와 '오늘날 가장 잘 알려진'의 의미를 모두 유지했다.","translation":"기후 공학 또는 기후 개입은 이 새로운 분야가 오늘날 가장 잘 알려진 이름이다.","enText":""},{"text":"an emerging area of study whose most popular labels today are climate engineering and climate intervention","isCorrect":false,"explanation":"올바름: 소유격 관계사 whose를 활용한 구조로, 'most widely known as'를 'most popular labels'로 바꾸어 같은 의미를 전달한다.","translation":"오늘날 가장 널리 쓰이는 명칭이 기후 공학과 기후 개입인 신생 연구 분야","enText":""},{"text":"a newly developing area now commonly called climate engineering or climate intervention","isCorrect":false,"explanation":"올바름: 'emerging field'를 'newly developing area', 'most widely known today as'를 'now commonly called'로 정확히 바꾸었다.","translation":"현재 흔히 기후 공학 또는 기후 개입이라 불리는 새롭게 발전하는 분야","enText":""},{"text":"a long-established field that was once called climate engineering but is now rarely mentioned","isCorrect":true,"explanation":"틀림: 'emerging(새로 부상하는)'을 'long-established(오래 확립된)'로 뒤집고, '오늘날 가장 널리 알려진'을 '과거에 그렇게 불렸지만 지금은 거의 언급되지 않는'으로 시점과 인지도를 반대로 비틀었다.","translation":"한때 기후 공학이라 불렸지만 지금은 거의 언급되지 않는, 오래전에 확립된 분야","enText":""},{"text":"a field still taking shape, which people today mostly refer to as climate engineering or climate intervention","isCorrect":false,"explanation":"올바름: 'emerging'을 'still taking shape'로, 분사 수식을 관계절(which people today mostly refer to as)로 바꾼 정확한 표현이다.","translation":"아직 형성 중인 분야로, 오늘날 사람들이 주로 기후 공학 또는 기후 개입이라 부르는 것","enText":""}],"passage":"However, some scientists began seriously considering ways to influence the climate system itself in an emerging field, most widely known today as “climate engineering” or “climate intervention” efforts.","passageTranslation":"그러나 일부 과학자들은 오늘날 '기후 공학' 또는 '기후 개입' 노력으로 가장 널리 알려진 신생 분야에서 기후 체계 그 자체에 영향을 미칠 방법을 진지하게 고려하기 시작했다."},{"questionNumber":23,"direction":"correct","sourceQuestion":"1번 지문","keyExpression":"On the atmospheric level, it works by making the atmosphere more reflective","questionText":"다음 중 'On the atmospheric level, it works by making the atmosphere more reflective'를 올바르게 paraphrasing한 것은?","qmode":"","options":[{"text":"Once the atmosphere grows more reflective on its own, the method naturally stops being necessary.","isCorrect":false,"explanation":"틀림: 원문에서 대기를 반사적으로 만드는 것은 이 방법이 하는 '행위'인데, 대기가 '저절로(on its own)' 반사적으로 변하는 것으로 행위 주체를 바꾸었다. 조건절 구조로 인과 관계까지 왜곡했다.","translation":"대기가 저절로 더 반사적으로 되면 그 방법은 자연스럽게 필요 없어진다.","enText":""},{"text":"By reducing the atmosphere's reflectivity, the approach allows more sunlight to reach the ground.","isCorrect":false,"explanation":"틀림: 'more reflective'를 '반사율을 줄임(reducing reflectivity)'으로 반대로 바꾸었다. 그 결과 햇빛이 지표에 덜 닿게 하려는 원래 목적과 정반대인 '더 많은 햇빛이 지면에 닿게 한다'는 내용이 되었다.","translation":"대기의 반사율을 줄임으로써, 그 접근법은 더 많은 햇빛이 지면에 도달하게 한다.","enText":""},{"text":"Every level of this approach depends entirely on making the atmosphere more reflective.","isCorrect":false,"explanation":"틀림: 원문은 '대기 차원'에 한정된 설명인데, 'Every level'과 'entirely'를 넣어 적용 범위를 모든 차원으로 확대했다. 지상 차원의 방법(지붕 도색 등)은 대기를 반사적으로 만드는 것이 아니다.","translation":"이 접근법의 모든 차원은 전적으로 대기를 더 반사적으로 만드는 데 달려 있다.","enText":""},{"text":"Making the earth's surface more reflective is how this method operates within the atmosphere.","isCorrect":false,"explanation":"틀림: 원문은 '대기'를 더 반사적으로 만드는 방식인데, 반사 대상을 '지표면(earth's surface)'으로 바꾸었다. 지상 차원의 방법과 대기 차원의 방법을 뒤섞은 오답이며, 명사구 주어 구문으로 구조도 바꾸었다.","translation":"지표면을 더 반사적으로 만드는 것이 이 방법이 대기 안에서 작동하는 방식이다.","enText":""},{"text":"In the atmosphere, this method functions by enhancing the air's capacity to reflect incoming sunlight.","isCorrect":true,"explanation":"올바름: 'On the atmospheric level'을 'In the atmosphere'로, 'works by'를 'functions by'로, 'making the atmosphere more reflective'를 '들어오는 햇빛을 반사하는 대기의 능력을 높임'으로 정확히 바꾸어 표현했다.","translation":"대기에서 이 방법은 들어오는 햇빛을 반사하는 대기의 능력을 높이는 방식으로 작동한다.","enText":""}],"passage":"On the atmospheric level, it works by making the atmosphere more reflective so that the sun's light is scattered before it reaches the earth's surface.","passageTranslation":"대기 차원에서 그것은 대기를 더 반사적으로 만들어, 햇빛이 지표면에 도달하기 전에 흩어지게 하는 방식으로 작동한다."},{"questionNumber":24,"direction":"wrong","sourceQuestion":"1번 지문","keyExpression":"One centers on slowing down global warming","questionText":"다음 중 'One centers on slowing down global warming'을 잘못 paraphrasing한 것은?","qmode":"","options":[{"text":"One approach is built around completely reversing global warming rather than merely delaying it.","isCorrect":true,"explanation":"틀림: 원문은 온난화를 '늦추는(slowing down)' 것에 초점을 두는데, 이 보기는 '완전히 되돌리는(completely reversing)' 것으로 목표의 정도를 과장했다. 'rather than merely delaying it'으로 원래 의미인 '늦추기'를 오히려 부정하여 의미가 정반대로 틀어졌다.","translation":"한 접근법은 단지 지연시키는 것이 아니라 지구 온난화를 완전히 되돌리는 것을 중심으로 구성된다.","enText":""},{"text":"What one approach primarily aims for is a slower progression of global warming.","isCorrect":false,"explanation":"올바름: what 명사절 구조로 바꾸어 '주로 목표로 하는 것은 온난화의 더 느린 진행'이라고 표현했으며, 원문의 의미와 같다.","translation":"한 접근법이 주로 목표로 하는 것은 지구 온난화의 더 느린 진행이다.","enText":""},{"text":"Of the two strategies, one focuses mainly on making global warming proceed more gradually.","isCorrect":false,"explanation":"올바름: 'centers on'을 'focuses mainly on'으로, 'slowing down'을 '더 점진적으로 진행되게 함'으로 바꾸어 같은 의미를 전달한다.","translation":"두 전략 중 하나는 주로 지구 온난화가 더 점진적으로 진행되게 하는 데 초점을 둔다.","enText":""},{"text":"The first approach is chiefly concerned with reducing the pace of global warming.","isCorrect":false,"explanation":"올바름: 'centers on'을 'is chiefly concerned with'로, 'slowing down'을 'reducing the pace'로 정확히 바꾸어 표현했다.","translation":"첫 번째 접근법은 주로 지구 온난화의 속도를 줄이는 데 관심을 둔다.","enText":""},{"text":"Slowing the rate at which the planet warms lies at the heart of one approach.","isCorrect":false,"explanation":"올바름: 'centers on'을 'lies at the heart of'로 바꾸고, 동명사구를 주어로 앞세운 구조이다. '지구가 더워지는 속도를 늦춘다'는 원문의 의미와 같다.","translation":"지구가 더워지는 속도를 늦추는 것이 한 접근법의 핵심에 있다.","enText":""}],"passage":"There have been two main approaches aimed at preventing undesired warming. One centers on slowing down global warming by reflecting some of the sun's rays back into space before they can warm the earth.","passageTranslation":"원치 않는 온난화를 막는 것을 목표로 한 두 가지 주요 접근법이 있어 왔다. 하나는 태양 광선의 일부가 지구를 데우기 전에 우주로 다시 반사시켜 지구 온난화를 늦추는 데 초점을 둔다."},{"questionNumber":25,"direction":"correct","sourceQuestion":"1번 지문","keyExpression":"While there have been generations of efforts","questionText":"다음 중 'While there have been generations of efforts'를 올바르게 paraphrasing한 것은?","qmode":"","options":[{"text":"Precisely because successive generations have striven to reshape the weather,","isCorrect":false,"explanation":"틀림: 여러 세대에 걸친 노력이라는 내용은 비슷하지만, 양보의 'While(~이긴 하지만)'을 원인의 'Precisely because(바로 ~ 때문에)'로 바꾸었다. 그 결과 뒤 내용(대부분 보여주기에 그쳤다)과의 논리 관계가 대조에서 인과로 틀어졌다.","translation":"바로 여러 세대가 연이어 날씨를 바꾸려고 분투해 왔기 때문에,","enText":""},{"text":"Even if future generations were to attempt to adjust the weather in their favor,","isCorrect":false,"explanation":"틀림: 'Even if + were to' 가정 구문을 써서, 과거부터 실제로 이어져 온 노력을 '미래 세대가 혹시 시도한다면'이라는 가상의 일로 바꾸었다. 시제(과거→미래)와 사실성(실제→가정)이 모두 원문과 다르다.","translation":"설령 미래 세대가 날씨를 자신들에게 유리하게 조정하려고 시도한다 하더라도,","enText":""},{"text":"Granted that the weather has only recently become a target of human manipulation,","isCorrect":false,"explanation":"틀림: 'Granted that(~임을 인정하더라도)'으로 양보의 기능은 살렸지만, 여러 세대에 걸쳐 이어져 온 노력을 '최근에야 비로소(only recently)' 시작된 일로 바꾸었다. 시간 범위가 크게 축소되어 원문과 의미가 다르다.","translation":"날씨가 최근에야 인간이 조작하려는 대상이 되었다는 점은 인정하더라도,","enText":""},{"text":"Despite a solitary, short-lived attempt to tame the weather in a bygone generation,","isCorrect":false,"explanation":"틀림: 'Despite + 명사구'로 양보의 의미는 유지했지만, 여러 세대에 걸친 복수의 노력(generations of efforts)을 '지난 한 세대의 단 한 번, 단기간의 시도(a solitary, short-lived attempt)'로 축소했다. 지속성과 반복성이 사라졌다.","translation":"지나간 한 세대에 날씨를 길들이려 했던 단 한 번의 짧은 시도에도 불구하고,","enText":""},{"text":"Although humankind has, over successive generations, endeavored to manipulate the weather to its advantage,","isCorrect":true,"explanation":"올바름: 양보의 'While'을 'Although'로 바꾸었고, 'generations of efforts'를 '여러 세대에 걸쳐 거듭 시도해 왔다(over successive generations, endeavored)'로 정확히 풀어 썼다. 오랜 시도의 역사를 인정하면서 뒤에서 그 효과를 문제 삼는 양보절의 기능도 그대로 유지된다.","translation":"인류가 여러 세대에 걸쳐 날씨를 자신에게 유리하게 조작하려고 애써 왔지만,","enText":""}],"passage":"While there have been generations of efforts to adjust weather in our favor, most of them were more theatrical than effective.","passageTranslation":"날씨를 우리에게 유리하게 조정하려는 노력이 여러 세대에 걸쳐 있어 왔지만, 그것들 대부분은 효과적이기보다는 보여주기식이었다."}]};

function setH(t,s){var h=el("hTitle"),p=el("hSub");if(h)h.textContent=t;if(p)p.textContent=s;}
function _p2(n){return(n<10?"0":"")+n;}
function _fmtRange(a,b){function dd(x){return x.getFullYear()+"-"+_p2(x.getMonth()+1)+"-"+_p2(x.getDate());}function tt(x){return _p2(x.getHours())+":"+_p2(x.getMinutes());}var ds=dd(a),de=dd(b);return ds===de?(ds+" "+tt(a)+"~"+tt(b)):(ds+" "+tt(a)+"~"+de+" "+tt(b));}
function renderWorksheet(){
  var root=el("wsRoot");var html="";
  QS.forEach(function(q,qi){
    var qid="q"+(qi+1);
    var ansIdx=-1;for(var i=0;i<q.options.length;i++){if(q.options[i].isCorrect){ansIdx=i;break;}}
    var dir=(q.direction==="correct")?"correct":"wrong";
    var dirBadge=(dir==="correct")?"<span class='dir ok'>✅ 올바른 표현 고르기</span>":"<span class='dir warn'>⚠️ 잘못된 표현 고르기</span>";
    if(q.qmode==="ko")dirBadge="<span class='dir warn'>🇰🇷 해석 고르기</span>";
    var opts=q.options.map(function(o,i){return "<label class='opt' data-oi='"+i+"'><input type='radio' name='"+qid+"' data-role='choice' value='"+(i+1)+"'><span class='onum'>"+CIRCLED[i]+"</span><span class='otext'>"+esc(o.text)+"</span></label>";}).join("");
    var passage=q.passage?("<button type='button' class='pg-btn' onclick='togglePg(this)'>📄 지문 보기</button><div class='pg' style='display:none'>"+esc(q.passage)+(q.passageTranslation?"<div class='pg-ko'>"+esc(q.passageTranslation)+"</div>":"")+"</div>"):"";
    var ex="<div class='q-explain'><div class='ex-correct'>정답: "+(ansIdx>=0?CIRCLED[ansIdx]:"?")+"</div>"+q.options.map(function(o,i){var tag=o.isCorrect?"<span class='tag ok'>정답</span>":"<span class='tag no'>오답</span>";return "<div class='ex-item"+(o.isCorrect?" is-ans":"")+"'>"+CIRCLED[i]+" "+esc(o.text)+" "+tag+(o.explanation?"<div class='ex-why'>"+esc(o.explanation)+"</div>":"")+(o.translation?"<div class='ex-ko'>→ "+esc(o.translation)+"</div>":"")+"</div>";}).join("")+"</div>";
    html+="<div class='q' data-qid='"+qid+"' data-qtype='choice' data-points='1' data-answer='"+(ansIdx+1)+"'>"+"<div class='q-head'><span class='qtag'>"+(qi+1)+"</span>"+dirBadge+"<span class='q-badge-host'></span></div>"+"<div class='q-key'>“"+esc(q.keyExpression)+"”</div>"+"<div class='q-text'>"+esc(q.questionText||"")+"</div>"+passage+"<div class='opts'>"+opts+"</div>"+ex+"</div>";
  });
  root.innerHTML=html;
  [].slice.call(root.querySelectorAll(".opt input")).forEach(function(inp){inp.addEventListener("change",function(){var host=inp.closest(".q");[].slice.call(host.querySelectorAll(".opt")).forEach(function(l){l.classList.remove("sel");});var lb=inp.closest(".opt");if(lb)lb.classList.add("sel");});});
}
function togglePg(btn){var b=btn.nextSibling;if(!b)return;if(b.style.display==="none"){b.style.display="block";btn.textContent="📄 지문 숨기기";}else{b.style.display="none";btn.textContent="📄 지문 보기";}}
function _collect(){var locked=window.__WS_LOCKED||{};var rows=[].slice.call(document.querySelectorAll("[data-qid]")).filter(function(r){return !locked[r.getAttribute("data-qid")];});var out=[],objE=0,objM=0;rows.forEach(function(r){var qid=r.getAttribute("data-qid");var pts=+(r.getAttribute("data-points")||0);var sc=r.querySelector("[data-role=choice]:checked");var rec={qid:qid,type:"choice",max:pts,student:sc?sc.value:"",answer:r.getAttribute("data-answer")||"",autoGraded:true};rec.correct=(rec.student!==""&&rec.student===rec.answer);rec.awarded=rec.correct?pts:0;objE+=rec.awarded;objM+=pts;out.push(rec);});return {answers:out,objEarned:objE,objMax:objM};}
function _payload(){var d=_collect();var nm=document.querySelector("[data-role=studentName]");var gr=document.querySelector("[data-role=grade]");var end=new Date();var start=window.__WS_START||end;return {testName:WSC.testName,level:WSC.level,student:nm?nm.value.trim():"",grade:gr?gr.value.trim():"",threshold:WSC.threshold,startedAt:start.toISOString(),submittedAt:end.toISOString(),timeRange:_fmtRange(start,end),objectiveEarned:d.objEarned,objectiveMax:d.objMax,subjectiveMax:0,questions:d.answers};}
function _setReveal(on){var r=el("wsRoot");r.classList.toggle("answer-mode",on);var s=el("bSubmit");if(s)s.disabled=on;}
function _clearMarks(){[].slice.call(document.querySelectorAll(".opt")).forEach(function(l){l.classList.remove("correct","wrong");});[].slice.call(document.querySelectorAll(".q-badge-host")).forEach(function(b){b.innerHTML="";});}
function _markResults(ans){ans.forEach(function(rec){var host=qHost(rec.qid);if(!host)return;var bh=host.querySelector(".q-badge-host");if(bh)bh.innerHTML=rec.correct?"<span class='qres ok'>✅ 정답</span>":"<span class='qres no'>❌ 오답</span>";[].slice.call(host.querySelectorAll(".opt")).forEach(function(lb){var inp=lb.querySelector("[data-role=choice]");if(!inp)return;if(inp.value===rec.answer)lb.classList.add("correct");if(inp.checked&&!rec.correct)lb.classList.add("wrong");});});}
function _storeKey(){var nm=document.querySelector("[data-role=studentName]");var name=(nm?nm.value.trim():"")||"(익명)";return "pqRetry::"+WSC.testName+"::"+WSC.level+"::"+name;}
function _loadAttempt(){try{var r=localStorage.getItem(_storeKey());return r?JSON.parse(r):null;}catch(e){return null;}}
function _saveAttempt(o){try{localStorage.setItem(_storeKey(),JSON.stringify(o));}catch(e){}}
function _clearAttempt(){try{localStorage.removeItem(_storeKey());}catch(e){}}
function _saveMerged(prevLocked,round){var items={};Object.keys(prevLocked||{}).forEach(function(k){items[k]=prevLocked[k];});round.forEach(function(rec){items[rec.qid]={max:rec.max,awarded:rec.awarded,student:rec.student};});var tM=0,tE=0,anyOpen=false;Object.keys(items).forEach(function(k){var it=items[k];tM+=it.max;var full=it.max>0&&it.awarded>=it.max;if(full)tE+=it.max;else{tE+=(it.awarded||0);anyOpen=true;}});_saveAttempt({items:items,updatedAt:new Date().toISOString()});return {totalEarned:tE,totalMax:tM,anyOpen:anyOpen};}
function _refreshRetryBtn(){var btn=el("bRetryWrong");if(!btn)return;var prev=_loadAttempt();var anyOpen=false;if(prev&&prev.items){Object.keys(prev.items).forEach(function(k){var it=prev.items[k];var full=it.max>0&&it.awarded>=it.max;if(!full)anyOpen=true;});}btn.classList.toggle("show",!!(prev&&anyOpen));}
function _banner(main,sub,cls){var box=el("scoreBanner");if(!box)return;el("sbMain").innerHTML=main;el("sbSub").innerHTML=sub||"";box.className="score-banner show"+(cls?(" "+cls):"");}
function _setRetryBanner(h){var b=el("retryBanner");if(b){b.innerHTML=h||"";b.className="retry-banner"+(h?" show":"");}}
function _setLocked(host,locked,info){host.classList.toggle("locked",locked);var bh=host.querySelector(".q-badge-host");if(bh)bh.innerHTML=locked?("<span class='lock-label'>🔒 이전 정답("+(info?info.awarded:0)+"/"+(info?info.max:0)+")</span>"):"";[].slice.call(host.querySelectorAll("input")).forEach(function(i){i.disabled=locked;});}
function submitTest(){
  if(el("wsRoot").classList.contains("answer-mode")){alert("이미 제출되었습니다. 🎯 오답만 재시험 또는 🔁 전체 초기화를 이용하세요.");return;}
  var nm=document.querySelector("[data-role=studentName]");if(nm&&!nm.value.trim()){alert("이름을 입력해주세요. (재시험 복원에 사용됩니다)");nm.focus();return;}
  var locked=window.__WS_LOCKED||{};var p=_payload();
  var unanswered=p.questions.filter(function(q){return !q.student;}).length;
  if(unanswered>0&&!confirm("아직 "+unanswered+"문제가 비어있습니다. 그래도 제출할까요?"))return;
  _setReveal(true);_markResults(p.questions);
  var merged=_saveMerged(locked,p.questions);var pct=merged.totalMax?Math.round(merged.totalEarned/merged.totalMax*100):0;var pass=pct>=WSC.threshold;var perfect=!merged.anyOpen;
  var main=(perfect?"🎉 만점!":(pass?"✅ 통과":"❌ 미통과"))+" — "+merged.totalEarned+" / "+merged.totalMax+"점 ("+pct+"%)";
  var sub="기준 "+WSC.threshold+"% · 각 문제 아래에 정답과 해설이 공개되었습니다."+(perfect?" 🎉 모두 맞혔어요!":" 🎯 틀린 문제는 아래 재시험 버튼으로 다시 풀 수 있어요.");
  _banner(main,sub,pass?"pass":"fail");_refreshRetryBtn();
  var box=el("scoreBanner");if(box)box.scrollIntoView({behavior:"smooth",block:"start"});
  if(WSC.endpoint){var sb=el("sbSub");try{fetch(WSC.endpoint,{method:"POST",body:JSON.stringify(p)}).then(function(r){return r.json();}).then(function(res){if(sb)sb.innerHTML=sub+" · 🗂️ 결과가 구글시트에 기록되었습니다.";}).catch(function(){if(sb)sb.innerHTML=sub+" · (시트 전송 응답을 확인하지 못했습니다 — 전송은 되었을 수 있습니다.)";});}catch(e){}}
}
function startRetryMode(){
  var prev=_loadAttempt();if(!prev||!prev.items){alert("이전 제출 기록이 없습니다. 이름을 이전과 똑같이 입력했는지 확인하세요.");return;}
  var items=prev.items,lockedMap={},anyOpen=false;Object.keys(items).forEach(function(k){var it=items[k];var full=it.max>0&&it.awarded>=it.max;if(full)lockedMap[k]=it;else anyOpen=true;});
  if(!anyOpen){alert("🎉 모든 문제가 이미 만점입니다!");return;}
  window.__WS_LOCKED=lockedMap;_setReveal(false);el("scoreBanner").className="score-banner";_clearMarks();
  [].slice.call(document.querySelectorAll("[data-qid]")).forEach(function(host){var qid=host.getAttribute("data-qid");_setLocked(host,!!lockedMap[qid],items[qid]);if(!lockedMap[qid]){[].slice.call(host.querySelectorAll(".opt")).forEach(function(l){l.classList.remove("sel");});[].slice.call(host.querySelectorAll("input")).forEach(function(i){i.checked=false;});}});
  window.__WS_START=new Date();el("bSubmit").textContent="✅ 재시험 제출";el("bSubmit").disabled=false;el("bRetryWrong").classList.remove("show");
  _setRetryBanner("🎯 <b>재시험 모드</b> — 🔒 표시된 문제는 이전에 맞혔어 잠겼습니다. 나머지 문제만 다시 풀고 아래 재시험 제출을 누르세요.");
  var root=el("wsRoot");if(root)root.scrollIntoView({behavior:"smooth",block:"start"});
}
function resetAll(){if(!confirm("처음부터 다시 풀까요? 이전 기록이 삭제됩니다."))return;window.__WS_LOCKED={};_clearAttempt();window.__WS_START=new Date();_setReveal(false);el("scoreBanner").className="score-banner";_setRetryBanner("");el("bSubmit").textContent="✅ 제출하고 채점하기";el("bSubmit").disabled=false;el("bRetryWrong").classList.remove("show");renderWorksheet();window.scrollTo(0,0);}
setH(WSC.testName,"Paraphrasing 표현 테스트 · 총 "+QS.length+"문제");
renderWorksheet();_refreshRetryBtn();
</script>
</body>
</html>
