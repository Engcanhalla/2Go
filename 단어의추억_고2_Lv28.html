<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고2 Lv.28</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}
  /* 첫글자 프리필 인풋 — 미리 채워진 첫 글자를 시각적으로 강조 */
  .prefill-input{caret-color:#fef3c7;font-family:'Courier New',ui-monospace,monospace;letter-spacing:.05em;font-weight:700;}
  .prefill-hint{color:#c4b5fd;font-size:.82rem;font-weight:500;margin-left:6px;letter-spacing:0;}
  /* ---------- 낱말박스 (자동완성 방어) ---------- */
  .word-answer{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;margin:6px 0;}
  .word-answer.inline{display:inline-flex;gap:8px;vertical-align:middle;margin:0 4px;}
  .word-group{
    display:inline-flex;align-items:center;gap:0;
    background:rgba(11,18,32,.7);border:1.5px solid #334155;border-radius:8px;
    padding:0;transition:all .15s;overflow:hidden;flex-shrink:0;
  }
  .word-group:focus-within{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(168,139,250,.22);}
  .word-group.correct{border-color:var(--grade);background:rgba(16,185,129,.10);}
  .word-group.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);}
  /* 폰트: body 상속 sans-serif (이전 .input-box input과 동일한 스타일) */
  .first-letter{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;padding:0 8px;height:44px;line-height:44px;
    background:linear-gradient(180deg,#3b2966 0%,#2a1e4d 100%);
    color:#fef3c7;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    border-right:1px solid #8b5cf6;user-select:none;
  }
  .rest-input{
    border:0;background:transparent;color:var(--text);outline:none;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    padding:0 10px;height:44px;line-height:44px;width:120px;min-width:90px;
    text-transform:lowercase;
  }
  .rest-input::placeholder{color:#475569;font-weight:400;}
  .word-group.correct .rest-input{color:#a7f3d0;}
  .word-group.wrong .rest-input{color:#fca5a5;}
  .cloze-sentence .word-answer{display:inline-flex;flex-wrap:wrap;gap:6px 8px;margin:0 4px;vertical-align:middle;}
  .cloze-sentence .word-group{border-radius:6px;}
  .cloze-sentence .first-letter{height:38px;line-height:38px;font-size:1.05rem;min-width:22px;padding:0 7px;}
  .cloze-sentence .rest-input{height:38px;line-height:38px;font-size:1.05rem;width:100px;min-width:70px;padding:0 9px;}
  /* .input-box input 스타일이 .rest-input을 override 하는 문제 해결 */
  .input-box .word-answer input.rest-input{
    background:transparent;border:0;padding:0 10px;
    min-height:44px;height:44px;line-height:44px;text-align:left;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    width:120px;min-width:90px;box-shadow:none;
  }
  .input-box .word-answer input.rest-input:focus{border:0;box-shadow:none;}
  /* single-letter 그룹 */
  .word-group.single-letter{background:rgba(11,18,32,.5);}
  .word-group.single-letter input.rest-input{width:80px;min-width:60px;}
  .hint-line{margin-top:12px;padding:10px 14px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35);border-radius:10px;color:#c4b5fd;font-size:.95rem;line-height:1.55;text-align:center;letter-spacing:.03em;}
  .hint-line b{color:#fef3c7;font-weight:800;font-family:'Courier New',ui-monospace,monospace;font-size:1.05rem;letter-spacing:.15em;margin:0 2px;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}
  .buddy-item .why{font-size:.86rem;color:var(--back-muted);opacity:1;display:block;width:100%;margin-top:3px;font-style:italic;}
  .ex-line{font-size:1.03rem;line-height:1.55;}
  .ex-line .en{color:#f8fafc;font-style:italic;font-weight:500;}
  .ex-line .ko{color:var(--back-muted-strong);font-size:.94rem;display:block;margin-top:4px;font-weight:500;}
  /* 콜로케이션·예문 재생 버튼 */
  .speak-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;flex:0 0 26px;
    padding:0;margin-right:8px;
    border:1px solid rgba(59,130,246,.35);
    background:rgba(59,130,246,.10);
    color:var(--info);
    font-size:.78rem;line-height:1;
    border-radius:8px;cursor:pointer;
    transition:var(--transition);
  }
  .speak-btn:hover{
    background:rgba(59,130,246,.22);
    border-color:rgba(59,130,246,.55);
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(59,130,246,.20);
  }
  .speak-btn:active{transform:translateY(0);}
  .col-item .en, .ex-line .en{flex:1 1 auto;min-width:0;}
  .ex-line{display:flex;flex-wrap:wrap;align-items:baseline;}

  /* Grade buttons */
  .grade-row{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
    margin-top:14px;
  }
  .grade-btn{
    padding:15px 6px;border-radius:var(--radius-md);
    font-weight:700;font-size:.92rem;
    min-height:56px;
    border:1.5px solid transparent;
    transition:all var(--transition);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .grade-btn .ic{font-size:20px;line-height:1;}
  .grade-btn.prev{background:rgba(59,130,246,.14);color:#93c5fd;border-color:rgba(59,130,246,.35);}
  .grade-btn.home{background:rgba(245,158,11,.12);color:var(--accent-light);border-color:rgba(245,158,11,.30);}
  .grade-btn.next{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.40);}
  .grade-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
  .grade-btn.prev:hover{box-shadow:0 6px 16px rgba(59,130,246,.25);}
  .grade-btn.home:hover{box-shadow:0 6px 16px rgba(245,158,11,.20);}
  .grade-btn.next:hover{box-shadow:0 6px 16px rgba(16,185,129,.30);}
  .grade-btn:active{transform:translateY(0) scale(.97);}
  .grade-btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6);}
  .grade-btn:disabled:hover{transform:none;box-shadow:none;filter:grayscale(.6);}

  .flip-hint{
    text-align:center;color:var(--text-on-dark-muted);
    font-size:.72rem;margin-top:10px;opacity:.6;letter-spacing:.02em;
  }

  /* ---------- QUIZ ---------- */
  .quiz-stage{padding:12px 2px;flex:1;display:flex;flex-direction:column;}
  .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .quiz-num{
    background:var(--bg-card);padding:7px 14px;border-radius:100px;
    font-size:.82rem;font-weight:600;
    border:1px solid rgba(148,163,184,.15);
    color:var(--text-on-dark-muted);
  }
  .quiz-num b{color:var(--grade);font-weight:700;}
  .quiz-mode{
    background:rgba(245,158,11,.12);color:var(--accent-light);
    padding:6px 12px;border-radius:100px;
    font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.22);
  }
  .quiz-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:24px 20px;
    box-shadow:var(--shadow-lg);
    min-height:320px;display:flex;flex-direction:column;
  }
  .quiz-prompt{
    text-align:center;margin-bottom:20px;
  }
  .quiz-prompt .label{
    font-size:.68rem;color:var(--text-on-dark-muted);
    text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:10px;
  }
  .quiz-prompt .qword{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.2rem;font-weight:800;color:var(--text-on-dark);
    line-height:1.15;word-break:break-word;letter-spacing:-1px;
    text-shadow:0 0 24px rgba(16,185,129,.20);
  }
  .quiz-prompt .qkr{font-size:1.5rem;font-weight:700;color:var(--accent-light);line-height:1.3;}
  .quiz-prompt .qph{color:var(--text-on-dark-muted);font-size:.88rem;margin-top:6px;font-style:italic;}
  .quiz-prompt .lis-btn{
    margin:10px auto 0;display:flex;
    background:linear-gradient(135deg, var(--info) 0%, #2563eb 100%);
    color:#ffffff;font-weight:700;font-size:.95rem;
    padding:14px 24px;border-radius:var(--radius-md);align-items:center;gap:8px;
    box-shadow:0 6px 20px rgba(59,130,246,.35), inset 0 1px 0 rgba(255,255,255,.15);
    min-height:48px;transition:all var(--transition);
  }
  .quiz-prompt .lis-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(59,130,246,.42);}
  .quiz-prompt .lis-btn:active{transform:translateY(0) scale(.97);}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.12);
    border-radius:var(--radius-md);padding:14px 16px;
    text-align:left;font-size:.98rem;font-weight:600;color:var(--text-on-dark);
    transition:all var(--transition);
    display:flex;align-items:center;gap:12px;
    min-height:52px;line-height:1.3;
  }
  .choice:hover{background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.22);transform:translateY(-1px);}
  .choice .idx{
    flex-shrink:0;width:26px;height:26px;border-radius:var(--radius-sm);
    background:rgba(148,163,184,.14);color:var(--text-on-dark-muted);
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:700;
    transition:all var(--transition);
  }
  .choice:active{transform:scale(.98);}
  .choice.correct{background:rgba(16,185,129,.16);border-color:var(--grade);color:#a7f3d0;box-shadow:0 4px 16px rgba(16,185,129,.20);}
  .choice.correct .idx{background:var(--grade);color:#0f172a;}
  .choice.wrong{background:rgba(239,68,68,.14);border-color:var(--danger);color:#fca5a5;}
  .choice.wrong .idx{background:var(--danger);color:#fff;}
  .choice.dimmed{opacity:.4;}
  body.cb-mode .choice.correct::after{content:"✓";margin-left:auto;font-size:22px;font-weight:900;}
  body.cb-mode .choice.wrong::after{content:"✕";margin-left:auto;font-size:22px;font-weight:900;}

  .input-box{
    display:flex;flex-direction:column;gap:12px;margin-top:6px;
  }
  .input-box input{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.15);
    border-radius:var(--radius-md);padding:16px;
    color:var(--text-on-dark);font-size:1.15rem;font-weight:600;
    text-align:center;letter-spacing:.5px;
    min-height:52px;outline:none;
    transition:all var(--transition);
  }
  .input-box input:focus{border-color:var(--grade);box-shadow:0 0 0 4px rgba(16,185,129,.15);}
  .input-box input.correct{border-color:var(--grade);background:rgba(16,185,129,.10);color:#a7f3d0;}
  .input-box input.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);color:#fca5a5;}
  .submit-btn{
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1rem;
    padding:15px;border-radius:var(--radius-md);min-height:52px;
    box-shadow:0 6px 20px rgba(16,185,129,.30), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);
  }
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,185,129,.40);}
  .submit-btn:active{transform:translateY(0) scale(.98);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .feedback{
    text-align:center;margin-top:16px;
    min-height:24px;font-weight:700;font-size:.92rem;
    letter-spacing:.02em;
  }
  .feedback.ok{color:#6ee7b7;}
  .feedback.bad{color:#fca5a5;}

  /* ---------- RESULT ---------- */
  .result{text-align:center;padding:20px 4px;}
  .result h2{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2rem;margin:10px 0 6px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg, var(--accent) 0%, var(--grade) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .result .score-big{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:4rem;font-weight:900;line-height:1;
    margin:20px 0 6px;color:var(--grade);letter-spacing:-2px;
    text-shadow:0 0 40px var(--grade-glow-strong);
  }
  .result .score-pct{color:var(--text-on-dark-muted);font-size:1.1rem;font-weight:600;}
  .result .score-time{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:10px;padding:8px 16px;border-radius:var(--radius-lg);
    background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.20);
    color:#f8fafc;font-size:1.05rem;font-weight:600;letter-spacing:.02em;
  }
  .result .score-time b{color:var(--accent-light);font-weight:800;font-variant-numeric:tabular-nums;}
  /* 심화 90%+ 배곧 쵝오 배너 */
  .grand-banner{
    position:relative;margin:14px auto 4px;padding:16px 22px;max-width:520px;
    border-radius:var(--radius-lg);
    background:linear-gradient(135deg,#7c3aed 0%,#db2777 45%,#f59e0b 100%);
    box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;
    text-align:center;overflow:hidden;
    animation:grandPop .8s cubic-bezier(.2,.7,.1,1.4) both, grandGlow 2s ease-in-out infinite alternate;
  }
  .grand-banner::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 50%),
               radial-gradient(circle at 70% 80%, rgba(255,255,255,.25), transparent 50%);
    pointer-events:none;
  }
  .grand-banner .grand-line{
    font-size:1.65rem;font-weight:900;color:#fff;letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.35);position:relative;
  }
  .grand-banner .grand-line b{
    background:linear-gradient(135deg,#fde68a 0%,#fbbf24 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;padding:0 4px;
  }
  .grand-banner .grand-sub{
    margin-top:6px;color:rgba(255,255,255,.95);
    font-size:.98rem;font-weight:700;letter-spacing:.02em;position:relative;
  }
  @keyframes grandPop{
    0%{transform:scale(.7) rotate(-3deg);opacity:0;}
    60%{transform:scale(1.06) rotate(1deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes grandGlow{
    from{box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;}
    to  {box-shadow:0 20px 60px rgba(245,158,11,.65),0 0 0 1px rgba(255,255,255,.35) inset;}
  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:hgFadeIn .35s ease-out both, hgFadeOut .8s ease-in 5.2s forwards;
  }
  .hg-celebration::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),
      radial-gradient(circle at 80% 25%, rgba(236,72,153,.28), transparent 22%),
      radial-gradient(circle at 30% 75%, rgba(59,130,246,.28), transparent 24%),
      radial-gradient(circle at 75% 80%, rgba(16,185,129,.28), transparent 22%);
    animation:hgSwirl 6s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .hg-halo{
    position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg,#fbbf24,#ef4444,#a855f7,#3b82f6,#10b981,#fbbf24);
    mix-blend-mode:screen;opacity:.28;
    animation:hgRotate 12s linear infinite;
  }
  .hg-msg{
    position:relative;font-family:inherit;
    font-size:clamp(28px, 6vw, 68px);font-weight:900;line-height:1.25;text-align:center;
    padding:32px 40px;max-width:92vw;letter-spacing:-.01em;
    background:linear-gradient(90deg,#fbbf24,#ef4444,#ec4899,#a855f7,#3b82f6,#10b981,#fbbf24);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(251,191,36,.75)) drop-shadow(0 0 40px rgba(236,72,153,.45));
    animation:hgRainbow 3.5s linear infinite, hgPop 1.6s cubic-bezier(.2,.7,.1,1.4) both, hgFloat 4s ease-in-out infinite alternate 1.6s;
  }
  .hg-sparkle{
    position:absolute;pointer-events:none;font-size:clamp(24px,3vw,36px);
    animation:hgSparkle 1.8s ease-in-out infinite;
  }
  @keyframes hgFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes hgFadeOut{to{opacity:0;visibility:hidden;}}
  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  @keyframes hgPop{
    0%{transform:scale(.15) rotate(-25deg);opacity:0;}
    35%{transform:scale(1.28) rotate(6deg);opacity:1;}
    55%{transform:scale(.94) rotate(-3deg);}
    75%{transform:scale(1.08) rotate(1.5deg);}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes hgFloat{
    from{transform:translateY(-6px) scale(1);}
    to{transform:translateY(6px) scale(1.02);}
  }
  @keyframes hgSwirl{
    0%{transform:scale(1) rotate(0);}
    100%{transform:scale(1.15) rotate(8deg);}
  }
  @keyframes hgRotate{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes hgSparkle{
    0%,100%{opacity:0;transform:scale(.4) rotate(0deg);}
    50%{opacity:1;transform:scale(1.2) rotate(180deg);}
  }
  .result-stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:22px 0;
  }
  .result-stat{
    background:var(--bg-card);padding:16px 12px;border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.10);
    box-shadow:var(--shadow-md);
    transition:transform var(--transition);
  }
  .result-stat:hover{transform:translateY(-2px);}
  .result-stat .l{font-size:.68rem;color:var(--text-on-dark-muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;}
  .result-stat .v{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.4rem;font-weight:800;color:var(--text-on-dark);margin-top:6px;}
  .result-stat .v.grade-c{color:var(--grade);}
  .result-stat .v.acc-c{color:var(--accent-light);}
  .badges-earned{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 20px;
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-card);padding:8px 14px;border-radius:100px;
    font-size:.82rem;font-weight:700;
    border:1px solid var(--accent);color:var(--accent-light);
    box-shadow:0 0 16px rgba(245,158,11,.22), 0 4px 12px rgba(0,0,0,.3);
    animation:badge-pop .5s cubic-bezier(.2,.7,.1,1.4) backwards;
  }
  .badge .ic{font-size:1.1rem;}
  @keyframes badge-pop{from{transform:scale(.4) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ---------- ANIMATIONS ---------- */
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  @keyframes bounce-correct{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .shake{animation:shake .22s ease;}
  .bounce-correct{animation:bounce-correct .32s ease;}

  /* ---------- CANVAS (particles) ---------- */
  #fxCanvas{
    position:fixed;inset:0;pointer-events:none;z-index:50;
  }

  /* ---------- TOAST ---------- */
  .toast-wrap{
    position:fixed;top:88px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;z-index:40;
  }
  .toast{
    background:rgba(15,23,42,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--accent-light);
    padding:10px 18px;border-radius:100px;font-weight:700;font-size:.86rem;
    letter-spacing:.02em;
    border:1px solid rgba(245,158,11,.35);
    box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 20px rgba(245,158,11,.15);
    animation:toast-in .3s cubic-bezier(.4,0,.2,1), toast-out .45s cubic-bezier(.4,0,.2,1) 1.4s forwards;
  }
  .toast.streak{color:var(--accent-light);}
  .toast.big{font-size:1.05rem;padding:14px 24px;border-color:rgba(16,185,129,.4);color:#a7f3d0;box-shadow:0 12px 32px rgba(0,0,0,.5), 0 0 24px rgba(16,185,129,.2);}

    {"id":"n07433","w":"destructive","pos":["adjective"],"ph":"/dɪˈstrʌktɪv/","cefr":"B2","kr":["파괴적인","해로운"],"ex":[{"en":"The storm was one of the most destructive the region had ever seen.","ko":"그 폭풍은 그 지역이 겪은 것 중 가장 파괴적인 것 중 하나였다."}],"mnemonic":{"soundHint":"디스트럭티브","story":"'destroy(파괴)+ive' 파괴적인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"damaging","ko":"손상시키는","reason":"동의어 — 망가뜨리는"},{"w":"harmful","ko":"해로운","reason":"동의어 — 나쁜"},{"w":"constructive","ko":"건설적인","reason":"반의어 — 도움이 되는"}],"collocBest":[{"en":"destructive power","ko":"파괴력"},{"en":"destructive behavior","ko":"파괴적인 행동"}]},"nuance":{"koSimple":"물건이나 관계, 환경을 심하게 망가뜨리는 파괴적인 성질의","whenToUse":"폭력, 자연재해, 나쁜 습관의 부작용을 강조할 때 자주 사용"},"krDetail":[{"ko":"파괴적인","explain":"부수고 망치는"},{"ko":"해로운","explain":"나쁜 영향을 주는"}],"usageExamples":[{"en":"Jealousy can be a highly destructive emotion in relationships.","ko":"질투는 관계에서 매우 파괴적인 감정이 될 수 있다."},{"en":"The invasive species proved destructive to the local ecosystem.","ko":"그 침입종은 지역 생태계에 해로운 것으로 드러났다."}],"grammarNote":"destructive는 동사 destroy의 형용사형으로, 'destructive to ~' 형태로 '~에 해로운'을 나타내며 반대말은 constructive(건설적인)이다.","grammarQuiz":[{"sentence":"The hurricane had a _____ impact on the coastal towns.","ko":"허리케인은 해안 도시들에 파괴적인 영향을 미쳤다.","answer":"destructive","hint":"관사 + 형용사 + 명사 구조"}]},
    {"id":"n07436","w":"intake","pos":["noun"],"ph":"/ˈɪnteɪk/","cefr":"B2","kr":["섭취량","흡입"],"ex":[{"en":"Doctors advised him to reduce his daily intake of sugar.","ko":"의사들은 그에게 하루 설탕 섭취량을 줄이라고 조언했다."}],"mnemonic":{"soundHint":"인테이크","story":"'in(안)+take(취하다)' 섭취.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"consumption","ko":"섭취","reason":"동의어 — 먹어 들임"},{"w":"absorption","ko":"흡수","reason":"관련어 — 빨아들임"},{"w":"output","ko":"배출","reason":"반의어 — 내보냄"}],"collocBest":[{"en":"calorie intake","ko":"칼로리 섭취량"},{"en":"daily intake","ko":"하루 섭취량"}]},"nuance":{"koSimple":"음식, 공기, 에너지 등을 몸이나 시스템 안으로 들이는 양","whenToUse":"영양학, 건강, 에너지 소비 논의에서 자주 등장하는 말"},"krDetail":[{"ko":"섭취량","explain":"먹거나 마신 양"},{"ko":"흡입","explain":"빨아들임"}],"usageExamples":[{"en":"You should increase your water intake during hot weather.","ko":"더운 날씨에는 물 섭취량을 늘려야 한다."},{"en":"The university has doubled its annual intake of students.","ko":"그 대학은 연간 학생 모집 인원을 두 배로 늘렸다."}],"grammarNote":"intake는 '섭취량' 외에 '(기관의) 수용 인원'이라는 뜻도 있으며, calorie/food/water intake처럼 명사를 앞에 두는 복합명사로 자주 쓰인다.","grammarQuiz":[{"sentence":"Doctors recommend reducing your daily sugar _____.","ko":"의사들은 하루 설탕 섭취량을 줄이라고 권장한다.","answer":"intake","hint":"명사 목적어 자리"}]},
    {"id":"n07445","w":"unintended","pos":["adjective"],"ph":"/ˌʌnɪnˈtɛndɪd/","cefr":"B2","kr":["의도하지 않은","뜻하지 않은"],"ex":[{"en":"The new policy had several unintended consequences for small businesses.","ko":"그 새 정책은 소규모 사업체에 몇 가지 의도하지 않은 결과를 가져왔다."}],"mnemonic":{"soundHint":"언인텐디드","story":"'un+intended(의도된)' 의도치 않은.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"accidental","ko":"우연한","reason":"동의어 — 우연히 된"},{"w":"unplanned","ko":"계획에 없던","reason":"동의어 — 안 계획한"},{"w":"deliberate","ko":"고의의","reason":"반의어 — 일부러 한"}],"collocBest":[{"en":"unintended consequences","ko":"의도하지 않은 결과"},{"en":"unintended effect","ko":"뜻하지 않은 영향"}]},"nuance":{"koSimple":"원래 그럴 생각이 없었는데 뜻하지 않게 생겨 버린 결과의","whenToUse":"부작용, 뜻밖의 파급 효과, 실수의 결과를 지적할 때 사용"},"krDetail":[{"ko":"의도하지 않은","explain":"일부러 한 게 아닌"},{"ko":"뜻하지 않은","explain":"생각지도 못한"}],"usageExamples":[{"en":"Her joke had the unintended effect of hurting his feelings.","ko":"그녀의 농담은 그의 감정을 상하게 하는 의도치 않은 결과를 낳았다."},{"en":"Cutting the budget led to several unintended problems.","ko":"예산 삭감은 몇 가지 뜻하지 않은 문제를 초래했다."}],"grammarNote":"unintended는 'unintended consequences(의도치 않은 결과)'라는 연어로 특히 자주 쓰이며, 부사 unintentionally(의도치 않게)와 구별해 형용사로 쓴다.","grammarQuiz":[{"sentence":"The new policy had several _____ consequences.","ko":"새 정책은 여러 가지 의도하지 않은 결과를 초래했다.","answer":"unintended","hint":"형용사 + 명사 수식"}]},
    {"id":"n07448","w":"applause","pos":["noun"],"ph":"/əˈplɔːz/","cefr":"B2","kr":["박수","갈채"],"ex":[{"en":"The audience broke into loud applause as the pianist finished her performance.","ko":"피아니스트가 연주를 마치자 관객들이 우렁찬 박수를 보냈다."}],"mnemonic":{"soundHint":"어플로즈","story":"'어플라이(apply)+오즈' 짝짝짝 박수.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"clapping","ko":"박수","reason":"동의어 — 손뼉 침"},{"w":"ovation","ko":"기립 박수","reason":"관련어 — 큰 박수"},{"w":"booing","ko":"야유","reason":"반의어 — 비난 소리"}],"collocBest":[{"en":"a round of applause","ko":"한바탕의 박수"},{"en":"burst into applause","ko":"박수가 터져 나오다"}]},"nuance":{"koSimple":"공연이나 발표를 잘한 것에 감탄해 손뼉을 쳐서 보내는 갈채","whenToUse":"무대나 발표 뒤 관객의 호응을 묘사하는 문장에서 자주 사용"},"krDetail":[{"ko":"박수","explain":"손뼉을 침"},{"ko":"갈채","explain":"크게 칭찬하며 손뼉"}],"usageExamples":[{"en":"The speech was met with warm applause from the crowd.","ko":"그 연설은 청중의 따뜻한 박수를 받았다."},{"en":"She received a round of applause for her brave decision.","ko":"그녀는 용감한 결정으로 한바탕 박수를 받았다."}],"grammarNote":"applause는 셀 수 없는 명사여서 a/복수형을 쓰지 않고, '한 차례의 박수'는 a round of applause, '박수치다'는 동사 applaud로 표현한다.","grammarQuiz":[{"sentence":"The audience burst into loud _____ after the performance.","ko":"공연이 끝난 후 관객들이 큰 박수를 터뜨렸다.","answer":"applause","hint":"불가산 명사 (a/an 불필요)"}]},
    {"id":"n07458","w":"pesticides","pos":["noun"],"ph":"/ˈpɛstɪsaɪdz/","cefr":"B2","kr":["살충제","농약"],"ex":[{"en":"Many farmers now use fewer pesticides to protect the surrounding environment.","ko":"많은 농부들이 이제 주변 환경을 보호하기 위해 살충제를 덜 사용한다."}],"mnemonic":{"soundHint":"페스티사이드","story":"'pest(해충)+cide(죽이다)' 살충제.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"insecticide","ko":"살충제","reason":"동의어 — 벌레 잡는 약"},{"w":"herbicide","ko":"제초제","reason":"관련어 — 잡초 없애는 약"},{"w":"fertilizer","ko":"비료","reason":"대비어 — 잘 자라게 하는 것"}],"collocBest":[{"en":"chemical pesticides","ko":"화학 살충제"},{"en":"spray pesticides on crops","ko":"작물에 농약을 뿌리다"}]},"nuance":{"koSimple":"농작물의 병충해를 없애기 위해 사용하는 여러 종류의 살충제","whenToUse":"농업, 환경 오염, 잔류 농약 논의에서 자주 등장하는 말"},"krDetail":[{"ko":"살충제","explain":"벌레 죽이는 약"},{"ko":"농약","explain":"농사에 쓰는 약"}],"usageExamples":[{"en":"Overuse of pesticides can harm bees and other insects.","ko":"살충제의 과다 사용은 벌과 다른 곤충들에게 해를 끼칠 수 있다."},{"en":"Organic farms grow crops without chemical pesticides.","ko":"유기농 농장은 화학 살충제 없이 작물을 재배한다."}],"grammarNote":"pesticides는 pesticide의 복수형으로, 여러 종류의 농약을 통틀어 말할 때 흔히 복수로 쓰며 pest(해충)+-cide(죽이는 것)의 결합이다.","grammarQuiz":[{"sentence":"Organic farmers avoid using chemical _____ on their crops.","ko":"유기농 농부들은 작물에 화학 살충제 사용을 피한다.","answer":"pesticides","hint":"형용사 + 복수명사 구조"}]},
    {"id":"n07459","w":"versa","pos":["adverb"],"ph":"/ˈvɜːrsə/","cefr":"B2","kr":["반대도 마찬가지인"],"ex":[{"en":"Teachers can learn from students, and vice versa.","ko":"교사는 학생에게서 배울 수 있고, 반대의 경우도 마찬가지이다."}],"mnemonic":{"soundHint":"버사","story":"'vice versa' 반대로도 마찬가지.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"vice","ko":"거꾸로도","reason":"관련어 — vice versa 짝"},{"w":"reverse","ko":"반대","reason":"관련어 — 거꾸로"},{"w":"opposite","ko":"정반대","reason":"관련어 — 맞은편"}],"collocBest":[{"en":"vice versa","ko":"반대의 경우도 마찬가지"},{"en":"and vice versa","ko":"그리고 그 반대도"}]},"nuance":{"koSimple":"vice versa(그 반대도 마찬가지)에서 쓰이는 라틴어 조각 표현","whenToUse":"양쪽 관계가 서로 뒤바뀌어도 성립함을 말할 때 자주 사용"},"krDetail":[{"ko":"반대도 마찬가지인","explain":"거꾸로 해도 똑같은"}],"usageExamples":[{"en":"You can convert dollars to euros and vice versa at this bank.","ko":"이 은행에서는 달러를 유로로, 또 그 반대로도 바꿀 수 있다."},{"en":"The son often helps his father, and vice versa.","ko":"그 아들은 아버지를 자주 돕고, 반대의 경우도 마찬가지다."}],"grammarNote":"versa는 단독으로 쓰이지 않고 라틴어 표현 'vice versa(반대의 경우도 마찬가지)' 형태로만 쓰이며, 앞 문장의 관계가 뒤바뀐 상황을 가리킨다.","grammarQuiz":[{"sentence":"Dogs can learn from humans and vice _____.","ko":"개는 인간에게서 배울 수 있고, 그 반대도 마찬가지이다.","answer":"versa","hint":"vice versa (관용 표현)"}]},
    {"id":"n07460","w":"resistant","pos":["adjective"],"ph":"/rɪˈzɪstənt/","cefr":"B2","kr":["저항하는","내성이 있는"],"ex":[{"en":"Some bacteria have become resistant to common antibiotics.","ko":"일부 세균은 흔한 항생제에 내성이 생겼다."}],"mnemonic":{"soundHint":"리지스턴트","story":"'resist(저항)+ant' 저항하는.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"immune","ko":"면역이 있는","reason":"동의어 — 잘 견디는"},{"w":"opposing","ko":"맞서는","reason":"동의어 — 대드는"},{"w":"vulnerable","ko":"취약한","reason":"반의어 — 약한"}],"collocBest":[{"en":"resistant to change","ko":"변화에 저항하는"},{"en":"water-resistant material","ko":"방수 소재"}]},"nuance":{"koSimple":"외부의 힘, 변화, 약물에 잘 굴복하지 않고 버티는 성질의","whenToUse":"면역, 내구성, 개혁 반대 등 다양한 맥락에서 자주 사용"},"krDetail":[{"ko":"저항하는","explain":"맞서 버티는"},{"ko":"내성이 있는","explain":"잘 견디는"}],"usageExamples":[{"en":"This new material is highly resistant to heat and water.","ko":"이 새로운 소재는 열과 물에 매우 강하다."},{"en":"Many older employees were resistant to the sudden changes.","ko":"많은 나이 든 직원들은 갑작스러운 변화에 저항했다."}],"grammarNote":"resistant는 'resistant to ~' 형태로 '~에 저항력이 있는/내성이 있는'을 나타내며, 명사 resistance, 동사 resist와 함께 묶어 익히면 좋다.","grammarQuiz":[{"sentence":"Some bacteria have become _____ to common antibiotics.","ko":"일부 박테리아는 일반 항생제에 내성이 생겼다.","answer":"resistant","hint":"resistant to ~ (~에 저항하는)"}]},

    {"id":"n07508","w":"interdependent","pos":["adjective"],"ph":"/ˌɪntərdɪˈpɛndənt/","cefr":"B2","kr":["상호 의존적인"],"ex":[{"en":"In a healthy ecosystem, all species are interdependent.","ko":"건강한 생태계에서는 모든 종이 상호 의존적이다."}],"mnemonic":{"soundHint":"인터디펜던트","story":"'inter(서로)+dependent(의존)' 상호의존.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"mutual","ko":"서로의","reason":"동의어 — 상호간의"},{"w":"connected","ko":"연결된","reason":"관련어 — 이어진"},{"w":"independent","ko":"독립적인","reason":"반의어 — 홀로 선"}],"collocBest":[{"en":"interdependent relationship","ko":"상호 의존적 관계"},{"en":"closely interdependent","ko":"긴밀하게 상호 의존하는"}]},"nuance":{"koSimple":"여럿이 서로 영향을 주고받으며 없어서는 안 될 관계인 상태","whenToUse":"생태계, 글로벌 경제, 인간관계의 얽힘을 설명할 때 사용"},"krDetail":[{"ko":"상호 의존적인","explain":"서로 기대어 사는"}],"usageExamples":[{"en":"Modern economies are deeply interdependent across borders.","ko":"현대 경제는 국경을 넘어 깊이 상호 의존적이다."},{"en":"The organs of the body are interdependent and work together.","ko":"신체의 장기들은 상호 의존적이며 함께 작동한다."}],"grammarNote":"interdependent는 접두사 inter-(상호)와 dependent(의존하는)가 결합한 말로, 'interdependent on each other'처럼 쓰며 명사형은 interdependence이다.","grammarQuiz":[{"sentence":"In a global economy, all nations are _____.","ko":"세계 경제에서 모든 국가는 상호 의존적이다.","answer":"interdependent","hint":"be동사 + 형용사 보어"}]},
    {"id":"n07509","w":"automation","pos":["noun"],"ph":"/ˌɔːtəˈmeɪʃən/","cefr":"B2","kr":["자동화"],"ex":[{"en":"Factory automation has reduced the need for manual labor.","ko":"공장 자동화로 인해 육체노동의 필요성이 줄어들었다."}],"mnemonic":{"soundHint":"오토메이션","story":"'auto(자동)+mation' 자동화.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"mechanization","ko":"기계화","reason":"동의어 — 기계로 바꿈"},{"w":"robotics","ko":"로봇공학","reason":"관련어 — 로봇 기술"},{"w":"manual","ko":"수작업","reason":"반의어 — 손으로 함"}],"collocBest":[{"en":"industrial automation","ko":"산업 자동화"},{"en":"the rise of automation","ko":"자동화의 확산"}]},"nuance":{"koSimple":"사람 손 대신 기계나 소프트웨어가 일을 자동으로 해내는 방식","whenToUse":"공장 자동화, 사무 업무 로봇화 등을 논할 때 자주 등장"},"krDetail":[{"ko":"자동화","explain":"저절로 되게 만듦"}],"usageExamples":[{"en":"Automation has transformed the way modern warehouses operate.","ko":"자동화는 현대 물류 창고의 운영 방식을 바꿔 놓았다."},{"en":"Some workers fear that automation will replace their jobs.","ko":"일부 노동자들은 자동화가 자신의 일자리를 대체할까 봐 두려워한다."}],"grammarNote":"automation은 셀 수 없는 명사로 '(공정의) 자동화'를 뜻하며, 동사 automate, 형용사 automatic(자동의)과 구별해 익힌다.","grammarQuiz":[{"sentence":"_____ has transformed the manufacturing industry.","ko":"자동화는 제조업을 변화시켰다.","answer":"automation","hint":"불가산 명사 주어"}]},
    {"id":"n07516","w":"greenwashing","pos":["noun"],"ph":"/ˈɡriːnwɑːʃɪŋ/","cefr":"B2","kr":["그린워싱","위장 환경주의"],"ex":[{"en":"Critics accused the company of greenwashing its harmful products.","ko":"비평가들은 그 회사가 해로운 제품을 그린워싱한다고 비난했다."}],"mnemonic":{"soundHint":"그린워싱","story":"'green(친환경)+wash(세탁)' 위장 환경보호.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"deception","ko":"기만","reason":"관련어 — 속이기"},{"w":"marketing","ko":"마케팅","reason":"관련어 — 홍보 수단"},{"w":"transparency","ko":"투명성","reason":"반의어 — 솔직히 드러냄"}],"collocBest":[{"en":"accused of greenwashing","ko":"그린워싱으로 비난받는"},{"en":"corporate greenwashing","ko":"기업의 위장 환경주의"}]},"nuance":{"koSimple":"환경에 좋은 척 꾸며 소비자를 속이는 위장 환경 마케팅 행위","whenToUse":"기업의 친환경 이미지 조작을 비판할 때 자주 쓰이는 개념어"},"krDetail":[{"ko":"그린워싱","explain":"친환경인 척 속이기"},{"ko":"위장 환경주의","explain":"겉만 환경 생각하는 척"}],"usageExamples":[{"en":"Vague claims like 'eco-friendly' are often a sign of greenwashing.","ko":"'친환경' 같은 모호한 주장은 흔히 그린워싱의 신호이다."},{"en":"Consumers are becoming better at spotting greenwashing.","ko":"소비자들은 그린워싱을 알아채는 데 점점 능숙해지고 있다."}],"grammarNote":"greenwashing은 green(환경)과 whitewashing(눈속임)이 결합한 셀 수 없는 명사로, 실제로는 친환경적이지 않으면서 그런 척하는 마케팅을 가리킨다.","grammarQuiz":[{"sentence":"The company was accused of _____ for making false eco-friendly claims.","ko":"그 회사는 거짓 친환경 주장을 하여 그린워싱으로 비난받았다.","answer":"greenwashing","hint":"전치사 of + 명사"}]},
    {"id":"n07532","w":"sibling","pos":["noun"],"ph":"/ˈsɪblɪŋ/","cefr":"B2","kr":["형제자매"],"ex":[{"en":"She has a close relationship with her younger sibling.","ko":"그녀는 어린 동생과 가까운 사이이다."}],"mnemonic":{"soundHint":"시블링","story":"동생이 형의 팔에 매달린다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"brother","ko":"남자 형제","reason":"관련어 — 형제 한쪽"},{"w":"sister","ko":"여자 형제","reason":"관련어 — 자매 한쪽"},{"w":"relative","ko":"친척","reason":"상위어 — 넓은 가족"}],"collocBest":[{"en":"sibling rivalry","ko":"형제간의 경쟁"},{"en":"an older sibling","ko":"손위 형제자매"}]},"nuance":{"koSimple":"같은 부모를 둔 형제나 자매를 성별 구분 없이 통틀어 부르는 말이야.","whenToUse":"가족 관계나 서류·설문에서 형제자매를 격식 있게 말할 때 써."},"krDetail":[{"ko":"형제자매","explain":"같은 부모의 자녀들"}],"usageExamples":[{"en":"Growing up with a sibling teaches children how to share.","ko":"형제자매와 함께 자라는 것은 아이들에게 나누는 법을 가르친다."},{"en":"As the oldest sibling, she often looked after the others.","ko":"맏이로서 그녀는 종종 다른 형제자매들을 돌보았다."}],"grammarNote":"sibling은 성별을 구분하지 않고 '형제자매 한 명'을 가리키는 명사로, brother/sister와 달리 남녀를 특정하지 않을 때 쓴다.","grammarQuiz":[{"sentence":"She has one older _____ who lives in Canada.","ko":"그녀에게는 캐나다에 사는 형제자매가 한 명 있다.","answer":"sibling","hint":"관사 + 형용사 + 단수명사"}]},
    {"id":"n07546","w":"composition","pos":["noun"],"ph":"/ˌkɑːmpəˈzɪʃən/","cefr":"B2","kr":["구성","작곡","작문"],"ex":[{"en":"The teacher asked us to analyze the composition of the painting.","ko":"선생님은 우리에게 그 그림의 구성을 분석해 보라고 했다."}],"mnemonic":{"soundHint":"컴포지션","story":"작곡가가 곡의 구성을 짠다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"structure","ko":"구조","reason":"동의어 — 짜임새"},{"w":"arrangement","ko":"배치","reason":"관련어 — 벌여 놓음"},{"w":"essay","ko":"글","reason":"관련어 — 지은 글"}],"collocBest":[{"en":"chemical composition","ko":"화학적 구성"},{"en":"the composition of the team","ko":"팀의 구성"}]},"nuance":{"koSimple":"여러 요소가 모여 하나의 전체를 이루는 구성이나 작품을 뜻해.","whenToUse":"음악 작곡, 미술 구도, 성분 분석을 말할 때 두루 자주 써."},"krDetail":[{"ko":"구성","explain":"여러 요소의 짜임"},{"ko":"작곡","explain":"음악을 지음"},{"ko":"작문","explain":"글을 지음"}],"usageExamples":[{"en":"The chemical composition of the water was carefully analyzed.","ko":"그 물의 화학적 구성이 신중히 분석되었다."},{"en":"Beethoven's most famous composition is his Ninth Symphony.","ko":"베토벤의 가장 유명한 작품은 그의 9번 교향곡이다."}],"grammarNote":"composition은 '구성·성분', '작곡·작품', '작문' 등 문맥에 따라 뜻이 달라지는 다의어이며, 동사 compose에서 파생되었다.","grammarQuiz":[{"sentence":"The chemical _____ of the soil affects plant growth.","ko":"토양의 화학적 구성은 식물 성장에 영향을 미친다.","answer":"composition","hint":"형용사 + 명사 주어"}]},
    {"id":"n07547","w":"surprisingly","pos":["adverb"],"ph":"/sərˈpraɪzɪŋli/","cefr":"B2","kr":["놀랍게도"],"ex":[{"en":"Surprisingly, the small café was completely empty at lunchtime.","ko":"놀랍게도 그 작은 카페는 점심시간에 완전히 비어 있었다."}],"mnemonic":{"soundHint":"서프라이징리","story":"놀랍게도 시험 답이 맞았다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"unexpectedly","ko":"뜻밖에","reason":"동의어 — 예상 밖으로"},{"w":"amazingly","ko":"놀랍게도","reason":"동의어 — 신기하게"},{"w":"predictably","ko":"예상대로","reason":"반의어 — 뻔하게"}],"collocBest":[{"en":"surprisingly good","ko":"놀랄 만큼 좋은"},{"en":"not surprisingly","ko":"당연하게도"}]},"nuance":{"koSimple":"예상 밖의 결과가 나왔을 때 놀랍게도라고 강조해 주는 부사야.","whenToUse":"의외의 사실이나 반전 상황을 언급할 때 문장 앞에 자주 써."},"krDetail":[{"ko":"놀랍게도","explain":"뜻밖이라 놀랍게"}],"usageExamples":[{"en":"The exam was surprisingly easy compared to last year's.","ko":"그 시험은 작년 것에 비해 놀랍도록 쉬웠다."},{"en":"Surprisingly, he had never seen the ocean before.","ko":"놀랍게도 그는 이전에 바다를 본 적이 없었다."}],"grammarNote":"surprisingly는 문장 전체를 수식해 '놀랍게도'라는 화자의 태도를 나타내거나(문두), 형용사·부사 앞에서 '놀랍도록'이라는 정도를 강조한다.","grammarQuiz":[{"sentence":"_____, the exam turned out to be quite easy.","ko":"놀랍게도, 시험은 꽤 쉬운 것으로 판명되었다.","answer":"surprisingly","hint":"문장 부사 (문두 + 콤마)"}]},
    {"id":"n07553","w":"respondents","pos":["noun"],"ph":"/rɪˈspɑːndənts/","cefr":"B2","kr":["응답자","설문 참여자"],"ex":[{"en":"Most respondents said they preferred working from home.","ko":"대부분의 응답자들은 재택근무를 선호한다고 답했다."}],"mnemonic":{"soundHint":"리스판던츠","story":"설문에 응답한 사람들이 줄지어 있다","hintConfidence":1},"pairs":{"buddyWords":[{"w":"participants","ko":"참가자","reason":"동의어 — 참여한 사람"},{"w":"interviewees","ko":"인터뷰 대상자","reason":"관련어 — 답하는 사람"},{"w":"questioner","ko":"질문하는 사람","reason":"대비어 — 묻는 쪽"}],"collocBest":[{"en":"survey respondents","ko":"설문 응답자"},{"en":"a majority of respondents","ko":"응답자의 대다수"}]},"nuance":{"koSimple":"설문이나 조사에서 답변을 준 사람들, 즉 응답자들을 가리켜.","whenToUse":"통계·연구 보고서에서 응답 비율을 설명할 때 자주 등장하는 말이야."},"krDetail":[{"ko":"응답자","explain":"물음에 답하는 사람"},{"ko":"설문 참여자","explain":"설문에 응한 사람"}],"usageExamples":[{"en":"Nearly half of the respondents supported the new policy.","ko":"응답자의 거의 절반이 새 정책을 지지했다."},{"en":"The survey's respondents ranged in age from 18 to 65.","ko":"그 설문의 응답자들은 나이가 18세에서 65세까지 다양했다."}],"grammarNote":"respondents는 respondent의 복수형으로 설문·조사의 '응답자들'을 가리키며, 동사 respond, 명사 response와 어원이 같다.","grammarQuiz":[{"sentence":"Over 70% of the survey _____ agreed with the proposal.","ko":"설문 응답자의 70% 이상이 그 제안에 동의했다.","answer":"respondents","hint":"명사 + 명사 복합어 (survey respondents)"}]},
    {"id":"n07554","w":"unconscious","pos":["adjective"],"ph":"/ʌnˈkɑːnʃəs/","cefr":"B2","kr":["무의식적인","의식이 없는"],"ex":[{"en":"The driver was unconscious for several minutes after the crash.","ko":"그 운전자는 충돌 후 몇 분간 의식이 없었다."}],"mnemonic":{"soundHint":"언컨셔스","story":"충격으로 무의식 상태에 빠졌다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"unaware","ko":"알아채지 못하는","reason":"동의어 — 모르는"},{"w":"automatic","ko":"무의식적인","reason":"관련어 — 저절로 하는"},{"w":"conscious","ko":"의식 있는","reason":"반의어 — 정신이 있는"}],"collocBest":[{"en":"unconscious bias","ko":"무의식적 편견"},{"en":"knock someone unconscious","ko":"~을 때려 기절시키다"}]},"nuance":{"koSimple":"기절 상태이거나 스스로 자각하지 못하는 마음 상태를 뜻해.","whenToUse":"사고로 정신을 잃거나 무의식적 습관·편견을 이야기할 때 써."},"krDetail":[{"ko":"무의식적인","explain":"자기도 모르게 하는"},{"ko":"의식이 없는","explain":"정신을 잃은"}],"usageExamples":[{"en":"Many of our habits are the result of unconscious choices.","ko":"우리 습관의 많은 부분은 무의식적인 선택의 결과이다."},{"en":"He remained unconscious for hours after the accident.","ko":"그는 사고 후 몇 시간 동안 의식이 없는 상태였다."}],"grammarNote":"unconscious는 '의식이 없는'(물리적)과 '무의식적인'(심리적) 두 뜻을 가지며, 'be unconscious of ~'는 '~을 의식하지 못하다'를 뜻한다.","grammarQuiz":[{"sentence":"Many of our daily habits are driven by _____ decisions.","ko":"우리의 일상적 습관 중 많은 것이 무의식적인 결정에 의해 작동한다.","answer":"unconscious","hint":"형용사 + 명사 수식"}]},
    {"id":"n07562","w":"distraction","pos":["noun"],"ph":"/dɪˈstrækʃən/","cefr":"B2","kr":["주의 산만","방해"],"ex":[{"en":"Turning off notifications helps me avoid distraction while studying.","ko":"알림을 꺼 두면 공부할 때 주의가 산만해지는 것을 막을 수 있다."}],"mnemonic":{"soundHint":"디스트랙션","story":"휴대폰이 공부의 주의를 흐트린다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"interruption","ko":"방해","reason":"동의어 — 끼어듦"},{"w":"diversion","ko":"딴 데로 돌림","reason":"동의어 — 주의를 빼앗음"},{"w":"focus","ko":"집중","reason":"반의어 — 정신 모음"}],"collocBest":[{"en":"a constant distraction","ko":"끊임없는 방해 요소"},{"en":"a source of distraction","ko":"주의 산만의 원인"}]},"nuance":{"koSimple":"집중을 흐트러뜨리는 방해 요소나 마음을 딴 데로 돌리는 걸 뜻해.","whenToUse":"공부·운전 중 방해거리를 말하거나 기분전환 소재를 얘기할 때 써."},"krDetail":[{"ko":"주의 산만","explain":"정신이 흐트러짐"},{"ko":"방해","explain":"일을 못 하게 막음"}],"usageExamples":[{"en":"The noise from the street was a constant distraction.","ko":"거리에서 나는 소음이 끊임없는 방해 요소였다."},{"en":"She watches movies as a distraction from her worries.","ko":"그녀는 걱정에서 벗어나기 위한 기분전환으로 영화를 본다."}],"grammarNote":"distraction은 동사 distract의 명사형으로 '주의를 흩뜨리는 것'이나 '기분전환거리'를 뜻하며, 'a distraction from ~(~에서 주의를 돌리는 것)' 형태로 쓴다.","grammarQuiz":[{"sentence":"Using a phone while driving is a dangerous _____.","ko":"운전 중 휴대폰 사용은 위험한 주의 산만 요인이다.","answer":"distraction","hint":"관사 + 형용사 + 명사"}]},
    {"id":"n07570","w":"unwilling","pos":["adjective"],"ph":"/ʌnˈwɪlɪŋ/","cefr":"B2","kr":["꺼리는","마지못한"],"ex":[{"en":"He was unwilling to admit that he had made a mistake.","ko":"그는 자신이 실수했다는 것을 인정하기를 꺼렸다."}],"mnemonic":{"soundHint":"언윌링","story":"설거지를 하기 싫어 마지못해 한다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"reluctant","ko":"꺼리는","reason":"동의어 — 하기 싫은"},{"w":"hesitant","ko":"주저하는","reason":"동의어 — 망설이는"},{"w":"eager","ko":"열망하는","reason":"반의어 — 하고 싶은"}],"collocBest":[{"en":"unwilling to accept","ko":"받아들이기를 꺼리는"},{"en":"an unwilling participant","ko":"마지못한 참가자"}]},"nuance":{"koSimple":"마음속으로 하기 싫어서 자꾸 꺼리며 마지못해 하는 상태를 뜻해.","whenToUse":"억지로 시켜서 마지못해 응하는 소극적 태도를 설명할 때 자주 써."},"krDetail":[{"ko":"꺼리는","explain":"하기 싫어하는"},{"ko":"마지못한","explain":"어쩔 수 없이 하는"}],"usageExamples":[{"en":"The witness was unwilling to reveal what she had seen.","ko":"그 목격자는 자신이 본 것을 밝히기를 꺼렸다."},{"en":"Investors are unwilling to take risks in an unstable market.","ko":"투자자들은 불안정한 시장에서 위험을 감수하기를 꺼린다."}],"grammarNote":"unwilling은 보통 'unwilling to + 동사원형' 형태로 '~하기를 꺼리는'을 나타내며, willing(기꺼이 하는)의 반대말이다.","grammarQuiz":[{"sentence":"He was _____ to share his personal information online.","ko":"그는 온라인에서 개인 정보를 공유하기를 꺼렸다.","answer":"unwilling","hint":"be unwilling to V (~하기를 꺼리다)"}]},
    {"id":"n07576","w":"literate","pos":["adjective"],"ph":"/ˈlɪtərət/","cefr":"B2","kr":["읽고 쓸 줄 아는","지식이 있는"],"ex":[{"en":"The program aims to help more adults become literate.","ko":"그 프로그램은 더 많은 성인이 글을 읽고 쓸 수 있도록 돕는 것을 목표로 한다."}],"mnemonic":{"soundHint":"리터럿","story":"글을 읽을 줄 아는 학생","hintConfidence":2},"pairs":{"buddyWords":[{"w":"educated","ko":"교육받은","reason":"동의어 — 배운"},{"w":"knowledgeable","ko":"아는 게 많은","reason":"동의어 — 박식한"},{"w":"illiterate","ko":"문맹의","reason":"반의어 — 못 읽는"}],"collocBest":[{"en":"digitally literate","ko":"디지털 활용 능력이 있는"},{"en":"financially literate","ko":"금융 지식이 있는"}]},"nuance":{"koSimple":"글을 읽고 쓸 줄 아는 능력이 있는 상태를 나타내는 형용사야.","whenToUse":"문해력이나 디지털·정보 리터러시가 있는 사람을 말할 때 자주 써."},"krDetail":[{"ko":"읽고 쓸 줄 아는","explain":"글을 읽고 쓰는"},{"ko":"지식이 있는","explain":"아는 것이 많은"}],"usageExamples":[{"en":"In today's world, being computer literate is essential.","ko":"오늘날 세상에서 컴퓨터를 다룰 줄 아는 것은 필수적이다."},{"en":"The campaign helped thousands of adults become literate.","ko":"그 캠페인은 수천 명의 성인이 글을 읽고 쓸 수 있게 도왔다."}],"grammarNote":"literate는 '읽고 쓸 줄 아는'이 기본 뜻이며, computer/media literate처럼 앞에 명사를 붙여 '~에 능숙한'을 나타낸다. 반대말은 illiterate이다.","grammarQuiz":[{"sentence":"In the modern world, being digitally _____ is essential.","ko":"현대 사회에서 디지털 능력을 갖추는 것은 필수적이다.","answer":"literate","hint":"부사 + 형용사 보어"}]},
    {"id":"n07587","w":"multicultural","pos":["adjective"],"ph":"/ˌmʌltiˈkʌltʃərəl/","cefr":"B2","kr":["다문화의"],"ex":[{"en":"Our school celebrates its multicultural community every spring.","ko":"우리 학교는 매년 봄 다문화 공동체를 기념한다."}],"mnemonic":{"soundHint":"멀티컬처럴","story":"다양한 문화가 한 도시에 어우러진다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"diverse","ko":"다양한","reason":"동의어 — 여러 가지의"},{"w":"multiethnic","ko":"다민족의","reason":"동의어 — 여러 민족의"},{"w":"monocultural","ko":"단일문화의","reason":"반의어 — 한 문화의"}],"collocBest":[{"en":"a multicultural society","ko":"다문화 사회"},{"en":"multicultural education","ko":"다문화 교육"}]},"nuance":{"koSimple":"여러 문화·인종·전통이 한 공간에서 함께 공존함을 나타내는 말이야.","whenToUse":"다문화 사회·교실·정책을 이야기할 때 자주 등장하는 표현이야."},"krDetail":[{"ko":"다문화의","explain":"여러 문화가 섞인"}],"usageExamples":[{"en":"London is a vibrant, multicultural city.","ko":"런던은 활기차고 다문화적인 도시이다."},{"en":"The festival celebrates our multicultural society.","ko":"그 축제는 우리의 다문화 사회를 기념한다."}],"grammarNote":"multicultural은 접두사 multi-(다수의)와 cultural(문화의)이 결합한 형용사로 명사를 수식하며, 명사형은 multiculturalism이다.","grammarQuiz":[{"sentence":"Canada is known as a _____ society with diverse communities.","ko":"캐나다는 다양한 공동체를 가진 다문화 사회로 알려져 있다.","answer":"multicultural","hint":"관사 + 형용사 + 명사 구조"}]},
    {"id":"n07594","w":"uneasy","pos":["adjective"],"ph":"/ʌnˈiːzi/","cefr":"B2","kr":["불안한","불편한"],"ex":[{"en":"She felt uneasy about walking home alone so late at night.","ko":"그녀는 밤늦게 혼자 집에 걸어가는 것이 불안했다."}],"mnemonic":{"soundHint":"언이지","story":"발표 직전 마음이 불편하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"anxious","ko":"불안한","reason":"동의어 — 걱정되는"},{"w":"nervous","ko":"초조한","reason":"동의어 — 조마조마한"},{"w":"relaxed","ko":"편안한","reason":"반의어 — 느긋한"}],"collocBest":[{"en":"feel uneasy about","ko":"~에 대해 불안해하다"},{"en":"an uneasy silence","ko":"불편한 침묵"}]},"nuance":{"koSimple":"왠지 모를 걱정과 불편함으로 마음이 편치 않은 상태를 뜻해.","whenToUse":"낌새가 이상해 살짝 긴장되고 꺼림칙할 때 딱 어울리는 말이야."},"krDetail":[{"ko":"불안한","explain":"마음이 놓이지 않는"},{"ko":"불편한","explain":"마음이 편치 않은"}],"usageExamples":[{"en":"There was an uneasy silence after his sudden question.","ko":"그의 갑작스러운 질문 후에 불편한 침묵이 흘렀다."},{"en":"I felt uneasy about lending him such a large sum.","ko":"나는 그에게 그렇게 큰 금액을 빌려주는 것이 불안했다."}],"grammarNote":"uneasy는 'uneasy about ~' 형태로 '~에 대해 불안한'을 나타내며, easy(쉬운)의 반대가 아니라 '마음이 편치 않은'이라는 뜻임에 주의한다.","grammarQuiz":[{"sentence":"She felt _____ about walking alone at night.","ko":"그녀는 밤에 혼자 걷는 것이 불안했다.","answer":"uneasy","hint":"feel + 형용사 + about"}]},
    {"id":"n07602","w":"biodiversity","pos":["noun"],"ph":"/ˌbaɪoʊdaɪˈvɜːrsɪti/","cefr":"B2","kr":["생물 다양성"],"ex":[{"en":"Rainforests are home to an incredible level of biodiversity.","ko":"열대우림은 놀라운 수준의 생물 다양성을 품고 있다."}],"mnemonic":{"soundHint":"바이오다이버시티","story":"밀림 속 생물 다양성이 풍부하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"ecosystem","ko":"생태계","reason":"관련어 — 생물들의 세계"},{"w":"species","ko":"종","reason":"관련어 — 생물 종류"},{"w":"extinction","ko":"멸종","reason":"반의어 — 사라져 없어짐"}],"collocBest":[{"en":"loss of biodiversity","ko":"생물 다양성의 감소"},{"en":"protect biodiversity","ko":"생물 다양성을 보호하다"}]},"nuance":{"koSimple":"한 지역 안에 살아가는 생물종들의 풍부한 다양성을 뜻하는 말이야.","whenToUse":"생태계·환경 보호·기후변화 논의에서 자주 등장하는 개념이야."},"krDetail":[{"ko":"생물 다양성","explain":"여러 종류의 생물"}],"usageExamples":[{"en":"Cutting down forests threatens the region's biodiversity.","ko":"숲을 베어 내는 것은 그 지역의 생물 다양성을 위협한다."},{"en":"Coral reefs support an amazing level of biodiversity.","ko":"산호초는 놀라운 수준의 생물 다양성을 지탱한다."}],"grammarNote":"biodiversity는 bio-(생물)와 diversity(다양성)가 결합한 셀 수 없는 명사로, 한 지역·생태계에 사는 생물 종의 다양성을 뜻한다.","grammarQuiz":[{"sentence":"Protecting _____ is crucial for maintaining healthy ecosystems.","ko":"생물 다양성을 보호하는 것은 건강한 생태계를 유지하는 데 중요하다.","answer":"biodiversity","hint":"동명사 주어 + 불가산명사 목적어"}]},
    {"id":"n07613","w":"logistics","pos":["noun"],"ph":"/ləˈdʒɪstɪks/","cefr":"B2","kr":["물류","병참"],"ex":[{"en":"The logistics of moving the entire office took weeks to plan.","ko":"사무실 전체를 옮기는 물류 작업은 계획하는 데 몇 주가 걸렸다."}],"mnemonic":{"soundHint":"로지스틱스","story":"택배 물류 창고가 밤새 분주하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"distribution","ko":"유통","reason":"동의어 — 물건 돌림"},{"w":"shipping","ko":"운송","reason":"관련어 — 실어 나름"},{"w":"supply","ko":"공급","reason":"관련어 — 대어 줌"}],"collocBest":[{"en":"logistics company","ko":"물류 회사"},{"en":"handle the logistics","ko":"물류를 처리하다"}]},"nuance":{"koSimple":"제품이나 사람의 이동을 계획·관리하는 물류 업무를 뜻해.","whenToUse":"배송·창고·공급망 같은 유통 실무를 이야기할 때 자주 써."},"krDetail":[{"ko":"물류","explain":"물건 옮기고 관리함"},{"ko":"병참","explain":"군수품 보급 관리"}],"usageExamples":[{"en":"The company specializes in the logistics of global shipping.","ko":"그 회사는 국제 운송 물류를 전문으로 한다."},{"en":"Organizing a concert involves complicated logistics.","ko":"콘서트를 준비하는 일은 복잡한 실행 계획을 수반한다."}],"grammarNote":"logistics는 형태는 복수이지만 '물류(학)'라는 분야를 뜻할 때는 단수 취급하고, '(행사 등의) 실행 계획·절차'를 뜻할 때는 복수 취급하기도 한다.","grammarQuiz":[{"sentence":"The _____ of delivering supplies to remote areas are complex.","ko":"외딴 지역에 물자를 배달하는 물류는 복잡하다.","answer":"logistics","hint":"복수형 명사 주어 (are)"}]},
    {"id":"n07628","w":"healthful","pos":["adjective"],"ph":"/ˈhɛlθfəl/","cefr":"B2","kr":["건강에 좋은"],"ex":[{"en":"A diet rich in vegetables is considered highly healthful.","ko":"채소가 풍부한 식단은 건강에 매우 좋다고 여겨진다."}],"mnemonic":{"soundHint":"헬스풀","story":"건강에 좋은 야채 샐러드 한 접시","hintConfidence":2},"pairs":{"buddyWords":[{"w":"nutritious","ko":"영양가 있는","reason":"동의어 — 영양이 많은"},{"w":"wholesome","ko":"몸에 좋은","reason":"동의어 — 유익한"},{"w":"harmful","ko":"해로운","reason":"반의어 — 나쁜"}],"collocBest":[{"en":"healthful diet","ko":"건강에 좋은 식단"},{"en":"healthful lifestyle","ko":"건강에 좋은 생활 방식"}]},"nuance":{"koSimple":"몸에 이롭고 건강을 증진해 주는 성질을 나타내는 형용사야.","whenToUse":"healthy의 격식형 느낌이라 음식·습관·환경을 말할 때 자주 써."},"krDetail":[{"ko":"건강에 좋은","explain":"몸을 튼튼하게 하는"}],"usageExamples":[{"en":"The chef focuses on preparing simple, healthful meals.","ko":"그 요리사는 간단하면서도 건강에 좋은 식사를 준비하는 데 집중한다."},{"en":"Regular exercise is one of the most healthful habits.","ko":"규칙적인 운동은 가장 건강에 좋은 습관 중 하나이다."}],"grammarNote":"healthful은 '건강에 이로운(음식·환경 등)'을 뜻해 주로 사물을 수식하고, healthy는 '건강한(사람·상태)'에 쓰이지만 현대 영어에서는 healthy가 두 뜻으로 흔히 쓰인다.","grammarQuiz":[{"sentence":"Eating fresh fruits and vegetables is a _____ habit.","ko":"신선한 과일과 채소를 먹는 것은 건강에 좋은 습관이다.","answer":"healthful","hint":"관사 + 형용사 + 명사 보어"}]},

    {"id":"n07649","w":"unborn","pos":["adjective"],"ph":"/ˌʌnˈbɔːrn/","cefr":"B2","kr":["태어나지 않은","태아의"],"ex":[{"en":"Good nutrition is essential for the health of an unborn child.","ko":"좋은 영양 섭취는 태아의 건강에 필수적이다."}],"mnemonic":{"soundHint":"언본","story":"엄마 뱃속의 아직 태어나지 않은 아기","hintConfidence":2},"pairs":{"buddyWords":[{"w":"prenatal","ko":"출생 전의","reason":"동의어 — 태어나기 전"},{"w":"fetal","ko":"태아의","reason":"동의어 — 배 속 아기의"},{"w":"born","ko":"태어난","reason":"반의어 — 세상에 나온"}],"collocBest":[{"en":"an unborn child","ko":"태아"},{"en":"future unborn generations","ko":"아직 태어나지 않은 미래 세대"}]},"nuance":{"koSimple":"아직 세상에 태어나지 않은 태아나 미래 세대를 나타내는 표현이야.","whenToUse":"생명 윤리, 임신 이야기, 장래 세대를 논할 때 신중히 사용해."},"krDetail":[{"ko":"태어나지 않은","explain":"아직 안 태어난"},{"ko":"태아의","explain":"배 속 아기의"}],"usageExamples":[{"en":"Smoking during pregnancy can harm the unborn baby.","ko":"임신 중 흡연은 태아에게 해를 끼칠 수 있다."},{"en":"The law aims to protect the rights of unborn children.","ko":"그 법은 태어나지 않은 아이들의 권리를 보호하는 것을 목표로 한다."}],"grammarNote":"unborn은 접두사 un-과 born이 결합한 형용사로, 'unborn child/baby(태아)'처럼 명사 앞에서만 쓰는 한정적 용법이 일반적이다.","grammarQuiz":[{"sentence":"Smoking during pregnancy can harm the _____ child.","ko":"임신 중 흡연은 태아에게 해를 끼칠 수 있다.","answer":"unborn","hint":"the + 형용사 + 명사 구조"}]},
