    {"id":"n07662","w":"relativity","pos":["noun"],"ph":"/ˌrɛləˈtɪvɪti/","cefr":"B2","kr":["상대성","상대성 이론"],"ex":[{"en":"Einstein's theory of relativity changed how we understand space and time.","ko":"아인슈타인의 상대성 이론은 우리가 공간과 시간을 이해하는 방식을 바꾸었다."}],"mnemonic":{"soundHint":"렐러티비티","story":"아인슈타인의 상대성 이론","hintConfidence":3},"pairs":{"buddyWords":[{"w":"relative","ko":"상대적인","reason":"관련어 — 견주어 정해지는"},{"w":"physics","ko":"물리학","reason":"관련어 — 이론이 속한 분야"},{"w":"absoluteness","ko":"절대성","reason":"반의어 — 변치 않음"}],"collocBest":[{"en":"theory of relativity","ko":"상대성 이론"},{"en":"general relativity","ko":"일반 상대성 이론"}]},"nuance":{"koSimple":"기준에 따라 시간·공간이 달라진다는 상대성 개념을 뜻하는 말이야.","whenToUse":"아인슈타인의 이론이나 상대적 비교를 말할 때 자주 등장하는 말이야."},"krDetail":[{"ko":"상대성","explain":"보는 기준에 따라 다름"},{"ko":"상대성 이론","explain":"아인슈타인의 물리 이론"}],"usageExamples":[{"en":"The concept of relativity applies to more than just physics.","ko":"상대성이라는 개념은 물리학에만 적용되는 것이 아니다."},{"en":"He explained relativity using a simple everyday example.","ko":"그는 간단한 일상적 예를 들어 상대성을 설명했다."}],"grammarNote":"보통 셀 수 없는 명사로 관사 없이 쓰며, \"the theory of relativity(상대성 이론)\"라는 표현으로 굳어져 자주 등장한다. 형용사 relative(상대적인)와 어원이 같다.","grammarQuiz":[{"sentence":"Einstein's theory of _____ changed our understanding of the universe.","ko":"아인슈타인의 상대성 이론은 우주에 대한 우리의 이해를 바꿨다.","answer":"relativity","hint":"전치사 of + 명사"}]},
    {"id":"n07676","w":"addiction","pos":["noun"],"ph":"/əˈdɪkʃən/","cefr":"B2","kr":["중독"],"ex":[{"en":"Experts warn that smartphone addiction is rising among teenagers.","ko":"전문가들은 십 대 사이에서 스마트폰 중독이 증가하고 있다고 경고한다."}],"mnemonic":{"soundHint":"어딕션","story":"게임 중독에서 벗어나기 힘들다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"dependence","ko":"의존","reason":"동의어 — 기대어 삼"},{"w":"compulsion","ko":"강박","reason":"동의어 — 참지 못함"},{"w":"abstinence","ko":"절제","reason":"반의어 — 끊고 참음"}],"collocBest":[{"en":"drug addiction","ko":"약물 중독"},{"en":"overcome an addiction","ko":"중독을 극복하다"}]},"nuance":{"koSimple":"특정 대상에 병적으로 매달려 스스로 조절 못 하는 중독 상태야.","whenToUse":"약물·게임·SNS·설탕 중독 등을 진지하게 이야기할 때 자주 써."},"krDetail":[{"ko":"중독","explain":"끊지 못하고 빠짐"}],"usageExamples":[{"en":"His addiction to gambling nearly destroyed his family.","ko":"그의 도박 중독은 가족을 거의 파탄 낼 뻔했다."},{"en":"Overcoming an addiction often requires professional help.","ko":"중독을 극복하려면 흔히 전문가의 도움이 필요하다."}],"grammarNote":"무엇에 중독됐는지는 전치사 to로 연결해 \"addiction to ~\"로 쓴다. 동사는 be addicted to, 형용사는 addictive(중독성 있는)로 형태가 달라 구분해야 한다.","grammarQuiz":[{"sentence":"Social media _____ is becoming a serious concern among teenagers.","ko":"소셜 미디어 중독은 십 대들 사이에서 심각한 우려가 되고 있다.","answer":"addiction","hint":"명사 + 명사 복합어 주어"}]},
    {"id":"n07678","w":"sociologists","pos":["noun"],"ph":"/ˌsoʊsiˈɑːlədʒɪsts/","cefr":"B2","kr":["사회학자"],"ex":[{"en":"Sociologists study how people behave within social groups.","ko":"사회학자들은 사람들이 사회 집단 안에서 어떻게 행동하는지 연구한다."}],"mnemonic":{"soundHint":"소셜+로지스트","story":"소셜(social) 로지스트 = 사회를 연구하는 학자들","hintConfidence":3},"pairs":{"buddyWords":[{"w":"researchers","ko":"연구자","reason":"상위어 — 파고드는 사람"},{"w":"anthropologists","ko":"인류학자","reason":"관련어 — 인간 연구자"},{"w":"psychologists","ko":"심리학자","reason":"관련어 — 마음 연구자"}],"collocBest":[{"en":"sociologists argue that","ko":"사회학자들은 ~라고 주장한다"},{"en":"according to sociologists","ko":"사회학자들에 따르면"}]},"nuance":{"koSimple":"사회 현상과 인간 행동을 연구하는 학자들을 뜻해요.","whenToUse":"사회학 논문·조사 결과를 인용·설명할 때 자주 써요."},"krDetail":[{"ko":"사회학자","explain":"사회를 연구하는 사람"}],"usageExamples":[{"en":"Sociologists have long debated the causes of inequality.","ko":"사회학자들은 불평등의 원인을 두고 오랫동안 논쟁해 왔다."},{"en":"A team of sociologists surveyed thousands of households.","ko":"한 사회학자 팀이 수천 가구를 조사했다."}],"grammarNote":"sociologist(사회학자)의 복수형으로, 학문명 sociology(사회학)에 -ist가 붙어 '~학자'가 된 형태다. 주어로 쓰면 복수 동사(have, study 등)와 호응한다.","grammarQuiz":[{"sentence":"_____ study how people interact within social groups.","ko":"사회학자들은 사람들이 사회 집단 안에서 어떻게 상호작용하는지 연구한다.","answer":"sociologists","hint":"복수명사 주어"}]},
    {"id":"n07680","w":"bigot","pos":["noun"],"ph":"/ˈbɪɡət/","cefr":"B2","kr":["편협한 사람","편견쟁이"],"ex":[{"en":"No one wants to be seen as a bigot who refuses to listen.","ko":"아무도 남의 말을 듣지 않는 편협한 사람으로 보이고 싶어 하지 않는다."}],"mnemonic":{"soundHint":"비겥","story":"'비'뚤어진 'God' 신봉자 = 편협한 사람","hintConfidence":3},"pairs":{"buddyWords":[{"w":"fanatic","ko":"광신자","reason":"동의어 — 지나치게 빠진 사람"},{"w":"racist","ko":"인종차별주의자","reason":"관련어 — 편견 가진 이"},{"w":"moderate","ko":"온건한 사람","reason":"반의어 — 치우치지 않은 이"}],"collocBest":[{"en":"a narrow-minded bigot","ko":"속 좁은 편견쟁이"},{"en":"labeled a bigot","ko":"편협한 사람으로 낙인찍힌"}]},"nuance":{"koSimple":"편견에 사로잡혀 남을 배척하는 완고한 사람을 뜻해요.","whenToUse":"인종·종교 차별 태도를 강하게 비난할 때 써요."},"krDetail":[{"ko":"편협한 사람","explain":"생각이 좁은 사람"},{"ko":"편견쟁이","explain":"치우친 생각을 가진 이"}],"usageExamples":[{"en":"He was raised by a bigot who distrusted anyone different.","ko":"그는 자기와 다른 사람을 모두 불신하는 편협한 사람 밑에서 자랐다."},{"en":"Calling someone a bigot is a serious accusation.","ko":"누군가를 편견쟁이라고 부르는 것은 심각한 비난이다."}],"grammarNote":"'편견이 심해 남을 인정하지 않는 사람'을 뜻하는 가산명사로 a/an과 함께 쓴다. 형용사형은 bigoted(편협한), 추상명사는 bigotry(편협함)이다.","grammarQuiz":[{"sentence":"A _____ refuses to accept people who are different from them.","ko":"편협한 사람은 자신과 다른 사람들을 받아들이기를 거부한다.","answer":"bigot","hint":"관사 a + 단수명사 주어"}]},
    {"id":"n07681","w":"objectivity","pos":["noun"],"ph":"/ˌɑːbdʒɛkˈtɪvɪti/","cefr":"B2","kr":["객관성"],"ex":[{"en":"Journalists are expected to maintain objectivity in their reporting.","ko":"기자들은 보도에서 객관성을 유지할 것으로 기대된다."}],"mnemonic":{"soundHint":"어브젝티비티","story":"object(대상)를 있는 그대로 = 객관성","hintConfidence":3},"pairs":{"buddyWords":[{"w":"neutrality","ko":"중립성","reason":"동의어 — 어느 편도 안 듦"},{"w":"fairness","ko":"공정함","reason":"동의어 — 치우침 없음"},{"w":"subjectivity","ko":"주관성","reason":"반의어 — 제 생각대로 봄"}],"collocBest":[{"en":"maintain objectivity","ko":"객관성을 유지하다"},{"en":"scientific objectivity","ko":"과학적 객관성"}]},"nuance":{"koSimple":"개인 감정을 배제한 공정하고 객관적인 태도를 말해요.","whenToUse":"보도·평가·연구가 공정한지 논할 때 자주 써요."},"krDetail":[{"ko":"객관성","explain":"치우치지 않고 봄"}],"usageExamples":[{"en":"Scientists strive for objectivity when interpreting data.","ko":"과학자들은 데이터를 해석할 때 객관성을 유지하려 애쓴다."},{"en":"It is hard to maintain objectivity about people we love.","ko":"우리가 사랑하는 사람들에 대해 객관성을 유지하기란 어렵다."}],"grammarNote":"셀 수 없는 추상명사로 관사 없이 쓰며, \"maintain/keep objectivity(객관성을 유지하다)\"로 자주 결합한다. 반대말은 subjectivity(주관성), 형용사는 objective(객관적인)이다.","grammarQuiz":[{"sentence":"Journalists should maintain _____ when reporting the news.","ko":"기자들은 뉴스를 보도할 때 객관성을 유지해야 한다.","answer":"objectivity","hint":"maintain + 명사 목적어"}]},
    {"id":"n07055","w":"ancient","pos":["adjective"],"ph":"/ˈeɪnʃənt/","cefr":"B2","kr":["고대의","아주 오래된"],"ex":[{"en":"Archaeologists discovered ancient ruins hidden deep in the jungle after years of dedicated searching.","ko":"고고학자들은 수년간의 헌신적인 탐색 끝에 정글 깊숙이 숨겨진 고대 유적을 발견했다."}],"mnemonic":{"soundHint":"에인션트","story":"'에인(엔션)트' 고대의(ancient) 유적.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"antique","ko":"골동품의, 고대의","reason":"동의어 — 오래된 것"},{"w":"aged","ko":"오래된, 나이든","reason":"동의어 — 세월 흐름"},{"w":"modern","ko":"현대의","reason":"반의어 — 정반대"}],"collocBest":[{"en":"ancient civilization","ko":"고대 문명"},{"en":"ancient ruins","ko":"고대 유적"}]},"nuance":{"koSimple":"고대의, 아주 오래된, 옛 문명·유적에 자주 쓰는 형용사","whenToUse":"고대 문명·유물·역사 등 아주 오래된 것을 묘사할 때 사용"},"krDetail":[{"ko":"고대의","explain":"아주 먼 옛날 시대의"},{"ko":"아주 오래된","explain":"세월이 매우 지난"}],"usageExamples":[{"en":"The museum displays ancient coins that date back over two thousand years.","ko":"그 박물관은 2천 년도 더 된 고대 동전들을 전시하고 있다."},{"en":"My grandmother still cooks using an ancient recipe passed down through generations.","ko":"우리 할머니는 여전히 여러 세대에 걸쳐 전해 내려온 아주 오래된 조리법으로 요리하신다."}],"grammarNote":"ancient는 명사를 앞에서 꾸미는 한정적 용법으로 주로 쓰이며, 'ancient civilization', 'ancient times', 'ancient ruins'처럼 명사와 결합해 관용적인 표현을 이룬다.","grammarQuiz":[{"sentence":"The museum displays _____ artifacts from thousands of years ago.","ko":"그 박물관은 수천 년 전의 고대 유물들을 전시한다.","answer":"ancient","hint":"형용사 + 명사 구조"}]},
    {"id":"n07066","w":"psychologists","pos":["noun"],"ph":"/saɪˈkɑːlədʒɪsts/","cefr":"B2","kr":["심리학자"],"ex":[{"en":"Many psychologists believe that childhood experiences strongly shape adult personality and long-term behavior patterns.","ko":"많은 심리학자들은 어린 시절 경험이 성인의 성격과 장기적 행동 양식을 강하게 형성한다고 믿는다."}],"mnemonic":{"soundHint":"사이콜로지스츠","story":"'싸이(psycho) + 콜로지' 심리학자들(psychologists).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"therapist","ko":"치료사","reason":"관련어 — 마음 치료"},{"w":"counselor","ko":"상담사","reason":"관련어 — 심리 상담"},{"w":"psychiatrist","ko":"정신과 의사","reason":"혼동 주의 — 의사 vs 학자"}],"collocBest":[{"en":"child psychologists","ko":"아동 심리학자"},{"en":"psychologists suggest","ko":"심리학자들이 제안하다"}]},"nuance":{"koSimple":"psychologist의 복수형, 여러 명의 심리학자·심리 전문가 집단","whenToUse":"심리 연구·상담 전문가 집단의 견해나 연구를 소개할 때 사용"},"krDetail":[{"ko":"심리학자","explain":"마음을 연구하는 사람"}],"usageExamples":[{"en":"Several psychologists were invited to discuss the effects of stress on teenagers.","ko":"여러 심리학자들이 스트레스가 십 대에게 미치는 영향을 논의하기 위해 초청되었다."},{"en":"Sports psychologists help athletes stay calm before important competitions.","ko":"스포츠 심리학자들은 선수들이 중요한 경기 전에 침착함을 유지하도록 돕는다."}],"grammarNote":"psychologists는 psychologist의 복수형으로, 복수 주어이므로 뒤따르는 동사도 복수형(believe, argue 등)을 쓴다. 학문 분야는 psychology, 형용사는 psychological이다.","grammarQuiz":[{"sentence":"Many _____ believe that childhood experiences shape adult behavior.","ko":"많은 심리학자들은 어린 시절 경험이 성인의 행동을 형성한다고 믿는다.","answer":"psychologists","hint":"주어 자리에 복수 명사"}]},
    {"id":"n07067","w":"affect","pos":["verb","noun"],"ph":"/əˈfɛkt/","cefr":"B2","kr":["영향을 미치다","감정"],"ex":[{"en":"The lack of sleep can seriously affect a student's ability to focus during exams.","ko":"수면 부족은 시험 중 학생의 집중력에 심각하게 영향을 줄 수 있다."}],"mnemonic":{"soundHint":"어펙트","story":"'어! 팩트(fact)!' 사실이 영향을 미친다(affect).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"influence","ko":"영향을 주다","reason":"동의어 — 영향"},{"w":"impact","ko":"영향을 주다","reason":"동의어 — 강한 영향"},{"w":"effect","ko":"결과, 효과","reason":"혼동 주의 — 명사/결과"}],"collocBest":[{"en":"affect the outcome","ko":"결과에 영향을 주다"},{"en":"deeply affect","ko":"깊이 영향을 미치다"}]},"nuance":{"koSimple":"'~에 영향을 미치다', 대상의 상태·감정을 바꾸어 놓는 것","whenToUse":"원인이 결과·감정·행동에 영향을 준다고 설명할 때 사용"},"krDetail":[{"ko":"영향을 미치다","explain":"어떤 변화를 일으키다"},{"ko":"감정","explain":"마음속에 드는 느낌"}],"usageExamples":[{"en":"Rising temperatures will affect crop production across the entire region.","ko":"기온 상승은 그 지역 전체의 농작물 생산에 영향을 미칠 것이다."},{"en":"The way we speak to children can deeply affect their confidence.","ko":"우리가 아이들에게 말하는 방식은 그들의 자신감에 깊이 영향을 미칠 수 있다."}],"grammarNote":"affect는 주로 타동사로 '~에 영향을 미치다'를 뜻하며 전치사 없이 목적어를 바로 취한다. 명사 effect(결과·영향)와 혼동하지 않도록 주의한다: affect(동사) vs effect(명사).","grammarQuiz":[{"sentence":"Lack of sleep can seriously _____ your ability to concentrate.","ko":"수면 부족은 집중력에 심각한 영향을 미칠 수 있다.","answer":"affect","hint":"조동사 can 뒤 동사원형"}]},
    {"id":"n07077","w":"technological","pos":["adjective"],"ph":"/ˌtɛknəˈlɑːdʒɪkəl/","cefr":"B2","kr":["기술의","과학 기술의"],"ex":[{"en":"Rapid technological advances have completely transformed how we communicate with people around the world.","ko":"빠른 기술적 발전은 우리가 전 세계 사람들과 소통하는 방식을 완전히 바꿔 놓았다."}],"mnemonic":{"soundHint":"테크놀로지컬","story":"'테크놀로지(technology) + 컬' 기술의(technological).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"technical","ko":"기술적인","reason":"혼동 주의 — 철자 비슷"},{"w":"scientific","ko":"과학의","reason":"관련어 — 과학 분야"},{"w":"digital","ko":"디지털의","reason":"관련어 — 첨단 기술"}],"collocBest":[{"en":"technological advances","ko":"기술적 진보"},{"en":"technological progress","ko":"기술적 진전"}]},"nuance":{"koSimple":"기술적인, 첨단 기술과 관련된, technology의 형용사형","whenToUse":"기술 발전·변화가 만든 결과·환경을 형용할 때 자주 사용"},"krDetail":[{"ko":"기술의","explain":"만드는 재주와 관련된"},{"ko":"과학 기술의","explain":"과학을 응용한 기술의"}],"usageExamples":[{"en":"Technological progress has made remote work possible for millions of people.","ko":"기술의 발전은 수백만 명에게 원격 근무를 가능하게 만들었다."},{"en":"The company invests heavily in technological research every single year.","ko":"그 회사는 매년 기술 연구에 막대하게 투자한다."}],"grammarNote":"technological은 명사 technology의 형용사형으로 '기술과 관련된'을 뜻한다. 'technological advance/innovation/change'처럼 명사를 수식하며, 부사형은 technologically이다.","grammarQuiz":[{"sentence":"Rapid _____ advances have transformed the way we communicate.","ko":"급속한 기술적 발전이 우리의 소통 방식을 변화시켰다.","answer":"technological","hint":"형용사 + 명사(advances) 수식"}]},
    {"id":"n07095","w":"neurons","pos":["noun"],"ph":"/ˈnʊrɑːnz/","cefr":"B2","kr":["신경 세포","뉴런"],"ex":[{"en":"Human brains contain billions of neurons that transmit signals faster than any current computer.","ko":"인간의 뇌에는 어떤 현대 컴퓨터보다 빠르게 신호를 전달하는 수십억 개의 뉴런이 있다."}],"mnemonic":{"soundHint":"뉴런스","story":"'뉴런(neuron)'들이 뇌 안에서 신호를 주고받는다(neurons).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"nerve","ko":"신경","reason":"관련어 — 신경 조직"},{"w":"cell","ko":"세포","reason":"상위어 — 세포의 한 종류"},{"w":"synapse","ko":"시냅스","reason":"관련어 — 뉴런 연결부"}],"collocBest":[{"en":"brain neurons","ko":"뇌 뉴런"},{"en":"connected neurons","ko":"연결된 뉴런"}]},"nuance":{"koSimple":"neuron의 복수형, 뇌·신경계의 여러 신경세포를 지칭하는 말","whenToUse":"뇌·신경 과학에서 신호를 주고받는 세포 집단을 설명할 때 사용"},"krDetail":[{"ko":"신경 세포","explain":"신호를 전달하는 세포"},{"ko":"뉴런","explain":"뇌의 신경 세포"}],"usageExamples":[{"en":"When we learn something new, neurons form fresh connections in the brain.","ko":"우리가 새로운 것을 배울 때, 뉴런들이 뇌 속에서 새로운 연결을 형성한다."},{"en":"Scientists studied how neurons communicate through tiny electrical signals.","ko":"과학자들은 뉴런들이 미세한 전기 신호를 통해 어떻게 소통하는지 연구했다."}],"grammarNote":"neurons는 neuron의 복수형으로, 복수 주어이므로 동사도 복수 일치(form, fire 등)한다. 형용사형 neural은 'neural network(신경망)'처럼 쓰인다.","grammarQuiz":[{"sentence":"The human brain contains approximately 86 billion _____.","ko":"인간의 뇌는 약 860억 개의 신경 세포를 포함하고 있다.","answer":"neurons","hint":"숫자 뒤 복수 명사"}]},
    {"id":"n07123","w":"repetition","pos":["noun"],"ph":"/ˌrɛpɪˈtɪʃən/","cefr":"B2","kr":["반복"],"ex":[{"en":"Constant repetition of new vocabulary is essential to memorize words for a long time.","ko":"새 어휘의 꾸준한 반복은 단어를 오랫동안 기억하는 데 필수적이다."}],"mnemonic":{"soundHint":"레피티션","story":"'리피트(repeat) + 이션' - 반복(repetition).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"recurrence","ko":"재발, 반복","reason":"동의어 — 다시 일어남"},{"w":"iteration","ko":"반복, 되풀이","reason":"동의어 — 되풀이"},{"w":"variety","ko":"다양성","reason":"반의어 — 다양함"}],"collocBest":[{"en":"constant repetition","ko":"꾸준한 반복"},{"en":"avoid repetition","ko":"반복을 피하다"}]},"nuance":{"koSimple":"반복, 같은 행동·말·과정을 되풀이하는 것 또는 그 횟수","whenToUse":"학습·연습·리듬처럼 반복이 중요한 상황을 설명할 때 사용"},"krDetail":[{"ko":"반복","explain":"같은 것을 되풀이함"}],"usageExamples":[{"en":"Learning to play the piano requires hours of patient repetition.","ko":"피아노 연주를 배우는 데는 인내심 있는 반복이 몇 시간씩 필요하다."},{"en":"The song's simple repetition makes it very easy to remember.","ko":"그 노래의 단순한 반복은 그것을 매우 기억하기 쉽게 만든다."}],"grammarNote":"repetition은 셀 수 없는 명사로도, 셀 수 있는 명사로도 쓰인다. 'through repetition(반복을 통해)'처럼 전치사와 자주 결합하며, 동사형은 repeat이다.","grammarQuiz":[{"sentence":"Learning a new language requires constant _____ of vocabulary and grammar.","ko":"새로운 언어를 배우려면 어휘와 문법의 끊임없는 반복이 필요하다.","answer":"repetition","hint":"형용사(constant) 뒤 명사"}]},
    {"id":"n07136","w":"hippocampus","pos":["noun"],"ph":"/ˌhɪpəˈkæmpəs/","cefr":"B2","kr":["해마"],"ex":[{"en":"The hippocampus plays a critical role in forming new memories and helping spatial navigation.","ko":"해마는 새로운 기억을 형성하고 공간 탐색을 돕는 데 결정적인 역할을 한다."}],"mnemonic":{"soundHint":"히포캠퍼스","story":"'히포(hippo, 해마) + 캠퍼스' - 기억 담당 뇌 부위(hippocampus).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"brain","ko":"뇌","reason":"상위어 — 뇌의 일부"},{"w":"memory","ko":"기억","reason":"관련어 — 기억 담당"},{"w":"amygdala","ko":"편도체","reason":"관련어 — 인접 뇌 부위"}],"collocBest":[{"en":"the hippocampus","ko":"해마"},{"en":"damaged hippocampus","ko":"손상된 해마"}]},"nuance":{"koSimple":"해마, 뇌 속 기억·학습을 담당하는 좌우 대칭 구조물","whenToUse":"기억·학습·공간 지각 관련 뇌 부위를 설명할 때 자주 사용"},"krDetail":[{"ko":"해마","explain":"기억을 만드는 뇌 부위"}],"usageExamples":[{"en":"Damage to the hippocampus can make it hard to form new memories.","ko":"해마가 손상되면 새로운 기억을 형성하기 어려워질 수 있다."},{"en":"The hippocampus becomes very active while we are learning directions.","ko":"해마는 우리가 길을 익히는 동안 매우 활발해진다."}],"grammarNote":"hippocampus는 뇌의 특정 부위를 가리키는 단수 명사로 보통 정관사 the와 함께 쓴다. 복수형은 라틴어에서 유래해 hippocampi로 변화한다.","grammarQuiz":[{"sentence":"The _____ plays a crucial role in forming new memories.","ko":"해마는 새로운 기억을 형성하는 데 중요한 역할을 한다.","answer":"hippocampus","hint":"주어 자리 명사 (뇌 구조)"}]},
    {"id":"n07138","w":"dependence","pos":["noun"],"ph":"/dɪˈpɛndəns/","cefr":"B2","kr":["의존","종속"],"ex":[{"en":"Our dependence on smartphones has grown quickly over the past decade in most countries.","ko":"우리의 스마트폰 의존은 지난 십 년간 대부분의 나라에서 빠르게 커졌다."}],"mnemonic":{"soundHint":"디펜던스","story":"'디펜(depend) + 던스' - 의존(dependence).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"reliance","ko":"의존","reason":"동의어 — 기댐"},{"w":"independence","ko":"독립","reason":"반의어 — 정반대"},{"w":"addiction","ko":"중독","reason":"관련어 — 끊지 못함"}],"collocBest":[{"en":"dependence on","ko":"~에 대한 의존"},{"en":"drug dependence","ko":"약물 의존"}]},"nuance":{"koSimple":"의존, 남·물건·물질에 기대어 벗어나지 못하는 상태","whenToUse":"약물·기술·타인에 대한 의존 문제를 다룰 때 자주 사용"},"krDetail":[{"ko":"의존","explain":"남에게 기대어 지냄"},{"ko":"종속","explain":"남에게 딸려 매임"}],"usageExamples":[{"en":"The country is trying to reduce its dependence on imported oil.","ko":"그 나라는 수입 석유에 대한 의존을 줄이려 애쓰고 있다."},{"en":"His dependence on his parents lasted well into his late twenties.","ko":"부모에 대한 그의 의존은 20대 후반까지도 계속되었다."}],"grammarNote":"dependence는 뒤에 전치사 on을 취해 'dependence on ~(~에 대한 의존)' 형태로 쓴다. 형용사형은 dependent(on), 반대말은 independence이다.","grammarQuiz":[{"sentence":"Our growing _____ on technology has raised concerns among educators.","ko":"기술에 대한 우리의 증가하는 의존은 교육자들 사이에서 우려를 불러일으켰다.","answer":"dependence","hint":"dependence on ~에 대한 의존"}]},

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const SFX = {
  // jp-pachinko-hit: 1200Hz sine 100ms 빠른 감쇠
  correct(){

  wrong(){
    tone({type:"square", freq:160, dur:.18, vol:.18, t0:0});
    tone({type:"square", freq:120, dur:.20, vol:.16, t0:.06});
  },
  // jp-slot-jackpot: 도-솔-도-미 차임 4단
  levelUp(){
    const notes = [523.25, 783.99, 1046.50, 1318.51]; // C5 G5 C6 E6
    notes.forEach((f,i)=> tone({type:"sine", freq:f, dur:.22, vol:.22, t0:i*.13}));
    tone({type:"triangle", freq:2093.00, dur:.4, vol:.18, t0:.55}); // 종소리 C7
  },
  // jp-chime-asc: 800→1000→1200 3단
  streak(){
    [880, 1100, 1320].forEach((f,i)=> tone({type:"sine", freq:f, dur:.12, vol:.18, t0:i*.07}));
  },
  // arcade-fireworks: noise 펑 + 떨어지는 sine
  fireworks(){
    noise({dur:.18, vol:.22, t0:0, hp:600});
    for(let i=0;i<6;i++){
      tone({type:"sine", freq:1500-i*180, dur:.10, vol:.10, t0:.05+i*.05});
    }
  },
  // arcade-flip: 화이트 노이즈 30ms
  cardFlip(){
    noise({dur:.04, vol:.10, hp:2000});
  },
  // jp-coin-payout: 2000Hz square 8회 빠르게
  coinDrop(){
    for(let i=0;i<8;i++){
      tone({type:"square", freq:1800+Math.random()*600, dur:.04, vol:.10, t0:i*.05});
    }
  },
  // jp-slot-spin: 600Hz square 50ms × 8
  spinReel(){
    for(let i=0;i<8;i++){
      tone({type:"square", freq:600, dur:.04, vol:.10, t0:i*.05});
    }
  },
  // jp-bigwin: 도-미-솔-도-미-솔-도(고)-도(고) 8단
  bigWin(){
    const notes = [523.25,659.25,783.99,1046.50,1318.51,1567.98,2093.00,2637.02];
    notes.forEach((f,i)=> tone({type:"sine", freq:f, dur:.18, vol:.22, t0:i*.10}));
    tone({type:"triangle", freq:2637.02, dur:.6, vol:.20, t0:.85});
    // coins
    for(let i=0;i<14;i++){
      tone({type:"square", freq:1800+Math.random()*800, dur:.04, vol:.08, t0:.8+i*.04});
    }
  },
  type(){
    tone({type:"square", freq:1500, dur:.02, vol:.05});
  },
  // ── 심화 90%+ 전용 : 명랑·화려·인상 깊은 팡파레 조합 ──
  // 1) 브라스 팡파레 (C→F→G→C major 상승) 화음 4단
  // 2) 크리스탈 아르페지오 8음 (C5→E7)
  // 3) 종·코인·환호 노이즈
  grandFanfare(){
    // 1) 브라스 트라이애드 상승 (sawtooth = 브라스 느낌)
    const chords = [
      { t:0.00, notes:[261.63, 329.63, 392.00] },   // C major (C4 E4 G4)
      { t:0.16, notes:[349.23, 440.00, 523.25] },   // F major (F4 A4 C5)
      { t:0.32, notes:[392.00, 493.88, 587.33] },   // G major (G4 B4 D5)
      { t:0.48, notes:[523.25, 659.25, 783.99] }    // C major 옥타브 (C5 E5 G5) — 절정
    ];
    chords.forEach(ch => {
      ch.notes.forEach(f => {
        tone({ type:"sawtooth", freq:f, dur:.22, vol:.12, atk:.008, t0:ch.t });
        // 부드러운 sine 배음 살짝 얹기
        tone({ type:"sine",     freq:f*2, dur:.20, vol:.05, t0:ch.t });
      });
    });
    // 브라스 절정 뒤 강타 (C5 saw 길게)
    tone({ type:"sawtooth", freq:523.25, dur:.35, vol:.14, t0:.48 });

    // 2) 크리스탈 아르페지오 8음 (도미솔도 두 옥타브)
    const arp = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00, 2637.02];
    arp.forEach((f,i) => {
      tone({ type:"sine",     freq:f, dur:.15, vol:.20, atk:.003, t0:.75 + i*.055 });
      tone({ type:"triangle", freq:f*2, dur:.10, vol:.08, t0:.75 + i*.055 });
    });

    // 3) 절정 종소리 (E7 · G7 벨)
    tone({ type:"triangle", freq:2637.02, dur:.65, vol:.20, t0:1.22 });
    tone({ type:"sine",     freq:3135.96, dur:.45, vol:.14, t0:1.30 });
    tone({ type:"triangle", freq:2093.00, dur:.55, vol:.16, t0:1.40 });

    // 4) 코인·불꽃 노이즈 (환호 느낌)
    for(let i=0;i<18;i++){
      tone({ type:"square", freq:1900+Math.random()*900, dur:.035, vol:.06, t0:1.25 + i*.038 });
    }
    noise({ dur:.15, vol:.14, hp:800, t0:1.20 });
  }
};

/* ============================================================
   PARTICLES (Canvas)
   ============================================================ */
const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

/* ============================================================
   TIMER
   ============================================================ */
function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function startTimer(){
  if(state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(()=>{
    if(state.phase === "result"){ clearInterval(state.tickHandle); return; }
    const el = Date.now() - state.startTime + (state.sessionElapsedBase || 0);
    document.getElementById("timerVal").textContent = fmtTime(el);
  }, 1000);
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

        <button class="grade-btn next" data-nav="next"><span class="ic">➡️</span>${state.cardIdx >= state.cards.length - 1 ? "Quiz" : "Next"}</button>
      </div>
      <div class="flip-hint">⌨️ Space로 뒤집기 · 1/2/3 = Previous / Home / Next</div>
    </div>
  `;

  const card = document.getElementById("flipcard");
  card.addEventListener("click", flipCard);
  document.getElementById("speakBtn").addEventListener("click", (e)=>{
    e.stopPropagation();
    speak(w.w);
  });
  // 콜로케이션·예문 스피커 버튼 (뒷면)
  card.querySelectorAll(".speak-btn[data-speak]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const t = btn.getAttribute("data-speak");
      if(t) speak(t);
    });
  });
  // nav buttons (Previous / Home / Next)
  document.querySelectorAll(".grade-btn").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      if(btn.disabled) return;
      navCard(btn.dataset.nav);
    });
  });
}

function flipCard(){
  const card = document.getElementById("flipcard");
  if(!card) return;
  state.flipped = !state.flipped;
  card.classList.toggle("flipped", state.flipped);
  SFX.cardFlip();
  if(state.flipped){
    const w = state.cards[state.cardIdx];
    speak(w.w);
  }
}

function navCard(dir){
  if(dir === "home"){
    SFX.cardFlip();
    renderHome();
    return;
  }
  if(dir === "prev"){
    if(state.cardIdx > 0){
      state.cardIdx--;
      SFX.cardFlip();
      renderCard();
    }
    return;
  }
  // next
  if(state.cardIdx >= state.cards.length - 1){
    // 마지막 카드에서 Next → 미니퀴즈 진입
    state.cardIdx = state.cards.length;
    startQuiz();
    return;
  }
  state.cardIdx++;
  SFX.cardFlip();
  renderCard();
}

/* ============================================================
   QUIZ (15문항)
   ============================================================ */
const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  const pool = [];
  const words = [...DATA.newWords];
  // 셔플
  const shuffled = shuffle(words).slice(0, 15);
  // 모드 균등 분배 (대략)
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];
  shuffle(modeOrder);
  shuffled.forEach((w,i)=>{
    pool.push({ word:w, mode: modeOrder[i] });
  });
  return pool;
}

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  const collocPool = [];
  const clozePool  = [];
  const grammarPool = [];
  for(const w of DATA.newWords){
    // (1) 콜로케이션 영작
    if(w.pairs && w.pairs.collocBest){
      for(const c of w.pairs.collocBest){
        if(c && c.en && c.ko) collocPool.push({ word:w, mode:"colloc-write", colloc:c });
      }
    }
    // (2) 예문 빈칸 채우기
    if(w.ex && w.ex[0] && w.ex[0].en && w.ex[0].ko){
      const tokens = parseSentence(w.ex[0].en);
      const blankIdxs = pickBlanks(tokens, w.w);
      if(blankIdxs.length >= 1){
        clozePool.push({
          word:w, mode:"cloze",
          sentence:{ en:w.ex[0].en, ko:w.ex[0].ko },
          tokens, blankIdxs
        });
      }
    }
    // (3) 문법 빈칸 채우기
    if(Array.isArray(w.grammarQuiz)){
      for(const q of w.grammarQuiz){
        if(q && q.sentence && q.ko && q.answer){
          grammarPool.push({ word:w, mode:"grammar-fill", quiz:q });
        }
      }
    }
  }
  shuffle(collocPool); shuffle(clozePool); shuffle(grammarPool);
  const TARGET = 20;
  const picked = [];
  // 문법 우선 (있으면 최대 8개 or pool의 절반)
  const gTake = Math.min(grammarPool.length, Math.max(1, Math.min(8, Math.ceil(grammarPool.length / 2))));
  picked.push(...grammarPool.slice(0, gTake));
  // 나머지 자리는 콜로/예문 균등
  const rest = TARGET - picked.length;
  const cTake = Math.min(collocPool.length, Math.ceil(rest / 2));
  const zTake = Math.min(clozePool.length, rest - cTake);
  picked.push(...collocPool.slice(0, cTake));
  picked.push(...clozePool.slice(0, zTake));
  // 부족하면 남은 후보에서 보충
  if(picked.length < TARGET){
    const leftover = [
      ...grammarPool.slice(gTake),
      ...collocPool.slice(cTake),
      ...clozePool.slice(zTake)
    ];
    shuffle(leftover);
    picked.push(...leftover.slice(0, TARGET - picked.length));
  }
  shuffle(picked);
  return picked.slice(0, TARGET);
}

function renderQuiz(){

    finishSession();
    return;
  }
  state.quizAnswered = false;
  state.quizCurrent = state.quizPool[state.quizIdx];
  renderHeader();

  const { word, mode } = state.quizCurrent;
  const main = document.getElementById("main");

  let modeLabel = ({
    "meaning-mcq":"영→한 의미",
    "word-mcq":"한→영 단어",
    "spelling":"철자 입력",
    "listening":"듣고 받아쓰기",
    "colloc-write":"🎯 콜로케이션 영작",
    "cloze":"🎯 예문 빈칸 채우기",
    "grammar-fill":"📌 문법 서술형 빈칸"

    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}
      </div>`;
  } else if(mode === "word-mcq"){
    const correct = word.w;
    const distractors = pickDistractors(word, "w", 3);
    const opts = shuffle([correct, ...distractors]);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">다음 뜻의 단어는?</div>
        <div class="qkr">${escape(word.kr.join(" · "))}</div>
      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}
      </div>`;
  } else if(mode === "spelling"){
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">뜻을 보고 영어 단어를 입력하세요 <span class="prefill-hint">(첫 글자는 잠겨 있음)</span></div>
        <div class="qkr">${escape(word.kr.join(" · "))}</div>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <div class="word-answer" id="wordAnswer" data-answer="${escape(word.w)}"></div>
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "listening"){
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">발음을 듣고 단어를 입력하세요 <span class="prefill-hint">(첫 글자는 잠겨 있음)</span></div>
        <button class="lis-btn" id="lisBtn">🔊 다시 듣기</button>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <div class="word-answer" id="wordAnswer" data-answer="${escape(word.w)}"></div>
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "colloc-write"){
    const c = state.quizCurrent.colloc;
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">뜻에 맞는 <b>콜로케이션</b>을 영어로 쓰세요 <span class="prefill-hint">(각 단어 첫 글자 잠금)</span></div>
        <div class="qkr">${escape(c.ko)}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <div class="word-answer" id="wordAnswer" data-answer="${escape(c.en)}"></div>
        <button class="submit-btn" id="submitBtn">제출</button>

  } else if(mode === "cloze"){
    const { tokens, blankIdxs, sentence } = state.quizCurrent;
    const sentHTML = tokens.map((t, i) => {
      const bIdx = blankIdxs.indexOf(i);
      if(bIdx >= 0){
        return `<span class="word-answer inline cloze-wa" data-blank-idx="${bIdx}" data-answer="${escape(t.text)}"></span>`;

        <div class="qkr">${escape(sentence.ko)}</div>

      </div>`;

        <div class="qkr">${escape(quiz.ko)}</div>

  // wire
  if(mode === "meaning-mcq" || mode === "word-mcq"){
    document.querySelectorAll(".choice").forEach(btn=>{
      btn.addEventListener("click", ()=> handleChoice(btn));
    });

    document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    const first = document.querySelector(".cloze-wa .rest-input");
    if(first) setTimeout(()=>first.focus(), 100);
  } else {
    const container = document.getElementById("wordAnswer");
    renderWordAnswer(container, container.dataset.answer);
    document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    const first = container.querySelector(".rest-input");
    if(first) setTimeout(()=>first.focus(), 100);
    if(mode === "listening"){
      setTimeout(()=>speak(word.w), 250);
      document.getElementById("lisBtn").addEventListener("click", ()=>speak(word.w));

  }
}

function pickDistractors(word, field, n){
  const pool = DATA.newWords.filter(w=>w.id !== word.id);
  shuffle(pool);
  const seen = new Set();
  const out = [];
  for(const w of pool){
    let v;
    if(field === "kr") v = w.kr[0];
    else if(field === "w") v = w.w;
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function handleChoice(btn){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { word, mode } = state.quizCurrent;
  const picked = btn.dataset.v;
  const correct = (mode === "meaning-mcq") ? word.kr[0] : word.w;
  const isCorrect = picked === correct;

  document.querySelectorAll(".choice").forEach(c=>{
    if(c.dataset.v === correct) c.classList.add("correct");
    else if(c === btn && !isCorrect) c.classList.add("wrong");
    else c.classList.add("dimmed");
  });

  finishQuestion(isCorrect);
}

function handleSubmit(){
  if(state.quizAnswered) return;
  const { word, mode } = state.quizCurrent;

  // ── 심화: 예문 빈칸 · 문법 빈칸 ────────────────────────
  if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    if(containers.some(anyWordEmpty)) return;
    state.quizAnswered = true;
    let allOk = true;
    containers.forEach(function(c){
      const guess = normalizeAnswer(collectWordAnswer(c));
      const ans = normalizeAnswer(c.dataset.answer);
      const okAll = guess === ans;
      const perGroup = Array.from(c.querySelectorAll('.word-group')).map(function(g, i){
        const w = (c.dataset.answer || '').split(/\s+/)[i] || '';
        const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
        return normalizeAnswer(combined) === normalizeAnswer(w);
      });
      markWordAnswer(c, perGroup);
      if(!okAll) allOk = false;
    });
    document.getElementById("submitBtn").disabled = true;
    if(!allOk){
      const answers = containers.map(function(c){ return `<b style="color:var(--grade)">${escape(c.dataset.answer)}</b>`; }).join(" , ");
      document.getElementById("feedback").innerHTML = `정답: ${answers}`;
    }
    finishQuestion(allOk);
    return;
  }

  // ── 기본/심화 단일 컨테이너: spelling / listening / colloc-write
  const container = document.getElementById("wordAnswer");
  if(!container) return;
  if(anyWordEmpty(container)) return;
  state.quizAnswered = true;
  const correctAns = container.dataset.answer;
  const guess = normalizeAnswer(collectWordAnswer(container));
  const isCorrect = guess === normalizeAnswer(correctAns);
  const perGroup = Array.from(container.querySelectorAll('.word-group')).map(function(g, i){
    const w = (correctAns || '').split(/\s+/)[i] || '';
    const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
    return normalizeAnswer(combined) === normalizeAnswer(w);
  });
  markWordAnswer(container, perGroup);
  document.getElementById("submitBtn").disabled = true;
  if(!isCorrect){
    document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(correctAns)}</b>`;
  }
  finishQuestion(isCorrect);
}

function finishQuestion(isCorrect){
  const { word } = state.quizCurrent;
  const fb = document.getElementById("feedback");
  if(isCorrect){
    state.quizCorrect++;
    state.streak++;
    state.xp += DATA.xpTable.correct;
    promoteBox(word.id);
    SFX.correct();
    fb.classList.add("ok");
    fb.textContent = "정답! +" + DATA.xpTable.correct + " XP " + (state.cbMode ? "✓" : "");
    document.querySelector(".quiz-card").classList.add("bounce-correct");
    handleStreak();
  } else {
    state.streak = 0;
    demoteBox(word.id);
    state.quizWrongIds.add(word.id);
    state.quizWrongItems.push(state.quizCurrent);
    SFX.wrong();
    fb.classList.add("bad");
    if(!fb.textContent) fb.textContent = "오답! " + (state.cbMode ? "✕ " : "") + " 정답: " + word.w;
    document.querySelector(".quiz-card").classList.add("shake");
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.perChapterMaxStreak = Math.max(state.perChapterMaxStreak, state.streak);
  renderHeader();

  setTimeout(()=>{
    state.quizIdx++;
    renderQuiz();
  }, isCorrect ? 900 : 1500);
}

   RESULT
   ============================================================ */
function finishSession(){
  state.phase = "result";
  if(state.tickHandle) clearInterval(state.tickHandle);
  const total = state.quizPool.length;
  const correct = state.quizCorrect;
  const pct = Math.round(correct / total * 100);
  const isPerfect = correct === total;
  const elapsed = Date.now() - state.startTime + (state.sessionElapsedBase || 0);

  const isAdv = state.quizType === "advanced";
  const clearFlag = isAdv ? "advancedCleared" : "chapterCleared";
  const clearKey  = isAdv ? (KEY+":cleared_adv") : (KEY+":cleared");
  const resultKey = isAdv ? (KEY+":lastResult_adv") : (KEY+":lastResult");

  // chapter clear?
  let bonusXP = 0;
  const newCleared = !state[clearFlag];
  if(newCleared){
    bonusXP += DATA.xpTable.firstClear;
    state[clearFlag] = true;
    lsSet(clearKey, true);
  }
  // 기본단계 90%+ 달성 → 심화 잠금 해제 (한 번 해금되면 유지)
  let newUnlock = false;
  if(!isAdv && pct >= 90 && !state.basicThresholdPassed){
    state.basicThresholdPassed = true;
    lsSet(KEY+":basic_90pct", true);
    newUnlock = true;
  }
  if(isPerfect){
    bonusXP += DATA.xpTable.perfectChapter;
    state.perfectFlag = true;
  }
  state.xp += bonusXP;
  state.xpTotal += state.xp;
  state.globalMaxStreak = Math.max(state.globalMaxStreak, state.maxStreak);
  lsSet(XP_GLOBAL_KEY, state.xpTotal);
  lsSet(MAXSTREAK_KEY, state.globalMaxStreak);
  lsSet(resultKey, { date:Date.now(), correct, total, xp:state.xp, elapsed });

  // badges
  const earnedBadges = [];
  if(newCleared) earnedBadges.push(DATA.badges.find(b=>b.id==="first-step"));
  if(state.maxStreak >= 10) earnedBadges.push(DATA.badges.find(b=>b.id==="streak-10"));
  if(isPerfect) earnedBadges.push(DATA.badges.find(b=>b.id==="perfect"));

  renderHeader();

  const main = document.getElementById("main");
  const stageLbl = isAdv ? "심화단계" : "기본단계";
  const passedM3 = (pct >= 60) && (DATA.grade === '중3');
  const isHighGrade = ['고1','고2','수능'].includes(DATA.grade);
  const highGradePerfect = isHighGrade && isAdv && isPerfect;
  const highGradeMsg = highGradePerfect ? pickHGMessage() : null;
  const title = highGradeMsg
    ? `🏆 ${escape(highGradeMsg)}`
    : passedM3
      ? `💰 방금 당신의 미래 연봉이 10만원 더 올라갔슴돠!!`
      : (isPerfect ? `🎊 ${stageLbl} 무결점 클리어!` : (pct >= 80 ? `🎉 ${stageLbl} 잘했어요!` : pct >= 60 ? `👍 ${stageLbl} 통과!` : "💪 다시 도전!"));

  // 심화면 [🎯 심화 다시] + [🏠 홈으로]. 기본이면 [🔁 다시 보기] + (심화 해금 시) [🎯 심화 도전]
  const canGoAdvanced = !isAdv && state.basicThresholdPassed;
  const advGrand = isAdv && pct >= 90;   // 심화 90%+ 특별 축포
  const unlockBanner = newUnlock
    ? `<div style="margin:8px auto 6px;padding:10px 14px;border-radius:var(--radius-md);
                   background:linear-gradient(135deg, rgba(168,85,247,.18), rgba(109,40,217,.10));
                   border:1px solid rgba(168,85,247,.55);color:#e9d5ff;font-weight:700;font-size:.98rem;
                   text-align:center;letter-spacing:.02em;">
         🎯 90% 이상 달성 — <b style="color:#c4b5fd">심화단계 해금!</b>
       </div>`
    : "";
  const grandBanner = advGrand
    ? `<div class="grand-banner">
         <div class="grand-line">🎆 당신이 <b>배곧 쵝오</b>! 🎆</div>
         <div class="grand-sub">심화단계 ${pct}% — 지역 랭커 등극!</div>
       </div>`
    : "";
  const hasWrong = state.quizWrongItems.length > 0;
  const actionsHTML = isAdv
    ? `<button class="start-btn" id="retryBtn">🔁 심화 다시</button>
       ${hasWrong ? `<button class="start-btn wrong-only" id="retryWrongBtn">🔴 틀린문제만 (${state.quizWrongItems.length})</button>` : ""}
       <button class="start-btn alt" id="homeBtn">🏠 Home</button>`
    : `<button class="start-btn" id="retryBtn">🔁 다시 보기</button>
       ${hasWrong ? `<button class="start-btn wrong-only" id="retryWrongBtn">🔴 틀린문제만 (${state.quizWrongItems.length})</button>` : ""}
       ${canGoAdvanced ? `<button class="start-btn adv" id="goAdvBtn">🎯 심화단계 도전</button>` : ""}`;

  main.innerHTML = `
    <div class="result">
      <h2>${title}</h2>
      ${grandBanner}
      <div class="score-big">${correct} / ${total}</div>
      <div class="score-pct">정답률 ${pct}%</div>
      <div class="score-time">⏱ 소요 시간 <b>${fmtTime(elapsed)}</b></div>

      <div class="result-stats">
        <div class="result-stat"><div class="l">획득 XP</div><div class="v grade-c">+${state.xp}</div></div>
        <div class="result-stat"><div class="l">최대 연속</div><div class="v acc-c">${state.maxStreak} 🔥</div></div>
        <div class="result-stat"><div class="l">풀이 시간</div><div class="v">${fmtTime(elapsed)}</div></div>
        <div class="result-stat"><div class="l">누적 XP</div><div class="v">${state.xpTotal}</div></div>
      </div>

      ${earnedBadges.length ? `<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">획득 뱃지</div>
        <div class="badges-earned">
          ${earnedBadges.map((b,i)=>`<span class="badge" style="animation-delay:${i*.15}s"><span class="ic">${b.icon}</span>${escape(b.name)}</span>`).join("")}
        </div>` : ""}

      ${state.quizWrongIds.size ? `<div style="margin:10px 0 14px;color:var(--text-muted);font-size:13px;">
        틀린 단어: <b style="color:var(--danger)">${[...state.quizWrongIds].map(id=>{
          const w = DATA.newWords.find(x=>x.id===id); return w?escape(w.w):"";
        }).filter(Boolean).join(", ")}</b>
      </div>` : ""}

      ${unlockBanner}

      <div class="result-actions">
        ${actionsHTML}
      </div>
    </div>
  `;

  // celebration
  setTimeout(()=>{
    if(highGradeMsg){
      // 고등학교 심화 100% — 화면 오버레이 + 랜덤 메시지 + TTS + 폭죽 다량
      showHighGradeCelebration(highGradeMsg);
      SFX.grandFanfare();
      fx.spawn("rainbow-burst");
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.fireworks(); }, 350);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.coinDrop(); }, 800);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.bigWin(); }, 1400);
      setTimeout(()=>{ fx.spawn("rainbow-burst"); SFX.streak(); }, 2100);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.fireworks(); }, 2900);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.coinDrop(); }, 3700);
      setTimeout(()=>{ SFX.grandFanfare(); }, 4500);
      return;
    }
    if(advGrand){
      // 심화 90%+ — 화려·명랑 팡파레 + 축포 다량 (배곧 쵝오!)
      fx.spawn("rainbow-burst");
      SFX.grandFanfare();                                          // 브라스 팡파레+아르페지오+종
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.fireworks(); }, 300);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.coinDrop(); }, 700);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.streak(); }, 1300);
      setTimeout(()=>{ fx.spawn("rainbow-burst"); SFX.fireworks(); }, 1900);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.bigWin(); }, 2500);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.coinDrop(); }, 3300);
      setTimeout(()=>{ SFX.grandFanfare(); }, 4000);                // 마지막 대미 팡파레
    } else if(isPerfect){
      fx.spawn("rainbow-burst");
      SFX.bigWin();
      setTimeout(()=>fx.spawn("jackpot-full"), 600);
      setTimeout(()=>SFX.coinDrop(), 700);
    } else if(newCleared){
      fx.spawn("jackpot-full");
      SFX.levelUp();
      setTimeout(()=>SFX.coinDrop(), 500);
    } else if(pct >= 80){
      fx.spawn("reel-spin-small");
      SFX.spinReel();
    }
  }, 250);

  document.getElementById("retryBtn").addEventListener("click", ()=>{
    if(isAdv){ startAdvanced(); }
    else{ renderHome(); }
  });
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    alert("Lv.2 미생성 — 시범 버전입니다.");
  });
  const goAdvBtn = document.getElementById("goAdvBtn");
  if(goAdvBtn) goAdvBtn.addEventListener("click", ()=>{
    state.quizType = "advanced";
    startAdvanced();
  });
  const homeBtn = document.getElementById("homeBtn");
  if(homeBtn) homeBtn.addEventListener("click", ()=> renderHome());
  const retryWrongBtn = document.getElementById("retryWrongBtn");
  if(retryWrongBtn){
    retryWrongBtn.addEventListener("click", ()=>{
      if(isAdv) startAdvancedRetryWrong();
      else startBasicRetryWrong();
    });
  }
}

/* ============================================================
   UTILS
   ============================================================ */
/* 고등학교 심화 100% — 랜덤 축하 메시지 + 화면 오버레이 + TTS */
const HG_MESSAGES = [
  "당신의 노력에 경의를 표합니다!!",
  "배곧 쵝오를 넘어서!!",
  "이러다 연세대 가는거 아냐??",
  "자꾸 이러면 서울대 들어간다.",
  "왜 이렇게 잘 해?",
  "커서 훌륭한 사람 되겠어!!",
  "미래의 당신 집이 한 평 커졌어!!"
];
function pickHGMessage(){
  return HG_MESSAGES[Math.floor(Math.random() * HG_MESSAGES.length)];
}
function showHighGradeCelebration(msg){
  const old = document.querySelector('.hg-celebration');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.className = 'hg-celebration';
  const sparkles = ['✨','🎉','🎊','⭐','💫','🌟','🎆','🎇','💥']
    .map((e,i)=>{
      const x = 8 + Math.random()*84, y = 8 + Math.random()*84;
      const d = (Math.random()*1.6).toFixed(2);
      return `<span class="hg-sparkle" style="left:${x}%;top:${y}%;animation-delay:${d}s">${e}</span>`;
    }).join('');
  overlay.innerHTML = `<div class="hg-halo"></div>${sparkles}<div class="hg-msg">${escape(msg)}</div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.remove(), 6100);
  try{
    if('speechSynthesis' in window){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(msg);
      u.lang = 'ko-KR'; u.rate = 0.98; u.pitch = 1.12; u.volume = 1;
      const voices = speechSynthesis.getVoices();
      const ko = voices.find(v => /^ko/i.test(v.lang));
      if(ko) u.voice = ko;
      setTimeout(()=>speechSynthesis.speak(u), 400);
    }
  }catch(e){}
}

/* 빈칸 힌트: 정답 문자열의 각 단어 첫 글자를 "a… b…" 형태로 반환
   예: "appeared" → "a…"  ·  "in the absence of" → "i… t… a… o…"  ·  "feel bad" → "f… b…"  */
function firstCharsHint(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'') + '…').join(' ');
}
/* 빈칸 프리필: 정답 각 단어의 첫 글자를 공백으로 이어붙여 반환 (인풋 value 로 채워둠)
   예: "appeared" → "a"  ·  "in the absence of" → "i t a o"  ·  "feel bad" → "f b"  */
function firstCharsPrefill(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'')).join(' ');
}
/* 인풋에 프리필된 첫 글자 잠금 + 커서 이동 훅 부착 */
function attachPrefillGuard(inp){
  const prefill = inp.dataset.prefill || '';
  if(!prefill) return;
  const moveCursorEnd = () => { try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){} };
  inp.addEventListener('focus', () => setTimeout(moveCursorEnd, 0));
  inp.addEventListener('click', () => {
    if(inp.selectionStart < prefill.length) moveCursorEnd();
  });
  inp.addEventListener('keydown', e => {
    // 프리필 영역 보호: 첫 글자들을 지우거나 그 앞으로 이동하는 키 방지
    const s = inp.selectionStart, e2 = inp.selectionEnd;
    if(e.key === 'Backspace' && s <= prefill.length && s === e2){ e.preventDefault(); moveCursorEnd(); return; }
    if(e.key === 'Delete'    && s <  prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
    if((e.key === 'ArrowLeft' || e.key === 'Home') && s <= prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
  });
  inp.addEventListener('input', () => {
    // 사용자 값이 프리필로 시작하지 않으면 프리필을 앞에 다시 붙임 (드래그·잘라내기 등 방지)
    if(!inp.value.startsWith(prefill)){
      inp.value = prefill + inp.value.replace(new RegExp('^' + prefill.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').slice(0,0)),'');
      moveCursorEnd();
    }
  });
}
/* 프리필 인풋에서 사용자가 실제로 추가 입력한 부분이 있는지 (첫 글자만 남은 상태는 미제출) */
function hasUserInput(inp){
  const prefill = inp.dataset.prefill || '';
  return (inp.value||'').trim().length > prefill.trim().length;
}
/* ============================================================
   낱말박스 (자동완성 방어) — 각 단어당 [잠금 첫글자] + [빈 인풋]
   ============================================================ */
function renderWordAnswer(container, answer){
  container.innerHTML = '';
  const words = String(answer || '').trim().split(/\s+/).filter(Boolean);
  words.forEach((word, wi) => {
    const group = document.createElement('span');
    const isSingle = word.length <= 1;
    group.className = 'word-group' + (isSingle ? ' single-letter' : '');
    group.dataset.first = isSingle ? '' : (word[0] || '');
    group.dataset.full = word;
    if(!isSingle){
      const first = document.createElement('span');
      first.className = 'first-letter';
      first.textContent = word[0] || '';
      group.appendChild(first);
    }
    const inp = document.createElement('input');
    inp.className = 'rest-input';
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.autocorrect = 'off';
    inp.setAttribute('autocapitalize','off');
    inp.spellcheck = false;
    inp.inputMode = 'text';
    inp.name = 'wa-' + Math.random().toString(36).slice(2,8);
    inp.dataset.wi = wi;
    inp.setAttribute('aria-label', (wi+1) + '번째 단어의 나머지 스펠링');
    group.appendChild(inp);
    container.appendChild(group);
  });
  wireWordInputs(container);
}
function wireWordInputs(container){
  const inputs = Array.from(container.querySelectorAll('.rest-input'));
  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = (inp.value || '').toLowerCase().replace(/[^a-z'\-]/g,'');
    });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
        else { e.preventDefault(); handleSubmit(); }
      } else if(e.key === 'Tab' && !e.shiftKey){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
      } else if(e.key === 'Backspace' && !inp.value && i > 0){
        e.preventDefault();
        const prev = inputs[i-1];
        prev.focus();
        try{ prev.setSelectionRange(prev.value.length, prev.value.length); }catch(_e){}
      }
    });
  });
}
function collectWordAnswer(container){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  return groups.map(function(g){
    var inp = g.querySelector('.rest-input');
    return (g.dataset.first || '') + (inp ? inp.value : '');
  }).join(' ');
}
function anyWordEmpty(container){
  return Array.from(container.querySelectorAll('.rest-input')).some(function(i){ return !i.value.trim(); });
}
function markWordAnswer(container, perGroupOk){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  groups.forEach(function(g, i){
    g.classList.add(perGroupOk[i] ? 'correct' : 'wrong');
    var inp = g.querySelector('.rest-input');
    if(inp) inp.disabled = true;
  });
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function escape(s){
  if(s == null) return "";
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ============================================================
   GLOBAL EVENTS
   ============================================================ */
document.getElementById("sfxBtn").addEventListener("click", ()=>{
  state.sfxOn = !state.sfxOn;
  lsSet(SFX_KEY, state.sfxOn);
  renderHeader();
  if(state.sfxOn){ getAC(); SFX.streak(); }
});
document.getElementById("cbBtn").addEventListener("click", ()=>{
  state.cbMode = !state.cbMode;
  lsSet(CB_KEY, state.cbMode);
  document.body.classList.toggle("cb-mode", state.cbMode);
  renderHeader();
});

// keyboard
document.addEventListener("keydown", e=>{
  if(state.phase === "study"){
    if(e.code === "Space"){ e.preventDefault(); flipCard(); }
    else if(e.key === "1") navCard("prev");
    else if(e.key === "2") navCard("home");
    else if(e.key === "3") navCard("next");
    else if(e.key === "ArrowLeft") navCard("prev");
    else if(e.key === "ArrowRight") navCard("next");
  } else if(state.phase === "quiz" && !state.quizAnswered){
    const mode = state.quizCurrent && state.quizCurrent.mode;
    if(mode === "meaning-mcq" || mode === "word-mcq"){
      const n = parseInt(e.key, 10);
      if(n >= 1 && n <= 4){
        const btns = document.querySelectorAll(".choice");
        if(btns[n-1]) handleChoice(btns[n-1]);
      }
    }
  }
});

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  fx.init();
  if(state.cbMode) document.body.classList.add("cb-mode");
  renderHome();
}
boot();
</script>
