    {"id":"v08776","w":"out of the blue","pos":["phrase"],"ph":"/bluː/","cefr":"B2","kr":["갑자기"],"ex":[{"en":"The old high school friend contacted me out of the blue after fifteen quiet years.","ko":"그 오래된 고등학교 친구는 15년의 조용한 시간 후에 갑자기 나에게 연락해 왔다."}],"mnemonic":{"soundHint":"아웃 오브 더 블루 → '맑은 blue(파란) 하늘에서'","story":"맑은 파란 하늘에서 벼락이 떨어지듯 = 갑자기.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"suddenly","ko":"갑자기","reason":"동의어 — 별안간"},{"w":"unexpectedly","ko":"뜻밖에","reason":"동의어 — 예상 밖으로"},{"w":"gradually","ko":"서서히","reason":"반의어 — 점점"}],"collocBest":[{"en":"she called out of the blue","ko":"그녀가 갑자기 전화했다"},{"en":"it happened out of the blue","ko":"그 일이 난데없이 일어났다"}]},"nuance":{"koSimple":"예상하지 못했던 순간에 뜻밖에 일이 벌어진다는 뜻이에요","whenToUse":"오랜만의 연락이나 갑작스러운 소식을 표현할 때 써요"},"krDetail":[{"ko":"갑자기","explain":"예고 없이 별안간"}],"usageExamples":[{"en":"Out of the blue, she announced that she was moving to another country.","ko":"느닷없이 그녀는 다른 나라로 이사한다고 발표했다."},{"en":"The job offer came completely out of the blue and surprised the whole family.","ko":"그 일자리 제안은 완전히 갑작스럽게 와서 온 가족을 놀라게 했다."}],"grammarNote":"out of the blue는 '난데없이·갑자기'를 뜻하는 관용구로, 예상치 못한 일이 벌어질 때 쓴다. 문장 앞뒤 어디에나 부사구로 놓을 수 있다.","grammarQuiz":[{"sentence":"The old high school friend _____ contacted me out of the blue now lives abroad.","ko":"갑자기 내게 연락한 그 오래된 고등학교 친구는 지금 해외에 산다.","answer":"who","hint":"사람 선행사 + 주격 관계대명사"}]},
    {"id":"v08779","w":"outright","pos":["noun"],"ph":"/ˈaʊtraɪt/","cefr":"B2","kr":["완전한, 완전히"],"ex":[{"en":"The prime minister issued an outright denial of all the allegations raised in parliament.","ko":"총리는 국회에서 제기된 모든 의혹에 대해 완전히 부인했다."}],"mnemonic":{"soundHint":"아웃라이트 → 'out(완전히) + right(즉시·바로)'","story":"out(전부) right(바로) = 완전한·완전히.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"complete","ko":"완전한","reason":"동의어 — 전부인"},{"w":"absolute","ko":"절대적인","reason":"유의어 — 아주 완전한"},{"w":"partial","ko":"부분적인","reason":"반의어 — 일부만"}],"collocBest":[{"en":"an outright lie","ko":"새빨간 거짓말"},{"en":"reject it outright","ko":"그것을 완전히 거부하다"}]},"nuance":{"koSimple":"조건이나 여지 없이 즉시 전면적으로 이루어짐을 뜻해요","whenToUse":"전면 부인이나 완전 승리처럼 단호한 표현에 자주 써요"},"krDetail":[{"ko":"완전한, 완전히","explain":"빠짐없이 아주 전부"}],"usageExamples":[{"en":"The company won outright control of its smaller rival after the deal.","ko":"그 회사는 거래 후 더 작은 경쟁사의 완전한 지배권을 얻었다."},{"en":"He rejected the accusation outright and demanded a public apology.","ko":"그는 그 비난을 완전히 부인하고 공개 사과를 요구했다."}],"grammarNote":"outright는 형용사(완전한, an outright lie)와 부사(완전히·즉시, reject outright) 둘 다로 쓰인다. 부사로 쓸 때는 보통 동사 뒤에 온다.","grammarQuiz":[{"sentence":"All the allegations raised in parliament _____ outright denied by the prime minister.","ko":"국회에서 제기된 모든 의혹은 총리에 의해 완전히 부인되었다.","answer":"were","hint":"수동태(be + p.p.) 과거형"}]},
    {"id":"v08782","w":"overflow","pos":["verb"],"ph":"/ˌoʊvərˈfloʊ/","cefr":"B2","kr":["넘치다","범람하다","(감정이) 가득 차다, 충만하다","넘침","범람","과잉, 과도"],"ex":[{"en":"Heavy rains caused the local river to overflow its banks and flood nearby neighborhoods.","ko":"폭우가 지역 강의 둑을 넘게 하여 인근 동네를 침수시켰다."}],"mnemonic":{"soundHint":"오버플로우 → 'over(넘어) + flow(흐름)'","story":"강물이 둑을 over(넘어) flow(흐름) = 넘치다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"flood","ko":"범람하다","reason":"동의어 — 물이 넘치다"},{"w":"brim","ko":"가득 차다","reason":"유의어 — 넘칠 듯 차다"},{"w":"drain","ko":"빠지다","reason":"반의어 — 물이 빠짐"}],"collocBest":[{"en":"the river overflowed its banks","ko":"강이 둑을 넘쳐흘렀다"},{"en":"overflow with joy","ko":"기쁨으로 가득 차다"}]},"nuance":{"koSimple":"용기나 그릇에 담긴 것이 한계를 넘어 밖으로 흘러나오는 뜻이에요","whenToUse":"강 범람·감정 폭발·데이터 초과 상황에 두루 써요"},"krDetail":[{"ko":"넘치다","explain":"가득 차 밖으로 흘러나오다"},{"ko":"범람하다","explain":"물이 넘쳐 퍼지다"},{"ko":"(감정이) 가득 차다, 충만하다","explain":"마음이 벅차게 가득하다"},{"ko":"넘침","explain":"밖으로 흘러넘침"},{"ko":"범람","explain":"물이 넘쳐흐름"},{"ko":"과잉, 과도","explain":"필요보다 너무 많음"}],"usageExamples":[{"en":"The sink began to overflow because the drain was completely blocked.","ko":"배수구가 완전히 막혀 있어서 싱크대가 넘치기 시작했다."},{"en":"Her heart seemed to overflow with joy at the surprise family reunion.","ko":"깜짝 가족 상봉에 그녀의 마음은 기쁨으로 가득 차 넘치는 듯했다."}],"grammarNote":"overflow는 '(액체가) 넘치다'와 'overflow with ~(~로 가득 차다)'로 쓰인다. 명사로는 an overflow of ~(~의 과잉)처럼도 쓰이는 다의어다.","grammarQuiz":[{"sentence":"_____ its banks after the heavy rains, the river flooded the neighboring farmland.","ko":"폭우 후 둑을 넘으며, 그 강은 인근 농지를 침수시켰다.","answer":"Overflowing","hint":"분사구문(능동/현재분사) 문두"}]},
    {"id":"v08785","w":"patriotic","pos":["phrase"],"ph":"/ˌpeɪtriˈɑːtɪk/","cefr":"B2","kr":["애국적인, 애국의"],"ex":[{"en":"Patriotic songs echoed through the streets during the annual national independence celebration.","ko":"연례 국가 독립 기념 행사 동안 애국적인 노래들이 거리에 울려 퍼졌다."}],"mnemonic":{"soundHint":"패트리오틱 → 'patriot(애국자)'의 형용사","story":"patriot(애국자)의 마음이 담긴 노래 = 애국적인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"nationalistic","ko":"민족주의적인","reason":"유의어 — 나라 중심의"},{"w":"loyal","ko":"충성스러운","reason":"유의어 — 나라에 헌신하는"},{"w":"traitorous","ko":"매국의","reason":"반의어 — 나라를 배신하는"}],"collocBest":[{"en":"patriotic songs","ko":"애국적인 노래"},{"en":"a patriotic duty","ko":"애국적 의무"}]},"nuance":{"koSimple":"자기 나라를 사랑하고 자랑스럽게 여기는 마음을 담은 뜻이에요","whenToUse":"독립기념일·국가 행사·전쟁 문맥에서 자주 써요"},"krDetail":[{"ko":"애국적인, 애국의","explain":"나라를 사랑하는"}],"usageExamples":[{"en":"Waving the national flag, the crowd sang patriotic songs with great pride.","ko":"국기를 흔들며 군중은 큰 자부심으로 애국적인 노래를 불렀다."},{"en":"He felt a patriotic duty to serve his country during difficult times.","ko":"그는 어려운 시기에 조국을 위해 봉사해야 한다는 애국적 의무감을 느꼈다."}],"grammarNote":"patriotic은 '애국적인'을 뜻하는 형용사로 patriotic song/duty/feeling처럼 명사를 수식한다. 명사형은 patriotism, 부사형은 patriotically이다.","grammarQuiz":[{"sentence":"The songs _____ echoed through the streets during the celebration were deeply patriotic.","ko":"기념 행사 동안 거리에 울려 퍼진 그 노래들은 매우 애국적이었다.","answer":"that","hint":"사물 선행사 + 주격 관계대명사"}]},
    {"id":"v08788","w":"perpetuate","pos":["verb"],"ph":"/pərˈpɛtʃueɪt/","cefr":"B2","kr":["영구화하다"],"ex":[{"en":"Biased textbooks can perpetuate harmful stereotypes across multiple generations of young students.","ko":"편향된 교과서는 여러 세대의 어린 학생들에게 유해한 고정관념을 영구화할 수 있다."}],"mnemonic":{"soundHint":"퍼페추에이트 → 'perpetual(영원한)'의 동사","story":"편견을 perpetual(영원)하게 만듦 = 영구화하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"sustain","ko":"지속시키다","reason":"동의어 — 계속되게 하다"},{"w":"maintain","ko":"유지하다","reason":"유의어 — 그대로 이어가다"},{"w":"abolish","ko":"없애다","reason":"반의어 — 끊어 버리다"}],"collocBest":[{"en":"perpetuate a stereotype","ko":"고정관념을 영속시키다"},{"en":"perpetuate inequality","ko":"불평등을 영구화하다"}]},"nuance":{"koSimple":"나쁜 상태나 관행이 사라지지 않고 계속 이어지게 한다는 뜻이에요","whenToUse":"고정관념·차별·불평등을 지속시키는 원인을 지적할 때 써요"},"krDetail":[{"ko":"영구화하다","explain":"계속 이어지게 하다"}],"usageExamples":[{"en":"Repeating false rumors only perpetuates fear among ordinary citizens.","ko":"거짓 소문을 되풀이하는 것은 평범한 시민들 사이의 두려움을 영속시킬 뿐이다."},{"en":"Such unfair laws perpetuate inequality between the rich and the poor.","ko":"그런 불공정한 법은 부자와 빈자 사이의 불평등을 영구화한다."}],"grammarNote":"perpetuate는 타동사로 stereotype·myth·inequality 같은 부정적 대상을 목적어로 취해 '~을 영속시키다'라는 뜻으로 자주 쓰인다. 명사형은 perpetuation이다.","grammarQuiz":[{"sentence":"Biased textbooks _____ perpetuate harmful stereotypes must be replaced without delay.","ko":"유해한 고정관념을 영구화하는 편향된 교과서는 지체 없이 교체되어야 한다.","answer":"that","hint":"사물 선행사 + 주격 관계대명사"}]},
    {"id":"v08791","w":"pin down","pos":["phrase"],"ph":"/pɪn/","cefr":"B2","kr":["고정시키다"],"ex":[{"en":"Investigators struggled to pin down the exact cause of the mysterious factory explosion.","ko":"수사관들은 그 미스터리한 공장 폭발의 정확한 원인을 규명하기 위해 애썼다."}],"mnemonic":{"soundHint":"핀 다운 → 'pin(핀)으로 down(꽂아 고정)'","story":"핀으로 down(꽂아) 원인을 확정 = 규명·고정.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"fix","ko":"고정하다","reason":"동의어 — 못 움직이게 하다"},{"w":"pinpoint","ko":"정확히 짚다","reason":"유의어 — 콕 집어내다"},{"w":"release","ko":"풀어주다","reason":"반의어 — 놓아주다"}],"collocBest":[{"en":"hard to pin down","ko":"규정하기 어렵다"},{"en":"pin down the exact date","ko":"정확한 날짜를 확정하다"}]},"nuance":{"koSimple":"모호한 것을 명확히 규정하거나 대상을 꼼짝 못 하게 하는 뜻이에요","whenToUse":"원인 규명, 위치 특정, 상대 제압 상황에 두루 써요"},"krDetail":[{"ko":"고정시키다","explain":"움직이지 못하게 붙박다"}],"usageExamples":[{"en":"Experts found it hard to pin down the exact origin of the ancient painting.","ko":"전문가들은 그 고대 그림의 정확한 기원을 규명하기 어려워했다."},{"en":"The strong wind made it difficult to pin down the edges of the tent.","ko":"강한 바람 때문에 텐트의 가장자리를 고정시키기가 어려웠다."}],"grammarNote":"pin down은 '(정확히) 규명하다·특정하다'와 '눌러 고정하다' 두 뜻으로 쓰인다. 목적어가 대명사이면 pin it down처럼 사이에 넣는다.","grammarQuiz":[{"sentence":"Investigators struggled _____ pin down the exact cause of the mysterious factory explosion.","ko":"수사관들은 그 미스터리한 공장 폭발의 정확한 원인을 규명하기 위해 애썼다.","answer":"to","hint":"struggle + to부정사"}]},
    {"id":"v08794","w":"pollinator","pos":["phrase"],"ph":"/ˈpɑːlɪneɪtər/","cefr":"B2","kr":["수분[꽃가루] 매개자"],"ex":[{"en":"Bees are the most important pollinators for many of the world's essential food crops.","ko":"벌은 세계 필수 식량 작물의 대다수에게 가장 중요한 꽃가루 매개자이다."}],"mnemonic":{"soundHint":"폴리네이터 → 'pollen(꽃가루)'을 나르는 자","story":"pollen(꽃가루)을 옮기는 벌 = 수분 매개자.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"bee","ko":"벌","reason":"대표 예 — 꽃가루 옮김"},{"w":"pollen","ko":"꽃가루","reason":"연관어 — 옮기는 대상"},{"w":"pollination","ko":"수분","reason":"파생어 — 가루받이 과정"}],"collocBest":[{"en":"bees are vital pollinators","ko":"벌은 필수적인 수분 매개자다"},{"en":"protect natural pollinators","ko":"자연 수분 매개자를 보호하다"}]},"nuance":{"koSimple":"꽃가루를 옮겨 식물의 번식을 도와주는 곤충이나 동물을 뜻해요","whenToUse":"벌·나비 감소와 생태계 위기를 이야기할 때 자주 써요"},"krDetail":[{"ko":"수분[꽃가루] 매개자","explain":"꽃가루를 옮겨 주는 것"}],"usageExamples":[{"en":"Butterflies act as important pollinators for many colorful wildflowers.","ko":"나비는 다채로운 여러 야생화의 중요한 수분 매개자 역할을 한다."},{"en":"The sharp decline of natural pollinators threatens the world's food supply.","ko":"자연 수분 매개자의 급격한 감소는 세계의 식량 공급을 위협한다."}],"grammarNote":"pollinator는 '꽃가루를 옮기는 매개자(벌·나비 등)'를 뜻하는 가산명사다. 동사형은 pollinate, 명사형은 pollination(수분)이다.","grammarQuiz":[{"sentence":"Bees are pollinators _____ play a vital role in the world's food crop supply.","ko":"벌은 세계 식량 작물 공급에 필수적인 역할을 하는 꽃가루 매개자이다.","answer":"that","hint":"사물(동물) 선행사 + 주격 관계대명사"}]},
    {"id":"v08797","w":"precision","pos":["noun"],"ph":"/prɪˈsɪʒən/","cefr":"B2","kr":["정확"],"ex":[{"en":"The scientist measured every sample with remarkable precision using advanced laboratory instruments.","ko":"그 과학자는 첨단 실험실 장비를 사용해 모든 시료를 놀라운 정확성으로 측정했다."}],"mnemonic":{"soundHint":"프리시전 → 'precise(정확한)'의 명사","story":"실험 장비의 precise(정확)함 = 정확성.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"accuracy","ko":"정확성","reason":"동의어 — 딱 맞음"},{"w":"exactness","ko":"정밀함","reason":"유의어 — 오차 없음"},{"w":"vagueness","ko":"모호함","reason":"반의어 — 흐릿함"}],"collocBest":[{"en":"with great precision","ko":"매우 정확하게"},{"en":"surgical precision","ko":"외과 수술 같은 정밀함"}]},"nuance":{"koSimple":"조금의 오차도 없이 정밀하고 세심하게 이루어짐을 뜻해요","whenToUse":"과학 실험, 정밀 기계, 세밀한 작업에 자주 써요"},"krDetail":[{"ko":"정확","explain":"틀림없이 딱 맞음"}],"usageExamples":[{"en":"The surgeon performed the delicate operation with incredible precision.","ko":"그 외과의는 그 섬세한 수술을 놀라운 정확성으로 해냈다."},{"en":"These modern instruments measure temperature with a precision of one degree.","ko":"이 현대식 기기들은 1도의 정밀도로 온도를 측정한다."}],"grammarNote":"precision은 '정밀·정확'을 뜻하는 불가산명사로, with precision(정확하게)이라는 부사구 형태로 자주 쓰인다. 형용사형은 precise이다.","grammarQuiz":[{"sentence":"The scientist _____ measures every sample with remarkable precision uses advanced instruments.","ko":"모든 시료를 놀라운 정확성으로 측정하는 그 과학자는 첨단 장비를 사용한다.","answer":"who","hint":"사람 선행사 + 주격 관계대명사"}]},
    {"id":"v08800","w":"presumable","pos":["adj"],"ph":"/prɪˈzuːməbəl/","cefr":"B2","kr":["추정할 수 있는","있음직한"],"ex":[{"en":"It is presumable that consumer prices will keep rising throughout the next fiscal year.","ko":"다음 회계연도 내내 소비자 물가가 계속 오를 것이라고 추정할 수 있다."}],"mnemonic":{"soundHint":"프리주머블 → 'presume(추정) + able'","story":"presume(추정)할 수 있는(able) = 추정할 수 있는.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"probable","ko":"있음직한","reason":"동의어 — 그럴 만한"},{"w":"likely","ko":"그럴듯한","reason":"유의어 — 가능성 있는"},{"w":"doubtful","ko":"의심스러운","reason":"반의어 — 믿기 어려운"}],"collocBest":[{"en":"the presumable cause","ko":"추정되는 원인"},{"en":"a presumable outcome","ko":"있음직한 결과"}]},"nuance":{"koSimple":"확실치는 않지만 합리적으로 예상되고 있음직한 상태를 뜻해요","whenToUse":"가능성 있는 미래나 근거 있는 추측을 표현할 때 써요"},"krDetail":[{"ko":"추정할 수 있는","explain":"미루어 짐작되는"},{"ko":"있음직한","explain":"그럴 법한"}],"usageExamples":[{"en":"The presumable cause of the fire was a faulty electrical wire in the wall.","ko":"그 화재의 추정 원인은 벽 안의 결함 있는 전선이었다."},{"en":"It is presumable that the meeting will be delayed because of the storm.","ko":"그 회의는 폭풍 때문에 연기될 것이라고 추정할 수 있다."}],"grammarNote":"presumable은 '추정 가능한'을 뜻하는 형용사이지만, 실제로는 부사형 presumably(아마도)가 훨씬 자주 쓰인다. 동사형은 presume이다.","grammarQuiz":[{"sentence":"It _____ that prices will keep rising next year. (presumable을 활용)","ko":"가격이 내년에도 계속 오를 것이라고 추정할 수 있다.","answer":"is presumable","hint":"가주어 It + be동사 + 형용사"}]},
    {"id":"v08803","w":"pronounce","pos":["verb"],"ph":"/prəˈnaʊns/","cefr":"B2","kr":["발음하다","표명하다, 선언[선고]하다"],"ex":[{"en":"The judge pronounced a lengthy sentence against the defendant for repeated financial fraud.","ko":"판사는 반복적인 금융 사기에 대해 피고에게 긴 형량을 선고했다."}],"mnemonic":{"soundHint":"프러나운스 → 'pro(앞에) + nounce(말하다)'","story":"판사가 앞에(pro) 나서 nounce(선언·판결) = 발음/선고.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"articulate","ko":"또박또박 말하다","reason":"유의어 — 소리 내어 말함"},{"w":"declare","ko":"선언하다","reason":"동의어 — 공식 발표하다"},{"w":"mumble","ko":"웅얼거리다","reason":"반의어 — 불분명히 말함"}],"collocBest":[{"en":"pronounce a word correctly","ko":"단어를 정확히 발음하다"},{"en":"hard to pronounce","ko":"발음하기 어려운"}]},"nuance":{"koSimple":"단어를 소리 내어 말하거나 결정을 공식적으로 알린다는 뜻이에요","whenToUse":"발음 지도, 법정 선고, 공식 발표 등에 두루 써요"},"krDetail":[{"ko":"발음하다","explain":"소리 내어 말하다"},{"ko":"표명하다, 선언[선고]하다","explain":"공식적으로 밝히다"}],"usageExamples":[{"en":"Foreign students often struggle to pronounce this difficult English word correctly.","ko":"외국 학생들은 이 어려운 영어 단어를 정확히 발음하는 데 종종 애를 먹는다."},{"en":"The doctors pronounced him fully recovered after the long and careful treatment.","ko":"의사들은 길고 신중한 치료 끝에 그가 완전히 회복되었다고 선언했다."}],"grammarNote":"pronounce는 '발음하다'와 '(공식적으로) 선언·선고하다' 두 뜻으로 쓰이며, 후자는 pronounce A B(A를 B라고 선언하다) 형태를 취한다. 명사형은 pronunciation(철자 주의)이다.","grammarQuiz":[{"sentence":"The defendant _____ guilty by the judge yesterday. (pronounce를 활용, 수동태)","ko":"그 피고인은 어제 판사에 의해 유죄로 선고되었다.","answer":"was pronounced","hint":"수동태: be + p.p."}]},
    {"id":"v08806","w":"prospective","pos":["adj"],"ph":"/prəˈspɛktɪv/","cefr":"B2","kr":["장래의, 미래의","가망이 있는, 유망한"],"ex":[{"en":"The university sent detailed brochures to all prospective students planning to apply next semester.","ko":"그 대학은 다음 학기에 지원할 계획인 모든 장래의 학생들에게 자세한 안내 책자를 보냈다."}],"mnemonic":{"soundHint":"프로스펙티브 → 'prospect(전망)'의 형용사","story":"밝은 prospect(전망)가 있는 학생 = 장래의·유망한.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"potential","ko":"잠재적인","reason":"동의어 — 될 만한"},{"w":"future","ko":"미래의","reason":"유의어 — 앞으로의"},{"w":"current","ko":"현재의","reason":"반의어 — 지금의"}],"collocBest":[{"en":"prospective students","ko":"예비 학생들"},{"en":"a prospective buyer","ko":"잠재 구매자"}]},"nuance":{"koSimple":"앞으로 그렇게 될 가능성이나 전망이 있는 상태를 뜻해요","whenToUse":"잠재 고객·지원자·투자자를 소개할 때 자주 써요"},"krDetail":[{"ko":"장래의, 미래의","explain":"앞으로 다가올"},{"ko":"가망이 있는, 유망한","explain":"될 가능성이 큰"}],"usageExamples":[{"en":"The agent showed the house to several prospective buyers over the weekend.","ko":"그 중개인은 주말 동안 여러 명의 잠재적 매수자에게 그 집을 보여 주었다."},{"en":"The company interviewed a prospective partner for its new overseas project.","ko":"그 회사는 새 해외 프로젝트를 위해 유망한 협력사를 면담했다."}],"grammarNote":"prospective는 '장차 ~가 될, 유망한'을 뜻하는 형용사로 prospective buyer/student/employee처럼 명사 앞에서 쓴다. perspective(관점)와 철자를 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"The brochures _____ (send) to prospective students have already arrived. (분사 활용)","ko":"장래의 학생들에게 보내진 안내 책자는 이미 도착했다.","answer":"sent","hint":"과거분사가 명사를 뒤에서 수식(수동)"}]},
    {"id":"v08809","w":"put up with","pos":["phrase"],"ph":"/pʊt/","cefr":"B2","kr":["~을 참다, ~을 견디다"],"ex":[{"en":"Commuters have had to put up with severe delays ever since the subway strike began.","ko":"지하철 파업이 시작된 이후 통근자들은 심각한 지연을 참아야 했다."}],"mnemonic":{"soundHint":"'푸릇업 위드' → '푸른 잎을 위로 들고' 있으니 무겁지만 참는다","story":"무거운 짐을 위로(up) 들어(put) 함께(with) 견디는 모습","hintConfidence":2},"pairs":{"buddyWords":[{"w":"tolerate","ko":"참다","reason":"동의어 — 견뎌 내다"},{"w":"endure","ko":"견디다","reason":"동의어 — 버텨 내다"},{"w":"reject","ko":"거부하다","reason":"반의어 — 받아들이지 않다"}],"collocBest":[{"en":"put up with the noise","ko":"소음을 참다"},{"en":"can't put up with it","ko":"그것을 견딜 수 없다"}]},"nuance":{"koSimple":"불편하거나 싫은 것을 참고 견디며 그냥 받아들이는 상황을 나타냅니다.","whenToUse":"짜증 나거나 불쾌한 상황·사람을 억지로 참아낼 때 자연스럽게 씁니다."},"krDetail":[{"ko":"~을 참다, ~을 견디다","explain":"싫어도 꾹 참아 내다"}],"usageExamples":[{"en":"I simply cannot put up with his rude behavior any longer.","ko":"나는 더 이상 그의 무례한 행동을 도저히 참을 수가 없다."},{"en":"Teachers sometimes have to put up with a noisy and restless classroom.","ko":"교사들은 때때로 시끄럽고 부산한 교실을 견뎌야 한다."}],"grammarNote":"put up with는 세 단어로 이루어진 구동사로 뒤에 명사·동명사를 목적어로 취해 '~을 참고 견디다(tolerate)'를 뜻한다. 목적어는 항상 with 뒤에 온다.","grammarQuiz":[{"sentence":"Commuters have _____ severe delays since the strike began. (put up with를 활용, 현재완료)","ko":"통근자들은 파업이 시작된 이후로 심각한 지연을 참아 왔다.","answer":"put up with","hint":"have + p.p. (put의 과거분사는 put)"}]},
    {"id":"v08812","w":"rationalist","pos":["noun"],"ph":"/ˈræʃənəlɪst/","cefr":"B2","kr":["이성[합리]주의자"],"ex":[{"en":"As a strict rationalist, the philosopher rejected any argument based purely on personal emotion.","ko":"엄격한 합리주의자로서 그 철학자는 순전히 개인 감정에 근거한 어떤 주장도 거부했다."}],"mnemonic":{"soundHint":"'래셔널+리스트' → 'ratio(비율)'로 따지는 사람","story":"이성(reason)의 저울로 모든 것을 계산하는 합리주의자","hintConfidence":3},"pairs":{"buddyWords":[{"w":"philosopher","ko":"철학자","reason":"연관어 — 이성 탐구자"},{"w":"logic","ko":"논리","reason":"연관어 — 이성의 도구"},{"w":"empiricist","ko":"경험주의자","reason":"반의어 — 경험 중시자"}],"collocBest":[{"en":"a committed rationalist","ko":"확고한 합리주의자"},{"en":"the rationalist tradition","ko":"합리주의 전통"}]},"nuance":{"koSimple":"감정보다 이성과 논리에 근거해 사고하고 판단하는 사람을 뜻합니다.","whenToUse":"철학·학문 맥락에서 합리적 사고를 강조하는 인물을 설명할 때 씁니다."},"krDetail":[{"ko":"이성[합리]주의자","explain":"이성을 앞세우는 사람"}],"usageExamples":[{"en":"As a strict rationalist, she trusted logic far more than tradition or feeling.","ko":"철저한 합리주의자로서 그녀는 전통이나 감정보다 논리를 훨씬 더 신뢰했다."},{"en":"The debate clearly divided the rationalists from those who relied on faith.","ko":"그 논쟁은 합리주의자들과 신앙에 의존하는 사람들을 뚜렷이 갈라놓았다."}],"grammarNote":"rationalist는 '합리[이성]주의자'를 뜻하는 가산명사다. 형용사 rational(이성적인), 명사 rationalism(합리주의)과 함께 익혀 두면 좋다.","grammarQuiz":[{"sentence":"It was the philosopher _____ rejected emotional arguments. (강조구문)","ko":"감정적 주장을 거부한 사람은 바로 그 철학자였다.","answer":"who","hint":"It is/was ~ that/who 강조구문"}]},
    {"id":"v08815","w":"reciprocal","pos":["adj"],"ph":"/rɪˈsɪprəkəl/","cefr":"B2","kr":["상호적인"],"ex":[{"en":"Healthy long-term friendships are usually built on reciprocal trust and mutual respect.","ko":"건강한 장기적 우정은 대개 상호 신뢰와 상호 존중 위에 세워진다."}],"mnemonic":{"soundHint":"'리시프로컬' → 're(다시)+ci(주고)+pro(받는)' 왕복","story":"네가 주면 나도 다시 돌려주는 상호적인 관계","hintConfidence":2},"pairs":{"buddyWords":[{"w":"mutual","ko":"서로의","reason":"동의어 — 상호 간의"},{"w":"two-way","ko":"쌍방의","reason":"유의어 — 양쪽 다"},{"w":"one-sided","ko":"일방적인","reason":"반의어 — 한쪽만"}],"collocBest":[{"en":"a reciprocal relationship","ko":"상호적 관계"},{"en":"reciprocal benefits","ko":"상호 이익"}]},"nuance":{"koSimple":"양쪽이 서로 주고받으며 균형 있게 영향을 미치는 관계를 나타냅니다.","whenToUse":"우정·계약·협정처럼 상호 이익이나 대응이 있는 관계를 강조할 때 씁니다."},"krDetail":[{"ko":"상호적인","explain":"서로 주고받는"}],"usageExamples":[{"en":"The two nations signed a reciprocal trade agreement earlier last month.","ko":"두 나라는 지난달 초에 상호 무역 협정을 맺었다."},{"en":"Their long friendship was based on reciprocal respect and shared goals.","ko":"그들의 오랜 우정은 상호 존중과 공동의 목표에 바탕을 두고 있었다."}],"grammarNote":"reciprocal은 '상호적인, 서로 주고받는'을 뜻하는 형용사로 reciprocal agreement/relationship처럼 명사를 수식한다. 부사형은 reciprocally이다.","grammarQuiz":[{"sentence":"Long friendships are usually built on reciprocal trust and _____ (respect) each other. (동명사)","ko":"장기적 우정은 대개 상호 신뢰와 서로를 존중하는 것 위에 세워진다.","answer":"respecting","hint":"전치사 없이 병렬 명사구 자리 → 동명사"}]},
    {"id":"v08818","w":"rejoice","pos":["verb"],"ph":"/rɪˈdʒɔɪs/","cefr":"B2","kr":["크게 기뻐하다","축하하다"],"ex":[{"en":"The whole community rejoiced when the missing children were finally found safe and well.","ko":"실종된 아이들이 마침내 안전하고 무사히 발견되자 지역 사회 전체가 크게 기뻐했다."}],"mnemonic":{"soundHint":"'리조이스' → 're(다시)+joy(기쁨)+ice(얼음)' 얼었던 기쁨이 다시 살아나","story":"잃었던 아이가 돌아와 온 마을이 다시 기쁨에 빠지다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"delight","ko":"기뻐하다","reason":"동의어 — 매우 즐거워함"},{"w":"celebrate","ko":"축하하다","reason":"유의어 — 기쁨을 나눔"},{"w":"mourn","ko":"슬퍼하다","reason":"반의어 — 애도하다"}],"collocBest":[{"en":"rejoice at the news","ko":"그 소식에 크게 기뻐하다"},{"en":"rejoice in their success","ko":"그들의 성공을 기뻐하다"}]},"nuance":{"koSimple":"매우 좋은 일이 생겨 마음속 깊이 크게 기뻐하는 감정을 나타냅니다.","whenToUse":"축하나 감격의 순간을 문어체·격식체로 강하게 표현할 때 적절합니다."},"krDetail":[{"ko":"크게 기뻐하다","explain":"매우 즐거워하다"},{"ko":"축하하다","explain":"기쁜 일을 함께 즐기다"}],"usageExamples":[{"en":"The fans rejoiced wildly when their team won the national championship.","ko":"팬들은 자기 팀이 전국 선수권에서 우승하자 열광적으로 기뻐했다."},{"en":"The villagers rejoiced at the news of the long-awaited rainfall.","ko":"마을 사람들은 오래 기다리던 비 소식에 크게 기뻐했다."}],"grammarNote":"rejoice는 자동사로 'rejoice at/in/over ~(~에 크게 기뻐하다)' 형태로 쓰이는 다소 문어적인 동사다. 명사형은 rejoicing이다.","grammarQuiz":[{"sentence":"_____ the missing children found safe, the whole community rejoiced. (분사구문, With)","ko":"실종된 아이들이 무사히 발견되자, 지역 사회 전체가 크게 기뻐했다.","answer":"With","hint":"with + 목적어 + p.p. 부대상황"}]},
    {"id":"v08821","w":"renovation","pos":["noun"],"ph":"/ˌrɛnəˈveɪʃən/","cefr":"B2","kr":["개조"],"ex":[{"en":"The city council approved the renovation of the historic library to preserve its architecture.","ko":"시의회는 건축 양식을 보존하기 위해 그 역사적인 도서관의 개조를 승인했다."}],"mnemonic":{"soundHint":"'레노베이션' → 're(다시)+nova(새로운)' 다시 새것으로","story":"낡은 도서관을 다시 새것처럼 개조하는 공사","hintConfidence":3},"pairs":{"buddyWords":[{"w":"remodeling","ko":"리모델링","reason":"동의어 — 고쳐 짓기"},{"w":"restoration","ko":"복원","reason":"유의어 — 되살려 고침"},{"w":"demolition","ko":"철거","reason":"반의어 — 헐어 없앰"}],"collocBest":[{"en":"home renovation","ko":"집 개조"},{"en":"closed for renovation","ko":"개조 공사로 문을 닫은"}]},"nuance":{"koSimple":"낡거나 손상된 건물·공간을 고쳐 새롭게 개선하는 작업을 뜻합니다.","whenToUse":"건물 리모델링, 시설 보수, 문화재 복원 등 대규모 개조 상황에서 씁니다."},"krDetail":[{"ko":"개조","explain":"고쳐서 새롭게 함"}],"usageExamples":[{"en":"The hotel was closed for three months during the major renovation.","ko":"그 호텔은 대대적인 개조 공사 동안 세 달간 문을 닫았다."},{"en":"Extensive renovations transformed the old warehouse into a modern art gallery.","ko":"대규모 개조 공사가 그 낡은 창고를 현대적인 미술관으로 탈바꿈시켰다."}],"grammarNote":"renovation은 '개조·수리'를 뜻하는 명사로 가산·불가산 모두 쓰인다. under renovation(개조 중인)이라는 표현과 동사형 renovate를 함께 익힌다.","grammarQuiz":[{"sentence":"The council approved the renovation _____ (design) to preserve the architecture. (분사)","ko":"시의회는 건축 양식을 보존하도록 설계된 개조를 승인했다.","answer":"designed","hint":"명사를 뒤에서 수식하는 과거분사(수동)"}]},
    {"id":"v08824","w":"repository","pos":["noun"],"ph":"/rɪˈpɑːzɪtɔːri/","cefr":"B2","kr":["저장소"],"ex":[{"en":"The national museum serves as a valuable repository of the country's rich cultural heritage.","ko":"그 국립 박물관은 국가의 풍부한 문화 유산의 소중한 저장소 역할을 한다."}],"mnemonic":{"soundHint":"'리파지토리' → 're(다시)+posit(놓다)' 다시 놓아두는 곳","story":"국가의 문화유산을 다시 꺼내 볼 수 있게 모아둔 저장소","hintConfidence":3},"pairs":{"buddyWords":[{"w":"archive","ko":"기록보관소","reason":"유의어 — 자료 모으는 곳"},{"w":"storehouse","ko":"창고","reason":"동의어 — 저장하는 곳"},{"w":"depository","ko":"보관소","reason":"동의어 — 맡겨 두는 곳"}],"collocBest":[{"en":"a repository of knowledge","ko":"지식의 보고"},{"en":"a central data repository","ko":"중앙 데이터 저장소"}]},"nuance":{"koSimple":"중요한 것을 안전하게 보관·축적하는 장소나 공간을 나타냅니다.","whenToUse":"지식·자료·문화유산 등을 담아 두는 도서관·박물관·데이터 공간에 씁니다."},"krDetail":[{"ko":"저장소","explain":"모아 두는 곳"}],"usageExamples":[{"en":"The old library is a vast repository of rare books and ancient manuscripts.","ko":"그 오래된 도서관은 희귀 도서와 고대 필사본의 방대한 저장소다."},{"en":"Her diary gradually became a repository of memories from her childhood.","ko":"그녀의 일기는 점차 어린 시절 기억의 보고가 되었다."}],"grammarNote":"repository는 '(대량의) 저장소·보고(寶庫)'를 뜻하는 가산명사로, a repository of + 명사 형태로 '~의 보고'라는 비유적 의미로도 자주 쓰인다.","grammarQuiz":[{"sentence":"The museum is a repository _____ preserves the country's heritage. (관계대명사)","ko":"그 박물관은 국가의 유산을 보존하는 저장소이다.","answer":"which","hint":"사물 선행사 주격 관계대명사"}]},
    {"id":"v08827","w":"respondent","pos":["adj"],"ph":"/rɪˈspɑːndənt/","cefr":"B2","kr":["응답자","응하는, 반응하는"],"ex":[{"en":"Nearly all survey respondents agreed that public transportation urgently requires significant improvement.","ko":"설문 응답자 대다수가 대중교통이 시급히 상당한 개선을 필요로 한다는 데 동의했다."}],"mnemonic":{"soundHint":"'리스판던트' → 're(다시)+spond(대답)+ent(사람)'","story":"설문지를 받고 다시 대답을 돌려보내는 응답자","hintConfidence":3},"pairs":{"buddyWords":[{"w":"participant","ko":"참여자","reason":"유의어 — 조사 참가자"},{"w":"replier","ko":"답변자","reason":"동의어 — 답하는 사람"},{"w":"questioner","ko":"질문자","reason":"반의어 — 묻는 사람"}],"collocBest":[{"en":"survey respondents","ko":"설문 응답자"},{"en":"most respondents agreed","ko":"대부분의 응답자가 동의했다"}]},"nuance":{"koSimple":"설문이나 조사에서 질문에 답하는 사람 또는 반응하는 대상을 뜻합니다.","whenToUse":"여론조사·설문·법률 절차 등 공식 조사 맥락에서 자주 등장하는 표현입니다."},"krDetail":[{"ko":"응답자","explain":"설문에 답한 사람"},{"ko":"응하는, 반응하는","explain":"반응을 보이는"}],"usageExamples":[{"en":"Most respondents to the online poll preferred flexible working hours over higher salaries.","ko":"온라인 여론조사 응답자 대부분은 더 높은 급여보다 유연한 근무 시간을 선호했다."},{"en":"The respondent in the divorce case failed to appear in court on time.","ko":"그 이혼 소송의 피신청인은 법정에 제시간에 출석하지 못했다."}],"grammarNote":"respondent는 주로 명사로 '(설문·조사) 응답자'를 뜻하며 survey/questionnaire respondents처럼 복수로 자주 쓰인다. 법률 문맥에서는 소송의 '피신청인(피고)'을 가리킨다.","grammarQuiz":[{"sentence":"Nearly all respondents agreed that public transportation _____ (need) improvement. (5형식/that절)","ko":"거의 모든 응답자가 대중교통이 개선을 필요로 한다는 데 동의했다.","answer":"needs","hint":"that절 주어 단수, 3인칭 단수 현재"}]},
    {"id":"v08830","w":"revolve","pos":["phrase"],"ph":"/rɪˈvɑːlv/","cefr":"B2","kr":["(축을 중심으로) 돌다[회전하다]","순환하다","(~을 중심으로) 전개하다"],"ex":[{"en":"Her ambitious new novel revolves around the complex relationship between two estranged sisters.","ko":"그녀의 야심찬 새 소설은 소원해진 두 자매 사이의 복잡한 관계를 중심으로 전개된다."}],"mnemonic":{"soundHint":"'리볼브' → 're(다시)+volve(구르다)' 리볼버 권총이 돌아간다","story":"리볼버 실린더처럼 축을 중심으로 계속 돌아가는 모습","hintConfidence":3},"pairs":{"buddyWords":[{"w":"rotate","ko":"회전하다","reason":"동의어 — 빙빙 돌다"},{"w":"orbit","ko":"궤도를 돌다","reason":"유의어 — 둘레를 돌다"},{"w":"halt","ko":"멈추다","reason":"반의어 — 회전을 멈춤"}],"collocBest":[{"en":"planets revolve around the sun","ko":"행성이 태양 주위를 돈다"},{"en":"the story revolves around love","ko":"이야기가 사랑을 중심으로 전개된다"}]},"nuance":{"koSimple":"축을 중심으로 돌거나 어떤 주제를 중심으로 전개되는 상황을 나타냅니다.","whenToUse":"천체 회전, 이야기·논의의 핵심 축, 반복 순환 등을 표현할 때 씁니다."},"krDetail":[{"ko":"(축을 중심으로) 돌다[회전하다]","explain":"축을 중심으로 빙빙 돌다"},{"ko":"순환하다","explain":"돌고 또 돌다"},{"ko":"(~을 중심으로) 전개하다","explain":"무엇을 중심으로 펼쳐지다"}],"usageExamples":[{"en":"The Earth takes about 365 days to revolve around the Sun.","ko":"지구가 태양 둘레를 도는 데는 약 365일이 걸린다."},{"en":"All their conversations seem to revolve around money these days.","ko":"요즘 그들의 모든 대화는 돈을 중심으로 돌아가는 것 같다."}],"grammarNote":"revolve는 자동사로 전치사 around와 결합해 'revolve around ~'(~을 중심으로 돌다/전개되다) 형태로 자주 쓰인다. 물리적 회전과 '~에 초점이 맞춰져 있다'는 비유적 의미 모두 가능하다.","grammarQuiz":[{"sentence":"Her novel revolves around two sisters _____ (estrange) for years. (분사)","ko":"그녀의 소설은 수년간 소원해진 두 자매를 중심으로 전개된다.","answer":"estranged","hint":"명사 뒤 과거분사(수동/완료)"}]},
    {"id":"v08833","w":"roar","pos":["noun"],"ph":"/rɔːr/","cefr":"B2","kr":["으르렁거리다"],"ex":[{"en":"The huge lion began to roar loudly, warning intruders away from its hidden den.","ko":"그 커다란 사자는 은신처에서 침입자들을 쫓아내기 위해 크게 으르렁거리기 시작했다."}],"mnemonic":{"soundHint":"'로어' → 사자가 '로~아!' 하고 우는 소리 그대로","story":"은신처를 지키려 사자가 크게 '로어!' 하고 포효하는 장면","hintConfidence":3},"pairs":{"buddyWords":[{"w":"growl","ko":"으르렁대다","reason":"동의어 — 낮게 울리다"},{"w":"bellow","ko":"고함치다","reason":"유의어 — 크게 외치다"},{"w":"whisper","ko":"속삭이다","reason":"반의어 — 작게 말하다"}],"collocBest":[{"en":"the lion roared loudly","ko":"사자가 크게 으르렁거렸다"},{"en":"a deafening roar","ko":"귀청이 터질 듯한 굉음"}]},"nuance":{"koSimple":"짐승이나 사람·엔진 등이 크고 깊고 위압적인 소리를 내는 것을 뜻합니다.","whenToUse":"사자·군중·폭풍·엔진처럼 강렬한 굉음을 생생하게 묘사할 때 씁니다."},"krDetail":[{"ko":"으르렁거리다","explain":"크고 사납게 울부짖다"}],"usageExamples":[{"en":"The crowd let out a deafening roar when the home team finally scored.","ko":"홈팀이 마침내 득점하자 관중이 귀를 먹먹하게 하는 함성을 질렀다."},{"en":"We could hear the engines roar as the planes took off one by one.","ko":"비행기들이 하나씩 이륙할 때 엔진이 굉음을 내는 소리를 들을 수 있었다."}],"grammarNote":"roar는 동사('으르렁거리다, 굉음을 내다')와 명사('포효, 굉음, 함성') 둘 다로 쓰인다. the roar of the crowd/engine처럼 명사로도 흔하게 쓴다.","grammarQuiz":[{"sentence":"The lion began _____ (roar) loudly to warn intruders away. (to부정사/동명사)","ko":"그 사자는 침입자들을 쫓아내기 위해 크게 으르렁거리기 시작했다.","answer":"to roar","hint":"begin + to부정사"}]},
    {"id":"v08836","w":"rush out of","pos":["phrase"],"ph":"/rʌʃ/","cefr":"B2","kr":["~로부터 (급히) 달려 나오다, ~로부터 빠져나오다"],"ex":[{"en":"Panicked customers rushed out of the crowded department store when the fire alarm rang.","ko":"화재 경보가 울리자 당황한 고객들이 붐비는 백화점에서 급히 달려 나왔다."}],"mnemonic":{"soundHint":"'러쉬 아웃 오브' → 러시아워에 급히 나오다","story":"화재 경보가 울리자 백화점 안에서 손님들이 우르르 달려 나오는 모습","hintConfidence":2},"pairs":{"buddyWords":[{"w":"dash out","ko":"뛰쳐나오다","reason":"동의어 — 급히 나옴"},{"w":"flee","ko":"달아나다","reason":"유의어 — 급히 벗어남"},{"w":"saunter","ko":"느긋이 걷다","reason":"반의어 — 천천히 감"}],"collocBest":[{"en":"rush out of the building","ko":"건물에서 급히 뛰쳐나오다"},{"en":"rush out of the room","ko":"방에서 급히 달려 나오다"}]},"nuance":{"koSimple":"어떤 장소에서 다급하게 뛰쳐나오거나 서둘러 빠져나오는 행동을 뜻합니다.","whenToUse":"화재·긴급 상황·급한 용무로 건물이나 공간을 급히 벗어날 때 씁니다."},"krDetail":[{"ko":"~로부터 (급히) 달려 나오다, ~로부터 빠져나오다","explain":"급하게 뛰쳐나오다"}],"usageExamples":[{"en":"Everyone rushed out of the building as soon as the earthquake stopped.","ko":"지진이 멈추자마자 모두가 건물에서 급히 뛰쳐나왔다."},{"en":"The children rushed out of the classroom the moment the bell rang.","ko":"종이 울리는 순간 아이들이 교실에서 급히 뛰쳐나왔다."}],"grammarNote":"'rush out of + 장소' 형태로 '~에서 급히 뛰쳐나오다'를 뜻한다. 반대 방향은 rush into(~로 급히 들어가다)이며 rush의 과거형은 rushed이다.","grammarQuiz":[{"sentence":"Hardly _____ the alarm rung when customers rushed out of the store. (도치)","ko":"경보가 울리자마자 고객들이 가게에서 급히 달려 나왔다.","answer":"had","hint":"Hardly had S p.p. ~ when S 과거"}]},
    {"id":"v08839","w":"scribble","pos":["phrase"],"ph":"/ˈskrɪbəl/","cefr":"B2","kr":["휘갈겨 쓰다, 낙서하다","휘갈겨 쓴 글씨, 낙서"],"ex":[{"en":"He hurriedly scribbled his cell phone number on the back of an old receipt.","ko":"그는 오래된 영수증 뒷면에 자신의 휴대전화 번호를 급히 휘갈겨 썼다."}],"mnemonic":{"soundHint":"'스크리블' → 'scribe(쓰다)'가 급히 하면 낙서가 된다","story":"영수증 뒷면에 급하게 번호를 휘갈겨 적는 모습","hintConfidence":2},"pairs":{"buddyWords":[{"w":"scrawl","ko":"휘갈기다","reason":"동의어 — 마구 쓰다"},{"w":"doodle","ko":"끄적이다","reason":"유의어 — 낙서하다"},{"w":"calligraphy","ko":"정갈한 글씨","reason":"반의어 — 또박또박 씀"}],"collocBest":[{"en":"scribble a quick note","ko":"메모를 급히 휘갈겨 쓰다"},{"en":"scribble down a number","ko":"번호를 휘갈겨 적다"}]},"nuance":{"koSimple":"빠르고 대충 휘갈겨 알아보기 어렵게 쓰거나 그리는 행동을 나타냅니다.","whenToUse":"메모를 급히 적거나 아이가 낙서하는 일상적 상황에서 자주 씁니다."},"krDetail":[{"ko":"휘갈겨 쓰다, 낙서하다","explain":"아무렇게나 마구 쓰다"},{"ko":"휘갈겨 쓴 글씨, 낙서","explain":"마구 갈겨 쓴 글씨"}],"usageExamples":[{"en":"She scribbled a quick note and left it on the kitchen table.","ko":"그녀는 짧은 쪽지를 휘갈겨 써서 부엌 식탁 위에 두고 갔다."},{"en":"The toddler scribbled all over the wall with a red crayon.","ko":"그 아기는 빨간 크레용으로 벽 전체에 낙서를 했다."}],"grammarNote":"scribble은 '휘갈겨 쓰다/낙서하다'는 동사이자 '낙서'라는 명사로 쓰인다. scribble down(급히 적다), scribble on(~에 낙서하다) 형태에 유의한다.","grammarQuiz":[{"sentence":"He hurriedly scribbled his number on the receipt _____ (lie) on the desk. (분사)","ko":"그는 책상 위에 놓여 있는 영수증에 자신의 번호를 급히 휘갈겨 썼다.","answer":"lying","hint":"명사를 뒤에서 수식하는 현재분사(능동)"}]},
    {"id":"v08842","w":"seedling","pos":["noun"],"ph":"/ˈsiːdlɪŋ/","cefr":"B2","kr":["묘목"],"ex":[{"en":"Volunteers carefully planted thousands of young seedlings across the mountain slope last spring.","ko":"자원봉사자들은 지난 봄 산비탈에 걸쳐 수천 그루의 어린 묘목을 조심스럽게 심었다."}],"mnemonic":{"soundHint":"'시들링' → 'seed(씨)+ling(작은 것)' 씨에서 갓 나온 작은 것","story":"산비탈에 자원봉사자들이 어린 묘목을 심는 봄날 풍경","hintConfidence":3},"pairs":{"buddyWords":[{"w":"sprout","ko":"새싹","reason":"유의어 — 갓 튼 싹"},{"w":"sapling","ko":"어린나무","reason":"동의어 — 자라는 묘목"},{"w":"seed","ko":"씨앗","reason":"연관어 — 자라기 전 상태"}],"collocBest":[{"en":"plant a seedling","ko":"묘목을 심다"},{"en":"young seedlings","ko":"어린 묘목들"}]},"nuance":{"koSimple":"씨앗에서 갓 자라나 아직 어리고 여린 어린 나무나 식물을 뜻합니다.","whenToUse":"식목·조림, 원예 활동에서 어린 식물을 구체적으로 지칭할 때 씁니다."},"krDetail":[{"ko":"묘목","explain":"옮겨 심는 어린나무"}],"usageExamples":[{"en":"Each seedling needs plenty of sunlight and water to grow into a healthy tree.","ko":"각 묘목은 건강한 나무로 자라기 위해 충분한 햇빛과 물이 필요하다."},{"en":"The gardener carefully transplanted the tomato seedlings into larger pots.","ko":"정원사는 토마토 모종들을 더 큰 화분으로 조심스럽게 옮겨 심었다."}],"grammarNote":"seedling은 '씨앗에서 갓 자란 묘목/모종'을 뜻하는 가산명사로, 셀 수 있어 seedlings처럼 복수로 자주 쓴다. seed(씨앗)와 구별해야 한다.","grammarQuiz":[{"sentence":"Thousands of seedlings _____ (plant) across the slope last spring. (수동태)","ko":"수천 그루의 묘목이 지난 봄 산비탈에 걸쳐 심어졌다.","answer":"were planted","hint":"과거 수동태: were + p.p."}]},
    {"id":"v08845","w":"shed light on","pos":["phrase"],"ph":"/ʃɛd/","cefr":"B2","kr":["~을 조명하다, ~을 비추다[밝히다]"],"ex":[{"en":"The recent research aims to shed light on the origins of consciousness in the human brain.","ko":"최근 연구는 인간 뇌 안 의식의 기원을 밝히는 것을 목표로 한다."}],"mnemonic":{"soundHint":"'셰드 라이트 온' → 어두운 창고(shed)에 빛(light)을 비추다","story":"인간 의식의 어두운 기원을 연구의 빛으로 환하게 밝히다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"illuminate","ko":"밝히다","reason":"동의어 — 환히 비추다"},{"w":"clarify","ko":"분명히 하다","reason":"유의어 — 알기 쉽게 함"},{"w":"obscure","ko":"흐리게 하다","reason":"반의어 — 모호하게 함"}],"collocBest":[{"en":"shed light on the issue","ko":"그 문제를 밝혀 주다"},{"en":"shed new light on the past","ko":"과거에 새로운 시각을 비추다"}]},"nuance":{"koSimple":"잘 몰랐던 문제나 사실을 이해할 수 있도록 밝혀 주는 것을 뜻합니다.","whenToUse":"연구 결과나 새로운 증거가 미스터리·의문을 해명해 줄 때 자주 씁니다."},"krDetail":[{"ko":"~을 조명하다, ~을 비추다[밝히다]","explain":"잘 알도록 밝혀 주다"}],"usageExamples":[{"en":"The newly discovered documents may shed light on what really happened that night.","ko":"새로 발견된 문서들이 그날 밤 실제로 무슨 일이 있었는지를 밝혀 줄지도 모른다."},{"en":"Her lecture helped shed light on a topic that had long confused me.","ko":"그녀의 강의는 오랫동안 나를 혼란스럽게 했던 주제를 이해하게 해 주었다."}],"grammarNote":"'shed light on + 명사(구)' 형태로 '~을 밝히다/규명하다'를 뜻하는 관용구이다. shed는 과거형·과거분사도 shed로 형태가 같으므로 시제 판단에 유의한다.","grammarQuiz":[{"sentence":"The research aims _____ light on the origins of consciousness. (to부정사, shed 활용)","ko":"그 연구는 의식의 기원을 밝히는 것을 목표로 한다.","answer":"to shed","hint":"aim + to부정사"}]},
    {"id":"v08848","w":"so as to do","pos":["phrase"],"ph":"/soʊ/","cefr":"B2","kr":["~하도록, ~하기 위해서"],"ex":[{"en":"Students often review notes together so as to prepare more effectively for their exams.","ko":"학생들은 시험을 더 효과적으로 준비하기 위해 종종 함께 필기를 검토한다."}],"mnemonic":{"soundHint":"'소 애즈 투' → '이렇게(so) 하기 위해(to)'","story":"학생들이 시험을 잘 보기 위해서 함께 필기를 검토하는 이유 표현","hintConfidence":1},"pairs":{"buddyWords":[{"w":"in order to","ko":"~하기 위해","reason":"동의어 — 목적 표현"},{"w":"for","ko":"~을 위해","reason":"유의어 — 목적을 나타냄"},{"w":"purpose","ko":"목적","reason":"연관어 — 하려는 이유"}],"collocBest":[{"en":"left early so as to arrive on time","ko":"제시간에 도착하기 위해 일찍 떠났다"},{"en":"spoke slowly so as to be clear","ko":"분명하게 하려고 천천히 말했다"}]},"nuance":{"koSimple":"어떤 행동을 하는 목적이나 이유를 문어적으로 부드럽게 나타내는 표현입니다.","whenToUse":"in order to보다 조금 격식 있는 글에서 목적을 명확히 밝힐 때 씁니다."},"krDetail":[{"ko":"~하도록, ~하기 위해서","explain":"그렇게 되게 하려고"}],"usageExamples":[{"en":"He spoke slowly and clearly so as to be understood by everyone in the room.","ko":"그는 방 안의 모두가 알아들을 수 있도록 천천히 또렷하게 말했다."},{"en":"She left home an hour early so as to avoid the morning traffic.","ko":"그녀는 아침 교통 체증을 피하기 위해 한 시간 일찍 집을 나섰다."}],"grammarNote":"'so as to + 동사원형'은 목적('~하기 위해서')을 나타내며 in order to와 바꿔 쓸 수 있다. 부정은 so as not to do 형태로 쓴다.","grammarQuiz":[{"sentence":"Students review notes together _____ prepare more effectively. (so as to 활용)","ko":"학생들은 더 효과적으로 준비하기 위해 함께 필기를 검토한다.","answer":"so as to","hint":"목적: so as to + 동사원형"}]},
    {"id":"v08851","w":"specify","pos":["verb"],"ph":"/ˈspɛsɪfaɪ/","cefr":"B2","kr":["명시하다"],"ex":[{"en":"The contract must specify the exact deadlines and precise responsibilities of each involved party.","ko":"그 계약은 각 관련 당사자의 정확한 마감일과 명확한 책임을 명시해야 한다."}],"mnemonic":{"soundHint":"'스페시파이' → 'special(특별)+fy(만들다)' 특별히 콕 집어","story":"계약서에 마감일과 책임을 하나하나 콕 집어 명시하는 장면","hintConfidence":3},"pairs":{"buddyWords":[{"w":"detail","ko":"상세히 말하다","reason":"유의어 — 낱낱이 밝힘"},{"w":"define","ko":"규정하다","reason":"유의어 — 분명히 정함"},{"w":"generalize","ko":"뭉뚱그리다","reason":"반의어 — 두루뭉술하게 함"}],"collocBest":[{"en":"specify the requirements","ko":"요건을 명시하다"},{"en":"unless otherwise specified","ko":"달리 명시되지 않는 한"}]},"nuance":{"koSimple":"무엇을 애매하지 않게 구체적으로 정확히 지정하거나 밝히는 것을 뜻합니다.","whenToUse":"계약서·지시문·설명서에서 조건·수량·기한 등을 분명히 밝힐 때 씁니다."},"krDetail":[{"ko":"명시하다","explain":"분명하게 딱 밝히다"}],"usageExamples":[{"en":"Please specify your dietary requirements when you book the conference dinner.","ko":"학회 만찬을 예약할 때 본인의 식단 요구 사항을 명시해 주세요."},{"en":"The instructions did not specify how long the sample should be heated.","ko":"설명서에는 시료를 얼마나 오래 가열해야 하는지가 명시되어 있지 않았다."}],"grammarNote":"specify는 타동사로 목적어를 직접 취하며, specify that절이나 specify + wh-절(how/what/when...) 형태도 가능하다. 명사형은 specification이다.","grammarQuiz":[{"sentence":"The contract must specify the deadlines and the responsibilities _____ each party has. (관계대명사)","ko":"그 계약은 각 당사자가 가진 마감일과 책임을 명시해야 한다.","answer":"that","hint":"목적격 관계대명사 (which도 가능)"}]},
    {"id":"v08854","w":"stand out","pos":["phrase"],"ph":"/stænd/","cefr":"B2","kr":["두각을 나타내다, 돋보이다"],"ex":[{"en":"Her original approach to problem solving really made her stand out among peers.","ko":"문제 해결에 대한 그녀의 독창적인 접근법은 정말로 그녀를 또래들 사이에서 돋보이게 했다."}],"mnemonic":{"soundHint":"'스탠드 아웃' → 무리 밖으로(out) 서(stand) 있다","story":"또래들 사이에서 그녀만 앞으로 나와 서 있는 듯 돋보이다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"excel","ko":"뛰어나다","reason":"유의어 — 남보다 우수함"},{"w":"shine","ko":"빛나다","reason":"유의어 — 돋보이다"},{"w":"blend in","ko":"묻히다","reason":"반의어 — 눈에 안 띔"}],"collocBest":[{"en":"stand out from the crowd","ko":"무리 중에서 돋보이다"},{"en":"stand out from the competition","ko":"경쟁에서 두각을 나타내다"}]},"nuance":{"koSimple":"여러 사람이나 사물 사이에서 눈에 띄게 두드러져 돋보이는 것을 뜻합니다.","whenToUse":"재능·외모·성과 등이 뛰어나 남들과 차별화된 인상을 줄 때 자주 씁니다."},"krDetail":[{"ko":"두각을 나타내다, 돋보이다","explain":"남보다 도드라져 보이다"}],"usageExamples":[{"en":"The bright red cover makes this book stand out on the crowded shelf.","ko":"선명한 빨간 표지 덕분에 이 책은 빽빽한 책장에서 눈에 띈다."},{"en":"A few candidates clearly stood out during the interviews yesterday.","ko":"어제 면접에서 몇몇 지원자가 분명히 두드러졌다."}],"grammarNote":"stand out은 자동사구로 '두드러지다/눈에 띄다'를 뜻한다. 'stand out from/among ~'(~ 중에서 돋보이다), 'stand out as ~'(~로서 두드러지다) 형태로 확장된다.","grammarQuiz":[{"sentence":"Her original approach made her _____ (stand) out among peers. (5형식, 사역동사 make)","ko":"그녀의 독창적 접근법은 그녀를 또래들 사이에서 돋보이게 만들었다.","answer":"stand","hint":"make + 목적어 + 원형부정사"}]},
    {"id":"v08857","w":"stationery","pos":["noun"],"ph":"/ˈsteɪʃənɛri/","cefr":"B2","kr":["문구류","문방구"],"ex":[{"en":"The office manager ordered new stationery, including pens, notebooks, and paper clips.","ko":"사무실 관리자는 펜, 공책, 종이 클립을 포함한 새 문구류를 주문했다."}],"mnemonic":{"soundHint":"'스테이셔너리' → 'station(고정된)+ery' 문구점에 고정되어 있는 것들","story":"사무실에 펜, 공책, 클립 등 문구류가 새로 도착한 장면","hintConfidence":2},"pairs":{"buddyWords":[{"w":"supplies","ko":"용품","reason":"유의어 — 사무·학용품"},{"w":"pen","ko":"펜","reason":"대표 예 — 필기구"},{"w":"notebook","ko":"공책","reason":"대표 예 — 필기 노트"}],"collocBest":[{"en":"a stationery store","ko":"문구점"},{"en":"buy some stationery","ko":"문구류를 사다"}]},"nuance":{"koSimple":"펜·공책·종이 클립 등 사무나 필기에 쓰는 문구류 전반을 가리킵니다.","whenToUse":"사무실 비품 주문이나 학용품 구매 등 일상 실무 상황에서 씁니다."},"krDetail":[{"ko":"문구류","explain":"글 쓸 때 쓰는 물건"},{"ko":"문방구","explain":"필기도구 같은 학용품"}],"usageExamples":[{"en":"She bought some elegant stationery to write her thank-you letters.","ko":"그녀는 감사 편지를 쓰려고 고급스러운 문구류를 좀 샀다."},{"en":"The company logo is printed on all of its official stationery.","ko":"회사 로고가 모든 공식 문구류에 인쇄되어 있다."}],"grammarNote":"stationery는 '문구류'를 뜻하는 불가산명사로 a나 복수형을 쓰지 않는다. 발음이 같은 stationary('정지한', 형용사)와 철자(-ery/-ary)를 혼동하지 말아야 한다.","grammarQuiz":[{"sentence":"If the manager _____ ordered stationery earlier, we would not have run out. (가정법 과거완료)","ko":"만약 관리자가 문구류를 더 일찍 주문했더라면, 우리는 다 떨어지지 않았을 텐데.","answer":"had","hint":"If S had p.p. ~, S would have p.p."}]},
    {"id":"v08860","w":"stick up for","pos":["phrase"],"ph":"/stɪk/","cefr":"B2","kr":["~을 변호하다, 옹호하다"],"ex":[{"en":"True friends always stick up for you even when everyone else turns quickly against you.","ko":"진정한 친구들은 다른 모두가 당신에게 빠르게 등을 돌릴 때조차 언제나 당신을 옹호한다."}],"mnemonic":{"soundHint":"'스틱 업 포' → 막대기(stick)를 위로(up) 들고 지켜주다","story":"모두가 등 돌릴 때 친구를 위해 막대기 들고 옹호하는 장면","hintConfidence":2},"pairs":{"buddyWords":[{"w":"defend","ko":"옹호하다","reason":"동의어 — 편들어 지킴"},{"w":"support","ko":"편들다","reason":"유의어 — 힘을 실어줌"},{"w":"attack","ko":"공격하다","reason":"반의어 — 몰아세우다"}],"collocBest":[{"en":"stick up for a friend","ko":"친구를 편들어 주다"},{"en":"stick up for yourself","ko":"스스로를 옹호하다"}]},"nuance":{"koSimple":"어려움에 처한 사람이나 신념을 적극적으로 편들어 지켜 주는 것을 뜻합니다.","whenToUse":"친구·약자·자신의 원칙을 비난이나 공격으로부터 옹호할 때 씁니다."},"krDetail":[{"ko":"~을 변호하다, 옹호하다","explain":"편을 들어 감싸 주다"}],"usageExamples":[{"en":"You should learn to stick up for yourself in difficult situations.","ko":"너는 어려운 상황에서 스스로를 변호할 줄 알아야 한다."},{"en":"She was the only one who stuck up for the new employee at the meeting.","ko":"회의에서 신입 직원을 편들어 준 사람은 그녀뿐이었다."}],"grammarNote":"'stick up for + 사람/신념' 형태로 '~을 편들다/옹호하다'를 뜻하는 구동사이며, stick의 과거형은 stuck이다. 유사 표현으로 stand up for가 있다.","grammarQuiz":[{"sentence":"True friends stick up for you even when everyone else _____ (turn) against you. (시제)","ko":"진정한 친구들은 다른 모두가 등을 돌릴 때조차 당신을 옹호한다.","answer":"turns","hint":"시간·조건 부사절, 3인칭 단수 현재"}]},
    {"id":"v08863","w":"suspension","pos":["noun"],"ph":"/səˈspɛnʃən/","cefr":"B2","kr":["매달리기","일시 정지","정학","연기, 보류"],"ex":[{"en":"The construction project remained in suspension pending the results of the environmental review.","ko":"그 건설 프로젝트는 환경 심사 결과가 나올 때까지 일시 정지 상태였다."}],"mnemonic":{"soundHint":"'서스펜션' → 'sus(아래)+pend(매달다)' 아래로 매달아 정지","story":"환경 심사가 끝날 때까지 공사가 공중에 매달려 멈춘 상태","hintConfidence":3},"pairs":{"buddyWords":[{"w":"pause","ko":"일시 정지","reason":"동의어 — 잠깐 멈춤"},{"w":"halt","ko":"중단","reason":"유의어 — 멈춰 세움"},{"w":"resumption","ko":"재개","reason":"반의어 — 다시 시작"}],"collocBest":[{"en":"a two-day suspension","ko":"2일간의 정학"},{"en":"the suspension of the rules","ko":"규칙의 일시 정지"}]},"nuance":{"koSimple":"활동이나 진행이 잠시 멈추거나 결정이 보류된 상태를 나타냅니다.","whenToUse":"공사 중단, 학생 정학, 계약 보류 등 공식적인 정지 상황에서 씁니다."},"krDetail":[{"ko":"매달리기","explain":"공중에 매달려 있음"},{"ko":"일시 정지","explain":"잠깐 멈춤"},{"ko":"정학","explain":"학교에 못 오게 함"},{"ko":"연기, 보류","explain":"뒤로 미뤄 둠"}],"usageExamples":[{"en":"The player received a three-match suspension for his violent conduct.","ko":"그 선수는 폭력적인 행동으로 세 경기 출전 정지를 받았다."},{"en":"The committee announced the temporary suspension of all outdoor events.","ko":"위원회는 모든 야외 행사의 일시 중단을 발표했다."}],"grammarNote":"suspension은 동사 suspend의 명사형으로 '(일시)정지, 정학, 출전 정지, 보류' 등 문맥에 따라 뜻이 달라진다. suspension bridge(현수교)처럼 복합어로도 쓰인다.","grammarQuiz":[{"sentence":"The project _____ (place) in suspension until the review ends. (수동태 현재완료)","ko":"그 프로젝트는 심사가 끝날 때까지 보류 상태에 놓여 왔다.","answer":"has been placed","hint":"have/has + been + p.p."}]},
    {"id":"v08866","w":"symbiotic","pos":["phrase"],"ph":"/ˌsɪmbaɪˈɑːtɪk/","cefr":"B2","kr":["공생의, 공생하는"],"ex":[{"en":"Certain fish species maintain a symbiotic relationship with anemones that shelter and protect them.","ko":"특정 어종은 자신들을 보호하고 은신처를 제공하는 말미잘과 공생 관계를 유지한다."}],"mnemonic":{"soundHint":"'심바이오틱' → 'sym(함께)+bio(생명)' 함께 사는 생명","story":"말미잘과 물고기가 서로 지켜주며 함께 사는 공생 관계","hintConfidence":3},"pairs":{"buddyWords":[{"w":"mutualistic","ko":"상리공생의","reason":"동의어 — 서로 이득인"},{"w":"interdependent","ko":"상호의존적인","reason":"유의어 — 서로 기대는"},{"w":"parasitic","ko":"기생의","reason":"반의어 — 한쪽만 이득"}],"collocBest":[{"en":"a symbiotic relationship","ko":"공생 관계"},{"en":"symbiotic bacteria","ko":"공생 박테리아"}]},"nuance":{"koSimple":"서로 다른 존재가 함께 살아가며 이익을 주고받는 관계를 나타냅니다.","whenToUse":"생물학적 공생이나 기업·인간 관계의 상호 의존을 설명할 때 씁니다."},"krDetail":[{"ko":"공생의, 공생하는","explain":"서로 도우며 함께 사는"}],"usageExamples":[{"en":"The two companies formed a symbiotic partnership that benefited them both.","ko":"두 회사는 서로에게 이익이 되는 공생 관계를 맺었다."},{"en":"Bees and flowering plants share a remarkably symbiotic relationship.","ko":"벌과 꽃 피는 식물은 대단히 공생적인 관계를 이루고 있다."}],"grammarNote":"symbiotic은 형용사로 명사 앞에서 'symbiotic relationship/partnership'처럼 자주 쓰인다. 명사형은 symbiosis(공생), 부사형은 symbiotically이다.","grammarQuiz":[{"sentence":"Certain fish maintain a symbiotic relationship with anemones, _____ (shelter) them from predators. (분사구문)","ko":"특정 어종은 자신들을 포식자로부터 보호해 주는 말미잘과 공생 관계를 유지한다.","answer":"sheltering","hint":"분사구문(능동): -ing"}]},
    {"id":"v08869","w":"take ~ into account","pos":["phrase"],"ph":"/əˈkaʊnt/","cefr":"B2","kr":["~을 고려하다, ~을 참작하다[계산에 넣다]"],"ex":[{"en":"Policymakers should take historical context into account when designing new education reforms.","ko":"정책 입안자들은 새로운 교육 개혁을 설계할 때 역사적 맥락을 고려해야 한다."}],"mnemonic":{"soundHint":"'테이크 인투 어카운트' → 계좌(account) 안에 집어넣어 계산","story":"교육 개혁 설계 시 역사 맥락을 계산 계좌 안에 넣어 고려","hintConfidence":2},"pairs":{"buddyWords":[{"w":"consider","ko":"고려하다","reason":"동의어 — 헤아려 보다"},{"w":"weigh","ko":"따져보다","reason":"유의어 — 견주어 보다"},{"w":"ignore","ko":"무시하다","reason":"반의어 — 안 따지다"}],"collocBest":[{"en":"take costs into account","ko":"비용을 고려하다"},{"en":"take everything into account","ko":"모든 것을 참작하다"}]},"nuance":{"koSimple":"판단이나 결정을 내릴 때 특정 요소를 빠뜨리지 않고 고려하는 것을 뜻합니다.","whenToUse":"정책·평가·계획을 세울 때 다양한 변수를 반드시 반영해야 할 때 씁니다."},"krDetail":[{"ko":"~을 고려하다, ~을 참작하다[계산에 넣다]","explain":"빠뜨리지 않고 헤아리다"}],"usageExamples":[{"en":"When grading, teachers should take effort into account, not just final results.","ko":"채점할 때 교사는 최종 결과뿐 아니라 노력도 고려해야 한다."},{"en":"The plan failed because it did not take rising costs into account.","ko":"그 계획은 상승하는 비용을 고려에 넣지 않아서 실패했다."}],"grammarNote":"'take + 목적어 + into account' 형태로 목적어를 중간에 넣거나, 목적어가 길면 take into account 뒤에 둘 수도 있다. take account of, take into consideration과 같은 뜻이다.","grammarQuiz":[{"sentence":"Historical context should _____ into account when designing reforms. (수동태, take 활용)","ko":"개혁을 설계할 때 역사적 맥락이 고려되어야 한다.","answer":"be taken","hint":"조동사 + be + p.p."}]},
    {"id":"v08872","w":"take over","pos":["phrase"],"ph":"/teɪk/","cefr":"B2","kr":["이어받다, 인계받다","인수하다","(정권 등을) 장악하다"],"ex":[{"en":"The vice president will take over the company after the founder's expected retirement.","ko":"부사장은 창립자의 예상된 은퇴 이후 그 회사를 인수받을 것이다."}],"mnemonic":{"soundHint":"'테이크 오버' → 넘겨(over) 받다(take)","story":"창립자가 은퇴한 후 부사장이 회사를 넘겨받는 장면","hintConfidence":3},"pairs":{"buddyWords":[{"w":"assume","ko":"떠맡다","reason":"동의어 — 일을 넘겨받음"},{"w":"acquire","ko":"인수하다","reason":"유의어 — 사서 넘겨받음"},{"w":"relinquish","ko":"넘겨주다","reason":"반의어 — 손을 뗌"}],"collocBest":[{"en":"take over the family business","ko":"가업을 인수하다"},{"en":"take over the role","ko":"역할을 넘겨받다"}]},"nuance":{"koSimple":"다른 사람에게서 역할·회사·권한을 넘겨받아 이어가는 것을 나타냅니다.","whenToUse":"경영권 인수, 업무 인계, 정권 장악 등 지배·책임 이양 상황에서 씁니다."},"krDetail":[{"ko":"이어받다, 인계받다","explain":"일을 넘겨받다"},{"ko":"인수하다","explain":"회사를 사서 넘겨받다"},{"ko":"(정권 등을) 장악하다","explain":"권력을 손에 넣다"}],"usageExamples":[{"en":"A larger firm plans to take over the struggling airline early next year.","ko":"한 대형 회사가 내년 초에 경영난에 빠진 그 항공사를 인수할 계획이다."},{"en":"Could you take over the meeting while I make an urgent phone call?","ko":"내가 급한 전화를 하는 동안 회의를 좀 맡아 줄 수 있겠니?"}],"grammarNote":"take over는 '인수하다, 인계받다, 장악하다'를 뜻하며, 목적어가 대명사면 take it over처럼 분리해서 쓴다. 명사형 takeover는 '(기업) 인수'를 뜻한다.","grammarQuiz":[{"sentence":"The vice president will take over the company _____ the founder retires. (접속사)","ko":"부사장은 창립자가 은퇴한 후에 그 회사를 인수받을 것이다.","answer":"after","hint":"시간 부사절 접속사"}]},
    {"id":"v08875","w":"televise","pos":["phrase"],"ph":"/ˈtɛlɪvaɪz/","cefr":"B2","kr":["TV로 방송하다, 방영하다"],"ex":[{"en":"The network decided to televise the championship game live to a global audience.","ko":"그 방송사는 챔피언십 경기를 전 세계 시청자들에게 생중계로 방영하기로 결정했다."}],"mnemonic":{"soundHint":"'텔레바이즈' → 'tele(멀리)+vise(보다)' TV로 멀리 보내다","story":"챔피언십 경기를 TV로 전 세계에 생중계하는 방송사","hintConfidence":3},"pairs":{"buddyWords":[{"w":"broadcast","ko":"방송하다","reason":"동의어 — 내보내다"},{"w":"air","ko":"방영하다","reason":"동의어 — 전파로 보냄"},{"w":"stream","ko":"스트리밍하다","reason":"유의어 — 실시간 송출"}],"collocBest":[{"en":"televise the match live","ko":"경기를 생중계로 방영하다"},{"en":"a televised debate","ko":"TV로 방영된 토론"}]},"nuance":{"koSimple":"행사나 프로그램을 텔레비전을 통해 시청자에게 방송하는 것을 뜻합니다.","whenToUse":"스포츠·시상식·연설 등 대규모 이벤트의 TV 중계 상황에서 씁니다."},"krDetail":[{"ko":"TV로 방송하다, 방영하다","explain":"텔레비전으로 내보내다"}],"usageExamples":[{"en":"The opening ceremony will be televised in more than a hundred countries.","ko":"개막식은 백 개가 넘는 나라에서 TV로 방영될 것이다."},{"en":"They decided not to televise the trial for privacy reasons.","ko":"그들은 사생활 보호를 이유로 그 재판을 방영하지 않기로 결정했다."}],"grammarNote":"televise는 타동사로 '(경기·행사 등을) TV로 방송하다'를 뜻하며, 흔히 수동태(be televised)로 쓰인다. 명사 television과 형태를 구별해야 한다.","grammarQuiz":[{"sentence":"The championship game _____ (televise) live to a global audience tomorrow. (수동태 미래)","ko":"챔피언십 경기는 내일 전 세계 시청자들에게 생중계로 방영될 것이다.","answer":"will be televised","hint":"will + be + p.p."}]},
    {"id":"v08878","w":"the other way around","pos":["phrase"],"ph":"/əˈraʊnd/","cefr":"B2","kr":["반대로, 거꾸로"],"ex":[{"en":"Contrary to popular belief, it was the other way around; success followed her hard work.","ko":"일반적인 통념과는 반대로, 실제로는 정반대였다. 성공이 그녀의 노력을 뒤따랐다."}],"mnemonic":{"soundHint":"'디 아더 웨이 어라운드' → 다른(other) 방향(way)으로 돌려서","story":"노력이 성공을 낳는 게 아니라 성공이 노력을 뒤따랐다는 반대 상황","hintConfidence":2},"pairs":{"buddyWords":[{"w":"vice versa","ko":"반대로","reason":"동의어 — 거꾸로 마찬가지"},{"w":"reverse","ko":"역으로","reason":"유의어 — 뒤바뀐"},{"w":"same way","ko":"같은 방향","reason":"반의어 — 그대로"}],"collocBest":[{"en":"it's the other way around","ko":"그것은 정반대다"},{"en":"do it the other way around","ko":"거꾸로 하다"}]},"nuance":{"koSimple":"예상과 정반대의 상황이거나 순서가 뒤바뀐 경우를 강조하는 표현입니다.","whenToUse":"상대의 착각을 바로잡거나 통념과 반대되는 사실을 지적할 때 씁니다."},"krDetail":[{"ko":"반대로, 거꾸로","explain":"방향이 정반대로"}],"usageExamples":[{"en":"I thought he was helping her, but it was actually the other way around.","ko":"나는 그가 그녀를 돕는 줄 알았는데, 사실은 그 반대였다."},{"en":"You can add the milk to the coffee, or do it the other way around.","ko":"커피에 우유를 넣어도 되고, 아니면 반대로 해도 된다."}],"grammarNote":"the other way around는 '반대로, 거꾸로'를 뜻하는 부사구로, 앞 문장의 순서·관계가 정반대임을 나타낼 때 쓴다. 영국식으로는 the other way round도 같은 뜻이다.","grammarQuiz":[{"sentence":"It was success _____ followed her hard work, not the other way around. (강조구문)","ko":"그녀의 노력을 뒤따른 것은 바로 성공이었지, 그 반대가 아니었다.","answer":"that","hint":"It is/was ~ that 강조구문"}]},
    {"id":"v08881","w":"think outside the box","pos":["phrase"],"ph":"/θɪŋk/","cefr":"B2","kr":["틀에서 벗어나[창의적으로] 생각하다"],"ex":[{"en":"Successful entrepreneurs always think outside the box to find innovative solutions to persistent problems.","ko":"성공한 사업가들은 지속되는 문제에 대한 혁신적 해결책을 찾기 위해 항상 창의적으로 생각한다."}],"mnemonic":{"soundHint":"'씽크 아웃사이드 더 박스' → 상자(box) 밖(outside)에서 생각","story":"사업가가 답답한 상자 밖으로 나와 창의적 해결책을 찾는 장면","hintConfidence":3},"pairs":{"buddyWords":[{"w":"innovate","ko":"혁신하다","reason":"유의어 — 새롭게 바꿈"},{"w":"brainstorm","ko":"아이디어를 짜내다","reason":"유의어 — 자유롭게 떠올림"},{"w":"conform","ko":"틀에 맞추다","reason":"반의어 — 관습을 따름"}],"collocBest":[{"en":"we need to think outside the box","ko":"틀을 벗어나 생각해야 한다"},{"en":"encouraged to think outside the box","ko":"창의적으로 생각하도록 격려받다"}]},"nuance":{"koSimple":"관습적 사고 틀을 벗어나 참신하고 창의적으로 아이디어를 내는 것을 뜻합니다.","whenToUse":"혁신적 해결책이나 기발한 발상이 필요한 문제 해결 상황에서 씁니다."},"krDetail":[{"ko":"틀에서 벗어나[창의적으로] 생각하다","explain":"틀을 깨고 새롭게 생각하다"}],"usageExamples":[{"en":"To solve this stubborn problem, we really need to think outside the box.","ko":"이 까다로운 문제를 해결하려면 우리는 정말로 틀에서 벗어나 생각해야 한다."},{"en":"Her boss encouraged the whole team to think outside the box during brainstorming.","ko":"그녀의 상사는 브레인스토밍 동안 팀 전체가 창의적으로 생각하도록 격려했다."}],"grammarNote":"think outside the box는 '기존 틀을 벗어나 창의적으로 생각하다'를 뜻하는 관용구로, box 앞의 the가 고정된다. 관용 표현이므로 전치사(outside)와 어순을 바꾸지 않는다.","grammarQuiz":[{"sentence":"Entrepreneurs think outside the box _____ (find) innovative solutions. (to부정사)","ko":"사업가들은 혁신적 해결책을 찾기 위해 창의적으로 생각한다.","answer":"to find","hint":"목적을 나타내는 to부정사"}]},
    {"id":"v08884","w":"transcend","pos":["verb"],"ph":"/trænˈsɛnd/","cefr":"B2","kr":["넘다, 초월하다","능가하다"],"ex":[{"en":"Great works of art transcend cultural boundaries and speak to universal human experiences.","ko":"위대한 예술 작품은 문화적 경계를 초월하여 보편적인 인간 경험에 대해 말한다."}],"mnemonic":{"soundHint":"'트랜센드' → 'trans(넘어)+scend(오르다)' 넘어서 오르다","story":"예술 작품이 문화의 벽을 훌쩍 뛰어넘어 모두에게 말을 걸다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"surpass","ko":"능가하다","reason":"동의어 — 앞질러 넘다"},{"w":"exceed","ko":"넘어서다","reason":"유의어 — 한계를 넘음"},{"w":"fall short","ko":"못 미치다","reason":"반의어 — 기준에 못 닿음"}],"collocBest":[{"en":"transcend cultural boundaries","ko":"문화적 경계를 초월하다"},{"en":"transcend differences","ko":"차이를 뛰어넘다"}]},"nuance":{"koSimple":"일반적 한계나 경계를 뛰어넘어 그 이상의 차원에 도달하는 것을 뜻합니다.","whenToUse":"예술·철학·종교 등 보편성이나 초월적 가치를 논할 때 격식 있게 씁니다."},"krDetail":[{"ko":"넘다, 초월하다","explain":"한계를 뛰어넘다"},{"ko":"능가하다","explain":"남보다 앞서다"}],"usageExamples":[{"en":"Music can transcend language and connect people from very different cultures.","ko":"음악은 언어를 초월하여 매우 다른 문화의 사람들을 이어 줄 수 있다."},{"en":"Her quiet kindness seemed to transcend ordinary human generosity.","ko":"그녀의 조용한 친절은 평범한 인간의 관대함을 넘어서는 듯했다."}],"grammarNote":"transcend는 타동사로 목적어를 직접 취하므로 뒤에 전치사가 필요 없다(예: transcend boundaries). 명사형은 transcendence, 형용사형은 transcendent이다.","grammarQuiz":[{"sentence":"Great works of art _____ (transcend) cultural boundaries throughout history. (현재완료)","ko":"위대한 예술 작품들은 역사를 통해 문화적 경계를 초월해 왔다.","answer":"have transcended","hint":"throughout history → 현재완료 계속"}]},
    {"id":"v08887","w":"undue","pos":["adj"],"ph":"/ʌnˈduː/","cefr":"B2","kr":["지나친, 과도한"],"ex":[{"en":"The court ruled that the police had used undue force during the peaceful public protest.","ko":"법원은 경찰이 평화로운 공공 시위 동안 과도한 무력을 사용했다고 판결했다."}],"mnemonic":{"soundHint":"'언듀' → 'un(아닌)+due(마땅한)' 마땅하지 않게 지나친","story":"평화 시위에 경찰이 마땅한 선을 넘어 과도한 무력을 쓴 판결","hintConfidence":2},"pairs":{"buddyWords":[{"w":"excessive","ko":"과도한","reason":"동의어 — 정도가 지나침"},{"w":"unwarranted","ko":"부당한","reason":"유의어 — 정당하지 않은"},{"w":"reasonable","ko":"적당한","reason":"반의어 — 알맞은"}],"collocBest":[{"en":"undue pressure","ko":"지나친 압박"},{"en":"without undue delay","ko":"부당한 지체 없이"}]},"nuance":{"koSimple":"정당하거나 적절한 정도를 넘어 지나치게 과한 상태를 부정적으로 나타냅니다.","whenToUse":"과도한 압박·무력·부담처럼 부적절하게 지나친 상황을 지적할 때 씁니다."},"krDetail":[{"ko":"지나친, 과도한","explain":"정도가 너무 심한"}],"usageExamples":[{"en":"There is no need to place undue pressure on the students before the exam.","ko":"시험 전에 학생들에게 지나친 압박을 가할 필요는 없다."},{"en":"He managed to complete the difficult task without undue difficulty.","ko":"그는 과도한 어려움 없이 그 어려운 과제를 해낼 수 있었다."}],"grammarNote":"undue는 '지나친, 과도한'을 뜻하는 형용사로 명사 앞에서 한정적으로 주로 쓰인다(undue pressure/influence). 부사형 unduly는 '지나치게'라는 뜻이다.","grammarQuiz":[{"sentence":"The court ruled that undue force _____ (use) during the protest. (수동태 과거)","ko":"법원은 시위 중 과도한 무력이 사용되었다고 판결했다.","answer":"had been used","hint":"주절 과거 → 종속절 대과거 수동"}]},
    {"id":"v08890","w":"vein","pos":["noun"],"ph":"/veɪn/","cefr":"B2","kr":["정맥","혈관","(식물의) 잎맥"],"ex":[{"en":"Doctors carefully injected the medicine into a vein in her arm to speed recovery.","ko":"의사들은 회복을 촉진하기 위해 그녀 팔의 정맥에 약물을 주의 깊게 주입했다."}],"mnemonic":{"soundHint":"'베인' → 팔에 파랗게 '베인(칼자국 같은)' 줄이 정맥","story":"의사가 팔의 파란 정맥을 찾아 조심스레 약물을 주입하는 장면","hintConfidence":2},"pairs":{"buddyWords":[{"w":"artery","ko":"동맥","reason":"반의어 — 피를 내보내는 관"},{"w":"blood vessel","ko":"혈관","reason":"상위어 — 피가 흐르는 관"},{"w":"capillary","ko":"모세혈관","reason":"연관어 — 가느다란 혈관"}],"collocBest":[{"en":"veins and arteries","ko":"정맥과 동맥"},{"en":"veins in a leaf","ko":"잎의 잎맥"}]},"nuance":{"koSimple":"혈액이 심장으로 돌아가는 통로인 정맥이나 잎맥·광맥 등을 뜻합니다.","whenToUse":"의학적 주사·채혈, 식물의 잎맥, 광물의 광맥 등을 설명할 때 씁니다."},"krDetail":[{"ko":"정맥","explain":"피를 심장으로 보내는 관"},{"ko":"혈관","explain":"피가 흐르는 관"},{"ko":"(식물의) 잎맥","explain":"잎에 뻗은 줄"}],"usageExamples":[{"en":"Blood flows back toward the heart through the veins.","ko":"피는 정맥을 통해 심장으로 되돌아 흐른다."},{"en":"The miners discovered a rich vein of gold deep underground.","ko":"광부들은 땅속 깊은 곳에서 풍부한 금맥을 발견했다."}],"grammarNote":"vein은 '정맥, (잎)맥, 광맥' 등을 뜻하는 가산명사이며, 'in a similar/serious vein'처럼 '(말·글의) 어조·방식'을 나타내기도 한다. 동맥은 artery이다.","grammarQuiz":[{"sentence":"The medicine _____ (inject) into a vein in her arm by the doctor. (수동태 과거)","ko":"그 약은 의사에 의해 그녀의 팔에 있는 정맥에 주입되었다.","answer":"was injected","hint":"과거 수동태: was/were + p.p."}]},
    {"id":"v08893","w":"wetland","pos":["noun"],"ph":"/ˈwɛtlænd/","cefr":"B2","kr":["습지, 습지대"],"ex":[{"en":"Coastal wetlands play a crucial role in protecting inland areas from severe storm damage.","ko":"해안 습지는 내륙 지역을 심각한 폭풍 피해로부터 보호하는 중요한 역할을 한다."}],"mnemonic":{"soundHint":"'웻랜드' → 'wet(젖은)+land(땅)' 젖은 땅","story":"폭풍으로부터 내륙을 지켜주는 축축한 해안 습지대","hintConfidence":3},"pairs":{"buddyWords":[{"w":"marsh","ko":"늪","reason":"유의어 — 풀 많은 습지"},{"w":"swamp","ko":"습지","reason":"유의어 — 나무 있는 습지"},{"w":"desert","ko":"사막","reason":"반의어 — 메마른 땅"}],"collocBest":[{"en":"protect the wetlands","ko":"습지를 보호하다"},{"en":"coastal wetlands","ko":"해안 습지"}]},"nuance":{"koSimple":"물기가 많고 다양한 생물이 사는 습기 많은 자연 지역을 뜻합니다.","whenToUse":"생태 보전, 환경 보호, 기후·홍수 조절 논의에서 자연 지형으로 씁니다."},"krDetail":[{"ko":"습지, 습지대","explain":"물기 많은 축축한 땅"}],"usageExamples":[{"en":"This protected wetland is home to many rare species of migratory birds.","ko":"이 보호 습지는 많은 희귀 철새 종의 서식지이다."},{"en":"Draining the wetlands has destroyed important natural habitats for wildlife.","ko":"습지의 물을 빼내는 것은 야생 동물에게 중요한 자연 서식지를 파괴해 왔다."}],"grammarNote":"wetland는 '습지'를 뜻하며, 넓은 지역이나 여러 습지를 가리킬 때 흔히 복수형 wetlands로 쓴다. 한 단어로 붙여 쓰며 wet land로 띄어 쓰지 않는다.","grammarQuiz":[{"sentence":"Coastal wetlands play a crucial role in _____ (protect) inland areas from storms. (동명사)","ko":"해안 습지는 내륙 지역을 폭풍으로부터 보호하는 데 중요한 역할을 한다.","answer":"protecting","hint":"전치사 in + 동명사"}]},
    {"id":"v08896","w":"wipe out","pos":["phrase"],"ph":"/waɪp/","cefr":"B2","kr":["~을 완전히 없애다[말살시키다]"],"ex":[{"en":"The massive tsunami threatened to wipe out entire coastal villages within only a few minutes.","ko":"그 거대한 쓰나미는 단 몇 분 안에 해안 마을 전체를 완전히 없앨 수 있는 위협이었다."}],"mnemonic":{"soundHint":"'와이프 아웃' → 걸레(wipe)로 밖으로(out) 싹 닦아내다","story":"쓰나미가 해안 마을 전체를 걸레로 닦듯 몇 분 만에 쓸어버림","hintConfidence":3},"pairs":{"buddyWords":[{"w":"eradicate","ko":"근절하다","reason":"동의어 — 뿌리째 없앰"},{"w":"eliminate","ko":"제거하다","reason":"유의어 — 없애 버림"},{"w":"preserve","ko":"보존하다","reason":"반의어 — 그대로 지킴"}],"collocBest":[{"en":"wipe out the disease","ko":"질병을 완전히 없애다"},{"en":"wipe out an entire species","ko":"한 종 전체를 말살시키다"}]},"nuance":{"koSimple":"어떤 대상을 완전히 없애 흔적조차 남지 않게 하는 강한 행동을 뜻합니다.","whenToUse":"재해·전쟁·질병이 마을·종족·기억 등을 송두리째 말살할 때 씁니다."},"krDetail":[{"ko":"~을 완전히 없애다[말살시키다]","explain":"싹 다 없애 버리다"}],"usageExamples":[{"en":"A single new disease could wipe out the entire population of frogs.","ko":"새로운 질병 하나가 개구리 전체 개체군을 완전히 없앨 수도 있다."},{"en":"The sudden floods wiped out most of the region's crops in a single day.","ko":"갑작스러운 홍수가 단 하루 만에 그 지역 농작물 대부분을 쓸어버렸다."}],"grammarNote":"wipe out은 '완전히 없애다/전멸시키다'를 뜻하며, 목적어가 대명사면 wipe it out처럼 분리한다. 수동태 be wiped out으로도 자주 쓴다.","grammarQuiz":[{"sentence":"If the tsunami had struck, it _____ wiped out entire villages. (가정법 과거완료)","ko":"만약 그 쓰나미가 덮쳤다면, 그것은 마을 전체를 완전히 없앴을 것이다.","answer":"would have","hint":"가정법 과거완료 귀결절: would have p.p."}]},
    {"id":"v08611","w":"dispel","pos":["noun"],"ph":"/dɪˈspel/","cefr":"B2","kr":["떨쳐버리다"],"ex":[{"en":"The government launched a campaign to dispel widespread rumors about the new vaccine.","ko":"정부는 새 백신에 대해 널리 퍼진 소문을 떨쳐내기 위한 캠페인을 시작했다."}],"mnemonic":{"soundHint":"디스펠 → 'dis(멀리) + pel(밀다)'","story":"루머·의심을 멀리(dis) 밀어(pel) 없애다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"dismiss","ko":"떨쳐내다","reason":"동의어 — 생각을 없앰"},{"w":"eliminate","ko":"없애다","reason":"동의어 — 제거하다"},{"w":"reinforce","ko":"강화하다","reason":"반의어 — 오히려 굳힘"}],"collocBest":[{"en":"dispel a myth","ko":"잘못된 통념을 깨다"},{"en":"dispel doubts","ko":"의심을 떨쳐버리다"}]},"nuance":{"koSimple":"두려움·의심·소문을 없애 흩어 사라지게 만드는 뜻이에요","whenToUse":"오해·불안·잘못된 정보를 걷어낼 때 자주 쓰여요"},"krDetail":[{"ko":"떨쳐버리다","explain":"생각·감정을 몰아내다"}],"usageExamples":[{"en":"Her calm explanation quickly dispelled our worst fears.","ko":"그녀의 차분한 설명은 우리의 가장 큰 두려움을 재빨리 떨쳐냈다."},{"en":"Clear evidence helped dispel the myth that the product was unsafe.","ko":"명확한 증거는 그 제품이 안전하지 않다는 잘못된 통념을 떨쳐내는 데 도움이 되었다."}],"grammarNote":"주로 두려움·의심·오해·통념(fears, doubts, myths, rumors) 등 추상적 대상을 목적어로 취하는 타동사다. '(연기·안개를) 흩어 없애다'라는 원뜻에서 비롯되었다.","grammarQuiz":[{"sentence":"The government launched a nationwide campaign _____ dispel widespread rumors about the vaccine.","ko":"정부는 백신에 대해 널리 퍼진 소문을 떨쳐내기 위해 전국적인 캠페인을 시작했다.","answer":"to","hint":"목적의 to부정사"}]},
    {"id":"v08614","w":"dispose of","pos":["phrase"],"ph":"/dɪˈspoʊz/","cefr":"B2","kr":["~을 없애다[처리하다]","(문제 등을) 처리[해결]하다"],"ex":[{"en":"The company was fined heavily for improperly disposing of toxic chemical waste.","ko":"그 회사는 유독성 화학 폐기물을 부적절하게 처리한 것으로 무거운 벌금을 물었다."}],"mnemonic":{"soundHint":"디스포즈 오브 → 'dis(멀리) + pose(두다)'","story":"쓰레기를 멀리(dis) 두다(pose) = 처리하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"discard","ko":"버리다","reason":"동의어 — 내다 버림"},{"w":"eliminate","ko":"없애다","reason":"동의어 — 처리하다"},{"w":"retain","ko":"간직하다","reason":"반의어 — 그대로 둠"}],"collocBest":[{"en":"dispose of waste","ko":"폐기물을 처리하다"},{"en":"dispose of the problem","ko":"문제를 해결하다"}]},"nuance":{"koSimple":"필요 없는 것을 없애거나 문제를 매듭지어 해결한다는 뜻이에요","whenToUse":"쓰레기 처리나 골칫거리 해결 문맥에서 두루 써요"},"krDetail":[{"ko":"~을 없애다[처리하다]","explain":"필요 없어 내버리다"},{"ko":"(문제 등을) 처리[해결]하다","explain":"일을 마무리 짓다"}],"usageExamples":[{"en":"Please dispose of your rubbish in the bins provided outside.","ko":"쓰레기는 밖에 마련된 통에 버려 주세요."},{"en":"The committee disposed of the remaining issues in under an hour.","ko":"위원회는 남은 안건들을 한 시간도 안 되어 처리했다."}],"grammarNote":"반드시 전치사 'of'와 함께 쓰는 자동사구로, 'dispose of + 목적어' 형태다. 전치사 없는 'dispose'만으로는 이 뜻을 나타내지 못하므로 주의한다.","grammarQuiz":[{"sentence":"The company was fined heavily for improperly _____ of toxic chemical waste.","ko":"그 회사는 유독성 화학 폐기물을 부적절하게 처리한 것으로 무거운 벌금을 물었다.","answer":"disposing","hint":"전치사(for) + 동명사(-ing)"}]},
    {"id":"v08617","w":"distinguish ~ from ...","pos":["phrase"],"ph":"/dɪˈstɪŋɡwɪʃ/","cefr":"B2","kr":["~을 ...과 구별하다"],"ex":[{"en":"Scientists must carefully distinguish correlation from causation when interpreting statistical data.","ko":"과학자들은 통계 자료를 해석할 때 상관관계와 인과관계를 신중히 구별해야 한다."}],"mnemonic":{"soundHint":"디스팅기시 → 'sting(콕 찍어)' 갈라내다","story":"핀으로 콕(sting) 찍어 다른 것과 구분한다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"differentiate","ko":"구별하다","reason":"동의어 — 다름을 가림"},{"w":"tell apart","ko":"가려내다","reason":"동의어 — 갈라 알다"},{"w":"confuse","ko":"혼동하다","reason":"반의어 — 뒤섞어 봄"}],"collocBest":[{"en":"distinguish right from wrong","ko":"옳고 그름을 구별하다"},{"en":"distinguish fact from fiction","ko":"사실과 허구를 구별하다"}]},"nuance":{"koSimple":"두 대상의 차이를 알아보고 서로 다르게 나눈다는 뜻이에요","whenToUse":"개념·감정·현상을 혼동하지 않고 분간할 때 써요"},"krDetail":[{"ko":"~을 ...과 구별하다","explain":"다른 점을 가려내다"}],"usageExamples":[{"en":"Young children cannot always distinguish fantasy from reality.","ko":"어린아이들은 항상 환상과 현실을 구별하지는 못한다."},{"en":"It is hard to distinguish the original painting from the skillful copy.","ko":"원본 그림을 정교한 모작과 구별하기는 어렵다."}],"grammarNote":"'distinguish A from B'(A를 B와 구별하다) 구조로 쓰며, 'distinguish between A and B'로도 바꿔 쓸 수 있다. 재귀형 'distinguish oneself'는 '두각을 나타내다'라는 뜻이다.","grammarQuiz":[{"sentence":"It is important _____ distinguish correlation from causation when interpreting statistical data.","ko":"통계 자료를 해석할 때 상관관계와 인과관계를 구별하는 것은 중요하다.","answer":"to","hint":"It is 형용사 + to부정사 (가주어-진주어)"}]},
    {"id":"v08620","w":"do away with","pos":["phrase"],"ph":"/duː/","cefr":"B2","kr":["~을 폐지하다[버리다]","~을 처분하다"],"ex":[{"en":"Many activists urge the government to do away with outdated laws restricting personal freedom.","ko":"많은 운동가들은 정부에 개인의 자유를 제한하는 낡은 법을 폐지할 것을 촉구한다."}],"mnemonic":{"soundHint":"두 어웨이 위드 → 'away(멀리 치워버림)'","story":"낡은 법을 away(멀리) 치워버려 = 폐지하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"abolish","ko":"폐지하다","reason":"동의어 — 제도를 없앰"},{"w":"eliminate","ko":"제거하다","reason":"동의어 — 치워 버림"},{"w":"establish","ko":"세우다","reason":"반의어 — 새로 만듦"}],"collocBest":[{"en":"do away with the rule","ko":"규칙을 폐지하다"},{"en":"do away with paperwork","ko":"서류 작업을 없애다"}]},"nuance":{"koSimple":"오래된 제도나 관습을 완전히 없애 버린다는 뜻이에요","whenToUse":"낡은 법·규칙 폐지나 나쁜 습관을 버릴 때 자주 써요"},"krDetail":[{"ko":"~을 폐지하다[버리다]","explain":"제도를 없애 버리다"},{"ko":"~을 처분하다","explain":"물건을 내다 버리다"}],"usageExamples":[{"en":"The new manager decided to do away with unnecessary paperwork.","ko":"새 관리자는 불필요한 서류 작업을 없애기로 했다."},{"en":"Some reformers want to do away with the outdated grading system entirely.","ko":"일부 개혁가들은 낡은 성적 평가 제도를 완전히 폐지하기를 원한다."}],"grammarNote":"'없애다·폐지하다'를 뜻하는 세 단어짜리 동사구로, 'with' 뒤에 없앨 대상이 온다. 뜻이 비슷한 'abolish' 한 단어로 바꿔 쓸 수 있다.","grammarQuiz":[{"sentence":"Outdated laws restricting personal freedom _____ done away with after years of protest.","ko":"개인의 자유를 제한하는 낡은 법들은 수년간의 항의 끝에 폐지되었다.","answer":"were","hint":"수동태(be + p.p.) 과거형"}]},
    {"id":"v08623","w":"domesticate","pos":["phrase"],"ph":"/dəˈmestɪkeɪt/","cefr":"B2","kr":["길들이다, 가축화하다","재배하다"],"ex":[{"en":"Early humans learned to domesticate wild animals for both food and companionship purposes.","ko":"초기 인류는 식량과 반려의 목적 모두를 위해 야생 동물을 길들이는 법을 배웠다."}],"mnemonic":{"soundHint":"도메스티케이트 → 'domestic(가정의)'로 만들다","story":"야생을 domestic(가정)으로 들여 = 길들이다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"tame","ko":"길들이다","reason":"동의어 — 순하게 함"},{"w":"cultivate","ko":"재배하다","reason":"동의어 — 심어 기름"},{"w":"untamed","ko":"길들지 않은","reason":"반의어 — 야생 그대로"}],"collocBest":[{"en":"domesticate wild animals","ko":"야생 동물을 길들이다"},{"en":"domesticated plants","ko":"재배 식물"}]},"nuance":{"koSimple":"야생 동식물을 사람과 어울려 살도록 순화시킨다는 뜻이에요","whenToUse":"가축화·재배 역사나 반려동물 문맥에서 자주 써요"},"krDetail":[{"ko":"길들이다, 가축화하다","explain":"동물을 사람 곁에 두다"},{"ko":"재배하다","explain":"식물을 심어 기르다"}],"usageExamples":[{"en":"Humans first domesticated dogs tens of thousands of years ago.","ko":"인간은 수만 년 전에 처음으로 개를 길들였다."},{"en":"Certain wild grasses were domesticated to become today's staple grains.","ko":"특정 야생 풀들이 재배화되어 오늘날의 주식 곡물이 되었다."}],"grammarNote":"'(동물을) 가축화하다, (식물을) 재배화하다'라는 뜻의 타동사로, 수동태 'be domesticated'로 자주 쓴다. 형용사 'domestic'은 '가정의, 국내의'로 뜻이 다르니 구별한다.","grammarQuiz":[{"sentence":"Wild animals _____ domesticated by early humans for both food and companionship.","ko":"야생 동물들은 식량과 반려의 목적 모두를 위해 초기 인류에 의해 길들여졌다.","answer":"were","hint":"수동태(be + p.p.) 과거형"}]},
    {"id":"v08626","w":"down the road","pos":["phrase"],"ph":"/roʊd/","cefr":"B2","kr":["앞으로, 장차 언젠가는"],"ex":[{"en":"Investing in education today will pay off significantly down the road.","ko":"오늘 교육에 투자하는 것은 앞으로 상당한 성과를 낼 것이다."}],"mnemonic":{"soundHint":"다운 더 로드 → '이 road(길)을 따라 저 아래'","story":"지금 이 길을 따라 저 앞으로 = 장차 언젠가.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"eventually","ko":"결국","reason":"동의어 — 나중에 가서"},{"w":"someday","ko":"언젠가","reason":"동의어 — 훗날에"},{"w":"now","ko":"지금","reason":"반의어 — 현재"}],"collocBest":[{"en":"somewhere down the road","ko":"앞으로 언젠가"},{"en":"years down the road","ko":"몇 년 뒤에"}]},"nuance":{"koSimple":"지금 당장이 아닌 시간이 흐른 나중 시점을 가리키는 표현이에요","whenToUse":"미래의 결과나 장기적 효과를 예측할 때 써요"},"krDetail":[{"ko":"앞으로, 장차 언젠가는","explain":"시간이 흐른 먼 훗날"}],"usageExamples":[{"en":"This decision may cause serious problems down the road.","ko":"이 결정은 앞으로 심각한 문제를 일으킬 수 있다."},{"en":"We can discuss the details further down the road, once the plans are firm.","ko":"계획이 확정되면 나중에 세부 사항을 더 논의할 수 있다."}],"grammarNote":"'미래의 어느 시점에, 나중에'를 뜻하는 관용 부사구다. 'a few years down the road'처럼 기간을 앞에 붙여 구체화할 수 있으며, 물리적 '길 아래쪽'의 뜻과는 문맥으로 구별한다.","grammarQuiz":[{"sentence":"Only down the road _____ we truly realize the value of investing in education today.","ko":"앞으로 언젠가야 비로소 우리는 오늘 교육에 투자하는 진정한 가치를 깨닫는다.","answer":"will","hint":"Only + 부사구 도치 (조동사 + 주어)"}]},
    {"id":"v08629","w":"drainage","pos":["noun"],"ph":"/ˈdreɪnɪdʒ/","cefr":"B2","kr":["배수"],"ex":[{"en":"Poor drainage in the fields caused significant crop damage during the heavy rains.","ko":"밭의 열악한 배수 시설이 폭우 동안 상당한 농작물 피해를 일으켰다."}],"mnemonic":{"soundHint":"드레이니지 → 'drain(물을 빼내다)'의 명사","story":"밭에서 drain(물을 빼내는) 시설 = 배수.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"drain","ko":"물을 빼다","reason":"관련어 — 빼내는 동작"},{"w":"sewage","ko":"하수","reason":"관련어 — 흘려보낸 물"},{"w":"irrigation","ko":"물 대기","reason":"반의어 — 물을 끌어옴"}],"collocBest":[{"en":"a drainage system","ko":"배수 시스템"},{"en":"poor drainage","ko":"배수 불량"}]},"nuance":{"koSimple":"물이 잘 빠지도록 흐름을 유도하는 시설이나 그 과정을 뜻해요","whenToUse":"농경지·도시 하수·건축 설계에서 물 관리 이야기할 때 써요"},"krDetail":[{"ko":"배수","explain":"고인 물을 빼냄"}],"usageExamples":[{"en":"The garden needs better drainage to prevent the soil from flooding.","ko":"그 정원은 흙이 물에 잠기지 않도록 더 나은 배수가 필요하다."},{"en":"Engineers installed a new drainage system beneath the city streets.","ko":"기술자들은 도시 도로 아래에 새로운 배수 시설을 설치했다."}],"grammarNote":"'배수(작용)' 또는 '배수 시설'을 뜻하는 불가산 명사로 관사 없이 쓴다. 동사 'drain'(물을 빼내다)에 명사형 접미사 '-age'가 붙은 형태다.","grammarQuiz":[{"sentence":"Poor drainage in the fields, _____ caused significant crop damage, must be improved.","ko":"상당한 농작물 피해를 일으킨 밭의 열악한 배수 시설은 반드시 개선되어야 한다.","answer":"which","hint":"계속적 용법의 관계대명사"}]},
    {"id":"v08632","w":"draw upon","pos":["phrase"],"ph":"/drɔː/","cefr":"B2","kr":["~에 의지하다"],"ex":[{"en":"Successful novelists often draw upon their own life experiences to create authentic characters.","ko":"성공한 소설가들은 종종 진정성 있는 인물을 창조하기 위해 자신의 인생 경험에 의지한다."}],"mnemonic":{"soundHint":"드로 어폰 → 'upon(위쪽)에서 draw(끌어당김)'","story":"자기 경험 위(upon)에서 draw(끌어와) 의지한다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"rely on","ko":"의지하다","reason":"동의어 — 기대어 씀"},{"w":"tap into","ko":"끌어쓰다","reason":"동의어 — 꺼내 활용"},{"w":"disregard","ko":"무시하다","reason":"반의어 — 쓰지 않음"}],"collocBest":[{"en":"draw upon experience","ko":"경험에 의지하다"},{"en":"draw upon resources","ko":"자원을 활용하다"}]},"nuance":{"koSimple":"자기 경험이나 자원을 참고해 무언가에 끌어와 쓴다는 뜻이에요","whenToUse":"창작·연구에서 지식과 경험을 활용할 때 자주 써요"},"krDetail":[{"ko":"~에 의지하다","explain":"경험·지식을 끌어다 쓰다"}],"usageExamples":[{"en":"In tough times, she drew upon years of professional experience.","ko":"힘든 시기에 그녀는 수년간의 직업 경험에 의지했다."},{"en":"The lecture draws upon research from many different fields.","ko":"그 강의는 여러 다른 분야의 연구를 활용한다."}],"grammarNote":"'draw on'과 같은 뜻으로, '(축적된 지식·경험·자원을) 활용하다, 끌어다 쓰다'를 나타낸다. 'upon' 뒤에는 활용하는 대상이 온다.","grammarQuiz":[{"sentence":"Success in fiction writing often comes from _____ upon one's own life experiences.","ko":"소설 쓰기에서의 성공은 종종 자신의 인생 경험에 의지하는 데서 온다.","answer":"drawing","hint":"전치사(from) + 동명사(-ing)"}]},
    {"id":"v08635","w":"dwell on","pos":["phrase"],"ph":"/dwɛl/","cefr":"B2","kr":["~을 곰곰이 생각하다","~을 자세히 설명하다"],"ex":[{"en":"Successful athletes do not dwell on past failures during the actual competition.","ko":"성공적인 운동선수들은 실제 경기 중에 과거의 실패를 곰곰이 생각하지 않는다."}],"mnemonic":{"soundHint":"드웰 온 → 'dwell(살다) + on(위에)'","story":"그 문제 위(on)에서 계속 dwell(머무름) = 곱씹다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"ponder","ko":"숙고하다","reason":"동의어 — 곰곰 생각"},{"w":"obsess","ko":"집착하다","reason":"동의어 — 계속 매달림"},{"w":"dismiss","ko":"떨쳐내다","reason":"반의어 — 흘려보냄"}],"collocBest":[{"en":"dwell on the past","ko":"과거를 곱씹다"},{"en":"dwell on my mistakes","ko":"내 실수를 곱씹다"}]},"nuance":{"koSimple":"어떤 생각이나 감정에서 벗어나지 못하고 계속 붙잡는다는 뜻이에요","whenToUse":"과거의 실수나 걱정에 매여 있는 상황을 표현해요"},"krDetail":[{"ko":"~을 곰곰이 생각하다","explain":"계속 마음에 담아두다"},{"ko":"~을 자세히 설명하다","explain":"길게 늘어놓아 말하다"}],"usageExamples":[{"en":"Try not to dwell on your mistakes; learn from them and move forward.","ko":"실수를 곱씹지 말고, 거기서 배우고 앞으로 나아가라."},{"en":"The speech dwelt on the achievements of the past decade.","ko":"그 연설은 지난 10년의 성과를 자세히 다루었다."}],"grammarNote":"전치사 'on' 뒤에 대상이 오며, 흔히 부정적인 일을 '오래 곱씹다'라는 뉘앙스로 쓴다. 과거형은 'dwelt' 또는 'dwelled' 둘 다 가능하다.","grammarQuiz":[{"sentence":"Coaches often tell athletes not _____ dwell on past failures during a competition.","ko":"코치들은 종종 운동선수들에게 경기 중에 과거의 실패에 얽매이지 말라고 말한다.","answer":"to","hint":"tell + 목적어 + to부정사 (5형식, 부정형은 not to)"}]},
    {"id":"v08638","w":"end up -ing","pos":["phrase"],"ph":"/ɛnd/","cefr":"B2","kr":["결국 ~하게 되다"],"ex":[{"en":"Students who skip classes often end up struggling to catch up with their peers.","ko":"수업을 빠지는 학생들은 결국 또래를 따라잡기 위해 애쓰게 된다."}],"mnemonic":{"soundHint":"엔드 업 → 'end(끝)에 up(도달)'","story":"이런저런 일 끝에 end(끝)까지 가서 = 결국 ~하게 되다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"eventually","ko":"결국","reason":"동의어 — 끝내 그리 됨"},{"w":"turn out","ko":"~로 되다","reason":"동의어 — 되어감"},{"w":"begin","ko":"시작하다","reason":"반의어 — 처음 단계"}],"collocBest":[{"en":"end up paying more","ko":"결국 더 많이 내게 되다"},{"en":"end up living alone","ko":"결국 혼자 살게 되다"}]},"nuance":{"koSimple":"여러 과정을 거친 끝에 예상치 못한 결과에 이른다는 뜻이에요","whenToUse":"뜻하지 않은 마무리나 최종 상태를 말할 때 써요"},"krDetail":[{"ko":"결국 ~하게 되다","explain":"마침내 그렇게 되다"}],"usageExamples":[{"en":"If you keep procrastinating, you will end up missing the deadline.","ko":"계속 미루면 결국 마감을 놓치게 될 것이다."},{"en":"We got lost and ended up walking three extra miles.","ko":"우리는 길을 잃어 결국 3마일을 더 걷게 되었다."}],"grammarNote":"'end up' 뒤에는 동명사(-ing)가 오며, 예상치 못한 최종 결과를 나타낸다. 뒤에 장소를 나타내는 부사구(end up in jail)나 형용사(end up broke)가 올 수도 있다.","grammarQuiz":[{"sentence":"Students who skip classes often end up _____ to catch up with their peers.","ko":"수업을 빠지는 학생들은 결국 또래를 따라잡기 위해 애쓰게 된다.","answer":"struggling","hint":"end up + 동명사(-ing)"}]},
    {"id":"v08641","w":"enliven","pos":["phrase"],"ph":"/ɪnˈlaɪvən/","cefr":"B2","kr":["활기 있게 만들다"],"ex":[{"en":"The new director's fresh ideas will surely enliven the once-dull afternoon meetings.","ko":"새 감독의 신선한 아이디어는 분명 한때 지루했던 오후 회의를 활기 있게 만들 것이다."}],"mnemonic":{"soundHint":"인라이븐 → 'en(하게 하다) + liven(살아 있게)'","story":"en + live → 살아 있게 만들다 = 활기 부여.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"energize","ko":"활기를 주다","reason":"동의어 — 기운 돋움"},{"w":"invigorate","ko":"북돋우다","reason":"동의어 — 생기 넣음"},{"w":"dampen","ko":"가라앉히다","reason":"반의어 — 김을 뺌"}],"collocBest":[{"en":"enliven the conversation","ko":"대화에 활기를 불어넣다"},{"en":"enliven a dull party","ko":"지루한 파티를 활기차게 하다"}]},"nuance":{"koSimple":"지루하거나 침체된 분위기에 생기와 재미를 불어넣는 뜻이에요","whenToUse":"회의·모임·이야기에 활력을 더할 때 자주 쓰여요"},"krDetail":[{"ko":"활기 있게 만들다","explain":"생기가 돌게 하다"}],"usageExamples":[{"en":"A few bright cushions can enliven a dull living room instantly.","ko":"밝은 쿠션 몇 개는 칙칙한 거실을 순식간에 생기 있게 만들 수 있다."},{"en":"Her witty anecdotes enlivened an otherwise tedious lecture.","ko":"그녀의 재치 있는 일화들은 자칫 지루할 뻔한 강의에 활기를 불어넣었다."}],"grammarNote":"명사·형용사 'live/life'에 '~하게 만들다'를 뜻하는 접두사 'en-'이 붙은 타동사로, 'make ~ lively'와 같은 뜻이다. 분위기·장면·글 등을 목적어로 취한다.","grammarQuiz":[{"sentence":"New interactive games were introduced _____ enliven the once-dull afternoon meetings.","ko":"한때 지루했던 오후 회의를 활기 있게 만들기 위해 새로운 상호작용 게임들이 도입되었다.","answer":"to","hint":"목적의 to부정사"}]},
    {"id":"v08644","w":"entice","pos":["verb"],"ph":"/ɪnˈtaɪs/","cefr":"B2","kr":["유도하다"],"ex":[{"en":"Retailers use bright colors and cheerful music to entice customers into their stores.","ko":"소매업자들은 손님을 매장으로 유도하기 위해 밝은 색상과 경쾌한 음악을 사용한다."}],"mnemonic":{"soundHint":"인타이스 → '안으로(en) 타이스(꼬여 끌어들임)'","story":"달콤한 음악으로 안으로 꼬여 끌어들이다 = 유도.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"lure","ko":"꾀다","reason":"동의어 — 미끼로 끎"},{"w":"tempt","ko":"유혹하다","reason":"동의어 — 마음 흔듦"},{"w":"repel","ko":"쫓아내다","reason":"반의어 — 밀어냄"}],"collocBest":[{"en":"entice customers to buy","ko":"고객이 사도록 유도하다"},{"en":"entice with low prices","ko":"저렴한 가격으로 유혹하다"}]},"nuance":{"koSimple":"매력적 요소로 마음을 끌어 어떤 행동을 하게 만드는 뜻이에요","whenToUse":"마케팅·광고에서 고객을 끌어들이는 상황에 써요"},"krDetail":[{"ko":"유도하다","explain":"꾀어서 이끌다"}],"usageExamples":[{"en":"Low prices are used to entice shoppers into buying more than they need.","ko":"낮은 가격은 쇼핑객이 필요 이상으로 사도록 유도하는 데 쓰인다."},{"en":"The company enticed him to join with the promise of a huge bonus.","ko":"그 회사는 거액의 보너스를 약속하며 그가 합류하도록 꾀었다."}],"grammarNote":"'entice + 사람 + to do'(~하도록 꾀다) 또는 'entice + 사람 + into -ing'(~하도록 유인하다) 구조로 자주 쓴다. 매력적인 것으로 유혹한다는 뉘앙스가 있다.","grammarQuiz":[{"sentence":"Cheerful background music entices customers _____ enter the store and browse more freely.","ko":"경쾌한 배경 음악은 손님들이 매장에 들어와 더 자유롭게 둘러보도록 유도한다.","answer":"to","hint":"entice + 목적어 + to부정사 (5형식)"}]},

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const SFX = {

  correct(){

  },
  type(){
    tone({type:"square", freq:1500, dur:.02, vol:.05});
  },
  // ── 심화 90%+ 전용 : 명랑·화려·인상 깊은 팡파레 조합 ──
  // 1) 브라스 팡파레 (C→F→G→C major 상승) 화음 4단
  // 2) 크리스탈 아르페지오 8음 (C5→E7)
  // 3) 종·코인·환호 노이즈
  grandFanfare(){
    // 1) 브라스 트라이애드 상승 (sawtooth = 브라스 느낌)
    const chords = [
      { t:0.00, notes:[261.63, 329.63, 392.00] },   // C major (C4 E4 G4)
      { t:0.16, notes:[349.23, 440.00, 523.25] },   // F major (F4 A4 C5)
      { t:0.32, notes:[392.00, 493.88, 587.33] },   // G major (G4 B4 D5)
      { t:0.48, notes:[523.25, 659.25, 783.99] }    // C major 옥타브 (C5 E5 G5) — 절정
    ];
    chords.forEach(ch => {
      ch.notes.forEach(f => {
        tone({ type:"sawtooth", freq:f, dur:.22, vol:.12, atk:.008, t0:ch.t });
        // 부드러운 sine 배음 살짝 얹기
        tone({ type:"sine",     freq:f*2, dur:.20, vol:.05, t0:ch.t });
      });
