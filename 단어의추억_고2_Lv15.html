<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고2 Lv.15</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}
  /* 첫글자 프리필 인풋 — 미리 채워진 첫 글자를 시각적으로 강조 */
  .prefill-input{caret-color:#fef3c7;font-family:'Courier New',ui-monospace,monospace;letter-spacing:.05em;font-weight:700;}
  .prefill-hint{color:#c4b5fd;font-size:.82rem;font-weight:500;margin-left:6px;letter-spacing:0;}
  /* ---------- 낱말박스 (자동완성 방어) ---------- */
  .word-answer{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;margin:6px 0;}
  .word-answer.inline{display:inline-flex;gap:8px;vertical-align:middle;margin:0 4px;}
  .word-group{
    display:inline-flex;align-items:center;gap:0;
    background:rgba(11,18,32,.7);border:1.5px solid #334155;border-radius:8px;
    padding:0;transition:all .15s;overflow:hidden;flex-shrink:0;
  }
  .word-group:focus-within{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(168,139,250,.22);}
  .word-group.correct{border-color:var(--grade);background:rgba(16,185,129,.10);}
  .word-group.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);}
  /* 폰트: body 상속 sans-serif (이전 .input-box input과 동일한 스타일) */
  .first-letter{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;padding:0 8px;height:44px;line-height:44px;
    background:linear-gradient(180deg,#3b2966 0%,#2a1e4d 100%);
    color:#fef3c7;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    border-right:1px solid #8b5cf6;user-select:none;
  }
  .rest-input{
    border:0;background:transparent;color:var(--text);outline:none;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    padding:0 10px;height:44px;line-height:44px;width:120px;min-width:90px;
    text-transform:lowercase;
  }
  .rest-input::placeholder{color:#475569;font-weight:400;}
  .word-group.correct .rest-input{color:#a7f3d0;}
  .word-group.wrong .rest-input{color:#fca5a5;}
  .cloze-sentence .word-answer{display:inline-flex;flex-wrap:wrap;gap:6px 8px;margin:0 4px;vertical-align:middle;}
  .cloze-sentence .word-group{border-radius:6px;}
  .cloze-sentence .first-letter{height:38px;line-height:38px;font-size:1.05rem;min-width:22px;padding:0 7px;}
  .cloze-sentence .rest-input{height:38px;line-height:38px;font-size:1.05rem;width:100px;min-width:70px;padding:0 9px;}
  /* .input-box input 스타일이 .rest-input을 override 하는 문제 해결 */
  .input-box .word-answer input.rest-input{
    background:transparent;border:0;padding:0 10px;
    min-height:44px;height:44px;line-height:44px;text-align:left;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    width:120px;min-width:90px;box-shadow:none;
  }
  .input-box .word-answer input.rest-input:focus{border:0;box-shadow:none;}
  /* single-letter 그룹 */
  .word-group.single-letter{background:rgba(11,18,32,.5);}
  .word-group.single-letter input.rest-input{width:80px;min-width:60px;}
  .hint-line{margin-top:12px;padding:10px 14px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35);border-radius:10px;color:#c4b5fd;font-size:.95rem;line-height:1.55;text-align:center;letter-spacing:.03em;}
  .hint-line b{color:#fef3c7;font-weight:800;font-family:'Courier New',ui-monospace,monospace;font-size:1.05rem;letter-spacing:.15em;margin:0 2px;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}
  .buddy-item .why{font-size:.86rem;color:var(--back-muted);opacity:1;display:block;width:100%;margin-top:3px;font-style:italic;}
  .ex-line{font-size:1.03rem;line-height:1.55;}
  .ex-line .en{color:#f8fafc;font-style:italic;font-weight:500;}
  .ex-line .ko{color:var(--back-muted-strong);font-size:.94rem;display:block;margin-top:4px;font-weight:500;}
  /* 콜로케이션·예문 재생 버튼 */
  .speak-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;flex:0 0 26px;
    padding:0;margin-right:8px;
    border:1px solid rgba(59,130,246,.35);
    background:rgba(59,130,246,.10);
    color:var(--info);
    font-size:.78rem;line-height:1;
    border-radius:8px;cursor:pointer;
    transition:var(--transition);
  }
  .speak-btn:hover{
    background:rgba(59,130,246,.22);
    border-color:rgba(59,130,246,.55);
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(59,130,246,.20);
  }
  .speak-btn:active{transform:translateY(0);}
  .col-item .en, .ex-line .en{flex:1 1 auto;min-width:0;}
  .ex-line{display:flex;flex-wrap:wrap;align-items:baseline;}

  /* Grade buttons */
  .grade-row{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
    margin-top:14px;
  }
  .grade-btn{
    padding:15px 6px;border-radius:var(--radius-md);
    font-weight:700;font-size:.92rem;
    min-height:56px;
    border:1.5px solid transparent;
    transition:all var(--transition);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .grade-btn .ic{font-size:20px;line-height:1;}
  .grade-btn.prev{background:rgba(59,130,246,.14);color:#93c5fd;border-color:rgba(59,130,246,.35);}
  .grade-btn.home{background:rgba(245,158,11,.12);color:var(--accent-light);border-color:rgba(245,158,11,.30);}
  .grade-btn.next{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.40);}
  .grade-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
  .grade-btn.prev:hover{box-shadow:0 6px 16px rgba(59,130,246,.25);}
  .grade-btn.home:hover{box-shadow:0 6px 16px rgba(245,158,11,.20);}
  .grade-btn.next:hover{box-shadow:0 6px 16px rgba(16,185,129,.30);}
  .grade-btn:active{transform:translateY(0) scale(.97);}
  .grade-btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6);}
  .grade-btn:disabled:hover{transform:none;box-shadow:none;filter:grayscale(.6);}

  .flip-hint{
    text-align:center;color:var(--text-on-dark-muted);
    font-size:.72rem;margin-top:10px;opacity:.6;letter-spacing:.02em;
  }

  /* ---------- QUIZ ---------- */
  .quiz-stage{padding:12px 2px;flex:1;display:flex;flex-direction:column;}
  .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .quiz-num{
    background:var(--bg-card);padding:7px 14px;border-radius:100px;
    font-size:.82rem;font-weight:600;
    border:1px solid rgba(148,163,184,.15);
    color:var(--text-on-dark-muted);
  }
  .quiz-num b{color:var(--grade);font-weight:700;}
  .quiz-mode{
    background:rgba(245,158,11,.12);color:var(--accent-light);
    padding:6px 12px;border-radius:100px;
    font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.22);
  }
  .quiz-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:24px 20px;
    box-shadow:var(--shadow-lg);
    min-height:320px;display:flex;flex-direction:column;
  }
  .quiz-prompt{
    text-align:center;margin-bottom:20px;
  }
  .quiz-prompt .label{
    font-size:.68rem;color:var(--text-on-dark-muted);
    text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:10px;
  }
  .quiz-prompt .qword{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.2rem;font-weight:800;color:var(--text-on-dark);
    line-height:1.15;word-break:break-word;letter-spacing:-1px;
    text-shadow:0 0 24px rgba(16,185,129,.20);
  }
  .quiz-prompt .qkr{font-size:1.5rem;font-weight:700;color:var(--accent-light);line-height:1.3;}
  .quiz-prompt .qph{color:var(--text-on-dark-muted);font-size:.88rem;margin-top:6px;font-style:italic;}
  .quiz-prompt .lis-btn{
    margin:10px auto 0;display:flex;
    background:linear-gradient(135deg, var(--info) 0%, #2563eb 100%);
    color:#ffffff;font-weight:700;font-size:.95rem;
    padding:14px 24px;border-radius:var(--radius-md);align-items:center;gap:8px;
    box-shadow:0 6px 20px rgba(59,130,246,.35), inset 0 1px 0 rgba(255,255,255,.15);
    min-height:48px;transition:all var(--transition);
  }
  .quiz-prompt .lis-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(59,130,246,.42);}
  .quiz-prompt .lis-btn:active{transform:translateY(0) scale(.97);}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.12);
    border-radius:var(--radius-md);padding:14px 16px;
    text-align:left;font-size:.98rem;font-weight:600;color:var(--text-on-dark);
    transition:all var(--transition);
    display:flex;align-items:center;gap:12px;
    min-height:52px;line-height:1.3;
  }
  .choice:hover{background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.22);transform:translateY(-1px);}
  .choice .idx{
    flex-shrink:0;width:26px;height:26px;border-radius:var(--radius-sm);
    background:rgba(148,163,184,.14);color:var(--text-on-dark-muted);
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:700;
    transition:all var(--transition);
  }
  .choice:active{transform:scale(.98);}
  .choice.correct{background:rgba(16,185,129,.16);border-color:var(--grade);color:#a7f3d0;box-shadow:0 4px 16px rgba(16,185,129,.20);}
  .choice.correct .idx{background:var(--grade);color:#0f172a;}
  .choice.wrong{background:rgba(239,68,68,.14);border-color:var(--danger);color:#fca5a5;}
  .choice.wrong .idx{background:var(--danger);color:#fff;}
  .choice.dimmed{opacity:.4;}
  body.cb-mode .choice.correct::after{content:"✓";margin-left:auto;font-size:22px;font-weight:900;}
  body.cb-mode .choice.wrong::after{content:"✕";margin-left:auto;font-size:22px;font-weight:900;}

  .input-box{
    display:flex;flex-direction:column;gap:12px;margin-top:6px;
  }
  .input-box input{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.15);
    border-radius:var(--radius-md);padding:16px;
    color:var(--text-on-dark);font-size:1.15rem;font-weight:600;
    text-align:center;letter-spacing:.5px;
    min-height:52px;outline:none;
    transition:all var(--transition);
  }
  .input-box input:focus{border-color:var(--grade);box-shadow:0 0 0 4px rgba(16,185,129,.15);}
  .input-box input.correct{border-color:var(--grade);background:rgba(16,185,129,.10);color:#a7f3d0;}
  .input-box input.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);color:#fca5a5;}
  .submit-btn{
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1rem;
    padding:15px;border-radius:var(--radius-md);min-height:52px;
    box-shadow:0 6px 20px rgba(16,185,129,.30), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);
  }
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,185,129,.40);}
  .submit-btn:active{transform:translateY(0) scale(.98);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .feedback{
    text-align:center;margin-top:16px;
    min-height:24px;font-weight:700;font-size:.92rem;
    letter-spacing:.02em;
  }
  .feedback.ok{color:#6ee7b7;}
  .feedback.bad{color:#fca5a5;}

  /* ---------- RESULT ---------- */
  .result{text-align:center;padding:20px 4px;}
  .result h2{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2rem;margin:10px 0 6px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg, var(--accent) 0%, var(--grade) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .result .score-big{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:4rem;font-weight:900;line-height:1;
    margin:20px 0 6px;color:var(--grade);letter-spacing:-2px;
    text-shadow:0 0 40px var(--grade-glow-strong);
  }
  .result .score-pct{color:var(--text-on-dark-muted);font-size:1.1rem;font-weight:600;}
  .result .score-time{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:10px;padding:8px 16px;border-radius:var(--radius-lg);
    background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.20);
    color:#f8fafc;font-size:1.05rem;font-weight:600;letter-spacing:.02em;
  }
  .result .score-time b{color:var(--accent-light);font-weight:800;font-variant-numeric:tabular-nums;}
  /* 심화 90%+ 배곧 쵝오 배너 */
  .grand-banner{
    position:relative;margin:14px auto 4px;padding:16px 22px;max-width:520px;
    border-radius:var(--radius-lg);
    background:linear-gradient(135deg,#7c3aed 0%,#db2777 45%,#f59e0b 100%);
    box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;
    text-align:center;overflow:hidden;
    animation:grandPop .8s cubic-bezier(.2,.7,.1,1.4) both, grandGlow 2s ease-in-out infinite alternate;
  }
  .grand-banner::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 50%),
               radial-gradient(circle at 70% 80%, rgba(255,255,255,.25), transparent 50%);
    pointer-events:none;
  }
  .grand-banner .grand-line{
    font-size:1.65rem;font-weight:900;color:#fff;letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.35);position:relative;
  }
  .grand-banner .grand-line b{
    background:linear-gradient(135deg,#fde68a 0%,#fbbf24 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;padding:0 4px;
  }
  .grand-banner .grand-sub{
    margin-top:6px;color:rgba(255,255,255,.95);
    font-size:.98rem;font-weight:700;letter-spacing:.02em;position:relative;
  }
  @keyframes grandPop{
    0%{transform:scale(.7) rotate(-3deg);opacity:0;}
    60%{transform:scale(1.06) rotate(1deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes grandGlow{
    from{box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;}
    to  {box-shadow:0 20px 60px rgba(245,158,11,.65),0 0 0 1px rgba(255,255,255,.35) inset;}
  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:hgFadeIn .35s ease-out both, hgFadeOut .8s ease-in 5.2s forwards;
  }
  .hg-celebration::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),
      radial-gradient(circle at 80% 25%, rgba(236,72,153,.28), transparent 22%),
      radial-gradient(circle at 30% 75%, rgba(59,130,246,.28), transparent 24%),
      radial-gradient(circle at 75% 80%, rgba(16,185,129,.28), transparent 22%);
    animation:hgSwirl 6s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .hg-halo{
    position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg,#fbbf24,#ef4444,#a855f7,#3b82f6,#10b981,#fbbf24);
    mix-blend-mode:screen;opacity:.28;
    animation:hgRotate 12s linear infinite;
  }
  .hg-msg{
    position:relative;font-family:inherit;
    font-size:clamp(28px, 6vw, 68px);font-weight:900;line-height:1.25;text-align:center;
    padding:32px 40px;max-width:92vw;letter-spacing:-.01em;
    background:linear-gradient(90deg,#fbbf24,#ef4444,#ec4899,#a855f7,#3b82f6,#10b981,#fbbf24);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(251,191,36,.75)) drop-shadow(0 0 40px rgba(236,72,153,.45));
    animation:hgRainbow 3.5s linear infinite, hgPop 1.6s cubic-bezier(.2,.7,.1,1.4) both, hgFloat 4s ease-in-out infinite alternate 1.6s;
  }
  .hg-sparkle{
    position:absolute;pointer-events:none;font-size:clamp(24px,3vw,36px);
    animation:hgSparkle 1.8s ease-in-out infinite;
  }
  @keyframes hgFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes hgFadeOut{to{opacity:0;visibility:hidden;}}
  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  @keyframes hgPop{
    0%{transform:scale(.15) rotate(-25deg);opacity:0;}
    35%{transform:scale(1.28) rotate(6deg);opacity:1;}
    55%{transform:scale(.94) rotate(-3deg);}
    75%{transform:scale(1.08) rotate(1.5deg);}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes hgFloat{
    from{transform:translateY(-6px) scale(1);}
    to{transform:translateY(6px) scale(1.02);}
  }
  @keyframes hgSwirl{
    0%{transform:scale(1) rotate(0);}
    100%{transform:scale(1.15) rotate(8deg);}
  }
  @keyframes hgRotate{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes hgSparkle{
    0%,100%{opacity:0;transform:scale(.4) rotate(0deg);}
    50%{opacity:1;transform:scale(1.2) rotate(180deg);}
  }
  .result-stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:22px 0;
  }
  .result-stat{
    background:var(--bg-card);padding:16px 12px;border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.10);
    box-shadow:var(--shadow-md);
    transition:transform var(--transition);
  }
  .result-stat:hover{transform:translateY(-2px);}
  .result-stat .l{font-size:.68rem;color:var(--text-on-dark-muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;}
  .result-stat .v{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.4rem;font-weight:800;color:var(--text-on-dark);margin-top:6px;}
  .result-stat .v.grade-c{color:var(--grade);}
  .result-stat .v.acc-c{color:var(--accent-light);}
  .badges-earned{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 20px;
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-card);padding:8px 14px;border-radius:100px;
    font-size:.82rem;font-weight:700;
    border:1px solid var(--accent);color:var(--accent-light);
    box-shadow:0 0 16px rgba(245,158,11,.22), 0 4px 12px rgba(0,0,0,.3);
    animation:badge-pop .5s cubic-bezier(.2,.7,.1,1.4) backwards;
  }
  .badge .ic{font-size:1.1rem;}
  @keyframes badge-pop{from{transform:scale(.4) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ---------- ANIMATIONS ---------- */
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  @keyframes bounce-correct{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .shake{animation:shake .22s ease;}
  .bounce-correct{animation:bounce-correct .32s ease;}

  /* ---------- CANVAS (particles) ---------- */
  #fxCanvas{
    position:fixed;inset:0;pointer-events:none;z-index:50;
  }

  /* ---------- TOAST ---------- */
  .toast-wrap{
    position:fixed;top:88px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;z-index:40;
  }
  .toast{
    background:rgba(15,23,42,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--accent-light);
    padding:10px 18px;border-radius:100px;font-weight:700;font-size:.86rem;
    letter-spacing:.02em;
    border:1px solid rgba(245,158,11,.35);
    box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 20px rgba(245,158,11,.15);
    animation:toast-in .3s cubic-bezier(.4,0,.2,1), toast-out .45s cubic-bezier(.4,0,.2,1) 1.4s forwards;
  }
  .toast.streak{color:var(--accent-light);}
  .toast.big{font-size:1.05rem;padding:14px 24px;border-color:rgba(16,185,129,.4);color:#a7f3d0;box-shadow:0 12px 32px rgba(0,0,0,.5), 0 0 24px rgba(16,185,129,.2);}
  @keyframes toast-in{from{transform:translateY(-14px) scale(.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
  @keyframes toast-out{to{transform:translateY(-14px) scale(.9);opacity:0;}}

    {"id":"w02046","w":"empower","pos":["v"],"ph":"/ɪmˈpaʊər/","cefr":"B2","kr":["권한을 부여하다","역량을 강화하다"],"ex":[{"en":"Education empowers individuals.","ko":"교육은 개인의 역량을 강화한다."}],"mnemonic":{"soundHint":"'임파워' → em(주다) + power(힘) = 힘을 주다","story":"교육으로 사회적 약자에게 '임파워' 힘을 실어주는 프로젝트.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"enable","ko":"가능하게 하다","reason":"동의어 — 힘 부여"},{"w":"authorize","ko":"권한을 주다","reason":"동의어 — 승인"},{"w":"restrict","ko":"제한하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"empower women","ko":"여성의 역량을 강화하다"},{"en":"empower employees","ko":"직원들에게 권한을 부여하다"}]},"nuance":{"koSimple":"권한이나 힘을 부여해 스스로 하게 만든다는 뜻이다.","whenToUse":"교육·정책이 개인의 역량을 키울 때 쓴다."},"krDetail":[{"ko":"권한을 부여하다","explain":"무언가 할 힘·자격을 주다"},{"ko":"역량을 강화하다","explain":"스스로 할 능력을 키워 주다"}],"usageExamples":[{"en":"The new law empowers citizens to request public records.","ko":"새 법은 시민들이 공공 기록을 요청할 권한을 부여한다."},{"en":"Good teachers empower students to think for themselves.","ko":"좋은 교사는 학생들이 스스로 생각하도록 역량을 키워 준다."}],"grammarNote":"'empower + 목적어 + to부정사'(~가 …하도록 권한/능력을 주다) 구문으로 자주 쓴다. 접두사 'em-'은 '~하게 만들다'라는 뜻을 더한다.","grammarQuiz":[{"sentence":"Education empowers people _____ (achieve) their dreams.","ko":"교육은 사람들이 자신의 꿈을 이루도록 힘을 부여한다.","answer":"to achieve","hint":"5형식 (empower + O + to부정사)"}]},
    {"id":"w02049","w":"enact","pos":["v"],"ph":"/ɪˈnækt/","cefr":"B2","kr":["제정하다","법률로 만들다","실행하다"],"ex":[{"en":"Parliament enacted new laws to protect the environment.","ko":"의회는 환경을 보호하기 위한 새로운 법률을 제정했다."}],"mnemonic":{"soundHint":"'이낵트' → en(만들다) + act(법) = 법으로 만들다 = 제정하다","story":"국회가 새 환경법을 '이낵트' 제정하며 통과시키는 장면.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"legislate","ko":"법 제정하다","reason":"동의어 — 입법"},{"w":"implement","ko":"시행하다","reason":"유의어 — 실행"},{"w":"repeal","ko":"폐지하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"enact a law","ko":"법을 제정하다"},{"en":"enact new legislation","ko":"새 법률을 만들다"}]},"nuance":{"koSimple":"법안을 공식적으로 만들어 법으로 확정한다는 뜻이다.","whenToUse":"의회에서 법률을 제정·시행할 때 쓴다."},"krDetail":[{"ko":"제정하다","explain":"법을 만들어 정하다"},{"ko":"법률로 만들다","explain":"정식 법으로 성립시키다"},{"ko":"실행하다","explain":"계획을 실제로 행하다"}],"usageExamples":[{"en":"Congress enacted a law to protect endangered species.","ko":"의회는 멸종 위기종을 보호하기 위한 법을 제정했다."},{"en":"The company enacted new safety measures after the accident.","ko":"그 회사는 사고 이후 새로운 안전 조치를 실행했다."}],"grammarNote":"'enact'는 주로 입법 기관이 법을 '제정하다'라는 뜻으로 쓰이는 타동사로, 'enact a law/bill'이 대표적 연어이다. 명사형은 'enactment'이다.","grammarQuiz":[{"sentence":"New laws _____ (enact) to protect endangered species.","ko":"멸종위기 종을 보호하기 위한 새로운 법이 제정되었다.","answer":"were enacted","hint":"수동태 (과거)"}]},
    {"id":"w02050","w":"enchant","pos":["v"],"ph":"/ɪnˈtʃænt/","cefr":"B2","kr":["매혹하다","마법을 걸다"],"ex":[{"en":"The music enchanted the crowd.","ko":"음악이 군중을 매혹했다."}],"mnemonic":{"soundHint":"'인챈트' → 게임 인챈트(마법 부여) = 매혹","story":"게임 검에 '인챈트' 마법을 걸어 반짝이게 만드는 장면.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"charm","ko":"매혹하다","reason":"동의어 — 홀리다"},{"w":"fascinate","ko":"매료하다","reason":"동의어 — 사로잡다"},{"w":"repel","ko":"질리게 하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"enchant the audience","ko":"관객을 매혹하다"},{"en":"an enchanted forest","ko":"마법에 걸린 숲"}]},"nuance":{"koSimple":"매력적인 힘으로 마음을 사로잡는다는 뜻이다.","whenToUse":"음악·풍경·이야기가 사람을 매혹할 때 쓴다."},"krDetail":[{"ko":"매혹하다","explain":"마음을 사로잡다"},{"ko":"마법을 걸다","explain":"주문으로 마력을 씌우다"}],"usageExamples":[{"en":"The singer's voice enchanted the entire audience.","ko":"그 가수의 목소리는 청중 전체를 매혹했다."},{"en":"In the tale, a witch enchanted the sleeping princess.","ko":"그 이야기에서 마녀가 잠든 공주에게 마법을 걸었다."}],"grammarNote":"'enchant'는 타동사로 사람·마음을 목적어로 취한다. 흔히 수동태 'be enchanted by/with ~'(~에 매혹되다) 형태로 쓰며, 형용사 'enchanting'은 '매혹적인'을 뜻한다.","grammarQuiz":[{"sentence":"The audience _____ (enchant) by her beautiful voice.","ko":"청중은 그녀의 아름다운 목소리에 매혹되었다.","answer":"was enchanted","hint":"수동태 (과거)"}]},
    {"id":"w02053","w":"encounter","pos":["v","n"],"ph":"/ɪnˈkaʊntər/","cefr":"B2","kr":["마주치다","접하다"],"ex":[{"en":"We encountered many obstacles.","ko":"우리는 많은 장애물을 만났다."}],"mnemonic":{"soundHint":"'인카운터' → en(안에서)+counter(마주치는) = 마주치다","story":"숲길에서 야생 사슴과 뜻밖의 '인카운터'를 하는 장면.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"meet","ko":"만나다","reason":"동의어 — 기본형"},{"w":"confront","ko":"직면하다","reason":"유의어 — 맞닥뜨림"},{"w":"avoid","ko":"피하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"encounter difficulties","ko":"어려움에 마주치다"},{"en":"a chance encounter","ko":"우연한 만남"}]},"nuance":{"koSimple":"우연히 사람이나 문제를 마주친다는 뜻이다.","whenToUse":"예상치 못한 만남이나 장애물을 맞닥뜨릴 때 쓴다."},"krDetail":[{"ko":"마주치다","explain":"뜻밖에 만나거나 부딪히다"},{"ko":"접하다","explain":"어떤 것을 겪거나 대하다"}],"usageExamples":[{"en":"Researchers often encounter unexpected problems in the lab.","ko":"연구자들은 실험실에서 종종 예상치 못한 문제에 부딪힌다."},{"en":"Their first encounter took place at a small café.","ko":"그들의 첫 만남은 작은 카페에서 이루어졌다."}],"grammarNote":"동사 'encounter'는 전치사 없이 목적어를 바로 취해 'encounter a problem/difficulty'처럼 쓴다. 명사로는 '(우연한) 만남'을 뜻하며 'an encounter with ~' 형태로 쓴다.","grammarQuiz":[{"sentence":"The problems _____ (encounter) during the trip were unexpected.","ko":"여행 중 마주친 문제들은 예상치 못한 것이었다.","answer":"encountered","hint":"과거분사 (수동)"}]},
    {"id":"w02057","w":"endanger","pos":["v"],"ph":"/ɪnˈdeɪndʒər/","cefr":"B2","kr":["위험에 빠뜨리다","위협하다"],"ex":[{"en":"Pollution endangers wildlife.","ko":"오염은 야생 동물을 위협한다."}],"mnemonic":{"soundHint":"'인데인저' → en(만들다) + danger(위험) = 위험에 빠뜨리다","story":"무분별한 벌목이 야생 동물을 '인데인저' 위협하는 다큐.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"threaten","ko":"위협하다","reason":"동의어 — 위태롭게"},{"w":"imperil","ko":"위태롭게 하다","reason":"동의어 — 격식체"},{"w":"protect","ko":"보호하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"endanger wildlife","ko":"야생 동물을 위협하다"},{"en":"endanger public health","ko":"공중보건을 위험에 빠뜨리다"}]},"nuance":{"koSimple":"안전이나 존속을 위험하게 만든다는 뜻이다.","whenToUse":"환경 오염이 야생 동물을 위협할 때 쓴다."},"krDetail":[{"ko":"위험에 빠뜨리다","explain":"위태로운 상태로 만들다"},{"ko":"위협하다","explain":"해를 입을 처지로 몰다"}],"usageExamples":[{"en":"Careless driving can endanger the lives of others.","ko":"부주의한 운전은 다른 사람들의 생명을 위험에 빠뜨릴 수 있다."},{"en":"Overfishing endangers many species of ocean life.","ko":"남획은 많은 바다 생물 종을 위협한다."}],"grammarNote":"'endanger'는 목적어를 취하는 타동사로, 접두사 'en-'이 '위험(danger)에 처하게 하다'라는 동사를 만든다. 과거분사 형용사 'endangered species'(멸종 위기종)가 대표적 표현이다.","grammarQuiz":[{"sentence":"Many species _____ (endanger) by human activities in recent years.","ko":"최근 몇 년간 많은 종들이 인간 활동에 의해 위협받아 왔다.","answer":"have been endangered","hint":"현재완료 수동태"}]},
    {"id":"w02063","w":"endurance","pos":["n"],"ph":"/ɪnˈdjʊərəns/","cefr":"B2","kr":["인내","지구력"],"ex":[{"en":"Running requires great endurance.","ko":"달리기는 대단한 인내를 필요로 한다."}],"mnemonic":{"soundHint":"'인듀어런스' → endure + ance = 인내","story":"마라톤을 완주하는 '인듀어런스' 지구력 훈련.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"stamina","ko":"지구력","reason":"동의어 — 체력 버팀"},{"w":"perseverance","ko":"끈기","reason":"유의어 — 인내심"},{"w":"weakness","ko":"약함","reason":"반의어 — 정반대"}],"collocBest":[{"en":"physical endurance","ko":"신체적 지구력"},{"en":"build endurance","ko":"인내력을 기르다"}]},"nuance":{"koSimple":"오랜 시간 견뎌내는 신체적·정신적 힘이다.","whenToUse":"장거리 달리기·힘든 상황의 지구력을 말할 때 쓴다."},"krDetail":[{"ko":"인내","explain":"힘든 것을 참고 견딤"},{"ko":"지구력","explain":"오래 버티는 힘"}],"usageExamples":[{"en":"Marathon runners need great physical endurance.","ko":"마라톤 선수들은 뛰어난 신체적 지구력이 필요하다."},{"en":"Her endurance during the long illness inspired everyone.","ko":"긴 투병 동안 보인 그녀의 인내는 모두에게 감동을 주었다."}],"grammarNote":"'endurance'는 셀 수 없는 명사로 관사 없이 쓰며, 동사 'endure'의 명사형이다. 'physical endurance'(체력), 'test of endurance'(인내의 시험)처럼 쓴다.","grammarQuiz":[{"sentence":"It is endurance _____ separates winners from losers.","ko":"승자와 패자를 구별짓는 것은 바로 인내이다.","answer":"that","hint":"It ~ that 강조구문"}]},
    {"id":"w02064","w":"endure","pos":["v"],"ph":"/ɪnˈdjʊər/","cefr":"B2","kr":["견디다","지속하다"],"ex":[{"en":"She endured years of hardship.","ko":"그녀는 수년간의 고난을 견뎌냈다."}],"mnemonic":{"soundHint":"'인듀어' → en(안에) + dure(단단히) = 단단히 견디다","story":"혹독한 훈련을 이 악물고 '인듀어' 견뎌내는 운동선수.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"withstand","ko":"견디다","reason":"동의어 — 버티다"},{"w":"tolerate","ko":"참다","reason":"유의어 — 참아냄"},{"w":"surrender","ko":"굴복하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"endure hardship","ko":"고난을 견디다"},{"en":"endure the pain","ko":"고통을 참다"}]},"nuance":{"koSimple":"어려움이나 고통을 참고 견뎌낸다는 뜻이다.","whenToUse":"오랜 시련·역경을 버텨낼 때 쓴다."},"krDetail":[{"ko":"견디다","explain":"힘든 것을 참고 버티다"},{"ko":"지속하다","explain":"오랫동안 계속되다"}],"usageExamples":[{"en":"The soldiers had to endure freezing temperatures for weeks.","ko":"군인들은 몇 주 동안 영하의 추위를 견뎌야 했다."},{"en":"Great works of art endure for centuries.","ko":"위대한 예술 작품은 수 세기 동안 지속된다."}],"grammarNote":"'endure'는 목적어를 취하면 '견디다'(타동사), 목적어 없이 쓰면 '지속되다'(자동사)로 뜻이 갈린다. 형용사 'enduring'은 '오래가는'을 뜻한다.","grammarQuiz":[{"sentence":"She had to endure _____ (wait) for hours in the cold.","ko":"그녀는 추위 속에서 몇 시간을 기다리는 것을 견뎌야 했다.","answer":"waiting","hint":"동명사 (endure + -ing)"}]},
    {"id":"w02067","w":"enforce","pos":["v"],"ph":"/ɪnˈfɔːrs/","cefr":"B2","kr":["시행하다","집행하다"],"ex":[{"en":"Police enforce the law.","ko":"경찰은 법을 집행한다."}],"mnemonic":{"soundHint":"'인포스' → en(강하게) + force(힘) = 강제로 시행","story":"교통경찰이 신호 위반을 '인포스' 단속하는 사거리.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"impose","ko":"부과하다","reason":"동의어 — 강제"},{"w":"implement","ko":"시행하다","reason":"유의어 — 집행"},{"w":"neglect","ko":"방치하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"enforce the law","ko":"법을 집행하다"},{"en":"enforce the rules","ko":"규칙을 시행하다"}]},"nuance":{"koSimple":"법·규칙을 실제로 지키게 강제한다는 뜻이다.","whenToUse":"경찰·기관이 법률을 집행할 때 쓴다."},"krDetail":[{"ko":"시행하다","explain":"규칙을 실제로 지키게 하다"},{"ko":"집행하다","explain":"법·명령을 실행에 옮기다"}],"usageExamples":[{"en":"The city strictly enforces its no-smoking rules.","ko":"그 시는 금연 규정을 엄격하게 시행한다."},{"en":"It is difficult to enforce laws that people ignore.","ko":"사람들이 무시하는 법을 집행하기는 어렵다."}],"grammarNote":"'enforce'는 법·규칙을 목적어로 취해 'enforce a law/rule'처럼 쓴다. '억지로 시키다'라는 뜻의 'force'와 달리, 규정을 지키게 만든다는 의미에 초점이 있다.","grammarQuiz":[{"sentence":"Traffic laws _____ (strictly enforce) in this city.","ko":"교통 법규가 이 도시에서 엄격하게 시행된다.","answer":"are strictly enforced","hint":"수동태 (현재)"}]},
    {"id":"w02068","w":"enforcement","pos":["n"],"ph":"/ɪnˈfɔːrsmənt/","cefr":"B2","kr":["집행","강화"],"ex":[{"en":"Law enforcement is essential.","ko":"법 집행은 필수적이다."}],"mnemonic":{"soundHint":"'인포스먼트' → enforce + ment = 집행","story":"'로우 인포스먼트' 문구가 새겨진 경찰 배지.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"execution","ko":"집행","reason":"동의어 — 시행"},{"w":"implementation","ko":"시행","reason":"유의어 — 실행"},{"w":"policing","ko":"단속","reason":"관련어 — 법 집행"}],"collocBest":[{"en":"law enforcement","ko":"법 집행"},{"en":"strict enforcement","ko":"엄격한 시행"}]},"nuance":{"koSimple":"법·규칙을 강제로 실행하는 집행 행위를 뜻한다.","whenToUse":"법 집행 기관의 활동이나 규제 시행을 말할 때 쓴다."},"krDetail":[{"ko":"집행","explain":"법·규칙을 실제로 시행함"},{"ko":"강화","explain":"더 엄격하게 지키게 함"}],"usageExamples":[{"en":"Strict enforcement of the rules improved workplace safety.","ko":"규정의 엄격한 집행이 작업장 안전을 개선했다."},{"en":"Law enforcement officers arrived at the scene quickly.","ko":"법 집행관들이 현장에 신속히 도착했다."}],"grammarNote":"'enforcement'는 동사 'enforce'의 명사형으로 셀 수 없이 쓴다. 'law enforcement'는 '법 집행(기관)'을 뜻하는 굳어진 표현이다.","grammarQuiz":[{"sentence":"So important is law enforcement _____ every society needs it.","ko":"법 집행이 너무나 중요해서 모든 사회가 그것을 필요로 한다.","answer":"that","hint":"so ~ that 도치"}]},
    {"id":"w02069","w":"engage","pos":["v"],"ph":"/ɪnˈɡeɪdʒ/","cefr":"B2","kr":["참여하다","관여하다"],"ex":[{"en":"Students engage in discussions.","ko":"학생들은 토론에 참여한다."}],"mnemonic":{"soundHint":"'인게이지' → 게이지(약혼반지) 끼우다 = 관여하다","story":"학생들이 열띤 토론에 '인게이지' 몰입하는 교실 풍경.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"participate","ko":"참여하다","reason":"동의어 — 관여"},{"w":"involve","ko":"관여시키다","reason":"유의어 — 끌어들임"},{"w":"disengage","ko":"물러나다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"engage in a discussion","ko":"토론에 참여하다"},{"en":"engage the audience","ko":"청중을 사로잡다"}]},"nuance":{"koSimple":"적극적으로 참여하거나 관심을 끈다는 뜻이다.","whenToUse":"토론·활동·관계 형성에 몰두할 때 쓴다."},"krDetail":[{"ko":"참여하다","explain":"어떤 일에 적극 나서 하다"},{"ko":"관여하다","explain":"일에 끼어들어 관계하다"}],"usageExamples":[{"en":"The teacher tried to engage every student in the lesson.","ko":"그 교사는 모든 학생을 수업에 참여시키려 했다."},{"en":"He refused to engage in the argument.","ko":"그는 그 논쟁에 관여하기를 거부했다."}],"grammarNote":"'engage in + 명사/동명사'(~에 참여하다)가 핵심 구문이다. 타동사로 'engage someone'(관심을 끌다·고용하다)처럼 쓰며, 'be engaged'는 '약혼한'을 뜻하기도 한다.","grammarQuiz":[{"sentence":"Students should be engaged _____ (learn) actively in class.","ko":"학생들은 수업에 적극적으로 참여하며 배워야 한다.","answer":"to learn","hint":"to부정사"}]},
    {"id":"w02075","w":"enhance","pos":["v"],"ph":"/ɪnˈhæns/","cefr":"B2","kr":["향상시키다","강화하다"],"ex":[{"en":"Exercise enhances your mood.","ko":"운동은 기분을 향상시킨다."}],"mnemonic":{"soundHint":"'인핸스' → en(더) + hance(high, 높이) = 향상시키다","story":"필터로 사진을 '인핸스' 보정해 색감이 살아나는 장면.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"improve","ko":"개선하다","reason":"동의어 — 좋게 함"},{"w":"boost","ko":"증진하다","reason":"동의어 — 끌어올림"},{"w":"diminish","ko":"감소시키다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"enhance performance","ko":"성능을 향상시키다"},{"en":"enhance the quality","ko":"품질을 강화하다"}]},"nuance":{"koSimple":"이미 있는 것의 가치나 질을 더 좋게 만든다는 뜻이다.","whenToUse":"성능·기분·품질을 한 단계 올릴 때 쓴다."},"krDetail":[{"ko":"향상시키다","explain":"질·수준을 더 좋게 하다"},{"ko":"강화하다","explain":"더 세거나 크게 하다"}],"usageExamples":[{"en":"Good lighting can greatly enhance a photograph.","ko":"좋은 조명은 사진을 크게 향상시킬 수 있다."},{"en":"The new software enhances the system's performance.","ko":"새 소프트웨어는 시스템의 성능을 강화한다."}],"grammarNote":"'enhance'는 이미 좋은 것을 '더 좋게 만들다'라는 뜻의 타동사로, 품질·가치·능력 등 긍정적 대상을 목적어로 취한다. 명사형은 'enhancement'이다.","grammarQuiz":[{"sentence":"The quality of the product _____ (enhance) significantly over the years.","ko":"그 제품의 품질은 수년에 걸쳐 상당히 향상되어 왔다.","answer":"has been enhanced","hint":"현재완료 수동태"}]},
    {"id":"w02082","w":"enrich","pos":["v"],"ph":"/ɪnˈrɪtʃ/","cefr":"B2","kr":["풍요롭게 하다","부유하게 하다"],"ex":[{"en":"Travel enriches your perspective.","ko":"여행은 관점을 풍요롭게 한다."}],"mnemonic":{"soundHint":"'인리치' → en(만들다) + rich(부유한) = 풍요롭게 하다","story":"여행이 인생 경험을 '인리치' 풍부하게 만들어주는 이야기.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"enhance","ko":"향상시키다","reason":"유의어 — 풍성하게"},{"w":"improve","ko":"개선하다","reason":"유의어 — 좋게 함"},{"w":"impoverish","ko":"빈곤하게 하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"enrich your life","ko":"삶을 풍요롭게 하다"},{"en":"enrich the soil","ko":"토양을 비옥하게 하다"}]},"nuance":{"koSimple":"내용이나 삶을 더 풍요롭고 값지게 만든다는 뜻이다.","whenToUse":"여행·독서가 경험과 지식을 넓혀 줄 때 쓴다."},"krDetail":[{"ko":"풍요롭게 하다","explain":"내용·삶을 더 풍부하게 하다"},{"ko":"부유하게 하다","explain":"재산을 늘려 부자로 만들다"}],"usageExamples":[{"en":"Learning a new language can enrich your life.","ko":"새로운 언어를 배우는 것은 당신의 삶을 풍요롭게 할 수 있다."},{"en":"Farmers add compost to enrich the soil.","ko":"농부들은 토양을 비옥하게 하려고 퇴비를 넣는다."}],"grammarNote":"접두사 'en-'이 'rich'에 붙어 '풍부하게 만들다'라는 타동사를 이룬다. 추상적으로 삶·경험을 풍부하게 하거나, 토양·물질을 비옥하게 한다는 뜻으로 두루 쓴다.","grammarQuiz":[{"sentence":"Reading books enriches your mind and helps you _____ (grow).","ko":"책을 읽는 것은 마음을 풍요롭게 하고 성장하도록 돕는다.","answer":"grow","hint":"5형식 (help + O + 동사원형)"}]},
    {"id":"w02083","w":"enroll","pos":["v"],"ph":"/ɪnˈroʊl/","cefr":"B2","kr":["등록하다","입학하다"],"ex":[{"en":"She enrolled in evening classes.","ko":"그녀는 저녁 수업에 등록했다."}],"mnemonic":{"soundHint":"'인롤' → en(안에) + roll(명단) = 명단에 올리다 = 등록하다","story":"저녁 요가 클래스에 '인롤' 등록하러 접수대로 향하는 장면.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"register","ko":"등록하다","reason":"동의어 — 명부 기재"},{"w":"sign up","ko":"신청하다","reason":"유의어 — 가입"},{"w":"withdraw","ko":"탈퇴하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"enroll in a course","ko":"강좌에 등록하다"},{"en":"enroll at a university","ko":"대학에 입학하다"}]},"nuance":{"koSimple":"명단에 이름을 올려 학교·강좌에 등록한다는 뜻이다.","whenToUse":"학교 입학이나 강좌 수강 신청을 말할 때 쓴다."},"krDetail":[{"ko":"등록하다","explain":"명단·강좌에 이름을 올리다"},{"ko":"입학하다","explain":"학교에 들어가 학생이 되다"}],"usageExamples":[{"en":"Over three hundred students enrolled in the course this year.","ko":"올해 삼백 명이 넘는 학생이 그 강좌에 등록했다."},{"en":"You need to enroll before the end of the month.","ko":"당신은 이달 말 전에 등록해야 한다."}],"grammarNote":"'enroll in + 과정/학교'(~에 등록·입학하다) 형태로 쓴다. 자동사·타동사 모두 가능하며, 영국식 철자는 'enrol'이고 명사형은 'enrollment'이다.","grammarQuiz":[{"sentence":"She _____ (enroll) in three online courses this year.","ko":"그녀는 올해 세 개의 온라인 강좌에 등록했다.","answer":"has enrolled","hint":"현재완료"}]},
    {"id":"w02084","w":"ensure","pos":["v"],"ph":"/ɪnˈʃʊər/","cefr":"B2","kr":["확실히 하다","보장하다"],"ex":[{"en":"Please ensure the door is locked.","ko":"문이 잠겼는지 확인해 주세요."}],"mnemonic":{"soundHint":"'인슈어' → sure(확실한) 앞에 en = 확실히 하다","story":"외출 전 문 잠금을 두 번씩 '인슈어' 확인하는 습관.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"guarantee","ko":"보장하다","reason":"동의어 — 확실히"},{"w":"secure","ko":"확보하다","reason":"유의어 — 지켜냄"},{"w":"assure","ko":"확언하다","reason":"혼동 주의 — 사람 안심시킴"}],"collocBest":[{"en":"ensure success","ko":"성공을 보장하다"},{"en":"ensure safety","ko":"안전을 확실히 하다"}]},"nuance":{"koSimple":"어떤 결과가 확실히 되도록 확보한다는 뜻이다.","whenToUse":"안전·성공·이행을 보장하려 할 때 쓴다."},"krDetail":[{"ko":"확실히 하다","explain":"틀림없이 되게 하다"},{"ko":"보장하다","explain":"꼭 그렇게 되도록 책임지다"}],"usageExamples":[{"en":"Please ensure that all windows are closed before leaving.","ko":"떠나기 전에 모든 창문이 닫혀 있는지 확실히 하세요."},{"en":"Regular checkups help ensure good health.","ko":"정기 검진은 건강을 확실히 지키는 데 도움이 된다."}],"grammarNote":"'ensure that + 절' 또는 'ensure + 명사' 형태로 쓴다. 보험 든다는 'insure'와 철자·뜻을 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"Please ensure that all doors _____ (lock) before leaving.","ko":"떠나기 전에 모든 문이 잠겨 있는지 확인해 주세요.","answer":"are locked","hint":"수동태 (현재)"}]},
    {"id":"w02085","w":"entangle","pos":["v"],"ph":"/ɪnˈtæŋɡəl/","cefr":"B2","kr":["얽히게 하다","말려들게 하다"],"ex":[{"en":"The rope became entangled in weeds.","ko":"밧줄이 잡초에 엉켰다."}],"mnemonic":{"soundHint":"'인탱글' → en(안에) + tangle(엉킴) = 얽히다","story":"이어폰 줄이 가방 안에서 '인탱글' 엉켜 풀기 힘든 장면.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"tangle","ko":"엉키게 하다","reason":"동의어 — 얽힘"},{"w":"trap","ko":"가두다","reason":"유의어 — 옭아맴"},{"w":"disentangle","ko":"풀다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"entangled in weeds","ko":"잡초에 얽힌"},{"en":"entangled in a scandal","ko":"스캔들에 말려든"}]},"nuance":{"koSimple":"실·상황이 복잡하게 얽히거나 말려든다는 뜻이다.","whenToUse":"밧줄이 엉키거나 문제에 휘말릴 때 쓴다."},"krDetail":[{"ko":"얽히게 하다","explain":"실·줄이 서로 엉키게 하다"},{"ko":"말려들게 하다","explain":"복잡한 일에 끌어들이다"}],"usageExamples":[{"en":"A whale can become entangled in fishing nets.","ko":"고래는 어망에 얽힐 수 있다."},{"en":"He got entangled in a legal dispute over the land.","ko":"그는 그 땅을 둘러싼 법적 분쟁에 말려들었다."}],"grammarNote":"'entangle'은 흔히 수동태 'become/get entangled in ~'(~에 얽히다·말려들다) 형태로 쓴다. 접두사 'en-'과 'tangle'(엉키다)이 합쳐진 단어이다.","grammarQuiz":[{"sentence":"The rope _____ (entangle) in the branches, making it impossible to move.","ko":"밧줄이 나뭇가지에 얽혀 움직일 수 없게 되었다.","answer":"was entangled","hint":"수동태 (과거)"}]},
    {"id":"w02087","w":"enterprise","pos":["n"],"ph":"/ˈɛntərpraɪz/","cefr":"B2","kr":["기업","사업"],"ex":[{"en":"She started her own enterprise.","ko":"그녀는 자신의 사업을 시작했다."}],"mnemonic":{"soundHint":"'엔터프라이즈' → 스타트렉 우주선 이름, 대기업","story":"차고에서 시작해 거대한 '엔터프라이즈'로 성장한 회사.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"business","ko":"사업","reason":"동의어 — 기본형"},{"w":"venture","ko":"모험적 사업","reason":"유의어 — 신규 사업"},{"w":"company","ko":"회사","reason":"유의어 — 조직체"}],"collocBest":[{"en":"a small enterprise","ko":"소기업"},{"en":"a private enterprise","ko":"민간 기업"}]},"nuance":{"koSimple":"규모 있는 사업체나 도전적인 사업을 뜻한다.","whenToUse":"기업 활동이나 새로운 사업 시도를 말할 때 쓴다."},"krDetail":[{"ko":"기업","explain":"이익을 위해 사업하는 조직"},{"ko":"사업","explain":"계획해서 벌이는 일·모험적 일"}],"usageExamples":[{"en":"Small enterprises create most of the new jobs in the region.","ko":"소규모 기업들이 그 지역 신규 일자리의 대부분을 만든다."},{"en":"Launching a magazine was a risky enterprise.","ko":"잡지를 창간하는 것은 위험한 사업이었다."}],"grammarNote":"'enterprise'는 '기업'(셀 수 있는 명사)과 '진취적 기상·모험적 사업'의 뜻을 모두 가진다. 'private/state enterprise'(민간·국영 기업), 'free enterprise'(자유 기업 경제)가 흔한 연어이다.","grammarQuiz":[{"sentence":"It was her small enterprise _____ eventually became a global company.","ko":"결국 글로벌 회사가 된 것은 바로 그녀의 작은 사업이었다.","answer":"that","hint":"It ~ that 강조구문"}]},
    {"id":"w02090","w":"enthusiasm","pos":["n"],"ph":"/ɪnˈθjuːziæzəm/","cefr":"B2","kr":["열정","열의"],"ex":[{"en":"She works with great enthusiasm.","ko":"그녀는 큰 열정으로 일한다."}],"mnemonic":{"soundHint":"'인쑤지애즘' → en(안에) + theos(신, 신들림) = 신들린 열정","story":"첫 출근에 '인쑤지애즘' 넘쳐 아침 일찍 사무실 도착.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"passion","ko":"열정","reason":"동의어 — 뜨거운 마음"},{"w":"zeal","ko":"열의","reason":"동의어 — 격식체"},{"w":"apathy","ko":"무관심","reason":"반의어 — 정반대"}],"collocBest":[{"en":"show enthusiasm","ko":"열정을 보이다"},{"en":"with great enthusiasm","ko":"큰 열의로"}]},"nuance":{"koSimple":"어떤 대상에 강하게 몰입하는 열정을 뜻한다.","whenToUse":"일·취미에 뜨겁게 몰두하는 태도를 표현할 때 쓴다."},"krDetail":[{"ko":"열정","explain":"몹시 좋아해 몰두하는 마음"},{"ko":"열의","explain":"적극적으로 하려는 의욕"}],"usageExamples":[{"en":"The crowd cheered the team with great enthusiasm.","ko":"관중은 큰 열정으로 그 팀을 응원했다."},{"en":"She spoke about the project with genuine enthusiasm.","ko":"그녀는 진심 어린 열의를 가지고 그 프로젝트에 대해 말했다."}],"grammarNote":"'enthusiasm'은 셀 수 없는 명사로, 'enthusiasm for + 명사'(~에 대한 열정) 형태로 쓴다. 'with enthusiasm'은 '열정적으로'라는 부사구로 자주 쓰인다.","grammarQuiz":[{"sentence":"Her enthusiasm _____ (inspire) many students over the years.","ko":"그녀의 열정은 수년에 걸쳐 많은 학생들에게 영감을 주어 왔다.","answer":"has inspired","hint":"현재완료"}]},
    {"id":"w02091","w":"enthusiast","pos":["n"],"ph":"/ɪnˈθjuːziæst/","cefr":"B2","kr":["열성팬","열광자"],"ex":[{"en":"He is a sports enthusiast who never misses a game.","ko":"그는 경기를 절대 놓치지 않는 스포츠 열성팬이다."}],"mnemonic":{"soundHint":"'인쑤지애스트' → enthusiasm + ast(사람) = 열성팬","story":"매경기 티켓을 사는 축구 '인쑤지애스트' 팬.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"fan","ko":"팬","reason":"동의어 — 애호가"},{"w":"devotee","ko":"열성 애호가","reason":"유의어 — 헌신자"},{"w":"critic","ko":"비판자","reason":"반의어 — 정반대"}],"collocBest":[{"en":"a sports enthusiast","ko":"스포츠 열성팬"},{"en":"a car enthusiast","ko":"자동차 열광자"}]},"nuance":{"koSimple":"특정 분야에 열정을 쏟는 열성적 애호가다.","whenToUse":"스포츠·음악·자동차 마니아를 지칭할 때 쓴다."},"krDetail":[{"ko":"열성팬","explain":"무언가를 아주 좋아하는 사람"},{"ko":"열광자","explain":"어떤 일에 열중하는 사람"}],"usageExamples":[{"en":"As a car enthusiast, he spends weekends at the garage.","ko":"자동차 열성팬으로서, 그는 주말을 정비소에서 보낸다."},{"en":"The club welcomes photography enthusiasts of all ages.","ko":"그 동호회는 모든 연령의 사진 애호가를 환영한다."}],"grammarNote":"'enthusiast'는 사람을 가리키는 셀 수 있는 명사로, 흔히 '분야 + enthusiast'(예: sports enthusiast) 형태로 취미·관심 분야를 앞에 붙여 쓴다.","grammarQuiz":[{"sentence":"The enthusiast, _____ passion for cars was legendary, collected rare models.","ko":"자동차에 대한 열정이 전설적이었던 그 열성팬은 희귀 모델을 수집했다.","answer":"whose","hint":"관계대명사 (소유격)"}]},
    {"id":"w02092","w":"enthusiastic","pos":["adj"],"ph":"/ɪnˌθjuːziˈæstɪk/","cefr":"B2","kr":["열정적인","열렬한"],"ex":[{"en":"He is enthusiastic about cooking.","ko":"그는 요리에 열정적이다."}],"mnemonic":{"soundHint":"'인쑤지애스틱' → enthusiasm + tic = 열정적인","story":"요리 방송을 보며 눈을 반짝이는 '인쑤지애스틱'한 아이.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"eager","ko":"열망하는","reason":"동의어 — 간절한"},{"w":"passionate","ko":"열정적인","reason":"동의어 — 뜨거운"},{"w":"indifferent","ko":"무관심한","reason":"반의어 — 정반대"}],"collocBest":[{"en":"enthusiastic about cooking","ko":"요리에 열정적인"},{"en":"an enthusiastic response","ko":"열렬한 반응"}]},"nuance":{"koSimple":"어떤 일에 열정적이고 적극적인 태도를 뜻한다.","whenToUse":"취미·목표에 열의를 보이는 모습을 표현할 때 쓴다."},"krDetail":[{"ko":"열정적인","explain":"열정이 넘치는"},{"ko":"열렬한","explain":"매우 적극적이고 강한"}],"usageExamples":[{"en":"The students were enthusiastic about the field trip.","ko":"학생들은 현장 학습에 열정적이었다."},{"en":"We received an enthusiastic response from the audience.","ko":"우리는 청중으로부터 열렬한 반응을 받았다."}],"grammarNote":"'be enthusiastic about + 명사/동명사'(~에 열정적이다)가 핵심 구문이다. 명사는 'enthusiasm', 부사는 'enthusiastically'로 파생된다.","grammarQuiz":[{"sentence":"_____ (be) enthusiastic about the project, he worked overtime every day.","ko":"그 프로젝트에 열정적이었기에, 그는 매일 야근을 했다.","answer":"Being","hint":"분사구문"}]},
    {"id":"w02095","w":"entitle","pos":["v"],"ph":"/ɪnˈtaɪtəl/","cefr":"B2","kr":["권리를 주다","~라는 제목을 붙이다"],"ex":[{"en":"You are entitled to a refund.","ko":"당신은 환불 받을 권리가 있다."}],"mnemonic":{"soundHint":"'인타이틀' → en(주다) + title(자격, 제목) = 자격을 주다","story":"구매 영수증이 환불 받을 권리를 '인타이틀' 부여함.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"authorize","ko":"권한을 주다","reason":"유의어 — 자격 부여"},{"w":"qualify","ko":"자격을 주다","reason":"유의어 — 조건 충족"},{"w":"name","ko":"제목 붙이다","reason":"관련어 — 다른 뜻"}],"collocBest":[{"en":"entitled to a refund","ko":"환불받을 권리가 있는"},{"en":"entitled to compensation","ko":"보상받을 자격이 있는"}]},"nuance":{"koSimple":"권리를 부여하거나 제목을 붙인다는 뜻이다.","whenToUse":"환불·할인 자격을 주거나 책 제목을 정할 때 쓴다."},"krDetail":[{"ko":"권리를 주다","explain":"무언가 받을 자격을 주다"},{"ko":"~라는 제목을 붙이다","explain":"책·글에 제목을 달다"}],"usageExamples":[{"en":"This ticket entitles you to a free drink.","ko":"이 표는 당신에게 무료 음료 한 잔을 받을 권리를 준다."},{"en":"She entitled her memoir \"A Long Way Home.\"","ko":"그녀는 자신의 회고록에 '집으로 가는 먼 길'이라는 제목을 붙였다."}],"grammarNote":"'entitle + 사람 + to + 명사/부정사'(~에게 …할 자격을 주다) 구문으로 쓰며, 수동태 'be entitled to ~'(~할 자격이 있다)가 특히 흔하다. 'be entitled + 제목'은 '~라는 제목이다'라는 뜻이다.","grammarQuiz":[{"sentence":"Customers are entitled _____ (receive) a full refund within 30 days.","ko":"고객들은 30일 이내에 전액 환불을 받을 자격이 있다.","answer":"to receive","hint":"to부정사"}]},
    {"id":"w02099","w":"entrepreneur","pos":["n"],"ph":"/ˌɒntrəprəˈnɜːr/","cefr":"B2","kr":["기업가","창업가"],"ex":[{"en":"She is a successful entrepreneur.","ko":"그녀는 성공한 기업가이다."}],"mnemonic":{"soundHint":"'앙트러프러너' → 프랑스어에서 옴, 사업가","story":"20대에 스타트업을 세운 젊은 '앙트러프러너'의 성공기.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"founder","ko":"창업자","reason":"동의어 — 설립자"},{"w":"businessman","ko":"사업가","reason":"유의어 — 경영자"},{"w":"innovator","ko":"혁신가","reason":"관련어 — 새 시도자"}],"collocBest":[{"en":"a successful entrepreneur","ko":"성공한 기업가"},{"en":"a young entrepreneur","ko":"젊은 창업가"}]},"nuance":{"koSimple":"위험을 감수해 새 사업을 세우는 창업가를 뜻한다.","whenToUse":"스타트업 창업자나 사업 개척자를 말할 때 쓴다."},"krDetail":[{"ko":"기업가","explain":"사업을 일으켜 경영하는 사람"},{"ko":"창업가","explain":"위험을 무릅쓰고 사업을 시작하는 사람"}],"usageExamples":[{"en":"Many young entrepreneurs start companies right after college.","ko":"많은 젊은 창업가들이 대학 졸업 직후 회사를 창업한다."},{"en":"The entrepreneur invested all her savings in the startup.","ko":"그 기업가는 자신의 저축 전부를 그 신생 기업에 투자했다."}],"grammarNote":"'entrepreneur'는 프랑스어에서 온 단어로 철자에 주의해야 하며, 형용사 'entrepreneurial'(기업가적인), 명사 'entrepreneurship'(기업가 정신)으로 파생된다.","grammarQuiz":[{"sentence":"The entrepreneur _____ (start) her company at the age of 25 is now a millionaire.","ko":"25세에 회사를 시작한 그 기업가는 지금 백만장자다.","answer":"who started","hint":"관계대명사 (주격)"}]},
    {"id":"w02103","w":"enumerate","pos":["v"],"ph":"/ɪˈnjuːməreɪt/","cefr":"B2","kr":["열거하다","하나씩 세다"],"ex":[{"en":"Please enumerate your main points.","ko":"주요 논점들을 열거해 주세요."}],"mnemonic":{"soundHint":"'이뉴머레이트' → e(밖으로) + number(숫자) = 하나씩 세다","story":"발표에서 요점을 하나 둘 셋 '이뉴머레이트' 열거하는 장면.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"list","ko":"열거하다","reason":"동의어 — 나열"},{"w":"count","ko":"세다","reason":"유의어 — 하나씩"},{"w":"specify","ko":"명시하다","reason":"유의어 — 구체화"}],"collocBest":[{"en":"enumerate the reasons","ko":"이유를 열거하다"},{"en":"enumerate the benefits","ko":"이점을 하나씩 세다"}]},"nuance":{"koSimple":"항목을 하나씩 순서대로 헤아려 나열한다는 뜻이다.","whenToUse":"논점·이유·목록을 조목조목 열거할 때 쓴다."},"krDetail":[{"ko":"열거하다","explain":"하나하나 늘어놓아 말하다"},{"ko":"하나씩 세다","explain":"차례대로 하나하나 세다"}],"usageExamples":[{"en":"The manual enumerates the steps for setting up the device.","ko":"그 설명서는 장치 설치 단계를 하나하나 열거한다."},{"en":"She enumerated the reasons for her decision one by one.","ko":"그녀는 자기 결정의 이유들을 하나씩 열거했다."}],"grammarNote":"'enumerate'는 목록을 조목조목 나열한다는 뜻의 타동사로, 'list'보다 격식 있는 표현이다. 명사형은 'enumeration'이다.","grammarQuiz":[{"sentence":"The teacher asked the students _____ (enumerate) the causes of the war.","ko":"선생님은 학생들에게 전쟁의 원인을 열거하라고 요청했다.","answer":"to enumerate","hint":"5형식 (ask + O + to부정사)"}]},
    {"id":"w02104","w":"envelop","pos":["v"],"ph":"/ɪnˈvɛləp/","cefr":"B2","kr":["뒤덮다","감싸다"],"ex":[{"en":"Fog enveloped the entire city.","ko":"안개가 도시 전체를 뒤덮었다."}],"mnemonic":{"soundHint":"인벨럽 → 인(in) 벨(bell)을 럽(wrap)으로","story":"안(in)에 있는 벨(bell)을 랩(wrap)으로 감싸 뒤덮다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"wrap","ko":"감싸다","reason":"동의어 — 둘러쌈"},{"w":"surround","ko":"에워싸다","reason":"동의어 — 둘러싸다"},{"w":"envelope","ko":"봉투","reason":"혼동 주의 — 철자 유사"}],"collocBest":[{"en":"envelop in darkness","ko":"어둠에 감싸다"},{"en":"envelop the city","ko":"도시를 뒤덮다"}]},"nuance":{"koSimple":"무언가를 완전히 감싸거나 뒤덮어 안이 안 보이게 만드는 동작","whenToUse":"안개·연기·어둠·감정이 대상을 완전히 뒤덮을 때 사용"},"krDetail":[{"ko":"뒤덮다","explain":"온통 감싸 덮다"},{"ko":"감싸다","explain":"빙 둘러싸다"}],"usageExamples":[{"en":"Thick smoke enveloped the burning building.","ko":"짙은 연기가 불타는 건물을 뒤덮었다."},{"en":"A sense of calm enveloped the quiet valley.","ko":"고요한 계곡을 평온함이 감쌌다."}],"grammarNote":"동사 'envelop'(끝이 p, 뒤덮다)과 명사 'envelope'(끝이 e, 봉투)는 철자와 강세가 다르므로 구별해야 한다. 흔히 수동태 'be enveloped in ~' 형태로 쓴다.","grammarQuiz":[{"sentence":"The mountain _____ enveloped in thick clouds every winter.","ko":"그 산은 매년 겨울마다 두꺼운 구름에 뒤덮인다.","answer":"is","hint":"수동태 현재 (be동사 + p.p.)"}]},
    {"id":"w02108","w":"envision","pos":["v"],"ph":"/ɪnˈvɪʒən/","cefr":"B2","kr":["상상하다","마음속에 그리다"],"ex":[{"en":"She envisioned a brighter future.","ko":"그녀는 더 밝은 미래를 상상했다."}],"mnemonic":{"soundHint":"인비전 → in + vision(비전)","story":"머릿속에 vision(비전)을 넣어(in) 미래를 상상하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"imagine","ko":"상상하다","reason":"동의어 — 그려봄"},{"w":"visualize","ko":"시각화하다","reason":"동의어 — 머리에 그림"},{"w":"foresee","ko":"예견하다","reason":"유의어 — 미리 봄"}],"collocBest":[{"en":"envision a future","ko":"미래를 상상하다"},{"en":"envision success","ko":"성공을 그리다"}]},"nuance":{"koSimple":"미래의 모습이나 이상을 머릿속에 구체적으로 그려 보는 행위","whenToUse":"비전·목표·미래 계획을 마음속에 그릴 때 자주 쓰인다"},"krDetail":[{"ko":"상상하다","explain":"머릿속에 그려 보다"},{"ko":"마음속에 그리다","explain":"장래 모습을 떠올리다"}],"usageExamples":[{"en":"The architect envisioned a city full of green spaces.","ko":"그 건축가는 녹지로 가득한 도시를 마음속에 그렸다."},{"en":"It is hard to envision what life will be like in 2100.","ko":"2100년의 삶이 어떨지 상상하기는 어렵다."}],"grammarNote":"'envision'은 주로 미래·이상적 모습을 그려 본다는 뜻의 타동사로, 뒤에 명사나 'envision + 동명사'가 온다. 'imagine'보다 계획적·구체적 미래상을 그릴 때 자주 쓴다.","grammarQuiz":[{"sentence":"She wants _____ envision a better future for her children.","ko":"그녀는 자녀들을 위한 더 나은 미래를 상상하기를 원한다.","answer":"to","hint":"to부정사 (want의 목적어)"}]},
    {"id":"w02109","w":"envy","pos":["n","v"],"ph":"/ˈɛnvi/","cefr":"B2","kr":["부러움","시기하다"],"ex":[{"en":"She felt envy towards him.","ko":"그녀는 그에 대한 부러움을 느꼈다."}],"mnemonic":{"soundHint":"엔비 → N.V. 명품(brand)이 부러워","story":"친구가 NV 명품을 자랑해서 부러움이 폭발.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"jealousy","ko":"질투","reason":"동의어 — 시기심"},{"w":"covet","ko":"탐내다","reason":"유의어 — 갈망"},{"w":"admire","ko":"존경하다","reason":"반의어 — 긍정 감정"}],"collocBest":[{"en":"feel envy","ko":"부러움을 느끼다"},{"en":"green with envy","ko":"부러워서 시기하는"}]},"nuance":{"koSimple":"남이 가진 것을 부러워하며 갖고 싶어 하는 복잡한 감정","whenToUse":"타인의 성공·재능·소유를 부럽게 여길 때 사용한다"},"krDetail":[{"ko":"부러움","explain":"남의 것을 갖고 싶은 마음"},{"ko":"시기하다","explain":"남을 부러워하며 샘내다"}],"usageExamples":[{"en":"Her new car filled her neighbors with envy.","ko":"그녀의 새 차는 이웃들을 부러움으로 가득 채웠다."},{"en":"I envy people who can fall asleep so easily.","ko":"나는 그렇게 쉽게 잠드는 사람들이 부럽다."}],"grammarNote":"'envy'는 명사(부러움)와 동사(부러워하다) 둘 다로 쓰이며, 동사일 때 'envy + 사람 + 사물'(~의 …을 부러워하다) 형태의 4형식이 가능하다. 형용사는 'envious'이다.","grammarQuiz":[{"sentence":"_____ others' achievements is unhealthy for the mind.","ko":"다른 사람의 성취를 부러워하는 것은 정신 건강에 해롭다.","answer":"Envying","hint":"동명사 주어"}]},
    {"id":"w02112","w":"epidemic","pos":["n","adj"],"ph":"/ˌɛpɪˈdɛmɪk/","cefr":"B2","kr":["전염병","유행병"],"ex":[{"en":"The epidemic spread quickly.","ko":"전염병이 빠르게 퍼졌다."}],"mnemonic":{"soundHint":"에피데믹 → 에피소드 + demic(사람들)","story":"사람들 사이에 에피소드처럼 순식간에 퍼지는 전염병.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"pandemic","ko":"세계적 유행병","reason":"유의어 — 더 광범위"},{"w":"outbreak","ko":"발발","reason":"유의어 — 발생"},{"w":"endemic","ko":"풍토병","reason":"혼동 주의 — 상시 지역병"}],"collocBest":[{"en":"global epidemic","ko":"세계적 전염병"},{"en":"spread of the epidemic","ko":"전염병의 확산"}]},"nuance":{"koSimple":"특정 지역에서 빠르게 퍼지는 전염성 강한 질병이나 현상","whenToUse":"질병 유행이나 사회적 문제가 급속히 확산될 때 사용"},"krDetail":[{"ko":"전염병","explain":"널리 빠르게 퍼지는 병"},{"ko":"유행병","explain":"한때 크게 도는 병"}],"usageExamples":[{"en":"The flu epidemic forced many schools to close.","ko":"독감 유행병으로 많은 학교가 문을 닫아야 했다."},{"en":"Experts warned about the rapid spread of the epidemic.","ko":"전문가들은 그 전염병의 빠른 확산에 대해 경고했다."}],"grammarNote":"'epidemic'은 명사(전염병)와 형용사(유행성의) 둘 다로 쓴다. 한 지역의 'epidemic'이 전 세계로 번지면 'pandemic'이라 부른다.","grammarQuiz":[{"sentence":"The epidemic _____ caused panic has finally been contained.","ko":"공포를 일으켰던 그 전염병이 마침내 억제되었다.","answer":"that","hint":"주격 관계대명사 (사물)"}]},
    {"id":"w02116","w":"equality","pos":["n"],"ph":"/ɪˈkwɒlɪti/","cefr":"B2","kr":["평등","동등"],"ex":[{"en":"We fight for equality.","ko":"우리는 평등을 위해 싸운다."}],"mnemonic":{"soundHint":"이퀄리티 → equal(같은) + ity","story":"equal(같음)의 명사 형태 = 평등.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"fairness","ko":"공정","reason":"유의어 — 균등"},{"w":"equity","ko":"형평","reason":"유의어 — 공평"},{"w":"inequality","ko":"불평등","reason":"반의어 — 정반대"}],"collocBest":[{"en":"gender equality","ko":"성 평등"},{"en":"fight for equality","ko":"평등을 위해 싸우다"}]},"nuance":{"koSimple":"모든 사람이 동등한 권리와 대우를 받는 공정한 상태","whenToUse":"인권·성·기회의 평등을 강조해서 말할 때 쓰인다"},"krDetail":[{"ko":"평등","explain":"차별 없이 똑같이 대함"},{"ko":"동등","explain":"지위·정도가 서로 같음"}],"usageExamples":[{"en":"The movement fought for racial equality.","ko":"그 운동은 인종 평등을 위해 싸웠다."},{"en":"Gender equality remains an important goal worldwide.","ko":"성 평등은 전 세계적으로 여전히 중요한 목표이다."}],"grammarNote":"'equality'는 셀 수 없는 명사로, 'equality of opportunity' 또는 'gender/racial equality'처럼 앞에 분야를 붙여 쓴다. 반대말은 'inequality'(불평등)이다.","grammarQuiz":[{"sentence":"Their goal is _____ promote equality in the workplace.","ko":"그들의 목표는 직장 내 평등을 증진하는 것이다.","answer":"to","hint":"to부정사 (보어)"}]},
    {"id":"w02118","w":"equate","pos":["v"],"ph":"/ɪˈkweɪt/","cefr":"B2","kr":["동일시하다","같게 보다"],"ex":[{"en":"Don't equate wealth with happiness.","ko":"부와 행복을 동일시하지 마라."}],"mnemonic":{"soundHint":"이퀘잇 → equal의 동사","story":"두 개를 equal(같게) 놓다 = 동일시하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"compare","ko":"비교하다","reason":"유의어 — 견줌"},{"w":"identify","ko":"동일시하다","reason":"유의어 — 같게 봄"},{"w":"distinguish","ko":"구별하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"equate money with happiness","ko":"돈을 행복과 동일시하다"},{"en":"equate success with wealth","ko":"성공을 부와 같게 보다"}]},"nuance":{"koSimple":"서로 다른 두 대상을 같은 것으로 여기거나 견주는 행위","whenToUse":"두 개념·가치·현상을 동일하게 볼 때 자주 사용한다"},"krDetail":[{"ko":"동일시하다","explain":"같은 것으로 여기다"},{"ko":"같게 보다","explain":"둘을 똑같다고 보다"}],"usageExamples":[{"en":"People often equate money with success.","ko":"사람들은 흔히 돈을 성공과 동일시한다."},{"en":"We should not equate silence with agreement.","ko":"우리는 침묵을 동의와 같게 보아서는 안 된다."}],"grammarNote":"'equate A with B'(A를 B와 동일시하다)가 핵심 구문이다. 명사형은 'equation', 형용사는 'equal'로 파생된다.","grammarQuiz":[{"sentence":"If you _____ money with success, you would miss the point.","ko":"돈을 성공과 동일시한다면, 요점을 놓칠 것이다.","answer":"equated","hint":"가정법 과거 (if + 과거동사)"}]},
    {"id":"w02119","w":"equation","pos":["n"],"ph":"/ɪˈkweɪʒən/","cefr":"B2","kr":["방정식","등식"],"ex":[{"en":"Solve the equation for x.","ko":"x에 대한 방정식을 풀어라."}],"mnemonic":{"soundHint":"이퀘이션 → equal(=)이 든 식","story":"등호(=)가 있는 식이 방정식(equation).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"formula","ko":"공식","reason":"유의어 — 수식"},{"w":"calculation","ko":"계산","reason":"관련어 — 연산"},{"w":"identity","ko":"항등식","reason":"관련어 — 수학 용어"}],"collocBest":[{"en":"solve an equation","ko":"방정식을 풀다"},{"en":"balance the equation","ko":"등식을 균형 맞추다"}]},"nuance":{"koSimple":"양쪽 값이 같음을 나타내는 수학적 표현이나 관계식","whenToUse":"수학 문제나 두 요소의 관계를 논리적으로 설명할 때"},"krDetail":[{"ko":"방정식","explain":"미지수를 구하는 수식"},{"ko":"등식","explain":"양쪽이 같음을 나타낸 식"}],"usageExamples":[{"en":"Students learned how to balance a chemical equation.","ko":"학생들은 화학 반응식의 균형을 맞추는 법을 배웠다."},{"en":"Cost is an important part of the equation.","ko":"비용은 그 문제에서 중요한 부분이다."}],"grammarNote":"'equation'은 수학·화학의 '방정식·등식'을 뜻하는 셀 수 있는 명사이다. 'part of the equation'처럼 '고려해야 할 요소'라는 비유적 표현으로도 쓴다.","grammarQuiz":[{"sentence":"The equation _____ he wrote on the board confused everyone.","ko":"그가 칠판에 쓴 방정식이 모두를 혼란스럽게 했다.","answer":"that","hint":"목적격 관계대명사"}]},
    {"id":"w02122","w":"equip","pos":["v"],"ph":"/ɪˈkwɪp/","cefr":"B2","kr":["갖추다","장비하다"],"ex":[{"en":"The school is well equipped.","ko":"학교는 잘 갖춰져 있다."}],"mnemonic":{"soundHint":"이큅 → equipment(장비)의 어원","story":"equipment(장비)를 학교에 갖춰(equip) 놓다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"furnish","ko":"비치하다","reason":"동의어 — 갖춰줌"},{"w":"supply","ko":"공급하다","reason":"유의어 — 제공"},{"w":"prepare","ko":"준비시키다","reason":"유의어 — 대비"}],"collocBest":[{"en":"equip with tools","ko":"도구를 갖추다"},{"en":"fully equipped","ko":"완전히 갖춰진"}]},"nuance":{"koSimple":"필요한 장비나 능력을 미리 갖추어 준비시키는 행위","whenToUse":"시설·인력에 도구나 기술을 갖춰 줄 때 사용한다"},"krDetail":[{"ko":"갖추다","explain":"필요한 것을 마련해 두다"},{"ko":"장비하다","explain":"장비를 달거나 채우다"}],"usageExamples":[{"en":"The lab is equipped with the latest computers.","ko":"그 실험실은 최신 컴퓨터를 갖추고 있다."},{"en":"Training equips workers with the skills they need.","ko":"교육은 근로자들에게 필요한 기술을 갖추게 한다."}],"grammarNote":"'equip A with B'(A에 B를 갖추다) 구문으로 쓰며, 흔히 수동태 'be equipped with ~' 형태로 나온다. 자음 p를 겹쳐 'equipped, equipping'으로 활용하고 명사형은 'equipment'이다.","grammarQuiz":[{"sentence":"The soldiers _____ equipped with the latest gear.","ko":"군인들은 최신 장비로 갖추어졌다.","answer":"were","hint":"수동태 과거 (be + p.p.)"}]},

    {"id":"w02127","w":"era","pos":["n"],"ph":"/ˈɪərə/","cefr":"B2","kr":["시대","시기"],"ex":[{"en":"We live in the digital era.","ko":"우리는 디지털 시대에 살고 있다."}],"mnemonic":{"soundHint":"이러 → 이어러(이어지는) 시대","story":"시대(era)들은 이어져(이러) 흐른다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"age","ko":"시대","reason":"동의어 — 기본형"},{"w":"epoch","ko":"시대","reason":"동의어 — 격식체"},{"w":"period","ko":"시기","reason":"유의어 — 기간"}],"collocBest":[{"en":"digital era","ko":"디지털 시대"},{"en":"new era","ko":"새로운 시대"}]},"nuance":{"koSimple":"특징적인 사건이나 흐름으로 구분되는 상당히 긴 시대","whenToUse":"역사적 시대나 문명의 큰 변화 시기를 언급할 때"},"krDetail":[{"ko":"시대","explain":"특징으로 구분되는 긴 기간"},{"ko":"시기","explain":"어떤 일이 이어지는 때"}],"usageExamples":[{"en":"The invention of the internet began a new era.","ko":"인터넷의 발명은 새로운 시대를 열었다."},{"en":"We are living in an era of rapid technological change.","ko":"우리는 빠른 기술 변화의 시대에 살고 있다."}],"grammarNote":"'era'는 뚜렷한 특징으로 구분되는 시대를 뜻하는 셀 수 있는 명사로, 'a new era', 'the digital era'처럼 관사와 함께 쓴다. 비슷한 'period'보다 역사적·상징적 뉘앙스가 강하다.","grammarQuiz":[{"sentence":"The era _____ we live in demands constant innovation.","ko":"우리가 살고 있는 시대는 끊임없는 혁신을 요구한다.","answer":"that","hint":"목적격 관계대명사"}]},

    {"id":"w02160","w":"evaluate","pos":["v"],"ph":"/ɪˈvæljueɪt/","cefr":"B2","kr":["평가하다","검토하다"],"ex":[{"en":"Teachers evaluate student work.","ko":"교사들은 학생 과제를 평가한다."}],"mnemonic":{"soundHint":"이밸류에잇 → e + value(가치) + ate","story":"value(가치)를 매기는 행동 = 평가하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"assess","ko":"평가하다","reason":"동의어 — 사정하다"},{"w":"appraise","ko":"감정하다","reason":"동의어 — 격식체"},{"w":"judge","ko":"판단하다","reason":"관련어 — 가치 판단"}],"collocBest":[{"en":"evaluate the results","ko":"결과를 평가하다"},{"en":"evaluate performance","ko":"성과를 검토하다"}]},"nuance":{"koSimple":"대상의 가치·성과·품질을 꼼꼼히 살펴 판단하는 행위","whenToUse":"성적·업무·정책의 성과를 판정하고 검토할 때 쓴다"},"krDetail":[{"ko":"평가하다","explain":"가치·수준을 판단하다"},{"ko":"검토하다","explain":"따져서 살펴보다"}],"usageExamples":[{"en":"We need to evaluate the results before deciding.","ko":"결정하기 전에 우리는 그 결과를 평가할 필요가 있다."},{"en":"The doctor evaluated the patient's condition carefully.","ko":"의사는 환자의 상태를 신중히 검토했다."}],"grammarNote":"타동사로 assess와 유사하며 격식체에서 자주 쓰인다. evaluate how/whether절도 가능하다. 명사형은 evaluation.","grammarQuiz":[{"sentence":"The committee needs _____ evaluate each proposal fairly and objectively.","ko":"위원회는 각 제안을 공정하고 객관적으로 평가할 필요가 있다.","answer":"to","hint":"to부정사 (need의 목적어)"}]},
