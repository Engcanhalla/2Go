    {"id":"u08488","w":"weep","pos":["verb"],"ph":"/wiːp/","cefr":"B2","kr":["울다"],"ex":[{"en":"The children began to weep silently when they heard the sad news about their dog.","ko":"아이들은 강아지에 관한 슬픈 소식을 듣고 조용히 울기 시작했다."}],"mnemonic":{"soundHint":"위프 → 위(위쪽)+프(눈물이 프)","story":"눈 위(위)에서 눈물이 프! 쏟아지듯 '울다' weep.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"cry","ko":"울다","reason":"동의어 — 흔한 말"},{"w":"sob","ko":"흐느끼다","reason":"유의어 — 격하게 울다"},{"w":"laugh","ko":"웃다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"weep with joy","ko":"기뻐서 울다"},{"en":"weep bitterly","ko":"서럽게 울다"}]},"nuance":{"koSimple":"슬픔에 겨워 조용히 눈물을 흘림","whenToUse":"깊은 슬픔·감동으로 우는 상황 서술"},"krDetail":[{"ko":"울다","explain":"눈물을 흘리다"}],"usageExamples":[{"en":"She began to weep quietly when she read the farewell letter.","ko":"그녀는 작별 편지를 읽고 조용히 울기 시작했다."},{"en":"Many people wept openly at the funeral of the beloved leader.","ko":"많은 사람들이 사랑받던 지도자의 장례식에서 드러내 놓고 울었다."}],"grammarNote":"cry보다 다소 문어적·격식적인 '울다'로, 조용히 눈물 흘리는 모습을 강조한다. 불규칙 동사라 과거형·과거분사형은 모두 wept이다.","grammarQuiz":[{"sentence":"Never _____ she wept so bitterly as when her beloved old dog finally passed away.","ko":"그녀는 사랑하던 늙은 강아지가 마침내 죽었을 때만큼 그렇게 서럽게 운 적이 없었다.","answer":"had","hint":"부정어 도치 (Never had + p.p.)"}]},
    {"id":"v08491","w":"a dose of","pos":["phrase"],"ph":"/doʊs/","cefr":"B2","kr":["약간의, 일정량의"],"ex":[{"en":"The proposal needs a dose of realism before the committee will even consider it.","ko":"그 제안은 위원회가 검토하기도 전에 약간의 현실성이 필요하다."}],"mnemonic":{"soundHint":"어 도스 오브 → 약 한 회분(dose)","story":"약 한 회분(dose)만큼의 양, '약간의, 일정량의' a dose of.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"a bit of","ko":"약간의","reason":"동의어 — 조금"},{"w":"a measure of","ko":"일정량의","reason":"유의어 — 어느 정도"},{"w":"a lot of","ko":"많은","reason":"반의어 — 다량"}],"collocBest":[{"en":"a dose of medicine","ko":"약 한 회 복용량"},{"en":"a dose of reality","ko":"냉정한 현실 자각"}]},"nuance":{"koSimple":"어떤 성질이 일정량 필요하다는 표현","whenToUse":"현실감·유머 등 약간의 요소가 필요할 때"},"krDetail":[{"ko":"약간의, 일정량의","explain":"정해진 만큼의 양"}],"usageExamples":[{"en":"A healthy dose of skepticism will protect you from online scams.","ko":"적당한 정도의 회의적 태도가 온라인 사기로부터 당신을 지켜 줄 것이다."},{"en":"The comedy delivers its message with a generous dose of humor.","ko":"그 코미디는 넉넉한 유머와 함께 메시지를 전달한다."}],"grammarNote":"원래 약의 '1회 복용량'을 뜻하지만, a dose of + 추상명사 형태로 '어느 정도의 ~'라는 비유적 의미로 자주 쓴다. a healthy/generous/small dose of처럼 형용사를 넣어 양을 조절한다.","grammarQuiz":[{"sentence":"The doctor considered a small dose of medicine _____ be sufficient for the elderly patient.","ko":"의사는 소량의 약이 노인 환자에게 충분하다고 여겼다.","answer":"to","hint":"5형식 consider + O + to be"}]},
    {"id":"v08494","w":"account for","pos":["phrase"],"ph":"/əˈkaʊnt/","cefr":"B2","kr":["(부분·비율을) 차지하다","~을 설명하다, ~을 해명하다"],"ex":[{"en":"Renewable sources now account for nearly a third of the nation's electricity supply.","ko":"재생 에너지원이 이제 국가 전력 공급의 거의 3분의 1을 차지한다."}],"mnemonic":{"soundHint":"어카운트 포 → account(계산)+for(~에 대해)","story":"계산(account)에서 몫을 차지하다, 또는 이유를 계산해 '설명하다' account for.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"explain","ko":"설명하다","reason":"동의어 — 이유 대다"},{"w":"make up","ko":"구성하다","reason":"유의어 — 차지하다"},{"w":"constitute","ko":"구성하다","reason":"유의어 — 이루다"}],"collocBest":[{"en":"account for 30% of sales","ko":"매출의 30%를 차지하다"},{"en":"account for the difference","ko":"그 차이를 설명하다"}]},"nuance":{"koSimple":"비율을 차지하거나 이유를 설명함","whenToUse":"통계 비중이나 원인 해명 상황에 사용"},"krDetail":[{"ko":"(부분·비율을) 차지하다","explain":"전체 중 얼마를 차지하다"},{"ko":"~을 설명하다, ~을 해명하다","explain":"왜 그런지 이유를 밝히다"}],"usageExamples":[{"en":"Exports account for almost half of the country's total income.","ko":"수출은 그 나라 총소득의 거의 절반을 차지한다."},{"en":"The manager was asked to account for the missing funds.","ko":"그 관리자는 사라진 자금에 대해 해명하라는 요구를 받았다."}],"grammarNote":"'(비율을) 차지하다'와 '~을 설명·해명하다'라는 두 뜻을 문맥으로 구별해야 한다. 반드시 목적어를 취하며, '설명되다' 뜻일 때는 수동태 be accounted for 형태로도 쓴다.","grammarQuiz":[{"sentence":"This is the main reason _____ accounts for the recent surge in demand for solar panels.","ko":"이것이 최근 태양광 패널 수요 급증을 설명하는 주된 이유이다.","answer":"that","hint":"관계대명사 that (주격)"}]},
    {"id":"v08497","w":"add up to","pos":["phrase"],"ph":"/æd/","cefr":"B2","kr":["결국 ~이 되다","합계 ~가 되다"],"ex":[{"en":"All these small daily choices eventually add up to a significant lifestyle change.","ko":"이러한 사소한 일상의 선택들이 결국 상당한 생활 방식의 변화를 이룬다."}],"mnemonic":{"soundHint":"애드 업 투 → 더해서(add up) 결국(to)","story":"작은 것들을 add up(더해 올려)해 결국 '합계 ~이 되다' add up to.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"amount to","ko":"~에 이르다","reason":"동의어 — 합계가 됨"},{"w":"total","ko":"합계가 되다","reason":"유의어 — 총합"},{"w":"come to","ko":"~이 되다","reason":"유의어 — 결과가 됨"}],"collocBest":[{"en":"add up to a large sum","ko":"합계가 큰 금액이 되다"},{"en":"it all adds up to success","ko":"그 모든 것이 결국 성공으로 이어지다"}]},"nuance":{"koSimple":"작은 것들이 모여 결국 ~에 이름","whenToUse":"합산 결과나 종합적 결론을 말할 때"},"krDetail":[{"ko":"결국 ~이 되다","explain":"마침내 ~한 결과가 되다"},{"ko":"합계 ~가 되다","explain":"다 더하면 ~가 되다"}],"usageExamples":[{"en":"These extra fees add up to a surprisingly large amount each year.","ko":"이 추가 요금들은 해마다 합쳐서 놀랄 만큼 큰 금액이 된다."},{"en":"All his efforts finally added up to a well-deserved promotion.","ko":"그의 모든 노력은 마침내 마땅히 받을 만한 승진으로 이어졌다."}],"grammarNote":"숫자가 '합쳐서 ~가 되다'와 여러 요소가 '결국 ~한 결과가 되다'라는 두 뜻으로 쓴다. 세 단어가 한 덩어리인 구동사라 목적어는 to 뒤에 온다.","grammarQuiz":[{"sentence":"It is these small daily habits _____ eventually add up to a much healthier lifestyle.","ko":"결국 훨씬 더 건강한 생활 방식으로 이어지는 것은 이러한 사소한 일상의 습관들이다.","answer":"that","hint":"It ~ that 강조구문"}]},
    {"id":"v08500","w":"agonize","pos":["verb"],"ph":"/ˈæɡənaɪz/","cefr":"B2","kr":["몹시 괴로워하다"],"ex":[{"en":"Students often agonize over which university offer they should finally accept.","ko":"학생들은 종종 어떤 대학 합격 통보를 결국 수락할지 몹시 괴로워한다."}],"mnemonic":{"soundHint":"애거나이즈 → agony(고통) + ize","story":"agony(고통) 속에 몸부림치다, '몹시 괴로워하다' agonize.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"suffer","ko":"고통받다","reason":"동의어 — 괴로워하다"},{"w":"struggle","ko":"몸부림치다","reason":"유의어 — 힘들어하다"},{"w":"relax","ko":"편안하다","reason":"반의어 — 마음 편함"}],"collocBest":[{"en":"agonize over a decision","ko":"결정을 두고 몹시 고민하다"},{"en":"agonize over every detail","ko":"모든 세부사항에 애태우다"}]},"nuance":{"koSimple":"괴로운 결정 앞에서 몹시 고민함","whenToUse":"오랜 시간 심각하게 갈등할 때 사용"},"krDetail":[{"ko":"몹시 괴로워하다","explain":"아주 심하게 마음 아파하다"}],"usageExamples":[{"en":"There is no need to agonize over such a small decision.","ko":"그렇게 사소한 결정을 두고 괴로워할 필요는 없다."},{"en":"He agonized for weeks about whether to quit his stable job.","ko":"그는 안정된 직장을 그만둘지 말지를 두고 몇 주 동안 몹시 괴로워했다."}],"grammarNote":"agonize over/about something 형태로 '~을 두고 몹시 고민하다'를 뜻한다. 영국식 철자는 agonise이며, 명사 agony(극심한 고통)와 어원이 같다.","grammarQuiz":[{"sentence":"For many sleepless nights she has _____ over which university offer to accept.","ko":"잠 못 이루는 여러 밤 동안 그녀는 어떤 대학 합격 통보를 받아들일지 몹시 괴로워해 왔다.","answer":"agonized","hint":"현재완료(has p.p.)의 과거분사 자리"}]},
    {"id":"v08503","w":"all in all","pos":["phrase"],"ph":"/ɔːl/","cefr":"B2","kr":["대체로"],"ex":[{"en":"All in all, the reform improved public health despite its considerable political cost.","ko":"대체로 그 개혁은 상당한 정치적 비용에도 불구하고 공중 보건을 개선했다."}],"mnemonic":{"soundHint":"올 인 올 → 전부를 전부에","story":"전부(all)를 전부(all)로 놓고 보면, '대체로' all in all.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"overall","ko":"전반적으로","reason":"동의어 — 전체적으로"},{"w":"on the whole","ko":"대체로","reason":"유의어 — 종합하면"},{"w":"in general","ko":"일반적으로","reason":"유의어 — 보통"}],"collocBest":[{"en":"All in all, a good year","ko":"대체로 좋은 한 해"},{"en":"All in all, it went well","ko":"대체로 잘 진행됐다"}]},"nuance":{"koSimple":"전체적으로 볼 때 대체로 그러함","whenToUse":"장단점을 종합해 결론 낼 때 사용"},"krDetail":[{"ko":"대체로","explain":"이것저것 따져 보면"}],"usageExamples":[{"en":"All in all, it was a productive meeting despite the slow start.","ko":"대체로, 시작은 더뎠지만 그것은 생산적인 회의였다."},{"en":"The trip had a few problems, but all in all we enjoyed it.","ko":"그 여행에는 몇 가지 문제가 있었지만, 대체로 우리는 즐거웠다."}],"grammarNote":"여러 사항을 종합해 결론을 내릴 때 쓰는 부사구로, 보통 문장 맨 앞에 놓고 콤마를 찍는다. overall, on the whole과 바꿔 쓸 수 있다.","grammarQuiz":[{"sentence":"_____, the reform is regarded as a success by most public health experts.","ko":"대체로, 그 개혁은 대부분의 공중 보건 전문가들에 의해 성공으로 여겨진다.","answer":"All in all","hint":"문두 부사구 + 수동태(be regarded as)"}]},
    {"id":"v08506","w":"an army of","pos":["phrase"],"ph":"/ˈɑːrmi/","cefr":"B2","kr":["많은 (수의)","~(의) 무리[집단]"],"ex":[{"en":"An army of volunteers gathered at dawn to clean up the flooded neighborhood.","ko":"많은 자원봉사자들이 새벽에 물에 잠긴 동네를 청소하기 위해 모였다."}],"mnemonic":{"soundHint":"언 아미 오브 → army(군대) 만큼 많은","story":"army(군대) 규모의 인원, '많은 수의, ~의 무리' an army of.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"a horde of","ko":"다수의","reason":"동의어 — 떼"},{"w":"a crowd of","ko":"군중의","reason":"유의어 — 무리"},{"w":"a handful of","ko":"소수의","reason":"반의어 — 적은 수"}],"collocBest":[{"en":"an army of volunteers","ko":"수많은 자원봉사자"},{"en":"an army of ants","ko":"개미 떼"}]},"nuance":{"koSimple":"군대처럼 많은 수의 무리를 강조함","whenToUse":"자원봉사자·팬 등 대규모 인원 묘사"},"krDetail":[{"ko":"많은 (수의)","explain":"수가 아주 많은"},{"ko":"~(의) 무리[집단]","explain":"떼를 지은 무리"}],"usageExamples":[{"en":"An army of reporters waited outside the courtroom for the verdict.","ko":"수많은 기자들이 판결을 기다리며 법정 밖에서 대기했다."},{"en":"It took an army of volunteers to organize the huge charity event.","ko":"그 거대한 자선 행사를 준비하는 데는 수많은 자원봉사자가 필요했다."}],"grammarNote":"'아주 많은 수의 사람·사물'을 과장해 표현하는 관용구로, 뒤에는 보통 복수명사가 온다. 뒤 명사가 복수이므로 동사도 흔히 복수로 일치시켜 쓴다.","grammarQuiz":[{"sentence":"There was an army of volunteers _____ helped clean up the flooded neighborhood.","ko":"물에 잠긴 동네 청소를 도운 많은 자원봉사자들이 있었다.","answer":"who","hint":"사람 선행사 + 주격 관계대명사"}]},
    {"id":"v08509","w":"anthropological","pos":["noun"],"ph":"/ˌænθrəpəˈlɑːdʒɪkəl/","cefr":"B2","kr":["인류학(상)의"],"ex":[{"en":"The book offers an anthropological perspective on modern consumer behavior in urban societies.","ko":"그 책은 도시 사회의 현대 소비자 행동에 대한 인류학적 관점을 제공한다."}],"mnemonic":{"soundHint":"앤쓰로폴로지컬 → '앤(옛) 쓰로(시대) 로지컬(논리적)' 연구","story":"옛 시대(앤쓰로)를 논리적(로지컬)으로 파고드는 학문이 곧 인류학이다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"cultural","ko":"문화의","reason":"유의어 — 문화 연구"},{"w":"ethnographic","ko":"민족지학의","reason":"유의어 — 민족 연구"},{"w":"human","ko":"인간의","reason":"관련어 — 인간"}],"collocBest":[{"en":"anthropological research","ko":"인류학 연구"},{"en":"anthropological evidence","ko":"인류학적 증거"}]},"nuance":{"koSimple":"인간의 문화·사회·진화를 학문적으로 바라보는 관점을 나타내요","whenToUse":"학술 논문이나 문화 연구에서 관점·시각을 설명할 때 자주 써요"},"krDetail":[{"ko":"인류학(상)의","explain":"인간과 문화를 연구하는"}],"usageExamples":[{"en":"The researcher took an anthropological approach to studying online communities.","ko":"그 연구자는 온라인 공동체를 연구하는 데 인류학적 접근법을 취했다."},{"en":"Her anthropological fieldwork focused on remote mountain villages.","ko":"그녀의 인류학 현장 연구는 외딴 산간 마을에 초점을 맞췄다."}],"grammarNote":"품사는 명사가 아니라 형용사로, '인류학의'를 뜻하며 명사 앞에서 수식한다(anthropological study). 명사형 anthropology(인류학), anthropologist(인류학자)와 함께 익혀 두면 좋다.","grammarQuiz":[{"sentence":"The researcher used an anthropological approach _____ understand modern consumer behavior.","ko":"그 연구자는 현대 소비자 행동을 이해하기 위해 인류학적 접근을 사용했다.","answer":"to","hint":"목적을 나타내는 to부정사(부사적 용법)"}]},
    {"id":"v08512","w":"appraise","pos":["verb"],"ph":"/əˈpreɪz/","cefr":"B2","kr":["평가하다"],"ex":[{"en":"Experts were hired to appraise the artwork before it went to auction.","ko":"그 예술 작품이 경매에 부쳐지기 전에 감정하기 위해 전문가들이 고용되었다."}],"mnemonic":{"soundHint":"어프레이즈 → 'a phrase(한 구절)'로 값을 매기다","story":"감정사가 'a phrase(한 마디)'로 그림의 가치를 평가한다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"evaluate","ko":"평가하다","reason":"동의어 — 값 매기다"},{"w":"assess","ko":"사정하다","reason":"유의어 — 판단하다"},{"w":"ignore","ko":"무시하다","reason":"반의어 — 살피지 않음"}],"collocBest":[{"en":"appraise the value","ko":"가치를 평가하다"},{"en":"appraise the situation","ko":"상황을 판단하다"}]},"nuance":{"koSimple":"가치나 능력을 전문가처럼 신중히 살펴 값을 매기는 뜻이에요","whenToUse":"예술품 감정이나 인사·부동산 평가처럼 공식적 판단에 써요"},"krDetail":[{"ko":"평가하다","explain":"가치나 값을 매기다"}],"usageExamples":[{"en":"A specialist came to appraise the antique clock's true value.","ko":"한 전문가가 그 골동품 시계의 진정한 가치를 평가하러 왔다."},{"en":"Managers meet each employee to appraise their yearly performance.","ko":"관리자들은 각 직원을 만나 그들의 연간 성과를 평가한다."}],"grammarNote":"'가치·성과를 공식적으로 평가하다'라는 타동사로, 명사형 appraisal과 함께 쓴다. 발음이 비슷한 apprise(~에게 알리다)와 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"The artwork _____ appraised by three independent experts before the auction.","ko":"그 예술 작품은 경매 전에 세 명의 독립 전문가들에 의해 평가되었다.","answer":"was","hint":"수동태(be + p.p.) 과거형"}]},
    {"id":"v08515","w":"approximation","pos":["noun"],"ph":"/əˌprɑːksɪˈmeɪʃən/","cefr":"B2","kr":["근사(치)","비슷한[근접한] 것"],"ex":[{"en":"This model provides only a rough approximation of how the real economy behaves.","ko":"이 모델은 실제 경제가 어떻게 움직이는지에 대한 대략적인 근사치만 제공한다."}],"mnemonic":{"soundHint":"어프록시메이션 → 'approach(접근)'의 명사 근사치","story":"정답에 approach(접근)한 대략적인 값 = 근사치.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"estimate","ko":"추정치","reason":"동의어 — 어림값"},{"w":"rough","ko":"대략의","reason":"유의어 — 대충"},{"w":"exactness","ko":"정확함","reason":"반의어 — 정확"}],"collocBest":[{"en":"a rough approximation","ko":"대략적인 근사치"},{"en":"a close approximation","ko":"거의 근접한 것"}]},"nuance":{"koSimple":"정확한 값은 아니지만 실제와 꽤 가까운 대략적 수치를 뜻해요","whenToUse":"통계·모델·계산 결과가 완벽하지 않고 대략적일 때 써요"},"krDetail":[{"ko":"근사(치)","explain":"거의 비슷한 어림수"},{"ko":"비슷한[근접한] 것","explain":"실제와 가까운 것"}],"usageExamples":[{"en":"This figure is only an approximation, so the real total may differ.","ko":"이 수치는 근사치일 뿐이라서 실제 합계는 다를 수 있다."},{"en":"The map gives a rough approximation of the island's actual shape.","ko":"그 지도는 섬의 실제 모양에 대한 대략적인 근사치를 보여 준다."}],"grammarNote":"'근사치·비슷한 것'을 뜻하는 가산명사로, a rough/close approximation of[to] 연어로 자주 쓴다. 동사 approximate, 부사 approximately(대략)와 어근을 공유한다.","grammarQuiz":[{"sentence":"The model provides an approximation _____ helps economists predict future trends.","ko":"그 모델은 경제학자들이 미래 추세를 예측하는 데 도움이 되는 근사치를 제공한다.","answer":"that","hint":"사물 선행사 + 주격 관계대명사"}]},
    {"id":"v08518","w":"arithmetic","pos":["noun"],"ph":"/əˈrɪθmətɪk/","cefr":"B2","kr":["산수"],"ex":[{"en":"Basic arithmetic remains an essential skill even in the age of digital calculators.","ko":"기본적인 산수는 디지털 계산기의 시대에도 여전히 필수적인 기술이다."}],"mnemonic":{"soundHint":"어리쓰메틱 → '어릴 때 쓰던 매틱한 계산'","story":"어릴 때 쓰던 자동(매틱)적인 계산 = 산수.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"math","ko":"수학","reason":"동의어 — 셈"},{"w":"calculation","ko":"계산","reason":"유의어 — 셈하기"},{"w":"number","ko":"숫자","reason":"관련어 — 수"}],"collocBest":[{"en":"mental arithmetic","ko":"암산"},{"en":"simple arithmetic","ko":"간단한 산수"}]},"nuance":{"koSimple":"덧셈·뺄셈·곱셈처럼 수를 다루는 기본 계산 활동을 뜻해요","whenToUse":"초등 교육이나 기초 계산 능력을 이야기할 때 자주 써요"},"krDetail":[{"ko":"산수","explain":"더하고 빼는 셈"}],"usageExamples":[{"en":"Children learn basic arithmetic such as addition and subtraction in school.","ko":"아이들은 학교에서 덧셈과 뺄셈 같은 기초 산수를 배운다."},{"en":"He made a simple arithmetic error and got the wrong total.","ko":"그는 단순한 계산 실수를 저질러 잘못된 합계를 얻었다."}],"grammarNote":"'산수·셈'을 뜻할 때는 불가산명사라 관사 a를 붙이지 않는다. 명사(강세 arith-)와 형용사 arithmetic(강세 -met-, 산술의)은 강세 위치가 달라 발음이 구별된다.","grammarQuiz":[{"sentence":"It is basic arithmetic _____ children must master before advancing to algebra.","ko":"어린이들이 대수학으로 나아가기 전에 반드시 익혀야 하는 것은 바로 기본 산수이다.","answer":"that","hint":"It is ~ that 강조구문 (강조 대상: basic arithmetic)"}]},
    {"id":"v08521","w":"assent","pos":["phrase"],"ph":"/əˈsent/","cefr":"B2","kr":["동의하다, 찬성하다","찬성","승인"],"ex":[{"en":"The board members finally gave their assent to the controversial merger proposal.","ko":"이사회 구성원들은 마침내 그 논란이 많은 합병 제안에 동의했다."}],"mnemonic":{"soundHint":"어센트 → 'a-sent(보낸)' 동의의 신호","story":"'yes'라고 sent(보낸) 답 = assent(동의).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"agree","ko":"동의하다","reason":"동의어 — 찬성"},{"w":"approval","ko":"승인","reason":"유의어 — 허락"},{"w":"dissent","ko":"반대","reason":"반의어 — 이의"}],"collocBest":[{"en":"give one's assent","ko":"동의하다, 승인하다"},{"en":"nod in assent","ko":"동의하며 고개를 끄덕이다"}]},"nuance":{"koSimple":"제안이나 결정을 공식적으로 받아들여 찬성한다는 뜻이에요","whenToUse":"이사회·정부 승인처럼 격식 있는 자리에서 찬성할 때 써요"},"krDetail":[{"ko":"동의하다, 찬성하다","explain":"좋다고 뜻을 같이하다"},{"ko":"찬성","explain":"좋다고 하는 것"},{"ko":"승인","explain":"허락해 주는 것"}],"usageExamples":[{"en":"The minister refused to assent to the new building plan.","ko":"그 장관은 새 건축 계획에 동의하기를 거부했다."},{"en":"Parliament finally gave its assent to the long-debated law.","ko":"의회는 오랫동안 논의된 그 법안에 마침내 승인을 내렸다."}],"grammarNote":"동사일 때는 assent to something(~에 동의하다) 형태로 쓰고, 명사일 때는 give one's assent(승인하다)로 쓴다. 격식체 표현이며 발음이 비슷한 ascent(상승)와 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"The board members _____ given their assent to the controversial merger proposal.","ko":"이사회 구성원들은 논란이 많은 합병 제안에 동의를 표해 왔다.","answer":"have","hint":"현재완료(have p.p.) 조동사"}]},
    {"id":"v08524","w":"astonishment","pos":["noun"],"ph":"/əˈstɑːnɪʃmənt/","cefr":"B2","kr":["경악"],"ex":[{"en":"The audience gasped in astonishment when the magician revealed his final illusion.","ko":"마술사가 마지막 환상을 공개하자 관객들은 경악하여 숨을 헐떡였다."}],"mnemonic":{"soundHint":"어스타니시먼트 → 'a-stone(돌)처럼 굳어버림'","story":"어! stone(돌)처럼 굳어버릴 만큼의 경악.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"surprise","ko":"놀람","reason":"동의어 — 뜻밖"},{"w":"amazement","ko":"경이","reason":"유의어 — 크게 놀람"},{"w":"calmness","ko":"침착","reason":"반의어 — 태연"}],"collocBest":[{"en":"to my astonishment","ko":"놀랍게도"},{"en":"stare in astonishment","ko":"경악하며 쳐다보다"}]},"nuance":{"koSimple":"예상 밖 일에 크게 놀라 말문이 막힐 만한 강한 놀라움이에요","whenToUse":"충격적 사건이나 반전을 목격했을 때의 반응을 표현해요"},"krDetail":[{"ko":"경악","explain":"깜짝 놀라 어리둥절함"}],"usageExamples":[{"en":"To everyone's astonishment, the quiet student won the debate.","ko":"모두가 경악하게도, 그 조용한 학생이 토론에서 이겼다."},{"en":"She stared at the results in complete astonishment.","ko":"그녀는 완전한 경악에 휩싸여 결과를 응시했다."}],"grammarNote":"'깜짝 놀람·경악'을 뜻하는 불가산명사로, to one's astonishment(놀랍게도), in astonishment(놀라서) 연어가 흔하다. 동사 astonish, 형용사 astonished/astonishing과 함께 익혀 두면 좋다.","grammarQuiz":[{"sentence":"_____ at the magician's final trick, the audience gasped in astonishment.","ko":"마술사의 마지막 묘기에 놀라, 관객들은 경악하여 숨을 헐떡였다.","answer":"Astonished","hint":"분사구문(수동/과거분사) 문두"}]},
    {"id":"v08527","w":"at all costs","pos":["phrase"],"ph":"/kɔːsts/","cefr":"B2","kr":["어떤 대가를 치르더라도, 무슨 수를 써서라도"],"ex":[{"en":"The government vowed to protect the endangered species at all costs.","ko":"정부는 어떤 대가를 치르더라도 그 멸종 위기종을 보호하겠다고 맹세했다."}],"mnemonic":{"soundHint":"앳 올 코스츠 → '모든(all) 비용(costs)을 지불하고서라도'","story":"all(모든) costs(비용)을 다 지불하고서라도 = 무슨 수를 써서라도.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"no matter what","ko":"무슨 일이 있어도","reason":"동의어 — 반드시"},{"w":"by all means","ko":"반드시","reason":"유의어 — 꼭"},{"w":"whatever it takes","ko":"어떻게든","reason":"유의어 — 수단 안 가림"}],"collocBest":[{"en":"avoid it at all costs","ko":"무슨 수를 써서라도 피하다"},{"en":"win at all costs","ko":"어떤 대가를 치르더라도 이기다"}]},"nuance":{"koSimple":"어떤 희생을 감수하더라도 반드시 해내겠다는 강한 결의를 뜻해요","whenToUse":"목표를 지키거나 소중한 것을 보호할 때 결심을 강조해요"},"krDetail":[{"ko":"어떤 대가를 치르더라도, 무슨 수를 써서라도","explain":"손해를 봐도 꼭 해내는"}],"usageExamples":[{"en":"We must finish the project on time at all costs.","ko":"우리는 무슨 수를 써서라도 그 프로젝트를 제때 끝내야 한다."},{"en":"She was determined to protect her children at all costs.","ko":"그녀는 어떤 대가를 치르더라도 자녀들을 지키기로 결심했다."}],"grammarNote":"'무슨 수를 써서라도'를 뜻하는 부사구로, 보통 문장 끝에 놓여 동사를 강조한다. 같은 뜻으로 at any cost로도 바꿔 쓸 수 있다.","grammarQuiz":[{"sentence":"The government was determined _____ protect the endangered species at all costs.","ko":"정부는 어떤 대가를 치르더라도 그 멸종 위기종을 보호하기로 결심했다.","answer":"to","hint":"be determined + to부정사"}]},
    {"id":"v08530","w":"at the expense of","pos":["phrase"],"ph":"/ɪkˈspens/","cefr":"B2","kr":["~을 희생하여, ~의 비용을 대가로"],"ex":[{"en":"Rapid economic growth was achieved at the expense of environmental sustainability.","ko":"급속한 경제 성장은 환경 지속가능성을 희생시키는 대가로 달성되었다."}],"mnemonic":{"soundHint":"앳 디 익스펜스 오브 → 'expense(비용)'을 대가로","story":"누군가의 expense(지출·희생)를 대가로 얻어낸다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"at the cost of","ko":"~을 대가로","reason":"동의어 — 희생하여"},{"w":"sacrificing","ko":"희생하며","reason":"유의어 — 잃으며"},{"w":"benefiting","ko":"이롭게 하며","reason":"반의어 — 이득"}],"collocBest":[{"en":"at the expense of health","ko":"건강을 희생하여"},{"en":"at the expense of others","ko":"다른 사람들을 희생하여"}]},"nuance":{"koSimple":"다른 것을 대가로 치러가며 무언가를 얻거나 이룬다는 뜻이에요","whenToUse":"경제 성장이 환경을 해치듯 대가 관계를 지적할 때 써요"},"krDetail":[{"ko":"~을 희생하여, ~의 비용을 대가로","explain":"무언가를 잃는 대신"}],"usageExamples":[{"en":"He built his career at the expense of his health and family.","ko":"그는 자신의 건강과 가족을 희생하여 경력을 쌓았다."},{"en":"The factory increased profits at the expense of worker safety.","ko":"그 공장은 근로자 안전을 희생하여 이익을 늘렸다."}],"grammarNote":"'~을 희생하여/대가로'를 뜻하며 뒤에 명사(구)나 동명사가 온다. at one's expense는 '~의 비용으로' 또는 '~를 놀림감 삼아'라는 뜻으로도 쓰이니 문맥에 유의한다.","grammarQuiz":[{"sentence":"Rapid economic growth _____ achieved at the expense of environmental sustainability.","ko":"급속한 경제 성장은 환경 지속가능성을 희생시키며 달성되었다.","answer":"was","hint":"수동태(be + p.p.) 과거형"}]},
    {"id":"v08533","w":"attend to","pos":["phrase"],"ph":"/əˈtend/","cefr":"B2","kr":["~을 돌보다","~에 주의를 기울이다"],"ex":[{"en":"The nurse attended to the elderly patients with remarkable patience and genuine warmth.","ko":"그 간호사는 놀라운 인내심과 진정한 온정으로 노인 환자들을 돌보았다."}],"mnemonic":{"soundHint":"어텐드 투 → 'attend(참석)해서 곁에 있어주다'","story":"환자 곁에 attend(참석)해서 돌본다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"care for","ko":"돌보다","reason":"동의어 — 보살피다"},{"w":"tend","ko":"보살피다","reason":"유의어 — 돌봄"},{"w":"neglect","ko":"방치하다","reason":"반의어 — 소홀히"}],"collocBest":[{"en":"attend to a patient","ko":"환자를 돌보다"},{"en":"attend to the matter","ko":"그 일에 주의를 기울이다"}]},"nuance":{"koSimple":"필요한 사람이나 일에 시간과 정성을 들여 처리한다는 뜻이에요","whenToUse":"환자 간호나 손님 응대, 급한 업무 처리 상황에 써요"},"krDetail":[{"ko":"~을 돌보다","explain":"보살피고 챙기다"},{"ko":"~에 주의를 기울이다","explain":"신경 써서 살피다"}],"usageExamples":[{"en":"The waiter promised to attend to our table right away.","ko":"그 웨이터는 즉시 우리 테이블을 봐 주겠다고 약속했다."},{"en":"You should attend to the urgent emails before the meeting starts.","ko":"회의가 시작되기 전에 급한 이메일들을 처리해야 한다."}],"grammarNote":"'~을 처리하다·돌보다·주의를 기울이다'라는 뜻으로 목적어를 반드시 취한다. 목적어 없이 '참석하다'로 쓰는 attend와 의미가 다르므로 to의 유무로 구별한다.","grammarQuiz":[{"sentence":"The nurse _____ attended to the elderly patients received a prestigious award.","ko":"노인 환자들을 돌본 그 간호사는 권위 있는 상을 받았다.","answer":"who","hint":"사람 선행사 + 주격 관계대명사"}]},
    {"id":"v08536","w":"automate","pos":["verb"],"ph":"/ˈɔːtəmeɪt/","cefr":"B2","kr":["자동화하다","자동 조종하다"],"ex":[{"en":"Many factories now automate repetitive tasks to increase efficiency and reduce human error.","ko":"많은 공장들이 이제 효율성을 높이고 인적 오류를 줄이기 위해 반복 작업을 자동화한다."}],"mnemonic":{"soundHint":"오토메이트 → 'auto(자동) + make(만들다)'","story":"auto(자동)로 make(만들어) 돌아가게 한다 = 자동화하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"mechanize","ko":"기계화하다","reason":"동의어 — 기계로"},{"w":"computerize","ko":"전산화하다","reason":"유의어 — 컴퓨터로"},{"w":"manual","ko":"수동의","reason":"반의어 — 손으로 함"}],"collocBest":[{"en":"automate the process","ko":"과정을 자동화하다"},{"en":"automate a task","ko":"작업을 자동화하다"}]},"nuance":{"koSimple":"사람이 하던 일을 기계나 프로그램이 대신하도록 만드는 뜻이에요","whenToUse":"공장 공정, 반복 업무, IT 작업 효율화 문맥에서 써요"},"krDetail":[{"ko":"자동화하다","explain":"기계가 알아서 하게 만들다"},{"ko":"자동 조종하다","explain":"기계가 스스로 조종하다"}],"usageExamples":[{"en":"The company plans to automate its entire packaging process.","ko":"그 회사는 포장 공정 전체를 자동화할 계획이다."},{"en":"You can automate these boring reports with a simple program.","ko":"간단한 프로그램으로 이 지루한 보고서 작성을 자동화할 수 있다."}],"grammarNote":"'~을 자동화하다'라는 타동사로 명사형 automation, 형용사 automatic과 어근을 공유한다. 흔히 수동태 be automated(자동화되다) 형태로 쓰인다.","grammarQuiz":[{"sentence":"Many factories now use robots _____ automate repetitive tasks and increase efficiency.","ko":"많은 공장들이 이제 반복 작업을 자동화하고 효율성을 높이기 위해 로봇을 사용한다.","answer":"to","hint":"목적의 to부정사"}]},
    {"id":"v08539","w":"be accompanied by","pos":["phrase"],"ph":"/əˈkʌmpənid/","cefr":"B2","kr":["~와 동반하다","~을 수반하다"],"ex":[{"en":"Economic growth is often accompanied by rising inequality within developing societies.","ko":"경제 성장은 종종 개발도상 사회 내의 불평등 심화를 수반한다."}],"mnemonic":{"soundHint":"비 어컴퍼니드 바이 → 'company(동료)'와 함께","story":"company(동반자)와 함께 = 수반되다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"come with","ko":"~와 함께 오다","reason":"동의어 — 딸려오다"},{"w":"go along with","ko":"함께 가다","reason":"유의어 — 동반하다"},{"w":"entail","ko":"수반하다","reason":"유의어 — 함께 생김"}],"collocBest":[{"en":"accompanied by a parent","ko":"부모를 동반한"},{"en":"accompanied by symptoms","ko":"증상을 수반하는"}]},"nuance":{"koSimple":"어떤 일이 일어날 때 다른 현상이 함께 따라온다는 뜻이에요","whenToUse":"사회 현상이나 자연 변화가 부수 효과를 동반할 때 써요"},"krDetail":[{"ko":"~와 동반하다","explain":"함께 따라다니다"},{"ko":"~을 수반하다","explain":"함께 딸려서 생기다"}],"usageExamples":[{"en":"The lecture will be accompanied by a short question session.","ko":"그 강연에는 짧은 질의응답 시간이 함께 제공될 것이다."},{"en":"Thunder is usually accompanied by heavy rain in this region.","ko":"이 지역에서는 천둥에 대개 폭우가 동반된다."}],"grammarNote":"'~을 동반·수반하다'라는 뜻의 수동태 표현으로, 동반하는 대상이 by 뒤에 온다. 사람이 '동행하다'라는 뜻도 있어 be accompanied by a guide처럼 쓴다.","grammarQuiz":[{"sentence":"Economic growth is often _____ by rising inequality within developing societies.","ko":"경제 성장은 종종 개발도상 사회 내의 불평등 심화를 수반한다.","answer":"accompanied","hint":"수동태(be + p.p.)의 과거분사 자리"}]},
    {"id":"v08542","w":"be accustomed to -ing","pos":["phrase"],"ph":"/əˈkʌstəmd/","cefr":"B2","kr":["~을 하는 것에 익숙하다, ~을 하는 것이 습관이 되다"],"ex":[{"en":"City dwellers are accustomed to hearing constant traffic noise throughout the entire night.","ko":"도시 거주자들은 밤새 끊임없는 교통 소음을 듣는 것에 익숙하다."}],"mnemonic":{"soundHint":"비 어커스텀드 → 'custom(관습)'이 된 상태","story":"custom(관습)이 몸에 배어 익숙해진 상태.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"be used to","ko":"익숙하다","reason":"동의어 — 습관됨"},{"w":"get used to","ko":"익숙해지다","reason":"유의어 — 적응하다"},{"w":"unfamiliar","ko":"낯선","reason":"반의어 — 서툰"}],"collocBest":[{"en":"accustomed to working late","ko":"늦게까지 일하는 데 익숙한"},{"en":"accustomed to living alone","ko":"혼자 사는 데 익숙한"}]},"nuance":{"koSimple":"어떤 행동을 오래 겪어 이제는 자연스럽게 느낀다는 뜻이에요","whenToUse":"습관이 된 일상 활동이나 반복 경험을 설명할 때 써요"},"krDetail":[{"ko":"~을 하는 것에 익숙하다, ~을 하는 것이 습관이 되다","explain":"늘 해서 몸에 밴"}],"usageExamples":[{"en":"Night-shift workers are accustomed to sleeping during the day.","ko":"야간 근무자들은 낮에 자는 것에 익숙하다."},{"en":"She soon became accustomed to living far from her hometown.","ko":"그녀는 곧 고향에서 멀리 떨어져 사는 것에 익숙해졌다."}],"grammarNote":"여기서 to는 부정사가 아닌 전치사라 뒤에 반드시 동명사(-ing)나 명사가 온다. be used to -ing와 같은 의미이며, be accustomed to do처럼 동사원형을 쓰지 않도록 주의한다.","grammarQuiz":[{"sentence":"City dwellers are accustomed to _____ constant traffic noise throughout the night.","ko":"도시 거주자들은 밤새 끊임없는 교통 소음을 듣는 것에 익숙하다.","answer":"hearing","hint":"be accustomed to + 동명사(-ing)"}]},
    {"id":"v08545","w":"be comprised of","pos":["phrase"],"ph":"/kəmˈpraɪzd/","cefr":"B2","kr":["~으로 구성되다[이루어지다]"],"ex":[{"en":"The committee is comprised of experts drawn from seven different academic disciplines.","ko":"그 위원회는 일곱 개의 서로 다른 학문 분야에서 온 전문가들로 구성되어 있다."}],"mnemonic":{"soundHint":"비 컴프라이즈드 오브 → 'com(함께) + prise(붙잡다)'","story":"여러 요소가 com(함께) prise(붙잡혀) 하나로 구성되다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"consist of","ko":"구성되다","reason":"동의어 — 이루어지다"},{"w":"be made up of","ko":"이뤄지다","reason":"유의어 — 구성됨"},{"w":"be composed of","ko":"구성되다","reason":"유의어 — 짜이다"}],"collocBest":[{"en":"comprised of three parts","ko":"세 부분으로 구성된"},{"en":"comprised of members","ko":"구성원들로 이루어진"}]},"nuance":{"koSimple":"여러 요소나 구성원이 모여 하나의 전체를 이룬다는 뜻이에요","whenToUse":"위원회·조직·자료 구조 등의 구성 요소를 설명할 때 써요"},"krDetail":[{"ko":"~으로 구성되다[이루어지다]","explain":"여러 부분으로 이뤄지다"}],"usageExamples":[{"en":"The course is comprised of ten lessons and a final project.","ko":"그 강좌는 열 개의 수업과 하나의 최종 프로젝트로 구성된다."},{"en":"This alloy is comprised of copper, zinc, and a little tin.","ko":"이 합금은 구리, 아연, 그리고 약간의 주석으로 구성된다."}],"grammarNote":"'~으로 구성되다'라는 뜻으로 전체가 주어, 구성 요소가 of 뒤에 온다. 능동태 comprise는 원래 of 없이 쓰는 것이 원칙이라 The course comprises ten lessons처럼도 쓴다.","grammarQuiz":[{"sentence":"The committee _____ comprised of experts drawn from seven different academic disciplines.","ko":"그 위원회는 일곱 개의 서로 다른 학문 분야에서 온 전문가들로 구성되어 있다.","answer":"is","hint":"수동태(be + p.p.) 현재형"}]},
    {"id":"v08548","w":"be constitutive of","pos":["phrase"],"ph":"/kənˈstɪtjuːtɪv/","cefr":"B2","kr":["~을 구성하다"],"ex":[{"en":"Shared values and mutual trust are constitutive of any healthy democratic society.","ko":"공유된 가치와 상호 신뢰는 건강한 민주 사회를 구성하는 요소이다."}],"mnemonic":{"soundHint":"비 컨스티튜티브 → 'constitute(구성)'의 형용사","story":"헌법(constitution)이 나라를 구성하듯, 어떤 요소를 이루다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"constitute","ko":"구성하다","reason":"동의어 — 이루다"},{"w":"form","ko":"형성하다","reason":"유의어 — 만들다"},{"w":"essential","ko":"필수적인","reason":"관련어 — 본질"}],"collocBest":[{"en":"constitutive of society","ko":"사회를 구성하는"},{"en":"constitutive of identity","ko":"정체성을 구성하는"}]},"nuance":{"koSimple":"어떤 대상의 본질적 요소가 되어 그것을 성립시킨다는 뜻이에요","whenToUse":"사회·이론의 필수 조건이나 근간을 설명하는 학술 문맥에 써요"},"krDetail":[{"ko":"~을 구성하다","explain":"~을 이루는 요소가 되다"}],"usageExamples":[{"en":"Fair rules are constitutive of any genuine competition.","ko":"공정한 규칙은 모든 진정한 경쟁을 구성하는 본질적 요소이다."},{"en":"These basic rights are constitutive of a free society.","ko":"이러한 기본권은 자유로운 사회를 구성하는 본질적 요소이다."}],"grammarNote":"'~을 이루는 본질적 요소이다'라는 뜻의 격식적 표현으로 주로 학술·철학 글에 쓰인다. 형용사 constitutive가 be동사 뒤 보어로 쓰이며 of가 대상을 이끈다.","grammarQuiz":[{"sentence":"Trust and shared values, _____ are constitutive of democracy, must be preserved.","ko":"민주주의를 구성하는 신뢰와 공유된 가치는 반드시 지켜져야 한다.","answer":"which","hint":"계속적 용법의 관계대명사 (콤마 뒤)"}]},
    {"id":"v08551","w":"be obliged to do","pos":["phrase"],"ph":"/əˈblaɪdʒd/","cefr":"B2","kr":["~해야 하다, 하는 수 없이 ~하다"],"ex":[{"en":"Citizens are obliged to pay taxes according to the income they earn each year.","ko":"시민들은 매년 벌어들이는 소득에 따라 세금을 납부해야 한다."}],"mnemonic":{"soundHint":"비 어블라이지드 → 'ob(단단히) + lige(묶다)'","story":"의무에 단단히 lige(묶여) ~하는 수밖에 없다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"be required to","ko":"요구되다","reason":"동의어 — 의무"},{"w":"have to","ko":"해야 하다","reason":"유의어 — 강제"},{"w":"be free to","ko":"자유롭다","reason":"반의어 — 마음대로"}],"collocBest":[{"en":"obliged to comply","ko":"따라야 하는"},{"en":"obliged to pay","ko":"지불해야 하는"}]},"nuance":{"koSimple":"법·의무·상황 때문에 어쩔 수 없이 해야만 한다는 뜻이에요","whenToUse":"법적 의무나 사회적 책임을 이야기할 때 자주 써요"},"krDetail":[{"ko":"~해야 하다, 하는 수 없이 ~하다","explain":"어쩔 수 없이 꼭 해야 하는"}],"usageExamples":[{"en":"Employees are obliged to follow the company's safety rules.","ko":"직원들은 회사의 안전 규정을 따라야 한다."},{"en":"I felt obliged to help the stranger who had lost his way.","ko":"나는 길을 잃은 그 낯선 사람을 돕지 않을 수 없다고 느꼈다."}],"grammarNote":"'~할 의무가 있다/하지 않을 수 없다'라는 뜻으로 to 뒤에 동사원형이 온다. be obliged to somebody 형태로 '~에게 고마워하다'라는 다른 뜻도 있으니 문맥으로 구별한다.","grammarQuiz":[{"sentence":"Citizens are obliged _____ pay taxes according to the income they earn each year.","ko":"시민들은 매년 벌어들이는 소득에 따라 세금을 납부해야 한다.","answer":"to","hint":"be obliged + to부정사"}]},
    {"id":"v08554","w":"biomass","pos":["noun"],"ph":"/ˈbaɪoʊmæs/","cefr":"B2","kr":["생물량"],"ex":[{"en":"Forests contain the largest biomass of any terrestrial ecosystem on our planet.","ko":"숲은 지구상의 어떤 육상 생태계보다 가장 많은 생물량을 포함하고 있다."}],"mnemonic":{"soundHint":"바이오매스 → 'bio(생물) + mass(질량)'","story":"bio(생물)의 mass(질량) 총합 = 생물량.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"organic matter","ko":"유기물","reason":"유의어 — 생물체"},{"w":"biofuel","ko":"바이오연료","reason":"관련어 — 연료"},{"w":"ecosystem","ko":"생태계","reason":"관련어 — 생물 전체"}],"collocBest":[{"en":"biomass energy","ko":"바이오매스 에너지"},{"en":"plant biomass","ko":"식물 생물량"}]},"nuance":{"koSimple":"특정 지역이나 생태계에 사는 생물의 전체 총량을 뜻해요","whenToUse":"생태학·환경학에서 자원량이나 에너지원을 논할 때 써요"},"krDetail":[{"ko":"생물량","explain":"일정 지역 생물의 총 무게"}],"usageExamples":[{"en":"Scientists measured the total biomass of fish in the coral reef.","ko":"과학자들은 그 산호초에 사는 물고기의 총 생물량을 측정했다."},{"en":"Power plants can burn biomass such as wood chips to generate energy.","ko":"발전소는 목재 칩 같은 바이오매스를 태워 에너지를 생산할 수 있다."}],"grammarNote":"특정 지역의 '생물 총량'이나 연료로 쓰는 '바이오매스'를 뜻하는 불가산명사라 관사 a를 붙이지 않는다. 접두사 bio-(생명)와 mass(질량)의 결합으로 이해하면 쉽다.","grammarQuiz":[{"sentence":"It is forests _____ contain the largest biomass of any terrestrial ecosystem on Earth.","ko":"지구상의 어떤 육상 생태계보다 가장 많은 생물량을 포함하고 있는 것은 바로 숲이다.","answer":"that","hint":"It is ~ that 강조구문 (강조 대상: forests)"}]},
    {"id":"v08557","w":"by the same token","pos":["phrase"],"ph":"/ˈtoʊkən/","cefr":"B2","kr":["마찬가지로"],"ex":[{"en":"Physical exercise strengthens muscles; by the same token, reading strengthens critical thinking skills.","ko":"신체 운동이 근육을 강화하듯이, 마찬가지로 독서는 비판적 사고력을 강화한다."}],"mnemonic":{"soundHint":"바이 더 세임 토큰 → '같은(same) 증표(token)에 의해'","story":"동일한 token(표징)으로 미루어 = 마찬가지로.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"likewise","ko":"마찬가지로","reason":"동의어 — 똑같이"},{"w":"similarly","ko":"비슷하게","reason":"유의어 — 유사하게"},{"w":"conversely","ko":"반대로","reason":"반의어 — 거꾸로"}],"collocBest":[{"en":"By the same token, prices rose","ko":"마찬가지로 가격이 올랐다"},{"en":"and, by the same token","ko":"그리고 같은 이유로"}]},"nuance":{"koSimple":"앞서 말한 이유와 똑같은 논리로 다른 예에도 적용된다는 뜻이에요","whenToUse":"논리를 확장하거나 유사 사례를 이어 말할 때 써요"},"krDetail":[{"ko":"마찬가지로","explain":"같은 이유로 똑같이"}],"usageExamples":[{"en":"The company rewards loyal customers; by the same token, it penalizes those who breach contracts.","ko":"그 회사는 충성 고객에게 보상한다. 마찬가지로 계약을 위반하는 사람에게는 불이익을 준다."},{"en":"He never lied to his friends, and by the same token, he expected complete honesty from them.","ko":"그는 친구들에게 결코 거짓말하지 않았고, 마찬가지로 그들에게도 완전한 정직함을 기대했다."}],"grammarNote":"문장과 문장을 잇는 연결어구로, 보통 세미콜론이나 콤마 뒤 문두에 놓여 '같은 이치로'라는 뜻을 나타낸다. 앞 내용과 논리적으로 대응되는 두 번째 진술을 이끌 때 쓴다.","grammarQuiz":[{"sentence":"Exercise strengthens muscles; by the same token, reading _____ enhanced by regular practice.","ko":"운동이 근육을 강화하듯이, 마찬가지로 독서 능력은 규칙적인 연습으로 향상된다.","answer":"is","hint":"수동태(be + p.p.) 현재형"}]},
    {"id":"v08560","w":"cannot help but do","pos":["phrase"],"ph":"/help/","cefr":"B2","kr":["~하지 않을 수 없다"],"ex":[{"en":"Anyone reading her honest memoir cannot help but admire her extraordinary resilience.","ko":"그녀의 솔직한 회고록을 읽는 누구든 그녀의 놀라운 회복력에 감탄하지 않을 수 없다."}],"mnemonic":{"soundHint":"캔낫 헬프 벗 → 'help(피하다)'를 못하고","story":"help(피할·억제할) 수 없이 ~하고 만다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"cannot help -ing","ko":"~하지 않을 수 없다","reason":"동의어 — 같은 뜻"},{"w":"be forced to","ko":"어쩔 수 없이 하다","reason":"유의어 — 강제됨"},{"w":"resist","ko":"저항하다","reason":"반의어 — 참다"}],"collocBest":[{"en":"cannot help but smile","ko":"미소 짓지 않을 수 없다"},{"en":"cannot help but wonder","ko":"궁금해하지 않을 수 없다"}]},"nuance":{"koSimple":"마음을 억누를 수 없어 그렇게 반응할 수밖에 없다는 뜻이에요","whenToUse":"감동·감탄·연민 같은 자연스러운 반응을 강조할 때 써요"},"krDetail":[{"ko":"~하지 않을 수 없다","explain":"저절로 그렇게 되는"}],"usageExamples":[{"en":"When I saw the abandoned puppy, I could not help but take it home.","ko":"버려진 강아지를 봤을 때, 나는 그것을 집에 데려오지 않을 수 없었다."},{"en":"Watching the touching farewell scene, the audience cannot help but cry.","ko":"감동적인 이별 장면을 보며 관객들은 울지 않을 수 없다."}],"grammarNote":"'cannot help but' 뒤에는 반드시 동사원형이 오며, 같은 뜻의 'cannot help -ing'와 혼동하지 않도록 주의한다. 즉 'cannot help but cry = cannot help crying'이다.","grammarQuiz":[{"sentence":"Anyone reading her honest memoir cannot help but _____ her extraordinary resilience.","ko":"그녀의 솔직한 회고록을 읽는 누구든 그녀의 놀라운 회복력에 감탄하지 않을 수 없다.","answer":"admire","hint":"cannot help but + 동사원형"}]},
    {"id":"v08563","w":"cast one's eye on","pos":["phrase"],"ph":"/kæst/","cefr":"B2","kr":["~에 눈길을 주다, ~을 바라보다"],"ex":[{"en":"She cast her eye on the sparkling diamond necklace displayed in the boutique window.","ko":"그녀는 부티크 창문에 진열된 반짝이는 다이아몬드 목걸이에 눈길을 주었다."}],"mnemonic":{"soundHint":"캐스트 아이 온 → '눈(eye)을 던지다(cast)'","story":"눈길(eye)을 그쪽으로 cast(던지다) = 눈길을 주다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"glance at","ko":"흘낏 보다","reason":"동의어 — 잠깐 봄"},{"w":"look at","ko":"바라보다","reason":"유의어 — 보다"},{"w":"ignore","ko":"무시하다","reason":"반의어 — 안 봄"}],"collocBest":[{"en":"cast an eye on the crowd","ko":"군중에 눈길을 주다"},{"en":"cast his eye over the report","ko":"보고서를 훑어보다"}]},"nuance":{"koSimple":"시선을 어떤 대상 쪽으로 던져 잠시 바라본다는 뜻이에요","whenToUse":"흥미로운 물건에 눈길이 쏠릴 때 문학적으로 자주 써요"},"krDetail":[{"ko":"~에 눈길을 주다, ~을 바라보다","explain":"잠깐 눈을 두어 보다"}],"usageExamples":[{"en":"The detective cast his eye on every corner of the dimly lit room.","ko":"형사는 어둑한 방의 모든 구석에 눈길을 주었다."},{"en":"Before signing, she cast her eye on the fine print at the bottom of the page.","ko":"서명하기 전에 그녀는 페이지 하단의 깨알 같은 글씨에 눈길을 주었다."}],"grammarNote":"'one's' 자리에 소유격(his, her, my 등)을 주어에 맞춰 넣어야 하며, 'eye'는 보통 단수로 쓴다. 눈길을 주는 대상 앞에는 전치사 'on'이 온다.","grammarQuiz":[{"sentence":"_____ her eye on the sparkling diamond necklace, she smiled with delight.","ko":"반짝이는 다이아몬드 목걸이에 눈길을 주며, 그녀는 기쁨에 미소 지었다.","answer":"Casting","hint":"분사구문(능동/현재분사) 문두"}]},
    {"id":"v08566","w":"characterize","pos":["phrase"],"ph":"/ˈkærəktəraɪz/","cefr":"B2","kr":["특징이 되다, 특징짓다"],"ex":[{"en":"Rapid technological innovation characterizes the modern global economy more than ever before.","ko":"급속한 기술 혁신은 그 어느 때보다도 현대 세계 경제를 특징짓는다."}],"mnemonic":{"soundHint":"캐릭터라이즈 → 'character(특성)'의 동사","story":"어떤 시대에 character(특성)을 부여 = 특징짓다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"typify","ko":"특징을 나타내다","reason":"동의어 — 대표하다"},{"w":"define","ko":"정의하다","reason":"유의어 — 규정하다"},{"w":"distinguish","ko":"구별짓다","reason":"유의어 — 특징지음"}],"collocBest":[{"en":"be characterized by","ko":"~을 특징으로 하다"},{"en":"characterize the era","ko":"그 시대를 특징짓다"}]},"nuance":{"koSimple":"어떤 대상의 두드러진 성질을 잘 드러내 규정한다는 뜻이에요","whenToUse":"시대·인물·현상의 대표적 특징을 설명할 때 자주 써요"},"krDetail":[{"ko":"특징이 되다, 특징짓다","explain":"남다른 점을 드러내다"}],"usageExamples":[{"en":"Bold brushstrokes and vivid colors characterize the artist's later works.","ko":"대담한 붓놀림과 선명한 색채가 그 화가의 후기 작품을 특징짓는다."},{"en":"Critics often characterize his novels as bleak yet strangely hopeful.","ko":"비평가들은 종종 그의 소설을 암울하지만 이상하게 희망적이라고 규정한다."}],"grammarNote":"'A characterize B'는 'A가 B의 특징이 되다'라는 뜻이고, 'characterize A as B'는 'A를 B로 규정하다'라는 뜻이다. 후자는 수동태 'A be characterized as B'로 자주 쓰인다.","grammarQuiz":[{"sentence":"It is rapid technological innovation _____ characterizes the modern global economy.","ko":"현대 세계 경제를 특징짓는 것은 바로 급속한 기술 혁신이다.","answer":"that","hint":"It is ~ that 강조구문 (주어 강조)"}]},
    {"id":"v08569","w":"cognition","pos":["noun"],"ph":"/kɑːɡˈnɪʃən/","cefr":"B2","kr":["인식[인지]","지식"],"ex":[{"en":"Recent studies suggest that regular exercise significantly improves cognition in older adults.","ko":"최근 연구는 규칙적인 운동이 노인의 인지 능력을 크게 향상시킨다고 시사한다."}],"mnemonic":{"soundHint":"코그니션 → 머릿속 'cog(톱니바퀴)'가 도는 것","story":"머릿속 cog(톱니)가 돌아가며 인지가 이루어진다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"perception","ko":"지각","reason":"동의어 — 알아차림"},{"w":"awareness","ko":"의식","reason":"유의어 — 앎"},{"w":"ignorance","ko":"무지","reason":"반의어 — 모름"}],"collocBest":[{"en":"human cognition","ko":"인간의 인지"},{"en":"social cognition","ko":"사회적 인지"}]},"nuance":{"koSimple":"지각·기억·판단 등 정보를 처리하는 마음의 작용을 뜻해요","whenToUse":"심리학·뇌과학에서 사고 능력이나 학습을 다룰 때 써요"},"krDetail":[{"ko":"인식[인지]","explain":"알고 이해하는 것"},{"ko":"지식","explain":"머리로 아는 내용"}],"usageExamples":[{"en":"Sleep deprivation has a measurable negative effect on human cognition.","ko":"수면 부족은 인간의 인지에 측정 가능한 부정적 영향을 미친다."},{"en":"Researchers study how language shapes cognition in young children.","ko":"연구자들은 언어가 어린아이의 인지를 어떻게 형성하는지 연구한다."}],"grammarNote":"추상적 정신 작용을 가리키는 불가산 명사로 보통 관사 없이 쓴다. 형용사형은 'cognitive'(인지의)이다.","grammarQuiz":[{"sentence":"Regular exercise improves cognition, _____ is essential for healthy aging in older adults.","ko":"규칙적인 운동은 노인의 건강한 노화에 필수적인 인지 능력을 향상시킨다.","answer":"which","hint":"계속적 용법의 관계대명사"}]},
    {"id":"v08572","w":"come into contact with","pos":["phrase"],"ph":"/ˈkɑːntækt/","cefr":"B2","kr":["~와 접촉하다[마주치다]"],"ex":[{"en":"Travelers often come into contact with unfamiliar customs when visiting rural mountain villages.","ko":"여행자들은 시골 산간 마을을 방문할 때 종종 낯선 관습과 마주치게 된다."}],"mnemonic":{"soundHint":"컴 인투 콘택트 → 'contact(접촉)' 상태로 들어감","story":"낯선 것과 contact(접촉) 상태에 진입 = 마주치다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"encounter","ko":"마주치다","reason":"동의어 — 만남"},{"w":"meet","ko":"만나다","reason":"유의어 — 접촉"},{"w":"avoid","ko":"피하다","reason":"반의어 — 안 만남"}],"collocBest":[{"en":"come into contact with water","ko":"물과 접촉하다"},{"en":"come into contact with people","ko":"사람들과 접촉하다"}]},"nuance":{"koSimple":"사람·문화·물질을 직접 만나거나 부딪히게 된다는 뜻이에요","whenToUse":"낯선 문화 접촉이나 병원균 노출을 설명할 때 자주 써요"},"krDetail":[{"ko":"~와 접촉하다[마주치다]","explain":"서로 닿거나 만나다"}],"usageExamples":[{"en":"Children often come into contact with harmful germs on playground surfaces.","ko":"아이들은 놀이터 표면에서 해로운 세균과 자주 접촉한다."},{"en":"She first came into contact with classical music through her grandmother.","ko":"그녀는 할머니를 통해 처음으로 클래식 음악을 접하게 되었다."}],"grammarNote":"'contact'는 이 표현에서 관사 없이 쓰이며, 접촉 대상은 전치사 'with' 뒤에 온다. 물리적 접촉뿐 아니라 '(개념·문화 등을) 접하다'라는 추상적 의미로도 쓴다.","grammarQuiz":[{"sentence":"Travelers _____ come into contact with unfamiliar customs often gain new perspectives.","ko":"낯선 관습과 마주치는 여행자들은 종종 새로운 관점을 얻는다.","answer":"who","hint":"사람 선행사 + 주격 관계대명사"}]},
    {"id":"v08575","w":"come to pass","pos":["phrase"],"ph":"/pæs/","cefr":"B2","kr":["일어나다"],"ex":[{"en":"The prophecy of long peace did eventually come to pass after decades of conflict.","ko":"오랜 평화의 예언은 수십 년의 분쟁 이후 결국 실현되었다."}],"mnemonic":{"soundHint":"컴 투 패스 → '지나가는(pass) 상태로 오다'","story":"그저 pass(지나가는) 일로 come(오다) = 실제로 벌어지다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"happen","ko":"일어나다","reason":"동의어 — 벌어지다"},{"w":"occur","ko":"발생하다","reason":"유의어 — 생기다"},{"w":"vanish","ko":"사라지다","reason":"반의어 — 없어짐"}],"collocBest":[{"en":"It came to pass that","ko":"~한 일이 일어났다"},{"en":"the prophecy came to pass","ko":"예언이 실현되었다"}]},"nuance":{"koSimple":"오래 예상되거나 예언되던 일이 마침내 현실이 된다는 뜻이에요","whenToUse":"성경·문학처럼 예언이나 기대가 실현되는 문맥에서 써요"},"krDetail":[{"ko":"일어나다","explain":"어떤 일이 실제로 생기다"}],"usageExamples":[{"en":"No one imagined that such a dramatic change would come to pass so quickly.","ko":"그렇게 극적인 변화가 그토록 빨리 일어나리라고는 아무도 상상하지 못했다."},{"en":"Everything the old sailor had predicted eventually came to pass.","ko":"그 늙은 선원이 예언했던 모든 것이 결국 일어났다."}],"grammarNote":"주로 문어체·격식체에서 '(예언·사건 등이) 실현되다, 일어나다'라는 뜻으로 쓰이며 주어는 사건·상황이다. 'happen'의 격식 있는 표현으로 보면 된다.","grammarQuiz":[{"sentence":"If the prophecy _____ come to pass, the country would celebrate for weeks.","ko":"만약 그 예언이 실현된다면, 그 나라는 몇 주 동안 축하할 것이다.","answer":"were to","hint":"가정법 미래 (If ~ were to, would + 동사원형)"}]},
    {"id":"v08578","w":"commentary","pos":["noun"],"ph":"/ˈkɑːmənteri/","cefr":"B2","kr":["논평","해설"],"ex":[{"en":"Her sharp political commentary quickly became one of the newspaper's most-read columns.","ko":"그녀의 날카로운 정치 논평은 곧 그 신문에서 가장 많이 읽히는 칼럼 중 하나가 되었다."}],"mnemonic":{"soundHint":"코멘터리 → 'comment(논평)'의 명사형","story":"comment(코멘트)를 모아 놓은 것 = 논평·해설.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"comment","ko":"논평","reason":"동의어 — 의견"},{"w":"analysis","ko":"분석","reason":"유의어 — 풀이"},{"w":"narration","ko":"해설","reason":"유의어 — 설명"}],"collocBest":[{"en":"social commentary","ko":"사회 논평"},{"en":"live commentary","ko":"생중계 해설"}]},"nuance":{"koSimple":"사건이나 작품에 대한 전문가의 해설이나 견해를 뜻해요","whenToUse":"신문 칼럼, 스포츠 중계, 학술 해설 등에 자주 써요"},"krDetail":[{"ko":"논평","explain":"옳고 그름을 따진 의견"},{"ko":"해설","explain":"알기 쉽게 풀어 설명함"}],"usageExamples":[{"en":"The documentary features insightful commentary from leading economists.","ko":"그 다큐멘터리는 저명한 경제학자들의 통찰력 있는 해설을 담고 있다."},{"en":"His running commentary during the match kept listeners thoroughly entertained.","ko":"경기 중 그의 실황 해설은 청취자들을 완전히 즐겁게 했다."}],"grammarNote":"'논평'이라는 추상적 의미로는 불가산 명사로, 개별 논평 글을 셀 때는 가산 명사(commentaries)로 쓴다. 스포츠·방송의 '실황 중계 해설'을 뜻하기도 한다.","grammarQuiz":[{"sentence":"The sharp political commentary _____ she wrote became the newspaper's most-read column.","ko":"그녀가 쓴 날카로운 정치 논평은 그 신문에서 가장 많이 읽히는 칼럼이 되었다.","answer":"that","hint":"사물 선행사 + 목적격 관계대명사"}]},
    {"id":"v08581","w":"comparative","pos":["phrase"],"ph":"/kəmˈpærətɪv/","cefr":"B2","kr":["비교의, 비교에 의한","비교적인, 상대적인"],"ex":[{"en":"The comparative study revealed striking differences between the two educational systems.","ko":"그 비교 연구는 두 교육 시스템 사이의 뚜렷한 차이를 드러냈다."}],"mnemonic":{"soundHint":"컴패러티브 → 'compare(비교)'의 형용사","story":"compare(비교)해서 얻은 관점 = 비교의, 상대적인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"relative","ko":"상대적인","reason":"동의어 — 견주는"},{"w":"comparable","ko":"비교할 만한","reason":"유의어 — 견줄 만한"},{"w":"absolute","ko":"절대적인","reason":"반의어 — 절대"}],"collocBest":[{"en":"comparative analysis","ko":"비교 분석"},{"en":"comparative advantage","ko":"비교 우위"}]},"nuance":{"koSimple":"둘 이상의 대상을 나란히 놓고 서로 견주어 살피는 뜻이에요","whenToUse":"비교 연구·비교 문학처럼 학문적으로 대조할 때 써요"},"krDetail":[{"ko":"비교의, 비교에 의한","explain":"서로 견주어 보는"},{"ko":"비교적인, 상대적인","explain":"다른 것과 견주면"}],"usageExamples":[{"en":"Living in the countryside, they enjoyed comparative peace and quiet.","ko":"시골에 살면서 그들은 상대적인 평온과 고요함을 누렸다."},{"en":"The professor specializes in the comparative literature of East Asia.","ko":"그 교수는 동아시아 비교 문학을 전공한다."}],"grammarNote":"명사 앞에서 '비교의' 또는 '상대적인'이라는 뜻으로 쓰이는 형용사이다. 문법 용어로는 '비교급'(the comparative form)을 가리키기도 한다.","grammarQuiz":[{"sentence":"A comparative study _____ conducted last year by researchers from the two universities.","ko":"비교 연구가 작년에 두 대학의 연구자들에 의해 수행되었다.","answer":"was","hint":"수동태(be + p.p.) 과거형"}]},
    {"id":"v08584","w":"configuration","pos":["noun"],"ph":"/kənˌfɪɡjəˈreɪʃən/","cefr":"B2","kr":["배열, 배치"],"ex":[{"en":"The configuration of the desks encouraged more group discussion during the lively class.","ko":"책상의 배치는 활기찬 수업 동안 더 많은 그룹 토론을 촉진했다."}],"mnemonic":{"soundHint":"컨피규레이션 → 컴퓨터 'config(설정)'의 정식 이름","story":"컴퓨터 config(설정) 배치 = 배열·배치.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"arrangement","ko":"배열","reason":"동의어 — 늘어놓음"},{"w":"layout","ko":"배치","reason":"유의어 — 짜임새"},{"w":"structure","ko":"구조","reason":"유의어 — 짜임"}],"collocBest":[{"en":"system configuration","ko":"시스템 구성"},{"en":"default configuration","ko":"기본 설정"}]},"nuance":{"koSimple":"여러 요소가 특정한 방식으로 짜여진 구성 형태를 뜻해요","whenToUse":"컴퓨터 설정, 좌석 배치, 부품 조합 등에 폭넓게 써요"},"krDetail":[{"ko":"배열, 배치","explain":"요소들을 늘어놓은 모양"}],"usageExamples":[{"en":"Changing the configuration of the furniture made the room feel larger.","ko":"가구 배치를 바꾸자 방이 더 넓게 느껴졌다."},{"en":"The software allows users to save their preferred configuration.","ko":"그 소프트웨어는 사용자가 선호하는 설정을 저장할 수 있게 해 준다."}],"grammarNote":"물리적 '배열·배치'뿐 아니라 컴퓨터·기기의 '환경 설정'이라는 뜻으로도 자주 쓰인다. 동사형은 'configure'(구성하다, 설정하다)이다.","grammarQuiz":[{"sentence":"The configuration of the desks _____ was chosen encouraged more group discussion.","ko":"선택된 책상의 배치는 더 많은 그룹 토론을 촉진했다.","answer":"that","hint":"사물 선행사 + 주격 관계대명사"}]},
    {"id":"v08587","w":"considerate","pos":["phrase"],"ph":"/kənˈsɪdərət/","cefr":"B2","kr":["배려하는, 사려 깊은","이해심이 있는"],"ex":[{"en":"A considerate friend always remembers the small details you casually mentioned before.","ko":"사려 깊은 친구는 당신이 이전에 무심코 언급한 작은 세부사항을 항상 기억한다."}],"mnemonic":{"soundHint":"컨시더리트 → 'consider(고려)'의 형용사","story":"남을 consider(고려)해 주는 = 사려 깊은.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"thoughtful","ko":"사려 깊은","reason":"동의어 — 배려하는"},{"w":"caring","ko":"배려하는","reason":"유의어 — 살뜰한"},{"w":"selfish","ko":"이기적인","reason":"반의어 — 자기만"}],"collocBest":[{"en":"a considerate person","ko":"배려심 있는 사람"},{"en":"considerate of others","ko":"남을 배려하는"}]},"nuance":{"koSimple":"남의 감정과 상황을 먼저 살펴 배려하는 태도를 뜻해요","whenToUse":"친절한 성품이나 배려 있는 행동을 칭찬할 때 자주 써요"},"krDetail":[{"ko":"배려하는, 사려 깊은","explain":"남을 잘 챙기고 헤아리는"},{"ko":"이해심이 있는","explain":"남의 처지를 잘 헤아리는"}],"usageExamples":[{"en":"It was very considerate of you to bring an umbrella for me.","ko":"나를 위해 우산을 가져다주다니 정말 사려 깊었다."},{"en":"A considerate host makes every guest feel genuinely welcome.","ko":"배려심 있는 주인은 모든 손님이 진심으로 환영받는다고 느끼게 한다."}],"grammarNote":"'남을 배려하는'이라는 뜻으로 사람의 성품을 묘사한다. 'It is considerate of + 사람 + to부정사' 구문으로 자주 쓰이며, '상당한'을 뜻하는 'considerable'과 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"If she _____ more considerate, she would remember the small details you mentioned.","ko":"그녀가 더 사려 깊다면, 당신이 언급한 작은 세부사항을 기억할 텐데.","answer":"were","hint":"가정법 과거 (If + were, would + 동사원형)"}]},
    {"id":"v08590","w":"contrive","pos":["verb"],"ph":"/kənˈtraɪv/","cefr":"B2","kr":["고안하다"],"ex":[{"en":"Engineers contrived a clever system to filter drinking water using only local materials.","ko":"엔지니어들은 현지 재료만을 사용하여 식수를 여과하는 영리한 시스템을 고안했다."}],"mnemonic":{"soundHint":"컨트라이브 → 'con(함께) + trive(try)'","story":"다 함께 try(궁리)해서 새 방법을 고안하다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"devise","ko":"궁리하다","reason":"동의어 — 짜내다"},{"w":"invent","ko":"발명하다","reason":"유의어 — 만들어냄"},{"w":"imitate","ko":"모방하다","reason":"반의어 — 따라함"}],"collocBest":[{"en":"contrive a plan","ko":"계획을 고안하다"},{"en":"contrive a way to escape","ko":"탈출할 방법을 궁리하다"}]},"nuance":{"koSimple":"궁리를 거듭해 새로운 방법이나 장치를 만들어낸다는 뜻이에요","whenToUse":"창의적 해법이나 기발한 발명을 설명할 때 자주 써요"},"krDetail":[{"ko":"고안하다","explain":"머리 써서 새로 생각해내다"}],"usageExamples":[{"en":"The prisoners contrived an ingenious plan to escape unnoticed.","ko":"죄수들은 들키지 않고 탈출할 기발한 계획을 고안했다."},{"en":"Somehow she contrived to finish the project despite the tight deadline.","ko":"빠듯한 마감에도 그녀는 어떻게든 그 프로젝트를 끝내는 데 성공했다."}],"grammarNote":"'(장치·계획을) 고안하다'라는 뜻 외에, 'contrive to do' 형태로 '(어려움에도) 용케 ~해내다'라는 뜻으로도 쓴다. 형용사 'contrived'는 '부자연스러운, 억지스러운'을 뜻한다.","grammarQuiz":[{"sentence":"Engineers contrived _____ filter drinking water using only locally available materials.","ko":"엔지니어들은 현지에서 구할 수 있는 재료만으로 식수를 여과할 방법을 고안했다.","answer":"to","hint":"contrive + to부정사"}]},
    {"id":"v08593","w":"cut off","pos":["phrase"],"ph":"/kʌt/","cefr":"B2","kr":["~을 잘라 내다","~을 차단하다, ~을 가로막다"],"ex":[{"en":"Rebels cut off the main highway to prevent government forces from reaching the capital.","ko":"반군은 정부군이 수도에 도달하는 것을 막기 위해 주요 고속도로를 차단했다."}],"mnemonic":{"soundHint":"컷 오프 → 'cut(자르다) + off(떨어져)'","story":"cut(잘라) off(떨어뜨려) 흐름을 차단하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"sever","ko":"자르다","reason":"동의어 — 끊다"},{"w":"block","ko":"막다","reason":"유의어 — 차단하다"},{"w":"connect","ko":"연결하다","reason":"반의어 — 잇다"}],"collocBest":[{"en":"cut off the supply","ko":"공급을 차단하다"},{"en":"get cut off","ko":"(통화가) 끊기다, 고립되다"}]},"nuance":{"koSimple":"이어져 있던 것을 잘라 흐름이나 연결을 완전히 끊는다는 뜻이에요","whenToUse":"전기·통신·도로·관계 등이 단절될 때 두루 써요"},"krDetail":[{"ko":"~을 잘라 내다","explain":"베어서 떼어 내다"},{"ko":"~을 차단하다, ~을 가로막다","explain":"흐름을 끊어 막다"}],"usageExamples":[{"en":"The storm cut off electricity to the entire coastal region.","ko":"폭풍이 해안 지역 전체의 전기를 끊어 놓았다."},{"en":"He was cut off in the middle of his sentence by loud applause.","ko":"그는 문장 중간에 우렁찬 박수 소리에 말이 끊겼다."}],"grammarNote":"타동사구로 목적어가 대명사이면 반드시 'cut it off'처럼 사이에 넣는다. '(공급·통신을) 차단하다', '(말을) 끊다', '고립시키다' 등 문맥에 따라 뜻이 다양하다.","grammarQuiz":[{"sentence":"The main highway _____ cut off by rebels to prevent government forces from advancing.","ko":"주요 고속도로는 정부군이 진격하는 것을 막기 위해 반군에 의해 차단되었다.","answer":"was","hint":"수동태(be + p.p.) 과거형"}]},
    {"id":"v08596","w":"deference","pos":["noun"],"ph":"/ˈdefərəns/","cefr":"B2","kr":["존중"],"ex":[{"en":"In many Asian cultures, deference to elders remains a deeply respected social value.","ko":"많은 아시아 문화에서 연장자에 대한 존중은 깊이 존중되는 사회적 가치로 남아 있다."}],"mnemonic":{"soundHint":"데퍼런스 → 'defer(양보)'의 명사","story":"어른께 defer(양보)하며 예를 표함 = 존중.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"respect","ko":"존중","reason":"동의어 — 공경"},{"w":"regard","ko":"경의","reason":"유의어 — 높임"},{"w":"contempt","ko":"경멸","reason":"반의어 — 얕봄"}],"collocBest":[{"en":"out of deference to","ko":"~에 대한 존중에서"},{"en":"show deference","ko":"경의를 표하다"}]},"nuance":{"koSimple":"상대의 지위나 견해를 인정하며 정중히 따르는 태도를 뜻해요","whenToUse":"연장자·상급자·전문가에 대한 예의를 말할 때 써요"},"krDetail":[{"ko":"존중","explain":"높여 대접하는 마음"}],"usageExamples":[{"en":"Out of deference to her wishes, they postponed the celebration.","ko":"그녀의 뜻을 존중하여 그들은 축하 행사를 연기했다."},{"en":"The young lawyer spoke with deference to the senior judge.","ko":"젊은 변호사는 선임 판사에게 경의를 표하며 말했다."}],"grammarNote":"'in deference to'(~을 존중하여)와 'out of deference to'(~에 대한 존중에서)의 형태로 자주 쓰이는 불가산 명사다. 동사형은 'defer to'(~을 따르다, 존중하다)이다.","grammarQuiz":[{"sentence":"Deference to elders, _____ remains a core value in many Asian cultures, shapes daily behavior.","ko":"많은 아시아 문화에서 핵심 가치로 남아 있는 연장자에 대한 존중은 일상 행동을 형성한다.","answer":"which","hint":"계속적 용법의 관계대명사"}]},
    {"id":"v08599","w":"derive ~ from ...","pos":["phrase"],"ph":"/dɪˈraɪv/","cefr":"B2","kr":["~을 ...에서 얻다[끌어내다]"],"ex":[{"en":"Many scientists derive inspiration for new inventions from careful observations of the natural world.","ko":"많은 과학자들은 자연 세계에 대한 세심한 관찰로부터 새로운 발명에 대한 영감을 얻는다."}],"mnemonic":{"soundHint":"디라이브 프롬 → 'de(에서) + rive(강, river)'","story":"river(강, 원천)에서 흘러나온 것을 취하다 = 얻다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"obtain","ko":"얻다","reason":"동의어 — 손에 넣다"},{"w":"extract","ko":"뽑아내다","reason":"유의어 — 끌어냄"},{"w":"originate","ko":"유래하다","reason":"유의어 — 비롯됨"}],"collocBest":[{"en":"derive pleasure from","ko":"~에서 즐거움을 얻다"},{"en":"derive meaning from","ko":"~에서 의미를 끌어내다"}]},"nuance":{"koSimple":"다른 원천에서 어떤 것을 이끌어내거나 유래시킨다는 뜻이에요","whenToUse":"영감·수익·개념의 출처를 밝힐 때 학술적으로 써요"},"krDetail":[{"ko":"~을 ...에서 얻다[끌어내다]","explain":"~에서 뽑아내어 가지다"}],"usageExamples":[{"en":"She derives great satisfaction from helping struggling students succeed.","ko":"그녀는 어려움을 겪는 학생들이 성공하도록 돕는 데서 큰 만족을 얻는다."},{"en":"Many English words derive their meaning from ancient Latin roots.","ko":"많은 영어 단어는 그 의미를 고대 라틴어 어근에서 얻는다."}],"grammarNote":"'얻다'의 뜻일 때 'derive A from B'(B에서 A를 얻다) 구조로 쓴다. 수동형 'be derived from'은 '~에서 유래하다/파생되다'라는 뜻으로도 흔하다.","grammarQuiz":[{"sentence":"Inspiration for new inventions _____ derived from careful observation of the natural world.","ko":"새로운 발명에 대한 영감은 자연 세계에 대한 세심한 관찰로부터 얻어진다.","answer":"is","hint":"수동태(be + p.p.) 현재형"}]},
    {"id":"v08602","w":"determinant","pos":["adj"],"ph":"/dɪˈtɜːrmɪnənt/","cefr":"B2","kr":["결정요인"],"ex":[{"en":"Family income is a major determinant of a child's academic success in most societies.","ko":"가계 소득은 대부분의 사회에서 자녀의 학업 성공을 결정하는 주요 요인이다."}],"mnemonic":{"soundHint":"디터미넌트 → 'determine(결정)'하는 것","story":"결과를 determine(결정)하는 요인 = 결정요인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"factor","ko":"요인","reason":"동의어 — 요소"},{"w":"cause","ko":"원인","reason":"유의어 — 까닭"},{"w":"result","ko":"결과","reason":"반의어 — 결말"}],"collocBest":[{"en":"a key determinant","ko":"핵심 결정요인"},{"en":"a major determinant","ko":"주요 결정요인"}]},"nuance":{"koSimple":"결과나 상태에 결정적 영향을 주는 핵심 요인을 뜻해요","whenToUse":"성공·건강·성장의 원인을 분석하는 연구 문맥에서 써요"},"krDetail":[{"ko":"결정요인","explain":"결과를 정하는 원인"}],"usageExamples":[{"en":"Motivation is often a stronger determinant of success than raw talent.","ko":"동기는 흔히 타고난 재능보다 더 강력한 성공의 결정요인이다."},{"en":"Climate is a key determinant of which crops a region can grow.","ko":"기후는 한 지역이 어떤 작물을 재배할 수 있는지를 결정하는 핵심 요인이다."}],"grammarNote":"'결정요인'을 뜻하는 가산 명사로, 'a determinant of + 명사' 형태로 자주 쓴다. 형용사 'determinant/determining'은 '결정적인'을 뜻한다.","grammarQuiz":[{"sentence":"Family income is a major determinant _____ significantly affects a child's academic success.","ko":"가계 소득은 자녀의 학업 성공에 크게 영향을 미치는 주요 결정 요인이다.","answer":"that","hint":"사물 선행사 + 주격 관계대명사"}]},
    {"id":"v08605","w":"dimensional","pos":["noun"],"ph":"/dɪˈmenʃənəl/","cefr":"B2","kr":["치수의","차원의"],"ex":[{"en":"The architect designed a three-dimensional model to show clients the finished building.","ko":"그 건축가는 고객들에게 완성된 건물을 보여주기 위해 3차원 모형을 설계했다."}],"mnemonic":{"soundHint":"디멘셔널 → 'dimension(차원)'의 형용사","story":"3-D 모형처럼 dimension(차원)을 가진.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"spatial","ko":"공간의","reason":"유의어 — 공간"},{"w":"measurable","ko":"잴 수 있는","reason":"유의어 — 측정"},{"w":"flat","ko":"평평한","reason":"반의어 — 2차원"}],"collocBest":[{"en":"three-dimensional space","ko":"3차원 공간"},{"en":"a two-dimensional image","ko":"2차원 이미지"}]},"nuance":{"koSimple":"어떤 대상이 지닌 차원이나 크기·방향에 관한 뜻이에요","whenToUse":"2차원·3차원 모델이나 공간 표현을 이야기할 때 써요"},"krDetail":[{"ko":"치수의","explain":"길이·크기와 관련된"},{"ko":"차원의","explain":"공간의 갈래에 관한"}],"usageExamples":[{"en":"The game uses three-dimensional graphics to create a realistic world.","ko":"그 게임은 사실적인 세계를 만들기 위해 3차원 그래픽을 사용한다."},{"en":"Her characters are fully dimensional, with believable flaws and virtues.","ko":"그녀의 등장인물들은 믿을 만한 결점과 미덕을 지닌 입체적인 인물들이다."}],"grammarNote":"보통 'two-/three-dimensional'처럼 수를 나타내는 말과 결합해 '~차원의'라는 복합형용사를 이룬다. 명사형은 'dimension'(치수, 차원, 측면)이다.","grammarQuiz":[{"sentence":"The architect designed a three-dimensional model _____ show clients the finished building.","ko":"그 건축가는 고객들에게 완성된 건물을 보여주기 위해 3차원 모형을 설계했다.","answer":"to","hint":"목적의 to부정사"}]},
    {"id":"v08608","w":"discord","pos":["noun"],"ph":"/ˈdɪskɔːrd/","cefr":"B2","kr":["불일치, 불화","불협화음"],"ex":[{"en":"Personal discord within the leadership team eventually undermined the entire organization's mission.","ko":"지도부 내의 개인적 불화가 결국 조직 전체의 사명을 약화시켰다."}],"mnemonic":{"soundHint":"디스코드 → 'dis(반대) + cord(화음)'","story":"화음(cord)이 반대(dis)로 어긋남 = 불협화·불화.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"conflict","ko":"갈등","reason":"동의어 — 다툼"},{"w":"disagreement","ko":"의견 차이","reason":"유의어 — 안 맞음"},{"w":"harmony","ko":"조화","reason":"반의어 — 화합"}],"collocBest":[{"en":"cause discord","ko":"불화를 일으키다"},{"en":"marital discord","ko":"부부간의 불화"}]},"nuance":{"koSimple":"사람 사이의 의견 충돌이나 조화롭지 못한 상태를 뜻해요","whenToUse":"조직 내 갈등이나 음악적 부조화를 설명할 때 두루 써요"},"krDetail":[{"ko":"불일치, 불화","explain":"서로 맞지 않고 다툼"},{"ko":"불협화음","explain":"어울리지 않는 소리"}],"usageExamples":[{"en":"Years of political discord left the small nation deeply divided.","ko":"수년간의 정치적 불화로 그 작은 나라는 깊이 분열되었다."},{"en":"The sudden discord between the two founders alarmed all the investors.","ko":"두 창업자 사이의 갑작스러운 불화는 모든 투자자를 불안하게 했다."}],"grammarNote":"'불화·의견 충돌'을 뜻할 때는 보통 불가산 명사로 쓰이며, 반의어는 'harmony'다. 음악에서는 '불협화음(a discord)'을 가리키기도 한다.","grammarQuiz":[{"sentence":"_____ by internal discord, the leadership team failed to reach a workable consensus.","ko":"내부 불화로 인해 지도부는 실행 가능한 합의에 이르지 못했다.","answer":"Divided","hint":"분사구문(수동/과거분사) 문두"}]},
    {"id":"n08188","w":"baton","pos":["noun"],"ph":"/bəˈtɑːn/","cefr":"B2","kr":["지휘봉","바통"],"ex":[{"en":"The conductor raised his baton, and the music began.","ko":"지휘자가 지휘봉을 들어 올리자 음악이 시작되었다."}],"mnemonic":{"soundHint":"배턴 → 배(bat)+턴(돌린다)","story":"배트를 턴하듯 지휘자가 흔드는 '지휘봉', 이어달리기의 '배턴'.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"stick","ko":"막대기","reason":"관련어 — 막대 모양"},{"w":"wand","ko":"지팡이","reason":"유의어 — 가는 막대"},{"w":"relay","ko":"계주","reason":"관련어 — 바통 주고받기"}],"collocBest":[{"en":"raise the baton","ko":"지휘봉을 들어 올리다"},{"en":"pass the baton","ko":"바통을 넘기다"}]},"nuance":{"koSimple":"지휘봉이나 릴레이 바통을 뜻하는 명사","whenToUse":"음악 지휘, 육상 계주, 경찰봉 문맥"},"krDetail":[{"ko":"지휘봉","explain":"지휘자가 흔드는 막대"},{"ko":"바통","explain":"계주에서 넘기는 막대"}],"usageExamples":[{"en":"The runner dropped the baton just before the final handover.","ko":"그 주자는 마지막 인계 직전에 바통을 떨어뜨렸다."},{"en":"The retiring director passed the baton to her young successor.","ko":"은퇴하는 이사는 젊은 후임자에게 바통을 넘겨주었다."}],"grammarNote":"baton은 가산명사이며 'pass the baton (to ~)'은 '(~에게) 임무·책임을 넘겨주다'라는 관용 표현으로 자주 쓰인다. 발음은 미국식으로 뒤 음절에 강세가 온다.","grammarQuiz":[{"sentence":"The conductor raised his _____ and the orchestra began to play.","ko":"지휘자가 지휘봉을 들어 올리자 오케스트라가 연주를 시작했다.","answer":"baton","hint":"소유격 + 명사 (목적어 자리)"}]},
    {"id":"n08194","w":"autopilot","pos":["noun"],"ph":"/ˈɔːtoʊpaɪlət/","cefr":"B2","kr":["자동 조종 장치","자동 운행"],"ex":[{"en":"The pilot switched the plane to autopilot during the long flight.","ko":"조종사는 긴 비행 동안 비행기를 자동 조종 장치로 전환했다."}],"mnemonic":{"soundHint":"오토파일럿 → 오토(auto)+파일럿(pilot)","story":"오토(자동) 파일럿(조종사), 즉 '자동조종장치'.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"automatic","ko":"자동의","reason":"유의어 — 저절로 작동"},{"w":"manual","ko":"수동의","reason":"반의어 — 사람이 조작"},{"w":"self-driving","ko":"자율주행","reason":"관련어 — 스스로 운전"}],"collocBest":[{"en":"switch to autopilot","ko":"자동 조종으로 전환하다"},{"en":"on autopilot","ko":"자동 조종 상태로"}]},"nuance":{"koSimple":"자동 조종 장치 또는 무의식적 행동","whenToUse":"비행기 자동조종이나 습관적 행동 서술"},"krDetail":[{"ko":"자동 조종 장치","explain":"스스로 조종하는 기계"},{"ko":"자동 운행","explain":"사람 없이 스스로 감"}],"usageExamples":[{"en":"The captain engaged the autopilot once the plane reached cruising altitude.","ko":"기장은 비행기가 순항 고도에 도달하자 자동 조종 장치를 작동시켰다."},{"en":"After years of the same routine, he did his morning chores on autopilot.","ko":"여러 해 동안 같은 일과를 반복한 끝에 그는 아침 집안일을 아무 생각 없이 자동으로 했다."}],"grammarNote":"autopilot은 가산·불가산 모두 가능하며 'on autopilot'은 '자동 조종 상태로' 또는 비유적으로 '아무 생각 없이 습관적으로'라는 뜻으로 쓰인다.","grammarQuiz":[{"sentence":"Many people go through their daily routines on _____.","ko":"많은 사람들이 일상을 자동 조종 상태로 보낸다.","answer":"autopilot","hint":"on autopilot (자동으로, 관용 표현)"}]},
    {"id":"n08195","w":"superhuman","pos":["adjective"],"ph":"/ˌsuːpərˈhjuːmən/","cefr":"B2","kr":["초인적인","인간을 초월한"],"ex":[{"en":"The rescuers made a superhuman effort to save the trapped miners.","ko":"구조대원들은 갇힌 광부들을 구하기 위해 초인적인 노력을 기울였다."}],"mnemonic":{"soundHint":"슈퍼휴먼 → 슈퍼(super)+휴먼(human)","story":"슈퍼 인간, 즉 인간을 뛰어넘는 '초인적인' superhuman.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"extraordinary","ko":"비범한","reason":"유의어 — 보통을 넘음"},{"w":"ordinary","ko":"평범한","reason":"반의어 — 보통 수준"},{"w":"supernatural","ko":"초자연적인","reason":"관련어 — 자연을 넘음"}],"collocBest":[{"en":"superhuman effort","ko":"초인적인 노력"},{"en":"superhuman strength","ko":"초인적인 힘"}]},"nuance":{"koSimple":"인간의 한계를 뛰어넘는 능력을 뜻함","whenToUse":"놀라운 힘·인내·지능을 강조할 때"},"krDetail":[{"ko":"초인적인","explain":"사람 능력을 뛰어넘는"},{"ko":"인간을 초월한","explain":"사람 한계를 넘어선"}],"usageExamples":[{"en":"It took a superhuman effort to finish the marathon in such extreme heat.","ko":"그렇게 극심한 더위 속에서 마라톤을 완주하는 데는 초인적인 노력이 필요했다."},{"en":"The comic book hero possesses superhuman strength and speed.","ko":"그 만화 속 영웅은 초인적인 힘과 속도를 지니고 있다."}],"grammarNote":"superhuman은 명사를 앞에서 수식하는 형용사로 effort, strength, speed 등과 자주 결합한다. super-(초월)+human 구조이며 보통 비교급 없이 쓴다.","grammarQuiz":[{"sentence":"The rescue worker showed _____ strength to save the trapped child.","ko":"구조대원은 갇힌 아이를 구하기 위해 초인적인 힘을 보여주었다.","answer":"superhuman","hint":"형용사 + 명사 수식 구조"}]},
    {"id":"n08200","w":"sympathetic","pos":["adjective"],"ph":"/ˌsɪmpəˈθetɪk/","cefr":"B2","kr":["동정적인","공감하는"],"ex":[{"en":"The nurse gave the frightened patient a sympathetic smile.","ko":"간호사는 겁먹은 환자에게 동정적인 미소를 지어 보였다."}],"mnemonic":{"soundHint":"심퍼세틱 → 심(마음)+퍼(퍼주는)","story":"심(마음)을 퍼주는, 남의 마음을 함께 아파하는 '동정적인'.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"compassionate","ko":"인정 많은","reason":"유의어 — 남을 불쌍히 여김"},{"w":"empathetic","ko":"공감하는","reason":"유의어 — 감정을 함께함"},{"w":"indifferent","ko":"무관심한","reason":"반의어 — 관심 없음"}],"collocBest":[{"en":"a sympathetic listener","ko":"공감해 주는 청자"},{"en":"sympathetic to the cause","ko":"그 대의에 공감하는"}]},"nuance":{"koSimple":"타인의 감정에 공감하고 동정하는 태도","whenToUse":"상대의 어려움에 이해심을 보일 때"},"krDetail":[{"ko":"동정적인","explain":"남의 아픔을 함께 느끼는"},{"ko":"공감하는","explain":"남 마음을 함께 느끼는"}],"usageExamples":[{"en":"The manager was sympathetic to the workers' complaints about long hours.","ko":"그 관리자는 장시간 근무에 대한 직원들의 불만에 동정적이었다."},{"en":"She gave me a sympathetic look when I explained my problem.","ko":"내가 문제를 설명하자 그녀는 공감하는 표정을 지어 보였다."}],"grammarNote":"sympathetic은 'be sympathetic to/toward(s) ~' 형태로 '~에 동정적인·호의적인'이라는 뜻을 나타낸다. 명사는 sympathy, 동사는 sympathize이다.","grammarQuiz":[{"sentence":"The counselor was very _____ to the student's personal problems.","ko":"상담사는 학생의 개인적인 문제에 매우 동정적이었다.","answer":"sympathetic","hint":"be sympathetic to ~ (~에 동정적인)"}]},
    {"id":"n08201","w":"societal","pos":["adjective"],"ph":"/səˈsaɪətl/","cefr":"B2","kr":["사회의","사회적인"],"ex":[{"en":"Climate change is a major societal challenge of our time.","ko":"기후 변화는 우리 시대의 주요한 사회적 과제이다."}],"mnemonic":{"soundHint":"소사이어털 → society(사회) + al(형용사)","story":"society에 -al 붙이면 '사회의, 사회적인' societal.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"social","ko":"사회의","reason":"유의어 — 사회에 관한"},{"w":"communal","ko":"공동의","reason":"유의어 — 공동체의"},{"w":"individual","ko":"개인의","reason":"반의어 — 한 사람의"}],"collocBest":[{"en":"societal change","ko":"사회적 변화"},{"en":"societal norms","ko":"사회적 규범"}]},"nuance":{"koSimple":"사회 전반과 관련된 사회적 성격을 뜻함","whenToUse":"사회 구조·규범·문제를 논할 때"},"krDetail":[{"ko":"사회의","explain":"사람들이 모인 집단의"},{"ko":"사회적인","explain":"여러 사람과 관련된"}],"usageExamples":[{"en":"Rapid technological change brings both societal benefits and risks.","ko":"급격한 기술 변화는 사회적 이익과 위험을 모두 가져온다."},{"en":"Poverty and inequality are deep societal problems that require long-term solutions.","ko":"빈곤과 불평등은 장기적인 해결책이 필요한 깊은 사회적 문제이다."}],"grammarNote":"societal은 명사 society에서 파생된 형용사로 '사회 전체와 관련된'이라는 뜻이며 주로 명사를 수식한다. 개인 간 관계를 뜻하는 social과 구별해서 쓴다.","grammarQuiz":[{"sentence":"Climate change has become a major _____ concern in recent years.","ko":"기후 변화는 최근 몇 년간 주요 사회적 관심사가 되었다.","answer":"societal","hint":"형용사 + 명사 수식 구조"}]},
    {"id":"n08205","w":"symbolic","pos":["adjective"],"ph":"/sɪmˈbɑːlɪk/","cefr":"B2","kr":["상징적인","상징하는"],"ex":[{"en":"The white dove is a symbolic image of peace around the world.","ko":"흰 비둘기는 전 세계적으로 평화를 상징하는 이미지이다."}],"mnemonic":{"soundHint":"심볼릭 → 심볼(symbol) + ic","story":"symbol에 -ic을 붙이면 '상징적인' symbolic.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"representative","ko":"대표적인","reason":"유의어 — 대신 나타냄"},{"w":"figurative","ko":"비유적인","reason":"유의어 — 빗대어 표현"},{"w":"literal","ko":"문자 그대로의","reason":"반의어 — 있는 그대로"}],"collocBest":[{"en":"symbolic meaning","ko":"상징적 의미"},{"en":"a symbolic gesture","ko":"상징적인 몸짓"}]},"nuance":{"koSimple":"어떤 것을 상징적으로 나타내는 성격","whenToUse":"의식·행위·물건이 의미를 상징할 때"},"krDetail":[{"ko":"상징적인","explain":"뜻을 대신 나타내는"},{"ko":"상징하는","explain":"다른 뜻을 대신 보여주는"}],"usageExamples":[{"en":"The handshake was a symbolic gesture of peace between the two nations.","ko":"그 악수는 두 나라 사이의 평화를 나타내는 상징적인 몸짓이었다."},{"en":"Her donation was largely symbolic, but it inspired many others to give.","ko":"그녀의 기부는 대체로 상징적인 것이었지만, 많은 사람에게 기부의 영감을 주었다."}],"grammarNote":"symbolic은 'be symbolic of ~' 형태로 '~을 상징하는'이라는 뜻을 나타낸다. 명사는 symbol, 동사는 symbolize, 부사는 symbolically이다.","grammarQuiz":[{"sentence":"The dove is _____ of peace in many cultures around the world.","ko":"비둘기는 세계의 많은 문화에서 평화를 상징한다.","answer":"symbolic","hint":"be symbolic of ~ (~을 상징하는)"}]},
    {"id":"n08208","w":"chatter","pos":["noun","verb"],"ph":"/ˈtʃætər/","cefr":"B2","kr":["수다","재잘거림"],"ex":[{"en":"The excited chatter of the students filled the classroom before the trip.","ko":"여행을 앞두고 학생들의 신난 수다가 교실을 가득 채웠다."}],"mnemonic":{"soundHint":"채터 → 채팅(chat) + er","story":"채팅(chat)을 계속 하는 것, 재잘재잘 '수다떨다' chatter.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"chat","ko":"잡담","reason":"유의어 — 가벼운 이야기"},{"w":"gossip","ko":"험담","reason":"관련어 — 남 이야기"},{"w":"silence","ko":"침묵","reason":"반의어 — 말이 없음"}],"collocBest":[{"en":"constant chatter","ko":"끊임없는 수다"},{"en":"idle chatter","ko":"쓸데없는 재잘거림"}]},"nuance":{"koSimple":"수다 떨거나 이빨이 딱딱 부딪히는 소리","whenToUse":"잡담 소리나 추위에 떠는 상황 묘사"},"krDetail":[{"ko":"수다","explain":"쉴 새 없이 하는 말"},{"ko":"재잘거림","explain":"빠르게 계속 떠듦"}],"usageExamples":[{"en":"The constant chatter in the library annoyed the students who were trying to study.","ko":"도서관에서 끊임없이 이어지는 수다는 공부하려는 학생들을 짜증나게 했다."},{"en":"The children chatter excitedly about their plans for the weekend.","ko":"아이들은 주말 계획에 대해 신나게 재잘거린다."}],"grammarNote":"chatter는 명사로 '불가산의 수다'를, 동사로 '재잘거리다'를 뜻한다. 동사로 쓸 때 추위 때문에 이가 '딱딱 부딪치다'(teeth chatter)라는 의미도 있다.","grammarQuiz":[{"sentence":"The constant _____ in the classroom made it hard to concentrate.","ko":"교실에서의 끊임없는 수다가 집중하기 어렵게 만들었다.","answer":"chatter","hint":"형용사 + 불가산명사 (주어 자리)"}]},

/* ---------- STORAGE ---------- */
const KEY = "wdr-고2-L32";
const SFX_KEY = "wdr-sfx-on";

const XP_GLOBAL_KEY = "wdr-xp-total";

const lsGet = (k,def)=>{ try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v);}catch(e){return def;} };
const lsSet = (k,v)=>{ try{localStorage.setItem(k, JSON.stringify(v));}catch(e){} };

/* ---------- STATE ---------- */

  phase: "home",          // home | study | quiz | result
  quizType: "basic",       // basic | advanced

  startTime: 0,

  xp: 0,
  streak: 0,
  maxStreak: 0,
  perChapterMaxStreak: 0,

  chapterCleared: lsGet(KEY+":cleared", false),

  tickHandle: null
};

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const SFX = {
  // jp-pachinko-hit: 1200Hz sine 100ms 빠른 감쇠
  correct(){
    tone({type:"sine", freq:1400, dur:.08, vol:.22, t0:0});
    tone({type:"sine", freq:1800, dur:.06, vol:.16, t0:.04});
  },
  // jp-buzzer: 저음 square 150Hz 250ms
  wrong(){
    tone({type:"square", freq:160, dur:.18, vol:.18, t0:0});
    tone({type:"square", freq:120, dur:.20, vol:.16, t0:.06});
  },
  // jp-slot-jackpot: 도-솔-도-미 차임 4단
  levelUp(){
    const notes = [523.25, 783.99, 1046.50, 1318.51]; // C5 G5 C6 E6
    notes.forEach((f,i)=> tone({type:"sine", freq:f, dur:.22, vol:.22, t0:i*.13}));
    tone({type:"triangle", freq:2093.00, dur:.4, vol:.18, t0:.55}); // 종소리 C7
  },
  // jp-chime-asc: 800→1000→1200 3단

  },
  // arcade-fireworks: noise 펑 + 떨어지는 sine

  grandFanfare(){

/* ============================================================
   PARTICLES (Canvas)
   ============================================================ */
const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function startTimer(){
  if(state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(()=>{
    if(state.phase === "result"){ clearInterval(state.tickHandle); return; }
    const el = Date.now() - state.startTime + (state.sessionElapsedBase || 0);
    document.getElementById("timerVal").textContent = fmtTime(el);
  }, 1000);
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function buildQuizPool(){
  const pool = [];
  const words = [...DATA.newWords];
  // 셔플
  const shuffled = shuffle(words).slice(0, 15);
  // 모드 균등 분배 (대략)
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];
  shuffle(modeOrder);
