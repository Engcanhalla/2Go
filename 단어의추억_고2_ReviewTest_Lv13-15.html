    {"id":"w02109","w":"envy","pos":["n","v"],"ph":"/ˈɛnvi/","cefr":"B2","kr":["부러움","시기하다"],"ex":[{"en":"She felt envy towards him.","ko":"그녀는 그에 대한 부러움을 느꼈다."}],"mnemonic":{"soundHint":"엔비 → N.V. 명품(brand)이 부러워","story":"친구가 NV 명품을 자랑해서 부러움이 폭발.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"jealousy","ko":"질투","reason":"동의어 — 시기심"},{"w":"covet","ko":"탐내다","reason":"유의어 — 갈망"},{"w":"admire","ko":"존경하다","reason":"반의어 — 긍정 감정"}],"collocBest":[{"en":"feel envy","ko":"부러움을 느끼다"},{"en":"green with envy","ko":"부러워서 시기하는"}]},"nuance":{"koSimple":"남이 가진 것을 부러워하며 갖고 싶어 하는 복잡한 감정","whenToUse":"타인의 성공·재능·소유를 부럽게 여길 때 사용한다"},"krDetail":[{"ko":"부러움","explain":"남의 것을 갖고 싶은 마음"},{"ko":"시기하다","explain":"남을 부러워하며 샘내다"}],"usageExamples":[{"en":"Her new car filled her neighbors with envy.","ko":"그녀의 새 차는 이웃들을 부러움으로 가득 채웠다."},{"en":"I envy people who can fall asleep so easily.","ko":"나는 그렇게 쉽게 잠드는 사람들이 부럽다."}],"grammarNote":"'envy'는 명사(부러움)와 동사(부러워하다) 둘 다로 쓰이며, 동사일 때 'envy + 사람 + 사물'(~의 …을 부러워하다) 형태의 4형식이 가능하다. 형용사는 'envious'이다.","grammarQuiz":[{"sentence":"_____ others' achievements is unhealthy for the mind.","ko":"다른 사람의 성취를 부러워하는 것은 정신 건강에 해롭다.","answer":"Envying","hint":"동명사 주어"}]},
    {"id":"w01888","w":"drastic","pos":["adj"],"ph":"/ˈdræstɪk/","cefr":"B2","kr":["과감한","급격한"],"ex":[{"en":"The government took drastic measures.","ko":"정부는 과감한 조치를 취했다."}],"mnemonic":{"soundHint":"'드래스틱' → 드라마틱하고 급격한 = 과감한","story":"정부가 갑자기 '드래스틱'한 조치로 유가를 반토막 냄.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"extreme","ko":"극단적인","reason":"동의어 — 정도 심함"},{"w":"radical","ko":"급진적인","reason":"동의어 — 근본적"},{"w":"mild","ko":"온건한","reason":"반의어 — 정반대"}],"collocBest":[{"en":"drastic measures","ko":"과감한 조치"},{"en":"a drastic change","ko":"급격한 변화"}]},"nuance":{"koSimple":"극단적이고 급격한 조치나 변화를 나타낸다.","whenToUse":"과감한 조치나 눈에 띄는 급변을 강조할 때 쓴다."},"krDetail":[{"ko":"과감한","explain":"매우 강하고 극단적인"},{"ko":"급격한","explain":"갑작스럽게 크게 변하는"}],"usageExamples":[{"en":"The company made drastic cuts to its workforce this year.","ko":"그 회사는 올해 인력을 과감하게 감축했다."},{"en":"There was a drastic change in the weather overnight.","ko":"밤사이 날씨에 급격한 변화가 있었다."}],"grammarNote":"'drastic'은 흔히 'drastic measures(과감한 조치)', 'drastic change(급격한 변화)'로 명사 앞에서 쓰인다. 부사형 'drastically'도 함께 익혀두면 좋다.","grammarQuiz":[{"sentence":"If they had acted sooner, they _____ (not need) drastic measures.","ko":"그들이 더 일찍 조치했다면, 과감한 조치를 취할 필요가 없었을 것이다.","answer":"would not have needed","hint":"가정법 과거완료"}]},
    {"id":"w02091","w":"enthusiast","pos":["n"],"ph":"/ɪnˈθjuːziæst/","cefr":"B2","kr":["열성팬","열광자"],"ex":[{"en":"He is a sports enthusiast who never misses a game.","ko":"그는 경기를 절대 놓치지 않는 스포츠 열성팬이다."}],"mnemonic":{"soundHint":"'인쑤지애스트' → enthusiasm + ast(사람) = 열성팬","story":"매경기 티켓을 사는 축구 '인쑤지애스트' 팬.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"fan","ko":"팬","reason":"동의어 — 애호가"},{"w":"devotee","ko":"열성 애호가","reason":"유의어 — 헌신자"},{"w":"critic","ko":"비판자","reason":"반의어 — 정반대"}],"collocBest":[{"en":"a sports enthusiast","ko":"스포츠 열성팬"},{"en":"a car enthusiast","ko":"자동차 열광자"}]},"nuance":{"koSimple":"특정 분야에 열정을 쏟는 열성적 애호가다.","whenToUse":"스포츠·음악·자동차 마니아를 지칭할 때 쓴다."},"krDetail":[{"ko":"열성팬","explain":"무언가를 아주 좋아하는 사람"},{"ko":"열광자","explain":"어떤 일에 열중하는 사람"}],"usageExamples":[{"en":"As a car enthusiast, he spends weekends at the garage.","ko":"자동차 열성팬으로서, 그는 주말을 정비소에서 보낸다."},{"en":"The club welcomes photography enthusiasts of all ages.","ko":"그 동호회는 모든 연령의 사진 애호가를 환영한다."}],"grammarNote":"'enthusiast'는 사람을 가리키는 셀 수 있는 명사로, 흔히 '분야 + enthusiast'(예: sports enthusiast) 형태로 취미·관심 분야를 앞에 붙여 쓴다.","grammarQuiz":[{"sentence":"The enthusiast, _____ passion for cars was legendary, collected rare models.","ko":"자동차에 대한 열정이 전설적이었던 그 열성팬은 희귀 모델을 수집했다.","answer":"whose","hint":"관계대명사 (소유격)"}]},
    {"id":"w01936","w":"earnest","pos":["adj"],"ph":"/ˈɜːrnɪst/","cefr":"B2","kr":["진지한","성실한"],"ex":[{"en":"She made an earnest request.","ko":"그녀는 진지한 부탁을 했다."}],"mnemonic":{"soundHint":"'어니스트' → honest(정직한)와 발음 유사 → 진지한","story":"학교 대표로 '어니스트'하게 인권 연설을 하는 학생.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"serious","ko":"진지한","reason":"동의어 — 진중함"},{"w":"sincere","ko":"진실한","reason":"동의어 — 성실함"},{"w":"frivolous","ko":"경솔한","reason":"반의어 — 정반대"}],"collocBest":[{"en":"an earnest request","ko":"진지한 부탁"},{"en":"an earnest effort","ko":"성실한 노력"}]},"nuance":{"koSimple":"태도가 진지하고 마음이 성실하다는 뜻이다.","whenToUse":"부탁·노력·발언이 진심 어린 것임을 강조할 때 쓴다."},"krDetail":[{"ko":"진지한","explain":"장난 없이 참된"},{"ko":"성실한","explain":"정성을 다하는"}],"usageExamples":[{"en":"She made an earnest effort to finish the project on time.","ko":"그녀는 그 프로젝트를 제때 끝내려 진지하게 노력했다."},{"en":"His earnest expression showed how much he cared.","ko":"그의 진지한 표정은 그가 얼마나 신경 쓰는지를 보여주었다."}],"grammarNote":"'in earnest'는 '본격적으로, 진지하게'라는 뜻의 관용 표현이다. 형용사로 명사를 수식하거나 'be earnest about'으로 쓴다.","grammarQuiz":[{"sentence":"The teacher was so impressed by her earnest efforts _____ she gave her an award.","ko":"선생님은 그녀의 진지한 노력에 감명받아 그녀에게 상을 주었다.","answer":"that","hint":"so ~ that 구문"}]},
    {"id":"w01830","w":"distinguish","pos":["v"],"ph":"/dɪˈstɪŋɡwɪʃ/","cefr":"B2","kr":["구별하다","식별하다"],"ex":[{"en":"Can you distinguish the two colors?","ko":"두 색깔을 구별할 수 있나요?"}],"mnemonic":{"soundHint":"'디스팅귀시' → distinct + guish(구분하기) = 뚜렷하게 구분하다","story":"쌍둥이의 미묘한 차이를 '디스팅귀시'로 구별해내는 탐정.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"differentiate","ko":"구별하다","reason":"동의어 — 격식체"},{"w":"discern","ko":"식별하다","reason":"동의어 — 알아봄"},{"w":"confuse","ko":"혼동하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"distinguish right from wrong","ko":"옳고 그름을 구별하다"},{"en":"distinguish between the two","ko":"둘 사이를 식별하다"}]},"nuance":{"koSimple":"둘 이상을 서로 비교해 차이를 알아본다는 뜻이다.","whenToUse":"색·소리·개념 등의 차이를 식별할 때 쓴다."},"krDetail":[{"ko":"구별하다","explain":"차이를 가려 나누다"},{"ko":"식별하다","explain":"무엇인지 알아보다"}],"usageExamples":[{"en":"It is hard to distinguish between the twins by their voices.","ko":"그 쌍둥이를 목소리로 구별하기는 어렵다."},{"en":"Her unique style distinguishes her work from all the others.","ko":"그녀의 독특한 스타일이 그녀의 작품을 다른 모든 것과 구별해 준다."}],"grammarNote":"'distinguish'는 'distinguish A from B' 또는 'distinguish between A and B(A와 B를 구별하다)' 구문으로 쓴다. 'distinguish oneself(두각을 나타내다)' 표현도 알아둔다.","grammarQuiz":[{"sentence":"If I were you, I _____ (distinguish) between the real and the fake more carefully.","ko":"내가 너라면, 진짜와 가짜를 더 신중히 구별할 텐데.","answer":"would distinguish","hint":"가정법 과거"}]},
    {"id":"w01930","w":"eager","pos":["adj"],"ph":"/ˈiːɡər/","cefr":"B2","kr":["열망하는","간절한"],"ex":[{"en":"She was eager to learn.","ko":"그녀는 배우기를 열망했다."}],"mnemonic":{"soundHint":"'이거!' → '이거 주세요!' 손 들며 열망하는 아이","story":"새 장난감을 '이거!' 하며 초롱초롱 눈으로 조르는 아이.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"keen","ko":"열망하는","reason":"동의어 — 몹시 원함"},{"w":"enthusiastic","ko":"열정적인","reason":"동의어 — 의욕적"},{"w":"reluctant","ko":"꺼리는","reason":"반의어 — 정반대"}],"collocBest":[{"en":"eager to learn","ko":"배우고 싶어 하는"},{"en":"an eager student","ko":"열망하는 학생"}]},"nuance":{"koSimple":"무언가를 몹시 하고 싶어 하는 열망을 뜻한다.","whenToUse":"학습·시작·만남을 간절히 원할 때 쓴다."},"krDetail":[{"ko":"열망하는","explain":"몹시 하고 싶어 하는"},{"ko":"간절한","explain":"매우 바라는"}],"usageExamples":[{"en":"The children were eager to open their presents.","ko":"아이들은 선물을 열어보고 싶어 안달이었다."},{"en":"He is always eager for a chance to prove himself.","ko":"그는 늘 자신을 증명할 기회를 간절히 바란다."}],"grammarNote":"'be eager to+동사원형(~하기를 열망하다)'과 'be eager for+명사(~을 갈망하다)' 두 형태를 구분해 익혀야 한다.","grammarQuiz":[{"sentence":"She was eager _____ (learn) new languages.","ko":"그녀는 새로운 언어를 배우기를 열망했다.","answer":"to learn","hint":"to부정사 (부사적 용법)"}]},
    {"id":"w01846","w":"divine","pos":["adj"],"ph":"/dɪˈvaɪn/","cefr":"B2","kr":["신성한","훌륭한"],"ex":[{"en":"The temple was a place of divine worship.","ko":"그 사원은 신성한 예배 장소였다."}],"mnemonic":{"soundHint":"'디바인' → 디바(diva, 여신) + in = 여신 같은, 신성한","story":"성당 스테인드글라스 아래 '디바인'한 빛이 내려오는 장면.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"sacred","ko":"신성한","reason":"동의어 — 거룩함"},{"w":"holy","ko":"거룩한","reason":"동의어 — 종교적"},{"w":"earthly","ko":"세속적인","reason":"반의어 — 정반대"}],"collocBest":[{"en":"divine intervention","ko":"신의 개입"},{"en":"divine power","ko":"신성한 힘"}]},"nuance":{"koSimple":"신에게 속한 신성함, 또는 매우 훌륭함을 뜻한다.","whenToUse":"종교적 신성함이나 극찬의 감탄을 표현할 때 쓴다."},"krDetail":[{"ko":"신성한","explain":"신에 관계된 거룩한"},{"ko":"훌륭한","explain":"더할 나위 없이 좋은"}],"usageExamples":[{"en":"Many believed the king ruled by divine right.","ko":"많은 이들이 왕이 신성한 권리로 통치한다고 믿었다."},{"en":"This chocolate cake tastes absolutely divine.","ko":"이 초콜릿 케이크는 정말이지 기막히게 맛있다."}],"grammarNote":"'divine'은 '신의·신성한'이라는 본래 뜻 외에 구어체에서 '아주 훌륭한·기막힌'이라는 감탄 표현으로도 쓰인다. 명사형은 'divinity(신성)'이다.","grammarQuiz":[{"sentence":"The ancient people believed the mountain to _____ (be) divine.","ko":"고대 사람들은 그 산이 신성하다고 믿었다.","answer":"be","hint":"5형식 (believe A to be)"}]},
    {"id":"w02064","w":"endure","pos":["v"],"ph":"/ɪnˈdjʊər/","cefr":"B2","kr":["견디다","지속하다"],"ex":[{"en":"She endured years of hardship.","ko":"그녀는 수년간의 고난을 견뎌냈다."}],"mnemonic":{"soundHint":"'인듀어' → en(안에) + dure(단단히) = 단단히 견디다","story":"혹독한 훈련을 이 악물고 '인듀어' 견뎌내는 운동선수.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"withstand","ko":"견디다","reason":"동의어 — 버티다"},{"w":"tolerate","ko":"참다","reason":"유의어 — 참아냄"},{"w":"surrender","ko":"굴복하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"endure hardship","ko":"고난을 견디다"},{"en":"endure the pain","ko":"고통을 참다"}]},"nuance":{"koSimple":"어려움이나 고통을 참고 견뎌낸다는 뜻이다.","whenToUse":"오랜 시련·역경을 버텨낼 때 쓴다."},"krDetail":[{"ko":"견디다","explain":"힘든 것을 참고 버티다"},{"ko":"지속하다","explain":"오랫동안 계속되다"}],"usageExamples":[{"en":"The soldiers had to endure freezing temperatures for weeks.","ko":"군인들은 몇 주 동안 영하의 추위를 견뎌야 했다."},{"en":"Great works of art endure for centuries.","ko":"위대한 예술 작품은 수 세기 동안 지속된다."}],"grammarNote":"'endure'는 목적어를 취하면 '견디다'(타동사), 목적어 없이 쓰면 '지속되다'(자동사)로 뜻이 갈린다. 형용사 'enduring'은 '오래가는'을 뜻한다.","grammarQuiz":[{"sentence":"She had to endure _____ (wait) for hours in the cold.","ko":"그녀는 추위 속에서 몇 시간을 기다리는 것을 견뎌야 했다.","answer":"waiting","hint":"동명사 (endure + -ing)"}]},
    {"id":"w01895","w":"drift","pos":["v","n"],"ph":"/drɪft/","cefr":"B2","kr":["표류하다","흘러가다"],"ex":[{"en":"The boat drifted out to sea.","ko":"배가 바다로 표류했다."}],"mnemonic":{"soundHint":"'드리프트' → 자동차 드리프트, 미끄러지듯 표류","story":"빈 보트가 파도 위에서 '드리프트'하며 바다로 떠내려가는 장면.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"float","ko":"떠다니다","reason":"동의어 — 떠서 흐름"},{"w":"wander","ko":"떠돌다","reason":"동의어 — 정처없이"},{"w":"anchor","ko":"정박하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"drift out to sea","ko":"바다로 표류하다"},{"en":"drift apart","ko":"서로 멀어지다"}]},"nuance":{"koSimple":"물이나 바람에 실려 떠다니듯 움직인다는 뜻이다.","whenToUse":"목적 없이 이동하거나 마음이 흘러갈 때 쓴다."},"krDetail":[{"ko":"표류하다","explain":"물 위를 떠서 흐르다"},{"ko":"흘러가다","explain":"천천히 이동해 가다"}],"usageExamples":[{"en":"The clouds drifted slowly across the evening sky.","ko":"구름이 저녁 하늘을 가로질러 천천히 흘러갔다."},{"en":"Over the years, the two friends gradually drifted apart.","ko":"세월이 흐르며 두 친구는 점점 멀어졌다."}],"grammarNote":"'drift apart'는 '사이가 멀어지다', 'drift off'는 '잠들다'라는 뜻의 자주 쓰이는 구동사다.","grammarQuiz":[{"sentence":"The boat _____ (drift) at sea for three days before being rescued.","ko":"그 배는 구조되기 전 3일간 바다에서 표류해 왔었다.","answer":"had drifted","hint":"과거완료"}]},
    {"id":"w01763","w":"dim","pos":["adj","v"],"ph":"/dɪm/","cefr":"B2","kr":["어두운","흐릿한"],"ex":[{"en":"The room was lit by a dim candle.","ko":"방은 희미한 촛불로 밝혀져 있었다."}],"mnemonic":{"soundHint":"딤(→딤 라이트)","story":"딤 라이트(dim light) = 흐릿하고 어두운 조명","hintConfidence":3},"pairs":{"buddyWords":[{"w":"faint","ko":"희미한","reason":"동의어 — 흐릿함"},{"w":"obscure","ko":"어렴풋한","reason":"동의어 — 모호"},{"w":"bright","ko":"밝은","reason":"반의어 — 정반대"}],"collocBest":[{"en":"a dim light","ko":"희미한 불빛"},{"en":"dim the lights","ko":"조명을 어둡게 하다"}]},"nuance":{"koSimple":"빛이 약해 잘 보이지 않을 만큼 흐릿하고 어두운 상태이다.","whenToUse":"조명이 약한 방이나 희미한 희망을 표현할 때 쓴다."},"krDetail":[{"ko":"어두운","explain":"빛이 약해 잘 안 보이는"},{"ko":"흐릿한","explain":"또렷하지 않고 희미한"}],"usageExamples":[{"en":"In the dim light, she could barely read the small print.","ko":"어두운 불빛 속에서 그녀는 작은 글씨를 겨우 읽었다."},{"en":"Please dim the lights before the movie begins.","ko":"영화가 시작하기 전에 조명을 어둡게 해 주세요."}],"grammarNote":"'dim'은 형용사(어두운)와 동사(어둡게 하다) 둘 다로 쓰인다. 형용사 비교급·최상급은 자음을 겹쳐 'dimmer/dimmest'로 쓴다.","grammarQuiz":[{"sentence":"The old antique lamp made the room _____ and cozy in the evenings.","ko":"그 오래된 골동품 램프는 저녁마다 방을 어둡고 아늑하게 만들었다.","answer":"dim","hint":"5형식 - make + O + 형용사(C)"}]},
    {"id":"w02084","w":"ensure","pos":["v"],"ph":"/ɪnˈʃʊər/","cefr":"B2","kr":["확실히 하다","보장하다"],"ex":[{"en":"Please ensure the door is locked.","ko":"문이 잠겼는지 확인해 주세요."}],"mnemonic":{"soundHint":"'인슈어' → sure(확실한) 앞에 en = 확실히 하다","story":"외출 전 문 잠금을 두 번씩 '인슈어' 확인하는 습관.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"guarantee","ko":"보장하다","reason":"동의어 — 확실히"},{"w":"secure","ko":"확보하다","reason":"유의어 — 지켜냄"},{"w":"assure","ko":"확언하다","reason":"혼동 주의 — 사람 안심시킴"}],"collocBest":[{"en":"ensure success","ko":"성공을 보장하다"},{"en":"ensure safety","ko":"안전을 확실히 하다"}]},"nuance":{"koSimple":"어떤 결과가 확실히 되도록 확보한다는 뜻이다.","whenToUse":"안전·성공·이행을 보장하려 할 때 쓴다."},"krDetail":[{"ko":"확실히 하다","explain":"틀림없이 되게 하다"},{"ko":"보장하다","explain":"꼭 그렇게 되도록 책임지다"}],"usageExamples":[{"en":"Please ensure that all windows are closed before leaving.","ko":"떠나기 전에 모든 창문이 닫혀 있는지 확실히 하세요."},{"en":"Regular checkups help ensure good health.","ko":"정기 검진은 건강을 확실히 지키는 데 도움이 된다."}],"grammarNote":"'ensure that + 절' 또는 'ensure + 명사' 형태로 쓴다. 보험 든다는 'insure'와 철자·뜻을 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"Please ensure that all doors _____ (lock) before leaving.","ko":"떠나기 전에 모든 문이 잠겨 있는지 확인해 주세요.","answer":"are locked","hint":"수동태 (현재)"}]},

    {"id":"w01840","w":"diverse","pos":["adj"],"ph":"/daɪˈvɜːrs/","cefr":"B2","kr":["다양한","다채로운"],"ex":[{"en":"Our team is very diverse.","ko":"우리 팀은 매우 다양하다."}],"mnemonic":{"soundHint":"'다이버스' → '다이(다양)+ 버스(사람 태우는 버스)' = 다양한 사람이 탄 버스","story":"온갖 국적의 사람들이 탄 '다이버스'한 관광 버스를 상상.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"varied","ko":"다양한","reason":"동의어 — 여러 종류"},{"w":"assorted","ko":"여러 가지의","reason":"동의어 — 갖가지"},{"w":"uniform","ko":"획일적인","reason":"반의어 — 정반대"}],"collocBest":[{"en":"a diverse range","ko":"다양한 범위"},{"en":"culturally diverse","ko":"문화적으로 다양한"}]},"nuance":{"koSimple":"종류나 성질이 여러 가지로 다양하다는 뜻이다.","whenToUse":"구성원·문화·의견의 다채로움을 강조할 때 쓴다."},"krDetail":[{"ko":"다양한","explain":"종류가 여러 가지인"},{"ko":"다채로운","explain":"여러 빛깔로 풍부한"}],"usageExamples":[{"en":"The city is home to people from diverse cultural backgrounds.","ko":"그 도시는 다양한 문화적 배경을 가진 사람들의 터전이다."},{"en":"The magazine covers a diverse range of topics each month.","ko":"그 잡지는 매달 다양한 범위의 주제를 다룬다."}],"grammarNote":"'diverse'는 '다양한'이라는 뜻의 형용사로 명사형 'diversity(다양성)', 동사 'diversify(다양화하다)'와 함께 익힌다. 'a diverse range of ~(다양한 범위의)' 표현이 흔하다.","grammarQuiz":[{"sentence":"The company _____ (have) diverse employees from many countries for years.","ko":"그 회사는 수년간 많은 나라 출신의 다양한 직원들을 두어 왔다.","answer":"has had","hint":"현재완료"}]},
    {"id":"w02069","w":"engage","pos":["v"],"ph":"/ɪnˈɡeɪdʒ/","cefr":"B2","kr":["참여하다","관여하다"],"ex":[{"en":"Students engage in discussions.","ko":"학생들은 토론에 참여한다."}],"mnemonic":{"soundHint":"'인게이지' → 게이지(약혼반지) 끼우다 = 관여하다","story":"학생들이 열띤 토론에 '인게이지' 몰입하는 교실 풍경.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"participate","ko":"참여하다","reason":"동의어 — 관여"},{"w":"involve","ko":"관여시키다","reason":"유의어 — 끌어들임"},{"w":"disengage","ko":"물러나다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"engage in a discussion","ko":"토론에 참여하다"},{"en":"engage the audience","ko":"청중을 사로잡다"}]},"nuance":{"koSimple":"적극적으로 참여하거나 관심을 끈다는 뜻이다.","whenToUse":"토론·활동·관계 형성에 몰두할 때 쓴다."},"krDetail":[{"ko":"참여하다","explain":"어떤 일에 적극 나서 하다"},{"ko":"관여하다","explain":"일에 끼어들어 관계하다"}],"usageExamples":[{"en":"The teacher tried to engage every student in the lesson.","ko":"그 교사는 모든 학생을 수업에 참여시키려 했다."},{"en":"He refused to engage in the argument.","ko":"그는 그 논쟁에 관여하기를 거부했다."}],"grammarNote":"'engage in + 명사/동명사'(~에 참여하다)가 핵심 구문이다. 타동사로 'engage someone'(관심을 끌다·고용하다)처럼 쓰며, 'be engaged'는 '약혼한'을 뜻하기도 한다.","grammarQuiz":[{"sentence":"Students should be engaged _____ (learn) actively in class.","ko":"학생들은 수업에 적극적으로 참여하며 배워야 한다.","answer":"to learn","hint":"to부정사"}]},
    {"id":"w02037","w":"emphasis","pos":["n"],"ph":"/ˈɛmfəsɪs/","cefr":"B2","kr":["강조","중점"],"ex":[{"en":"He placed emphasis on teamwork.","ko":"그는 팀워크를 강조했다."}],"mnemonic":{"soundHint":"'엠퍼시스' → emphasize의 명사 = 강조","story":"선생님이 시험에 나온다며 '엠퍼시스' 강조를 두는 대목.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"stress","ko":"강조","reason":"동의어 — 기본형"},{"w":"importance","ko":"중요성","reason":"유의어 — 비중"},{"w":"focus","ko":"초점","reason":"유의어 — 집중"}],"collocBest":[{"en":"place emphasis on","ko":"~을 강조하다"},{"en":"with special emphasis","ko":"특히 중점을 두어"}]},"nuance":{"koSimple":"어떤 부분을 특별히 강조해 두는 중점을 뜻한다.","whenToUse":"중요 요소나 초점을 부각할 때 쓴다."},"krDetail":[{"ko":"강조","explain":"특별히 두드러지게 내세움"},{"ko":"중점","explain":"가장 중요하게 두는 부분"}],"usageExamples":[{"en":"The teacher put emphasis on regular reading habits.","ko":"그 교사는 규칙적인 독서 습관에 중점을 두었다."},{"en":"There is a growing emphasis on renewable energy.","ko":"재생 에너지에 대한 강조가 점점 커지고 있다."}],"grammarNote":"'put/place emphasis on + 명사'(~을 강조하다)가 핵심 연어이다. 복수형은 'emphases'로 불규칙 변화하며, 동사형은 'emphasize'이다.","grammarQuiz":[{"sentence":"The teacher placed emphasis on _____ (understand) the concept clearly.","ko":"선생님은 개념을 명확히 이해하는 것에 강조를 두었다.","answer":"understanding","hint":"동명사 (전치사의 목적어)"}]},
    {"id":"w02017","w":"embark","pos":["v"],"ph":"/ɪmˈbɑːk/","cefr":"B2","kr":["승선하다","착수하다","시작하다"],"ex":[{"en":"They decided to embark on a new business venture together.","ko":"그들은 함께 새로운 사업에 착수하기로 결정했다."}],"mnemonic":{"soundHint":"'임바크' → em(안으로) + bark(작은 배) = 배에 오르다","story":"새 사업이라는 배에 '임바크' 승선해 도전을 시작.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"commence","ko":"시작하다","reason":"동의어 — 격식체"},{"w":"begin","ko":"시작하다","reason":"동의어 — 기본형"},{"w":"conclude","ko":"끝내다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"embark on a journey","ko":"여행에 나서다"},{"en":"embark on a project","ko":"프로젝트에 착수하다"}]},"nuance":{"koSimple":"배·비행기에 오르거나 새 일을 시작한다는 뜻이다.","whenToUse":"항해에 나서거나 사업·모험에 착수할 때 쓴다."},"krDetail":[{"ko":"승선하다","explain":"배나 비행기에 타다"},{"ko":"착수하다","explain":"일을 시작하다"},{"ko":"시작하다","explain":"새 일에 나서다"}],"usageExamples":[{"en":"Passengers began to embark as soon as the gate opened.","ko":"탑승구가 열리자마자 승객들이 승선하기 시작했다."},{"en":"She is about to embark on an exciting new career.","ko":"그녀는 흥미진진한 새 직업에 막 착수하려 한다."}],"grammarNote":"'embark on/upon ~'은 '(새로운 일에) 착수하다, 나서다'라는 뜻의 매우 자주 쓰이는 표현이다. 반의어는 'disembark(하선하다)'이다.","grammarQuiz":[{"sentence":"They decided _____ (embark) on a new adventure together.","ko":"그들은 함께 새로운 모험에 나서기로 결정했다.","answer":"to embark","hint":"to부정사 (목적어)"}]},

    {"id":"w01704","w":"desperate","pos":["adj"],"ph":"/ˈdespərɪt/","cefr":"B2","kr":["절박한","필사적인"],"ex":[{"en":"He made a desperate attempt.","ko":"그는 필사적인 시도를 했다."}],"mnemonic":{"soundHint":"데스퍼릿","story":"despair + ate → 절망에 빠져 절박한","hintConfidence":3},"pairs":{"buddyWords":[{"w":"hopeless","ko":"절망적인","reason":"동의어 — 가망 없는"},{"w":"frantic","ko":"필사적인","reason":"동의어 — 다급한"},{"w":"hopeful","ko":"희망찬","reason":"반의어 — 정반대"}],"collocBest":[{"en":"a desperate attempt","ko":"필사적인 시도"},{"en":"desperate for help","ko":"도움이 절실한"}]},"nuance":{"koSimple":"궁지에 몰려 절박하게 무엇이든 시도하려는 심정이다.","whenToUse":"간절히 원하거나 극한 상황에서 필사적일 때 쓴다."},"krDetail":[{"ko":"절박한","explain":"매우 급하고 다급한"},{"ko":"필사적인","explain":"목숨 걸 만큼 간절한"}],"usageExamples":[{"en":"He was desperate for a job after months of searching.","ko":"그는 몇 달간 구직 끝에 일자리가 절박했다."},{"en":"They made a desperate effort to save the child.","ko":"그들은 아이를 구하려 필사적인 노력을 했다."}],"grammarNote":"'be desperate for+명사' 또는 'be desperate to+동사원형(간절히 ~하고 싶다)' 형태로 쓰인다. 부사형은 desperately이다.","grammarQuiz":[{"sentence":"The dire financial situation made him _____ for any possible solution.","ko":"그 절박한 재정 상황은 그를 어떤 가능한 해결책이든 필사적으로 원하게 만들었다.","answer":"desperate","hint":"5형식 - make + O + 형용사(C)"}]},
    {"id":"w01998","w":"elegant","pos":["adj"],"ph":"/ˈɛlɪɡənt/","cefr":"B2","kr":["우아한","품위 있는"],"ex":[{"en":"She wore an elegant dress.","ko":"그녀는 우아한 드레스를 입었다."}],"mnemonic":{"soundHint":"'엘레강트' → 우아한 프랑스풍 = 우아한","story":"'엘레강트'한 롱드레스로 파티장에 등장한 여배우.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"graceful","ko":"우아한","reason":"동의어 — 품위 있음"},{"w":"refined","ko":"세련된","reason":"동의어 — 고상함"},{"w":"clumsy","ko":"어색한","reason":"반의어 — 정반대"}],"collocBest":[{"en":"an elegant dress","ko":"우아한 드레스"},{"en":"an elegant solution","ko":"품위 있는 해결책"}]},"nuance":{"koSimple":"단정하면서 세련된 우아함을 뜻한다.","whenToUse":"옷차림·해법·디자인의 품격을 칭찬할 때 쓴다."},"krDetail":[{"ko":"우아한","explain":"고급스럽고 아름다운"},{"ko":"품위 있는","explain":"격조가 느껴지는"}],"usageExamples":[{"en":"The hotel lobby was decorated in an elegant style.","ko":"그 호텔 로비는 우아한 양식으로 꾸며져 있었다."},{"en":"He offered an elegant solution to a difficult problem.","ko":"그는 어려운 문제에 대해 품위 있는 해법을 내놓았다."}],"grammarNote":"'elegant'은 사람·옷·디자인뿐 아니라 'elegant solution(간결하고 훌륭한 해법)'처럼 논리·해결책을 칭찬할 때도 쓰인다. 명사형은 'elegance'.","grammarQuiz":[{"sentence":"The dress _____ she wore last night was very elegant.","ko":"그녀가 지난밤에 입었던 그 드레스는 매우 우아했다.","answer":"that","hint":"관계대명사 (목적격)"}]},

    {"id":"w02134","w":"erratic","pos":["adj"],"ph":"/ɪˈræt.ɪk/","cefr":"B2","kr":["불규칙한","일관성 없는"],"ex":[{"en":"His behavior has been erratic lately.","ko":"그의 행동이 최근에 불규칙했다."}],"mnemonic":{"soundHint":"이래틱 → 이래... 저래... 오락가락","story":"이래(이렇게) 저래(저렇게) 왔다갔다 = 불규칙한.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"irregular","ko":"불규칙한","reason":"동의어 — 일정치 않음"},{"w":"unpredictable","ko":"예측 불가한","reason":"유의어 — 종잡을 수 없음"},{"w":"consistent","ko":"일관된","reason":"반의어 — 정반대"}],"collocBest":[{"en":"erratic behavior","ko":"불규칙한 행동"},{"en":"erratic driving","ko":"일관성 없는 운전"}]},"nuance":{"koSimple":"일정하지 않고 예측하기 어렵게 변덕스러운 상태","whenToUse":"행동·성과·날씨가 들쭉날쭉 불안정할 때 쓰인다"},"krDetail":[{"ko":"불규칙한","explain":"일정하지 않고 들쭉날쭉한"},{"ko":"일관성 없는","explain":"예측이 안 되는"}],"usageExamples":[{"en":"The patient's heartbeat was dangerously erratic.","ko":"그 환자의 심장 박동은 위험할 정도로 불규칙했다."},{"en":"Her erratic driving made the passengers nervous.","ko":"그녀의 불규칙한 운전이 승객들을 불안하게 했다."}],"grammarNote":"행동·성능·움직임이 예측 불가능하다는 부정적 뉘앙스를 갖는 형용사다. 부사형 erratically와 함께 익혀 둔다.","grammarQuiz":[{"sentence":"He shows erratic behavior _____ deeply concerns his family.","ko":"그는 가족을 깊이 걱정시키는 불규칙한 행동을 보인다.","answer":"that","hint":"주격 관계대명사 (사물)"}]},

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  if(DATA.reviewTest && Array.isArray(DATA.basicPool)) return shuffle([...DATA.basicPool]);
  const pool = [];
  const words = [...DATA.newWords];
  const shuffled = shuffle(words).slice(0, 15);
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];

  return pool;
}

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  if(DATA.reviewTest && Array.isArray(DATA.advPool)) return shuffle([...DATA.advPool]);
  return [];
}

  state.sessionElapsedBase = (state.sessionElapsedBase || 0) + (Date.now() - state.startTime);
  state.startTime = Date.now();
  state.xp = 0;
  state.streak = 0;
  state.maxStreak = 0;

}

/* 심화 — 틀린 문제만 재도전 (시간은 리셋 없이 누적) */
function startAdvancedRetryWrong(){
  const wrongPool = shuffle([...state.quizWrongItems]);
  if(!wrongPool.length){ renderHome(); return; }
  state.phase = "quiz";
  state.quizType = "advanced";
  state.quizPool = wrongPool;
  state.quizIdx = 0;
  state.quizCorrect = 0;
  state.quizWrongIds = new Set();
  state.quizWrongItems = [];
  // 이전 세션 경과시간 누적 → 새 startTime 설정
  state.sessionElapsedBase = (state.sessionElapsedBase || 0) + (Date.now() - state.startTime);
  state.startTime = Date.now();
  state.xp = 0;
  state.streak = 0;
  state.maxStreak = 0;
  state.perChapterMaxStreak = 0;
  startTimer();
  renderQuiz();
}

function startQuiz(){
  state.phase = "quiz";
  state.quizPool = buildQuizPool();
  state.quizIdx = 0;
  state.quizCorrect = 0;
  state.quizWrongIds = new Set();
  state.quizWrongItems = [];
  renderQuiz();
}

function renderQuiz(){
  if(state.quizIdx >= state.quizPool.length){
    finishSession();
    return;
  }
  state.quizAnswered = false;
  state.quizCurrent = state.quizPool[state.quizIdx];
  renderHeader();

  const { word, mode } = state.quizCurrent;
  const main = document.getElementById("main");

  let modeLabel = ({
    "meaning-mcq":"영→한 의미",
    "word-mcq":"한→영 단어",
    "spelling":"철자 입력",
    "listening":"듣고 받아쓰기",
    "colloc-write":"🎯 콜로케이션 영작",
    "cloze":"🎯 예문 빈칸 채우기",
    "grammar-fill":"📌 문법 서술형 빈칸",
    "rt-ex-mcq":"📝 예문 빈칸 선택"
  })[mode] || mode;

  let promptHTML = "";
  let answerHTML = "";

  if(mode === "meaning-mcq"){
    const correct = word.kr[0];
    const distractors = pickDistractors(word, "kr", 3);
    const opts = shuffle([correct, ...distractors]);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">다음 단어의 뜻은?</div>
        <div class="qword">${escape(word.w)}</div>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}
      </div>`;
  } else if(mode === "word-mcq"){
    const correct = word.w;
    const distractors = pickDistractors(word, "w", 3);
    const opts = shuffle([correct, ...distractors]);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">다음 뜻의 단어는?</div>
        <div class="qkr">${escape(word.kr.join(" · "))}</div>
      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}
      </div>`;
  } else if(mode === "rt-ex-mcq"){
    const s = state.quizCurrent.sentence;
    const bIdx = state.quizCurrent.blankTokenIdx;
    const toks = (function(str){
      const t = []; const re = /([A-Za-z']+)|([^A-Za-z']+)/g; let m;
      while((m = re.exec(str)) !== null){
        if(m[1]) t.push({ word:true, text:m[1] });
        else t.push({ word:false, text:m[2] });
      }
      return t;
    })(s.en);
    const displayEn = toks.map((t,i) => i === bIdx ? '_____' : t.text).join('');
    const correct = word.w;
    const distractors = pickDistractors(word, "w", 3);
    const opts = shuffle([correct, ...distractors]);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">📝 빈칸에 들어갈 단어는?</div>
        <div class="qkr" style="font-size:.9rem;opacity:.85;">${escape(s.ko)}</div>
        <div class="qword" style="font-size:1.05rem;line-height:1.55;letter-spacing:.01em;margin-top:8px;">${escape(displayEn)}</div>
      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}
      </div>`;
  } else if(mode === "spelling"){
    const rtLabel = DATA.reviewTest ? "뜻과 첫 글자를 보고 단어 완성" : "뜻을 보고 영어 단어를 입력하세요";
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">${rtLabel} <span class="prefill-hint">(첫 글자는 잠겨 있음)</span></div>
        <div class="qkr">${escape(word.kr.join(" · "))}</div>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <div class="word-answer" id="wordAnswer" data-answer="${escape(word.w)}"></div>
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "listening"){
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">발음을 듣고 단어를 입력하세요 <span class="prefill-hint">(첫 글자는 잠겨 있음)</span></div>
        <button class="lis-btn" id="lisBtn">🔊 다시 듣기</button>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <div class="word-answer" id="wordAnswer" data-answer="${escape(word.w)}"></div>
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "colloc-write"){
    const c = state.quizCurrent.colloc;
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">뜻에 맞는 <b>콜로케이션</b>을 영어로 쓰세요 <span class="prefill-hint">(각 단어 첫 글자 잠금)</span></div>
        <div class="qkr">${escape(c.ko)}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <div class="word-answer" id="wordAnswer" data-answer="${escape(c.en)}"></div>
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "cloze"){
    const { tokens, blankIdxs, sentence } = state.quizCurrent;
    const sentHTML = tokens.map((t, i) => {
      const bIdx = blankIdxs.indexOf(i);
      if(bIdx >= 0){
        return `<span class="word-answer inline cloze-wa" data-blank-idx="${bIdx}" data-answer="${escape(t.text)}"></span>`;
      }
      return escape(t.text);
    }).join("");
    promptHTML = `
      <div class="quiz-prompt cloze-prompt">
        <div class="label">해석에 맞게 <b>${blankIdxs.length}개 빈칸</b>을 채우세요 <span class="prefill-hint">(각 단어 첫 글자 잠금)</span></div>
        <div class="qkr">${escape(sentence.ko)}</div>
        <div class="cloze-sentence">${sentHTML}</div>
      </div>`;
    answerHTML = `
      <div class="input-box only-btn">
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "grammar-fill"){
    const { quiz } = state.quizCurrent;
    const ansList = Array.isArray(quiz.answer) ? quiz.answer : [quiz.answer];
    let blankSeq = 0;
    const sentHTML = escape(quiz.sentence).replace(/_{3,}/g, () => {
      const ans = ansList[blankSeq] ?? ansList[0];
      const idx = blankSeq++;
      return `<span class="word-answer inline cloze-wa" data-blank-idx="${idx}" data-answer="${escape(ans)}"></span>`;
    });
    promptHTML = `
      <div class="quiz-prompt cloze-prompt grammar-prompt">
        <div class="label">📌 <b>문법 포인트</b> — 해석에 맞게 빈칸을 채우세요 <span class="prefill-hint">(각 단어 첫 글자 잠금)</span></div>
        <div class="qkr">${escape(quiz.ko)}</div>
        <div class="cloze-sentence">${sentHTML}</div>
      </div>`;
    answerHTML = `
      <div class="input-box only-btn">
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  }

  main.innerHTML = `
    <div class="quiz-stage">
      <div class="quiz-header">
        <div class="quiz-num">문제 <b>${state.quizIdx+1}</b> / ${state.quizPool.length}</div>
        <div class="quiz-mode">${modeLabel}</div>
      </div>
      <div class="quiz-card">
        ${promptHTML}
        ${answerHTML}
        <div class="feedback" id="feedback"></div>
      </div>
    </div>
  `;

  // wire
  if(mode === "meaning-mcq" || mode === "word-mcq" || mode === "rt-ex-mcq"){
    document.querySelectorAll(".choice").forEach(btn=>{
      btn.addEventListener("click", ()=> handleChoice(btn));
    });
  } else if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    containers.forEach(c => renderWordAnswer(c, c.dataset.answer));
    document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    const first = document.querySelector(".cloze-wa .rest-input");
    if(first) setTimeout(()=>first.focus(), 100);
  } else {
    const container = document.getElementById("wordAnswer");
    renderWordAnswer(container, container.dataset.answer);
    document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    const first = container.querySelector(".rest-input");
    if(first) setTimeout(()=>first.focus(), 100);
    if(mode === "listening"){
      setTimeout(()=>speak(word.w), 250);
      document.getElementById("lisBtn").addEventListener("click", ()=>speak(word.w));
    }
  }
}

function pickDistractors(word, field, n){
  const pool = DATA.newWords.filter(w=>w.id !== word.id);
  shuffle(pool);
  const seen = new Set();
  const out = [];
  for(const w of pool){
    let v;
    if(field === "kr") v = w.kr[0];
    else if(field === "w") v = w.w;
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function handleChoice(btn){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { word, mode } = state.quizCurrent;
  const picked = btn.dataset.v;
  const correct = (mode === "meaning-mcq") ? word.kr[0] : word.w;
  const isCorrect = picked === correct;

  document.querySelectorAll(".choice").forEach(c=>{
    if(c.dataset.v === correct) c.classList.add("correct");
    else if(c === btn && !isCorrect) c.classList.add("wrong");
    else c.classList.add("dimmed");
  });

  finishQuestion(isCorrect);
}

function handleSubmit(){
  if(state.quizAnswered) return;
  const { word, mode } = state.quizCurrent;

  // ── 심화: 예문 빈칸 · 문법 빈칸 ────────────────────────
  if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    if(containers.some(anyWordEmpty)) return;
    state.quizAnswered = true;
    let allOk = true;
    containers.forEach(function(c){
      const guess = normalizeAnswer(collectWordAnswer(c));
      const ans = normalizeAnswer(c.dataset.answer);
      const okAll = guess === ans;
      const perGroup = Array.from(c.querySelectorAll('.word-group')).map(function(g, i){
        const w = (c.dataset.answer || '').split(/\s+/)[i] || '';
        const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
        return normalizeAnswer(combined) === normalizeAnswer(w);
      });
      markWordAnswer(c, perGroup);
      if(!okAll) allOk = false;
    });
    document.getElementById("submitBtn").disabled = true;
    if(!allOk){
      const answers = containers.map(function(c){ return `<b style="color:var(--grade)">${escape(c.dataset.answer)}</b>`; }).join(" , ");
      document.getElementById("feedback").innerHTML = `정답: ${answers}`;
    }
    finishQuestion(allOk);
    return;
  }

  // ── 기본/심화 단일 컨테이너: spelling / listening / colloc-write
  const container = document.getElementById("wordAnswer");
  if(!container) return;
  if(anyWordEmpty(container)) return;
  state.quizAnswered = true;
  const correctAns = container.dataset.answer;
  const guess = normalizeAnswer(collectWordAnswer(container));
  const isCorrect = guess === normalizeAnswer(correctAns);
  const perGroup = Array.from(container.querySelectorAll('.word-group')).map(function(g, i){
    const w = (correctAns || '').split(/\s+/)[i] || '';
    const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
    return normalizeAnswer(combined) === normalizeAnswer(w);
  });
  markWordAnswer(container, perGroup);
  document.getElementById("submitBtn").disabled = true;
  if(!isCorrect){
    document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(correctAns)}</b>`;
  }
  finishQuestion(isCorrect);
}

function finishQuestion(isCorrect){
  const { word } = state.quizCurrent;
  const fb = document.getElementById("feedback");
  if(isCorrect){
    state.quizCorrect++;
    state.streak++;
    state.xp += DATA.xpTable.correct;
    promoteBox(word.id);
    SFX.correct();
    fb.classList.add("ok");
    fb.textContent = "정답! +" + DATA.xpTable.correct + " XP " + (state.cbMode ? "✓" : "");
    document.querySelector(".quiz-card").classList.add("bounce-correct");
    handleStreak();
  } else {
    state.streak = 0;
    demoteBox(word.id);
    state.quizWrongIds.add(word.id);
    state.quizWrongItems.push(state.quizCurrent);
    SFX.wrong();
    fb.classList.add("bad");
    if(!fb.textContent) fb.textContent = "오답! " + (state.cbMode ? "✕ " : "") + " 정답: " + word.w;
    document.querySelector(".quiz-card").classList.add("shake");
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.perChapterMaxStreak = Math.max(state.perChapterMaxStreak, state.streak);
  renderHeader();

  setTimeout(()=>{
    state.quizIdx++;
    renderQuiz();
  }, isCorrect ? 900 : 1500);
}

/* ============================================================
   RESULT
   ============================================================ */
function finishSession(){
  state.phase = "result";
  if(state.tickHandle) clearInterval(state.tickHandle);
  const total = state.quizPool.length;
  const correct = state.quizCorrect;
  const pct = Math.round(correct / total * 100);
  const isPerfect = correct === total;
  const elapsed = Date.now() - state.startTime + (state.sessionElapsedBase || 0);

  const isAdv = state.quizType === "advanced";
  const clearFlag = isAdv ? "advancedCleared" : "chapterCleared";
  const clearKey  = isAdv ? (KEY+":cleared_adv") : (KEY+":cleared");
  const resultKey = isAdv ? (KEY+":lastResult_adv") : (KEY+":lastResult");

  // chapter clear?
  let bonusXP = 0;
  const newCleared = !state[clearFlag];
  if(newCleared){
    bonusXP += DATA.xpTable.firstClear;
    state[clearFlag] = true;
    lsSet(clearKey, true);
  }
  // 기본단계 90%+ 달성 → 심화 잠금 해제 (한 번 해금되면 유지)
  let newUnlock = false;
  if(!isAdv && pct >= 90 && !state.basicThresholdPassed){
    state.basicThresholdPassed = true;
    lsSet(KEY+":basic_90pct", true);
    newUnlock = true;
  }
  if(isPerfect){
    bonusXP += DATA.xpTable.perfectChapter;
    state.perfectFlag = true;
  }
  state.xp += bonusXP;
  state.xpTotal += state.xp;
  state.globalMaxStreak = Math.max(state.globalMaxStreak, state.maxStreak);
  lsSet(XP_GLOBAL_KEY, state.xpTotal);
  lsSet(MAXSTREAK_KEY, state.globalMaxStreak);
  lsSet(resultKey, { date:Date.now(), correct, total, xp:state.xp, elapsed });

  // badges
  const earnedBadges = [];
  if(newCleared) earnedBadges.push(DATA.badges.find(b=>b.id==="first-step"));
  if(state.maxStreak >= 10) earnedBadges.push(DATA.badges.find(b=>b.id==="streak-10"));
  if(isPerfect) earnedBadges.push(DATA.badges.find(b=>b.id==="perfect"));

  renderHeader();

  const main = document.getElementById("main");
  const stageLbl = isAdv ? "심화단계" : "기본단계";
  const passedM3 = (pct >= 60) && (DATA.grade === '중3');
  const isHighGrade = ['고1','고2','수능'].includes(DATA.grade);
  const highGradePerfect = isHighGrade && isAdv && isPerfect;
  const highGradeMsg = highGradePerfect ? pickHGMessage() : null;
  const title = highGradeMsg
    ? `🏆 ${escape(highGradeMsg)}`
    : passedM3
      ? `💰 방금 당신의 미래 연봉이 10만원 더 올라갔슴돠!!`
      : (isPerfect ? `🎊 ${stageLbl} 무결점 클리어!` : (pct >= 80 ? `🎉 ${stageLbl} 잘했어요!` : pct >= 60 ? `👍 ${stageLbl} 통과!` : "💪 다시 도전!"));

  // 심화면 [🎯 심화 다시] + [🏠 홈으로]. 기본이면 [🔁 다시 보기] + (심화 해금 시) [🎯 심화 도전]
  const canGoAdvanced = !isAdv && state.basicThresholdPassed;
  const advGrand = isAdv && pct >= 90;   // 심화 90%+ 특별 축포
  const unlockBanner = newUnlock
    ? `<div style="margin:8px auto 6px;padding:10px 14px;border-radius:var(--radius-md);
                   background:linear-gradient(135deg, rgba(168,85,247,.18), rgba(109,40,217,.10));

                   text-align:center;letter-spacing:.02em;">
         🎯 90% 이상 달성 — <b style="color:#c4b5fd">심화단계 해금!</b>
       </div>`
    : "";
  const grandBanner = advGrand
    ? `<div class="grand-banner">
         <div class="grand-line">🎆 당신이 <b>배곧 쵝오</b>! 🎆</div>
         <div class="grand-sub">심화단계 ${pct}% — 지역 랭커 등극!</div>
       </div>`
    : "";
  const hasWrong = state.quizWrongItems.length > 0;
  const actionsHTML = isAdv
    ? `<button class="start-btn" id="retryBtn">🔁 심화 다시</button>
       ${hasWrong ? `<button class="start-btn wrong-only" id="retryWrongBtn">🔴 틀린문제만 (${state.quizWrongItems.length})</button>` : ""}
       <button class="start-btn alt" id="homeBtn">🏠 Home</button>`
    : `<button class="start-btn" id="retryBtn">🔁 다시 보기</button>
       ${hasWrong ? `<button class="start-btn wrong-only" id="retryWrongBtn">🔴 틀린문제만 (${state.quizWrongItems.length})</button>` : ""}
       ${canGoAdvanced ? `<button class="start-btn adv" id="goAdvBtn">🎯 심화단계 도전</button>` : ""}`;

  main.innerHTML = `

      <h2>${title}</h2>

      <div class="score-pct">정답률 ${pct}%</div>

        <div class="result-stat"><div class="l">풀이 시간</div><div class="v">${fmtTime(elapsed)}</div></div>

      showHighGradeCelebration(highGradeMsg);
      SFX.grandFanfare();
      fx.spawn("rainbow-burst");
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.fireworks(); }, 350);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.coinDrop(); }, 800);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.bigWin(); }, 1400);
      setTimeout(()=>{ fx.spawn("rainbow-burst"); SFX.streak(); }, 2100);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.fireworks(); }, 2900);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.coinDrop(); }, 3700);

      return;
    }
    if(advGrand){
      // 심화 90%+ — 화려·명랑 팡파레 + 축포 다량 (배곧 쵝오!)
      fx.spawn("rainbow-burst");
      SFX.grandFanfare();                                          // 브라스 팡파레+아르페지오+종
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.fireworks(); }, 300);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.coinDrop(); }, 700);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.streak(); }, 1300);
      setTimeout(()=>{ fx.spawn("rainbow-burst"); SFX.fireworks(); }, 1900);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.bigWin(); }, 2500);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.coinDrop(); }, 3300);
      setTimeout(()=>{ SFX.grandFanfare(); }, 4000);                // 마지막 대미 팡파레
    } else if(isPerfect){
      fx.spawn("rainbow-burst");
      SFX.bigWin();
      setTimeout(()=>fx.spawn("jackpot-full"), 600);
      setTimeout(()=>SFX.coinDrop(), 700);
    } else if(newCleared){
      fx.spawn("jackpot-full");
      SFX.levelUp();
      setTimeout(()=>SFX.coinDrop(), 500);
    } else if(pct >= 80){
      fx.spawn("reel-spin-small");
      SFX.spinReel();
    }
  }, 250);

  document.getElementById("retryBtn").addEventListener("click", ()=>{
    if(isAdv){ startAdvanced(); }
    else{ renderHome(); }
  });
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    alert("Lv.2 미생성 — 시범 버전입니다.");
  });
  const goAdvBtn = document.getElementById("goAdvBtn");
  if(goAdvBtn) goAdvBtn.addEventListener("click", ()=>{
    state.quizType = "advanced";
    startAdvanced();
  });
  const homeBtn = document.getElementById("homeBtn");
  if(homeBtn) homeBtn.addEventListener("click", ()=> renderHome());
  const retryWrongBtn = document.getElementById("retryWrongBtn");
  if(retryWrongBtn){
    retryWrongBtn.addEventListener("click", ()=>{
      if(isAdv) startAdvancedRetryWrong();
      else startBasicRetryWrong();
    });
  }
}

];

function showHighGradeCelebration(msg){
  const old = document.querySelector('.hg-celebration');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.className = 'hg-celebration';
  const sparkles = ['✨','🎉','🎊','⭐','💫','🌟','🎆','🎇','💥']
    .map((e,i)=>{
      const x = 8 + Math.random()*84, y = 8 + Math.random()*84;
      const d = (Math.random()*1.6).toFixed(2);
      return `<span class="hg-sparkle" style="left:${x}%;top:${y}%;animation-delay:${d}s">${e}</span>`;
    }).join('');
  overlay.innerHTML = `<div class="hg-halo"></div>${sparkles}<div class="hg-msg">${escape(msg)}</div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.remove(), 6100);

      speechSynthesis.cancel();

      u.lang = 'ko-KR'; u.rate = 0.98; u.pitch = 1.12; u.volume = 1;
      const voices = speechSynthesis.getVoices();
      const ko = voices.find(v => /^ko/i.test(v.lang));
      if(ko) u.voice = ko;
      setTimeout(()=>speechSynthesis.speak(u), 400);
    }
  }catch(e){}
}

/* 빈칸 힌트: 정답 문자열의 각 단어 첫 글자를 "a… b…" 형태로 반환
   예: "appeared" → "a…"  ·  "in the absence of" → "i… t… a… o…"  ·  "feel bad" → "f… b…"  */
function firstCharsHint(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'') + '…').join(' ');
}
/* 빈칸 프리필: 정답 각 단어의 첫 글자를 공백으로 이어붙여 반환 (인풋 value 로 채워둠)
   예: "appeared" → "a"  ·  "in the absence of" → "i t a o"  ·  "feel bad" → "f b"  */
function firstCharsPrefill(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'')).join(' ');
}
/* 인풋에 프리필된 첫 글자 잠금 + 커서 이동 훅 부착 */
function attachPrefillGuard(inp){
  const prefill = inp.dataset.prefill || '';
  if(!prefill) return;
  const moveCursorEnd = () => { try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){} };
  inp.addEventListener('focus', () => setTimeout(moveCursorEnd, 0));
  inp.addEventListener('click', () => {
    if(inp.selectionStart < prefill.length) moveCursorEnd();
  });
  inp.addEventListener('keydown', e => {
    // 프리필 영역 보호: 첫 글자들을 지우거나 그 앞으로 이동하는 키 방지
    const s = inp.selectionStart, e2 = inp.selectionEnd;
    if(e.key === 'Backspace' && s <= prefill.length && s === e2){ e.preventDefault(); moveCursorEnd(); return; }
    if(e.key === 'Delete'    && s <  prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
    if((e.key === 'ArrowLeft' || e.key === 'Home') && s <= prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
  });
  inp.addEventListener('input', () => {
    // 사용자 값이 프리필로 시작하지 않으면 프리필을 앞에 다시 붙임 (드래그·잘라내기 등 방지)
    if(!inp.value.startsWith(prefill)){
      inp.value = prefill + inp.value.replace(new RegExp('^' + prefill.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').slice(0,0)),'');
      moveCursorEnd();
    }
  });
}
/* 프리필 인풋에서 사용자가 실제로 추가 입력한 부분이 있는지 (첫 글자만 남은 상태는 미제출) */
function hasUserInput(inp){
  const prefill = inp.dataset.prefill || '';
  return (inp.value||'').trim().length > prefill.trim().length;
}
/* ============================================================
   낱말박스 (자동완성 방어) — 각 단어당 [잠금 첫글자] + [빈 인풋]
   ============================================================ */
function renderWordAnswer(container, answer){
  container.innerHTML = '';
  const words = String(answer || '').trim().split(/\s+/).filter(Boolean);
  words.forEach((word, wi) => {
    const group = document.createElement('span');
    const isSingle = word.length <= 1;
    group.className = 'word-group' + (isSingle ? ' single-letter' : '');
    group.dataset.first = isSingle ? '' : (word[0] || '');
    group.dataset.full = word;
    if(!isSingle){
      const first = document.createElement('span');
      first.className = 'first-letter';
      first.textContent = word[0] || '';
      group.appendChild(first);
    }
    const inp = document.createElement('input');
    inp.className = 'rest-input';
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.autocorrect = 'off';
    inp.setAttribute('autocapitalize','off');
    inp.spellcheck = false;
    inp.inputMode = 'text';
    inp.name = 'wa-' + Math.random().toString(36).slice(2,8);
    inp.dataset.wi = wi;
    inp.setAttribute('aria-label', (wi+1) + '번째 단어의 나머지 스펠링');
    group.appendChild(inp);
    container.appendChild(group);
  });
  wireWordInputs(container);
}
function wireWordInputs(container){
  const inputs = Array.from(container.querySelectorAll('.rest-input'));
  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = (inp.value || '').toLowerCase().replace(/[^a-z'\-]/g,'');
    });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
        else { e.preventDefault(); handleSubmit(); }
      } else if(e.key === 'Tab' && !e.shiftKey){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
      } else if(e.key === 'Backspace' && !inp.value && i > 0){
        e.preventDefault();
        const prev = inputs[i-1];
        prev.focus();
        try{ prev.setSelectionRange(prev.value.length, prev.value.length); }catch(_e){}
      }
    });
  });
}
function collectWordAnswer(container){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  return groups.map(function(g){
    var inp = g.querySelector('.rest-input');
    return (g.dataset.first || '') + (inp ? inp.value : '');
  }).join(' ');
}
function anyWordEmpty(container){
  return Array.from(container.querySelectorAll('.rest-input')).some(function(i){ return !i.value.trim(); });
}
function markWordAnswer(container, perGroupOk){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  groups.forEach(function(g, i){
    g.classList.add(perGroupOk[i] ? 'correct' : 'wrong');
    var inp = g.querySelector('.rest-input');
    if(inp) inp.disabled = true;
  });
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function escape(s){
  if(s == null) return "";
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

document.addEventListener("keydown", e=>{
  if(state.phase === "study"){
    if(e.code === "Space"){ e.preventDefault(); flipCard(); }
    else if(e.key === "1") navCard("prev");
    else if(e.key === "2") navCard("home");
    else if(e.key === "3") navCard("next");
    else if(e.key === "ArrowLeft") navCard("prev");
    else if(e.key === "ArrowRight") navCard("next");
  } else if(state.phase === "quiz" && !state.quizAnswered){
    const mode = state.quizCurrent && state.quizCurrent.mode;
    if(mode === "meaning-mcq" || mode === "word-mcq"){
      const n = parseInt(e.key, 10);
      if(n >= 1 && n <= 4){
        const btns = document.querySelectorAll(".choice");
        if(btns[n-1]) handleChoice(btns[n-1]);
      }
    }
  }
});
