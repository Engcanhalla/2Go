<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고2 Lv.27</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}
  /* 첫글자 프리필 인풋 — 미리 채워진 첫 글자를 시각적으로 강조 */
  .prefill-input{caret-color:#fef3c7;font-family:'Courier New',ui-monospace,monospace;letter-spacing:.05em;font-weight:700;}
  .prefill-hint{color:#c4b5fd;font-size:.82rem;font-weight:500;margin-left:6px;letter-spacing:0;}
  /* ---------- 낱말박스 (자동완성 방어) ---------- */
  .word-answer{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;margin:6px 0;}
  .word-answer.inline{display:inline-flex;gap:8px;vertical-align:middle;margin:0 4px;}
  .word-group{
    display:inline-flex;align-items:center;gap:0;
    background:rgba(11,18,32,.7);border:1.5px solid #334155;border-radius:8px;
    padding:0;transition:all .15s;overflow:hidden;flex-shrink:0;
  }
  .word-group:focus-within{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(168,139,250,.22);}
  .word-group.correct{border-color:var(--grade);background:rgba(16,185,129,.10);}
  .word-group.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);}
  /* 폰트: body 상속 sans-serif (이전 .input-box input과 동일한 스타일) */
  .first-letter{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;padding:0 8px;height:44px;line-height:44px;
    background:linear-gradient(180deg,#3b2966 0%,#2a1e4d 100%);
    color:#fef3c7;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    border-right:1px solid #8b5cf6;user-select:none;
  }
  .rest-input{
    border:0;background:transparent;color:var(--text);outline:none;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    padding:0 10px;height:44px;line-height:44px;width:120px;min-width:90px;
    text-transform:lowercase;
  }
  .rest-input::placeholder{color:#475569;font-weight:400;}
  .word-group.correct .rest-input{color:#a7f3d0;}
  .word-group.wrong .rest-input{color:#fca5a5;}
  .cloze-sentence .word-answer{display:inline-flex;flex-wrap:wrap;gap:6px 8px;margin:0 4px;vertical-align:middle;}
  .cloze-sentence .word-group{border-radius:6px;}
  .cloze-sentence .first-letter{height:38px;line-height:38px;font-size:1.05rem;min-width:22px;padding:0 7px;}
  .cloze-sentence .rest-input{height:38px;line-height:38px;font-size:1.05rem;width:100px;min-width:70px;padding:0 9px;}
  /* .input-box input 스타일이 .rest-input을 override 하는 문제 해결 */
  .input-box .word-answer input.rest-input{
    background:transparent;border:0;padding:0 10px;
    min-height:44px;height:44px;line-height:44px;text-align:left;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    width:120px;min-width:90px;box-shadow:none;
  }
  .input-box .word-answer input.rest-input:focus{border:0;box-shadow:none;}
  /* single-letter 그룹 */
  .word-group.single-letter{background:rgba(11,18,32,.5);}
  .word-group.single-letter input.rest-input{width:80px;min-width:60px;}
  .hint-line{margin-top:12px;padding:10px 14px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35);border-radius:10px;color:#c4b5fd;font-size:.95rem;line-height:1.55;text-align:center;letter-spacing:.03em;}
  .hint-line b{color:#fef3c7;font-weight:800;font-family:'Courier New',ui-monospace,monospace;font-size:1.05rem;letter-spacing:.15em;margin:0 2px;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}
  .buddy-item .why{font-size:.86rem;color:var(--back-muted);opacity:1;display:block;width:100%;margin-top:3px;font-style:italic;}
  .ex-line{font-size:1.03rem;line-height:1.55;}
  .ex-line .en{color:#f8fafc;font-style:italic;font-weight:500;}
  .ex-line .ko{color:var(--back-muted-strong);font-size:.94rem;display:block;margin-top:4px;font-weight:500;}
  /* 콜로케이션·예문 재생 버튼 */
  .speak-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;flex:0 0 26px;
    padding:0;margin-right:8px;
    border:1px solid rgba(59,130,246,.35);
    background:rgba(59,130,246,.10);
    color:var(--info);
    font-size:.78rem;line-height:1;
    border-radius:8px;cursor:pointer;
    transition:var(--transition);
  }
  .speak-btn:hover{
    background:rgba(59,130,246,.22);
    border-color:rgba(59,130,246,.55);
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(59,130,246,.20);
  }
  .speak-btn:active{transform:translateY(0);}
  .col-item .en, .ex-line .en{flex:1 1 auto;min-width:0;}
  .ex-line{display:flex;flex-wrap:wrap;align-items:baseline;}

  /* Grade buttons */
  .grade-row{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
    margin-top:14px;
  }
  .grade-btn{
    padding:15px 6px;border-radius:var(--radius-md);
    font-weight:700;font-size:.92rem;
    min-height:56px;
    border:1.5px solid transparent;
    transition:all var(--transition);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .grade-btn .ic{font-size:20px;line-height:1;}
  .grade-btn.prev{background:rgba(59,130,246,.14);color:#93c5fd;border-color:rgba(59,130,246,.35);}
  .grade-btn.home{background:rgba(245,158,11,.12);color:var(--accent-light);border-color:rgba(245,158,11,.30);}
  .grade-btn.next{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.40);}
  .grade-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
  .grade-btn.prev:hover{box-shadow:0 6px 16px rgba(59,130,246,.25);}
  .grade-btn.home:hover{box-shadow:0 6px 16px rgba(245,158,11,.20);}
  .grade-btn.next:hover{box-shadow:0 6px 16px rgba(16,185,129,.30);}
  .grade-btn:active{transform:translateY(0) scale(.97);}
  .grade-btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6);}
  .grade-btn:disabled:hover{transform:none;box-shadow:none;filter:grayscale(.6);}

  .flip-hint{
    text-align:center;color:var(--text-on-dark-muted);
    font-size:.72rem;margin-top:10px;opacity:.6;letter-spacing:.02em;
  }

  /* ---------- QUIZ ---------- */
  .quiz-stage{padding:12px 2px;flex:1;display:flex;flex-direction:column;}
  .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .quiz-num{
    background:var(--bg-card);padding:7px 14px;border-radius:100px;
    font-size:.82rem;font-weight:600;
    border:1px solid rgba(148,163,184,.15);
    color:var(--text-on-dark-muted);
  }
  .quiz-num b{color:var(--grade);font-weight:700;}
  .quiz-mode{
    background:rgba(245,158,11,.12);color:var(--accent-light);
    padding:6px 12px;border-radius:100px;
    font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.22);
  }
  .quiz-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:24px 20px;
    box-shadow:var(--shadow-lg);
    min-height:320px;display:flex;flex-direction:column;
  }
  .quiz-prompt{
    text-align:center;margin-bottom:20px;
  }
  .quiz-prompt .label{
    font-size:.68rem;color:var(--text-on-dark-muted);
    text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:10px;
  }
  .quiz-prompt .qword{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.2rem;font-weight:800;color:var(--text-on-dark);
    line-height:1.15;word-break:break-word;letter-spacing:-1px;
    text-shadow:0 0 24px rgba(16,185,129,.20);
  }
  .quiz-prompt .qkr{font-size:1.5rem;font-weight:700;color:var(--accent-light);line-height:1.3;}
  .quiz-prompt .qph{color:var(--text-on-dark-muted);font-size:.88rem;margin-top:6px;font-style:italic;}
  .quiz-prompt .lis-btn{
    margin:10px auto 0;display:flex;
    background:linear-gradient(135deg, var(--info) 0%, #2563eb 100%);
    color:#ffffff;font-weight:700;font-size:.95rem;
    padding:14px 24px;border-radius:var(--radius-md);align-items:center;gap:8px;
    box-shadow:0 6px 20px rgba(59,130,246,.35), inset 0 1px 0 rgba(255,255,255,.15);
    min-height:48px;transition:all var(--transition);
  }
  .quiz-prompt .lis-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(59,130,246,.42);}
  .quiz-prompt .lis-btn:active{transform:translateY(0) scale(.97);}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.12);
    border-radius:var(--radius-md);padding:14px 16px;
    text-align:left;font-size:.98rem;font-weight:600;color:var(--text-on-dark);
    transition:all var(--transition);
    display:flex;align-items:center;gap:12px;
    min-height:52px;line-height:1.3;
  }
  .choice:hover{background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.22);transform:translateY(-1px);}
  .choice .idx{
    flex-shrink:0;width:26px;height:26px;border-radius:var(--radius-sm);
    background:rgba(148,163,184,.14);color:var(--text-on-dark-muted);
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:700;
    transition:all var(--transition);
  }
  .choice:active{transform:scale(.98);}
  .choice.correct{background:rgba(16,185,129,.16);border-color:var(--grade);color:#a7f3d0;box-shadow:0 4px 16px rgba(16,185,129,.20);}
  .choice.correct .idx{background:var(--grade);color:#0f172a;}
  .choice.wrong{background:rgba(239,68,68,.14);border-color:var(--danger);color:#fca5a5;}
  .choice.wrong .idx{background:var(--danger);color:#fff;}
  .choice.dimmed{opacity:.4;}
  body.cb-mode .choice.correct::after{content:"✓";margin-left:auto;font-size:22px;font-weight:900;}
  body.cb-mode .choice.wrong::after{content:"✕";margin-left:auto;font-size:22px;font-weight:900;}

  .input-box{
    display:flex;flex-direction:column;gap:12px;margin-top:6px;
  }
  .input-box input{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.15);
    border-radius:var(--radius-md);padding:16px;
    color:var(--text-on-dark);font-size:1.15rem;font-weight:600;
    text-align:center;letter-spacing:.5px;
    min-height:52px;outline:none;
    transition:all var(--transition);
  }
  .input-box input:focus{border-color:var(--grade);box-shadow:0 0 0 4px rgba(16,185,129,.15);}
  .input-box input.correct{border-color:var(--grade);background:rgba(16,185,129,.10);color:#a7f3d0;}
  .input-box input.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);color:#fca5a5;}
  .submit-btn{
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1rem;
    padding:15px;border-radius:var(--radius-md);min-height:52px;
    box-shadow:0 6px 20px rgba(16,185,129,.30), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);
  }
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,185,129,.40);}
  .submit-btn:active{transform:translateY(0) scale(.98);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .feedback{
    text-align:center;margin-top:16px;
    min-height:24px;font-weight:700;font-size:.92rem;
    letter-spacing:.02em;
  }
  .feedback.ok{color:#6ee7b7;}
  .feedback.bad{color:#fca5a5;}

  /* ---------- RESULT ---------- */
  .result{text-align:center;padding:20px 4px;}
  .result h2{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2rem;margin:10px 0 6px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg, var(--accent) 0%, var(--grade) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .result .score-big{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:4rem;font-weight:900;line-height:1;
    margin:20px 0 6px;color:var(--grade);letter-spacing:-2px;
    text-shadow:0 0 40px var(--grade-glow-strong);
  }
  .result .score-pct{color:var(--text-on-dark-muted);font-size:1.1rem;font-weight:600;}
  .result .score-time{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:10px;padding:8px 16px;border-radius:var(--radius-lg);
    background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.20);
    color:#f8fafc;font-size:1.05rem;font-weight:600;letter-spacing:.02em;
  }
  .result .score-time b{color:var(--accent-light);font-weight:800;font-variant-numeric:tabular-nums;}
  /* 심화 90%+ 배곧 쵝오 배너 */
  .grand-banner{
    position:relative;margin:14px auto 4px;padding:16px 22px;max-width:520px;
    border-radius:var(--radius-lg);
    background:linear-gradient(135deg,#7c3aed 0%,#db2777 45%,#f59e0b 100%);
    box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;
    text-align:center;overflow:hidden;
    animation:grandPop .8s cubic-bezier(.2,.7,.1,1.4) both, grandGlow 2s ease-in-out infinite alternate;
  }
  .grand-banner::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 50%),
               radial-gradient(circle at 70% 80%, rgba(255,255,255,.25), transparent 50%);
    pointer-events:none;
  }
  .grand-banner .grand-line{
    font-size:1.65rem;font-weight:900;color:#fff;letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.35);position:relative;
  }
  .grand-banner .grand-line b{
    background:linear-gradient(135deg,#fde68a 0%,#fbbf24 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;padding:0 4px;
  }
  .grand-banner .grand-sub{
    margin-top:6px;color:rgba(255,255,255,.95);
    font-size:.98rem;font-weight:700;letter-spacing:.02em;position:relative;
  }
  @keyframes grandPop{
    0%{transform:scale(.7) rotate(-3deg);opacity:0;}
    60%{transform:scale(1.06) rotate(1deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes grandGlow{
    from{box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;}
    to  {box-shadow:0 20px 60px rgba(245,158,11,.65),0 0 0 1px rgba(255,255,255,.35) inset;}
  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:hgFadeIn .35s ease-out both, hgFadeOut .8s ease-in 5.2s forwards;
  }
  .hg-celebration::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),
      radial-gradient(circle at 80% 25%, rgba(236,72,153,.28), transparent 22%),
      radial-gradient(circle at 30% 75%, rgba(59,130,246,.28), transparent 24%),
      radial-gradient(circle at 75% 80%, rgba(16,185,129,.28), transparent 22%);
    animation:hgSwirl 6s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .hg-halo{
    position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg,#fbbf24,#ef4444,#a855f7,#3b82f6,#10b981,#fbbf24);
    mix-blend-mode:screen;opacity:.28;
    animation:hgRotate 12s linear infinite;
  }
  .hg-msg{
    position:relative;font-family:inherit;
    font-size:clamp(28px, 6vw, 68px);font-weight:900;line-height:1.25;text-align:center;
    padding:32px 40px;max-width:92vw;letter-spacing:-.01em;
    background:linear-gradient(90deg,#fbbf24,#ef4444,#ec4899,#a855f7,#3b82f6,#10b981,#fbbf24);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(251,191,36,.75)) drop-shadow(0 0 40px rgba(236,72,153,.45));
    animation:hgRainbow 3.5s linear infinite, hgPop 1.6s cubic-bezier(.2,.7,.1,1.4) both, hgFloat 4s ease-in-out infinite alternate 1.6s;
  }
  .hg-sparkle{
    position:absolute;pointer-events:none;font-size:clamp(24px,3vw,36px);
    animation:hgSparkle 1.8s ease-in-out infinite;
  }
  @keyframes hgFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes hgFadeOut{to{opacity:0;visibility:hidden;}}
  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  @keyframes hgPop{
    0%{transform:scale(.15) rotate(-25deg);opacity:0;}
    35%{transform:scale(1.28) rotate(6deg);opacity:1;}
    55%{transform:scale(.94) rotate(-3deg);}
    75%{transform:scale(1.08) rotate(1.5deg);}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes hgFloat{
    from{transform:translateY(-6px) scale(1);}
    to{transform:translateY(6px) scale(1.02);}
  }
  @keyframes hgSwirl{
    0%{transform:scale(1) rotate(0);}
    100%{transform:scale(1.15) rotate(8deg);}
  }
  @keyframes hgRotate{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes hgSparkle{
    0%,100%{opacity:0;transform:scale(.4) rotate(0deg);}
    50%{opacity:1;transform:scale(1.2) rotate(180deg);}
  }
  .result-stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:22px 0;
  }
  .result-stat{
    background:var(--bg-card);padding:16px 12px;border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.10);
    box-shadow:var(--shadow-md);
    transition:transform var(--transition);
  }
  .result-stat:hover{transform:translateY(-2px);}
  .result-stat .l{font-size:.68rem;color:var(--text-on-dark-muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;}
  .result-stat .v{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.4rem;font-weight:800;color:var(--text-on-dark);margin-top:6px;}
  .result-stat .v.grade-c{color:var(--grade);}
  .result-stat .v.acc-c{color:var(--accent-light);}
  .badges-earned{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 20px;
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-card);padding:8px 14px;border-radius:100px;
    font-size:.82rem;font-weight:700;
    border:1px solid var(--accent);color:var(--accent-light);
    box-shadow:0 0 16px rgba(245,158,11,.22), 0 4px 12px rgba(0,0,0,.3);
    animation:badge-pop .5s cubic-bezier(.2,.7,.1,1.4) backwards;
  }
  .badge .ic{font-size:1.1rem;}
  @keyframes badge-pop{from{transform:scale(.4) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ---------- ANIMATIONS ---------- */
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  @keyframes bounce-correct{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .shake{animation:shake .22s ease;}
  .bounce-correct{animation:bounce-correct .32s ease;}

  /* ---------- CANVAS (particles) ---------- */
  #fxCanvas{
    position:fixed;inset:0;pointer-events:none;z-index:50;
  }

  /* ---------- TOAST ---------- */
  .toast-wrap{
    position:fixed;top:88px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;z-index:40;
  }
  .toast{
    background:rgba(15,23,42,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--accent-light);
    padding:10px 18px;border-radius:100px;font-weight:700;font-size:.86rem;
    letter-spacing:.02em;
    border:1px solid rgba(245,158,11,.35);
    box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 20px rgba(245,158,11,.15);
    animation:toast-in .3s cubic-bezier(.4,0,.2,1), toast-out .45s cubic-bezier(.4,0,.2,1) 1.4s forwards;
  }
  .toast.streak{color:var(--accent-light);}
  .toast.big{font-size:1.05rem;padding:14px 24px;border-color:rgba(16,185,129,.4);color:#a7f3d0;box-shadow:0 12px 32px rgba(0,0,0,.5), 0 0 24px rgba(16,185,129,.2);}

    {"id":"n07163","w":"placement","pos":["noun"],"ph":"/ˈpleɪsmənt/","cefr":"B2","kr":["배치","배열"],"ex":[{"en":"The careful placement of the furniture made the room feel larger.","ko":"가구의 세심한 배치가 방을 더 넓어 보이게 했다."}],"mnemonic":{"soundHint":"플레이스먼트","story":"place(놓다)+ment → 배치","hintConfidence":3},"pairs":{"buddyWords":[{"w":"position","ko":"위치","reason":"동의어 — 놓인 자리"},{"w":"arrangement","ko":"배열","reason":"동의어 — 정리해 놓음"},{"w":"removal","ko":"제거","reason":"반의어 — 치워 냄"}],"collocBest":[{"en":"job placement","ko":"취업 알선"},{"en":"strategic placement","ko":"전략적 배치"}]},"nuance":{"koSimple":"사람이나 물건을 특정 자리에 배치하는 것","whenToUse":"인력·물건 배치, 반 편성 이야기할 때 씀"},"krDetail":[{"ko":"배치","explain":"자리를 잡아 놓음"},{"ko":"배열","explain":"차례로 늘어 놓음"}],"usageExamples":[{"en":"The careful placement of cameras around the store improved security.","ko":"매장 곳곳에 신중하게 이루어진 카메라 배치는 보안을 향상시켰다."},{"en":"Good placement of ads on a website can increase the number of clicks.","ko":"웹사이트에서 광고를 잘 배치하면 클릭 수를 늘릴 수 있다."}],"grammarNote":"placement는 동사 place의 명사형으로 '배치·배열'을 뜻한다. 'placement of ~' 형태로 전치사 of와 결합하며, 문맥에 따라 '(취업) 배정·현장 실습'의 의미로도 쓰인다.","grammarQuiz":[{"sentence":"The strategic _____ of cameras helped reduce crime in the area.","ko":"카메라의 전략적 배치는 그 지역의 범죄를 줄이는 데 도움이 되었다.","answer":"placement","hint":"형용사(strategic) 뒤 명사"}]},
    {"id":"n07172","w":"ashamed","pos":["adjective"],"ph":"/əˈʃeɪmd/","cefr":"B2","kr":["부끄러운","창피한"],"ex":[{"en":"He felt deeply ashamed of the way he had treated his friend.","ko":"그는 친구를 대했던 방식에 대해 깊이 부끄러움을 느꼈다."}],"mnemonic":{"soundHint":"어쉐임드","story":"a+shame(수치)+ed → 부끄러운","hintConfidence":3},"pairs":{"buddyWords":[{"w":"embarrassed","ko":"당황한, 창피한","reason":"동의어 — 부끄러움"},{"w":"guilty","ko":"죄책감 드는","reason":"관련어 — 잘못 느낌"},{"w":"proud","ko":"자랑스러운","reason":"반의어 — 정반대"}],"collocBest":[{"en":"ashamed of oneself","ko":"스스로 부끄러워하는"},{"en":"deeply ashamed","ko":"몹시 부끄러운"}]},"nuance":{"koSimple":"자신의 행동에 부끄러움을 느끼는 상태","whenToUse":"수치심·자책감을 표현할 때 씀"},"krDetail":[{"ko":"부끄러운","explain":"낯이 뜨거운"},{"ko":"창피한","explain":"남 보기 부끄러운"}],"usageExamples":[{"en":"She was ashamed to admit that she had forgotten his name.","ko":"그녀는 그의 이름을 잊어버렸다고 인정하기가 부끄러웠다."},{"en":"There is nothing to be ashamed of in asking for help.","ko":"도움을 청하는 것에는 부끄러워할 것이 전혀 없다."}],"grammarNote":"ashamed는 서술적 용법으로만 쓰여 명사를 직접 수식하지 않는다. 'ashamed of + 명사/동명사', 'ashamed to + 동사원형' 형태로 쓴다.","grammarQuiz":[{"sentence":"He felt _____ of his rude behavior at the dinner party.","ko":"그는 저녁 파티에서의 무례한 행동이 부끄러웠다.","answer":"ashamed","hint":"feel + 형용사 + of 구조"}]},
    {"id":"n07176","w":"continually","pos":["adverb"],"ph":"/kənˈtɪnjuəli/","cefr":"B2","kr":["계속해서","끊임없이"],"ex":[{"en":"The software is continually updated to fix new security issues.","ko":"그 소프트웨어는 새로운 보안 문제를 해결하기 위해 계속해서 업데이트된다."}],"mnemonic":{"soundHint":"컨티뉴얼리","story":"continue(계속)+al+ly → 끊임없이","hintConfidence":3},"pairs":{"buddyWords":[{"w":"constantly","ko":"끊임없이","reason":"동의어 — 계속"},{"w":"repeatedly","ko":"반복해서","reason":"동의어 — 자꾸"},{"w":"occasionally","ko":"가끔","reason":"반의어 — 이따금"}],"collocBest":[{"en":"continually improve","ko":"끊임없이 개선하다"},{"en":"continually changing","ko":"계속 변화하는"}]},"nuance":{"koSimple":"쉼 없이 계속해서 반복적으로 이어지는","whenToUse":"끊이지 않고 자주 반복될 때 씀"},"krDetail":[{"ko":"계속해서","explain":"쉬지 않고 이어서"},{"ko":"끊임없이","explain":"끊이지 않고 자꾸"}],"usageExamples":[{"en":"Prices have continually risen throughout the past year.","ko":"지난 한 해 동안 물가가 계속해서 올랐다."},{"en":"He continually interrupts other people during meetings.","ko":"그는 회의 중에 끊임없이 다른 사람들의 말을 끊는다."}],"grammarNote":"continually는 '반복적으로 자주'라는 뜻의 부사로, '끊김 없이 계속'을 뜻하는 continuously와 의미 차이가 있다. 보통 일반동사 앞이나 문장 끝에 온다.","grammarQuiz":[{"sentence":"Technology is _____ evolving, so we must keep learning new skills.","ko":"기술은 계속해서 발전하고 있으므로, 우리는 새로운 기술을 배워야 한다.","answer":"continually","hint":"be동사 + 부사 + 현재분사 구조"}]},
    {"id":"n07179","w":"alternative","pos":["noun","adjective"],"ph":"/ɔːlˈtɜːrnətɪv/","cefr":"B2","kr":["대안","대체의"],"ex":[{"en":"Scientists are searching for a cleaner alternative to fossil fuels.","ko":"과학자들은 화석 연료를 대체할 더 깨끗한 대안을 찾고 있다."}],"mnemonic":{"soundHint":"올터너티브","story":"alter(바꾸다)+native → 다른 선택","hintConfidence":3},"pairs":{"buddyWords":[{"w":"option","ko":"선택지","reason":"동의어 — 고를 것"},{"w":"substitute","ko":"대체물","reason":"동의어 — 바꿔 씀"},{"w":"original","ko":"원래의 것","reason":"반의어 — 본래"}],"collocBest":[{"en":"viable alternative","ko":"실행 가능한 대안"},{"en":"alternative energy","ko":"대체 에너지"}]},"nuance":{"koSimple":"기존 것을 대신할 수 있는 다른 선택지","whenToUse":"대체안·다른 방법을 제시할 때 씀"},"krDetail":[{"ko":"대안","explain":"대신할 다른 방법"},{"ko":"대체의","explain":"대신 쓸 수 있는"}],"usageExamples":[{"en":"If the train is full, taking a bus is a good alternative.","ko":"기차가 만석이면 버스를 타는 것이 좋은 대안이다."},{"en":"Many drivers are switching to alternative sources of energy.","ko":"많은 운전자들이 대체 에너지원으로 바꾸고 있다."}],"grammarNote":"alternative는 명사(대안)와 형용사(대체의)로 모두 쓰인다. 명사일 때는 'an alternative to ~(~에 대한 대안)'처럼 전치사 to와 결합한다.","grammarQuiz":[{"sentence":"We need to find an _____ to fossil fuels before it is too late.","ko":"너무 늦기 전에 화석 연료의 대안을 찾아야 한다.","answer":"alternative","hint":"an + 명사 + to ~ 구조"}]},
    {"id":"n07180","w":"fairness","pos":["noun"],"ph":"/ˈfɛrnəs/","cefr":"B2","kr":["공정성","공평함"],"ex":[{"en":"The judge was widely respected for her sense of fairness.","ko":"그 판사는 공정성에 대한 감각으로 널리 존경받았다."}],"mnemonic":{"soundHint":"페어니스","story":"fair(공정한)+ness → 공정함","hintConfidence":3},"pairs":{"buddyWords":[{"w":"justice","ko":"정의","reason":"동의어 — 올바름"},{"w":"equity","ko":"형평, 공평","reason":"동의어 — 치우침 없음"},{"w":"bias","ko":"편향","reason":"반의어 — 치우침"}],"collocBest":[{"en":"sense of fairness","ko":"공정성에 대한 감각"},{"en":"in fairness","ko":"공정하게 말하면"}]},"nuance":{"koSimple":"치우침 없이 공정하고 정당한 태도","whenToUse":"규칙·판정의 공평함을 강조할 때 씀"},"krDetail":[{"ko":"공정성","explain":"치우침 없이 올바름"},{"ko":"공평함","explain":"한쪽에 치우치지 않음"}],"usageExamples":[{"en":"Teachers must treat every student with fairness.","ko":"교사는 모든 학생을 공정하게 대해야 한다."},{"en":"In fairness, he did warn us about the risks beforehand.","ko":"공평하게 말하자면, 그는 미리 위험에 대해 우리에게 경고하긴 했다."}],"grammarNote":"fairness는 형용사 fair에 -ness가 붙은 추상명사로 셀 수 없다. 'a sense of fairness', 'in fairness (to ~)(~에게 공정하게 말하자면)' 같은 관용 표현으로 자주 쓰인다.","grammarQuiz":[{"sentence":"Children develop a strong sense of _____ from an early age.","ko":"아이들은 어린 나이부터 강한 공정성 감각을 발달시킨다.","answer":"fairness","hint":"a sense of + 명사 구조"}]},
    {"id":"n07181","w":"mindset","pos":["noun"],"ph":"/ˈmaɪndˌsɛt/","cefr":"B2","kr":["사고방식","마음가짐"],"ex":[{"en":"Adopting a growth mindset helped her overcome repeated failures.","ko":"성장 사고방식을 받아들인 것이 그녀가 반복된 실패를 극복하는 데 도움이 되었다."}],"mnemonic":{"soundHint":"마인드셋","story":"mind(마음)+set(고정) → 사고방식","hintConfidence":3},"pairs":{"buddyWords":[{"w":"attitude","ko":"태도","reason":"동의어 — 마음 자세"},{"w":"mentality","ko":"심리, 사고방식","reason":"동의어 — 생각 방식"},{"w":"outlook","ko":"관점, 전망","reason":"관련어 — 바라보는 눈"}],"collocBest":[{"en":"growth mindset","ko":"성장 사고방식"},{"en":"positive mindset","ko":"긍정적인 마음가짐"}]},"nuance":{"koSimple":"세상을 바라보는 몸에 밴 사고방식","whenToUse":"태도·관점의 습관적 틀을 말할 때 씀"},"krDetail":[{"ko":"사고방식","explain":"생각하는 방식"},{"ko":"마음가짐","explain":"마음의 자세"}],"usageExamples":[{"en":"Changing your mindset can completely change how you handle failure.","ko":"사고방식을 바꾸면 실패를 다루는 방식을 완전히 바꿀 수 있다."},{"en":"A positive mindset helps teams stay motivated under pressure.","ko":"긍정적인 마음가짐은 팀이 압박 속에서도 동기를 유지하도록 돕는다."}],"grammarNote":"mindset은 셀 수 있는 명사로 보통 형용사와 결합해 'a positive/fixed/growth mindset'처럼 쓴다. 'change/adopt/have a mindset' 같은 동사와 자주 어울린다.","grammarQuiz":[{"sentence":"Having a growth _____ helps students overcome academic challenges.","ko":"성장 마인드셋을 갖는 것은 학생들이 학업의 어려움을 극복하도록 돕는다.","answer":"mindset","hint":"growth + 명사 복합어"}]},
    {"id":"n07185","w":"phenomena","pos":["noun"],"ph":"/fɪˈnɑːmɪnə/","cefr":"B2","kr":["현상들"],"ex":[{"en":"Scientists still cannot fully explain certain natural phenomena.","ko":"과학자들은 여전히 특정 자연 현상들을 완전히 설명하지 못한다."}],"mnemonic":{"soundHint":"피노메나","story":"phenomenon(현상)의 복수","hintConfidence":3},"pairs":{"buddyWords":[{"w":"phenomenon","ko":"현상","reason":"단수형 — 하나일 때"},{"w":"occurrence","ko":"일어난 일","reason":"동의어 — 생긴 일"},{"w":"event","ko":"사건","reason":"관련어 — 벌어진 일"}],"collocBest":[{"en":"natural phenomena","ko":"자연 현상들"},{"en":"observe phenomena","ko":"현상들을 관찰하다"}]},"nuance":{"koSimple":"관찰되는 여러 현상, phenomenon의 복수형","whenToUse":"자연·사회의 여러 현상을 논할 때 씀"},"krDetail":[{"ko":"현상들","explain":"눈에 보이는 여러 일"}],"usageExamples":[{"en":"Rainbows and lightning are natural phenomena we still find fascinating.","ko":"무지개와 번개는 우리가 여전히 매혹적으로 느끼는 자연 현상들이다."},{"en":"Social media has created new phenomena that researchers are still studying.","ko":"소셜 미디어는 연구자들이 여전히 연구하고 있는 새로운 현상들을 만들어 냈다."}],"grammarNote":"phenomena는 phenomenon의 복수형(불규칙)으로 복수 동사와 일치한다. 단수형 phenomenon과 혼동하여 'a phenomena'로 쓰지 않도록 주의한다.","grammarQuiz":[{"sentence":"Natural _____ such as earthquakes and volcanoes have fascinated scientists for centuries.","ko":"지진과 화산 같은 자연 현상들은 수세기 동안 과학자들을 매료시켰다.","answer":"phenomena","hint":"phenomenon의 복수형 (복수 주어)"}]},
    {"id":"n07202","w":"predictable","pos":["adjective"],"ph":"/prɪˈdɪktəbəl/","cefr":"B2","kr":["예측 가능한"],"ex":[{"en":"The ending of the movie was so predictable that no one was surprised.","ko":"그 영화의 결말은 너무 예측 가능해서 아무도 놀라지 않았다."}],"mnemonic":{"soundHint":"프리딕터블","story":"pre(미리)+dict(말하다)+able → 예측 가능한","hintConfidence":3},"pairs":{"buddyWords":[{"w":"foreseeable","ko":"예견할 수 있는","reason":"동의어 — 미리 앎"},{"w":"expected","ko":"예상되는","reason":"동의어 — 짐작됨"},{"w":"unpredictable","ko":"예측 불가능한","reason":"반의어 — 정반대"}],"collocBest":[{"en":"highly predictable","ko":"매우 예측 가능한"},{"en":"predictable outcome","ko":"예측 가능한 결과"}]},"nuance":{"koSimple":"결과를 미리 짐작할 수 있는 성질","whenToUse":"뻔한 전개·행동을 묘사할 때 씀"},"krDetail":[{"ko":"예측 가능한","explain":"미리 알 수 있는"}],"usageExamples":[{"en":"His reaction was completely predictable to everyone who knew him.","ko":"그의 반응은 그를 아는 모든 사람에게 완전히 예측 가능한 것이었다."},{"en":"The bus schedule is predictable, so we rarely wait very long.","ko":"버스 시간표가 예측 가능해서 우리는 오래 기다리는 일이 거의 없다."}],"grammarNote":"predictable은 동사 predict에 -able이 붙어 '예측할 수 있는'을 뜻하는 형용사다. 부사형은 predictably, 반대말은 unpredictable이다.","grammarQuiz":[{"sentence":"The plot of the movie was so _____ that I guessed the ending in the first ten minutes.","ko":"그 영화의 줄거리는 너무 예측 가능해서 처음 10분 만에 결말을 맞혔다.","answer":"predictable","hint":"so + 형용사 + that 구문"}]},
    {"id":"n07211","w":"commitment","pos":["noun"],"ph":"/kəˈmɪtmənt/","cefr":"B2","kr":["헌신","약속","전념"],"ex":[{"en":"Her commitment to the project impressed everyone on the team.","ko":"그 프로젝트에 대한 그녀의 헌신은 팀의 모든 사람에게 깊은 인상을 주었다."}],"mnemonic":{"soundHint":"커미트먼트","story":"commit(약속)+ment → 헌신","hintConfidence":3},"pairs":{"buddyWords":[{"w":"dedication","ko":"헌신","reason":"동의어 — 온 힘 바침"},{"w":"promise","ko":"약속","reason":"동의어 — 다짐"},{"w":"indifference","ko":"무관심","reason":"반의어 — 관심 없음"}],"collocBest":[{"en":"strong commitment","ko":"강한 헌신"},{"en":"make a commitment","ko":"약속하다"}]},"nuance":{"koSimple":"책임을 지고 끝까지 지키려는 약속·헌신","whenToUse":"의무·헌신·전념 상태를 말할 때 씀"},"krDetail":[{"ko":"헌신","explain":"몸과 마음을 다 바침"},{"ko":"약속","explain":"꼭 하겠다는 다짐"},{"ko":"전념","explain":"오직 그것에만 몰두"}],"usageExamples":[{"en":"Marriage is a serious commitment that requires effort from both people.","ko":"결혼은 두 사람 모두의 노력을 요구하는 진지한 헌신이다."},{"en":"The team showed great commitment by practicing every single weekend.","ko":"그 팀은 주말마다 연습하며 대단한 헌신을 보여 주었다."}],"grammarNote":"commitment는 'commitment to ~(~에 대한 헌신·약속)' 형태로 전치사 to와 결합하며, to 뒤에는 명사나 동명사가 온다. 동사형은 commit이다.","grammarQuiz":[{"sentence":"Success in any field requires dedication and long-term _____.","ko":"어떤 분야에서든 성공하려면 헌신과 장기적인 전념이 필요하다.","answer":"commitment","hint":"and로 연결된 병렬 명사"}]},
    {"id":"n07227","w":"statistical","pos":["adjective"],"ph":"/stəˈtɪstɪkəl/","cefr":"B2","kr":["통계의","통계적인"],"ex":[{"en":"The study found a statistical link between exercise and better sleep.","ko":"그 연구는 운동과 더 나은 수면 사이의 통계적 연관성을 발견했다."}],"mnemonic":{"soundHint":"스터티스티컬","story":"statistic(통계)+al → 통계의","hintConfidence":3},"pairs":{"buddyWords":[{"w":"numerical","ko":"수치의","reason":"관련어 — 숫자 관련"},{"w":"quantitative","ko":"정량적인","reason":"관련어 — 양으로 잼"},{"w":"qualitative","ko":"정성적인","reason":"반의어 — 성질로 봄"}],"collocBest":[{"en":"statistical analysis","ko":"통계 분석"},{"en":"statistical data","ko":"통계 자료"}]},"nuance":{"koSimple":"통계에 기반하거나 통계와 관련된 성격","whenToUse":"수치 자료·확률 분석을 말할 때 씀"},"krDetail":[{"ko":"통계의","explain":"숫자로 모은 자료의"},{"ko":"통계적인","explain":"수치를 따져 본"}],"usageExamples":[{"en":"The report includes a detailed statistical breakdown of the results.","ko":"그 보고서에는 결과에 대한 상세한 통계 분석이 포함되어 있다."},{"en":"There is no statistical evidence to support that bold claim.","ko":"그 대담한 주장을 뒷받침할 통계적 증거는 없다."}],"grammarNote":"statistical은 명사 statistics의 형용사형으로 'statistical analysis/data/evidence'처럼 명사를 수식한다. 부사형은 statistically이다.","grammarQuiz":[{"sentence":"The researchers used _____ methods to analyze the survey results.","ko":"연구자들은 설문 결과를 분석하기 위해 통계적 방법을 사용했다.","answer":"statistical","hint":"형용사 + 명사(methods) 수식"}]},
    {"id":"n07228","w":"maximize","pos":["verb"],"ph":"/ˈmæksɪmaɪz/","cefr":"B2","kr":["극대화하다","최대화하다"],"ex":[{"en":"The company reorganized its teams to maximize overall efficiency.","ko":"그 회사는 전반적인 효율성을 극대화하기 위해 팀을 재편성했다."}],"mnemonic":{"soundHint":"맥시마이즈","story":"maximum(최대)+ize → 최대화하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"optimize","ko":"최적화하다","reason":"동의어 — 가장 좋게"},{"w":"increase","ko":"늘리다","reason":"동의어 — 키움"},{"w":"minimize","ko":"최소화하다","reason":"반의어 — 정반대"}],"collocBest":[{"en":"maximize profit","ko":"이익을 극대화하다"},{"en":"maximize efficiency","ko":"효율성을 극대화하다"}]},"nuance":{"koSimple":"이익이나 효율을 최대한 크게 끌어올리다","whenToUse":"성과·이익을 극대화한다 말할 때 씀"},"krDetail":[{"ko":"극대화하다","explain":"가장 크게 만들다"},{"ko":"최대화하다","explain":"최대로 늘리다"}],"usageExamples":[{"en":"Farmers use modern methods to maximize their harvest each season.","ko":"농부들은 매 계절 수확량을 극대화하기 위해 현대적인 방법을 사용한다."},{"en":"To maximize profits, the store extended its opening hours.","ko":"이익을 극대화하기 위해 그 가게는 영업시간을 연장했다."}],"grammarNote":"maximize는 타동사로 목적어를 바로 취해 '~을 최대화하다'를 뜻한다. 반대말은 minimize이며, 영국식 철자는 maximise이다.","grammarQuiz":[{"sentence":"Companies try to _____ their profits by reducing unnecessary costs.","ko":"기업들은 불필요한 비용을 줄여 이윤을 극대화하려고 한다.","answer":"maximize","hint":"to부정사 내 동사원형"}]},
    {"id":"n07230","w":"optimal","pos":["adjective"],"ph":"/ˈɑːptɪməl/","cefr":"B2","kr":["최적의","가장 좋은"],"ex":[{"en":"Researchers determined the optimal temperature for storing the vaccine.","ko":"연구자들은 그 백신을 보관하기 위한 최적의 온도를 결정했다."}],"mnemonic":{"soundHint":"옵티멀","story":"opt(선택)+imal → 최적의","hintConfidence":3},"pairs":{"buddyWords":[{"w":"ideal","ko":"이상적인","reason":"동의어 — 더없이 좋음"},{"w":"best","ko":"최고의","reason":"동의어 — 제일 좋음"},{"w":"worst","ko":"최악의","reason":"반의어 — 제일 나쁨"}],"collocBest":[{"en":"optimal conditions","ko":"최적의 조건"},{"en":"optimal performance","ko":"최적의 성능"}]},"nuance":{"koSimple":"주어진 조건에서 가장 알맞고 최적인","whenToUse":"최적 상태·최선 조건을 말할 때 씀"},"krDetail":[{"ko":"최적의","explain":"가장 알맞은"},{"ko":"가장 좋은","explain":"제일 나은"}],"usageExamples":[{"en":"Plants grow best under optimal light and water conditions.","ko":"식물은 최적의 빛과 물 조건에서 가장 잘 자란다."},{"en":"The engineers searched for the optimal design for the new bridge.","ko":"기술자들은 새 다리에 가장 적합한 최적의 설계를 찾았다."}],"grammarNote":"optimal은 '최적의'를 뜻하는 형용사로 주로 명사 앞에서 쓰인다. 유의어 optimum도 형용사·명사로 쓰이며, 부사형은 optimally이다.","grammarQuiz":[{"sentence":"Getting enough sleep is essential for _____ brain performance.","ko":"충분한 수면은 최적의 뇌 성능을 위해 필수적이다.","answer":"optimal","hint":"전치사(for) 뒤 형용사 + 명사"}]},
    {"id":"n07233","w":"conductor","pos":["noun"],"ph":"/kənˈdʌktər/","cefr":"B2","kr":["지휘자","전도체"],"ex":[{"en":"The conductor raised his baton and the orchestra fell silent.","ko":"지휘자가 지휘봉을 들어 올리자 오케스트라가 조용해졌다."}],"mnemonic":{"soundHint":"컨덕터","story":"conduct(이끌다)+or → 지휘자/차장","hintConfidence":3},"pairs":{"buddyWords":[{"w":"director","ko":"지휘자, 감독","reason":"동의어 — 이끄는 이"},{"w":"insulator","ko":"절연체","reason":"반의어 — 전기 안 통함"},{"w":"maestro","ko":"거장 지휘자","reason":"동의어 — 명 지휘자"}],"collocBest":[{"en":"orchestra conductor","ko":"오케스트라 지휘자"},{"en":"electrical conductor","ko":"전기 전도체"}]},"nuance":{"koSimple":"오케스트라를 이끄는 지휘자 또는 도체","whenToUse":"지휘자·전기 전도체를 말할 때 씀"},"krDetail":[{"ko":"지휘자","explain":"연주를 이끄는 사람"},{"ko":"전도체","explain":"전기가 잘 통하는 것"}],"usageExamples":[{"en":"The famous conductor received a standing ovation after the performance.","ko":"그 유명한 지휘자는 공연이 끝난 뒤 기립 박수를 받았다."},{"en":"Copper is an excellent conductor of electricity and heat.","ko":"구리는 전기와 열을 잘 전달하는 훌륭한 전도체이다."}],"grammarNote":"conductor는 문맥에 따라 '(오케스트라) 지휘자', '(전기·열) 전도체', '(버스·기차) 차장' 등 여러 의미를 갖는 다의어다. 동사형 conduct는 '지휘하다·전도하다'를 뜻한다.","grammarQuiz":[{"sentence":"The orchestra _____ raised her baton and the music began.","ko":"오케스트라 지휘자가 지휘봉을 들자 음악이 시작되었다.","answer":"conductor","hint":"명사 + 명사 (orchestra ~)"}]},
    {"id":"n07235","w":"wavelengths","pos":["noun"],"ph":"/ˈweɪvˌlɛŋθs/","cefr":"B2","kr":["파장"],"ex":[{"en":"Different colors of light correspond to different wavelengths.","ko":"서로 다른 색의 빛은 서로 다른 파장에 해당한다."}],"mnemonic":{"soundHint":"웨이브렝쓰","story":"wave(파도)+length(길이) → 파장","hintConfidence":3},"pairs":{"buddyWords":[{"w":"frequency","ko":"주파수","reason":"관련어 — 진동 횟수"},{"w":"spectrum","ko":"스펙트럼","reason":"관련어 — 파장 범위"},{"w":"amplitude","ko":"진폭","reason":"관련어 — 파의 높이"}],"collocBest":[{"en":"light wavelengths","ko":"빛의 파장"},{"en":"different wavelengths","ko":"다양한 파장"}]},"nuance":{"koSimple":"파동의 마루 사이 거리인 파장들","whenToUse":"빛·소리·전자기파 특성을 말할 때 씀"},"krDetail":[{"ko":"파장","explain":"물결 한 마디 길이"}],"usageExamples":[{"en":"Radio signals travel at longer wavelengths than visible light.","ko":"라디오 신호는 가시광선보다 더 긴 파장으로 이동한다."},{"en":"Some animals can see wavelengths that humans simply cannot detect.","ko":"어떤 동물들은 인간이 도저히 감지할 수 없는 파장을 볼 수 있다."}],"grammarNote":"wavelengths는 wavelength의 복수형으로 복수 동사와 일치한다. 'on the same wavelength(생각이 잘 통하는)'라는 관용 표현으로도 쓰인다.","grammarQuiz":[{"sentence":"Different colors of light correspond to different _____.","ko":"빛의 서로 다른 색깔은 서로 다른 파장에 해당한다.","answer":"wavelengths","hint":"different + 복수 명사"}]},
    {"id":"n07245","w":"dramatically","pos":["adverb"],"ph":"/drəˈmætɪkli/","cefr":"B2","kr":["극적으로","급격히"],"ex":[{"en":"Sales increased dramatically after the new advertisement aired.","ko":"새 광고가 방영된 후 매출이 극적으로 증가했다."}],"mnemonic":{"soundHint":"드라마티컬리","story":"drama(극)+tic+ally → 극적으로","hintConfidence":3},"pairs":{"buddyWords":[{"w":"drastically","ko":"급격하게","reason":"동의어 — 확 바뀜"},{"w":"significantly","ko":"상당히","reason":"동의어 — 크게"},{"w":"gradually","ko":"점차적으로","reason":"반의어 — 천천히"}],"collocBest":[{"en":"increase dramatically","ko":"급격히 증가하다"},{"en":"change dramatically","ko":"극적으로 변하다"}]},"nuance":{"koSimple":"눈에 띌 만큼 극적으로 크게 변하는 방식","whenToUse":"급격한 변화·강한 인상 표현할 때 씀"},"krDetail":[{"ko":"극적으로","explain":"눈에 확 띄게"},{"ko":"급격히","explain":"갑자기 빠르게"}],"usageExamples":[{"en":"The city's population has grown dramatically over the last decade.","ko":"그 도시의 인구는 지난 10년 동안 극적으로 증가했다."},{"en":"Prices dropped dramatically during the end-of-year sale.","ko":"연말 세일 동안 가격이 급격히 떨어졌다."}],"grammarNote":"dramatically는 형용사 dramatic의 부사형으로 increase, rise, fall, change 같은 변화 동사를 강조해 '급격히'라는 뜻으로 자주 쓰인다.","grammarQuiz":[{"sentence":"The population of the city has increased _____ over the past decade.","ko":"그 도시의 인구는 지난 10년간 극적으로 증가했다.","answer":"dramatically","hint":"동사(increased) 수식 부사"}]},
    {"id":"n07249","w":"cues","pos":["noun"],"ph":"/kjuːz/","cefr":"B2","kr":["신호","단서"],"ex":[{"en":"Good speakers pick up on the social cues of their audience.","ko":"훌륭한 연사는 청중의 사회적 신호를 알아챈다."}],"mnemonic":{"soundHint":"큐즈","story":"cue(신호)+s → 신호들","hintConfidence":3},"pairs":{"buddyWords":[{"w":"hint","ko":"힌트, 암시","reason":"동의어 — 실마리"},{"w":"signal","ko":"신호","reason":"동의어 — 알림"},{"w":"prompt","ko":"자극, 신호","reason":"동의어 — 부추김"}],"collocBest":[{"en":"social cues","ko":"사회적 신호"},{"en":"visual cues","ko":"시각적 단서"}]},"nuance":{"koSimple":"행동이나 반응을 유도하는 신호·단서","whenToUse":"암시·신호를 감지한다 말할 때 씀"},"krDetail":[{"ko":"신호","explain":"알려주는 표시"},{"ko":"단서","explain":"실마리가 되는 것"}],"usageExamples":[{"en":"Actors wait for their cues before stepping onto the stage.","ko":"배우들은 무대에 오르기 전에 자신의 신호를 기다린다."},{"en":"Dogs respond to visual cues as well as spoken commands.","ko":"개들은 말로 하는 명령뿐 아니라 시각적 신호에도 반응한다."}],"grammarNote":"cues는 cue의 복수형이다. 'visual/social/nonverbal cues'처럼 형용사와 결합하며, 'take one's cue from ~(~에게서 힌트를 얻다)' 같은 표현으로도 쓰인다.","grammarQuiz":[{"sentence":"Babies rely on visual _____ from their parents to understand emotions.","ko":"아기들은 감정을 이해하기 위해 부모의 시각적 신호에 의존한다.","answer":"cues","hint":"형용사(visual) 뒤 복수 명사"}]},
    {"id":"n07250","w":"nonverbal","pos":["adjective"],"ph":"/nɑːnˈvɜːrbəl/","cefr":"B2","kr":["비언어적인"],"ex":[{"en":"Much of our communication relies on nonverbal signals like gestures.","ko":"우리 의사소통의 많은 부분은 몸짓 같은 비언어적 신호에 의존한다."}],"mnemonic":{"soundHint":"넌버벌","story":"non(비)+verbal(언어) → 비언어의","hintConfidence":3},"pairs":{"buddyWords":[{"w":"gestural","ko":"몸짓의","reason":"관련어 — 몸으로 표현"},{"w":"verbal","ko":"언어적인","reason":"반의어 — 정반대"},{"w":"silent","ko":"말없는","reason":"관련어 — 말 안 함"}],"collocBest":[{"en":"nonverbal communication","ko":"비언어적 의사소통"},{"en":"nonverbal cues","ko":"비언어적 신호"}]},"nuance":{"koSimple":"말이 아닌 몸짓·표정으로 전달되는","whenToUse":"제스처·표정 등 비언어 소통 말할 때 씀"},"krDetail":[{"ko":"비언어적인","explain":"말을 쓰지 않는"}],"usageExamples":[{"en":"A warm smile is a powerful form of nonverbal communication.","ko":"따뜻한 미소는 강력한 형태의 비언어적 의사소통이다."},{"en":"Nonverbal cues such as posture reveal how someone truly feels.","ko":"자세와 같은 비언어적 신호는 어떤 사람이 진짜로 어떻게 느끼는지를 드러낸다."}],"grammarNote":"nonverbal은 접두사 non-이 verbal(언어의)에 붙어 '비언어적인'을 뜻하는 형용사다. 주로 'nonverbal communication/cues/signals'처럼 명사를 수식한다.","grammarQuiz":[{"sentence":"Body language is one of the most powerful forms of _____ communication.","ko":"몸짓 언어는 가장 강력한 비언어적 의사소통 형태 중 하나이다.","answer":"nonverbal","hint":"형용사 + 명사(communication) 수식"}]},
    {"id":"n07269","w":"incompetence","pos":["noun"],"ph":"/ɪnˈkɑːmpɪtəns/","cefr":"B2","kr":["무능","무능력"],"ex":[{"en":"The manager was fired for repeated incompetence in handling clients.","ko":"그 관리자는 고객을 다루는 데 있어 반복된 무능으로 해고되었다."}],"mnemonic":{"soundHint":"인컴피턴스","story":"in(부정)+competence(능력) → 무능","hintConfidence":3},"pairs":{"buddyWords":[{"w":"inability","ko":"불능","reason":"동의어 — 못 함"},{"w":"competence","ko":"능력","reason":"반의어 — 정반대"},{"w":"ineptitude","ko":"서투름","reason":"동의어 — 솜씨 없음"}],"collocBest":[{"en":"professional incompetence","ko":"직무상의 무능"},{"en":"sheer incompetence","ko":"완전한 무능"}]},"nuance":{"koSimple":"맡은 일을 제대로 못하는 무능력함","whenToUse":"능력 부족·업무 실패를 지적할 때 씀"},"krDetail":[{"ko":"무능","explain":"할 능력이 없음"},{"ko":"무능력","explain":"제대로 못 해냄"}],"usageExamples":[{"en":"The project failed largely because of the leader's incompetence.","ko":"그 프로젝트는 주로 지도자의 무능 때문에 실패했다."},{"en":"Customers complained loudly about the incompetence of the support team.","ko":"고객들은 지원팀의 무능에 대해 강하게 불평했다."}],"grammarNote":"incompetence는 형용사 incompetent의 추상명사로 셀 수 없다. 접두사 in-이 competence(능력)에 붙은 형태로 반대말은 competence이다.","grammarQuiz":[{"sentence":"The manager was fired due to repeated _____ in handling client accounts.","ko":"그 관리자는 고객 계정 처리에서의 반복된 무능으로 해고되었다.","answer":"incompetence","hint":"형용사(repeated) 뒤 명사"}]},
    {"id":"n07278","w":"automatically","pos":["adverb"],"ph":"/ˌɔːtəˈmætɪkli/","cefr":"B2","kr":["자동으로","자동적으로"],"ex":[{"en":"The doors open automatically when someone approaches them.","ko":"누군가가 다가오면 그 문은 자동으로 열린다."}],"mnemonic":{"soundHint":"오토매티컬리","story":"auto(스스로)+matic+ally → 자동으로","hintConfidence":3},"pairs":{"buddyWords":[{"w":"mechanically","ko":"기계적으로","reason":"동의어 — 저절로"},{"w":"spontaneously","ko":"저절로","reason":"동의어 — 자연히"},{"w":"manually","ko":"수동으로","reason":"반의어 — 손으로"}],"collocBest":[{"en":"automatically generated","ko":"자동으로 생성된"},{"en":"happen automatically","ko":"자동으로 일어나다"}]},"nuance":{"koSimple":"사람 손 없이 저절로 일어나는 방식","whenToUse":"자동 처리·무의식적 반응 말할 때 씀"},"krDetail":[{"ko":"자동으로","explain":"저절로 스스로"},{"ko":"자동적으로","explain":"손 안 대고 저절로"}],"usageExamples":[{"en":"The lights turn off automatically when the room is empty.","ko":"그 방이 비면 불이 자동으로 꺼진다."},{"en":"Your subscription will renew automatically at the end of the month.","ko":"당신의 구독은 월말에 자동으로 갱신될 것이다."}],"grammarNote":"automatically는 형용사 automatic의 부사형이다. 보통 일반동사 뒤나 조동사와 본동사 사이에 와서 동작이 '자동으로' 일어남을 나타낸다.","grammarQuiz":[{"sentence":"The doors open _____ when someone approaches the sensor.","ko":"누군가 센서에 접근하면 문이 자동으로 열린다.","answer":"automatically","hint":"동사(open) 수식 부사"}]},
    {"id":"n07280","w":"specialized","pos":["adjective"],"ph":"/ˈspɛʃəlaɪzd/","cefr":"B2","kr":["전문화된","특수한"],"ex":[{"en":"Treating the disease requires highly specialized medical knowledge.","ko":"그 질병을 치료하려면 고도로 전문화된 의학 지식이 필요하다."}],"mnemonic":{"soundHint":"스페셜라이즈드","story":"special(특별)+ize+ed → 전문화된","hintConfidence":3},"pairs":{"buddyWords":[{"w":"expert","ko":"전문의","reason":"동의어 — 능숙함"},{"w":"focused","ko":"집중된","reason":"관련어 — 한 분야"},{"w":"general","ko":"일반적인","reason":"반의어 — 두루두루"}],"collocBest":[{"en":"specialized knowledge","ko":"전문 지식"},{"en":"highly specialized","ko":"고도로 전문화된"}]},"nuance":{"koSimple":"특정 분야에 맞게 특화되어 전문화된","whenToUse":"전문 장비·전문 기술을 말할 때 씀"},"krDetail":[{"ko":"전문화된","explain":"한 분야에 특화된"},{"ko":"특수한","explain":"보통과 다른 특별한"}],"usageExamples":[{"en":"Repairing this machine calls for specialized tools and proper training.","ko":"이 기계를 수리하려면 전문화된 도구와 제대로 된 훈련이 필요하다."},{"en":"She works in a highly specialized field of medicine.","ko":"그녀는 고도로 전문화된 의학 분야에서 일한다."}],"grammarNote":"specialized는 동사 specialize의 과거분사가 형용사로 굳어진 형태로 '전문화된'을 뜻한다. 동사는 'specialize in ~(~을 전문으로 하다)'처럼 전치사 in과 쓴다. 영국식은 specialised이다.","grammarQuiz":[{"sentence":"This hospital has _____ equipment for treating rare diseases.","ko":"이 병원은 희귀 질환을 치료하기 위한 전문화된 장비를 갖추고 있다.","answer":"specialized","hint":"형용사 + 명사(equipment) 수식"}]},
    {"id":"n07286","w":"agricultural","pos":["adjective"],"ph":"/ˌæɡrɪˈkʌltʃərəl/","cefr":"B2","kr":["농업의"],"ex":[{"en":"Modern agricultural techniques have greatly increased crop yields.","ko":"현대의 농업 기술은 작물 수확량을 크게 증가시켰다."}],"mnemonic":{"soundHint":"애그리컬쳐럴","story":"agri(밭)+culture(경작)+al → 농업의","hintConfidence":3},"pairs":{"buddyWords":[{"w":"farming","ko":"농사의","reason":"동의어 — 농사 관련"},{"w":"rural","ko":"시골의","reason":"관련어 — 농촌"},{"w":"industrial","ko":"공업의","reason":"반의어 — 공장 관련"}],"collocBest":[{"en":"agricultural land","ko":"농경지"},{"en":"agricultural production","ko":"농업 생산"}]},"nuance":{"koSimple":"농사·농업과 관련된 성격을 가진","whenToUse":"농업 산업·농경 활동 말할 때 씀"},"krDetail":[{"ko":"농업의","explain":"농사 짓는 일의"}],"usageExamples":[{"en":"Agricultural exports make up a large part of the country's economy.","ko":"농업 수출은 그 나라 경제의 큰 부분을 차지한다."},{"en":"The region is well known for its rich agricultural land.","ko":"그 지역은 비옥한 농경지로 잘 알려져 있다."}],"grammarNote":"agricultural은 명사 agriculture의 형용사형으로 명사 앞에서 'agricultural land/product/industry'처럼 쓴다.","grammarQuiz":[{"sentence":"The government invested heavily in _____ technology to increase food production.","ko":"정부는 식량 생산을 늘리기 위해 농업 기술에 많은 투자를 했다.","answer":"agricultural","hint":"형용사 + 명사(technology) 수식"}]},
    {"id":"n07294","w":"healthcare","pos":["noun"],"ph":"/ˈhɛlθˌkɛr/","cefr":"B2","kr":["의료","건강 관리"],"ex":[{"en":"The government promised to make healthcare more affordable for everyone.","ko":"정부는 모든 사람이 의료를 더 저렴하게 이용할 수 있도록 하겠다고 약속했다."}],"mnemonic":{"soundHint":"헬스케어","story":"health(건강)+care(돌봄) → 의료","hintConfidence":3},"pairs":{"buddyWords":[{"w":"medicine","ko":"의학, 의료","reason":"동의어 — 병 치료"},{"w":"wellness","ko":"건강, 웰빙","reason":"관련어 — 건강 유지"},{"w":"treatment","ko":"치료","reason":"관련어 — 병 다스림"}],"collocBest":[{"en":"healthcare system","ko":"의료 체계"},{"en":"healthcare provider","ko":"의료 제공자"}]},"nuance":{"koSimple":"건강을 지키고 돌보는 의료·보건 서비스","whenToUse":"의료 제도·건강 관리 이야기할 때 씀"},"krDetail":[{"ko":"의료","explain":"병을 고치는 일"},{"ko":"건강 관리","explain":"몸을 돌보고 챙김"}],"usageExamples":[{"en":"Access to quality healthcare should be a right, not a privilege.","ko":"양질의 의료에 대한 접근은 특권이 아니라 권리여야 한다."},{"en":"Many nurses and doctors work in the public healthcare system.","ko":"많은 간호사와 의사들이 공공 의료 체계에서 일한다."}],"grammarNote":"healthcare는 셀 수 없는 명사로 관사 없이 쓰는 경우가 많다. 'healthcare system/worker/cost'처럼 다른 명사 앞에서 수식어로도 자주 쓰이며, health care로 띄어 쓰기도 한다.","grammarQuiz":[{"sentence":"Access to affordable _____ is a basic right for all citizens.","ko":"저렴한 의료 서비스에 대한 접근은 모든 시민의 기본 권리이다.","answer":"healthcare","hint":"형용사(affordable) 뒤 명사"}]},
    {"id":"n07300","w":"contagion","pos":["noun"],"ph":"/kənˈteɪdʒən/","cefr":"B2","kr":["전염","감염"],"ex":[{"en":"Strict quarantine measures were introduced to limit the contagion.","ko":"전염을 제한하기 위해 엄격한 격리 조치가 도입되었다."}],"mnemonic":{"soundHint":"컨테이전","story":"con(함께)+tag(닿다)+ion → 전염","hintConfidence":3},"pairs":{"buddyWords":[{"w":"infection","ko":"감염","reason":"동의어 — 옮음"},{"w":"transmission","ko":"전파","reason":"동의어 — 퍼짐"},{"w":"immunity","ko":"면역","reason":"반의어 — 안 옮음"}],"collocBest":[{"en":"risk of contagion","ko":"전염 위험"},{"en":"spread of contagion","ko":"전염의 확산"}]},"nuance":{"koSimple":"질병이나 감정이 퍼지는 전염 현상","whenToUse":"전염병·감정 확산을 말할 때 씀"},"krDetail":[{"ko":"전염","explain":"병이 남에게 옮음"},{"ko":"감염","explain":"병균이 몸에 들어옴"}],"usageExamples":[{"en":"Doctors worked quickly to prevent the contagion from spreading further.","ko":"의사들은 그 전염이 더 퍼지는 것을 막기 위해 신속하게 움직였다."},{"en":"Fear can spread through a crowd like an emotional contagion.","ko":"두려움은 감정적 전염처럼 군중 사이로 퍼질 수 있다."}],"grammarNote":"contagion은 '(접촉에 의한) 전염'을 뜻하며 보통 셀 수 없이 쓰인다. 형용사형 contagious는 'a contagious disease(전염성 질병)'처럼 쓰인다.","grammarQuiz":[{"sentence":"Emotional _____ explains why laughter can spread quickly through a group.","ko":"감정 전염은 웃음이 집단을 통해 빠르게 퍼질 수 있는 이유를 설명한다.","answer":"contagion","hint":"형용사(Emotional) + 명사 주어"}]},
    {"id":"n07329","w":"unpredictable","pos":["adjective"],"ph":"/ˌʌnprɪˈdɪktəbəl/","cefr":"B2","kr":["예측 불가능한","예측할 수 없는"],"ex":[{"en":"The weather in the mountains can be dangerously unpredictable.","ko":"산속의 날씨는 위험할 정도로 예측 불가능할 수 있다."}],"mnemonic":{"soundHint":"언프리딕터블","story":"'un(부정)+predict(예측)+able' 예측 불가.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"uncertain","ko":"불확실한","reason":"동의어 — 알 수 없음"},{"w":"erratic","ko":"불규칙한","reason":"동의어 — 들쭉날쭉"},{"w":"predictable","ko":"예측 가능한","reason":"반의어 — 정반대"}],"collocBest":[{"en":"unpredictable behavior","ko":"예측할 수 없는 행동"},{"en":"highly unpredictable","ko":"매우 예측 불가능한"}]},"nuance":{"koSimple":"어떻게 흘러갈지 미리 알 수 없어 종잡을 수 없는 상태나 성질","whenToUse":"날씨, 사람의 행동 등이 종잡을 수 없을 때 자주 사용"},"krDetail":[{"ko":"예측 불가능한","explain":"미리 알 수 없는"},{"ko":"예측할 수 없는","explain":"짐작이 안 되는"}],"usageExamples":[{"en":"His moods are so unpredictable that no one knows what to expect.","ko":"그의 기분은 너무 예측 불가능해서 아무도 무엇을 기대해야 할지 모른다."},{"en":"The stock market can be extremely unpredictable during a crisis.","ko":"주식 시장은 위기 상황에서 극도로 예측 불가능해질 수 있다."}],"grammarNote":"unpredictable은 접두사 un-이 predictable에 붙은 형태로 '예측할 수 없는'을 뜻한다. 부사형은 unpredictably이다.","grammarQuiz":[{"sentence":"The weather in this region is highly _____, so always carry an umbrella.","ko":"이 지역의 날씨는 매우 예측 불가능하니, 항상 우산을 가지고 다녀라.","answer":"unpredictable","hint":"be동사 + 부사(highly) + 형용사"}]},
    {"id":"n07332","w":"profitability","pos":["noun"],"ph":"/ˌprɑːfɪtəˈbɪlɪti/","cefr":"B2","kr":["수익성"],"ex":[{"en":"Cutting production costs significantly improved the firm's profitability.","ko":"생산 비용을 절감한 것이 그 회사의 수익성을 크게 향상시켰다."}],"mnemonic":{"soundHint":"프라피터빌리티","story":"'profit(이익)+ability(능력)' 수익성.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"profit","ko":"이익","reason":"어근 — 이익 남음"},{"w":"revenue","ko":"수입","reason":"관련어 — 벌어들임"},{"w":"loss","ko":"손실","reason":"반의어 — 밑짐"}],"collocBest":[{"en":"improve profitability","ko":"수익성을 향상시키다"},{"en":"long-term profitability","ko":"장기적 수익성"}]},"nuance":{"koSimple":"사업이나 투자가 얼마나 이익을 낼 수 있는지를 나타내는 정도","whenToUse":"회사 성과 평가나 투자 판단에서 이익 규모를 논할 때 사용"},"krDetail":[{"ko":"수익성","explain":"이익을 낼 수 있는 정도"}],"usageExamples":[{"en":"The new strategy improved the company's profitability within a few months.","ko":"그 새 전략은 몇 달 만에 회사의 수익성을 개선했다."},{"en":"Investors carefully examined the store's long-term profitability.","ko":"투자자들은 그 매장의 장기적인 수익성을 면밀히 검토했다."}],"grammarNote":"profitability는 형용사 profitable에서 파생된 추상명사로 셀 수 없다. profit(이익), profitable(수익성 있는)과 구별해 '수익을 낼 수 있는 정도'를 뜻한다.","grammarQuiz":[{"sentence":"The company improved its _____ by cutting production costs.","ko":"그 회사는 생산 비용을 줄여 수익성을 개선했다.","answer":"profitability","hint":"소유격(its) 뒤 명사"}]},
    {"id":"n07348","w":"collaboration","pos":["noun"],"ph":"/kəˌlæbəˈreɪʃən/","cefr":"B2","kr":["협업","협력"],"ex":[{"en":"The project was completed through close collaboration between two universities.","ko":"그 프로젝트는 두 대학 간의 긴밀한 협업을 통해 완료되었다."}],"mnemonic":{"soundHint":"컬래버레이션","story":"'컬래버' 함께 일함, 협업.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"cooperation","ko":"협력","reason":"동의어 — 함께 함"},{"w":"teamwork","ko":"팀워크","reason":"동의어 — 힘 합침"},{"w":"competition","ko":"경쟁","reason":"반의어 — 겨룸"}],"collocBest":[{"en":"close collaboration","ko":"긴밀한 협업"},{"en":"in collaboration with","ko":"~와 협력하여"}]},"nuance":{"koSimple":"여러 사람이나 조직이 함께 힘을 모아 일해 내는 협력 작업","whenToUse":"공동 프로젝트나 팀 간 함께하는 작업 관계를 말할 때 사용"},"krDetail":[{"ko":"협업","explain":"함께 힘 모아 일함"},{"ko":"협력","explain":"서로 도와 일함"}],"usageExamples":[{"en":"The album was a collaboration between two well-known artists.","ko":"그 앨범은 잘 알려진 두 예술가 사이의 협업이었다."},{"en":"Close collaboration among departments made the launch a success.","ko":"부서들 간의 긴밀한 협력이 그 출시를 성공으로 이끌었다."}],"grammarNote":"collaboration은 'collaboration between/with/among ~' 형태로 전치사와 결합하며, 'in collaboration with ~(~와 협력하여)'라는 관용 표현으로 자주 쓰인다. 동사형은 collaborate이다.","grammarQuiz":[{"sentence":"The project was completed through close _____ between the two departments.","ko":"그 프로젝트는 두 부서 간의 긴밀한 협력을 통해 완성되었다.","answer":"collaboration","hint":"형용사(close) 뒤 명사"}]},
    {"id":"n07349","w":"superiority","pos":["noun"],"ph":"/suːˌpɪriˈɔːrɪti/","cefr":"B2","kr":["우월성","우위"],"ex":[{"en":"The team's superiority was obvious throughout the entire match.","ko":"그 팀의 우월성은 경기 내내 분명했다."}],"mnemonic":{"soundHint":"수피어리오리티","story":"'슈퍼(super)+ior' 우월성.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"dominance","ko":"우세","reason":"동의어 — 앞섬"},{"w":"advantage","ko":"이점, 우위","reason":"동의어 — 유리함"},{"w":"inferiority","ko":"열등함","reason":"반의어 — 정반대"}],"collocBest":[{"en":"sense of superiority","ko":"우월감"},{"en":"military superiority","ko":"군사적 우위"}]},"nuance":{"koSimple":"남이나 다른 것보다 더 뛰어나고 우월하다고 여기는 상태","whenToUse":"실력, 성능, 지위에서 우위를 강조할 때 자주 사용"},"krDetail":[{"ko":"우월성","explain":"남보다 나은 성질"},{"ko":"우위","explain":"더 나은 자리"}],"usageExamples":[{"en":"The general was confident of his army's superiority in numbers.","ko":"그 장군은 병력 수에서 자기 군대의 우위를 확신했다."},{"en":"She spoke with an air of superiority that annoyed her coworkers.","ko":"그녀는 동료들을 짜증 나게 하는 우월한 태도로 말했다."}],"grammarNote":"superiority는 형용사 superior의 명사형으로 'superiority over ~(~에 대한 우위)'처럼 전치사 over와 결합한다. 반대말은 inferiority이다.","grammarQuiz":[{"sentence":"A sense of _____ can prevent people from learning from their mistakes.","ko":"우월감은 사람들이 실수에서 배우는 것을 방해할 수 있다.","answer":"superiority","hint":"a sense of + 명사 구조"}]},
    {"id":"n07351","w":"appealing","pos":["adjective"],"ph":"/əˈpiːlɪŋ/","cefr":"B2","kr":["매력적인","호소력 있는"],"ex":[{"en":"The idea of working from home is appealing to many employees.","ko":"재택근무라는 아이디어는 많은 직원들에게 매력적이다."}],"mnemonic":{"soundHint":"어필링","story":"'어필(appeal)' 매력적인, 호소하는.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"attractive","ko":"매력적인","reason":"동의어 — 끌림"},{"w":"tempting","ko":"솔깃한","reason":"동의어 — 마음 끌림"},{"w":"repulsive","ko":"혐오스러운","reason":"반의어 — 밀어냄"}],"collocBest":[{"en":"visually appealing","ko":"시각적으로 매력적인"},{"en":"appealing option","ko":"매력적인 선택지"}]},"nuance":{"koSimple":"보거나 들었을 때 사람의 마음을 끌 만큼 매력적으로 느껴지는","whenToUse":"디자인, 아이디어, 제안이 끌린다고 말할 때 자주 사용"},"krDetail":[{"ko":"매력적인","explain":"마음을 끄는"},{"ko":"호소력 있는","explain":"마음에 와닿는"}],"usageExamples":[{"en":"The restaurant's menu looked appealing to the hungry travelers.","ko":"그 식당의 메뉴는 배고픈 여행자들에게 매력적으로 보였다."},{"en":"A shorter workweek is an appealing idea for most employees.","ko":"더 짧은 근무 주간은 대부분의 직원에게 매력적인 아이디어이다."}],"grammarNote":"appealing은 동사 appeal에서 온 형용사로 '매력적인'을 뜻한다. 'appealing to ~(~에게 매력적인)' 형태로 쓰며, 동사 'appeal to ~(~의 흥미를 끌다)'와 구별한다.","grammarQuiz":[{"sentence":"The idea of working from home is very _____ to many employees.","ko":"재택근무라는 아이디어는 많은 직원들에게 매우 매력적이다.","answer":"appealing","hint":"be동사 + 부사(very) + 형용사 + to"}]},
    {"id":"n07355","w":"trapped","pos":["adjective","verb"],"ph":"/træpt/","cefr":"B2","kr":["갇힌","꼼짝 못하는"],"ex":[{"en":"The miners were trapped underground for nearly three days.","ko":"그 광부들은 거의 3일 동안 지하에 갇혀 있었다."}],"mnemonic":{"soundHint":"트랩드","story":"'트랩(덫)+ed' 덫에 걸려 갇힌.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"stuck","ko":"꼼짝 못하는","reason":"동의어 — 못 벗어남"},{"w":"confined","ko":"갇힌","reason":"동의어 — 가둠"},{"w":"free","ko":"자유로운","reason":"반의어 — 풀려남"}],"collocBest":[{"en":"feel trapped","ko":"갇힌 기분이 들다"},{"en":"trapped inside","ko":"안에 갇힌"}]},"nuance":{"koSimple":"빠져나갈 길이 없이 어떤 상황이나 공간에 갇혀 버린 상태","whenToUse":"물리적 감금이나 관계·상황에 얽혀 못 벗어날 때 사용"},"krDetail":[{"ko":"갇힌","explain":"빠져나가지 못하는"},{"ko":"꼼짝 못하는","explain":"움직일 수 없는"}],"usageExamples":[{"en":"The cat was trapped on the roof and could not climb back down.","ko":"그 고양이는 지붕에 갇혀서 다시 내려올 수 없었다."},{"en":"She felt trapped in a job that made her deeply unhappy.","ko":"그녀는 자신을 몹시 불행하게 만드는 일에 갇힌 기분이었다."}],"grammarNote":"trapped는 동사 trap의 과거분사로, 'be trapped in/under/between ~' 형태의 수동태나 형용사로 '갇힌'을 뜻한다. 비유적으로 'feel trapped(꼼짝 못 하는 기분이 들다)'처럼도 쓰인다.","grammarQuiz":[{"sentence":"The miners were _____ underground for three days before being rescued.","ko":"광부들은 구조되기 전 3일 동안 지하에 갇혀 있었다.","answer":"trapped","hint":"be동사 + 과거분사 (수동태)"}]},
    {"id":"n07359","w":"accordingly","pos":["adverb"],"ph":"/əˈkɔːrdɪŋli/","cefr":"B2","kr":["그에 따라","따라서"],"ex":[{"en":"The market changed quickly, so the company adjusted its plans accordingly.","ko":"시장이 빠르게 변해서 그 회사는 그에 따라 계획을 조정했다."}],"mnemonic":{"soundHint":"어코딩리","story":"'어코드(accord)+ingly' 그에 따라서.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"therefore","ko":"그러므로","reason":"동의어 — 그래서"},{"w":"consequently","ko":"결과적으로","reason":"동의어 — 그 결과"},{"w":"regardless","ko":"상관없이","reason":"반의어 — 무관하게"}],"collocBest":[{"en":"act accordingly","ko":"그에 따라 행동하다"},{"en":"adjust accordingly","ko":"그에 맞게 조정하다"}]},"nuance":{"koSimple":"앞선 내용이나 상황에 맞추어 그에 어울리게 하는 방식으로","whenToUse":"원인이나 조건에 따라 대응해 행동함을 설명할 때 자주 사용"},"krDetail":[{"ko":"그에 따라","explain":"그것에 맞추어"},{"ko":"따라서","explain":"그런 까닭으로"}],"usageExamples":[{"en":"The rules have changed, and you should behave accordingly.","ko":"규칙이 바뀌었으니 너는 그에 따라 행동해야 한다."},{"en":"We received new information and revised our plan accordingly.","ko":"우리는 새로운 정보를 받고 그에 따라 계획을 수정했다."}],"grammarNote":"accordingly는 '그에 맞게' 또는 '따라서(=therefore)'라는 뜻의 접속부사로, 주로 문장 끝이나 앞에 온다. 'according to ~(~에 따르면)'와 형태가 비슷하니 혼동하지 않도록 한다.","grammarQuiz":[{"sentence":"The situation has changed, and we must adjust our plans _____.","ko":"상황이 바뀌었으므로, 우리는 그에 따라 계획을 조정해야 한다.","answer":"accordingly","hint":"문장 끝 부사 (결과·대응)"}]},
